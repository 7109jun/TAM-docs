f=\"#doc-ref-tmake--9-잠금-파일-tmakelock\">잠금 파일 <code>Tmake.lock</code></a></li>\n<li><a href=\"#doc-ref-tmake--10-증분-빌드와-캐시\">증분 빌드와 캐시</a></li>\n<li><a href=\"#doc-ref-tmake--11-명령어\">명령어</a></li>\n<li><a href=\"#doc-ref-tmake--12-빌드-폴더-구조\">빌드 폴더 구조</a></li>\n<li><a href=\"#doc-ref-tmake--13-오류-메시지-사전\">오류 메시지 사전</a></li>\n<li><a href=\"#doc-ref-tmake--14-설계-원칙과-한계\">설계 원칙과 한계</a></li>\n</ol>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"1-개요\" id=\"ref-tmake--1-개요\">1. 개요<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--1-개요\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"11-하는-일\" id=\"ref-tmake--11-하는-일\">1.1 하는 일<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--11-하는-일\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th>일</th>\n<th>어떻게</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>패키지 정의</td>\n<td><code>[package]</code> — 이름, 버전, 종류(<code>bin</code>/<code>lib</code>), 메타데이터</td>\n</tr>\n<tr>\n<td>의존성</td>\n<td><code>[dependencies]</code> — 경로 의존성과 버전 요구사항</td>\n</tr>\n<tr>\n<td>타겟·빌드 설정</td>\n<td><code>[build]</code>, <code>[target.&lt;대상&gt;]</code> — 대상, 출력 폴더, 진입 파일, 출력 이름</td>\n</tr>\n<tr>\n<td>최적화</td>\n<td><code>[profile.dev]</code>, <code>[profile.release]</code></td>\n</tr>\n<tr>\n<td>워크스페이스</td>\n<td><code>[workspace]</code> — 여러 패키지, 공통 메타데이터와 의존성 상속</td>\n</tr>\n<tr>\n<td>재현성</td>\n<td><code>Tmake.lock</code>(해결된 그래프 기록), <code>--locked</code></td>\n</tr>\n<tr>\n<td>속도</td>\n<td>입력 전체의 SHA-256 지문으로 안 바뀐 패키지는 건너뜀</td>\n</tr>\n</tbody>\n</table>\n<h3 class=\"doc-heading\" data-slug=\"12-매니페스트-찾기\" id=\"ref-tmake--12-매니페스트-찾기\">1.2 매니페스트 찾기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--12-매니페스트-찾기\">¶</a></h3>\n<p><code>tamc</code>는 현재 폴더에서 <strong>위로 올라가며</strong> 가장 가까운 <code>Tmake.toml</code>을 찾는다. <code>--manifest-path &lt;경로/Tmake.toml&gt;</code>로 직접 지정할 수 있다(파일 이름은 반드시 <code>Tmake.toml</code>). 찾지 못하면:</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">error: could not find `Tmake.toml` in `/home/me` or any parent folder\nnote: create a project with `tamc new &lt;name&gt;` or `tamc init`\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"13-파일-모드와의-관계\" id=\"ref-tmake--13-파일-모드와의-관계\">1.3 파일 모드와의 관계<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--13-파일-모드와의-관계\">¶</a></h3>\n<p><code>tamc build main.tam</code>처럼 <strong><code>.tam</code> 파일을 직접 주면 매니페스트를 쓰지 않는다</strong>(단일 파일 모드). 인자 없이 <code>tamc build</code>, <code>tamc run</code>, <code>tamc check</code>를 쓰거나 <code>Tmake.toml</code>/폴더를 주면 프로젝트 모드다.</p>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"2-빠른-시작\" id=\"ref-tmake--2-빠른-시작\">2. 빠른 시작<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--2-빠른-시작\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc new hello\n     Created binary `hello` in hello\n$ cd hello\n$ tamc run\n   Compiling hello v0.1.0 (.)\n    Finished dev [opt-level 0] host in 0.07s\n     Running /home/me/hello/build/host/dev/hello\nHello, TAM!\n</code></pre></div>\n<p><code>tamc new hello</code>가 만드는 것:</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>hello/\n├── Tmake.toml\n├── .gitignore        # /build\n└── src/\n    └── main.tam\n</code></pre></div>\n<p><code>Tmake.toml</code>:</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml\">[package]\nname = \"hello\"\nversion = \"0.1.0\"\ntamc = \"&gt;=1.0\"\n\n[dependencies]\n</code></pre></div>\n<p>라이브러리는 <code>tamc new util --lib</code>(<code>kind = \"lib\"</code>, <code>src/lib.tam</code>)다. 이미 있는 폴더에서는 <code>tamc init [이름]</code>을 쓴다.</p>\n<p>두 패키지를 잇는 첫 예:</p>\n<p>&lt;!-- project run exit=42 --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nutil = { path = \"../util\", version = \"^1.2\" }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use util\n\nfn main() i32 {\n    util::double(21)\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=UTIL/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=util/Tmake.toml\">[package]\nname = \"util\"\nversion = \"1.2.0\"\nkind = \"lib\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=UTIL/SRC/LIB.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=util/src/lib.tam\">pub fn double(x: i32) i32 { x * 2 }\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<p>(위 프로젝트에서 <code>tamc run</code>은 종료 코드 42로 끝난다.)</p>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"3-매니페스트-스키마\" id=\"ref-tmake--3-매니페스트-스키마\">3. 매니페스트 스키마<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--3-매니페스트-스키마\">¶</a></h2>\n<p>최상위에 올 수 있는 표는 <code>package</code>, <code>dependencies</code>, <code>build</code>, <code>profile</code>, <code>target</code>, <code>workspace</code> 여섯 개뿐이다. <strong>알 수 없는 키는 오류</strong>이며, 오타에는 <code>did you mean</code>을 알려 준다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"app\"\nversion = \"0.1.0\"\nbuidl = 1   # expect-error: unknown key `buidl` in [package]\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"31-package\" id=\"ref-tmake--31-package\">3.1 <code>[package]</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--31-package\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th>키</th>\n<th>타입</th>\n<th style=\"text-align:center\">필수</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>name</code></td>\n<td>문자열</td>\n<td style=\"text-align:center\">✔</td>\n<td>패키지 이름. 규칙은 아래</td>\n</tr>\n<tr>\n<td><code>version</code></td>\n<td>문자열</td>\n<td style=\"text-align:center\">✔</td>\n<td><code>MAJOR.MINOR.PATCH</code>(예: <code>\"0.1.0\"</code>). 워크스페이스에서 상속 가능</td>\n</tr>\n<tr>\n<td><code>kind</code></td>\n<td><code>\"bin\"</code> | <code>\"lib\"</code></td>\n<td style=\"text-align:center\"></td>\n<td>생략 시 <code>src/main.tam</code>이 있으면 <code>bin</code>, 없고 <code>src/lib.tam</code>이 있으면 <code>lib</code>. <code>entry</code>만 있으면 <code>bin</code></td>\n</tr>\n<tr>\n<td><code>entry</code></td>\n<td>경로</td>\n<td style=\"text-align:center\"></td>\n<td>진입 파일. 기본은 <code>bin</code> → <code>src/main.tam</code>, <code>lib</code> → <code>src/lib.tam</code></td>\n</tr>\n<tr>\n<td><code>description</code></td>\n<td>문자열</td>\n<td style=\"text-align:center\"></td>\n<td>설명. <code>tamc metadata</code>에 나온다</td>\n</tr>\n<tr>\n<td><code>authors</code></td>\n<td>문자열 배열</td>\n<td style=\"text-align:center\"></td>\n<td>저자 목록</td>\n</tr>\n<tr>\n<td><code>license</code></td>\n<td>문자열</td>\n<td style=\"text-align:center\"></td>\n<td>라이선스 식별자</td>\n</tr>\n<tr>\n<td><code>repository</code></td>\n<td>문자열</td>\n<td style=\"text-align:center\"></td>\n<td>저장소 URL</td>\n</tr>\n<tr>\n<td><code>tamc</code></td>\n<td>문자열</td>\n<td style=\"text-align:center\"></td>\n<td>필요한 컴파일러 버전 요구사항(예: <code>\"&gt;=1.0\"</code>). 안 맞으면 빌드가 거절된다</td>\n</tr>\n<tr>\n<td><code>edition</code></td>\n<td>문자열</td>\n<td style=\"text-align:center\"><code>\"1\"</code></td>\n<td>언어 에디션. 지금은 <code>\"1\"</code>만 된다. 다른 값은 <code>unsupported edition</code>으로 거절된다(<a href=\"#doc-ref-reference--18-호환성-약속-tam-1\">Reference 18장</a>)</td>\n</tr>\n</tbody>\n</table>\n<p><code>description</code>, <code>authors</code>, <code>license</code>, <code>repository</code>, <code>tamc</code>, <code>version</code>은 <code>{ workspace = true }</code>로 <a href=\"#doc-ref-tmake--63-상속\">워크스페이스에서 상속</a>할 수 있다.</p>\n<p><strong>패키지 이름 규칙</strong>: 소문자, 숫자, <code>_</code>, <code>-</code>만 쓰고 <strong>소문자로 시작</strong>하며 최대 64자다. <code>tam</code>은 표준 라이브러리용으로 <strong>예약</strong>되어 쓸 수 없다. 이름의 <code>-</code>는 <code>use</code>에서 <code>_</code>로 쓴다(<code>my-lib</code> → <code>use my_lib</code>).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"my-lib\"\nversion = \"0.1.0\"\nkind = \"lib\"\ndescription = \"문자열 도구\"\nauthors = [\"lulu &lt;lulu@example.com&gt;\"]\nlicense = \"MIT\"\nrepository = \"https://example.com/my-lib\"\ntamc = \"&gt;=1.0\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"App\"   # expect-error: invalid package name `App`\nversion = \"0.1.0\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"app\"\nversion = \"1.0\"   # expect-error: is not a valid version\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"app\"\nversion = \"0.1.0\"\ntamc = \"&gt;=99.0\"   # expect-error: needs tamc &gt;=99.0\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"32-dependencies\" id=\"ref-tmake--32-dependencies\">3.2 <code>[dependencies]</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--32-dependencies\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml\">[dependencies]\nutil = { path = \"../util\", version = \"^1.2\" }\ncore = { workspace = true }\n</code></pre></div>\n<p>각 항목은 <strong>키 = 이름, 값 = 표</strong>다. 허용되는 키는 <code>path</code>, <code>version</code>, <code>workspace</code>뿐이다. 자세한 규칙은 <a href=\"#doc-ref-tmake--5-의존성\">5장</a>.</p>\n<h3 class=\"doc-heading\" data-slug=\"33-build\" id=\"ref-tmake--33-build\">3.3 <code>[build]</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--33-build\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th>키</th>\n<th>타입</th>\n<th>기본</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>target</code></td>\n<td>문자열</td>\n<td><code>host</code>(Windows에서는 <code>windows</code>)</td>\n<td>기본 컴파일 대상. <code>host</code>, <code>windows</code>, <code>uefi</code>, <code>bios</code>, <code>aarch64</code></td>\n</tr>\n<tr>\n<td><code>out-dir</code></td>\n<td>경로</td>\n<td><code>build</code></td>\n<td>산출물 폴더. <strong>패키지(워크스페이스) 폴더 안</strong>이어야 하고 상대 경로여야 한다</td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[build]\ntarget = \"host\"\nout-dir = \"out\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[build]\nout-dir = \"../out\"   # expect-error: must stay inside the package\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[build]\ntarget = \"linux\"   # expect-error: unknown target `linux`\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"34-profiledev-profilerelease\" id=\"ref-tmake--34-profiledev-profilerelease\">3.4 <code>[profile.dev]</code>, <code>[profile.release]</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--34-profiledev-profilerelease\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th>키</th>\n<th>타입</th>\n<th>dev 기본</th>\n<th>release 기본</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>opt-level</code></td>\n<td>0, 1, 2</td>\n<td>0</td>\n<td>2</td>\n<td>0 = 최적화 없음, 1 = 레지스터 승격, 2 = 승격 + 백엔드 전체 최적화</td>\n</tr>\n</tbody>\n</table>\n<p><code>--release</code>를 주면 release 프로파일, 아니면 dev 프로파일이다. 다른 이름의 프로파일(<code>[profile.fast]</code>)은 없다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[profile.dev]\nopt-level = 1\n\n[profile.release]\nopt-level = 2\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"35-target\" id=\"ref-tmake--35-target\">3.5 <code>[target.&lt;대상&gt;]</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--35-target\">¶</a></h3>\n<p>대상별 설정이다. <code>&lt;대상&gt;</code>은 <code>host</code>, <code>windows</code>, <code>uefi</code>, <code>bios</code>, <code>aarch64</code> 중 하나다.</p>\n<table>\n<thead>\n<tr>\n<th>키</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>entry</code></td>\n<td>이 대상에서 쓸 <strong>진입 파일</strong>(패키지 폴더 안). <code>[package] entry</code>를 덮어쓴다</td>\n</tr>\n<tr>\n<td><code>out-name</code></td>\n<td>이 대상 산출물의 <strong>파일 이름</strong>(확장자 제외). 경로 구분자, 빈 문자열, <code>.</code>로 시작하는 이름은 불가</td>\n</tr>\n<tr>\n<td><code>dependencies</code></td>\n<td>이 대상에서만 추가되는 의존성(표 형식은 <code>[dependencies]</code>와 같다)</td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"kernel\"\nversion = \"0.1.0\"\n\n[target.uefi]\nentry = \"src/uefi_main.tam\"\nout-name = \"BOOTX64\"\n\n[target.windows]\nout-name = \"kernel-win\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[target.windows]\nout-name = \"a/b\"   # expect-error: `out-name` must be a plain file name\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"4-버전과-버전-요구사항\" id=\"ref-tmake--4-버전과-버전-요구사항\">4. 버전과 버전 요구사항<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--4-버전과-버전-요구사항\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"41-버전\" id=\"ref-tmake--41-버전\">4.1 버전<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--41-버전\">¶</a></h3>\n<p><code>MAJOR.MINOR.PATCH</code> 세 숫자(각각 0 이상의 정수, <strong>앞자리 0 금지</strong>: <code>01</code>은 불가). 빌드 메타데이터(<code>+b</code>)와 프리릴리스(<code>-alpha</code>)는 읽지만 비교에서 무시된다.</p>\n<h3 class=\"doc-heading\" data-slug=\"42-요구사항-문법\" id=\"ref-tmake--42-요구사항-문법\">4.2 요구사항 문법<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--42-요구사항-문법\">¶</a></h3>\n<p>쉼표로 여러 조건을 <strong>AND</strong>로 묶는다. 각 조건은 연산자 + 부분 버전이다.</p>\n<table>\n<thead>\n<tr>\n<th>표기</th>\n<th>의미</th>\n<th>예</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>^1.2.3</code>, <code>1.2.3</code> (연산자 없음)</td>\n<td>캐럿: 호환(왼쪽 첫 0이 아닌 자리를 고정)</td>\n<td><code>^1.2.3</code> = <code>&gt;=1.2.3, &lt;2.0.0</code></td>\n</tr>\n<tr>\n<td><code>^0.2.3</code></td>\n<td></td>\n<td><code>&gt;=0.2.3, &lt;0.3.0</code></td>\n</tr>\n<tr>\n<td><code>^0.0.3</code></td>\n<td></td>\n<td><code>=0.0.3</code></td>\n</tr>\n<tr>\n<td><code>~1.2.3</code></td>\n<td>틸드: 마이너까지 고정</td>\n<td><code>&gt;=1.2.3, &lt;1.3.0</code></td>\n</tr>\n<tr>\n<td><code>~1</code></td>\n<td></td>\n<td><code>&gt;=1.0.0, &lt;2.0.0</code></td>\n</tr>\n<tr>\n<td><code>1.2</code></td>\n<td><code>^1.2</code>와 같다</td>\n<td><code>&gt;=1.2.0, &lt;2.0.0</code></td>\n</tr>\n<tr>\n<td><code>=1.2.3</code></td>\n<td>정확히</td>\n<td></td>\n</tr>\n<tr>\n<td><code>&gt;</code> <code>&gt;=</code> <code>&lt;</code> <code>&lt;=</code></td>\n<td>비교</td>\n<td><code>&gt;=1.0, &lt;2</code></td>\n</tr>\n<tr>\n<td><code>*</code></td>\n<td>모든 버전</td>\n<td></td>\n</tr>\n<tr>\n<td><code>1.*</code>, <code>1.2.*</code></td>\n<td>와일드카드</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>부분 버전(<code>1.2</code>)에서 빠진 자리는 0으로 채워 비교한다. 와일드카드 <strong>뒤에 숫자</strong>(<code>1.x.y</code>)나 앞자리 0(<code>01.2</code>), 빈 요구사항(<code>^</code>)은 오류다.</p>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"5-의존성\" id=\"ref-tmake--5-의존성\">5. 의존성<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--5-의존성\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"51-경로-의존성\" id=\"ref-tmake--51-경로-의존성\">5.1 경로 의존성<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--51-경로-의존성\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml\">[dependencies]\nutil = { path = \"../util\" }\n</code></pre></div>\n<ul>\n<li><strong>키는 패키지 이름과 같아야 한다.</strong> <code>other = { path = \"../util\" }</code>는 <code>dependency </code>other<code>points at package</code>util``이다.</li>\n<li><code>path</code>는 패키지 폴더(안에 <code>Tmake.toml</code>)를 가리킨다. 패키지 폴더 <strong>밖</strong>(<code>..</code>)도 가능하다(<code>out-dir</code>과 달리).</li>\n<li><code>version</code>(선택)은 <a href=\"#doc-ref-tmake--42-요구사항-문법\">요구사항</a>이며 의존 패키지의 <code>version</code>이 맞지 않으면 거절된다.</li>\n<li><strong>레지스트리나 git 의존성은 아직 없다</strong>(<code>git = \"...\"</code>은 <code>unknown key</code>).</li>\n<li>의존 패키지는 <code>kind = \"lib\"</code>여야 한다(<code>bin</code>은 <code>is a </code>bin<code> and cannot be used as a dependency</code>).</li>\n<li>같은 이름의 서로 다른 패키지가 그래프에 둘 있으면 <code>two different packages are named ...</code>이다.</li>\n<li>순환은 <code>dependency cycle: app -&gt; x -&gt; y -&gt; x</code>처럼 경로를 보여 준다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"52-코드에서-쓰기\" id=\"ref-tmake--52-코드에서-쓰기\">5.2 코드에서 쓰기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--52-코드에서-쓰기\">¶</a></h3>\n<p>의존성 패키지의 이름이 <strong>모듈 이름</strong>이다(<code>-</code>는 <code>_</code>). 공개(<code>pub</code>) 항목을 <code>모듈::항목</code>으로 쓴다.</p>\n<p>&lt;!-- project run exit=44 --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\ntext-tools = { path = \"../text-tools\" }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use text_tools\n\nfn main() i32 {\n    text_tools::triple(14) + 2\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=TEXT-TOOLS/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=text-tools/Tmake.toml\">[package]\nname = \"text-tools\"\nversion = \"0.1.0\"\nkind = \"lib\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=TEXT-TOOLS/SRC/LIB.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=text-tools/src/lib.tam\">pub fn triple(x: i32) i32 { x * 3 }\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<h3 class=\"doc-heading\" data-slug=\"53-규칙\" id=\"ref-tmake--53-규칙\">5.3 규칙<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--53-규칙\">¶</a></h3>\n<ul>\n<li><strong>전이 의존성은 직접 쓸 수 없다.</strong> <code>app → a → b</code>일 때 <code>app</code>이 <code>use b</code>를 하려면 <code>app</code>의 <code>[dependencies]</code>에도 <code>b</code>를 선언해야 한다. 선언하지 않으면 <code>cannot find module </code>b``이다. (각 패키지는 자신이 선언한 것만 본다.)</li>\n<li>패키지 안에서 <code>use sub.mod</code>는 <strong>그 패키지의 <code>src/</code> 폴더</strong> 기준이다. 라이브러리도 <code>src/</code> 아래에 여러 파일을 둘 수 있다.</li>\n<li><strong>의존성 이름이 같은 이름의 지역 모듈보다 우선한다.</strong> <code>util</code> 의존성이 있으면 <code>src/util.tam</code>이 있어도 <code>use util</code>은 의존성을 가리킨다.</li>\n<li>가시성은 그대로다: 의존 패키지의 비공개 항목에 접근하면 선언 위치를 함께 보여 주는 오류가 난다.</li>\n<li>같은 패키지가 여러 경로로 이어져도(다이아몬드) <strong>한 번만</strong> 컴파일에 들어간다.</li>\n</ul>\n<p>&lt;!-- project run exit=7 --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\na = { path = \"../a\" }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use a\n\nfn main() i32 {\n    a::fa()\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/A.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/a.tam\">// 같은 이름의 지역 모듈이 있어도 의존성 `a`가 우선한다.\npub fn fa() i32 { 1000 }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=A/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=a/Tmake.toml\">[package]\nname = \"a\"\nversion = \"0.1.0\"\nkind = \"lib\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=A/SRC/LIB.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=a/src/lib.tam\">use util\n\npub fn fa() i32 { util::deep() }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=A/SRC/UTIL.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=a/src/util.tam\">pub fn deep() i32 { 7 }\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<p>&lt;!-- project fail=cannot find module `b` --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\na = { path = \"../a\" }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use a\nuse b\n\nfn main() i32 { a::fa() + b::fb() }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=A/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=a/Tmake.toml\">[package]\nname = \"a\"\nversion = \"0.1.0\"\nkind = \"lib\"\n\n[dependencies]\nb = { path = \"../b\" }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=A/SRC/LIB.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=a/src/lib.tam\">use b\n\npub fn fa() i32 { b::fb() + 1 }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=B/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=b/Tmake.toml\">[package]\nname = \"b\"\nversion = \"0.1.0\"\nkind = \"lib\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=B/SRC/LIB.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=b/src/lib.tam\">pub fn fb() i32 { 40 }\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<p>(위 마지막 프로젝트는 <code>app</code>이 <code>b</code>를 선언하지 않아 거절된다. 실제로 쓰려면 <code>app</code>의 <code>[dependencies]</code>에 <code>b</code>를 추가한다. 이 예의 <code>fail=</code>는 그것을 검증한다.)</p>\n<h3 class=\"doc-heading\" data-slug=\"54-대상별-의존성\" id=\"ref-tmake--54-대상별-의존성\">5.4 대상별 의존성<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--54-대상별-의존성\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\ncore = { path = \"../core\" }\n\n[target.windows.dependencies]\nwinapi = { path = \"../winapi\" }\n</code></pre></div>\n<p><code>[target.&lt;t&gt;.dependencies]</code>의 항목은 그 대상을 빌드할 때만 그래프에 들어간다. 같은 이름을 두 표에 쓰면 <code>dependency ... is listed twice</code>다. <strong><code>Tmake.lock</code>에는 모든 대상의 의존성이 합쳐져</strong> 기록된다(<a href=\"#doc-ref-tmake--9-잠금-파일-tmakelock\">9장</a>).</p>\n<h3 class=\"doc-heading\" data-slug=\"55-잘못된-의존성-선언\" id=\"ref-tmake--55-잘못된-의존성-선언\">5.5 잘못된 의존성 선언<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--55-잘못된-의존성-선언\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nutil = \"../util\"   # expect-error: dependency `util` must be a table\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nutil = { version = \"1\" }   # expect-error: dependency `util` needs a `path`\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nutil = { path = \"../u\", git = \"x\" }   # expect-error: unknown key `git`\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"6-워크스페이스\" id=\"ref-tmake--6-워크스페이스\">6. 워크스페이스<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--6-워크스페이스\">¶</a></h2>\n<p>여러 패키지를 하나의 <strong>워크스페이스</strong>로 묶으면 같은 잠금 파일, 같은 빌드 폴더, 공통 메타데이터와 의존성을 공유한다.</p>\n<h3 class=\"doc-heading\" data-slug=\"61-선언\" id=\"ref-tmake--61-선언\">6.1 선언<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--61-선언\">¶</a></h3>\n<p>워크스페이스 <strong>루트</strong>의 <code>Tmake.toml</code>에 <code>[workspace]</code>를 둔다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml\">[workspace]\nmembers = [\"app\", \"libs/*\"]        # 멤버 폴더(끝에 /* 글롭 하나 허용)\nexclude = [\"libs/experimental\"]    # 제외할 폴더\ndefault-members = [\"app\"]          # 인자 없이 build/check할 때의 기본 대상\n</code></pre></div>\n<table>\n<thead>\n<tr>\n<th>키</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>members</code></td>\n<td>멤버 패키지 폴더 목록. <code>\"libs/*\"</code>는 <code>libs/</code> 아래 <code>Tmake.toml</code>이 있는 <strong>모든 하위 폴더</strong>(이름순). 그 밖의 <code>*</code>는 불가</td>\n</tr>\n<tr>\n<td><code>exclude</code></td>\n<td><code>members</code>에서 뺄 폴더</td>\n</tr>\n<tr>\n<td><code>default-members</code></td>\n<td>기본 대상. 반드시 <code>members</code>에 있는 폴더여야 한다. 없으면 모든 멤버</td>\n</tr>\n<tr>\n<td><code>package</code></td>\n<td>공통 메타데이터(<code>[workspace.package]</code>)</td>\n</tr>\n<tr>\n<td><code>dependencies</code></td>\n<td>공통 의존성(<code>[workspace.dependencies]</code>)</td>\n</tr>\n</tbody>\n</table>\n<p>루트는 <strong><code>[package]</code>도 함께</strong> 가질 수 있다(루트 패키지). 멤버도 루트 패키지도 없으면 <code>the workspace has no members</code>다. 각 멤버 폴더에는 <code>Tmake.toml</code>이 있어야 한다.</p>\n<h3 class=\"doc-heading\" data-slug=\"62-어떤-패키지가-빌드되나\" id=\"ref-tmake--62-어떤-패키지가-빌드되나\">6.2 어떤 패키지가 빌드되나<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--62-어떤-패키지가-빌드되나\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th>상황</th>\n<th>빌드되는 것</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>멤버 폴더 안에서 인자 없이</td>\n<td><strong>그 패키지</strong></td>\n</tr>\n<tr>\n<td>워크스페이스 루트에서 인자 없이</td>\n<td><code>default-members</code></td>\n</tr>\n<tr>\n<td><code>-p &lt;이름&gt;</code></td>\n<td>이름이 같은 멤버(루트 패키지 포함)</td>\n</tr>\n<tr>\n<td><code>--workspace</code></td>\n<td>모든 멤버(와 루트 패키지)</td>\n</tr>\n</tbody>\n</table>\n<p><code>run</code>은 <strong>정확히 하나의 <code>bin</code> 패키지</strong>가 선택되어야 한다(아니면 <code>-p</code>로 지정하라는 오류).</p>\n<h3 class=\"doc-heading\" data-slug=\"63-상속\" id=\"ref-tmake--63-상속\">6.3 상속<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--63-상속\">¶</a></h3>\n<p><code>[workspace.package]</code>에 둔 값을 멤버가 <code>{ workspace = true }</code>로 가져온다. 상속 가능한 키: <code>version</code>, <code>authors</code>, <code>description</code>, <code>license</code>, <code>repository</code>, <code>tamc</code>.</p>\n<p><code>[workspace.dependencies]</code>에 선언한 의존성은 멤버가 <code>{ workspace = true }</code>로 가져온다. 경로는 <strong>워크스페이스 루트 기준</strong>으로 해석된다.</p>\n<p>&lt;!-- project run exit=42 --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=Tmake.toml\">[workspace]\nmembers = [\"app\", \"libs/*\"]\ndefault-members = [\"app\"]\n\n[workspace.package]\nversion = \"0.3.0\"\nauthors = [\"team\"]\nlicense = \"MIT\"\n\n[workspace.dependencies]\ncore = { path = \"libs/core\", version = \"^0.3\" }\n\n[profile.release]\nopt-level = 2\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = { workspace = true }\nlicense = { workspace = true }\ndescription = \"워크스페이스 예제\"\n\n[dependencies]\ncore = { workspace = true }\nfmt = { path = \"../libs/fmt\" }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use core\nuse fmt\n\nfn main() i32 {\n    fmt::twice(core::base())\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=LIBS/CORE/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=libs/core/Tmake.toml\">[package]\nname = \"core\"\nversion = { workspace = true }\nkind = \"lib\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=LIBS/CORE/SRC/LIB.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=libs/core/src/lib.tam\">pub fn base() i32 { 21 }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=LIBS/FMT/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=libs/fmt/Tmake.toml\">[package]\nname = \"fmt\"\nversion = { workspace = true }\nkind = \"lib\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=LIBS/FMT/SRC/LIB.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=libs/fmt/src/lib.tam\">pub fn twice(x: i32) i32 { x * 2 }\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc tree\napp v0.3.0\n    core v0.3.0\n    fmt v0.3.0\n</code></pre></div>\n<ul>\n<li>워크스페이스 밖에서 <code>{ workspace = true }</code>를 쓰면 <code> `version.workspace = true` but there is no workspace</code>이고, 워크스페이스에 그 값이 없으면 <code>the workspace has no </code>version<code> to inherit</code>이다.</li>\n<li><strong>프로파일, 빌드 폴더, 잠금 파일은 워크스페이스 루트의 것</strong>이 쓰인다(멤버 매니페스트의 <code>[profile]</code>은 무시된다).</li>\n<li><code>[workspace.dependencies]</code>에 없는 이름을 <code>{ workspace = true }</code>로 쓰면 <code>dependency </code>x<code>is not in</code>[workspace.dependencies]``이다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"64-워크스페이스-오류\" id=\"ref-tmake--64-워크스페이스-오류\">6.4 워크스페이스 오류<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--64-워크스페이스-오류\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[workspace]\nmembers = [\"nope\"]   # expect-error: workspace member `nope` has no Tmake.toml\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[workspace]\nmembers = [\"a*b\"]   # expect-error: only a trailing `/*` glob is supported in `members`\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"7-대상과-크로스-빌드\" id=\"ref-tmake--7-대상과-크로스-빌드\">7. 대상과 크로스 빌드<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--7-대상과-크로스-빌드\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"71-대상-고르기\" id=\"ref-tmake--71-대상-고르기\">7.1 대상 고르기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--71-대상-고르기\">¶</a></h3>\n<p>우선순위: <strong><code>--target</code> 옵션 &gt; <code>[build] target</code> &gt; 기본값</strong>(Windows에서는 <code>windows</code>, 그 밖에는 <code>host</code>).</p>\n<table>\n<thead>\n<tr>\n<th>대상</th>\n<th>산출물</th>\n<th>필요한 도구</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>host</code></td>\n<td>확장자 없는 실행 파일</td>\n<td>시스템 <code>clang</code></td>\n</tr>\n<tr>\n<td><code>windows</code></td>\n<td><code>.exe</code></td>\n<td><code>llc</code>(또는 <code>clang</code>), <code>lld-link</code>(tamc와 같은 폴더 또는 PATH)</td>\n</tr>\n<tr>\n<td><code>uefi</code></td>\n<td><code>.efi</code></td>\n<td><code>llc</code>(또는 <code>clang</code>), <code>lld-link</code></td>\n</tr>\n<tr>\n<td><code>bios</code></td>\n<td><code>.img</code></td>\n<td><code>llc</code>(또는 <code>clang</code>), <code>lld-link</code></td>\n</tr>\n<tr>\n<td><code>aarch64</code></td>\n<td><code>.bin</code></td>\n<td><code>llc</code>(또는 <code>clang</code>), <code>lld-link</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>check</code>는 도구가 없어도 모든 대상에서 동작한다(타입, 소유권, 빌림만 검사한다). <code>run</code>은 <code>host</code>(또는 Windows 호스트에서 <code>windows</code>)만 지원한다. 펌웨어 대상은 <code>build</code>로 만들어 QEMU 등으로 부팅한다.</p>\n<h3 class=\"doc-heading\" data-slug=\"72-대상별-진입-파일과-이름\" id=\"ref-tmake--72-대상별-진입-파일과-이름\">7.2 대상별 진입 파일과 이름<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--72-대상별-진입-파일과-이름\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package]\nname = \"kernel\"\nversion = \"0.1.0\"\n\n[target.uefi]\nentry = \"src/uefi_main.tam\"\nout-name = \"BOOTX64\"\n</code></pre></div>\n<p><code>uefi</code> 대상으로 빌드하면 <code>src/uefi_main.tam</code>이 루트(진입 모듈)가 되고 산출물은 <code>build/uefi/&lt;프로파일&gt;/BOOTX64.efi</code>다. <code>entry</code>는 <strong>루트 패키지에만</strong> 적용된다(의존성 패키지의 <code>[target.*] entry</code>는 무시한다).</p>\n<h3 class=\"doc-heading\" data-slug=\"73-검사만\" id=\"ref-tmake--73-검사만\">7.3 검사만<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--73-검사만\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc check --target windows\n$ tamc check --target uefi\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"8-프로파일\" id=\"ref-tmake--8-프로파일\">8. 프로파일<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--8-프로파일\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>프로파일</th>\n<th>선택</th>\n<th><code>opt-level</code> 기본</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>dev</td>\n<td>기본</td>\n<td>0</td>\n</tr>\n<tr>\n<td>release</td>\n<td><code>--release</code></td>\n<td>2</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><code>opt-level = 0</code>: IR을 그대로 <code>llc</code>/<code>clang</code>에 넘긴다(<code>-O0</code>).</li>\n<li><code>opt-level = 1</code>: tamc가 <strong>스택 변수를 SSA 레지스터로 승격</strong>(<code>mem2reg</code>)한다.</li>\n<li><code>opt-level = 2</code>: 승격 + 백엔드 <code>-O2</code>.</li>\n<li>환경 변수 <code>TAMC_NO_OPT=1</code>은 승격을 끈다(디버깅용).</li>\n<li>오버플로 검사, 경계 검사 같은 <strong>언어의 안전 검사는 프로파일로 끌 수 없다</strong>(릴리스에서도 같다).</li>\n</ul>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"9-잠금-파일-tmakelock\" id=\"ref-tmake--9-잠금-파일-tmakelock\">9. 잠금 파일 <code>Tmake.lock</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--9-잠금-파일-tmakelock\">¶</a></h2>\n<p><code>tamc build/run/check</code>가 <strong>자동으로 만들고 갱신</strong>한다. 워크스페이스 루트(워크스페이스가 아니면 패키지 폴더)에 놓이며 버전 관리에 <strong>커밋</strong>한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml\"># This file is generated by tamc. Do not edit it by hand.\nversion = 1\n\n[[package]]\nname = \"app\"\nversion = \"0.3.0\"\npath = \"app\"\ndependencies = [\"core\", \"fmt\"]\n\n[[package]]\nname = \"core\"\nversion = \"0.3.0\"\npath = \"libs/core\"\n\n[[package]]\nname = \"fmt\"\nversion = \"0.3.0\"\npath = \"libs/fmt\"\n</code></pre></div>\n<ul>\n<li>패키지는 <strong>이름순</strong>, 경로는 루트 기준 <code>/</code> 구분 상대 경로라서, 같은 입력이면 <strong>항상 같은 바이트</strong>다(머신, 대상, OS와 무관).</li>\n<li><strong>모든 대상의 의존성을 합쳐서</strong> 기록하므로, 어떤 대상으로 빌드해도 같은 파일이 된다.</li>\n<li><code>--locked</code>: 잠금 파일이 없거나 갱신이 필요하면 <strong>오류로 끝낸다</strong>(CI 권장).</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc build --locked\nerror: `Tmake.lock` needs to be updated but `--locked` was given\nnote: run `tamc build` without `--locked` and commit the result\n</code></pre></div>\n<ul>\n<li>의존성이 경로(path)뿐이므로 잠금 파일은 <strong>그래프의 스냅샷</strong>이며 \"버전 재해결\"은 없다. 레지스트리가 생기면 여기에 체크섬이 더해진다.</li>\n</ul>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"10-증분-빌드와-캐시\" id=\"ref-tmake--10-증분-빌드와-캐시\">10. 증분 빌드와 캐시<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--10-증분-빌드와-캐시\">¶</a></h2>\n<p>빌드는 패키지마다 <strong>지문(SHA-256)</strong>을 계산한다. 지문의 입력은 다음 전부다.</p>\n<ol>\n<li>컴파일러 버전, 대상, <code>opt-level</code>, 패키지 종류</li>\n<li>읽은 <strong>모든 <code>Tmake.toml</code></strong>(내용)</li>\n<li>읽은 <strong>모든 소스 파일</strong>(경로와 내용, 내장 표준 라이브러리 제외)</li>\n</ol>\n<p>지문이 <code>build/&lt;대상&gt;/&lt;프로파일&gt;/.fingerprint/</code>에 저장된 값과 같고 산출물이 있으면 컴파일을 건너뛰고 <code>Fresh</code>를 출력한다. 소스 한 글자만 바뀌어도(의존성 포함) 다시 컴파일한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc build\n   Compiling app v0.3.0 (app)\n    Finished dev [opt-level 0] host in 0.06s\n$ tamc build\n       Fresh app v0.3.0 (app)\n</code></pre></div>\n<ul>\n<li>상태 메시지는 <strong>stderr</strong>로 나간다. <code>-q</code>/<code>--quiet</code>로 끈다.</li>\n<li><code>tamc clean</code>은 빌드 폴더를 지운다.</li>\n<li>라이브러리 패키지는 <strong>검사만</strong>(<code>Checking</code>) 하며 지문도 따로(<code>.chk</code>) 저장한다.</li>\n<li>컴파일 단위는 <strong>프로그램 전체</strong>다(패키지별 목적 파일이 아니다). 의존성이 바뀌면 그것을 쓰는 모든 패키지가 다시 컴파일된다.</li>\n</ul>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"11-명령어\" id=\"ref-tmake--11-명령어\">11. 명령어<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--11-명령어\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>tamc &lt;명령&gt; [옵션]            프로젝트 모드(가장 가까운 Tmake.toml 사용)\ntamc &lt;명령&gt; &lt;파일.tam&gt; ...    파일 모드(Tmake.toml을 쓰지 않음)\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"111-프로젝트-명령\" id=\"ref-tmake--111-프로젝트-명령\">11.1 프로젝트 명령<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--111-프로젝트-명령\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th>명령</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>new &lt;이름&gt; [--lib]</code></td>\n<td><code>./&lt;이름&gt;/</code>에 새 패키지를 만든다. 이미 있으면 오류</td>\n</tr>\n<tr>\n<td><code>init [이름] [--lib]</code></td>\n<td><strong>현재 폴더</strong>에 <code>Tmake.toml</code>과 <code>src/</code>를 만든다. 이름을 생략하면 폴더 이름(소문자, 공백/점은 <code>-</code>)을 쓴다</td>\n</tr>\n<tr>\n<td><code>build</code></td>\n<td>컴파일해 실행 파일(또는 이미지)을 만든다. 라이브러리는 검사만 한다</td>\n</tr>\n<tr>\n<td><code>run</code></td>\n<td>빌드하고 실행한다. 프로그램의 종료 코드로 <code>tamc</code>도 끝난다</td>\n</tr>\n<tr>\n<td><code>check</code></td>\n<td>구문, 타입, 소유권, 빌림만 검사한다(링크하지 않는다)</td>\n</tr>\n<tr>\n<td><code>clean</code></td>\n<td>빌드 폴더를 지운다</td>\n</tr>\n<tr>\n<td><code>tree</code></td>\n<td>의존성 트리를 출력한다</td>\n</tr>\n<tr>\n<td><code>metadata</code></td>\n<td>해결된 프로젝트를 <strong>JSON 한 줄</strong>로 출력한다(도구 연동용)</td>\n</tr>\n<tr>\n<td><code>--version</code></td>\n<td>컴파일러 버전을 출력한다</td>\n</tr>\n</tbody>\n</table>\n<h3 class=\"doc-heading\" data-slug=\"112-옵션\" id=\"ref-tmake--112-옵션\">11.2 옵션<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--112-옵션\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th>옵션</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>--release</code></td>\n<td>release 프로파일</td>\n</tr>\n<tr>\n<td><code>--target &lt;t&gt;</code></td>\n<td>대상을 정한다(<code>host</code>, <code>windows</code>, <code>uefi</code>, <code>bios</code>, <code>aarch64</code>)</td>\n</tr>\n<tr>\n<td><code>-p &lt;이름&gt;</code>, <code>--package &lt;이름&gt;</code></td>\n<td>패키지를 고른다</td>\n</tr>\n<tr>\n<td><code>--workspace</code>, <code>--all</code></td>\n<td>모든 워크스페이스 멤버</td>\n</tr>\n<tr>\n<td><code>--locked</code></td>\n<td>잠금 파일이 바뀌면 오류</td>\n</tr>\n<tr>\n<td><code>-q</code>, <code>--quiet</code></td>\n<td>상태 메시지를 끈다</td>\n</tr>\n<tr>\n<td><code>--manifest-path &lt;경로&gt;</code></td>\n<td>사용할 <code>Tmake.toml</code></td>\n</tr>\n<tr>\n<td><code>--lib</code></td>\n<td><code>new</code>/<code>init</code>에서 라이브러리로</td>\n</tr>\n<tr>\n<td><code>-- &lt;인자...&gt;</code></td>\n<td><code>run</code>에서 프로그램에 넘길 인자(<code>tam.os</code>는 아직 읽지 못한다)</td>\n</tr>\n</tbody>\n</table>\n<p>종료 코드: 성공 0, 컴파일/매니페스트 오류 1, 사용법 오류 2, <code>run</code>은 프로그램의 종료 코드(신호로 죽으면 128 + 신호 번호).</p>\n<h3 class=\"doc-heading\" data-slug=\"113-상태-메시지\" id=\"ref-tmake--113-상태-메시지\">11.3 상태 메시지<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--113-상태-메시지\">¶</a></h3>\n<p>stderr에 오른쪽 정렬된 태그로 나온다.</p>\n<table>\n<thead>\n<tr>\n<th>태그</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>Locking</code></td>\n<td>잠금 파일을 만들었거나 갱신했다</td>\n</tr>\n<tr>\n<td><code>Compiling</code></td>\n<td>컴파일하고 링크한다</td>\n</tr>\n<tr>\n<td><code>Checking</code></td>\n<td>검사한다(<code>check</code>, 라이브러리)</td>\n</tr>\n<tr>\n<td><code>Fresh</code></td>\n<td>지문이 같아 건너뛰었다</td>\n</tr>\n<tr>\n<td><code>Finished</code></td>\n<td>끝(프로파일, 최적화 수준, 대상, 걸린 시간)</td>\n</tr>\n<tr>\n<td><code>Running</code></td>\n<td><code>run</code>이 실행 파일을 시작한다</td>\n</tr>\n<tr>\n<td><code>Created</code></td>\n<td><code>new</code>/<code>init</code>이 프로젝트를 만들었다</td>\n</tr>\n<tr>\n<td><code>Removed</code></td>\n<td><code>clean</code>이 폴더를 지웠다</td>\n</tr>\n</tbody>\n</table>\n<h3 class=\"doc-heading\" data-slug=\"114-metadata의-출력\" id=\"ref-tmake--114-metadata의-출력\">11.4 <code>metadata</code>의 출력<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--114-metadata의-출력\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">JSON<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-json\">{\"tamc\":\"1.0.0\",\"workspace_root\":\"/p\",\"build_dir\":\"/p/build\",\"packages\":[\n  {\"name\":\"app\",\"version\":\"0.3.0\",\"kind\":\"bin\",\"manifest_path\":\"/p/app/Tmake.toml\",\n   \"entry\":\"/p/app/src/main.tam\",\"description\":null,\"dependencies\":[\"core\",\"fmt\"],\n   \"workspace_member\":true}]}\n</code></pre></div>\n<p>(실제 출력은 한 줄이다.) <code>workspace_member</code>는 이 패키지가 워크스페이스의 멤버(또는 선택한 루트)인지다. 문자열은 JSON 규칙으로 이스케이프된다.</p>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"12-빌드-폴더-구조\" id=\"ref-tmake--12-빌드-폴더-구조\">12. 빌드 폴더 구조<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--12-빌드-폴더-구조\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>build/\n└── &lt;대상&gt;/\n    └── &lt;프로파일&gt;/\n        ├── &lt;출력 이름&gt;[.exe|.efi|.img|.bin]\n        └── .fingerprint/\n            ├── &lt;패키지&gt;.bin      # 빌드 지문\n            └── &lt;패키지&gt;.chk      # 검사 지문\n</code></pre></div>\n<ul>\n<li>출력 이름은 <code>[target.&lt;t&gt;] out-name</code>, 없으면 패키지 이름이다.</li>\n<li>빌드 폴더의 위치는 <code>[build] out-dir</code>(기본 <code>build</code>)이며 워크스페이스에서는 루트 기준이다.</li>\n<li><code>tamc new</code>가 만드는 <code>.gitignore</code>는 <code>/build</code>를 제외한다.</li>\n</ul>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"13-오류-메시지-사전\" id=\"ref-tmake--13-오류-메시지-사전\">13. 오류 메시지 사전<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--13-오류-메시지-사전\">¶</a></h2>\n<p>모든 매니페스트 오류는 <code>Tmake.toml</code>의 <strong>파일, 줄, 칸</strong>을 가리키며 해결 힌트를 붙인다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">error: unknown key `buidl` in [package]\n --&gt; /home/me/app/Tmake.toml:4:1\n  |\n4 | buidl = 1\n  | ^^^^^ did you mean `build`?\n</code></pre></div>\n<table>\n<thead>\n<tr>\n<th>메시지</th>\n<th>원인과 해결</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>invalid TOML: ...</code></td>\n<td>TOML 문법 오류(줄 위치 표시). 같은 키를 두 번 쓴 경우도 여기에 해당</td>\n</tr>\n<tr>\n<td><code>unknown key </code>k<code> in &lt;표&gt;</code></td>\n<td>허용되지 않는 키. 비슷한 키가 있으면 <code>did you mean</code></td>\n</tr>\n<tr>\n<td><code>`[package]` needs a `name`</code> / <code>... `version`</code></td>\n<td>필수 키 누락</td>\n</tr>\n<tr>\n<td><code>invalid package name</code></td>\n<td>소문자/숫자/<code>_</code>/<code>-</code>, 소문자로 시작, 64자 이하</td>\n</tr>\n<tr>\n<td><code>`tam` is reserved for the standard library</code></td>\n<td><code>tam</code>은 쓸 수 없는 이름</td>\n</tr>\n<tr>\n<td><code>`1.0` is not a valid version</code></td>\n<td><code>MAJOR.MINOR.PATCH</code> 필요</td>\n</tr>\n<tr>\n<td><code>`version` must be a string</code> 등</td>\n<td>값의 타입이 다름(<code>must be a table</code> 등도 같다)</td>\n</tr>\n<tr>\n<td><code>unknown package kind</code></td>\n<td><code>kind</code>는 <code>\"bin\"</code> 또는 <code>\"lib\"</code></td>\n</tr>\n<tr>\n<td><code>package </code>p<code>has no</code>src/main.tam<code>or</code>src/lib.tam``</td>\n<td>진입 파일이 없다. 만들거나 <code>entry</code>/<code>kind</code>를 지정</td>\n</tr>\n<tr>\n<td><code>entry file ... does not exist</code></td>\n<td><code>entry</code>/<code>[target.*] entry</code>가 가리키는 파일이 없다</td>\n</tr>\n<tr>\n<td><code>unknown target</code></td>\n<td><code>host</code>/<code>windows</code>/<code>uefi</code>/<code>bios</code>/<code>aarch64</code>만 가능</td>\n</tr>\n<tr>\n<td><code>must be a relative path</code> / <code>must stay inside the package</code></td>\n<td><code>out-dir</code>, <code>entry</code>, <code>members</code> 등은 상대 경로이고 <code>..</code>로 나갈 수 없다</td>\n</tr>\n<tr>\n<td><code>`opt-level` must be 0, 1 or 2</code></td>\n<td>범위 밖</td>\n</tr>\n<tr>\n<td><code>dependency </code>d<code> must be a table</code></td>\n<td><code>d = { path = \"...\" }</code> 형식</td>\n</tr>\n<tr>\n<td><code>dependency </code>d<code>needs a</code>path``</td>\n<td>경로 없는 의존성(레지스트리는 아직 없다)</td>\n</tr>\n<tr>\n<td><code>invalid dependency name</code></td>\n<td>이름 규칙은 패키지와 같다</td>\n</tr>\n<tr>\n<td><code>cannot load dependency </code>d``</td>\n<td><code>path/Tmake.toml</code>이 없다</td>\n</tr>\n<tr>\n<td><code>dependency </code>d<code>points at package</code>p``</td>\n<td>키와 패키지 이름이 다르다</td>\n</tr>\n<tr>\n<td><code>dependency </code>d<code>is version V, which does not satisfy</code>R``</td>\n<td>버전 요구사항을 만족하지 않는다</td>\n</tr>\n<tr>\n<td><code>is a </code>bin<code> and cannot be used as a dependency</code></td>\n<td>의존성은 <code>kind = \"lib\"</code></td>\n</tr>\n<tr>\n<td><code>dependency cycle: a -&gt; b -&gt; a</code></td>\n<td>순환 의존</td>\n</tr>\n<tr>\n<td><code>two different packages are named </code>n``</td>\n<td>이름 충돌</td>\n</tr>\n<tr>\n<td><code>package </code>p<code> needs tamc R, but this is tamc V</code></td>\n<td><code>tamc</code> 요구사항 불일치</td>\n</tr>\n<tr>\n<td><code>workspace member </code>m<code> has no Tmake.toml</code></td>\n<td>멤버 폴더 확인</td>\n</tr>\n<tr>\n<td><code>the workspace has no members</code></td>\n<td><code>members</code>가 비었고 루트 패키지도 없다</td>\n</tr>\n<tr>\n<td><code>`k.workspace = true` but there is no workspace</code></td>\n<td>상속은 워크스페이스 안에서만</td>\n</tr>\n<tr>\n<td><code>Tmake.lock needs to be updated but --locked was given</code></td>\n<td>잠금 파일 갱신 필요</td>\n</tr>\n<tr>\n<td><code>run needs exactly one binary package</code></td>\n<td><code>-p &lt;이름&gt;</code>으로 지정</td>\n</tr>\n<tr>\n<td><code>cannot run a Windows executable on this machine</code></td>\n<td>Windows 이외에서 <code>run --target windows</code></td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,MANIFEST<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,manifest\">[package\nname = \"app\"   # expect-error: invalid TOML\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"14-설계-원칙과-한계\" id=\"ref-tmake--14-설계-원칙과-한계\">14. 설계 원칙과 한계<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--14-설계-원칙과-한계\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"원칙\" id=\"ref-tmake--원칙\">원칙<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--원칙\">¶</a></h3>\n<ul>\n<li><strong>표준 TOML</strong>만 쓴다. 파서는 검증된 구현을 쓰고, 의미 검사는 <code>tamc</code>가 한다.</li>\n<li><strong>안정성</strong>: 알 수 없는 키, 잘못된 타입, 경로 이탈, 순환, 버전 불일치는 <strong>조용히 넘어가지 않고</strong> 위치와 함께 오류가 된다.</li>\n<li><strong>재현성</strong>: 같은 입력은 같은 <code>Tmake.lock</code>과 같은 지문을 만든다. 상태 파일은 정렬되고 시간·경로·머신 정보를 담지 않는다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"한계-현재\" id=\"ref-tmake--한계-현재\">한계 (현재)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--한계-현재\">¶</a></h3>\n<ul>\n<li>의존성은 <strong>경로</strong>뿐이다. 레지스트리, git, 체크섬은 없다.</li>\n<li>컴파일 단위는 프로그램 전체다. 라이브러리는 <strong>검사만</strong> 하며 목적 파일을 만들지 않는다.</li>\n<li>전이 의존성은 직접 선언해야 쓸 수 있고, 의존성 이름은 지역 모듈을 가린다.</li>\n<li><code>[profile]</code>은 <code>opt-level</code>만 있다(안전 검사는 언어 보장이라 끌 수 없다). 사용자 프로파일 이름은 없다.</li>\n<li><code>[features]</code>, 빌드 스크립트, <code>[patch]</code>, 조건부 설정(<code>cfg</code>)은 없다. 대상별 차이는 <code>[target.&lt;t&gt;]</code>로 표현한다.</li>\n<li>워크스페이스 <code>members</code>의 글롭은 끝의 <code>/*</code> 하나만 지원한다.</li>\n<li>Windows용 <code>tamc.exe</code>는 이 저장소의 CI 워크플로(<code>.github/workflows/windows.yml</code>)로 만든다.</li>\n</ul>\n", "text": "Tmake.toml Documentation ¶ Tmake.toml 은 TAM 프로젝트의 매니페스트 다. 패키지의 메타데이터, 의존성, 컴파일 대상과 빌드 설정, 최적화 프로파일, 워크스페이스를 한곳에서 선언하고, tamc 가 그것으로 재현 가능하고 안정적인 빌드 를 만든다. 문법은 표준 TOML(v1.0) 그대로다. 독자 문법은 없다. 대상 버전: tamc 1.0 이 문서의 toml,manifest 블록과 project 묶음은 개발 중 검증 도구가 실제 tamc 로 검증한다. 목차 ¶ 개요 빠른 시작 매니페스트 스키마 버전과 버전 요구사항 의존성 워크스페이스 대상과 크로스 빌드 프로파일 잠금 파일 Tmake.lock 증분 빌드와 캐시 명령어 빌드 폴더 구조 오류 메시지 사전 설계 원칙과 한계 1. 개요 ¶ 1.1 하는 일 ¶ 일 어떻게 패키지 정의 [package] — 이름, 버전, 종류( bin / lib ), 메타데이터 의존성 [dependencies] — 경로 의존성과 버전 요구사항 타겟·빌드 설정 [build] , [target.<대상>] — 대상, 출력 폴더, 진입 파일, 출력 이름 최적화 [profile.dev] , [profile.release] 워크스페이스 [workspace] — 여러 패키지, 공통 메타데이터와 의존성 상속 재현성 Tmake.lock (해결된 그래프 기록), --locked 속도 입력 전체의 SHA-256 지문으로 안 바뀐 패키지는 건너뜀 1.2 매니페스트 찾기 ¶ tamc 는 현재 폴더에서 위로 올라가며 가장 가까운 Tmake.toml 을 찾는다. --manifest-path <경로/Tmake.toml> 로 직접 지정할 수 있다(파일 이름은 반드시 Tmake.toml ). 찾지 못하면: CONSOLE 복사 error: could not find `Tmake.toml` in `/home/me` or any parent folder\nnote: create a project with `tamc new <name>` or `tamc init` 1.3 파일 모드와의 관계 ¶ tamc build main.tam 처럼 .tam 파일을 직접 주면 매니페스트를 쓰지 않는다 (단일 파일 모드). 인자 없이 tamc build , tamc run , tamc check 를 쓰거나 Tmake.toml /폴더를 주면 프로젝트 모드다. 2. 빠른 시작 ¶ CONSOLE 복사 $ tamc new hello\n     Created binary `hello` in hello\n$ cd hello\n$ tamc run\n   Compiling hello v0.1.0 (.)\n    Finished dev [opt-level 0] host in 0.07s\n     Running /home/me/hello/build/host/dev/hello\nHello, TAM! tamc new hello 가 만드는 것: CODE 복사 hello/\n├── Tmake.toml\n├── .gitignore        # /build\n└── src/\n    └── main.tam Tmake.toml : TOML 복사 [package]\nname = \"hello\"\nversion = \"0.1.0\"\ntamc = \">=1.0\"\n\n[dependencies] 라이브러리는 tamc new util --lib ( kind = \"lib\" , src/lib.tam )다. 이미 있는 폴더에서는 tamc init [이름] 을 쓴다. 두 패키지를 잇는 첫 예: <!-- project run exit=42 --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nutil = { path = \"../util\", version = \"^1.2\" } TAM,FILE=APP/SRC/MAIN.TAM 복사 use util\n\nfn main() i32 {\n    util::double(21)\n} TOML,FILE=UTIL/TMAKE.TOML 복사 [package]\nname = \"util\"\nversion = \"1.2.0\"\nkind = \"lib\" TAM,FILE=UTIL/SRC/LIB.TAM 복사 pub fn double(x: i32) i32 { x * 2 } <!-- /project --> (위 프로젝트에서 tamc run 은 종료 코드 42로 끝난다.) 3. 매니페스트 스키마 ¶ 최상위에 올 수 있는 표는 package , dependencies , build , profile , target , workspace 여섯 개뿐이다. 알 수 없는 키는 오류 이며, 오타에는 did you mean 을 알려 준다. TOML,MANIFEST 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\nbuidl = 1   # expect-error: unknown key `buidl` in [package] 3.1 [package] ¶ 키 타입 필수 설명 name 문자열 ✔ 패키지 이름. 규칙은 아래 version 문자열 ✔ MAJOR.MINOR.PATCH (예: \"0.1.0\" ). 워크스페이스에서 상속 가능 kind \"bin\" | \"lib\" 생략 시 src/main.tam 이 있으면 bin , 없고 src/lib.tam 이 있으면 lib . entry 만 있으면 bin entry 경로 진입 파일. 기본은 bin → src/main.tam , lib → src/lib.tam description 문자열 설명. tamc metadata 에 나온다 authors 문자열 배열 저자 목록 license 문자열 라이선스 식별자 repository 문자열 저장소 URL tamc 문자열 필요한 컴파일러 버전 요구사항(예: \">=1.0\" ). 안 맞으면 빌드가 거절된다 edition 문자열 \"1\" 언어 에디션. 지금은 \"1\" 만 된다. 다른 값은 unsupported edition 으로 거절된다( Reference 18장 ) description , authors , license , repository , tamc , version 은 { workspace = true } 로 워크스페이스에서 상속 할 수 있다. 패키지 이름 규칙 : 소문자, 숫자, _ , - 만 쓰고 소문자로 시작 하며 최대 64자다. tam 은 표준 라이브러리용으로 예약 되어 쓸 수 없다. 이름의 - 는 use 에서 _ 로 쓴다( my-lib → use my_lib ). TOML,MANIFEST 복사 [package]\nname = \"my-lib\"\nversion = \"0.1.0\"\nkind = \"lib\"\ndescription = \"문자열 도구\"\nauthors = [\"lulu <lulu@example.com>\"]\nlicense = \"MIT\"\nrepository = \"https://example.com/my-lib\"\ntamc = \">=1.0\" TOML,MANIFEST 복사 [package]\nname = \"App\"   # expect-error: invalid package name `App`\nversion = \"0.1.0\" TOML,MANIFEST 복사 [package]\nname = \"app\"\nversion = \"1.0\"   # expect-error: is not a valid version TOML,MANIFEST 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\ntamc = \">=99.0\"   # expect-error: needs tamc >=99.0 3.2 [dependencies] ¶ TOML 복사 [dependencies]\nutil = { path = \"../util\", version = \"^1.2\" }\ncore = { workspace = true } 각 항목은 키 = 이름, 값 = 표 다. 허용되는 키는 path , version , workspace 뿐이다. 자세한 규칙은 5장 . 3.3 [build] ¶ 키 타입 기본 설명 target 문자열 host (Windows에서는 windows ) 기본 컴파일 대상. host , windows , uefi , bios , aarch64 out-dir 경로 build 산출물 폴더. 패키지(워크스페이스) 폴더 안 이어야 하고 상대 경로여야 한다 TOML,MANIFEST 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[build]\ntarget = \"host\"\nout-dir = \"out\" TOML,MANIFEST 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[build]\nout-dir = \"../out\"   # expect-error: must stay inside the package TOML,MANIFEST 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[build]\ntarget = \"linux\"   # expect-error: unknown target `linux` 3.4 [profile.dev] , [profile.release] ¶ 키 타입 dev 기본 release 기본 설명 opt-level 0, 1, 2 0 2 0 = 최적화 없음, 1 = 레지스터 승격, 2 = 승격 + 백엔드 전체 최적화 --release 를 주면 release 프로파일, 아니면 dev 프로파일이다. 다른 이름의 프로파일( [profile.fast] )은 없다. TOML,MANIFEST 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[profile.dev]\nopt-level = 1\n\n[profile.release]\nopt-level = 2 3.5 [target.<대상>] ¶ 대상별 설정이다. <대상> 은 host , windows , uefi , bios , aarch64 중 하나다. 키 설명 entry 이 대상에서 쓸 진입 파일 (패키지 폴더 안). [package] entry 를 덮어쓴다 out-name 이 대상 산출물의 파일 이름 (확장자 제외). 경로 구분자, 빈 문자열, . 로 시작하는 이름은 불가 dependencies 이 대상에서만 추가되는 의존성(표 형식은 [dependencies] 와 같다) TOML,MANIFEST 복사 [package]\nname = \"kernel\"\nversion = \"0.1.0\"\n\n[target.uefi]\nentry = \"src/uefi_main.tam\"\nout-name = \"BOOTX64\"\n\n[target.windows]\nout-name = \"kernel-win\" TOML,MANIFEST 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[target.windows]\nout-name = \"a/b\"   # expect-error: `out-name` must be a plain file name 4. 버전과 버전 요구사항 ¶ 4.1 버전 ¶ MAJOR.MINOR.PATCH 세 숫자(각각 0 이상의 정수, 앞자리 0 금지 : 01 은 불가). 빌드 메타데이터( +b )와 프리릴리스( -alpha )는 읽지만 비교에서 무시된다. 4.2 요구사항 문법 ¶ 쉼표로 여러 조건을 AND 로 묶는다. 각 조건은 연산자 + 부분 버전이다. 표기 의미 예 ^1.2.3 , 1.2.3 (연산자 없음) 캐럿: 호환(왼쪽 첫 0이 아닌 자리를 고정) ^1.2.3 = >=1.2.3, <2.0.0 ^0.2.3 >=0.2.3, <0.3.0 ^0.0.3 =0.0.3 ~1.2.3 틸드: 마이너까지 고정 >=1.2.3, <1.3.0 ~1 >=1.0.0, <2.0.0 1.2 ^1.2 와 같다 >=1.2.0, <2.0.0 =1.2.3 정확히 > >= < <= 비교 >=1.0, <2 * 모든 버전 1.* , 1.2.* 와일드카드 부분 버전( 1.2 )에서 빠진 자리는 0으로 채워 비교한다. 와일드카드 뒤에 숫자 ( 1.x.y )나 앞자리 0( 01.2 ), 빈 요구사항( ^ )은 오류다. 5. 의존성 ¶ 5.1 경로 의존성 ¶ TOML 복사 [dependencies]\nutil = { path = \"../util\" } 키는 패키지 이름과 같아야 한다. other = { path = \"../util\" } 는 dependency other points at package util``이다. path 는 패키지 폴더(안에 Tmake.toml )를 가리킨다. 패키지 폴더 밖 ( .. )도 가능하다( out-dir 과 달리). version (선택)은 요구사항 이며 의존 패키지의 version 이 맞지 않으면 거절된다. 레지스트리나 git 의존성은 아직 없다 ( git = \"...\" 은 unknown key ). 의존 패키지는 kind = \"lib\" 여야 한다( bin 은 is a bin and cannot be used as a dependency ). 같은 이름의 서로 다른 패키지가 그래프에 둘 있으면 two different packages are named ... 이다. 순환은 dependency cycle: app -> x -> y -> x 처럼 경로를 보여 준다. 5.2 코드에서 쓰기 ¶ 의존성 패키지의 이름이 모듈 이름 이다( - 는 _ ). 공개( pub ) 항목을 모듈::항목 으로 쓴다. <!-- project run exit=44 --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\ntext-tools = { path = \"../text-tools\" } TAM,FILE=APP/SRC/MAIN.TAM 복사 use text_tools\n\nfn main() i32 {\n    text_tools::triple(14) + 2\n} TOML,FILE=TEXT-TOOLS/TMAKE.TOML 복사 [package]\nname = \"text-tools\"\nversion = \"0.1.0\"\nkind = \"lib\" TAM,FILE=TEXT-TOOLS/SRC/LIB.TAM 복사 pub fn triple(x: i32) i32 { x * 3 } <!-- /project --> 5.3 규칙 ¶ 전이 의존성은 직접 쓸 수 없다. app → a → b 일 때 app 이 use b 를 하려면 app 의 [dependencies] 에도 b 를 선언해야 한다. 선언하지 않으면 cannot find module b``이다. (각 패키지는 자신이 선언한 것만 본다.) 패키지 안에서 use sub.mod 는 그 패키지의 src/ 폴더 기준이다. 라이브러리도 src/ 아래에 여러 파일을 둘 수 있다. 의존성 이름이 같은 이름의 지역 모듈보다 우선한다. util 의존성이 있으면 src/util.tam 이 있어도 use util 은 의존성을 가리킨다. 가시성은 그대로다: 의존 패키지의 비공개 항목에 접근하면 선언 위치를 함께 보여 주는 오류가 난다. 같은 패키지가 여러 경로로 이어져도(다이아몬드) 한 번만 컴파일에 들어간다. <!-- project run exit=7 --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\na = { path = \"../a\" } TAM,FILE=APP/SRC/MAIN.TAM 복사 use a\n\nfn main() i32 {\n    a::fa()\n} TAM,FILE=APP/SRC/A.TAM 복사 // 같은 이름의 지역 모듈이 있어도 의존성 `a`가 우선한다.\npub fn fa() i32 { 1000 } TOML,FILE=A/TMAKE.TOML 복사 [package]\nname = \"a\"\nversion = \"0.1.0\"\nkind = \"lib\" TAM,FILE=A/SRC/LIB.TAM 복사 use util\n\npub fn fa() i32 { util::deep() } TAM,FILE=A/SRC/UTIL.TAM 복사 pub fn deep() i32 { 7 } <!-- /project --> <!-- project fail=cannot find module `b` --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\na = { path = \"../a\" } TAM,FILE=APP/SRC/MAIN.TAM 복사 use a\nuse b\n\nfn main() i32 { a::fa() + b::fb() } TOML,FILE=A/TMAKE.TOML 복사 [package]\nname = \"a\"\nversion = \"0.1.0\"\nkind = \"lib\"\n\n[dependencies]\nb = { path = \"../b\" } TAM,FILE=A/SRC/LIB.TAM 복사 use b\n\npub fn fa() i32 { b::fb() + 1 } TOML,FILE=B/TMAKE.TOML 복사 [package]\nname = \"b\"\nversion = \"0.1.0\"\nkind = \"lib\" TAM,FILE=B/SRC/LIB.TAM 복사 pub fn fb() i32 { 40 } <!-- /project --> (위 마지막 프로젝트는 app 이 b 를 선언하지 않아 거절된다. 실제로 쓰려면 app 의 [dependencies] 에 b 를 추가한다. 이 예의 fail= 는 그것을 검증한다.) 5.4 대상별 의존성 ¶ TOML,MANIFEST 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\ncore = { path = \"../core\" }\n\n[target.windows.dependencies]\nwinapi = { path = \"../winapi\" } [target.<t>.dependencies] 의 항목은 그 대상을 빌드할 때만 그래프에 들어간다. 같은 이름을 두 표에 쓰면 dependency ... is listed twice 다. Tmake.lock 에는 모든 대상의 의존성이 합쳐져 기록된다( 9장 ). 5.5 잘못된 의존성 선언 ¶ TOML,MANIFEST 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nutil = \"../util\"   # expect-error: dependency `util` must be a table TOML,MANIFEST 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nutil = { version = \"1\" }   # expect-error: dependency `util` needs a `path` TOML,MANIFEST 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nutil = { path = \"../u\", git = \"x\" }   # expect-error: unknown key `git` 6. 워크스페이스 ¶ 여러 패키지를 하나의 워크스페이스 로 묶으면 같은 잠금 파일, 같은 빌드 폴더, 공통 메타데이터와 의존성을 공유한다. 6.1 선언 ¶ 워크스페이스 루트 의 Tmake.toml 에 [workspace] 를 둔다. TOML 복사 [workspace]\nmembers = [\"app\", \"libs/*\"]        # 멤버 폴더(끝에 /* 글롭 하나 허용)\nexclude = [\"libs/experimental\"]    # 제외할 폴더\ndefault-members = [\"app\"]          # 인자 없이 build/check할 때의 기본 대상 키 설명 members 멤버 패키지 폴더 목록. \"libs/*\" 는 libs/ 아래 Tmake.toml 이 있는 모든 하위 폴더 (이름순). 그 밖의 * 는 불가 exclude members 에서 뺄 폴더 default-members 기본 대상. 반드시 members 에 있는 폴더여야 한다. 없으면 모든 멤버 package 공통 메타데이터( [workspace.package] ) dependencies 공통 의존성( [workspace.dependencies] ) 루트는 [package] 도 함께 가질 수 있다(루트 패키지). 멤버도 루트 패키지도 없으면 the workspace has no members 다. 각 멤버 폴더에는 Tmake.toml 이 있어야 한다. 6.2 어떤 패키지가 빌드되나 ¶ 상황 빌드되는 것 멤버 폴더 안에서 인자 없이 그 패키지 워크스페이스 루트에서 인자 없이 default-members -p <이름> 이름이 같은 멤버(루트 패키지 포함) --workspace 모든 멤버(와 루트 패키지) run 은 정확히 하나의 bin 패키지 가 선택되어야 한다(아니면 -p 로 지정하라는 오류). 6.3 상속 ¶ [workspace.package] 에 둔 값을 멤버가 { workspace = true } 로 가져온다. 상속 가능한 키: version , authors , description , license , repository , tamc . [workspace.dependencies] 에 선언한 의존성은 멤버가 { workspace = true } 로 가져온다. 경로는 워크스페이스 루트 기준 으로 해석된다. <!-- project run exit=42 --> TOML,FILE=TMAKE.TOML 복사 [workspace]\nmembers = [\"app\", \"libs/*\"]\ndefault-members = [\"app\"]\n\n[workspace.package]\nversion = \"0.3.0\"\nauthors = [\"team\"]\nlicense = \"MIT\"\n\n[workspace.dependencies]\ncore = { path = \"libs/core\", version = \"^0.3\" }\n\n[profile.release]\nopt-level = 2 TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = { workspace = true }\nlicense = { workspace = true }\ndescription = \"워크스페이스 예제\"\n\n[dependencies]\ncore = { workspace = true }\nfmt = { path = \"../libs/fmt\" } TAM,FILE=APP/SRC/MAIN.TAM 복사 use core\nuse fmt\n\nfn main() i32 {\n    fmt::twice(core::base())\n} TOML,FILE=LIBS/CORE/TMAKE.TOML 복사 [package]\nname = \"core\"\nversion = { workspace = true }\nkind = \"lib\" TAM,FILE=LIBS/CORE/SRC/LIB.TAM 복사 pub fn base() i32 { 21 } TOML,FILE=LIBS/FMT/TMAKE.TOML 복사 [package]\nname = \"fmt\"\nversion = { workspace = true }\nkind = \"lib\" TAM,FILE=LIBS/FMT/SRC/LIB.TAM 복사 pub fn twice(x: i32) i32 { x * 2 } <!-- /project --> CONSOLE 복사 $ tamc tree\napp v0.3.0\n    core v0.3.0\n    fmt v0.3.0 워크스페이스 밖에서 { workspace = true } 를 쓰면 `version.workspace = true` but there is no workspace 이고, 워크스페이스에 그 값이 없으면 the workspace has no version to inherit 이다. 프로파일, 빌드 폴더, 잠금 파일은 워크스페이스 루트의 것 이 쓰인다(멤버 매니페스트의 [profile] 은 무시된다). [workspace.dependencies] 에 없는 이름을 { workspace = true } 로 쓰면 dependency x is not in [workspace.dependencies]``이다. 6.4 워크스페이스 오류 ¶ TOML,MANIFEST 복사 [workspace]\nmembers = [\"nope\"]   # expect-error: workspace member `nope` has no Tmake.toml TOML,MANIFEST 복사 [workspace]\nmembers = [\"a*b\"]   # expect-error: only a trailing `/*` glob is supported in `members` 7. 대상과 크로스 빌드 ¶ 7.1 대상 고르기 ¶ 우선순위: --target 옵션 > [build] target > 기본값 (Windows에서는 windows , 그 밖에는 host ). 대상 산출물 필요한 도구 host 확장자 없는 실행 파일 시스템 clang windows .exe llc (또는 clang ), lld-link (tamc와 같은 폴더 또는 PATH) uefi .efi llc (또는 clang ), lld-link bios .img llc (또는 clang ), lld-link aarch64 .bin llc (또는 clang ), lld-link check 는 도구가 없어도 모든 대상에서 동작한다(타입, 소유권, 빌림만 검사한다). run 은 host (또는 Windows 호스트에서 windows )만 지원한다. 펌웨어 대상은 build 로 만들어 QEMU 등으로 부팅한다. 7.2 대상별 진입 파일과 이름 ¶ TOML,MANIFEST 복사 [package]\nname = \"kernel\"\nversion = \"0.1.0\"\n\n[target.uefi]\nentry = \"src/uefi_main.tam\"\nout-name = \"BOOTX64\" uefi 대상으로 빌드하면 src/uefi_main.tam 이 루트(진입 모듈)가 되고 산출물은 build/uefi/<프로파일>/BOOTX64.efi 다. entry 는 루트 패키지에만 적용된다(의존성 패키지의 [target.*] entry 는 무시한다). 7.3 검사만 ¶ CONSOLE 복사 $ tamc check --target windows\n$ tamc check --target uefi 8. 프로파일 ¶ 프로파일 선택 opt-level 기본 dev 기본 0 release --release 2 opt-level = 0 : IR을 그대로 llc / clang 에 넘긴다( -O0 ). opt-level = 1 : tamc가 스택 변수를 SSA 레지스터로 승격 ( mem2reg )한다. opt-level = 2 : 승격 + 백엔드 -O2 . 환경 변수 TAMC_NO_OPT=1 은 승격을 끈다(디버깅용). 오버플로 검사, 경계 검사 같은 언어의 안전 검사는 프로파일로 끌 수 없다 (릴리스에서도 같다). 9. 잠금 파일 Tmake.lock ¶ tamc build/run/check 가 자동으로 만들고 갱신 한다. 워크스페이스 루트(워크스페이스가 아니면 패키지 폴더)에 놓이며 버전 관리에 커밋 한다. TOML 복사 # This file is generated by tamc. Do not edit it by hand.\nversion = 1\n\n[[package]]\nname = \"app\"\nversion = \"0.3.0\"\npath = \"app\"\ndependencies = [\"core\", \"fmt\"]\n\n[[package]]\nname = \"core\"\nversion = \"0.3.0\"\npath = \"libs/core\"\n\n[[package]]\nname = \"fmt\"\nversion = \"0.3.0\"\npath = \"libs/fmt\" 패키지는 이름순 , 경로는 루트 기준 / 구분 상대 경로라서, 같은 입력이면 항상 같은 바이트 다(머신, 대상, OS와 무관). 모든 대상의 의존성을 합쳐서 기록하므로, 어떤 대상으로 빌드해도 같은 파일이 된다. --locked : 잠금 파일이 없거나 갱신이 필요하면 오류로 끝낸다 (CI 권장). CONSOLE 복사 $ tamc build --locked\nerror: `Tmake.lock` needs to be updated but `--locked` was given\nnote: run `tamc build` without `--locked` and commit the result 의존성이 경로(path)뿐이므로 잠금 파일은 그래프의 스냅샷 이며 \"버전 재해결\"은 없다. 레지스트리가 생기면 여기에 체크섬이 더해진다. 10. 증분 빌드와 캐시 ¶ 빌드는 패키지마다 지문(SHA-256) 을 계산한다. 지문의 입력은 다음 전부다. 컴파일러 버전, 대상, opt-level , 패키지 종류 읽은 모든 Tmake.toml (내용) 읽은 모든 소스 파일 (경로와 내용, 내장 표준 라이브러리 제외) 지문이 build/<대상>/<프로파일>/.fingerprint/ 에 저장된 값과 같고 산출물이 있으면 컴파일을 건너뛰고 Fresh 를 출력한다. 소스 한 글자만 바뀌어도(의존성 포함) 다시 컴파일한다. CONSOLE 복사 $ tamc build\n   Compiling app v0.3.0 (app)\n    Finished dev [opt-level 0] host in 0.06s\n$ tamc build\n       Fresh app v0.3.0 (app) 상태 메시지는 stderr 로 나간다. -q / --quiet 로 끈다. tamc clean 은 빌드 폴더를 지운다. 라이브러리 패키지는 검사만 ( Checking ) 하며 지문도 따로( .chk ) 저장한다. 컴파일 단위는 프로그램 전체 다(패키지별 목적 파일이 아니다). 의존성이 바뀌면 그것을 쓰는 모든 패키지가 다시 컴파일된다. 11. 명령어 ¶ CODE 복사 tamc <명령> [옵션]            프로젝트 모드(가장 가까운 Tmake.toml 사용)\ntamc <명령> <파일.tam> ...    파일 모드(Tmake.toml을 쓰지 않음) 11.1 프로젝트 명령 ¶ 명령 설명 new <이름> [--lib] ./<이름>/ 에 새 패키지를 만든다. 이미 있으면 오류 init [이름] [--lib] 현재 폴더 에 Tmake.toml 과 src/ 를 만든다. 이름을 생략하면 폴더 이름(소문자, 공백/점은 - )을 쓴다 build 컴파일해 실행 파일(또는 이미지)을 만든다. 라이브러리는 검사만 한다 run 빌드하고 실행한다. 프로그램의 종료 코드로 tamc 도 끝난다 check 구문, 타입, 소유권, 빌림만 검사한다(링크하지 않는다) clean 빌드 폴더를 지운다 tree 의존성 트리를 출력한다 metadata 해결된 프로젝트를 JSON 한 줄 로 출력한다(도구 연동용) --version 컴파일러 버전을 출력한다 11.2 옵션 ¶ 옵션 설명 --release release 프로파일 --target <t> 대상을 정한다( host , windows , uefi , bios , aarch64 ) -p <이름> , --package <이름> 패키지를 고른다 --workspace , --all 모든 워크스페이스 멤버 --locked 잠금 파일이 바뀌면 오류 -q , --quiet 상태 메시지를 끈다 --manifest-path <경로> 사용할 Tmake.toml --lib new / init 에서 라이브러리로 -- <인자...> run 에서 프로그램에 넘길 인자( tam.os 는 아직 읽지 못한다) 종료 코드: 성공 0, 컴파일/매니페스트 오류 1, 사용법 오류 2, run 은 프로그램의 종료 코드(신호로 죽으면 128 + 신호 번호). 11.3 상태 메시지 ¶ stderr에 오른쪽 정렬된 태그로 나온다. 태그 의미 Locking 잠금 파일을 만들었거나 갱신했다 Compiling 컴파일하고 링크한다 Checking 검사한다( check , 라이브러리) Fresh 지문이 같아 건너뛰었다 Finished 끝(프로파일, 최적화 수준, 대상, 걸린 시간) Running run 이 실행 파일을 시작한다 Created new / init 이 프로젝트를 만들었다 Removed clean 이 폴더를 지웠다 11.4 metadata 의 출력 ¶ JSON 복사 {\"tamc\":\"1.0.0\",\"workspace_root\":\"/p\",\"build_dir\":\"/p/build\",\"packages\":[\n  {\"name\":\"app\",\"version\":\"0.3.0\",\"kind\":\"bin\",\"manifest_path\":\"/p/app/Tmake.toml\",\n   \"entry\":\"/p/app/src/main.tam\",\"description\":null,\"dependencies\":[\"core\",\"fmt\"],\n   \"workspace_member\":true}]} (실제 출력은 한 줄이다.) workspace_member 는 이 패키지가 워크스페이스의 멤버(또는 선택한 루트)인지다. 문자열은 JSON 규칙으로 이스케이프된다. 12. 빌드 폴더 구조 ¶ CODE 복사 build/\n└── <대상>/\n    └── <프로파일>/\n        ├── <출력 이름>[.exe|.efi|.img|.bin]\n        └── .fingerprint/\n            ├── <패키지>.bin      # 빌드 지문\n            └── <패키지>.chk      # 검사 지문 출력 이름은 [target.<t>] out-name , 없으면 패키지 이름이다. 빌드 폴더의 위치는 [build] out-dir (기본 build )이며 워크스페이스에서는 루트 기준이다. tamc new 가 만드는 .gitignore 는 /build 를 제외한다. 13. 오류 메시지 사전 ¶ 모든 매니페스트 오류는 Tmake.toml 의 파일, 줄, 칸 을 가리키며 해결 힌트를 붙인다. CONSOLE 복사 error: unknown key `buidl` in [package]\n --> /home/me/app/Tmake.toml:4:1\n  |\n4 | buidl = 1\n  | ^^^^^ did you mean `build`? 메시지 원인과 해결 invalid TOML: ... TOML 문법 오류(줄 위치 표시). 같은 키를 두 번 쓴 경우도 여기에 해당 unknown key k in <표> 허용되지 않는 키. 비슷한 키가 있으면 did you mean `[package]` needs a `name` / ... `version` 필수 키 누락 invalid package name 소문자/숫자/ _ / - , 소문자로 시작, 64자 이하 `tam` is reserved for the standard library tam 은 쓸 수 없는 이름 `1.0` is not a valid version MAJOR.MINOR.PATCH 필요 `version` must be a string 등 값의 타입이 다름( must be a table 등도 같다) unknown package kind kind 는 \"bin\" 또는 \"lib\" package p has no src/main.tam or src/lib.tam`` 진입 파일이 없다. 만들거나 entry / kind 를 지정 entry file ... does not exist entry / [target.*] entry 가 가리키는 파일이 없다 unknown target host / windows / uefi / bios / aarch64 만 가능 must be a relative path / must stay inside the package out-dir , entry , members 등은 상대 경로이고 .. 로 나갈 수 없다 `opt-level` must be 0, 1 or 2 범위 밖 dependency d must be a table d = { path = \"...\" } 형식 dependency d needs a path`` 경로 없는 의존성(레지스트리는 아직 없다) invalid dependency name 이름 규칙은 패키지와 같다 cannot load dependency d`` path/Tmake.toml 이 없다 dependency d points at package p`` 키와 패키지 이름이 다르다 dependency d is version V, which does not satisfy R`` 버전 요구사항을 만족하지 않는다 is a bin and cannot be used as a dependency 의존성은 kind = \"lib\" dependency cycle: a -> b -> a 순환 의존 two different packages are named n`` 이름 충돌 package p needs tamc R, but this is tamc V tamc 요구사항 불일치 workspace member m has no Tmake.toml 멤버 폴더 확인 the workspace has no members members 가 비었고 루트 패키지도 없다 `k.workspace = true` but there is no workspace 상속은 워크스페이스 안에서만 Tmake.lock needs to be updated but --locked was given 잠금 파일 갱신 필요 run needs exactly one binary package -p <이름> 으로 지정 cannot run a Windows executable on this machine Windows 이외에서 run --target windows TOML,MANIFEST 복사 [package\nname = \"app\"   # expect-error: invalid TOML 14. 설계 원칙과 한계 ¶ 원칙 ¶ 표준 TOML 만 쓴다. 파서는 검증된 구현을 쓰고, 의미 검사는 tamc 가 한다. 안정성 : 알 수 없는 키, 잘못된 타입, 경로 이탈, 순환, 버전 불일치는 조용히 넘어가지 않고 위치와 함께 오류가 된다. 재현성 : 같은 입력은 같은 Tmake.lock 과 같은 지문을 만든다. 상태 파일은 정렬되고 시간·경로·머신 정보를 담지 않는다. 한계 (현재) ¶ 의존성은 경로 뿐이다. 레지스트리, git, 체크섬은 없다. 컴파일 단위는 프로그램 전체다. 라이브러리는 검사만 하며 목적 파일을 만들지 않는다. 전이 의존성은 직접 선언해야 쓸 수 있고, 의존성 이름은 지역 모듈을 가린다. [profile] 은 opt-level 만 있다(안전 검사는 언어 보장이라 끌 수 없다). 사용자 프로파일 이름은 없다. [features] , 빌드 스크립트, [patch] , 조건부 설정( cfg )은 없다. 대상별 차이는 [target.<t>] 로 표현한다. 워크스페이스 members 의 글롭은 끝의 /* 하나만 지원한다. Windows용 tamc.exe 는 이 저장소의 CI 워크플로( .github/workflows/windows.yml )로 만든다.", "source": "docs/tmake.md"}, {"key": "ref-safety", "path": "docs/safety.md", "nav": "안전성과 메모리 모델", "title": "Safety and Memory Model ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"safety-and-memory-model\" id=\"ref-safety--safety-and-memory-model\">Safety and Memory Model<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--safety-and-memory-model\">¶</a></h1>\n<p>TAM이 <strong>무엇을 보장하고 무엇을 보장하지 않는지</strong>를 정확히 적은 문서다. 기능의 정의는 <a href=\"#doc-ref-reference\">The TAM Reference</a>의 8~12장이고, 이 문서는 그것을 안전성의 관점에서 다시 묶는다.</p>\n<ul>\n<li>대상 버전: <code>tamc 1.0</code></li>\n<li>이 문서의 모든 코드는 <code>tamc 1.0</code>으로 컴파일하고 실행해(오류와 trap은 메시지까지) 검증했다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"1-약속\" id=\"ref-safety--1-약속\">1. 약속<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--1-약속\">¶</a></h2>\n<blockquote>\n<p><strong><code>unsafe</code>가 없는 TAM 코드는, 컴파일러가 올바르다면, 메모리를 깨뜨리지 못한다.</strong>\n위반은 컴파일 오류이거나, 조용한 오동작이 아니라 <strong>즉시 멈춤(trap)</strong> 이다.</p>\n</blockquote>\n<p>세 층으로 나눠 생각한다.</p>\n<table>\n<thead>\n<tr>\n<th>층</th>\n<th>누가 책임지나</th>\n<th>위반하면</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>안전한 코드</td>\n<td>컴파일러</td>\n<td>컴파일 오류 또는 trap</td>\n</tr>\n<tr>\n<td><code>unsafe</code> 블록, <code>unsafe fn</code>, <code>extern</code> 호출</td>\n<td><strong>사용자</strong></td>\n<td>정의되지 않은 동작</td>\n</tr>\n<tr>\n<td>컴파일러 자신</td>\n<td>tamc 개발</td>\n<td>버그(발견하면 고친다)</td>\n</tr>\n</tbody>\n</table>\n<h2 class=\"doc-heading\" data-slug=\"2-컴파일-시간에-막는-것\" id=\"ref-safety--2-컴파일-시간에-막는-것\">2. 컴파일 시간에 막는 것<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--2-컴파일-시간에-막는-것\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"21-소유권-해제-후-사용과-이중-해제\" id=\"ref-safety--21-소유권-해제-후-사용과-이중-해제\">2.1 소유권: 해제 후 사용과 이중 해제<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--21-소유권-해제-후-사용과-이중-해제\">¶</a></h3>\n<p>모든 힙 값(<code>String</code>, 이를 가진 구조체 등)에는 소유자가 하나다. 이동한 뒤에는 쓸 수 없고, 소유자가 스코프를 벗어나면 <strong>한 번</strong> 해제된다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: use of moved value `s`\nfn eat(s: String) i32 { s.len as i32 }\n\nfn main() i32 {\n    let s = string_from(\"hello\")\n    let n = eat(s)\n    n + s.len as i32\n}\n</code></pre></div>\n<p>분기마다 이동 상태를 합치므로 \"어떤 경로에서만 이동\"도 잡는다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: use of moved value `s`\nfn eat(s: String) i32 { s.len as i32 }\n\nfn main() i32 {\n    let s = string_from(\"hello\")\n    let c = 1\n    if c == 1 { eat(s) } else { 0 }\n    s.len as i32\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"22-빌림-댕글링과-별칭-충돌\" id=\"ref-safety--22-빌림-댕글링과-별칭-충돌\">2.2 빌림: 댕글링과 별칭 충돌<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--22-빌림-댕글링과-별칭-충돌\">¶</a></h3>\n<p>참조는 소유자를 <strong>빌린다</strong>. 읽기 참조는 여러 개, 쓰기 참조는 하나만 동시에 살아 있을 수 있고, 참조는 소유자보다 오래 살 수 없다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot return reference to local variable `x`\nfn f() &amp;i32 {\n    let x = 5\n    &amp;x\n}\n\nfn main() i32 { *f() }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot assign to `v` because it is borrowed\nfn main() i32 {\n    mut v = 1\n    let r = &amp;v\n    v = 2\n    *r\n}\n</code></pre></div>\n<p>lifetime을 <strong>쓰지 않는다</strong>. 컴파일러가 본문에서 추론하고, 여러 인자에서 올 수 있으면 보수적으로 모두를 빌린 것으로 본다. 그래서 가끔 올바른 코드가 거부될 수 있다(안전한 쪽으로의 오류).</p>\n<h3 class=\"doc-heading\" data-slug=\"23-타입-초기화-변경-가능성\" id=\"ref-safety--23-타입-초기화-변경-가능성\">2.3 타입, 초기화, 변경 가능성<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--23-타입-초기화-변경-가능성\">¶</a></h3>\n<ul>\n<li>초기화되지 않은 변수는 없다(<code>let x</code>만 쓰는 문법이 없다).</li>\n<li>불변 변수에는 대입할 수 없다. <code>&amp;mut</code>는 <code>mut</code> 변수에서만 만든다.</li>\n<li>정수 사이의 암묵적 변환이 없다. <code>as</code>만 쓴다(그리고 <code>as</code>는 trap하지 않고 감싸거나 포화한다).</li>\n<li><code>unsafe</code> 없이는 raw 포인터를 역참조하거나 <code>alloc</code>/<code>free</code>를 부를 수 없다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: needs an `unsafe` block\nfn main() i32 {\n    let m = alloc(8)\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"3-실행-시간에-막는-것trap\" id=\"ref-safety--3-실행-시간에-막는-것trap\">3. 실행 시간에 막는 것(trap)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--3-실행-시간에-막는-것trap\">¶</a></h2>\n<p>컴파일 시간에 알 수 없는 위반은 검사 코드를 넣어 <strong>즉시 멈춘다</strong>. 호스트에서는 <code>tam: panic: &lt;메시지&gt;</code>를 stderr에 쓰고 <code>SIGILL</code>(종료 코드 132)로 끝난다.</p>\n<table>\n<thead>\n<tr>\n<th>위반</th>\n<th>메시지</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>배열·슬라이스 경계 밖 접근</td>\n<td><code>index out of bounds</code></td>\n</tr>\n<tr>\n<td>정수 <code>+ - *</code>, 단항 <code>-</code> 오버플로</td>\n<td><code>integer overflow</code></td>\n</tr>\n<tr>\n<td><code>/</code>, <code>%</code>의 0 나누기</td>\n<td><code>division by zero</code></td>\n</tr>\n<tr>\n<td><code>MIN / -1</code></td>\n<td><code>integer overflow in division</code></td>\n</tr>\n<tr>\n<td><code>assert(거짓)</code></td>\n<td><code>assertion failed</code></td>\n</tr>\n<tr>\n<td><code>None</code>/<code>Err</code>에 <code>unwrap</code></td>\n<td><code>called `unwrap()` on a `None` value</code> 등</td>\n</tr>\n<tr>\n<td><code>panic(\"...\")</code></td>\n<td>그 메시지</td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: index out of bounds\nfn get(a: &amp;[i32], i: u64) i32 { a[i] }\n\nfn main() i32 {\n    let a = [1, 2, 3]\n    get(&amp;a, 3)\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: integer overflow\nfn main() i32 {\n    let a: i32 = 2147483647\n    a + 1\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: division by zero\nfn main() i32 {\n    let z = 0\n    10 / z\n}\n</code></pre></div>\n<p><strong>검사는 빌드 모드와 무관하다.</strong> <code>--release</code>로도 끌 수 없다. 오버플로가 의도라면 <code>wrapping_add</code>, <code>wrapping_sub</code>, <code>wrapping_mul</code>로 명시한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let a: i32 = 2147483647\n    if wrapping_add(a, 1) != -2147483647 - 1 { return 1 }\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"4-자동-해제의-정확한-의미\" id=\"ref-safety--4-자동-해제의-정확한-의미\">4. 자동 해제의 정확한 의미<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--4-자동-해제의-정확한-의미\">¶</a></h2>\n<ul>\n<li>스코프가 끝나면 <strong>선언의 역순</strong>으로 해제한다.</li>\n<li><code>return</code>, <code>?</code>, <code>break</code>, <code>continue</code>로 나갈 때도 살아 있는 값을 모두 해제한다.</li>\n<li>이동 여부는 변수마다 둔 런타임 플래그로 판단해, <strong>조건부 이동</strong>도 한 번만 해제된다.</li>\n<li>재대입은 이전 값을 먼저 해제한다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TA
