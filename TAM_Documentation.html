sh(s, 120)\n    string_push(s, 121)\n}\n\nfn main() i32 {\n    mut s = string_from(\"a\")\n    push_twice(&amp;mut s)\n    s.len as i32\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"값-반환으로-소유권-돌려주기\" id=\"example-ownership--값-반환으로-소유권-돌려주기\">값 반환으로 소유권 돌려주기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-ownership--값-반환으로-소유권-돌려주기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 4\nfn exclaim(s: String) String {\n    mut t = s\n    string_push(&amp;mut t, 33)\n    t\n}\n\nfn main() i32 {\n    let s = exclaim(string_from(\"abc\"))\n    s.len as i32\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"읽는-동안-수정은-막힌다\" id=\"example-ownership--읽는-동안-수정은-막힌다\">읽는 동안 수정은 막힌다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-ownership--읽는-동안-수정은-막힌다\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot assign to `v` because it is borrowed\nfn main() i32 {\n    mut v = 1\n    let r = &amp;v\n    v = 2\n    *r\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"한-번에-하나의-mut\" id=\"example-ownership--한-번에-하나의-mut\">한 번에 하나의 <code>&amp;mut</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-ownership--한-번에-하나의-mut\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot borrow `x` as mutable more than once at a time\nfn main() i32 {\n    mut x = 1\n    let a = &amp;mut x\n    let b = &amp;mut x\n    *a += 1\n    *b += 1\n    x\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"마지막-사용-이후에는-다시-쓸-수-있다\" id=\"example-ownership--마지막-사용-이후에는-다시-쓸-수-있다\">마지막 사용 이후에는 다시 쓸 수 있다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-ownership--마지막-사용-이후에는-다시-쓸-수-있다\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nfn main() i32 {\n    mut x = 1\n    let r = &amp;mut x\n    *r += 1               // r의 마지막 사용\n    x += 1                // 이제 괜찮다\n    x\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"필드는-따로-빌린다\" id=\"example-ownership--필드는-따로-빌린다\">필드는 따로 빌린다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-ownership--필드는-따로-빌린다\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nstruct P { a: i32, b: i32 }\n\nfn main() i32 {\n    mut p = P { a: 1, b: 2 }\n    let x = &amp;mut p.a\n    let y = &amp;mut p.b\n    *x += 1\n    *y += 1\n    p.a + p.b\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"지역-변수의-참조는-반환할-수-없다\" id=\"example-ownership--지역-변수의-참조는-반환할-수-없다\">지역 변수의 참조는 반환할 수 없다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-ownership--지역-변수의-참조는-반환할-수-없다\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot return reference to local variable `x`\nfn bad() &amp;i32 {\n    let x = 1\n    &amp;x\n}\n\nfn main() i32 { *bad() }\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"자동-해제-스코프를-벗어날-때\" id=\"example-ownership--자동-해제-스코프를-벗어날-때\">자동 해제: 스코프를 벗어날 때<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-ownership--자동-해제-스코프를-벗어날-때\">¶</a></h2>\n<p>별도로 <code>free</code>를 부르지 않아도 <code>String</code>은 스코프 끝에서 해제된다. 조기 <code>return</code>과 <code>?</code>에서도 마찬가지다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn work(n: i32) i32 {\n    let a = string_from(\"one\")\n    if n &gt; 0 { return 1 }          // a가 해제된다\n    let b = string_from(\"two\")\n    a.len as i32 + b.len as i32 - 6\n}\n\nfn main() i32 {\n    work(1) - 1 + work(0)\n}\n</code></pre></div>\n", "text": "3. 소유권과 빌림 ¶ 이동 ¶ String , 구조체, 배열은 이동 타입이다. 이동한 뒤의 원본은 쓸 수 없다. TAM,ERROR 복사 // error: use of moved value `a`\nfn main() i32 {\n    let a = string_from(\"hi\")\n    let b = a\n    a.len as i32 + b.len as i32\n} 함수에 값을 넘기면 이동한다 ¶ TAM 복사 // exit: 3\nfn consume(s: String) i32 { s.len as i32 }     // 여기서 해제된다\n\nfn main() i32 {\n    let s = string_from(\"abc\")\n    consume(s)\n} 참조로 빌려 주기 ¶ TAM 복사 // exit: 6\nfn len_of(s: &String) i32 { s.len as i32 }\n\nfn main() i32 {\n    let s = string_from(\"abc\")\n    let n = len_of(&s)\n    n + s.len as i32          // s는 아직 우리 것이다\n} &mut 로 바꾸기 ¶ TAM 복사 // exit: 3\nfn push_twice(s: &mut String) {\n    string_push(s, 120)\n    string_push(s, 121)\n}\n\nfn main() i32 {\n    mut s = string_from(\"a\")\n    push_twice(&mut s)\n    s.len as i32\n} 값 반환으로 소유권 돌려주기 ¶ TAM 복사 // exit: 4\nfn exclaim(s: String) String {\n    mut t = s\n    string_push(&mut t, 33)\n    t\n}\n\nfn main() i32 {\n    let s = exclaim(string_from(\"abc\"))\n    s.len as i32\n} 읽는 동안 수정은 막힌다 ¶ TAM,ERROR 복사 // error: cannot assign to `v` because it is borrowed\nfn main() i32 {\n    mut v = 1\n    let r = &v\n    v = 2\n    *r\n} 한 번에 하나의 &mut ¶ TAM,ERROR 복사 // error: cannot borrow `x` as mutable more than once at a time\nfn main() i32 {\n    mut x = 1\n    let a = &mut x\n    let b = &mut x\n    *a += 1\n    *b += 1\n    x\n} 마지막 사용 이후에는 다시 쓸 수 있다 ¶ TAM 복사 // exit: 3\nfn main() i32 {\n    mut x = 1\n    let r = &mut x\n    *r += 1               // r의 마지막 사용\n    x += 1                // 이제 괜찮다\n    x\n} 필드는 따로 빌린다 ¶ TAM 복사 // exit: 5\nstruct P { a: i32, b: i32 }\n\nfn main() i32 {\n    mut p = P { a: 1, b: 2 }\n    let x = &mut p.a\n    let y = &mut p.b\n    *x += 1\n    *y += 1\n    p.a + p.b\n} 지역 변수의 참조는 반환할 수 없다 ¶ TAM,ERROR 복사 // error: cannot return reference to local variable `x`\nfn bad() &i32 {\n    let x = 1\n    &x\n}\n\nfn main() i32 { *bad() } 자동 해제: 스코프를 벗어날 때 ¶ 별도로 free 를 부르지 않아도 String 은 스코프 끝에서 해제된다. 조기 return 과 ? 에서도 마찬가지다. TAM 복사 // exit: 0\nfn work(n: i32) i32 {\n    let a = string_from(\"one\")\n    if n > 0 { return 1 }          // a가 해제된다\n    let b = string_from(\"two\")\n    a.len as i32 + b.len as i32 - 6\n}\n\nfn main() i32 {\n    work(1) - 1 + work(0)\n}", "source": "docs/by-example/03-ownership.md"}, {"key": "example-errors", "path": "docs/by-example/04-errors.md", "nav": "오류 처리", "title": "4. 오류 처리 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"4-오류-처리\" id=\"example-errors--4-오류-처리\">4. 오류 처리<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-errors--4-오류-처리\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"option-없을-수도-있다\" id=\"example-errors--option-없을-수도-있다\"><code>Option</code>: 없을 수도 있다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-errors--option-없을-수도-있다\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 2\nfn find(a: &amp;[i32], x: i32) Option&lt;u64&gt; {\n    for i in 0..a.len {\n        if a[i] == x { return Some(i) }\n    }\n    None\n}\n\nfn main() i32 {\n    let a = [4, 5, 6]\n    match find(&amp;a, 6) {\n        Some(i) =&gt; i as i32\n        None =&gt; 0 - 1\n    }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"result-실패에-이유가-있다\" id=\"example-errors--result-실패에-이유가-있다\"><code>Result</code>: 실패에 이유가 있다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-errors--result-실패에-이유가-있다\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nfn half(n: i32) Result&lt;i32, i32&gt; {\n    if n % 2 != 0 { return Err(n) }\n    Ok(n / 2)\n}\n\nfn main() i32 {\n    match half(10) {\n        Ok(v) =&gt; v\n        Err(_bad) =&gt; 0\n    }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"로-전파\" id=\"example-errors--로-전파\"><code>?</code>로 전파<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-errors--로-전파\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 14\nfn parse_digit(c: u8) Result&lt;i32, i32&gt; {\n    if c &lt; 48 || c &gt; 57 { return Err(1) }\n    Ok((c - 48) as i32)\n}\n\nfn two(a: u8, b: u8) Result&lt;i32, i32&gt; {\n    let x = parse_digit(a)?\n    let y = parse_digit(b)?\n    Ok(x * 10 + y)\n}\n\nfn main() i32 {\n    let ok = two(49, 52).unwrap_or(0)         // 14\n    let bad = two(49, 120).unwrap_or(0)       // 0\n    ok + bad\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"unwrapor와-is\" id=\"example-errors--unwrapor와-is\"><code>unwrap_or</code>와 <code>is_*</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-errors--unwrapor와-is\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let a: Option&lt;i32&gt; = None\n    let r: Result&lt;i32, i32&gt; = Ok(3)\n    if a.unwrap_or(7) != 7 { return 1 }\n    if a.is_some() { return 2 }\n    if !r.is_ok() { return 3 }\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"오류에-소유권-있는-값-담기\" id=\"example-errors--오류에-소유권-있는-값-담기\">오류에 소유권 있는 값 담기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-errors--오류에-소유권-있는-값-담기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nfn greet(ok: bool) Result&lt;String, String&gt; {\n    if ok { Ok(string_from(\"hey\")) } else { Err(string_from(\"no\")) }\n}\n\nfn main() i32 {\n    match greet(true) {\n        Ok(s) =&gt; s.len as i32\n        Err(e) =&gt; e.len as i32 + 100\n    }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"패닉\" id=\"example-errors--패닉\">패닉<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-errors--패닉\">¶</a></h2>\n<p>복구할 수 없는 버그는 <code>panic</code>이나 <code>assert</code>로 멈춘다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: invalid state\nfn main() i32 {\n    let state = 3\n    if state &gt; 2 { panic(\"invalid state\") }\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"배열-경계\" id=\"example-errors--배열-경계\">배열 경계<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-errors--배열-경계\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: index out of bounds\nfn main() i32 {\n    let a = [1, 2, 3]\n    let i = a.len\n    a[i]\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"0으로-나누기\" id=\"example-errors--0으로-나누기\">0으로 나누기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-errors--0으로-나누기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: division by zero\nfn main() i32 {\n    let d = 0\n    10 / d\n}\n</code></pre></div>\n", "text": "4. 오류 처리 ¶ Option : 없을 수도 있다 ¶ TAM 복사 // exit: 2\nfn find(a: &[i32], x: i32) Option<u64> {\n    for i in 0..a.len {\n        if a[i] == x { return Some(i) }\n    }\n    None\n}\n\nfn main() i32 {\n    let a = [4, 5, 6]\n    match find(&a, 6) {\n        Some(i) => i as i32\n        None => 0 - 1\n    }\n} Result : 실패에 이유가 있다 ¶ TAM 복사 // exit: 5\nfn half(n: i32) Result<i32, i32> {\n    if n % 2 != 0 { return Err(n) }\n    Ok(n / 2)\n}\n\nfn main() i32 {\n    match half(10) {\n        Ok(v) => v\n        Err(_bad) => 0\n    }\n} ? 로 전파 ¶ TAM 복사 // exit: 14\nfn parse_digit(c: u8) Result<i32, i32> {\n    if c < 48 || c > 57 { return Err(1) }\n    Ok((c - 48) as i32)\n}\n\nfn two(a: u8, b: u8) Result<i32, i32> {\n    let x = parse_digit(a)?\n    let y = parse_digit(b)?\n    Ok(x * 10 + y)\n}\n\nfn main() i32 {\n    let ok = two(49, 52).unwrap_or(0)         // 14\n    let bad = two(49, 120).unwrap_or(0)       // 0\n    ok + bad\n} unwrap_or 와 is_* ¶ TAM 복사 // exit: 0\nfn main() i32 {\n    let a: Option<i32> = None\n    let r: Result<i32, i32> = Ok(3)\n    if a.unwrap_or(7) != 7 { return 1 }\n    if a.is_some() { return 2 }\n    if !r.is_ok() { return 3 }\n    0\n} 오류에 소유권 있는 값 담기 ¶ TAM 복사 // exit: 3\nfn greet(ok: bool) Result<String, String> {\n    if ok { Ok(string_from(\"hey\")) } else { Err(string_from(\"no\")) }\n}\n\nfn main() i32 {\n    match greet(true) {\n        Ok(s) => s.len as i32\n        Err(e) => e.len as i32 + 100\n    }\n} 패닉 ¶ 복구할 수 없는 버그는 panic 이나 assert 로 멈춘다. TAM,TRAP 복사 // panic: invalid state\nfn main() i32 {\n    let state = 3\n    if state > 2 { panic(\"invalid state\") }\n    0\n} 배열 경계 ¶ TAM,TRAP 복사 // panic: index out of bounds\nfn main() i32 {\n    let a = [1, 2, 3]\n    let i = a.len\n    a[i]\n} 0으로 나누기 ¶ TAM,TRAP 복사 // panic: division by zero\nfn main() i32 {\n    let d = 0\n    10 / d\n}", "source": "docs/by-example/04-errors.md"}, {"key": "example-strings-io", "path": "docs/by-example/05-strings-io.md", "nav": "문자열과 입출력", "title": "5. 문자열과 입출력 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"5-문자열과-입출력\" id=\"example-strings-io--5-문자열과-입출력\">5. 문자열과 입출력<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-strings-io--5-문자열과-입출력\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"str과-string\" id=\"example-strings-io--str과-string\"><code>str</code>과 <code>String</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-strings-io--str과-string\">¶</a></h2>\n<p><code>str</code>은 빌린 문자열(리터럴 포함), <code>String</code>은 힙에 소유한 문자열이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nfn main() i32 {\n    let lit: str = \"hello\"\n    let owned = string_from(lit)       // 힙에 복사\n    if lit.len != owned.len { return 0 }\n    owned.len as i32\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"글자-덧붙이기\" id=\"example-strings-io--글자-덧붙이기\">글자 덧붙이기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-strings-io--글자-덧붙이기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// out: abc\nuse tam.os\n\nfn main() i32 {\n    mut s = string_from(\"\")\n    string_push(&amp;mut s, 97)\n    string_push(&amp;mut s, 98)\n    string_push(&amp;mut s, 99)\n    os::println(as_str(&amp;s))\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"tamfmt-이어-붙이기\" id=\"example-strings-io--tamfmt-이어-붙이기\"><code>tam.fmt</code>: 이어 붙이기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-strings-io--tamfmt-이어-붙이기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// out: x = 42\nuse tam.os\nuse tam.fmt\n\nfn main() i32 {\n    mut s = fmt::concat(\"x = \", \"\")\n    let n = fmt::int_to_string(42)\n    fmt::push_str(&amp;mut s, as_str(&amp;n))\n    os::println(as_str(&amp;s))\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"숫자-출력\" id=\"example-strings-io--숫자-출력\">숫자 출력<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-strings-io--숫자-출력\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// out: -7\nuse tam.os\n\nfn main() i32 {\n    os::print_int(0 - 7)\n    os::println(\"\")\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"바이트-세기\" id=\"example-strings-io--바이트-세기\">바이트 세기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-strings-io--바이트-세기\">¶</a></h2>\n<p>문자열은 바이트 열이다. 한 바이트씩 읽으려면 <code>unsafe</code>가 필요하다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nfn count(s: str, b: u8) i32 {\n    mut n = 0\n    for i in 0..s.len {\n        if unsafe { *(s.ptr + i) } == b { n += 1 }\n    }\n    n\n}\n\nfn main() i32 { count(\"banana\", 97) }          // 'a'\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"줄-읽기\" id=\"example-strings-io--줄-읽기\">줄 읽기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-strings-io--줄-읽기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// stdin: hello world\n// out: you said: hello world\nuse tam.os\n\nfn main() i32 {\n    let line = os::read_line()\n    os::print(\"you said: \")\n    os::println(as_str(&amp;line))\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"입력이-끝날-때까지\" id=\"example-strings-io--입력이-끝날-때까지\">입력이 끝날 때까지<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-strings-io--입력이-끝날-때까지\">¶</a></h2>\n<p>빈 줄(또는 EOF)을 끝으로 본다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// stdin: a\n// stdin: bb\n// stdin: ccc\n// exit: 6\nuse tam.os\n\nfn main() i32 {\n    mut total = 0\n    while true {\n        let line = os::read_line()\n        if line.len == 0 { break }\n        total += line.len as i32\n    }\n    total\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"파일-쓰기와-읽기\" id=\"example-strings-io--파일-쓰기와-읽기\">파일 쓰기와 읽기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-strings-io--파일-쓰기와-읽기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nuse tam.os\n\nfn main() i32 {\n    let path = \"/tmp/tam_by_example.txt\"\n    match os::write_file(path, \"hello\") {\n        Ok(_n) =&gt; {}\n        Err(e) =&gt; { return e }\n    }\n    match os::read_file(path) {\n        Ok(text) =&gt; text.len as i32\n        Err(e) =&gt; e\n    }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"없는-파일\" id=\"example-strings-io--없는-파일\">없는 파일<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-strings-io--없는-파일\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 2\nuse tam.os\n\nfn main() i32 {\n    match os::read_file(\"/no/such/file\") {\n        Ok(_t) =&gt; 0\n        Err(e) =&gt; e              // ENOENT\n    }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"걸린-시간-재기\" id=\"example-strings-io--걸린-시간-재기\">걸린 시간 재기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-strings-io--걸린-시간-재기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nuse tam.os\n\nfn main() i32 {\n    let t0 = os::time_ms()\n    mut x: u64 = 0\n    for i in 0..1000 { x += i as u64 }\n    let t1 = os::time_ms()\n    if t1 &lt; t0 { return 1 }\n    if x != 499500 { return 2 }\n    0\n}\n</code></pre></div>\n", "text": "5. 문자열과 입출력 ¶ str 과 String ¶ str 은 빌린 문자열(리터럴 포함), String 은 힙에 소유한 문자열이다. TAM 복사 // exit: 5\nfn main() i32 {\n    let lit: str = \"hello\"\n    let owned = string_from(lit)       // 힙에 복사\n    if lit.len != owned.len { return 0 }\n    owned.len as i32\n} 글자 덧붙이기 ¶ TAM 복사 // out: abc\nuse tam.os\n\nfn main() i32 {\n    mut s = string_from(\"\")\n    string_push(&mut s, 97)\n    string_push(&mut s, 98)\n    string_push(&mut s, 99)\n    os::println(as_str(&s))\n    0\n} tam.fmt : 이어 붙이기 ¶ TAM 복사 // out: x = 42\nuse tam.os\nuse tam.fmt\n\nfn main() i32 {\n    mut s = fmt::concat(\"x = \", \"\")\n    let n = fmt::int_to_string(42)\n    fmt::push_str(&mut s, as_str(&n))\n    os::println(as_str(&s))\n    0\n} 숫자 출력 ¶ TAM 복사 // out: -7\nuse tam.os\n\nfn main() i32 {\n    os::print_int(0 - 7)\n    os::println(\"\")\n    0\n} 바이트 세기 ¶ 문자열은 바이트 열이다. 한 바이트씩 읽으려면 unsafe 가 필요하다. TAM 복사 // exit: 3\nfn count(s: str, b: u8) i32 {\n    mut n = 0\n    for i in 0..s.len {\n        if unsafe { *(s.ptr + i) } == b { n += 1 }\n    }\n    n\n}\n\nfn main() i32 { count(\"banana\", 97) }          // 'a' 줄 읽기 ¶ TAM 복사 // stdin: hello world\n// out: you said: hello world\nuse tam.os\n\nfn main() i32 {\n    let line = os::read_line()\n    os::print(\"you said: \")\n    os::println(as_str(&line))\n    0\n} 입력이 끝날 때까지 ¶ 빈 줄(또는 EOF)을 끝으로 본다. TAM 복사 // stdin: a\n// stdin: bb\n// stdin: ccc\n// exit: 6\nuse tam.os\n\nfn main() i32 {\n    mut total = 0\n    while true {\n        let line = os::read_line()\n        if line.len == 0 { break }\n        total += line.len as i32\n    }\n    total\n} 파일 쓰기와 읽기 ¶ TAM 복사 // exit: 5\nuse tam.os\n\nfn main() i32 {\n    let path = \"/tmp/tam_by_example.txt\"\n    match os::write_file(path, \"hello\") {\n        Ok(_n) => {}\n        Err(e) => { return e }\n    }\n    match os::read_file(path) {\n        Ok(text) => text.len as i32\n        Err(e) => e\n    }\n} 없는 파일 ¶ TAM 복사 // exit: 2\nuse tam.os\n\nfn main() i32 {\n    match os::read_file(\"/no/such/file\") {\n        Ok(_t) => 0\n        Err(e) => e              // ENOENT\n    }\n} 걸린 시간 재기 ¶ TAM 복사 // exit: 0\nuse tam.os\n\nfn main() i32 {\n    let t0 = os::time_ms()\n    mut x: u64 = 0\n    for i in 0..1000 { x += i as u64 }\n    let t1 = os::time_ms()\n    if t1 < t0 { return 1 }\n    if x != 499500 { return 2 }\n    0\n}", "source": "docs/by-example/05-strings-io.md"}, {"key": "example-algorithms", "path": "docs/by-example/06-algorithms.md", "nav": "알고리즘", "title": "6. 알고리즘 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"6-알고리즘\" id=\"example-algorithms--6-알고리즘\">6. 알고리즘<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-algorithms--6-알고리즘\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"최대공약수\" id=\"example-algorithms--최대공약수\">최대공약수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-algorithms--최대공약수\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn gcd(a: i64, b: i64) i64 {\n    mut x = a\n    mut y = b\n    while y != 0 {\n        let t = x % y\n        x = y\n        y = t\n    }\n    x\n}\n\nfn main() i32 { gcd(48, 18) as i32 }\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"피보나치반복\" id=\"example-algorithms--피보나치반복\">피보나치(반복)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-algorithms--피보나치반복\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 55\nfn fib(n: i32) i64 {\n    mut a: i64 = 0\n    mut b: i64 = 1\n    for _i in 0..n {\n        let t = a + b\n        a = b\n        b = t\n    }\n    a\n}\n\nfn main() i32 { fib(10) as i32 }\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"소수-체\" id=\"example-algorithms--소수-체\">소수 체<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-algorithms--소수-체\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 25\nfn main() i32 {\n    mut sieve = [true; 101]\n    mut count = 0\n    for i in 2..101 {\n        if sieve[i] {\n            count += 1\n            mut j = i * i\n            while j &lt; 101 {\n                sieve[j] = false\n                j += i\n            }\n        }\n    }\n    count                      // 100 이하 소수는 25개\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"삽입-정렬\" id=\"example-algorithms--삽입-정렬\">삽입 정렬<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-algorithms--삽입-정렬\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn sort(a: &amp;mut [i32]) {\n    mut i: u64 = 1\n    while i &lt; a.len {\n        let key = a[i]\n        mut j = i\n        while j &gt; 0 &amp;&amp; a[j - 1] &gt; key {\n            a[j] = a[j - 1]\n            j -= 1\n        }\n        a[j] = key\n        i += 1\n    }\n}\n\nfn main() i32 {\n    mut a = [5, 2, 9, 1, 7, 3]\n    sort(&amp;mut a[..])\n    for i in 1..6 {\n        if a[i - 1] &gt; a[i] { return 1 }\n    }\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"이진-탐색\" id=\"example-algorithms--이진-탐색\">이진 탐색<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-algorithms--이진-탐색\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 4\nfn search(a: &amp;[i32], x: i32) Option&lt;u64&gt; {\n    mut lo: u64 = 0\n    mut hi: u64 = a.len\n    while lo &lt; hi {\n        let mid = lo + (hi - lo) / 2\n        if a[mid] == x { return Some(mid) }\n        if a[mid] &lt; x { lo = mid + 1 } else { hi = mid }\n    }\n    None\n}\n\nfn main() i32 {\n    let a = [1, 3, 5, 7, 9, 11]\n    match search(&amp;a, 9) {\n        Some(i) =&gt; i as i32\n        None =&gt; 0 - 1\n    }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"배열-뒤집기\" id=\"example-algorithms--배열-뒤집기\">배열 뒤집기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-algorithms--배열-뒤집기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn reverse(a: &amp;mut [i32]) {\n    if a.len &lt; 2 { return }\n    mut i: u64 = 0\n    mut j: u64 = a.len - 1\n    while i &lt; j {\n        let t = a[i]\n        a[i] = a[j]\n        a[j] = t\n        i += 1\n        j -= 1\n    }\n}\n\nfn main() i32 {\n    mut a = [1, 2, 3, 4]\n    reverse(&amp;mut a[..])\n    if a[0] == 4 &amp;&amp; a[3] == 1 { 0 } else { 1 }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"최대값과-최소값\" id=\"example-algorithms--최대값과-최소값\">최대값과 최소값<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-algorithms--최대값과-최소값\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 8\nfn range(a: &amp;[i32]) i32 {\n    mut lo = a[0]\n    mut hi = a[0]\n    for x in a {\n        if x &lt; lo { lo = x }\n        if x &gt; hi { hi = x }\n    }\n    hi - lo\n}\n\nfn main() i32 {\n    let a = [3, 9, 1, 4]\n    range(&amp;a)\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"거듭제곱제곱하며-곱하기\" id=\"example-algorithms--거듭제곱제곱하며-곱하기\">거듭제곱(제곱하며 곱하기)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-algorithms--거듭제곱제곱하며-곱하기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 243\nfn pow(base: i64, exp: u32) i64 {\n    mut result: i64 = 1\n    mut b = base\n    mut e = exp\n    while e &gt; 0 {\n        if e &amp; 1 == 1 { result *= b }\n        e &gt;&gt;= 1\n        if e &gt; 0 { b *= b }\n    }\n    result\n}\n\nfn main() i32 { pow(3, 5) as i32 }\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"팰린드롬-검사\" id=\"example-algorithms--팰린드롬-검사\">팰린드롬 검사<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-algorithms--팰린드롬-검사\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 1\nfn at(s: str, i: u64) u8 { unsafe { *(s.ptr + i) } }\n\nfn palindrome(s: str) bool {\n    if s.len &lt; 2 { return true }\n    mut i: u64 = 0\n    mut j: u64 = s.len - 1\n    while i &lt; j {\n        if at(s, i) != at(s, j) { return false }\n        i += 1\n        j -= 1\n    }\n    true\n}\n\nfn main() i32 {\n    if palindrome(\"level\") &amp;&amp; !palindrome(\"tam\") { 1 } else { 0 }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"콜라츠-단계-수\" id=\"example-algorithms--콜라츠-단계-수\">콜라츠 단계 수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-algorithms--콜라츠-단계-수\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 111\nfn steps(n: u64) i32 {\n    mut x = n\n    mut c = 0\n    while x != 1 {\n        if x % 2 == 0 { x /= 2 } else { x = 3 * x + 1 }\n        c += 1\n    }\n    c\n}\n\nfn main() i32 { steps(27) }\n</code></pre></div>\n", "text": "6. 알고리즘 ¶ 최대공약수 ¶ TAM 복사 // exit: 6\nfn gcd(a: i64, b: i64) i64 {\n    mut x = a\n    mut y = b\n    while y != 0 {\n        let t = x % y\n        x = y\n        y = t\n    }\n    x\n}\n\nfn main() i32 { gcd(48, 18) as i32 } 피보나치(반복) ¶ TAM 복사 // exit: 55\nfn fib(n: i32) i64 {\n    mut a: i64 = 0\n    mut b: i64 = 1\n    for _i in 0..n {\n        let t = a + b\n        a = b\n        b = t\n    }\n    a\n}\n\nfn main() i32 { fib(10) as i32 } 소수 체 ¶ TAM 복사 // exit: 25\nfn main() i32 {\n    mut sieve = [true; 101]\n    mut count = 0\n    for i in 2..101 {\n        if sieve[i] {\n            count += 1\n            mut j = i * i\n            while j < 101 {\n                sieve[j] = false\n                j += i\n            }\n        }\n    }\n    count                      // 100 이하 소수는 25개\n} 삽입 정렬 ¶ TAM 복사 // exit: 0\nfn sort(a: &mut [i32]) {\n    mut i: u64 = 1\n    while i < a.len {\n        let key = a[i]\n        mut j = i\n        while j > 0 && a[j - 1] > key {\n            a[j] = a[j - 1]\n            j -= 1\n        }\n        a[j] = key\n        i += 1\n    }\n}\n\nfn main() i32 {\n    mut a = [5, 2, 9, 1, 7, 3]\n    sort(&mut a[..])\n    for i in 1..6 {\n        if a[i - 1] > a[i] { return 1 }\n    }\n    0\n} 이진 탐색 ¶ TAM 복사 // exit: 4\nfn search(a: &[i32], x: i32) Option<u64> {\n    mut lo: u64 = 0\n    mut hi: u64 = a.len\n    while lo < hi {\n        let mid = lo + (hi - lo) / 2\n        if a[mid] == x { return Some(mid) }\n        if a[mid] < x { lo = mid + 1 } else { hi = mid }\n    }\n    None\n}\n\nfn main() i32 {\n    let a = [1, 3, 5, 7, 9, 11]\n    match search(&a, 9) {\n        Some(i) => i as i32\n        None => 0 - 1\n    }\n} 배열 뒤집기 ¶ TAM 복사 // exit: 0\nfn reverse(a: &mut [i32]) {\n    if a.len < 2 { return }\n    mut i: u64 = 0\n    mut j: u64 = a.len - 1\n    while i < j {\n        let t = a[i]\n        a[i] = a[j]\n        a[j] = t\n        i += 1\n        j -= 1\n    }\n}\n\nfn main() i32 {\n    mut a = [1, 2, 3, 4]\n    reverse(&mut a[..])\n    if a[0] == 4 && a[3] == 1 { 0 } else { 1 }\n} 최대값과 최소값 ¶ TAM 복사 // exit: 8\nfn range(a: &[i32]) i32 {\n    mut lo = a[0]\n    mut hi = a[0]\n    for x in a {\n        if x < lo { lo = x }\n        if x > hi { hi = x }\n    }\n    hi - lo\n}\n\nfn main() i32 {\n    let a = [3, 9, 1, 4]\n    range(&a)\n} 거듭제곱(제곱하며 곱하기) ¶ TAM 복사 // exit: 243\nfn pow(base: i64, exp: u32) i64 {\n    mut result: i64 = 1\n    mut b = base\n    mut e = exp\n    while e > 0 {\n        if e & 1 == 1 { result *= b }\n        e >>= 1\n        if e > 0 { b *= b }\n    }\n    result\n}\n\nfn main() i32 { pow(3, 5) as i32 } 팰린드롬 검사 ¶ TAM 복사 // exit: 1\nfn at(s: str, i: u64) u8 { unsafe { *(s.ptr + i) } }\n\nfn palindrome(s: str) bool {\n    if s.len < 2 { return true }\n    mut i: u64 = 0\n    mut j: u64 = s.len - 1\n    while i < j {\n        if at(s, i) != at(s, j) { return false }\n        i += 1\n        j -= 1\n    }\n    true\n}\n\nfn main() i32 {\n    if palindrome(\"level\") && !palindrome(\"tam\") { 1 } else { 0 }\n} 콜라츠 단계 수 ¶ TAM 복사 // exit: 111\nfn steps(n: u64) i32 {\n    mut x = n\n    mut c = 0\n    while x != 1 {\n        if x % 2 == 0 { x /= 2 } else { x = 3 * x + 1 }\n        c += 1\n    }\n    c\n}\n\nfn main() i32 { steps(27) }", "source": "docs/by-example/06-algorithms.md"}, {"key": "example-systems", "path": "docs/by-example/07-systems.md", "nav": "시스템 프로그래밍", "title": "7. 시스템 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"7-시스템\" id=\"example-systems--7-시스템\">7. 시스템<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-systems--7-시스템\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"raw-포인터-읽고-쓰기\" id=\"example-systems--raw-포인터-읽고-쓰기\">raw 포인터 읽고 쓰기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-systems--raw-포인터-읽고-쓰기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 8\nfn main() i32 {\n    mut x = 5\n    let p = &amp;mut x as *mut i32\n    unsafe { *p = 8 }\n    x\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"직접-할당과-해제\" id=\"example-systems--직접-할당과-해제\">직접 할당과 해제<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-systems--직접-할당과-해제\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 10\nfn main() i32 {\n    let raw = unsafe { alloc(16) }\n    let p = raw as *mut i32\n    let r = unsafe {\n        *p = 4\n        *(p + 1) = 6\n        let s = *p + *(p + 1)\n        free(raw)\n        s\n    }\n    r\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"포인터-산술은-원소-단위\" id=\"example-systems--포인터-산술은-원소-단위\">포인터 산술은 원소 단위<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-systems--포인터-산술은-원소-단위\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 30\nfn main() i32 {\n    let raw = unsafe { alloc(24) }\n    let p = raw as *mut i64\n    unsafe {\n        for i in 0..3 { *(p + i) = (i as i64 + 1) * 5 }\n    }\n    let r = unsafe { *(p + 1) + *(p + 2) + *p }       // 10 + 15 + 5\n    unsafe { free(raw) }\n    r as i32\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"unsafe를-안전한-api로-감싸기\" id=\"example-systems--unsafe를-안전한-api로-감싸기\">unsafe를 안전한 API로 감싸기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-systems--unsafe를-안전한-api로-감싸기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nstruct Buf { ptr: *mut u8, len: u64 }\n\nimpl Buf {\n    fn new(len: u64) Self {\n        let p = unsafe { alloc(len) }\n        for i in 0..len { unsafe { *(p + i) = 0 } }\n        Buf { ptr: p, len: len }\n    }\n    fn set(&amp;mut self, i: u64, v: u8) {\n        assert(i &lt; self.len)\n        unsafe { *(self.ptr + i) = v }\n    }\n    fn get(&amp;self, i: u64) u8 {\n        assert(i &lt; self.len)\n        unsafe { *(self.ptr + i) }\n    }\n    fn release(self) { unsafe { free(self.ptr) } }\n}\n\nfn main() i32 {\n    mut b = Buf::new(8)\n    b.set(2, 9)\n    let v = b.get(2)\n    b.release()\n    v as i32\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"경계를-넘으면-멈춘다\" id=\"example-systems--경계를-넘으면-멈춘다\">경계를 넘으면 멈춘다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-systems--경계를-넘으면-멈춘다\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: assertion failed\nstruct Buf { len: u64 }\n\nfn check(b: &amp;Buf, i: u64) {\n    assert(i &lt; b.len)\n}\n\nfn main() i32 {\n    let b = Buf { len: 4 }\n    check(&amp;b, 4)\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"c-함수-부르기\" id=\"example-systems--c-함수-부르기\">C 함수 부르기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-systems--c-함수-부르기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nextern \"c\" fn abs(x: i32) i32\n\nfn main() i32 {\n    unsafe { abs(0 - 7) }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"널-종료-문자열을-c에-넘기기\" id=\"example-systems--널-종료-문자열을-c에-넘기기\">널 종료 문자열을 C에 넘기기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-systems--널-종료-문자열을-c에-넘기기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 4\nextern \"c\" fn strlen(s: *const u8) u64\n\nfn main() i32 {\n    let s: [u8; 5] = [116, 97, 109, 99, 0]      // \"tamc\\0\"\n    unsafe { strlen(&amp;s as *const [u8; 5] as *const u8) as i32 }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"감싸는-산술해시\" id=\"example-systems--감싸는-산술해시\">감싸는 산술(해시)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-systems--감싸는-산술해시\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn hash(s: str) u32 {\n    mut h: u32 = 2166136261\n    for i in 0..s.len {\n        let b = unsafe { *(s.ptr + i) } as u32\n        h = wrapping_mul(h ^ b, 16777619)          // FNV-1a\n    }\n    h\n}\n\nfn main() i32 {\n    if hash(\"\") != 2166136261 { return 1 }\n    if hash(\"a\") != 3826002220 { return 2 }\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"unsafe-fn\" id=\"example-systems--unsafe-fn\"><code>unsafe fn</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-systems--unsafe-fn\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nunsafe fn third(p: *const i32) i32 {\n    *(p + 2)                 // 호출자가 최소 3개 원소를 보장한다\n}\n\nfn main() i32 {\n    let a = [1, 2, 3]\n    unsafe { third(&amp;a as *const [i32; 3] as *const i32) }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"베어메탈-uart에-직접-쓰기aarch64\" id=\"example-systems--베어메탈-uart에-직접-쓰기aarch64\">베어메탈: UART에 직접 쓰기(AArch64)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-systems--베어메탈-uart에-직접-쓰기aarch64\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,BOOT=AARCH64<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,boot=aarch64\">// out: tam\nfn put(c: u8) { unsafe { mmio_write8(150994944, c) } }   // 0x09000000\n\nfn main() i32 {\n    put(116)\n    put(97)\n    put(109)\n    put(10)\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"bios-부팅-이미지\" id=\"example-systems--bios-부팅-이미지\">BIOS 부팅 이미지<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-systems--bios-부팅-이미지\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,BOOT=BIOS<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,boot=bios\">// out: booted\nuse tam.os\n\nfn main() i32 {\n    os::println(\"booted\")\n    0\n}\n</code></pre></div>\n", "text": "7. 시스템 ¶ raw 포인터 읽고 쓰기 ¶ TAM 복사 // exit: 8\nfn main() i32 {\n    mut x = 5\n    let p = &mut x as *mut i32\n    unsafe { *p = 8 }\n    x\n} 직접 할당과 해제 ¶ TAM 복사 // exit: 10\nfn main() i32 {\n    let raw = unsafe { alloc(16) }\n    let p = raw as *mut i32\n    let r = unsafe {\n        *p = 4\n        *(p + 1) = 6\n        let s = *p + *(p + 1)\n        free(raw)\n        s\n    }\n    r\n} 포인터 산술은 원소 단위 ¶ TAM 복사 // exit: 30\nfn main() i32 {\n    let raw = unsafe { alloc(24) }\n    let p = raw as *mut i64\n    unsafe {\n        for i in 0..3 { *(p + i) = (i as i64 + 1) * 5 }\n    }\n    let r = unsafe { *(p + 1) + *(p + 2) + *p }       // 10 + 15 + 5\n    unsafe { free(raw) }\n    r as i32\n} unsafe를 안전한 API로 감싸기 ¶ TAM 복사 // exit: 9\nstruct Buf { ptr: *mut u8, len: u64 }\n\nimpl Buf {\n    fn new(len: u64) Self {\n        let p = unsafe { alloc(len) }\n        for i in 0..len { unsafe { *(p + i) = 0 } }\n        Buf { ptr: p, len: len }\n    }\n    fn set(&mut self, i: u64, v: u8) {\n        assert(i < self.len)\n        unsafe { *(self.ptr + i) = v }\n    }\n    fn get(&self, i: u64) u8 {\n        assert(i < self.len)\n        unsafe { *(self.ptr + i) }\n    }\n    fn release(self) { unsafe { free(self.ptr) } }\n}\n\nfn main() i32 {\n    mut b = Buf::new(8)\n    b.set(2, 9)\n    let v = b.get(2)\n    b.release()\n    v as i32\n} 경계를 넘으면 멈춘다 ¶ TAM,TRAP 복사 // panic: assertion failed\nstruct Buf { len: u64 }\n\nfn check(b: &Buf, i: u64) {\n    assert(i < b.len)\n}\n\nfn main() i32 {\n    let b = Buf { len: 4 }\n    check(&b, 4)\n    0\n} C 함수 부르기 ¶ TAM 복사 // exit: 7\nextern \"c\" fn abs(x: i32) i32\n\nfn main() i32 {\n    unsafe { abs(0 - 7) }\n} 널 종료 문자열을 C에 넘기기 ¶ TAM 복사 // exit: 4\nextern \"c\" fn strlen(s: *const u8) u64\n\nfn main() i32 {\n    let s: [u8; 5] = [116, 97, 109, 99, 0]      // \"tamc\\0\"\n    unsafe { strlen(&s as *const [u8; 5] as *const u8) as i32 }\n} 감싸는 산술(해시) ¶ TAM 복사 // exit: 0\nfn hash(s: str) u32 {\n    mut h: u32 = 2166136261\n    for i in 0..s.len {\n        let b = unsafe { *(s.ptr + i) } as u32\n        h = wrapping_mul(h ^ b, 16777619)          // FNV-1a\n    }\n    h\n}\n\nfn main() i32 {\n    if hash(\"\") != 2166136261 { return 1 }\n    if hash(\"a\") != 3826002220 { return 2 }\n    0\n} unsafe fn ¶ TAM 복사 // exit: 3\nunsafe fn third(p: *const i32) i32 {\n    *(p + 2)                 // 호출자가 최소 3개 원소를 보장한다\n}\n\nfn main() i32 {\n    let a = [1, 2, 3]\n    unsafe { third(&a as *const [i32; 3] as *const i32) }\n} 베어메탈: UART에 직접 쓰기(AArch64) ¶ TAM,BOOT=AARCH64 복사 // out: tam\nfn put(c: u8) { unsafe { mmio_write8(150994944, c) } }   // 0x09000000\n\nfn main() i32 {\n    put(116)\n    put(97)\n    put(109)\n    put(10)\n    0\n} BIOS 부팅 이미지 ¶ TAM,BOOT=BIOS 복사 // out: booted\nuse tam.os\n\nfn main() i32 {\n    os::println(\"booted\")\n    0\n}", "source": "docs/by-example/07-systems.md"}, {"key": "example-projects", "path": "docs/by-example/08-projects.md", "nav": "프로젝트", "title": "8. 모듈과 프로젝트 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"8-모듈과-프로젝트\" id=\"example-projects--8-모듈과-프로젝트\">8. 모듈과 프로젝트<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-projects--8-모듈과-프로젝트\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"파일-나누기\" id=\"example-projects--파일-나누기\">파일 나누기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-projects--파일-나누기\">¶</a></h2>\n<p><code>use geo.shapes</code>는 <code>src/geo/shapes.tam</code>을 불러온다. 쓰려면 <code>pub</code>이어야 한다.</p>\n<p>&lt;!-- project run exit=10 --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use geo.shapes\n\nfn main() i32 {\n    let s = shapes::Square { side: 3 }\n    shapes::area(&amp;s) + 1\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/GEO/SHAPES.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/geo/shapes.tam\">pub struct Square { side: i32 }\n\npub fn area(s: &amp;Square) i32 { s.side * s.side }\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<h2 class=\"doc-heading\" data-slug=\"비공개-항목은-밖에서-못-쓴다\" id=\"example-projects--비공개-항목은-밖에서-못-쓴다\">비공개 항목은 밖에서 못 쓴다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-projects--비공개-항목은-밖에서-못-쓴다\">¶</a></h2>\n<p>&lt;!-- project fail=private --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use util\n\nfn main() i32 { util::hidden() }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/UTIL.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/util.tam\">fn hidden() i32 { 1 }\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<h2 class=\"doc-heading\" data-slug=\"라이브러리-의존성\" id=\"example-projects--라이브러리-의존성\">라이브러리 의존성<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-projects--라이브러리-의존성\">¶</a></h2>\n<p>&lt;!-- project run exit=42 --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nmath-kit = { path = \"../math-kit\" }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use math_kit\n\nfn main() i32 {\n    math_kit::square(6) + math_kit::double(3)\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=MATH-KIT/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=math-kit/Tmake.toml\">[package]\nname = \"math-kit\"\nversion = \"0.1.0\"\nkind = \"lib\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=MATH-KIT/SRC/LIB.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=math-kit/src/lib.tam\">pub fn square(x: i32) i32 { x * x }\npub fn double(x: i32) i32 { x * 2 }\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<h2 class=\"doc-heading\" data-slug=\"모듈-안의-모듈-불러오기\" id=\"example-projects--모듈-안의-모듈-불러오기\">모듈 안의 모듈 불러오기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-projects--모듈-안의-모듈-불러오기\">¶</a></h2>\n<p>모듈에서도 <code>use</code>를 쓴다. 경로는 항상 루트(<code>src/</code>) 기준이다.</p>\n<p>&lt;!-- project run exit=9 --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use calc\n\nfn main() i32 { calc::nine() }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/CALC.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/calc.tam\">use base.num\n\npub fn nine() i32 { num::three() * num::three() }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/BASE/NUM.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/base/num.tam\">pub fn three() i32 { 3 }\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<h2 class=\"doc-heading\" data-slug=\"순환하는-use도-허용된다\" id=\"example-projects--순환하는-use도-허용된다\">순환하는 <code>use</code>도 허용된다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-projects--순환하는-use도-허용된다\">¶</a></h2>\n<p>&lt;!-- project run exit=2 --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use even\nfn main() i32 { if even::is_even(10) { 2 } else { 3 } }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/EVEN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/even.tam\">use odd\npub fn is_even(n: i32) bool { if n == 0 { true } else { odd::is_odd(n - 1) } }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/ODD.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/odd.tam\">use even\npub fn is_odd(n: i32) bool { if n == 0 { false } else { even::is_even(n - 1) } }\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<h2 class=\"doc-heading\" data-slug=\"워크스페이스\" id=\"example-projects--워크스페이스\">워크스페이스<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-projects--워크스페이스\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml\">[workspace]\nmembers = [\"app\", \"libs/*\"]\ndefault-members = [\"app\"]\n\n[workspace.dependencies]\ncore = { path = \"libs/core\" }\n</code></pre></div>\n<p>완전한 워크스페이스 예제는 저장소의 <code>examples/project/</code>에 있다. <code>tamc tree</code>로 의존성 트리를, <code>tamc metadata</code>로 JSON 요약을 본다.</p>\n<h2 class=\"doc-heading\" data-slug=\"프로필과-대상\" id=\"example-projects--프로필과-대상\">프로필과 대상<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-projects--프로필과-대상\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml\">[profile.release]\nopt-level = 2\n\n[build]\ntarget = \"host\"\n\n[target.windows]\nout-name = \"app\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc build --release\n$ tamc build --target windows\n</code></pre></div>\n", "text": "8. 모듈과 프로젝트 ¶ 파일 나누기 ¶ use geo.shapes 는 src/geo/shapes.tam 을 불러온다. 쓰려면 pub 이어야 한다. <!-- project run exit=10 --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\" TAM,FILE=APP/SRC/MAIN.TAM 복사 use geo.shapes\n\nfn main() i32 {\n    let s = shapes::Square { side: 3 }\n    shapes::area(&s) + 1\n} TAM,FILE=APP/SRC/GEO/SHAPES.TAM 복사 pub struct Square { side: i32 }\n\npub fn area(s: &Square) i32 { s.side * s.side } <!-- /project --> 비공개 항목은 밖에서 못 쓴다 ¶ <!-- project fail=private --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\" TAM,FILE=APP/SRC/MAIN.TAM 복사 use util\n\nfn main() i32 { util::hidden() } TAM,FILE=APP/SRC/UTIL.TAM 복사 fn hidden() i32 { 1 } <!-- /project --> 라이브러리 의존성 ¶ <!-- project run exit=42 --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nmath-kit = { path = \"../math-kit\" } TAM,FILE=APP/SRC/MAIN.TAM 복사 use math_kit\n\nfn main() i32 {\n    math_kit::square(6) + math_kit::double(3)\n} TOML,FILE=MATH-KIT/TMAKE.TOML 복사 [package]\nname = \"math-kit\"\nversion = \"0.1.0\"\nkind = \"lib\" TAM,FILE=MATH-KIT/SRC/LIB.TAM 복사 pub fn square(x: i32) i32 { x * x }\npub fn double(x: i32) i32 { x * 2 } <!-- /project --> 모듈 안의 모듈 불러오기 ¶ 모듈에서도 use 를 쓴다. 경로는 항상 루트( src/ ) 기준이다. <!-- project run exit=9 --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\" TAM,FILE=APP/SRC/MAIN.TAM 복사 use calc\n\nfn main() i32 { calc::nine() } TAM,FILE=APP/SRC/CALC.TAM 복사 use base.num\n\npub fn nine() i32 { num::three() * num::three() } TAM,FILE=APP/SRC/BASE/NUM.TAM 복사 pub fn three() i32 { 3 } <!-- /project --> 순환하는 use 도 허용된다 ¶ <!-- project run exit=2 --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\" TAM,FILE=APP/SRC/MAIN.TAM 복사 use even\nfn main() i32 { if even::is_even(10) { 2 } else { 3 } } TAM,FILE=APP/SRC/EVEN.TAM 복사 use odd\npub fn is_even(n: i32) bool { if n == 0 { true } else { odd::is_odd(n - 1) } } TAM,FILE=APP/SRC/ODD.TAM 복사 use even\npub fn is_odd(n: i32) bool { if n == 0 { false } else { even::is_even(n - 1) } } <!-- /project --> 워크스페이스 ¶ TOML 복사 [workspace]\nmembers = [\"app\", \"libs/*\"]\ndefault-members = [\"app\"]\n\n[workspace.dependencies]\ncore = { path = \"libs/core\" } 완전한 워크스페이스 예제는 저장소의 examples/project/ 에 있다. tamc tree 로 의존성 트리를, tamc metadata 로 JSON 요약을 본다. 프로필과 대상 ¶ TOML 복사 [profile.release]\nopt-level = 2\n\n[build]\ntarget = \"host\"\n\n[target.windows]\nout-name = \"app\" CONSOLE 복사 $ tamc build --release\n$ tamc build --target windows", "source": "docs/by-example/08-projects.md"}, {"key": "example-generics-and-constants", "path": "docs/by-example/09-generics-and-constants.md", "nav": "제네릭과 상수", "title": "9. 상수, 제네릭, 루프 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"9-상수-제네릭-루프\" id=\"example-generics-and-constants--9-상수-제네릭-루프\">9. 상수, 제네릭, 루프<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-generics-and-constants--9-상수-제네릭-루프\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"상수\" id=\"example-generics-and-constants--상수\">상수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-generics-and-constants--상수\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 14\nconst N: i32 = 4\nconst MASK: u32 = 0xFF &amp; 0x0F\nconst DOUBLE: i32 = N * 2\n\nfn main() i32 {\n    let a = [1; N]                    // 길이 4\n    let m = MASK as i32               // 15\n    DOUBLE + a[3] + m - 10            // 8 + 1 + 15 - 10\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"상수로-배열-길이\" id=\"example-generics-and-constants--상수로-배열-길이\">상수로 배열 길이<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-generics-and-constants--상수로-배열-길이\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 10\nconst LEN: i32 = 5\n\nfn sum(a: &amp;[i32; LEN]) i32 {\n    mut s = 0\n    for x in &amp;a[..] { s += x }\n    s\n}\n\nfn main() i32 {\n    let a = [2; LEN]\n    sum(&amp;a)\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"loop\" id=\"example-generics-and-constants--loop\"><code>loop</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-generics-and-constants--loop\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 8\nfn main() i32 {\n    mut n = 0\n    loop {\n        n += 2\n        if n &gt; 7 { break }\n    }\n    n\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"블록-주석\" id=\"example-generics-and-constants--블록-주석\">블록 주석<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-generics-and-constants--블록-주석\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\n/* 앞 /* 중첩 */ 뒤 */\nfn main() i32 { 1 /* 중간 */ + 2 }\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"제네릭-함수\" id=\"example-generics-and-constants--제네릭-함수\">제네릭 함수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-generics-and-constants--제네릭-함수\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nfn max&lt;T&gt;(a: T, b: T) T {\n    if a &gt; b { a } else { b }\n}\n\nfn main() i32 {\n    let x: i64 = max(5, 7)\n    max&lt;f64&gt;(1.5, 0.5) as i32 + max(3, 9) + x as i32 - 8\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"제네릭-구조체\" id=\"example-generics-and-constants--제네릭-구조체\">제네릭 구조체<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-generics-and-constants--제네릭-구조체\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nstruct Pair&lt;A, B&gt; {\n    first: A,\n    second: B,\n}\n\nimpl Pair&lt;A, B&gt; {\n    fn new(a: A, b: B) Self { Pair { first: a, second: b } }\n    fn swap(self) Pair&lt;B, A&gt; { Pair { first: self.second, second: self.first } }\n}\n\nfn main() i32 {\n    let p = Pair::new(3, 4)\n    let q = p.swap()\n    q.first + q.second - 4 + 4\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"제네릭과-string\" id=\"example-generics-and-constants--제네릭과-string\">제네릭과 <code>String</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-generics-and-constants--제네릭과-string\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nstruct Holder&lt;T&gt; { v: T }\n\nimpl Holder&lt;T&gt; {\n    fn new(v: T) Self { Holder { v: v } }\n    fn get(&amp;self) &amp;T { &amp;self.v }\n}\n\nfn main() i32 {\n    let h = Holder::new(string_from(\"hello\"))\n    let s = h.get()\n    s.len as i32\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"인스턴스-오류\" id=\"example-generics-and-constants--인스턴스-오류\">인스턴스 오류<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-generics-and-constants--인스턴스-오류\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: operator `&gt;` cannot be applied to `P`\nstruct P { x: i32 }\n\nfn max&lt;T&gt;(a: T, b: T) T { if a &gt; b { a } else { b } }\n\nfn main() i32 {\n    max(P { x: 1 }, P { x: 2 }).x\n}\n</code></pre></div>\n", "text": "9. 상수, 제네릭, 루프 ¶ 상수 ¶ TAM 복사 // exit: 14\nconst N: i32 = 4\nconst MASK: u32 = 0xFF & 0x0F\nconst DOUBLE: i32 = N * 2\n\nfn main() i32 {\n    let a = [1; N]                    // 길이 4\n    let m = MASK as i32               // 15\n    DOUBLE + a[3] + m - 10            // 8 + 1 + 15 - 10\n} 상수로 배열 길이 ¶ TAM 복사 // exit: 10\nconst LEN: i32 = 5\n\nfn sum(a: &[i32; LEN]) i32 {\n    mut s = 0\n    for x in &a[..] { s += x }\n    s\n}\n\nfn main() i32 {\n    let a = [2; LEN]\n    sum(&a)\n} loop ¶ TAM 복사 // exit: 8\nfn main() i32 {\n    mut n = 0\n    loop {\n        n += 2\n        if n > 7 { break }\n    }\n    n\n} 블록 주석 ¶ TAM 복사 // exit: 3\n/* 앞 /* 중첩 */ 뒤 */\nfn main() i32 { 1 /* 중간 */ + 2 } 제네릭 함수 ¶ TAM 복사 // exit: 9\nfn max<T>(a: T, b: T) T {\n    if a > b { a } else { b }\n}\n\nfn main() i32 {\n    let x: i64 = max(5, 7)\n    max<f64>(1.5, 0.5) as i32 + max(3, 9) + x as i32 - 8\n} 제네릭 구조체 ¶ TAM 복사 // exit: 7\nstruct Pair<A, B> {\n    first: A,\n    second: B,\n}\n\nimpl Pair<A, B> {\n    fn new(a: A, b: B) Self { Pair { first: a, second: b } }\n    fn swap(self) Pair<B, A> { Pair { first: self.second, second: self.first } }\n}\n\nfn main() i32 {\n    let p = Pair::new(3, 4)\n    let q = p.swap()\n    q.first + q.second - 4 + 4\n} 제네릭과 String ¶ TAM 복사 // exit: 5\nstruct Holder<T> { v: T }\n\nimpl Holder<T> {\n    fn new(v: T) Self { Holder { v: v } }\n    fn get(&self) &T { &self.v }\n}\n\nfn main() i32 {\n    let h = Holder::new(string_from(\"hello\"))\n    let s = h.get()\n    s.len as i32\n} 인스턴스 오류 ¶ TAM,ERROR 복사 // error: operator `>` cannot be applied to `P`\nstruct P { x: i32 }\n\nfn max<T>(a: T, b: T) T { if a > b { a } else { b } }\n\nfn main() i32 {\n    max(P { x: 1 }, P { x: 2 }).x\n}", "source": "docs/by-example/09-generics-and-constants.md"}, {"key": "ref-reference", "path": "docs/reference.md", "nav": "언어 레퍼런스", "title": "The TAM Reference ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"the-tam-reference\" id=\"ref-reference--the-tam-reference\">The TAM Reference<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--the-tam-reference\">¶</a></h1>\n<p>이 문서는 TAM 언어의 <strong>규범적 정의</strong>다. 문법, 타입, 평가 규칙, 소유권과 빌림 규칙, 오류와 trap의 동작을 빠짐없이 적는다. 언어를 처음 배운다면 <a href=\"#doc-book-index\">The TAM Book</a>을, 예제로 익히려면 <a href=\"#doc-examples-index\">TAM by Example</a>을 먼저 보라.</p>\n<ul>\n<li>대상 버전: <code>tamc 1.0</code></li>\n<li>이 문서의 모든 <code>tam</code> 코드 블록은 개발 중 검증 도구가 실제로 컴파일하고 실행해 검증한다(출력과 종료 코드 포함). 블록 아래의 <code>// exit:</code>, <code>// out:</code>, <code>// error:</code> 주석이 그 기대값이다.</li>\n<li>\"구현이 보장한다\"고 적은 동작은 테스트로 고정되어 있다. \"정해지지 않았다\"고 적은 것은 바뀔 수 있으니 기대지 말 것.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"목차\" id=\"ref-reference--목차\">목차<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--목차\">¶</a></h2>\n<ol>\n<li><a href=\"#doc-ref-reference--1-소스-파일과-어휘-구조\">소스 파일과 어휘 구조</a></li>\n<li><a href=\"#doc-ref-reference--2-항목items\">항목(Items)</a></li>\n<li><a href=\"#doc-ref-reference--3-타입\">타입</a></li>\n<li><a href=\"#doc-ref-reference--4-표현식\">표현식</a></li>\n<li><a href=\"#doc-ref-reference--5-문장\">문장</a></li>\n<li><a href=\"#doc-ref-reference--6-match와-패턴\"><code>match</code>와 패턴</a></li>\n<li><a href=\"#doc-ref-reference--7-이름-해석과-모듈\">이름 해석과 모듈</a></li>\n<li><a href=\"#doc-ref-reference--8-소유권-이동-자동-해제\">소유권, 이동, 자동 해제</a></li>\n<li><a href=\"#doc-ref-reference--9-빌림-규칙\">빌림 규칙</a></li>\n<li><a href=\"#doc-ref-reference--10-수치-의미-오버플로-변환-시프트\">수치 의미: 오버플로, 변환, 시프트</a></li>\n<li><a href=\"#doc-ref-reference--11-unsafe와-raw-포인터\"><code>unsafe</code>와 raw 포인터</a></li>\n<li><a href=\"#doc-ref-reference--12-프로그램-실행-진입점-종료-패닉-trap\">프로그램 실행: 진입점, 종료, 패닉, trap</a></li>\n<li><a href=\"#doc-ref-reference--13-컴파일-대상\">컴파일 대상</a></li>\n<li><a href=\"#doc-ref-reference--14-내장-함수\">내장 함수</a></li>\n<li><a href=\"#doc-ref-reference--15-구현-한계\">구현 한계</a></li>\n<li><a href=\"#doc-ref-reference--16-문법-요약ebnf\">문법 요약(EBNF)</a></li>\n<li><a href=\"#doc-ref-reference--17-아직-없는-것\">아직 없는 것</a></li>\n<li><a href=\"#doc-ref-reference--18-호환성-약속-tam-1\">호환성 약속: TAM 1</a></li>\n</ol>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"1-소스-파일과-어휘-구조\" id=\"ref-reference--1-소스-파일과-어휘-구조\">1. 소스 파일과 어휘 구조<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--1-소스-파일과-어휘-구조\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"11-소스-파일\" id=\"ref-reference--11-소스-파일\">1.1 소스 파일<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--11-소스-파일\">¶</a></h3>\n<ul>\n<li>소스 파일의 확장자는 <code>.tam</code>, 인코딩은 <strong>UTF-8</strong>이다. 유효하지 않은 UTF-8은 <code>cannot read ...: stream did not contain valid UTF-8</code> 오류다.</li>\n<li>파일 맨 앞의 UTF-8 BOM(<code>U+FEFF</code>)은 무시한다.</li>\n<li>줄 끝은 <code>\\n</code> 또는 <code>\\r\\n</code>이다.</li>\n<li>파일 하나가 모듈 하나다(<a href=\"#doc-ref-reference--7-이름-해석과-모듈\">7장</a>).</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"12-주석\" id=\"ref-reference--12-주석\">1.2 주석<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--12-주석\">¶</a></h3>\n<p>주석은 두 가지다.</p>\n<ul>\n<li><code>//</code>에서 줄 끝까지.</li>\n<li><code>/* ... */</code> 블록 주석. <strong>중첩할 수 있다</strong>(<code>/* a /* b */ c */</code>는 하나의 주석). 닫히지 않으면 <code>unterminated block comment</code> 오류다.</li>\n</ul>\n<p>블록 주석은 공백으로 취급한다. 단, <strong>줄이 바뀌는 블록 주석은 문장을 끝내는 줄바꿈 하나</strong>로 취급한다(문장은 줄바꿈으로 끝나기 때문이다, <a href=\"#doc-ref-reference--17-줄바꿈과-문장의-끝\">1.7절</a>).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// 이것은 주석이다.\n/* 이것도 /* 중첩된 */ 주석이다. */\nfn main() i32 {\n    let x = 1 // 줄 끝 주석\n    let y = 2 /* 문장 안의 주석 */ + 3\n    /* 여러 줄에\n       걸친 주석 */\n    x + y - 6\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"13-식별자\" id=\"ref-reference--13-식별자\">1.3 식별자<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--13-식별자\">¶</a></h3>\n<p>식별자는 ASCII 영문자 또는 <code>_</code>로 시작하고 ASCII 영문자, 숫자, <code>_</code>가 이어진다. 대소문자를 구분한다. 관례는 함수·변수 <code>snake_case</code>, 구조체 <code>PascalCase</code>다(컴파일러가 강제하지는 않는다).</p>\n<h3 class=\"doc-heading\" data-slug=\"14-키워드\" id=\"ref-reference--14-키워드\">1.4 키워드<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--14-키워드\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>as break const continue else extern false fn for if impl in let\nloop match mut pub return struct true unsafe use while\n</code></pre></div>\n<p><code>const</code>는 전역 상수 선언(<a href=\"#doc-ref-reference--26-const-전역-상수\">2.6절</a>)과 포인터 타입(<code>*const T</code>)에 쓰인다.</p>\n<p><code>Ok</code>, <code>Err</code>, <code>Some</code>, <code>None</code>, <code>Result</code>, <code>Option</code>, <code>Self</code>, <code>self</code>와 <a href=\"#doc-ref-reference--14-내장-함수\">14장</a>의 내장 함수 이름은 예약된 이름이다. 내장 함수와 같은 이름의 함수를 정의하면 <code> `string_from` is a built-in function and cannot be redefined</code> 같은 오류가 난다(단, <code>wrapping_add</code>/<code>wrapping_sub</code>/<code>wrapping_mul</code>은 사용자 정의가 우선한다).</p>\n<h3 class=\"doc-heading\" data-slug=\"15-리터럴\" id=\"ref-reference--15-리터럴\">1.5 리터럴<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--15-리터럴\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th>종류</th>\n<th>예</th>\n<th>타입</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>10진 정수</td>\n<td><code>42</code>, <code>1_000_000</code></td>\n<td>문맥에서 정해지는 정수형. 정해지지 않으면 <code>i32</code></td>\n</tr>\n<tr>\n<td>16/8/2진 정수</td>\n<td><code>0xFF</code>, <code>0o17</code>, <code>0b1010_0001</code></td>\n<td>위와 같음</td>\n</tr>\n<tr>\n<td>실수</td>\n<td><code>1.5</code>, <code>2.0</code>, <code>1e3</code>, <code>1.5e-2</code></td>\n<td><code>f64</code></td>\n</tr>\n<tr>\n<td>문자</td>\n<td><code>'a'</code>, <code>'\\n'</code></td>\n<td>정수(문맥이 없으면 <code>i32</code>). 값은 ASCII/코드 포인트</td>\n</tr>\n<tr>\n<td>문자열</td>\n<td><code>\"hello\\n\"</code></td>\n<td><code>str</code></td>\n</tr>\n<tr>\n<td>불리언</td>\n<td><code>true</code>, <code>false</code></td>\n<td><code>bool</code></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>정수 리터럴의 <code>_</code>는 자릿수 구분용이며 무시된다. 값의 범위는 <strong><code>u64</code> 최댓값까지</strong> 쓸 수 있다(<code>0xFFFF_FFFF_FFFF_FFFF</code>). 그보다 크면 <code>integer literal out of range</code> 오류다.</li>\n<li>정수 리터럴이 놓인 자리의 타입에 값이 들어가지 않으면 컴파일 오류다(<code>let x: u8 = 300</code>은 <code>integer literal out of range for u8</code>).</li>\n<li><code>-</code>는 리터럴의 일부가 아니라 단항 연산자다. 단, 각 타입의 최솟값(<code>-128</code> for <code>i8</code>, <code>-9223372036854775808</code> for <code>i64</code>)은 올바르게 쓸 수 있다.</li>\n<li>문자열 이스케이프: <code>\\n</code> <code>\\t</code> <code>\\r</code> <code>\\0</code> <code>\\\\</code> <code>\\\"</code>. 문자 리터럴은 추가로 <code>\\'</code>를 쓴다. 그 밖의 이스케이프는 <code>unknown escape sequence</code> 오류다. 유니코드 이스케이프는 없다. 문자열은 UTF-8 바이트 그대로 저장된다(<code>\"한\".len</code>은 3).</li>\n<li>문자열 리터럴은 줄을 넘길 수 없다(<code>unterminated string literal</code>).</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let a = 1_000 + 0xff + 0b101 + 0o17 // 1000 + 255 + 5 + 15\n    if a != 1275 { return 1 }\n    if \"한\".len != 3 { return 2 }\n    if 'A' as i32 != 65 { return 3 }\n    let big: u64 = 0xFFFF_FFFF_FFFF_FFFF\n    if big != ~0 { return 4 }\n    0\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: integer literal out of range for `u8`\nfn main() i32 {\n    let x: u8 = 300\n    0\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"16-연산자와-구분자\" id=\"ref-reference--16-연산자와-구분자\">1.6 연산자와 구분자<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--16-연산자와-구분자\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>+  -  *  /  %  &amp;  |  ^  ~  &lt;&lt;  &gt;&gt;\n== != &lt;  &lt;= &gt;  &gt;=  &amp;&amp;  ||  !\n=  += -= *= /= %= &amp;= |= ^= &lt;&lt;= &gt;&gt;=\n.  ..  ..=  ,  :  ::  ;  ?  =&gt;\n( ) [ ] { }\n</code></pre></div>\n<p><code>&gt;&gt;</code>는 렉서가 한 토큰으로 만들지 않고, 파서가 <strong>맞붙은</strong> <code>&gt;</code> 두 개를 오른쪽 시프트로 읽는다. 덕분에 <code>Result&lt;Result&lt;i32, i32&gt;, i32&gt;</code>의 <code>&gt;&gt;</code>가 타입을 닫는다. <code>a &gt; &gt; b</code>처럼 띄우면 시프트가 아니다.</p>\n<p><code>&amp;&amp;</code>는 논리곱 연산자이지만, 타입과 단항 위치에서는 <code>&amp; &amp;</code>로 읽는다(<code>&amp;&amp;T</code>는 <code>&amp;(&amp;T)</code>, <code>&amp;&amp;x</code>는 <code>&amp;(&amp;x)</code>).</p>\n<h3 class=\"doc-heading\" data-slug=\"17-줄바꿈과-문장의-끝\" id=\"ref-reference--17-줄바꿈과-문장의-끝\">1.7 줄바꿈과 문장의 끝<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--17-줄바꿈과-문장의-끝\">¶</a></h3>\n<p>TAM은 세미콜론이 없다. <strong>줄바꿈이 문장의 끝</strong>이고, <code>;</code>는 한 줄에 여러 문장을 둘 때의 구분자로만 허용된다(줄 끝의 <code>;</code>도 허용된다).</p>\n<p>한 문장은 다음 경우에 다음 줄로 이어진다.</p>\n<ol>\n<li>줄이 이항 연산자, <code>,</code>, <code>(</code>, <code>[</code>, <code>{</code>로 끝난다.</li>\n<li>다음 줄이 <code>.</code>으로 시작한다(메서드 체인).</li>\n</ol>\n<p>그 외에는 줄바꿈이 문장의 끝이다. 특히 <strong>다음 줄이 연산자로 시작하는 것은 이어짐이 아니다</strong>.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn add(a: i32, b: i32) i32 { a + b }\n\nfn main() i32 {\n    let a = [\n        1,\n        2,\n    ]\n    let total = a[0] +\n        a[1] +\n        3\n    add(\n        total,\n        0,\n    )\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: expected an expression, found `+`\nfn main() i32 {\n    let y = 1\n        + 3\n    y\n}\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"2-항목items\" id=\"ref-reference--2-항목items\">2. 항목(Items)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--2-항목items\">¶</a></h2>\n<p>파일의 최상위에는 함수, 구조체, <code>const</code>, <code>impl</code> 블록, <code>use</code> 선언만 둘 수 있다. 전역 <strong>변수</strong>는 없다(상수만 있다). 항목은 선언 순서와 무관하게 파일 전체에서 보인다(앞에서 뒤의 함수를 호출할 수 있다).</p>\n<h3 class=\"doc-heading\" data-slug=\"21-함수\" id=\"ref-reference--21-함수\">2.1 함수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--21-함수\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>function  = [ \"pub\" ] [ \"unsafe\" ] \"fn\" name \"(\" [ params ] \")\" [ type ] block\nparams    = param { \",\" param } [ \",\" ]\nparam     = name \":\" type\n</code></pre></div>\n<ul>\n<li>반환 타입은 매개변수 목록 뒤에 <strong>화살표 없이</strong> 쓴다. 생략하면 값이 없는 함수다(타입 표기가 없는 \"단위\" 함수. 호출 결과를 변수에 묶을 수 없다).</li>\n<li>본문 블록의 <strong>마지막 표현식이 반환값</strong>이다. <code>return</code>은 조기 반환에 쓴다.</li>\n<li>매개변수는 불변이다. 값을 바꾸려면 본문에서 <code>mut 이름 = 이름</code>으로 다시 묶는다.</li>\n<li>함수는 재귀할 수 있다. 상호 재귀도 된다.</li>\n<li>같은 이름의 함수를 두 번 정의하면 오류다.</li>\n<li><code>pub</code>은 다른 모듈에서 보이게 한다(<a href=\"#doc-ref-reference--7-이름-해석과-모듈\">7장</a>).</li>\n<li><code>unsafe fn</code>은 <code>unsafe</code> 블록이나 다른 <code>unsafe fn</code> 안에서만 호출할 수 있다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nfn bump(x: &amp;mut i32) {\n    *x += 1\n    if *x &gt; 100 { return }\n    *x += 1\n}\n\nfn fact(n: i64) i64 { if n &lt;= 1 { 1 } else { n * fact(n - 1) } }\n\nfn main() i32 {\n    mut v = 1\n    bump(&amp;mut v)\n    v + fact(3) as i32 - 2 // 3 + 6 - 2\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"22-구조체\" id=\"ref-reference--22-구조체\">2.2 구조체<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--22-구조체\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>struct = [ \"pub\" ] \"struct\" name \"{\" [ field { sep field } [ sep ] ] \"}\"\nfield  = name \":\" type\nsep    = \",\" | newline\n</code></pre></div>\n<ul>\n<li>필드는 쉼표나 줄바꿈으로 구분한다(둘 다 가능하고 끝의 쉼표는 선택).</li>\n<li><strong>필드는 항상 공개</strong>다. 필드 단위의 <code>pub</code>은 없다. 구조체 이름의 <code>pub</code>만 모듈 밖 사용 여부를 정한다.</li>\n<li>구조체 값은 <strong>이동 타입</strong>이다(필드가 모두 정수여도). 복사는 필드를 직접 읽어 새로 만든다(<a href=\"#doc-ref-reference--8-소유권-이동-자동-해제\">8장</a>).</li>\n<li>구조체 리터럴은 모든 필드를 한 번씩, 순서 무관하게 쓴다. 필드 약식(<code>P { x }</code>)은 없다.</li>\n<li>구조체는 자기 자신을 필드로 가질 수 없다(크기가 무한). 다른 구조체, 배열, <code>String</code>, <code>Result</code>/<code>Option</code>, 참조, 포인터를 필드로 가질 수 있다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nstruct Point {\n    x: i32,\n    y: i32,\n}\n\nstruct Rect {\n    min: Point\n    max: Point\n}\n\nfn main() i32 {\n    let r = Rect { max: Point { x: 4, y: 5 }, min: Point { x: 1, y: 2 } }\n    (r.max.x - r.min.x) + (r.max.y - r.min.y)\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"23-impl\" id=\"ref-reference--23-impl\">2.3 <code>impl</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--23-impl\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>impl = \"impl\" name \"{\" { [ \"pub\" ] function } \"}\"\n</code></pre></div>\n<ul>\n<li><code>impl T { ... }</code>는 같은 <strong>파일에 선언된 구조체</strong> <code>T</code>에만 붙일 수 있다. 제네릭도 트레이트도 없다.</li>\n<li>첫 매개변수가 <code>&amp;self</code>, <code>&amp;mut self</code>, <code>self</code>(값)이면 <strong>메서드</strong>, 아니면 <strong>연관 함수</strong>다. <code>Self</code>는 <code>T</code>를 뜻한다. <code>self</code> 매개변수에는 타입을 쓰지 않는다.</li>\n<li>호출: 메서드는 <code>값.이름(인자)</code>, 연관 함수는 <code>T::이름(인자)</code>, 다른 모듈의 것은 <code>모듈::T::이름(인자)</code>.</li>\n<li>값에 <code>&amp;self</code>/<code>&amp;mut self</code> 메서드를 부르면 자동으로 빌린다(<code>&amp;mut self</code>는 변수, 필드, 배열 원소가 가변일 때). 이미 <code>&amp;mut T</code>인 값이면 그대로 넘긴다(재차용). <code>&amp;T</code>로는 <code>&amp;mut self</code> 메서드를 부를 수 없다. <code>self</code>(값) 메서드는 값을 <strong>이동</strong>하며 참조 너머로는 부를 수 없다.</li>\n<li>메서드는 <code>T::메서드(&amp;값, ...)</code>로도 부를 수 있다.</li>\n<li><code>pub</code>은 함수마다 붙인다(<code>impl</code>에는 붙일 수 없다). 다른 모듈에서는 <code>pub</code> 없는 메서드와 연관 함수를 부를 수 없다.</li>\n<li>임시값(<code>make().get()</code>)에는 <code>&amp;self</code> 메서드를 직접 부를 수 없다. 변수에 먼저 묶는다.</li>\n<li>메서드 이름은 필드 이름과 같아도 된다(<code>p.x</code>와 <code>p.x()</code>는 다르다).</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 50\nstruct Buf {\n    data: String,\n    n: i32,\n}\n\nimpl Buf {\n    fn new(s: str) Self { Buf { data: string_from(s), n: 0 } }\n    fn add(&amp;mut self, c: u8) { string_push(&amp;mut self.data, c); self.n += 1 }\n    fn size(&amp;self) i32 { self.data.len as i32 + self.n }\n    fn into_len(self) i32 { self.data.len as i32 }\n    fn view(&amp;self) str { as_str(&amp;self.data) }\n}\n\nfn main() i32 {\n    mut b = Buf::new(\"ab\")\n    b.add(99)\n    b.add(100)\n    let k = b.view().len as i32 // 4\n    let s = b.size()            // 4 + 2\n    k * 10 + s + b.into_len()   // 40 + 6 + 4\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: use of moved value `b`\nstruct Buf { data: String }\nimpl Buf {\n    fn into_len(self) i32 { self.data.len as i32 }\n}\nfn main() i32 {\n    let b = Buf { data: string_from(\"x\") }\n    let a = b.into_len()\n    a + b.into_len()\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"24-use\" id=\"ref-reference--24-use\">2.4 <code>use</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--24-use\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>use = \"use\" name { \".\" name }\n</code></pre></div>\n<p><code>use a.b.c</code>는 <code>&lt;루트 폴더&gt;/a/b/c.tam</code>을 불러오고 이후 <code>c::항목</code>으로 참조한다. 첫 조각이 <code>tam</code>이면 파일이 아니라 <strong>내장 표준 라이브러리</strong>다(<code>use tam.os</code>). 자세한 규칙은 <a href=\"#doc-ref-reference--7-이름-해석과-모듈\">7장</a>.</p>\n<h3 class=\"doc-heading\" data-slug=\"25-extern-함수\" id=\"ref-reference--25-extern-함수\">2.5 <code>extern</code> 함수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--25-extern-함수\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>extern = [ \"pub\" ] \"extern\" string \"fn\" name \"(\" [ params ] \")\" [ type ] [ \"=\" string ]\n</code></pre></div>\n<p>본문이 없는 외부 함수 선언이다. 문자열은 라이브러리 이름이다. 호스트 대상에서는 <code>\"c\"</code>(libc),
