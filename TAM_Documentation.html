 Windows 대상에서는 DLL 이름(<code>\"kernel32\"</code>)이다. <code>= \"심볼\"</code>은 실제 심볼 이름이 TAM 이름과 다를 때만 쓴다.</p>\n<ul>\n<li>인자와 반환 타입은 C ABI에 맞게 <strong>정수형, <code>f64</code>, <code>bool</code>, raw 포인터</strong>(와 반환 없음)만 가능하다. 그 밖의 타입은 오류다.</li>\n<li>호출은 <strong>항상 <code>unsafe</code></strong>다.</li>\n<li>대상과 맞지 않는 라이브러리(Windows에서 <code>\"c\"</code>, 호스트에서 DLL)는 오류다. 펌웨어 대상(<code>uefi</code>, <code>bios</code>, <code>aarch64</code>)에서는 <code>extern</code>이 오류다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nextern \"c\" fn abs(x: i32) i32\n\nfn main() i32 {\n    unsafe { abs(0 - 7) }\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"26-const-전역-상수\" id=\"ref-reference--26-const-전역-상수\">2.6 <code>const</code>: 전역 상수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--26-const-전역-상수\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>const = [ \"pub\" ] \"const\" name \":\" type \"=\" const_expr\n</code></pre></div>\n<ul>\n<li>타입은 <strong>정수형, <code>f64</code>, <code>bool</code>, <code>str</code></strong> 중 하나여야 한다. 반드시 써야 한다(추론하지 않는다).</li>\n<li>값은 <strong>컴파일 시간에 계산</strong>된다. 쓸 수 있는 것은 리터럴, 다른 상수(<code>mod::NAME</code> 포함), 산술·비트·비교·논리 연산, <code>!</code>, 단항 <code>-</code>, 정수끼리 또는 정수→<code>f64</code>의 <code>as</code>다. 함수 호출이나 변수는 쓸 수 없다(<code>this expression cannot be used in a constant</code>).</li>\n<li>계산은 128비트로 하고, 결과가 선언한 타입에 들어가야 한다(<code>constant </code>A<code>= 256 does not fit in</code>u8``). 넘치거나 0으로 나누면 컴파일 오류다.</li>\n<li>상수끼리 순환하면 <code>depends on itself</code> 오류다. 선언 순서는 상관없다.</li>\n<li>상수를 쓰는 곳에는 <strong>타입이 정해진 값</strong>이 들어간다. 정수 리터럴과 달리 다른 정수형 자리에 그냥 쓸 수 없다(<code>const A: u8 = 1</code>을 <code>i32</code> 자리에 쓰려면 <code>A as i32</code>).</li>\n<li>상수는 주소가 없다. 대입(<code>A = 2</code>)과 <code>&amp;A</code>는 오류다.</li>\n<li>같은 이름의 <strong>지역 변수가 상수를 가린다</strong>(그 선언 이후부터).</li>\n<li>이름은 함수, 구조체, 다른 상수와 겹칠 수 없다. <code>pub const</code>는 다른 모듈에서 <code>모듈::이름</code>으로 쓴다.</li>\n<li><strong>배열 길이</strong>에 쓸 수 있다: <code>[i32; SIZE]</code>, <code>[0; SIZE]</code>. 값은 1 이상의 정수 상수여야 한다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 117\nconst SIZE: u64 = 4\nconst NEG: i32 = -3\nconst MASK: u8 = 0xF0 | 0x0F\nconst BIG: i64 = 1 &lt;&lt; 40\nconst PI: f64 = 3.5\nconst NAME: str = \"tam\"\nconst ON: bool = SIZE &gt; 3 &amp;&amp; !false\nconst AREA: u64 = SIZE * SIZE\n\nstruct Grid {\n    cells: [i32; SIZE],\n}\n\nfn total(g: &amp;Grid) i32 {\n    mut s = 0\n    for i in 0..SIZE { s += g.cells[i] }\n    s\n}\n\nfn main() i32 {\n    let g = Grid { cells: [1; SIZE] }\n    let SIZE = 100                       // 지역 변수가 상수를 가린다\n    mut r = total(&amp;g) + NEG + SIZE       // 4 - 3 + 100\n    if BIG != 1099511627776 { return 1 }\n    if MASK as i32 != 255 { return 2 }\n    if PI * 2.0 != 7.0 { return 3 }\n    if NAME.len != 3 { return 4 }\n    if !ON { return 5 }\n    r += AREA as i32                     // + 16\n    r\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: does not fit in `u8`\nconst A: u8 = 256\n\nfn main() i32 { 0 }\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"27-제네릭\" id=\"ref-reference--27-제네릭\">2.7 제네릭<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--27-제네릭\">¶</a></h3>\n<p>함수와 구조체에 <strong>타입 매개변수</strong>를 줄 수 있다. 이름 뒤에 <code>&lt;A, B&gt;</code>를 쓴다. 구현 방식은 C++ 템플릿과 같은 <strong>단형화</strong>다. 쓰이는 타입마다 컴파일러가 코드를 따로 만들어(인스턴스), 실행 시간 비용이 없다. 다만 C++과 달리 <code>template</code> 키워드가 없고, 인스턴스가 만들어지는 지점이 명시적이며, 오류가 어느 호출 때문인지 알려 준다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>function = ... \"fn\" name [ tparams ] \"(\" ... \")\" ...\nstruct   = ... \"struct\" name [ tparams ] \"{\" ... \"}\"\nimpl     = \"impl\" name [ tparams ] \"{\" ... \"}\"\ntparams  = \"&lt;\" ident { \",\" ident } \"&gt;\"\n</code></pre></div>\n<h4 class=\"doc-heading\" data-slug=\"제네릭-함수\" id=\"ref-reference--제네릭-함수\">제네릭 함수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--제네릭-함수\">¶</a></h4>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nfn max&lt;T&gt;(a: T, b: T) T {\n    if a &gt; b { a } else { b }\n}\n\nfn main() i32 {\n    max(3, 9)                    // T = i32 (인자에서 추론)\n}\n</code></pre></div>\n<p>타입 인자는 다음 순서로 정해진다.</p>\n<ol>\n<li><strong>명시한 것</strong>: <code>max&lt;i64&gt;(3, 9)</code>.</li>\n<li><strong>리터럴이 아닌 인자의 타입</strong>: <code>max(x, y)</code>의 <code>x</code>, <code>y</code>.</li>\n<li><strong>기대하는 타입</strong>(반환 값이 쓰이는 자리): <code>let z: u8 = zero()</code>.</li>\n<li><strong>정수 리터럴만 남으면 <code>i32</code></strong>: <code>max(3, 9)</code>.</li>\n</ol>\n<p>하나라도 정해지지 않으면 <code>cannot infer type parameter </code>T<code>of</code>f`` 오류다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nfn zero&lt;T&gt;() T { 0 }\n\nfn first&lt;T&gt;(a: &amp;[T]) T { a[0] }\n\nfn main() i32 {\n    let a: i32 = zero()          // 기대 타입으로 T = i32\n    let b = zero&lt;i64&gt;()          // 명시\n    let arr = [4, 5, 6]\n    let c = first(&amp;arr)          // &amp;[i32; 3]에서 T = i32\n    a + b as i32 + c + 5\n}\n</code></pre></div>\n<p>호출 구문 <code>이름&lt;타입, ...&gt;(인자)</code>에서 <code>&lt;</code>는 <strong>뒤에 <code>&gt;</code>와 <code>(</code>/<code>::</code>/<code>{</code>가 이어질 때만</strong> 타입 인자로 읽는다. 그 밖에는 비교 연산자다(<code>a &lt; b</code>).</p>\n<h4 class=\"doc-heading\" data-slug=\"템플릿은-쓰일-때-검사된다\" id=\"ref-reference--템플릿은-쓰일-때-검사된다\">템플릿은 쓰일 때 검사된다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--템플릿은-쓰일-때-검사된다\">¶</a></h4>\n<p>제네릭 함수의 <strong>본문은 인스턴스가 만들어질 때</strong> 실제 타입으로 검사된다. 그래서 <code>T</code>에 어떤 연산이 가능한지 미리 선언하지 않는다(트레이트 경계가 없다). 대신 인스턴스에서 오류가 나면 두 위치를 함께 보여 준다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: operator `&gt;` cannot be applied to `P`\nstruct P { x: i32 }\n\nfn max&lt;T&gt;(a: T, b: T) T {\n    if a &gt; b { a } else { b }\n}\n\nfn main() i32 {\n    let a = P { x: 1 }\n    let b = P { x: 2 }\n    max(a, b).x\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">error: operator `&gt;` cannot be applied to `P`\n  --&gt; ex.tam:4:8\n   |\n 4 |     if a &gt; b { a } else { b }\n   |        ^ unsupported operand type\n...\n10 |     max(a, b).x\n   |     --------- while instantiating `max&lt;P&gt;`\n</code></pre></div>\n<p>한 번도 쓰이지 않은 제네릭은 <strong>검사되지 않는다</strong>(문법은 검사된다). 함수 본문 안의 이름은 정의된 모듈에서, 호출하는 곳의 타입으로 해석된다.</p>\n<h4 class=\"doc-heading\" data-slug=\"제네릭-구조체와-impl\" id=\"ref-reference--제네릭-구조체와-impl\">제네릭 구조체와 <code>impl</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--제네릭-구조체와-impl\">¶</a></h4>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nstruct Pair&lt;A, B&gt; {\n    first: A,\n    second: B,\n}\n\nimpl Pair&lt;A, B&gt; {\n    fn new(a: A, b: B) Self {\n        Pair { first: a, second: b }\n    }\n\n    fn swap(self) Pair&lt;B, A&gt; {\n        Pair { first: self.second, second: self.first }\n    }\n\n    fn get_first(&amp;self) A { self.first }\n}\n\nfn main() i32 {\n    let p = Pair::new(2, 5)            // Pair&lt;i32, i32&gt;\n    let q: Pair&lt;i32, i32&gt; = p.swap()\n    let r = Pair&lt;i32, i32&gt; { first: 4, second: 1 }\n    q.first + r.get_first() - 2\n}\n</code></pre></div>\n<ul>\n<li>타입으로 쓸 때는 항상 인자를 준다: <code>Pair&lt;i32, f64&gt;</code>. 인자 없는 <code>Pair</code>는 <code>generic struct </code>Pair<code> needs type arguments</code> 오류다(리터럴과 연관 함수 호출은 추론한다).</li>\n<li><strong>리터럴</strong> <code>Pair { first: 1, second: 2.5 }</code>는 필드 값에서 타입 인자를 추론한다. 명시할 수도 있다: <code>Pair&lt;i32, f64&gt; { ... }</code>.</li>\n<li><strong>연관 함수</strong>는 <code>Pair::new(..)</code>로 추론하거나 <code>Pair&lt;i32, f64&gt;::new(..)</code>로 명시한다.</li>\n<li><code>impl Pair&lt;X, Y&gt;</code>의 <code>X</code>, <code>Y</code>는 그 <code>impl</code> 안에서만 쓰는 이름이다(구조체 선언의 이름과 같을 필요는 없고, 개수만 같아야 한다).</li>\n<li><code>impl</code> 안에서 <code>Self</code>는 <code>Pair&lt;A, B&gt;</code>다. <code>Self { .. }</code>와 <code>Self::new(..)</code>는 같은 인자를 쓴다.</li>\n<li>인스턴스의 메서드는 처음 호출될 때 만들어진다. 같은 인스턴스의 같은 메서드는 하나만 생긴다.</li>\n<li>인스턴스 이름은 <code>Pair&lt;i32,f64&gt;</code>처럼 오류 메시지에 그대로 나온다.</li>\n<li>자기 자신을 <strong>값으로</strong> 포함하는 인스턴스(<code>struct Bad&lt;T&gt; { inner: Bad&lt;T&gt; }</code>)는 <code>contains itself by value</code> 오류다. 포인터로 가리키는 것(<code>next: *mut Node&lt;T&gt;</code>)은 된다.</li>\n</ul>\n<h4 class=\"doc-heading\" data-slug=\"한계\" id=\"ref-reference--한계\">한계<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--한계\">¶</a></h4>\n<ul>\n<li><strong>트레이트(경계)는 없다.</strong> <code>T</code>에 대한 요구는 인스턴스 오류로만 알려진다.</li>\n<li><strong>메서드는 자기만의 타입 매개변수를 가질 수 없다</strong>(<code>impl Foo { fn f&lt;T&gt;(..) }</code> 오류). <code>impl Pair&lt;A, B&gt;</code>의 <code>A</code>, <code>B</code>만 쓴다. 필요하면 일반 제네릭 함수를 쓴다.</li>\n<li>타입 매개변수 자리에 <strong>상수 값</strong>(<code>[T; N]</code>의 <code>N</code>)은 쓸 수 없다. 타입만 된다.</li>\n<li><code>extern</code> 함수와 <code>main</code>은 제네릭일 수 없다.</li>\n<li>자기 자신을 점점 큰 타입으로 인스턴스화하는 재귀는 <strong>깊이 64, 인스턴스 5000개</strong>에서 <code>generic instantiation limit exceeded</code> 오류로 멈춘다.</li>\n<li>힙을 가진 필드는 <code>self.field</code>로 꺼내 이동할 수 없다는 기존 규칙(<a href=\"#doc-ref-reference--8-소유권-이동-자동-해제\">8장</a>)은 제네릭에도 그대로다. <code>T</code>가 <code>String</code>인 인스턴스에서 <code>self.v</code>를 반환하면 인스턴스 검사에서 오류가 난다.</li>\n</ul>\n<hr/>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"3-타입\" id=\"ref-reference--3-타입\">3. 타입<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--3-타입\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>타입</th>\n<th>설명</th>\n<th>Copy</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>i8</code> <code>i16</code> <code>i32</code> <code>i64</code></td>\n<td>부호 있는 정수(2의 보수)</td>\n<td>✔</td>\n</tr>\n<tr>\n<td><code>u8</code> <code>u16</code> <code>u32</code> <code>u64</code></td>\n<td>부호 없는 정수</td>\n<td>✔</td>\n</tr>\n<tr>\n<td><code>f64</code></td>\n<td>IEEE 754 배정밀도</td>\n<td>✔</td>\n</tr>\n<tr>\n<td><code>bool</code></td>\n<td><code>true</code> / <code>false</code></td>\n<td>✔</td>\n</tr>\n<tr>\n<td><code>str</code></td>\n<td>문자열 조각: (포인터, 길이). 읽기 전용, 소유하지 않음</td>\n<td>✔</td>\n</tr>\n<tr>\n<td><code>String</code></td>\n<td>힙의 소유 문자열: (포인터, 길이, 용량)</td>\n<td>✘ (이동)</td>\n</tr>\n<tr>\n<td><code>struct</code></td>\n<td>사용자 정의</td>\n<td>✘ (이동)</td>\n</tr>\n<tr>\n<td><code>[T; N]</code></td>\n<td>고정 길이 배열</td>\n<td>✘ (이동)</td>\n</tr>\n<tr>\n<td><code>&amp;T</code>, <code>&amp;mut T</code></td>\n<td>참조</td>\n<td><code>&amp;T</code> ✔, <code>&amp;mut T</code> ✘(재차용)</td>\n</tr>\n<tr>\n<td><code>&amp;[T]</code>, <code>&amp;mut [T]</code></td>\n<td>슬라이스(포인터, 길이) 참조</td>\n<td><code>&amp;[T]</code> ✔</td>\n</tr>\n<tr>\n<td><code>*const T</code>, <code>*mut T</code></td>\n<td>raw 포인터</td>\n<td>✔</td>\n</tr>\n<tr>\n<td><code>Result&lt;T, E&gt;</code></td>\n<td>성공 또는 오류</td>\n<td>내용이 하나라도 이동 타입이면 ✘</td>\n</tr>\n<tr>\n<td><code>Option&lt;T&gt;</code></td>\n<td>값 또는 없음</td>\n<td>위와 같음</td>\n</tr>\n</tbody>\n</table>\n<p><code>isize</code>, <code>usize</code>, <code>f32</code>, 튜플, 열거형, 제네릭, 함수 포인터 타입은 없다. 크기를 다루는 값은 <code>u64</code>를 쓴다(<code>.len</code>이 <code>u64</code>다).</p>\n<h3 class=\"doc-heading\" data-slug=\"31-정수형\" id=\"ref-reference--31-정수형\">3.1 정수형<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--31-정수형\">¶</a></h3>\n<ul>\n<li>정수 연산은 같은 타입끼리만 된다. <code>i32 + i64</code>는 오류이므로 <code>as</code>로 맞춘다.</li>\n<li>리터럴은 기대 타입을 따른다. 기대 타입이 없으면 <code>i32</code>이고, 한쪽 피연산자의 타입이 정해져 있으면 그쪽을 따른다.</li>\n<li>오버플로는 <strong>trap</strong>한다(<a href=\"#doc-ref-reference--10-수치-의미-오버플로-변환-시프트\">10장</a>).</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let a: u8 = 200\n    let b = 100          // 리터럴 b는 아래 덧셈에서 u8로 정해진다\n    let c = a - b as u8 + 100\n    if c != 200 { return 1 }\n    let wide = a as i64 * 1_000_000_000\n    if wide != 200_000_000_000 { return 2 }\n    0\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: mismatched types\nfn main() i32 {\n    let a: i32 = 1\n    let b: i64 = 2\n    let c = a + b\n    0\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"32-str과-string\" id=\"ref-reference--32-str과-string\">3.2 <code>str</code>과 <code>String</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--32-str과-string\">¶</a></h3>\n<ul>\n<li><code>str</code>은 (포인터, 길이)이며 Copy다. 읽을 수 있는 것은 <code>s.len</code>(<code>u64</code>)과 <code>s.ptr</code>(<code>*const u8</code>)뿐이다. <strong>인덱싱은 없다</strong>(<code>s[i]</code>는 오류). 바이트를 읽으려면 <code>unsafe { *(s.ptr + i) }</code>를 쓴다.</li>\n<li><code>str == str</code>, <code>str != str</code>은 바이트 비교다.</li>\n<li><code>String</code>은 힙을 소유하는 이동 타입이다. 스코프가 끝나면 자동으로 해제된다(<a href=\"#doc-ref-reference--8-소유권-이동-자동-해제\">8장</a>). <code>.len</code>, <code>.ptr</code>을 읽을 수 있다.</li>\n<li><code>string_from(str) String</code>, <code>string_push(&amp;mut String, u8)</code>, <code>as_str(&amp;String) str</code>이 내장이다. 이어 붙이기와 정수 출력은 표준 라이브러리 <code>tam.fmt</code>에 있다(<a href=\"#doc-ref-stdlib\">Standard Library</a>).</li>\n<li><code>as_str(&amp;s)</code>가 돌려준 <code>str</code>은 <code>s</code>를 <strong>빌린다</strong>: <code>s</code>를 이동하거나 수정하면 오류다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let a = \"hello\"\n    mut s = string_from(\"hel\")\n    string_push(&amp;mut s, 108)\n    string_push(&amp;mut s, 111)\n    let b = as_str(&amp;s)\n    if a != b { return 1 }\n    if a == \"world\" { return 2 }\n    if s.len != 5 { return 3 }\n    0\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot borrow `s` as mutable because it is also borrowed as immutable\nfn main() i32 {\n    mut s = string_from(\"a\")\n    let t = as_str(&amp;s)\n    string_push(&amp;mut s, 1)\n    t.len as i32\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"33-배열\" id=\"ref-reference--33-배열\">3.3 배열<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--33-배열\">¶</a></h3>\n<ul>\n<li><code>[T; N]</code>에서 <code>N</code>은 <strong>1 이상의 정수 리터럴 또는 정수 상수의 이름</strong>이다(<a href=\"#doc-ref-reference--26-const-전역-상수\">2.6절</a>). <code>[T; N * 2]</code> 같은 식과 길이 0은 불가다.</li>\n<li>리터럴: <code>[a, b, c]</code>, 반복 <code>[v; N]</code>(<code>v</code>는 한 번만 평가해 복사). 타입 표기: <code>let a: [u8; 4] = [0; 4]</code>.</li>\n<li>원소 타입은 <strong>정수, <code>f64</code>, <code>bool</code>, raw 포인터, 그것들의 배열, 그것들만 필드로 가진 구조체</strong>다. <code>String</code>이나 참조처럼 힙·빌림을 쥔 타입은 원소가 될 수 없다(<code>cannot be an array element type</code>).</li>\n<li>배열은 구조체처럼 <strong>이동 타입</strong>이다. 값 전달과 대입은 이동이다.</li>\n<li><code>a[i]</code>로 읽고 쓴다. 중첩(<code>a[i][j]</code>), 구조체 원소의 필드(<code>a[i].x</code>)도 된다. 인덱스는 <strong>어떤 정수형이든</strong> 된다.</li>\n<li><strong>경계를 실행 시간에 검사한다</strong>. 벗어나면 trap(패닉 <code>index out of bounds</code>)한다. 부호 있는 음수 인덱스도 trap이다. 배열 길이와 인덱스가 <strong>둘 다 컴파일 시간에 알려진 경우</strong>(상수 인덱스)는 컴파일 오류다.</li>\n<li><code>.len</code>(<code>u64</code>)과 <code>.ptr</code>(<code>*const T</code>, 가변 배열이면 <code>*mut T</code>)를 읽을 수 있다.</li>\n<li>구조체 원소를 통째로 꺼내 옮길 수는 없다. 필드로 접근하거나 빌린다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 14\nfn main() i32 {\n    mut grid = [[0; 3]; 3]\n    for i in 0..3 {\n        for j in 0..3 {\n            grid[i][j] = (i * 3 + j) as i32\n        }\n    }\n    let diag = grid[0][0] + grid[1][1] + grid[2][2] // 0 + 4 + 8 = 12\n    diag + 2\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: index out of bounds\nfn main() i32 {\n    let a = [1, 2, 3]\n    a[5]\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: index out of bounds\nfn main() i32 {\n    let a = [1, 2, 3]\n    let i = a.len + 2\n    a[i]\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"34-슬라이스\" id=\"ref-reference--34-슬라이스\">3.4 슬라이스<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--34-슬라이스\">¶</a></h3>\n<p><code>&amp;[T]</code>와 <code>&amp;mut [T]</code>는 (포인터, 길이)인 <strong>참조</strong>다.</p>\n<ul>\n<li>만들기: <code>&amp;a[..]</code>, <code>&amp;a[lo..hi]</code>, <code>&amp;a[lo..]</code>, <code>&amp;a[..hi]</code>, <code>&amp;mut a[..]</code>. 원본은 배열, <code>&amp;[T; N]</code>, 슬라이스다. 슬라이스 식은 반드시 <code>&amp;</code>/<code>&amp;mut</code>로 빌려서 쓴다.</li>\n<li>범위가 길이를 넘거나 <code>lo &gt; hi</code>이면 trap한다.</li>\n<li><code>s.len</code>(<code>u64</code>), <code>s[i]</code>(경계 검사)를 쓴다. <code>for x in s</code>로 순회할 수 있다(원소는 <strong>값으로 복사</strong>된다).</li>\n<li>함수 인자 자리에서는 <code>&amp;배열</code>(<code>&amp;[T; N]</code>)이 <code>&amp;[T]</code>로 자동 변환된다(<code>sum(&amp;a)</code>). 다른 자리(<code>let s: &amp;[T] = &amp;a</code>)에서는 <code>&amp;a[..]</code>로 명시한다.</li>\n<li>빌림 검사는 일반 참조와 같다. 원본 배열을 바꾸면 오류이고, <code>&amp;mut</code> 슬라이스 둘은 동시에 만들 수 없고, 지역 배열의 슬라이스는 반환할 수 없다.</li>\n<li>검사기는 <strong>원소를 구분하지 않는다</strong>: <code>&amp;mut a[0]</code>과 <code>&amp;mut a[1]</code>은 동시에 만들 수 없다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 15\nfn sum(a: &amp;[i32]) i32 {\n    mut s = 0\n    for x in a { s += x }\n    s\n}\n\nfn fill(a: &amp;mut [i32], v: i32) {\n    for i in 0..a.len { a[i] = v }\n}\n\nfn main() i32 {\n    mut a = [1, 2, 3, 4, 5]\n    let total = sum(&amp;a)              // 15, &amp;배열 → &amp;[i32] 자동 변환\n    fill(&amp;mut a[1..3], 9)\n    if a[1] != 9 || a[2] != 9 { return 1 }\n    total\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"35-참조\" id=\"ref-reference--35-참조\">3.5 참조<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--35-참조\">¶</a></h3>\n<p><code>&amp;T</code>는 읽기 전용 참조, <code>&amp;mut T</code>는 배타적 쓰기 참조다. 규칙은 <a href=\"#doc-ref-reference--9-빌림-규칙\">9장</a>에 있다.</p>\n<ul>\n<li><code>&amp;x</code>, <code>&amp;mut x</code>로 만든다. <code>&amp;mut x</code>는 <code>x</code>가 <code>mut</code>일 때만 된다.</li>\n<li><code>*r</code>로 읽고 <code>*r = v</code>로 쓴다.</li>\n<li>구조체 참조의 필드는 <code>r.x</code>로 접근한다(자동 역참조).</li>\n<li><code>&amp;mut T</code>는 <code>&amp;T</code> 자리에 넘길 수 있다(암묵 변환). 반대는 오류다.</li>\n<li>함수가 반환하는 참조의 수명은 어노테이션 없이 본문에서 추론한다. 지역 변수의 참조를 돌려주면 컴파일 오류다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"36-result와-option\" id=\"ref-reference--36-result와-option\">3.6 <code>Result</code>와 <code>Option</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--36-result와-option\">¶</a></h3>\n<ul>\n<li><code>Result&lt;T, E&gt;</code>: <code>Ok(값)</code> 또는 <code>Err(오류)</code>. <code>Option&lt;T&gt;</code>: <code>Some(값)</code> 또는 <code>None</code>.</li>\n<li>생성자는 <strong>기대 타입이 있는 자리</strong>(반환 값, 인자, 주석 달린 <code>let</code>)에서 쓴다. <code>Some(x)</code>는 인자에서 타입을 추론하므로 <code>let o = Some(5)</code>는 된다. <code>Ok(...)</code>, <code>Err(...)</code>, <code>None</code>은 기대 타입이 필요하다.</li>\n<li><code>Result</code>/<code>Option</code>은 이동 타입이거나(내용에 <code>String</code>·구조체·배열이 있을 때) Copy다.</li>\n<li>소비: <code>match</code>(<a href=\"#doc-ref-reference--6-match와-패턴\">6장</a>)와 <code>?</code>(<a href=\"#doc-ref-reference--49-오류-전파\">4.9절</a>), 그리고 메서드:</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>메서드</th>\n<th><code>Option&lt;T&gt;</code></th>\n<th><code>Result&lt;T, E&gt;</code></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>is_some()</code> <code>is_none()</code></td>\n<td>✔</td>\n<td></td>\n</tr>\n<tr>\n<td><code>is_ok()</code> <code>is_err()</code></td>\n<td></td>\n<td>✔</td>\n</tr>\n<tr>\n<td><code>unwrap()</code></td>\n<td><code>None</code>이면 패닉</td>\n<td><code>Err</code>이면 패닉</td>\n</tr>\n<tr>\n<td><code>unwrap_or(기본값)</code></td>\n<td>✔</td>\n<td>✔</td>\n</tr>\n</tbody>\n</table>\n<p>힙을 가진 내용(예: <code>Option&lt;String&gt;</code>)에서 <code>is_*</code>는 값을 소비하므로 거절된다(<code>owns heap data</code>): <code>match</code>를 쓴다. <code>unwrap</code>은 값을 꺼내 이동한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn find(a: &amp;[i32], x: i32) Option&lt;i32&gt; {\n    for i in 0..a.len {\n        if a[i] == x { return Some(i as i32) }\n    }\n    None\n}\n\nfn parse(n: i32) Result&lt;i32, i32&gt; {\n    if n &gt; 0 { Ok(n) } else { Err(0 - n) }\n}\n\nfn main() i32 {\n    let a = [5, 6, 7]\n    if find(&amp;a, 7).unwrap() != 2 { return 1 }\n    if find(&amp;a, 9).is_some() { return 2 }\n    if find(&amp;a, 9).unwrap_or(-1) != -1 { return 3 }\n    if parse(-4).unwrap_or(7) != 7 { return 4 }\n    if !parse(3).is_ok() { return 5 }\n    0\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"37-타입의-크기와-배치\" id=\"ref-reference--37-타입의-크기와-배치\">3.7 타입의 크기와 배치<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--37-타입의-크기와-배치\">¶</a></h3>\n<p>타입의 메모리 배치는 정해지지 않았다(LLVM의 자연 정렬을 따르지만 약속하지 않는다). <code>extern</code> 함수의 인자로 구조체를 넘길 수 없는 이유다.</p>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"4-표현식\" id=\"ref-reference--4-표현식\">4. 표현식<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--4-표현식\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"41-우선순위와-결합-방향\" id=\"ref-reference--41-우선순위와-결합-방향\">4.1 우선순위와 결합 방향<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--41-우선순위와-결합-방향\">¶</a></h3>\n<p>높은 것부터:</p>\n<p>| 순위 | 연산자 | 결합 |\n|---|---|---|\n| 1 | 후위: <code>.필드</code> <code>.메서드()</code> <code>[인덱스]</code> <code>?</code> 호출 <code>()</code> | 왼쪽 |\n| 2 | 단항: <code>-</code> <code>!</code> <code>~</code> <code>*</code>(역참조) <code>&amp;</code> <code>&amp;mut</code> | 오른쪽 |\n| 3 | <code>as</code> | 왼쪽 |\n| 4 | <code>*</code> <code>/</code> <code>%</code> | 왼쪽 |\n| 5 | <code>+</code> <code>-</code> | 왼쪽 |\n| 6 | <code>&lt;&lt;</code> <code>&gt;&gt;</code> | 왼쪽 |\n| 7 | <code>&amp;</code> | 왼쪽 |\n| 8 | <code>^</code> | 왼쪽 |\n| 9 | <code>|</code> | 왼쪽 |\n| 10 | <code>&lt;</code> <code>&lt;=</code> <code>&gt;</code> <code>&gt;=</code> | 왼쪽 |\n| 11 | <code>==</code> <code>!=</code> | 왼쪽 |\n| 12 | <code>&amp;&amp;</code> | 왼쪽 |\n| 13 | <code>||</code> | 왼쪽 |</p>\n<p>Rust와 같다. 비트 연산자(<code>&amp; ^ |</code>)는 비교보다 <strong>높다</strong>: <code>x &amp; 1 == 1</code>은 <code>(x &amp; 1) == 1</code>이다(C와 다르다). <code>-x as i64</code>는 <code>(-x) as i64</code>다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let a = 1 + 2 * 3 - 4 / 2 % 3  // 1 + 6 - (2 % 3) = 5\n    let b = 1 &lt;&lt; 2 + 1             // 시프트가 덧셈보다 낮다: 1 &lt;&lt; 3\n    let c = 6 &amp; 3 == 2             // (6 &amp; 3) == 2\n    let d = 5 &gt; 3 == true          // (5 &gt; 3) == true\n    let e = -5 as i64 + 1          // ((-5) as i64) + 1\n    if a != 5 { return 1 }\n    if b != 8 { return 2 }\n    if !c { return 3 }\n    if !d { return 4 }\n    if e != -4 { return 5 }\n    0\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"42-평가-순서\" id=\"ref-reference--42-평가-순서\">4.2 평가 순서<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--42-평가-순서\">¶</a></h3>\n<p>피연산자와 인자는 <strong>왼쪽에서 오른쪽</strong>으로 평가한다. <code>&amp;&amp;</code>와 <code>||</code>는 단락 평가한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\nfn say(n: i32) bool { os::print_int(n as i64); true }\n\nfn main() i32 {\n    let a = false &amp;&amp; say(1) // say(1)은 호출되지 않는다\n    let b = true || say(2)  // say(2)도\n    let c = say(3) &amp;&amp; say(4)\n    os::println(\"\")\n    if a || !b || !c { 1 } else { 0 }\n}\n// out: 34\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"43-산술과-비교\" id=\"ref-reference--43-산술과-비교\">4.3 산술과 비교<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--43-산술과-비교\">¶</a></h3>\n<ul>\n<li><code>+ - * / %</code>는 정수와 <code>f64</code>에 쓴다. 두 피연산자의 타입이 같아야 한다. <code>%</code>는 <code>f64</code>에도 쓸 수 있다(<code>7.5 % 2.0 == 1.5</code>).</li>\n<li>정수 나눗셈은 0 방향으로 자르고, <code>%</code>의 부호는 피연산자(왼쪽)를 따른다(<code>-5 % 3 == -2</code>).</li>\n<li>단항 <code>-</code>는 부호 있는 정수와 <code>f64</code>에만 쓴다(<code>-x</code>가 <code>u32</code>에는 오류).</li>\n<li><code>== != &lt; &lt;= &gt; &gt;=</code>는 같은 타입의 정수, <code>f64</code>, <code>bool</code>(<code>==</code>/<code>!=</code>), <code>str</code>(<code>==</code>/<code>!=</code>), 포인터에 쓴다. 결과는 <code>bool</code>이다. 구조체와 배열의 비교는 없다.</li>\n<li><code>f64</code> 비교는 IEEE 754를 따른다(<code>NaN != NaN</code>).</li>\n<li><code>if</code>/<code>while</code>의 조건은 <strong><code>bool</code>이어야 한다</strong>(<code>if 1 { }</code>는 오류).</li>\n<li><code>&amp;&amp; || !</code>는 <code>bool</code>에만 쓴다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"44-비트-연산자\" id=\"ref-reference--44-비트-연산자\">4.4 비트 연산자<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--44-비트-연산자\">¶</a></h3>\n<p><code>&amp; | ^ &lt;&lt; &gt;&gt;</code>와 단항 <code>~</code>는 정수형에만 쓴다. <code>&amp; | ^</code>는 양쪽 타입이 같아야 하고 시프트 양은 어떤 정수형이든 된다. <code>&gt;&gt;</code>는 부호 있는 타입에서 산술, 부호 없는 타입에서 논리 시프트다. <strong>시프트 양은 왼쪽 피연산자의 비트 폭 - 1로 마스크</strong>된다(폭 이상 밀어도 정의된 동작): <code>i32</code>에서 <code>1 &lt;&lt; 33</code>은 <code>1 &lt;&lt; 1</code>이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let m: i64 = -1\n    if (m as u64 &gt;&gt; 60) != 15 { return 1 }   // 논리 시프트\n    let n: i32 = -8\n    if (n &gt;&gt; 1) != -4 { return 2 }           // 산술 시프트\n    let s: u32 = 33\n    if (1 &lt;&lt; s) != 2 { return 3 }            // 33 &amp; 31 == 1\n    if ~0 != -1 { return 4 }\n    0\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"45-변환-as\" id=\"ref-reference--45-변환-as\">4.5 변환 <code>as</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--45-변환-as\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th>원본 → 대상</th>\n<th>동작</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>정수 → 정수</td>\n<td>확장(부호 있으면 부호 확장) 또는 하위 비트로 <strong>잘라냄</strong>(감싼다, trap하지 않음)</td>\n</tr>\n<tr>\n<td>정수 → <code>f64</code></td>\n<td>가장 가까운 값</td>\n</tr>\n<tr>\n<td><code>f64</code> → 정수</td>\n<td>0 방향 절삭 후 <strong>포화</strong>(범위 밖은 최솟값/최댓값, <code>NaN</code>은 0)</td>\n</tr>\n<tr>\n<td><code>bool</code> → 정수</td>\n<td><code>false</code> = 0, <code>true</code> = 1</td>\n</tr>\n<tr>\n<td>정수 → <code>bool</code></td>\n<td><strong>불가</strong>(오류). <code>x != 0</code>을 쓴다</td>\n</tr>\n<tr>\n<td>포인터 ↔ 포인터, 포인터 ↔ <code>i64</code>/<code>u64</code></td>\n<td>가능(safe)</td>\n</tr>\n<tr>\n<td><code>&amp;T</code> → <code>*const T</code>, <code>&amp;mut T</code> → <code>*mut T</code></td>\n<td>가능(safe)</td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let a: u8 = 250\n    if (a as i8) != -6 { return 1 }          // 잘라내고 부호 재해석\n    if (300 as u8) != 44 { return 2 }\n    if (1e20 as i32) != 2147483647 { return 3 } // 포화\n    if (0.0 / 0.0) as i32 != 0 { return 4 }     // NaN → 0\n    if (-5.7 as i32) != -5 { return 5 }\n    if (-5.7 as u8) != 0 { return 6 }\n    if (true as i32) != 1 { return 7 }\n    0\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot cast `i32` to `bool`\nfn main() i32 {\n    let b = 5 as bool\n    0\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"46-구조체-리터럴-필드-인덱스\" id=\"ref-reference--46-구조체-리터럴-필드-인덱스\">4.6 구조체 리터럴, 필드, 인덱스<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--46-구조체-리터럴-필드-인덱스\">¶</a></h3>\n<ul>\n<li><code>Name { f: v, ... }</code>. 모듈 밖 구조체는 <code>모듈::Name { ... }</code>.</li>\n<li><code>if</code>/<code>while</code>/<code>for</code>/<code>match</code>의 <strong>조건 식 자리에서는</strong> <code>Name {</code>를 구조체 리터럴로 읽지 않는다(블록의 시작과 구분하기 위해). 괄호 <code>( )</code> 안에서는 다시 구조체 리터럴을 쓸 수 있다.</li>\n<li><code>값.필드</code>, 참조와 포인터가 아닌 값의 체인 <code>a.b.c</code>, 인덱스 <code>a[i]</code>, <code>a[i].x</code>, <code>a[i][j]</code>.</li>\n<li><strong>힙을 쥔 필드를 구조체에서 꺼내 이동하는 것은 오류다</strong>: <code>let t = p.s</code>(<code>p.s</code>가 <code>String</code>)는 <code>cannot move ... out of a field</code>. 값 전체를 옮기거나 <code>&amp;p.s</code>로 빌린다. 힙을 쥔 임시값의 필드 접근(<code>make().s</code>)도 막는다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"47-if-표현식\" id=\"ref-reference--47-if-표현식\">4.7 <code>if</code> 표현식<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--47-if-표현식\">¶</a></h3>\n<p><code>if 조건 { 값 } else { 값 }</code>은 값을 가진다. 두 가지의 타입이 같아야 한다. <code>else</code>가 없는 <code>if</code>는 값이 없는 문장이다. <code>else if</code>로 이을 수 있다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 20\nfn main() i32 {\n    let x = 5\n    let a = if x &gt; 3 { 10 } else { 20 }\n    let b = if a == 10 { 1 } else if a == 20 { 2 } else { 3 }\n    mut r = 0\n    if b == 1 { r = 20 }   // else 없는 if는 문장\n    r\n}\n</code></pre></div>\n<p>블록 <code>{ ... }</code> 자체를 값으로 쓰는 표현식(<code>let x = { ... }</code>)은 문법에 없다. 값이 필요하면 <code>if true { ... }</code>가 아니라 함수로 뽑는다.</p>\n<h3 class=\"doc-heading\" data-slug=\"48-호출\" id=\"ref-reference--48-호출\">4.8 호출<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--48-호출\">¶</a></h3>\n<p><code>이름(인자, ...)</code>, 모듈 함수는 <code>모듈::이름(...)</code>, 연관 함수는 <code>T::이름(...)</code>, 메서드는 <code>값.이름(...)</code>. 인자의 수와 타입은 정확히 맞아야 한다. 함수 값(함수 포인터)과 클로저는 없다.</p>\n<h3 class=\"doc-heading\" data-slug=\"49-오류-전파\" id=\"ref-reference--49-오류-전파\">4.9 오류 전파 <code>?</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--49-오류-전파\">¶</a></h3>\n<p><code>식?</code>는 다음과 같이 동작한다.</p>\n<ul>\n<li>식이 <code>Result&lt;T, E&gt;</code>: <code>Ok(v)</code>면 <code>v</code>가 식의 값이 되고, <code>Err(e)</code>면 현재 함수가 <strong>즉시 <code>Err(e)</code>를 반환</strong>한다(살아 있는 지역 변수를 모두 해제하고 나간다).</li>\n<li>식이 <code>Option&lt;T&gt;</code>: <code>Some(v)</code>면 <code>v</code>, <code>None</code>이면 즉시 <code>None</code>을 반환한다.</li>\n<li>현재 함수의 반환 타입이 같은 종류(<code>Result&lt;_, E&gt;</code>에서 <strong>오류 타입 <code>E</code>가 정확히 같아야</strong> 한다, 또는 <code>Option&lt;_&gt;</code>)여야 한다. <code>Option</code>과 <code>Result</code>는 <code>?</code>로 섞을 수 없다.</li>\n<li>오류 타입 변환(<code>From</code>)은 없다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 30\nfn div(a: i32, b: i32) Result&lt;i32, i32&gt; {\n    if b == 0 { return Err(1) }\n    Ok(a / b)\n}\n\nfn calc(a: i32, b: i32, c: i32) Result&lt;i32, i32&gt; {\n    let x = div(a, b)?\n    let y = div(x, c)?\n    Ok(x + y)\n}\n\nfn main() i32 {\n    let ok = match calc(100, 5, 4) { Ok(v) =&gt; v, Err(e) =&gt; 0 - e }  // 20 + 5 = 25\n    let bad = match calc(1, 0, 4) { Ok(v) =&gt; v, Err(e) =&gt; 0 - e }   // -1\n    ok - bad + 4\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: `?` can only be used\nfn f() Result&lt;i32, i32&gt; { Ok(1) }\nfn main() i32 {\n    let x = f()?\n    x\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"410-unsafe-표현식\" id=\"ref-reference--410-unsafe-표현식\">4.10 <code>unsafe</code> 표현식<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--410-unsafe-표현식\">¶</a></h3>\n<p><code>unsafe { 문장들; 값 }</code>은 값을 가지는 표현식이다. <a href=\"#doc-ref-reference--11-unsafe와-raw-포인터\">11장</a> 참고.</p>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"5-문장\" id=\"ref-reference--5-문장\">5. 문장<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--5-문장\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"51-변수-선언\" id=\"ref-reference--51-변수-선언\">5.1 변수 선언<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--51-변수-선언\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>let 이름 [ \":\" 타입 ] \"=\" 식        // 불변\nmut 이름 [ \":\" 타입 ] \"=\" 식        // 가변\n</code></pre></div>\n<ul>\n<li><strong><code>let mut</code>이 아니라 <code>mut</code></strong>다(<code>let mut x</code>는 오류).</li>\n<li>초기값은 필수다(초기화되지 않은 선언은 없다).</li>\n<li>지역 변수의 타입은 추론한다. 타입 주석은 리터럴의 정수형을 정하거나 <code>Ok</code>/<code>Err</code>/<code>None</code>의 기대 타입을 줄 때 쓴다.</li>\n<li><strong>섀도잉</strong>이 가능하다: 같은 이름으로 다시 선언하면 이전 변수는 가려진다(이전 값은 스코프가 끝날 때 해제된다).</li>\n<li>값이 없는 식(반환 타입이 없는 함수 호출)을 묶을 수 없다: <code>cannot bind ... to a value-less expression</code>.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"52-대입\" id=\"ref-reference--52-대입\">5.2 대입<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--52-대입\">¶</a></h3>\n<ul>\n<li><code>대상 = 식</code>. 대상은 가변 변수, 가변 변수의 필드, 배열 원소, <code>*참조</code> 등 <strong>장소 식</strong>이다. 불변 변수에 대입하면 <code>cannot assign to immutable variable</code>이다.</li>\n<li>재대입은 이전 값을 <strong>먼저 해제</strong>한다(<code>x = v</code>, <code>p.s = v</code>, <code>*r = v</code>가 <code>String</code>일 때).</li>\n<li><strong>복합 대입</strong> <code>+= -= *= /= %= &amp;= |= ^= &lt;&lt;= &gt;&gt;=</code>. <code>a op= b</code>는 <code>a = a op b</code>로 풀어 쓴다. 따라서 대상 식에 <strong>부작용이 있으면 오류</strong>다(<code>a[f()] += 1</code>).</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"53-while\" id=\"ref-reference--53-while\">5.3 <code>while</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--53-while\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>while 조건 { 본문 }\n</code></pre></div>\n<p><code>break</code>는 가장 안쪽 루프를 끝내고 <code>continue</code>는 다음 반복으로 간다. 레이블과 <code>break 값</code>은 없다.</p>\n<h4 class=\"doc-heading\" data-slug=\"loop\" id=\"ref-reference--loop\"><code>loop</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--loop\">¶</a></h4>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>loop { 본문 }\n</code></pre></div>\n<p><code>while true { 본문 }</code>과 같다. 끝나려면 <code>break</code>나 <code>return</code>이 필요하다. <strong>본문에 (이 루프를 끝내는) <code>break</code>가 없는 <code>loop</code>는 끝나지 않으므로</strong>, 함수의 마지막 문장이 그런 <code>loop</code>이면 값을 돌려주는 함수에도 최종 식이 필요 없다. 안쪽 <code>while</code>/<code>loop</code>의 <code>break</code>는 바깥 루프를 끝내지 못하므로 세지 않는다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 13\nfn find() i32 {\n    mut i = 0\n    loop {\n        i += 1\n        if i == 5 { return i }      // break가 없다: 이 loop 뒤에는 아무것도 필요 없다\n    }\n}\n\nfn main() i32 {\n    mut n = 0\n    loop {\n        n += 2\n        if n &gt; 7 { break }\n    }\n    n + find()                       // 8 + 5\n}\n</code></pre></div>\n<p><code>break</code>/<code>continue</code>를 루프 밖에서 쓰면 오류다. <code>break</code>/<code>continue</code>로 나갈 때 <strong>그 루프 본문 스코프의 힙 값은 해제된다</strong>.</p>\n<h3 class=\"doc-heading\" data-slug=\"54-for\" id=\"ref-reference--54-for\">5.4 <code>for</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--54-for\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>for 이름 in 시작..끝 { }       // 끝은 제외\nfor 이름 in 시작..=끝 { }      // 끝을 포함\nfor 이름 in 슬라이스 { }       // 또는 &amp;배열 — 원소를 값으로 복사\n</code></pre></div>\n<ul>\n<li><code>while</code>로 풀어 쓴다. <code>continue</code>도 증가 문장을 거친다. <code>a..=최댓값</code>도 넘치지 않는다.</li>\n<li><strong>루프 변수는 불변</strong>이다.</li>\n<li>범위의 정수 리터럴 끝점만 있으면 <code>i</code>는 <code>i32</code>다. 다른 정수형이 필요하면 끝점을 해당 타입의 변수로 두거나 <code>as</code>를 쓴다.</li>\n<li>슬라이스를 순회하면 <code>x</code>는 <strong>원소의 복사본</strong>이다(참조가 아니다). 원소를 바꾸려면 인덱스로 순회한다.</li>\n<li>이터레이터는 없다. 범위와 슬라이스/배열 참조만 된다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 16\nfn main() i32 {\n    mut s = 0\n    mut i = 0\n    while i &lt; 10 {\n        i += 1\n        if i % 2 == 0 { continue }\n        if i &gt; 7 { break }\n        s += i                // 1 + 3 + 5 + 7\n    }\n    for k in 0..=3 { s += k } // + 6\n    let pair = [1, 2]\n    for x in &amp;pair[..] { s += x }\n    s - 9\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"55-return\" id=\"ref-reference--55-return\">5.5 <code>return</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--55-return\">¶</a></h3>\n<p><code>return 식</code> 또는 값이 없는 함수의 <code>return</code>. 함수를 즉시 끝내며 살아 있는 모든 지역 변수의 힙 값을 해제한다.</p>\n<h3 class=\"doc-heading\" data-slug=\"56-식-문장\" id=\"ref-reference--56-식-문장\">5.6 식 문장<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--56-식-문장\">¶</a></h3>\n<p>값을 버리는 식. 버려지는 임시 값이 힙을 가지면(예: <code>string_from(\"x\")</code>) 즉시 해제된다.</p>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"6-match와-패턴\" id=\"ref-reference--6-match와-패턴\">6. <code>match</code>와 패턴<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--6-match와-패턴\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>match 식 {\n    패턴 =&gt; 식 | 블록\n    ...\n}\n</code></pre></div>\n<ul>\n<li>대상은 <code>Result</code> 또는 <code>Option</code> 값뿐이다. 패턴은 <code>Ok(이름)</code>, <code>Err(이름)</code>, <code>Some(이름)</code>, <code>None</code>이다. 한 <code>match</code>에서 <code>Ok/Err</code>와 <code>Some/None</code>을 섞을 수 없다.</li>\n<li>두 팔을 <strong>정확히 한 번씩</strong>, 순서 무관하게 쓴다. 빠지면 <code> `match` is missing the `None` arm</code> 오류다.</li>\n<li>팔은 쉼표나 줄바꿈으로 구분한다. 팔의 본문은 표현식이거나 <code>{ }</code> 블록이고, <code>if</code>처럼 <strong>값을 가진다</strong>: 모든 팔의 타입이 같아야 한다(값이 없는 문장 팔은 모두 값이 없어야 한다).</li>\n<li>바인딩 이름은 payload를 <strong>이동하거나 복사</strong>한다. payload가 힙을 가진 <code>Option&lt;String&gt;</code>을 <code>match</code>하면 <code>Some(s)</code>가 소유권을 가져간다.</li>\n<li>바인딩 이름 자리에 <code>_</code>를 쓰면 payload를 쓰지 않겠다는 뜻이다: <code>Ok(_)</code>, <code>Err(_)</code>, <code>Some(_)</code>. payload가 힙을 가져도 팔이 끝날 때 해제된다.</li>\n<li>정수, 문자열 등에 대한 <code>match</code>와 팔 전체를 대신하는 <code>_ =&gt;</code> 패턴은 없다. 그 경우 <code>if</code>/<code>else if</code>를 쓴다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn describe(o: Option&lt;i32&gt;) i32 {\n    match o {\n        Some(v) =&gt; {\n            v + 1\n        }\n        None =&gt; 0\n    }\n}\n\nfn main() i32 {\n    if describe(Some(4)) != 5 { return 1 }\n    if describe(None) != 0 { return 2 }\n    let r: Result&lt;i32, i32&gt; = Err(3)\n    match r { Ok(v) =&gt; v, Err(e) =&gt; e } - 3\n}\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"7-이름-해석과-모듈\" id=\"ref-reference--7-이름-해석과-모듈\">7. 이름 해석과 모듈<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--7-이름-해석과-모듈\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"71-파일-모듈\" id=\"ref-reference--71-파일-모듈\">7.1 파일 = 모듈<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--71-파일-모듈\">¶</a></h3>\n<ul>\n<li><code>use a.b</code>는 파일 <code>&lt;루트 폴더&gt;/a/b.tam</code>을 불러온다. 이후 <code>b::항목</code>으로 참조한다(모듈 경로는 <strong>한 단계</strong>: <code>alias::item</code>).</li>\n<li>루트 폴더는 컴파일을 시작한 파일(<code>tamc build main.tam</code>)의 폴더, 프로젝트 모드에서는 패키지의 <code>src/</code> 폴더다.</li>\n<li>불러온 모듈에서도 <code>use</code>를 쓸 수 있다(경로는 항상 루트 폴더 기준). 순환 <code>use</code>는 허용된다.</li>\n<li>같은 이름의 모듈 별칭을 두 번 가져오면(<code>use a.math</code> 다음에 <code>use b.math</code>) <code>module name </code>math<code> is imported more than once</code> 오류다. 별칭 바꾸기(<code>as</code>)는 없다.</li>\n<li>모듈을 못 찾으면 어떤 파일을 기대했는지 알려 주는 오류가 난다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,IGNORE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,ignore\">// main.tam                  // util/math.tam\nuse util.math                // pub struct Pt { x: i32, y: i32 }\nfn main() i32 {              // pub fn add(a: i32, b: i32) i32 { a + b }\n    let p = math::Pt { x: 1, y: 2 }\n    math::add(p.x, p.y)\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"72-가시성\" id=\"ref-reference--72-가시성\">7.2 가시성<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--72-가시성\">¶</a></h3>\n<ul>\n<li>모듈 밖에서 쓰려면 <code>pub fn</code> / <code>pub struct</code> / <code>pub extern</code>이어야 한다. 비공개 항목에 접근하면 <strong>두 파일을 함께 보여 주는 오류</strong>가 난다.</li>\n<li>구조체 필드는 항상 공개다.</li>\n<li>재공개(<code>pub use</code>)는 없다.</li>\n<li><code>const</code>도 <code>pub const</code>만 다른 모듈에서 <code>모듈::이름</code>으로 쓸 수 있다. 제네릭 함수·구조체도 같은 규칙이다(<code>pub fn max&lt;T&gt;</code>, <code>pub struct Stack&lt;T&gt;</code>). 다른 모듈의 제네릭 구조체는 <code>모듈::Stack&lt;i32&gt;</code>, 연관 함수는 <code>모듈::Stack&lt;i32&gt;::new()</code>로 쓴다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"73-맹글링과-이름-충돌\" id=\"ref-reference--73-맹글링과-이름-충돌\">7.3 맹글링과 이름 충돌<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--73-맹글링과-이름-충돌\">¶</a></h3>\n<p>루트 항목은 이름 그대로, 다른 모듈의 항목은 <code>util.math::add</code> 같은 이름으로 내려간다(LLVM에서는 따옴표 이름). 모듈 안의 항목은 다른 모듈의 같은 이름과 충돌하지 않는다. 오류 메시지의 타입 이름에는 <code>geo::Point</code>처럼 모듈이 붙어서 나온다.</p>\n<h3 class=\"doc-heading\" data-slug=\"74-표준-라이브러리\" id=\"ref-reference--74-표준-라이브러리\">7.4 표준 라이브러리<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--74-표준-라이브러리\">¶</a></h3>\n<p><code>use tam.os</code>, <code>use tam.fmt</code>, <code>use tam.serial</code>처럼 <strong>첫 조각이 <code>tam</code>이면</strong> 프로젝트 파일 대신 컴파일러에 내장된 TAM 소스를 쓴다. <code>tam.os</code>는 대상에 따라 구현이 다르고 공개 API는 같다. 자세한 내용은 <a href=\"#doc-ref-stdlib\">The Standard Library API Documentation</a>.</p>\n<h3 class=\"doc-heading\" data-slug=\"75-패키지와-의존성\" id=\"ref-reference--75-패키지와-의존성\">7.5 패키지와 의존성<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--75-패키지와-의존성\">¶</a></h3>\n<p>프로젝트 모드(<code>Tmake.toml</code>)에서는 <strong>의존성 패키지의 이름이 모듈 이름</strong>이 된다. 의존하는 패키지 <code>fmt-lib</code>는 <code>use fmt_lib</code>로 불러온다(<code>-</code>는 <code>_</code>로 바뀐다). 의존성 이름은 같은 이름의 지역 모듈보다 우선한다. 자세한 규칙은 <a href=\"#doc-ref-tmake\">Tmake.toml Documentation</a>.</p>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"8-소유권-이동-자동-해제\" id=\"ref-reference--8-소유권-이동-자동-해제\">8. 소유권, 이동, 자동 해제<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--8-소유권-이동-자동-해제\">¶</a></h2>\n<p>TAM은 가비지 컬렉터도 런타임도 없이 메모리를 안전하게 다루기 위해, 컴파일 시간에 <strong>소유권</strong>을 검사한다. 모든 값에는 소유자가 하나 있고, 소유자가 스코프를 벗어나면 값이 해제된다.</p>\n<h3 class=\"doc-heading\" data-slug=\"81-copy-타입과-이동-타입\" id=\"ref-reference--81-copy-타입과-이동-타입\">8.1 Copy 타입과 이동 타입<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--81-copy-타입과-이동-타입\">¶</a></h3>\n<ul>\n<li><strong>Copy</strong>: 정수, <code>f64</code>, <code>bool</code>, <code>str</code>, <code>&amp;T</code>, <code>&amp;[T]</code>, raw 포인터. 대입과 인자 전달은 복사다.</li>\n<li><strong>이동 타입</strong>: <code>String</code>, 구조체, 배열, <code>&amp;mut T</code>, 이동 타입을 담은 <code>Result</code>/<code>Option</code>. 대입, 인자 전달, 반환, 구조체 필드 초기화는 <strong>이동</strong>이며 이동된 변수는 이후 쓸 수 없다(<code>use of moved value</code>).</li>\n<li><strong>구조체는 필드가 모두 Copy여도 이동 타입</strong>이다. 배열도 마찬가지다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: use of moved value `a`\nstruct P { x: i32 }\nfn main() i32 {\n    let a = P { x: 1 }\n    let b = a\n    a.x + b.x\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"82-이동-분석\" id=\"ref-reference--82-이동-분석\">8.2 이동 분석<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--82-이동-분석\">¶</a></h3>\n<ul>\n<li>분기마다 이동 상태를 합친다. 한쪽 분기에서만 이동했다면 이후에는 \"이동했을 수도 있음\"이므로 쓸 수 없다.</li>\n<li>루프 안에서 바깥 변수를 이동하면, 다음 반복에서 다시 쓰이므로 오류다(<code>use of moved value</code> — \"value moved here, in previous iteration of loop\"). 이동 직후에 <code>break</code>하면 괜찮다.</li>\n<li><code>break</code>/<code>continue</code>는 그 시점의 이동 상태를 루프 뒤(<code>break</code>)나 다음 반복(<code>continue</code>)으로 합친다.</li>\n<li>이동은 항상 <strong>값 전체</strong> 단위다. 구조체에서 힙을 쥔 필드 하나만 꺼내 이동할 수는 없다(<a href=\"#doc-ref-reference--46-구조체-리터럴-필드-인덱스\">4.6절</a>).</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"83-자동-해제drop\" id=\"ref-reference--83-자동-해제drop\">8.3 자동 해제(drop)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--83-자동-해제drop\">¶</a></h3>\n<ul>\n<li><code>String</code>을 가진 타입(구조체 필드, 배열 원소가 아닌 <code>Result</code>/<code>Option</code> payload 포함)은 <strong>스코프가 끝날 때 선언의 역순으로</strong> 해제된다.</li>\n<li>이동되었는지는 변수마다 둔 런타임 플래그로 판단하므로 <strong>조건부 이동도 정확히</strong> 해제/생략된다.</li>\n<li><code>return</code>, <code>?</code>, <code>break</code>, <code>continue</code>는 빠져나가는 스코프의 살아 있는 값을 모두 해제하고 나간다.</li>\n<li>재대입은 이전 값을 먼저 해제한다. 버려지는 임시 값(<code>string_from(\"x\")</code> 문장)도 즉시 해제된다.</li>\n<li>호스트에서 valgrind로 누수·이중 해제·잘못된 접근이 없음을 테스트로 확인한다.</li>\n<li><strong>해제되지 않는 경우</strong>: <code>os::exit</code>는 즉시 종료하므로 살아 있는 지역 변수의 해제를 실행하지 않는다. trap/패닉도 해제를 실행하지 않는다. 할당 실패(<code>malloc</code>이 NULL)는 검사하지 않는다.</li>\n<li>사용자 정의 소멸자(<code>Drop</code>)와 <code>Box&lt;T&gt;</code>는 없다. 직접 만든 힙 구조는 <code>unsafe</code>의 <code>alloc</code>/<code>free</code>로 관리한다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nstruct User {\n    name: String,\n    age: i32,\n}\n\nfn age_plus_len(u: User) i32 { u.age + u.name.len as i32 } // u는 여기서 해제된다\n\nfn main() i32 {\n    let u = User { name: string_from(\"ab\"), age: 1 }\n    age_plus_len(u)\n    // u는 이동되었으므로 여기서 다시 해제되지 않는다(valgrind 클린)\n}\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"9-빌림-규칙\" id=\"ref-reference--9-빌림-규칙\">9. 빌림 규칙<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--9-빌림-규칙\">¶</a></h2>\n<p>참조(<code>&amp;T</code>, <code>&amp;mut T</code>, <code>&amp;[T]</code>, <code>&amp;mut [T]</code>, <code>as_str</code>의 결과 <code>str</code>)는 <strong>소유자를 빌린다</strong>. 컴파일러는 다음을 검사한다.</p>\n<h3 class=\"doc-heading\" data-slug=\"91-규칙\" id=\"ref-reference--91-규칙\">9.1 규칙<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--91-규칙\">¶</a></h3>\n<ol>\n<li>같은 값에 대해 <strong>읽기 참조는 여러 개</strong>, 또는 <strong>쓰기 참조는 하나</strong>만 동시에 살아 있을 수 있다(둘을 섞을 수 없다).</li>\n<li>참조가 살아 있는 동안 소유자를 <strong>이동</strong>하거나 <strong>대입</strong>할 수 없다.</li>\n<li>참조는 소유자보다 오래 살 수 없다(지역 변수의 참조 반환, 스코프 밖 사용은 오류).</li>\n<li><code>&amp;mut</code>는 <code>mut</code> 변수에서만 만든다.</li>\n</ol>\n<h3 class=\"doc-heading\" data-slug=\"92-살아-있는-구간\" id=\"ref-reference--92-살아-있는-구간\">9.2 \"살아 있는 구간\"<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--92-살아-있는-구간\">¶</a></h3>\n<p>참조가 살아 있는 구간은 <strong>마지막 사용까지</strong>다(NLL 방식). 참조를 이후에 쓰지 않으면 충돌 후 문장도 허용된다.</p>\n<ul>\n<li>구조체의 <strong>서로 다른 필드</strong>는 따로 빌릴 수 있다(<code>&amp;mut p.x</code>와 <code>&amp;mut p.y</code>). 한 구조체 전체와 그 필드는 충돌한다.</li>\n<li><strong>배열 원소는 구분하지 않는다</strong>: <code>&amp;mut a[0]</code>과 <code>&amp;a[1]</code>은 충돌한다(보수적).</li>\n<li><code>&amp;mut</code> 참조를 값으로 쓰면 암묵적 <strong>재차용</strong>이며, 재차용이 끝날 때까지 원본은 쓸 수 없다.</li>\n<li>함수가 반환하는 참조의 출처는 <strong>lifetime 표기 없이</strong> 본문에서 추론한다. 여러 인자에서 올 수 있으면 보수적으로 모두를 빌린 것으로 본다.</li>\n<li>참조 변수에 다시 대입해도 이전 빌림이 풀리지 않는다(보수적). 드물게 올바른 코드가 거부될 수 있다.</li>\n<li><code>break</code>/<code>continue</code> 이후의 경로는 보수적으로 \"모든 이후 경로가 도달 가능\"으로 본다. 안전하지만 드물게 유효한 코드를 거절할 수 있다.</li>\n<li>raw 포인터는 빌림 검사의 대상이 아니다. 책임은 <code>unsafe</code>를 쓰는 쪽에 있다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot assign to `v` because it is borrowed\nfn main() i32 {\n    mut v = 1\n    let r = &amp;v\n    v = 2\n    *r\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot borrow `s` as mutable more than once at a time\nfn main() i32 {\n    mut s = string_from(\"a\")\n    let r = &amp;mut s\n    let q = &amp;mut s\n    string_push(r, 1)\n    0\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot return reference to local variable `x`\nfn f() &amp;i32 {\n    let x = 5\n    &amp;x\n}\nfn main() i32 { *f() }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nstruct P { x: i32, y: i32 }\n\nfn main() i32 {\n    mut p = P { x: 1, y: 2 }\n    let a = &amp;mut p.x      // 서로 다른 필드는 동시에 빌릴 수 있다\n    let b = &amp;mut p.y\n    *a += 1\n    *b += 1\n    p.x + p.y\n}\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"10-수치-의미-오버플로-변환-시프트\" id=\"ref-reference--10-수치-의미-오버플로-변환-시프트\">10. 수치 의미: 오버플로, 변환, 시프트<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--10-수치-의미-오버플로-변환-시프트\">¶</a></h2>\n<ul>\n<li>정수 <code>+ - *</code>와 단항 <code>-</code>는 오버플로하면 <strong>trap</strong>한다(패닉 <code>integer overflow</code>). <code>/</code>, <code>%</code>는 0으로 나누거나 <code>MIN / -1</code>이면 trap한다(패닉 <code>integer overflow in division</code> / <code>division by zero</code>).</li>\n<li>상수끼리의 식(<code>2147483647 + 1</code>)도 실행 시간 trap이다.</li>\n<li><strong>감싸는 연산은 명시한다</strong>: <code>wrapping_add(a, b)</code>, <code>wrapping_sub(a, b)</code>, <code>wrapping_mul(a, b)</code>(정수형, 두 인자의 타입이 같아야 한다).</li>\n<li><code>f64</code>와 포인터 산술, 비트 연산, 시프트는 trap하지 않는다.</li>\n<li><code>as</code> 변환은 감싸거나 포화한다. trap하지 않는다(<a href=\"#doc-ref-reference--45-변환-as\">4.5절</a>).</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let a: i32 = 2147483647\n    if wrapping_add(a, 1) != -2147483647 - 1 { return 1 }\n    let b: u8 = 200\n    if wrapping_mul(b, 2) != 144 { return 2 }\n    0\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: integer overflow\nfn main() i32 {\n    let a: i32 = 2147483647\n    a + 1\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: division by zero\nfn main() i32 {\n    let z = 0\n    10 / z\n}\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"11-unsafe와-raw-포인터\" id=\"ref-reference--11-unsafe와-raw-포인터\">11. <code>unsafe</code>와 raw 포인터<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--11-unsafe와-raw-포인터\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"111-raw-포인터\" id=\"ref-reference--111-raw-포인터\">11.1 raw 포인터<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--111-raw-포인터\">¶</a></h3>\n<p><code>*const T</code>와 <code>*mut T</code>는 빌림 검사를 받지 않는 포인터다. 만들기와 변환은 safe다: <code>&amp;mut x as *mut i32</code>, 포인터 ↔ 포인터, 포인터 ↔ <code>i64</code>/<code>u64</code>.</p>\n<h3 class=\"doc-heading\" data-slug=\"112-unsafe가-필요한-것\" id=\"ref-reference--112-unsafe가-필요한-것\">11.2 <code>unsafe</code>가 필요한 것<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--112-unsafe가-필요한-것\">¶</a></h3>\n<ul>\n<li>포인터 <strong>역참조</strong> <code>*p</code></li>\n<li>포인터 <strong>산술</strong>(<code>p + n</code>, <code>p - n</code>, 단위는 원소)</li>\n<li><code>unsafe fn</code>과 <code>extern</code> 함수의 <strong>호출</strong></li>\n<li><code>alloc</code>, <code>free</code>, 하드웨어 접근 내장 함수(<code>mmio_*</code> 등)의 호출</li>\n</ul>\n<p><code>unsafe { ... }</code> 블록은 <strong>값을 가지는 표현식</strong>이다(마지막 식이 값). <code>unsafe fn</code>의 본문 전체는 <code>unsafe</code> 맥락이다.</p>\n<h3 class=\"doc-heading\" data-slug=\"113-책임\" id=\"ref-reference--113-책임\">11.3 책임<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--113-책임\">¶</a></h3>\n<p><code>unsafe</code> 안에서 컴파일러는 포인터의 유효성(정렬, 범위, 수명, 별칭)을 검사하지 않는다. 위반하면 정의되지 않은 동작이다. 대신 <code>unsafe</code> 바깥은 컴파일러가 안전을 책임진다. 이것이 TAM의 철학이다: <strong>사용자에게 통제권을 모두 주되, 안정성은 컴파일러가 책임진다.</strong> <code>unsafe</code>의 표면은 작게 유지하고, 안전한 API로 감싸 쓰라.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nfn main() i32 {\n    let m = unsafe { alloc(16) }          // 16바이트 힙 블록\n    let q = m as *mut i32\n    let r = unsafe {\n        *q = 4\n        *(q + 1) = 5                      // 포인터 산술: 원소(i32) 단위\n        let sum = *q + *(q + 1)\n        free(m)\n        sum\n    }\n    r\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: needs an `unsafe` block\nfn main() i32 {\n    let m = alloc(16)\n    0\n}\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"12-프로그램-실행-진입점-종료-패닉-trap\" id=\"ref-reference--12-프로그램-실행-진입점-종료-패닉-trap\">12. 프로그램 실행: 진입점, 종료, 패닉, trap<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--12-프로그램-실행-진입점-종료-패닉-trap\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"121-진입점\" id=\"ref-reference--121-진입점\">12.1 진입점<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--121-진입점\">¶</a></h3>\n<p>프로그램에는 정확히 <code>fn main() i32</code>가 하나 있어야 한다. 없으면 <code>no </code>main<code> function found</code>, 시그니처가 다르면 <code>`main` must have the signature `fn main() i32`</code>. (프로젝트 모드의 <code>kind = \"lib\"</code> 패키지는 <code>main</code>이 필요 없고 검사만 된다.)</p>\n<p><code>main</code>이 돌려주는 값이 <strong>종료 코드</strong>다. Linux에서는 하위 8비트가 프로세스 종료 상태가 되고, Windows에서는 32비트 전체가 <code>ExitProcess</code>로 전달된다. UEFI에서는 <code>EFI_STATUS</code>로 돌려준다.</p>\n<h3 class=\"doc-heading\" data-slug=\"122-패닉과-trap\" id=\"ref-reference--122-패닉과-trap\">12.2 패닉과 trap<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--122-패닉과-trap\">¶</a></h3>\n<p>컴파일러가 넣은 검사(오버플로, 0 나눗셈, 경계 위반)와 <code>panic</code>, <code>assert</code>, <code>unwrap</code> 실패는 <strong>trap</strong>으로 프로그램을 끝낸다.</p>\n<ul>\n<li><strong>호스트</strong>: stderr에 <code>tam: panic: &lt;메시지&gt;</code>를 쓰고 <code>SIGILL</code>(신호 4)로 종료한다. libc 없이 <code>write</code> 시스콜을 직접 쓴다. 메시지는 <code>integer overflow</code>, <code>integer overflow in division</code>, <code>division by zero</code>, <code>index out of bounds</code>, <code>assertion failed</code>, <code>called `unwrap()` on a `None` value</code> 등이다. <code>tamc run</code>은 <code>128 + 신호 번호</code>로 종료 코드를 알린다.</li>\n<li><strong>그 밖의 대상</strong>: 메시지 없이 <code>ud2</code>/<code>brk</code>로 내려간다. 펌웨어 대상에서는 예외 핸들러를 설치하지 않으므로 예외가 나면 리셋하거나 멈춘다.</li>\n<li>trap과 패닉은 <strong>자동 해제를 실행하지 않는다</strong>.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: tam: panic: boom\nfn main() i32 {\n    panic(\"boom\")\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: assertion failed\nfn main() i32 {\n    assert(1 + 1 == 3)\n    0\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: called `unwrap()` on a `None` value\nfn none() Option&lt;i32&gt; { None }\nfn main() i32 { none().unwrap() }\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"123-스택\" id=\"ref-reference--123-스택\">12.3 스택<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--123-스택\">¶</a></h3>\n<p>스레드도 비동기도 없다. 스택 크기는 운영체제 기본값(Linux 8MiB 등)이며, 무한 재귀로 넘치면 운영체제가 프로세스를 끝낸다(검사는 없다). 4KiB를 넘는 스택 프레임을 가진 함수는 Windows/펌웨어에서 <code>__chkstk</code>가 스택을 점검하며 넘기지 않게 한다.</p>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"13-컴파일-대상\" id=\"ref-reference--13-컴파일-대상\">13. 컴파일 대상<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--13-컴파일-대상\">¶</a></h2>\n<p><code>--target</code>(또는 <code>Tmake.toml</code>의 <code>[build] target</code>)으로 고른다.</p>\n<table>\n<thead>\n<tr>\n<th>대상</th>\n<th>산출물</th>\n<th>비고</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>host</code></td>\n<td>네이티브 실행 파일</td>\n<td>Windows 외 기본값. 시스템 <code>clang</code>으로 링크한다</td>\n</tr>\n<tr>\n<td><code>windows</code></td>\n<td>x64 <code>.exe</code></td>\n<td>Windows 기본값. CRT, MSVC, Windows SDK 없이 <code>kernel32</code>만 쓴다. <code>llc</code>(없으면 <code>clang</code>)와 <code>lld-link</code>가 필요</td>\n</tr>\n<tr>\n<td><code>uefi</code></td>\n<td>x86-64 <code>.efi</code></td>\n<td><code>EFI/BOOT/BOOTX64.EFI</code>로 부팅</td>\n</tr>\n<tr>\n<td><code>bios</code></td>\n<td>x86-64 부팅 디스크 <code>.img</code></td>\n<td>부트 섹터 + 프로그램. 페이로드 최대 384KiB</td>\n</tr>\n<tr>\n<td><code>aarch64</code></td>\n<td>AArch64 <code>Image</code> <code>.bin</code></td>\n<td>QEMU <code>virt -kernel</code>용. EL1, MMU 꺼짐</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>대상에 맞지 않는 내장 함수(<code>mmio_*</code>, <code>port_*</code>, <code>halt</code>, <code>semihost</code>, <code>ccall*</code>, <code>efi_*</code>)를 쓰면 위치와 함께 컴파일 오류다.</li>\n<li><code>tam.os</code>의 공개 API는 모든 대상에서 같지만, 펌웨어 대상은 <code>print</code>, <code>println</code>, <code>print_int</code>, <code>exit</code>만 제공한다.</li>\n<li>호스트와 Windows에서 같은 프로그램이 같은 출력을 낸다(에뮬레이터로 검증했다. 실제 Windows 실행은 CI가 확인한다).</li>\n</ul>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"14-내장-함수\" id=\"ref-reference--14-내장-함수\">14. 내장 함수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--14-내장-함수\">¶</a></h2>\n<p>내장 함수는 예약된 이름이며 어떤 <code>use</code>도 없이 쓴다.</p>\n<table>\n<thead>\n<tr>\n<th>이름</th>\n<th>시그니처</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>string_from</code></td>\n<td><code>(str) -&gt; String</code></td>\n<td>힙에 복사해 새 <code>String</code>을 만든다</td>\n</tr>\n<tr>\n<td><code>string_push</code></td>\n<td><code>(&amp;mut String, u8)</code></td>\n<td>한 바이트를 덧붙인다. 용량이 모자라면 2배로 늘린다</td>\n</tr>\n<tr>\n<td><code>as_str</code></td>\n<td><code>(&amp;String) -&gt; str</code></td>\n<td><code>String</code>을 빌려 <code>str</code>을 만든다</td>\n</tr>\n<tr>\n<td><code>panic</code></td>\n<td><code>(str) -&gt; !</code></td>\n<td>메시지를 출력하고 trap한다</td>\n</tr>\n<tr>\n<td><code>assert</code></td>\n<td><code>(bool)</code></td>\n<td>거짓이면 <code>assertion failed</code>로 trap한다</td>\n</tr>\n<tr>\n<td><code>wrapping_add</code> <code>wrapping_sub</code> <code>wrapping_mul</code></td>\n<td><code>(T, T) -&gt; T</code></td>\n<td>정수형. 감싸는 산술</td>\n</tr>\n<tr>\n<td><code>alloc</code></td>\n<td><code>unsafe (u64) -&gt; *mut u8</code></td>\n<td>힙 블록을 할당한다</td>\n</tr>\n<tr>\n<td><code>free</code></td>\n<td><code>unsafe (*mut u8)</code></td>\n<td><code>alloc</code>/<code>String</code> 힙 블록을 해제한다</td>\n</tr>\n<tr>\n<td><code>mmio_read8/16/32/64</code></td>\n<td><code>unsafe (u64) -&gt; uN</code></td>\n<td>volatile 읽기(펌웨어 전용)</td>\n</tr>\n<tr>\n<td><code>mmio_write8/16/32/64</code></td>\n<td><code>unsafe (u64, uN)</code></td>\n<td>volatile 쓰기(펌웨어 전용)</td>\n</tr>\n<tr>\n<td><code>port_in8/in32</code></td>\n<td><code>unsafe (u16) -&gt; uN</code></td>\n<td>x86 포트 읽기(uefi, bios)</td>\n</tr>\n<tr>\n<td><code>port_out8/out32</code></td>\n<td><code>unsafe (u16, uN)</code></td>\n<td>x86 포트 쓰기(uefi, bios)</td>\n</tr>\n<tr>\n<td><code>halt</code></td>\n<td><code>unsafe ()</code></td>\n<td>CPU를 멈춘다(펌웨어 전용)</td>\n</tr>\n<tr>\n<td><code>semihost</code></td>\n<td><code>unsafe (u64, u64) -&gt; u64</code></td>\n<td>AArch64 semihosting 호출(aarch64 전용)</td>\n</tr>\n<tr>\n<td><code>ccall0..ccall4</code></td>\n<td><code>unsafe (*const u8, u64...) -&gt; u64</code></td>\n<td>함수 포인터 호출(uefi 전용)</td>\n</tr>\n<tr>\n<td><code>efi_system_table</code>, <code>efi_image_handle</code></td>\n<td><code>unsafe () -&gt; *mut u8</code></td>\n<td>UEFI 인자(uefi 전용)</td>\n</tr>\n</tbody>\n</table>\n<p>할당은 런타임의 <code>tam_alloc</code>/<code>tam_realloc</code>/<code>tam_free</code>를 거친다(호스트는 libc, Windows는 Heap API, 펌웨어는 자체 할당자). 사용자가 allocator를 교체하는 문법은 아직 없다.</p>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"15-구현-한계\" id=\"ref-reference--15-구현-한계\">15. 구현 한계<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--15-구현-한계\">¶</a></h2>\n<p>컴파일러가 안전하게 처리하는 범위를 정해 두었다. 넘으면 <strong>크래시가 아니라 위치와 함께 오류</strong>를 낸다.</p>\n<table>\n<thead>\n<tr>\n<th>한계</th>\n<th>값</th>\n<th>오류</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>구문 중첩(괄호, 블록, 단항 연산자, 타입)</td>\n<td>200단계</td>\n<td><code>nesting is too deep (more than 200 levels)</code></td>\n</tr>\n<tr>\n<td>한 식의 연산자 사슬(<code>a + b + c + …</code>)</td>\n<td>2000개</td>\n<td><code>expression has more than 2000 operators in a row</code></td>\n</tr>\n<tr>\n<td>제네릭 인스턴스</td>\n<td>5000개, 중첩 깊이 64</td>\n<td><code>generic instantiation limit exceeded</code></td>\n</tr>\n<tr>\n<td>오류 보고</td>\n<td>첫 번째 오류 하나</td>\n<td></td>\n</tr>\n<tr>\n<td>BIOS 이미지 페이로드</td>\n<td>384KiB</td>\n<td></td>\n</tr>\n<tr>\n<td>힙(BIOS/AArch64)</td>\n<td>각 32MiB</td>\n<td>바닥나면 trap</td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FRAGMENT<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,fragment\">// 긴 식은 문장으로 나눈다. 1900개 항은 허용된다.\nfn main() i32 { 0 + 1 + 1 + 1 }\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"16-문법-요약ebnf\" id=\"ref-reference--16-문법-요약ebnf\">16. 문법 요약(EBNF)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--16-문법-요약ebnf\">¶</a></h2>\n<p><code>{ x }</code>는 0회 이상, <code>[ x ]</code>는 선택, <code>|</code>는 선택지, 따옴표는 글자 그대로다. <code>NL</code>은 문장 끝(줄바꿈 또는 <code>;</code>)이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>program     = { item } .\nitem        = use | struct | impl | function | extern | const .\n\nuse         = \"use\" ident { \".\" ident } NL .\nconst       = [ \"pub\" ] \"const\" ident \":\" type \"=\" expr NL .\ntparams     = \"&lt;\" ident { \",\" ident } \"&gt;\" .\nstruct      = [ \"pub\" ] \"struct\" ident [ tparams ] \"{\" [ field { ( \",\" | NL ) field } [ \",\" ] ] \"}\" .\nfield       = ident \":\" type .\nimpl        = \"impl\" ident [ tparams ] \"{\" { [ \"pub\" ] function } \"}\" .\nfunction    = [ \"pub\" ] [ \"unsafe\" ] \"fn\" ident [ tparams ] \"(\" [ params ] \")\" [ type ] block .\nextern      = [ \"pub\" ] \"extern\" string \"fn\" ident \"(\" [ params ] \")\" [ type ] [ \"=\" string ] .\nparams      = param { \",\" param } [ \",\" ] .\nparam       = ident \":\" type | \"&amp;\" [ \"mut\" ] \"self\" | \"self\" .\n\ntype        = \"&amp;\" [ \"mut\" ] type\n            | \"*\" ( \"const\" | \"mut\" ) type\n            | \"[\" type [ \";\" ( int | ident ) ] \"]\"\n            | ident [ \"&lt;\" type { \",\" type } \"&gt;\" ] .\n\nblock       = \"{\" { stmt NL } [ expr ] \"}\" .\nstmt        = ( \"let\" | \"mut\" ) ident [ \":\" type ] \"=\" expr\n            | place assign_op expr\n            | \"return\" [ expr ]\n            | \"break\" | \"continue\"\n            | \"while\" expr block\n            | \"loop\" block\n            | \"for\" ident \"in\" expr ( \"..\" | \"..=\" ) expr block\n            | \"for\" ident \"in\" expr block\n            | expr .\nassign_op   = \"=\" | \"+=\" | \"-=\" | \"*=\" | \"/=\" | \"%=\" | \"&amp;=\" | \"|=\" | \"^=\" | \"&lt;&lt;=\" | \"&gt;&gt;=\" .\n\nexpr        = binary .\nbinary      = unary { binop unary } .          (* 우선순위는 4.1절 *)\nunary       = ( \"-\" | \"!\" | \"~\" | \"*\" | \"&amp;\" [ \"mut\" ] ) unary | postfix { \"as\" type } .\npostfix     = primary { \".\" ident [ \"(\" args \")\" ] | \"[\" index \"]\" | \"?\" } .\nindex       = expr | [ expr ] \"..\" [ expr ] .\nprimary     = int | float | char | string | \"true\" | \"false\"\n            | ident [ \"&lt;\" type { \",\" type } \"&gt;\" ] [ \"::\" ident [ \"::\" ident ] ] [ \"(\" args \")\" | \"{\" fieldinits \"}\" ]\n            | \"(\" expr \")\"\n            | \"[\" expr { \",\" expr } [ \",\" ] \"]\" | \"[\" expr \";\" ( int | ident ) \"]\"\n            | \"if\" expr block [ \"else\" ( block | \"if\" ... ) ]\n            | \"match\" expr \"{\" arm { ( \",\" | NL ) arm } \"}\"\n            | \"unsafe\" block .\narm         = pattern \"=&gt;\" ( expr | block ) .\npattern     = ( \"Ok\" | \"Err\" | \"Some\" ) \"(\" ( ident | \"_\" ) \")\" | \"None\" .\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"17-아직-없는-것\" id=\"ref-reference--17-아직-없는-것\">17. 아직 없는 것<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--17-아직-없는-것\">¶</a></h2>\n<p>TAM은 작게 시작했다. 다음은 <strong>아직 없다</strong>(없는 것을 쓰면 오류가 난다).</p>\n<ul>\n<li>트레이트(제네릭의 경계), 메서드 자신의 타입 매개변수, 상수 제네릭(<code>[T; N]</code>의 <code>N</code>), 연산자 오버로딩, 클로저, 함수 포인터 값</li>\n<li>열거형(<code>enum</code>), 튜플, 별칭 타입, 전역 <strong>변수</strong>/정적 변수(상수는 있다)</li>\n<li><code>Vec</code>과 해시맵 같은 가변 길이 컬렉션(<code>tam.os</code>/<code>tam.fmt</code> 이외의 표준 라이브러리)</li>\n<li>레이블 <code>break</code>, <code>break 값</code>, 문자열·정수 <code>match</code>, 팔 전체를 대신하는 <code>_ =&gt;</code> 패턴</li>\n<li><code>use</code> 별칭, <code>pub use</code>, 필드 단위 <code>pub</code></li>\n<li>사용자 allocator 교체, 사용자 정의 소멸자, <code>Box&lt;T&gt;</code></li>\n<li><code>String</code> 인덱싱, 슬라이스·배열 비교(<code>==</code>), 길이 0 배열, 식으로 된 배열 길이(<code>N * 2</code>; 상수 이름은 된다)</li>\n<li>오류 타입 변환(<code>From</code>), <code>Option</code>/<code>Result</code>의 <code>map</code> 등 조합 메서드</li>\n<li>여러 오류를 한 번에 보고하는 기능(첫 오류만 보고한다)</li>\n<li>스레드, 비동기, 파일/디렉터리 조작과 명령줄 인자(<code>tam.os</code>의 범위: <a href=\"#doc-ref-stdlib\">표준 라이브러리 문서</a>)</li>\n</ul>\n<p>이 목록은 <code>ROADMAP.md</code>의 마일스톤에 따라 줄어든다.</p>\n<h2 class=\"doc-heading\" data-slug=\"18-호환성-약속-tam-1\" id=\"ref-reference--18-호환성-약속-tam-1\">18. 호환성 약속: TAM 1<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-reference--18-호환성-약속-tam-1\">¶</a></h2>\n<p><code>tamc 1.0</code>은 <strong>TAM 1</strong>의 첫 공식 버전이다. 이 문서가 정의하는 언어를 <strong>에디션 1</strong>이라 부른다.</p>\n<p><strong>약속 (1.x 동안)</strong></p>\n<ul>\n<li>에디션 1에서 올바르게 컴파일되던 프로그램은 이후의 모든 <code>1.x</code> 컴파일러에서도 같은 의미로 컴파일된다. 종료 코드, 출력, trap 조건(오버플로, 경계, 0 나누기)은 바뀌지 않는다.</li>\n<li>새 기능은 <strong>추가만</strong> 한다. 17장의 \"아직 없는 것\"은 채워질 수 있어도 기존 문법의 뜻을 바꾸지 않는다.</li>\n<li>새 키워드는 에디션 1에서 식별자로 쓰이던 이름을 깨지 않는 방식으로만 들이며, 불가피하면 새 에디션으로 미룬다.</li>\n<li>컴파일러가 <strong>더 많은 오류를 잡아내는 것</strong>은 버그 수정이다. 이전에 잘못 받아들이던 프로그램(예: 실제로는 메모리 안전하지 않은 코드)은 거절될 수 있다. 이 경우 변경 이력에 적는다.</li>\n<li>오류 <strong>메시지 문구</strong>와 위치 표시는 약속 대상이 아니다. 도구는 종료 코드로 판단해야 한다.</li>\n<li>표준 라이브러리(<code>tam.os</code>, <code>tam.fmt</code>, <code>tam.serial</code>)와 내장 함수의 시그니처는 1.x에서 제거·변경하지 않는다.</li>\n<li><code>Tmake.toml</code>의 기존 키와 <code>Tmake.lock</code> 형식은 읽을 수 있게 유지한다.</li>\n</ul>\n<p><strong>에디션</strong></p>\n<p><code>Tmake.toml</code>의 <code>[package]</code>에 <code>edition = \"1\"</code>을 쓸 수 있다(생략하면 <code>\"1\"</code>). 이 컴파일러가 모르는 에디션이면 <code>unsupported edition</code>으로 빌드가 거절된다. 호환되지 않는 변경이 필요해지면 새 에디션(<code>\"2\"</code>)으로만 도입하고, 컴파일러는 에디션 1 패키지를 계속 빌드한다. 한 프로젝트 안에서 패키지마다 에디션이 달라도 된다.</p>\n<p><strong>약속하지 않는 것</strong></p>\n<ul>\n<li>\"정해지지 않았다\"고 적은 동작, 구현 한계의 정확한 수치(15장), 코드 생성 결과(LLVM IR, 어셈블리), 단형화 인스턴스의 내부 이름, <code>tamc</code> 내부 옵션 중 문서에 없는 것.</li>\n<li>제네릭의 단형화 방식은 유지되며, 이후 트레이트 경계가 <strong>추가</strong>되더라도 경계 없는 기존 제네릭 코드는 계속 컴파일된다.</li>\n</ul>\n", "text": "The TAM Reference ¶ 이 문서는 TAM 언어의 규범적 정의 다. 문법, 타입, 평가 규칙, 소유권과 빌림 규칙, 오류와 trap의 동작을 빠짐없이 적는다. 언어를 처음 배운다면 The TAM Book 을, 예제로 익히려면 TAM by Example 을 먼저 보라. 대상 버전: tamc 1.0 이 문서의 모든 tam 코드 블록은 개발 중 검증 도구가 실제로 컴파일하고 실행해 검증한다(출력과 종료 코드 포함). 블록 아래의 // exit: , // out: , // error: 주석이 그 기대값이다. \"구현이 보장한다\"고 적은 동작은 테스트로 고정되어 있다. \"정해지지 않았다\"고 적은 것은 바뀔 수 있으니 기대지 말 것. 목차 ¶ 소스 파일과 어휘 구조 항목(Items) 타입 표현식 문장 match 와 패턴 이름 해석과 모듈 소유권, 이동, 자동 해제 빌림 규칙 수치 의미: 오버플로, 변환, 시프트 unsafe 와 raw 포인터 프로그램 실행: 진입점, 종료, 패닉, trap 컴파일 대상 내장 함수 구현 한계 문법 요약(EBNF) 아직 없는 것 호환성 약속: TAM 1 1. 소스 파일과 어휘 구조 ¶ 1.1 소스 파일 ¶ 소스 파일의 확장자는 .tam , 인코딩은 UTF-8 이다. 유효하지 않은 UTF-8은 cannot read ...: stream did not contain valid UTF-8 오류다. 파일 맨 앞의 UTF-8 BOM( U+FEFF )은 무시한다. 줄 끝은 \\n 또는 \\r\\n 이다. 파일 하나가 모듈 하나다( 7장 ). 1.2 주석 ¶ 주석은 두 가지다. // 에서 줄 끝까지. /* ... */ 블록 주석. 중첩할 수 있다 ( /* a /* b */ c */ 는 하나의 주석). 닫히지 않으면 unterminated block comment 오류다. 블록 주석은 공백으로 취급한다. 단, 줄이 바뀌는 블록 주석은 문장을 끝내는 줄바꿈 하나 로 취급한다(문장은 줄바꿈으로 끝나기 때문이다, 1.7절 ). TAM 복사 // 이것은 주석이다.\n/* 이것도 /* 중첩된 */ 주석이다. */\nfn main() i32 {\n    let x = 1 // 줄 끝 주석\n    let y = 2 /* 문장 안의 주석 */ + 3\n    /* 여러 줄에\n       걸친 주석 */\n    x + y - 6\n} 1.3 식별자 ¶ 식별자는 ASCII 영문자 또는 _ 로 시작하고 ASCII 영문자, 숫자, _ 가 이어진다. 대소문자를 구분한다. 관례는 함수·변수 snake_case , 구조체 PascalCase 다(컴파일러가 강제하지는 않는다). 1.4 키워드 ¶ CODE 복사 as break const continue else extern false fn for if impl in let\nloop match mut pub return struct true unsafe use while const 는 전역 상수 선언( 2.6절 )과 포인터 타입( *const T )에 쓰인다. Ok , Err , Some , None , Result , Option , Self , self 와 14장 의 내장 함수 이름은 예약된 이름이다. 내장 함수와 같은 이름의 함수를 정의하면 `string_from` is a built-in function and cannot be redefined 같은 오류가 난다(단, wrapping_add / wrapping_sub / wrapping_mul 은 사용자 정의가 우선한다). 1.5 리터럴 ¶ 종류 예 타입 10진 정수 42 , 1_000_000 문맥에서 정해지는 정수형. 정해지지 않으면 i32 16/8/2진 정수 0xFF , 0o17 , 0b1010_0001 위와 같음 실수 1.5 , 2.0 , 1e3 , 1.5e-2 f64 문자 'a' , '\\n' 정수(문맥이 없으면 i32 ). 값은 ASCII/코드 포인트 문자열 \"hello\\n\" str 불리언 true , false bool 정수 리터럴의 _ 는 자릿수 구분용이며 무시된다. 값의 범위는 u64 최댓값까지 쓸 수 있다( 0xFFFF_FFFF_FFFF_FFFF ). 그보다 크면 integer literal out of range 오류다. 정수 리터럴이 놓인 자리의 타입에 값이 들어가지 않으면 컴파일 오류다( let x: u8 = 300 은 integer literal out of range for u8 ). - 는 리터럴의 일부가 아니라 단항 연산자다. 단, 각 타입의 최솟값( -128 for i8 , -9223372036854775808 for i64 )은 올바르게 쓸 수 있다. 문자열 이스케이프: \\n \\t \\r \\0 \\\\ \\\" . 문자 리터럴은 추가로 \\' 를 쓴다. 그 밖의 이스케이프는 unknown escape sequence 오류다. 유니코드 이스케이프는 없다. 문자열은 UTF-8 바이트 그대로 저장된다( \"한\".len 은 3). 문자열 리터럴은 줄을 넘길 수 없다( unterminated string literal ). TAM 복사 // exit: 0\nfn main() i32 {\n    let a = 1_000 + 0xff + 0b101 + 0o17 // 1000 + 255 + 5 + 15\n    if a != 1275 { return 1 }\n    if \"한\".len != 3 { return 2 }\n    if 'A' as i32 != 65 { return 3 }\n    let big: u64 = 0xFFFF_FFFF_FFFF_FFFF\n    if big != ~0 { return 4 }\n    0\n} TAM,ERROR 복사 // error: integer literal out of range for `u8`\nfn main() i32 {\n    let x: u8 = 300\n    0\n} 1.6 연산자와 구분자 ¶ CODE 복사 +  -  *  /  %  &  |  ^  ~  <<  >>\n== != <  <= >  >=  &&  ||  !\n=  += -= *= /= %= &= |= ^= <<= >>=\n.  ..  ..=  ,  :  ::  ;  ?  =>\n( ) [ ] { } >> 는 렉서가 한 토큰으로 만들지 않고, 파서가 맞붙은 > 두 개를 오른쪽 시프트로 읽는다. 덕분에 Result<Result<i32, i32>, i32> 의 >> 가 타입을 닫는다. a > > b 처럼 띄우면 시프트가 아니다. && 는 논리곱 연산자이지만, 타입과 단항 위치에서는 & & 로 읽는다( &&T 는 &(&T) , &&x 는 &(&x) ). 1.7 줄바꿈과 문장의 끝 ¶ TAM은 세미콜론이 없다. 줄바꿈이 문장의 끝 이고, ; 는 한 줄에 여러 문장을 둘 때의 구분자로만 허용된다(줄 끝의 ; 도 허용된다). 한 문장은 다음 경우에 다음 줄로 이어진다. 줄이 이항 연산자, , , ( , [ , { 로 끝난다. 다음 줄이 . 으로 시작한다(메서드 체인). 그 외에는 줄바꿈이 문장의 끝이다. 특히 다음 줄이 연산자로 시작하는 것은 이어짐이 아니다 . TAM 복사 // exit: 6\nfn add(a: i32, b: i32) i32 { a + b }\n\nfn main() i32 {\n    let a = [\n        1,\n        2,\n    ]\n    let total = a[0] +\n        a[1] +\n        3\n    add(\n        total,\n        0,\n    )\n} TAM,ERROR 복사 // error: expected an expression, found `+`\nfn main() i32 {\n    let y = 1\n        + 3\n    y\n} 2. 항목(Items) ¶ 파일의 최상위에는 함수, 구조체, const , impl 블록, use 선언만 둘 수 있다. 전역 변수 는 없다(상수만 있다). 항목은 선언 순서와 무관하게 파일 전체에서 보인다(앞에서 뒤의 함수를 호출할 수 있다). 2.1 함수 ¶ CODE 복사 function  = [ \"pub\" ] [ \"unsafe\" ] \"fn\" name \"(\" [ params ] \")\" [ type ] block\nparams    = param { \",\" param } [ \",\" ]\nparam     = name \":\" type 반환 타입은 매개변수 목록 뒤에 화살표 없이 쓴다. 생략하면 값이 없는 함수다(타입 표기가 없는 \"단위\" 함수. 호출 결과를 변수에 묶을 수 없다). 본문 블록의 마지막 표현식이 반환값 이다. return 은 조기 반환에 쓴다. 매개변수는 불변이다. 값을 바꾸려면 본문에서 mut 이름 = 이름 으로 다시 묶는다. 함수는 재귀할 수 있다. 상호 재귀도 된다. 같은 이름의 함수를 두 번 정의하면 오류다. pub 은 다른 모듈에서 보이게 한다( 7장 ). unsafe fn 은 unsafe 블록이나 다른 unsafe fn 안에서만 호출할 수 있다. TAM 복사 // exit: 7\nfn bump(x: &mut i32) {\n    *x += 1\n    if *x > 100 { return }\n    *x += 1\n}\n\nfn fact(n: i64) i64 { if n <= 1 { 1 } else { n * fact(n - 1) } }\n\nfn main() i32 {\n    mut v = 1\n    bump(&mut v)\n    v + fact(3) as i32 - 2 // 3 + 6 - 2\n} 2.2 구조체 ¶ CODE 복사 struct = [ \"pub\" ] \"struct\" name \"{\" [ field { sep field } [ sep ] ] \"}\"\nfield  = name \":\" type\nsep    = \",\" | newline 필드는 쉼표나 줄바꿈으로 구분한다(둘 다 가능하고 끝의 쉼표는 선택). 필드는 항상 공개 다. 필드 단위의 pub 은 없다. 구조체 이름의 pub 만 모듈 밖 사용 여부를 정한다. 구조체 값은 이동 타입 이다(필드가 모두 정수여도). 복사는 필드를 직접 읽어 새로 만든다( 8장 ). 구조체 리터럴은 모든 필드를 한 번씩, 순서 무관하게 쓴다. 필드 약식( P { x } )은 없다. 구조체는 자기 자신을 필드로 가질 수 없다(크기가 무한). 다른 구조체, 배열, String , Result / Option , 참조, 포인터를 필드로 가질 수 있다. TAM 복사 // exit: 6\nstruct Point {\n    x: i32,\n    y: i32,\n}\n\nstruct Rect {\n    min: Point\n    max: Point\n}\n\nfn main() i32 {\n    let r = Rect { max: Point { x: 4, y: 5 }, min: Point { x: 1, y: 2 } }\n    (r.max.x - r.min.x) + (r.max.y - r.min.y)\n} 2.3 impl ¶ CODE 복사 impl = \"impl\" name \"{\" { [ \"pub\" ] function } \"}\" impl T { ... } 는 같은 파일에 선언된 구조체 T 에만 붙일 수 있다. 제네릭도 트레이트도 없다. 첫 매개변수가 &self , &mut self , self (값)이면 메서드 , 아니면 연관 함수 다. Self 는 T 를 뜻한다. self 매개변수에는 타입을 쓰지 않는다. 호출: 메서드는 값.이름(인자) , 연관 함수는 T::이름(인자) , 다른 모듈의 것은 모듈::T::이름(인자) . 값에 &self / &mut self 메서드를 부르면 자동으로 빌린다( &mut self 는 변수, 필드, 배열 원소가 가변일 때). 이미 &mut T 인 값이면 그대로 넘긴다(재차용). &T 로는 &mut self 메서드를 부를 수 없다. self (값) 메서드는 값을 이동 하며 참조 너머로는 부를 수 없다. 메서드는 T::메서드(&값, ...) 로도 부를 수 있다. pub 은 함수마다 붙인다( impl 에는 붙일 수 없다). 다른 모듈에서는 pub 없는 메서드와 연관 함수를 부를 수 없다. 임시값( make().get() )에는 &self 메서드를 직접 부를 수 없다. 변수에 먼저 묶는다. 메서드 이름은 필드 이름과 같아도 된다( p.x 와 p.x() 는 다르다). TAM 복사 // exit: 50\nstruct Buf {\n    data: String,\n    n: i32,\n}\n\nimpl Buf {\n    fn new(s: str) Self { Buf { data: string_from(s), n: 0 } }\n    fn add(&mut self, c: u8) { string_push(&mut self.data, c); self.n += 1 }\n    fn size(&self) i32 { self.data.len as i32 + self.n }\n    fn into_len(self) i32 { self.data.len as i32 }\n    fn view(&self) str { as_str(&self.data) }\n}\n\nfn main() i32 {\n    mut b = Buf::new(\"ab\")\n    b.add(99)\n    b.add(100)\n    let k = b.view().len as i32 // 4\n    let s = b.size()            // 4 + 2\n    k * 10 + s + b.into_len()   // 40 + 6 + 4\n} TAM,ERROR 복사 // error: use of moved value `b`\nstruct Buf { data: String }\nimpl Buf {\n    fn into_len(self) i32 { self.data.len as i32 }\n}\nfn main() i32 {\n    let b = Buf { data: string_from(\"x\") }\n    let a = b.into_len()\n    a + b.into_len()\n} 2.4 use ¶ CODE 복사 use = \"use\" name { \".\" name } use a.b.c 는 <루트 폴더>/a/b/c.tam 을 불러오고 이후 c::항목 으로 참조한다. 첫 조각이 tam 이면 파일이 아니라 내장 표준 라이브러리 다( use tam.os ). 자세한 규칙은 7장 . 2.5 extern 함수 ¶ CODE 복사 extern = [ \"pub\" ] \"extern\" string \"fn\" name \"(\" [ params ] \")\" [ type ] [ \"=\" string ] 본문이 없는 외부 함수 선언이다. 문자열은 라이브러리 이름이다. 호스트 대상에서는 \"c\" (libc), Windows 대상에서는 DLL 이름( \"kernel32\" )이다. = \"심볼\" 은 실제 심볼 이름이 TAM 이름과 다를 때만 쓴다. 인자와 반환 타입은 C ABI에 맞게 정수형, f64 , bool , raw 포인터 (와 반환 없음)만 가능하다. 그 밖의 타입은 오류다. 호출은 항상 unsafe 다. 대상과 맞지 않는 라이브러리(Windows에서 \"c\" , 호스트에서 DLL)는 오류다. 펌웨어 대상( uefi , bios , aarch64 )에서는 extern 이 오류다. TAM 복사 // exit: 7\nextern \"c\" fn abs(x: i32) i32\n\nfn main() i32 {\n    unsafe { abs(0 - 7) }\n} 2.6 const : 전역 상수 ¶ CODE 복사 const = [ \"pub\" ] \"const\" name \":\" type \"=\" const_expr 타입은 정수형, f64 , bool , str 중 하나여야 한다. 반드시 써야 한다(추론하지 않는다). 값은 컴파일 시간에 계산 된다. 쓸 수 있는 것은 리터럴, 다른 상수( mod::NAME 포함), 산술·비트·비교·논리 연산, ! , 단항 - , 정수끼리 또는 정수→ f64 의 as 다. 함수 호출이나 변수는 쓸 수 없다( this expression cannot be used in a constant ). 계산은 128비트로 하고, 결과가 선언한 타입에 들어가야 한다( constant A = 256 does not fit in u8``). 넘치거나 0으로 나누면 컴파일 오류다. 상수끼리 순환하면 depends on itself 오류다. 선언 순서는 상관없다. 상수를 쓰는 곳에는 타입이 정해진 값 이 들어간다. 정수 리터럴과 달리 다른 정수형 자리에 그냥 쓸 수 없다( const A: u8 = 1 을 i32 자리에 쓰려면 A as i32 ). 상수는 주소가 없다. 대입( A = 2 )과 &A 는 오류다. 같은 이름의 지역 변수가 상수를 가린다 (그 선언 이후부터). 이름은 함수, 구조체, 다른 상수와 겹칠 수 없다. pub const 는 다른 모듈에서 모듈::이름 으로 쓴다. 배열 길이 에 쓸 수 있다: [i32; SIZE] , [0; SIZE] . 값은 1 이상의 정수 상수여야 한다. TAM 복사 // exit: 117\nconst SIZE: u64 = 4\nconst NEG: i32 = -3\nconst MASK: u8 = 0xF0 | 0x0F\nconst BIG: i64 = 1 << 40\nconst PI: f64 = 3.5\nconst NAME: str = \"tam\"\nconst ON: bool = SIZE > 3 && !fals
