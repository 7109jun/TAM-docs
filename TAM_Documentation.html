M<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nstruct User { name: String, age: i32 }\n\nfn consume(u: User) i32 { u.age + u.name.len as i32 }\n\nfn main() i32 {\n    let u = User { name: string_from(\"ab\"), age: 1 }\n    consume(u)        // u는 여기서 이동했다. main이 끝날 때 다시 해제되지 않는다\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"해제되지-않는-경우\" id=\"ref-safety--해제되지-않는-경우\">해제되지 <strong>않는</strong> 경우<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--해제되지-않는-경우\">¶</a></h3>\n<ul>\n<li><code>os::exit</code>는 지역 변수를 해제하지 않고 즉시 끝낸다.</li>\n<li>trap과 패닉은 해제를 실행하지 않는다. 프로세스가 끝나므로 운영체제가 회수한다.</li>\n<li>순환이나 <code>unsafe</code>로 직접 만든 구조는 컴파일러가 모른다. <code>alloc</code>한 것은 <code>free</code>로 직접 돌려준다.</li>\n</ul>\n<p>사용자 정의 소멸자(<code>Drop</code>)는 없다.</p>\n<h2 class=\"doc-heading\" data-slug=\"5-unsafe-사용자의-책임\" id=\"ref-safety--5-unsafe-사용자의-책임\">5. <code>unsafe</code>: 사용자의 책임<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--5-unsafe-사용자의-책임\">¶</a></h2>\n<p><code>unsafe</code>가 필요한 것은 raw 포인터 역참조와 산술, <code>unsafe fn</code>과 <code>extern</code> 호출, <code>alloc</code>/<code>free</code>와 하드웨어 내장 함수(<code>mmio_*</code> 등)의 호출이다.</p>\n<p><code>unsafe</code> 안에서 컴파일러가 <strong>검사하지 않는</strong> 것:</p>\n<ul>\n<li>포인터가 가리키는 곳이 유효한가(범위, 정렬, 수명)</li>\n<li>같은 메모리에 대한 별칭과 동시 접근</li>\n<li><code>free</code>를 두 번 부르는가, <code>free</code> 뒤에 쓰는가</li>\n<li>호출한 C 함수의 시그니처가 맞는가</li>\n</ul>\n<p>이를 어기면 <strong>정의되지 않은 동작</strong>이다. 그러나 <code>unsafe</code> 바깥의 안전한 코드는 계속 컴파일러가 지킨다. 그래서 권장하는 방식은 <code>unsafe</code>를 작은 함수 안에 가두고, 그 함수가 <strong>안전한 인터페이스</strong>(경계 검사, 소유권)를 제공하게 하는 것이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 30\nstruct Buf {\n    ptr: *mut i32,\n    len: u64,\n}\n\nimpl Buf {\n    fn new(len: u64) Self {\n        Buf { ptr: unsafe { alloc(len * 4) } as *mut i32, len: len }\n    }\n\n    // 안전한 인터페이스: 경계를 검사한다\n    fn set(&amp;mut self, i: u64, v: i32) {\n        assert(i &lt; self.len)\n        unsafe { *(self.ptr + i) = v }\n    }\n\n    fn get(&amp;self, i: u64) i32 {\n        assert(i &lt; self.len)\n        unsafe { *(self.ptr + i) }\n    }\n\n    fn release(self) {\n        unsafe { free(self.ptr as *mut u8) }\n    }\n}\n\nfn main() i32 {\n    mut b = Buf::new(4)\n    b.set(0, 10)\n    b.set(3, 20)\n    let r = b.get(0) + b.get(3)\n    b.release()\n    r\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"6-안전한-코드에서도-일어날-수-있는-것\" id=\"ref-safety--6-안전한-코드에서도-일어날-수-있는-것\">6. 안전한 코드에서도 일어날 수 있는 것<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--6-안전한-코드에서도-일어날-수-있는-것\">¶</a></h2>\n<p>\"안전\"은 \"아무 일도 안 일어난다\"가 아니다. 다음은 <strong>정의되지 않은 동작이 아니지만 프로그램이 멈추거나 실패할 수 있는</strong> 경우다. 솔직히 적어 둔다.</p>\n<table>\n<thead>\n<tr>\n<th>상황</th>\n<th>결과</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>깊은 재귀로 스택 초과</td>\n<td>호스트에서 운영체제가 <code>SIGSEGV</code>(종료 코드 139)로 끝낸다. 컴파일러는 검사하지 않는다</td>\n</tr>\n<tr>\n<td>힙 할당 실패(<code>malloc</code>이 NULL)</td>\n<td><strong>검사하지 않는다.</strong> 메모리가 바닥나면 이후 접근에서 비정상 종료할 수 있다</td>\n</tr>\n<tr>\n<td>BIOS/AArch64의 힙 소진</td>\n<td>trap(각 32MiB)</td>\n</tr>\n<tr>\n<td>펌웨어 대상에서 예외</td>\n<td>예외 핸들러가 없어 리셋하거나 멈춘다</td>\n</tr>\n<tr>\n<td>trap이 일어난 프로그램</td>\n<td>해제가 실행되지 않는다</td>\n</tr>\n</tbody>\n</table>\n<p>스택 초과를 직접 확인한 예다(검증 가능한 종료 코드는 운영체제에 따라 다르므로 코드로는 싣지 않는다).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ cat so.tam\nfn f(n: i64) i64 { f(n + 1) + 1 }\nfn main() i32 { f(0) as i32 }\n$ tamc run so.tam\nerror: the program was terminated by signal 11\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"7-컴파일러가-보수적인-곳\" id=\"ref-safety--7-컴파일러가-보수적인-곳\">7. 컴파일러가 보수적인 곳<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--7-컴파일러가-보수적인-곳\">¶</a></h2>\n<p>안전을 위해 올바른 코드를 거절하는 경우가 있다. 거절되면 코드를 조금 고치면 된다.</p>\n<ul>\n<li>배열 원소는 서로 구분하지 않는다. <code>&amp;mut a[0]</code>과 <code>&amp;a[1]</code>은 충돌한다.</li>\n<li>참조 변수에 다시 대입해도 이전 빌림이 풀리지 않는다.</li>\n<li>힙 필드를 <code>self.field</code>로 꺼내 이동할 수 없다.</li>\n<li><code>break</code>/<code>continue</code> 이후 경로는 모두 도달 가능하다고 본다.</li>\n</ul>\n<p>반대 방향의 오류(안전하지 않은데 통과)는 버그다. 발견하면 최소 재현 코드와 함께 보고해 달라.</p>\n<h2 class=\"doc-heading\" data-slug=\"8-어떻게-확인하는가\" id=\"ref-safety--8-어떻게-확인하는가\">8. 어떻게 확인하는가<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--8-어떻게-확인하는가\">¶</a></h2>\n<p>이 약속은 말이 아니라 검증으로 뒷받침한다(개발 저장소 기준).</p>\n<ul>\n<li><strong>회귀 테스트</strong>: 소유권·빌림·trap·수치 경계마다 통과해야 하는 프로그램과 거절되어야 하는 프로그램을 모두 시험한다.</li>\n<li><strong>차분 퍼저</strong>: 임의로 만든 정수 식, 변수·배열·반복·함수가 섞인 프로그램, 힙/소유권이 섞인 프로그램, 제네릭 프로그램을 만들어 파이썬 참조 구현과 종료 코드를 비교한다.</li>\n<li><strong>valgrind</strong>: 힙 퍼저의 프로그램을 valgrind 아래에서 실행해 누수, 이중 해제, 잘못된 접근이 0임을 본다.</li>\n<li><strong>크래시 퍼저</strong>: 깨진 입력을 컴파일러에 넣어 컴파일러가 패닉하거나 스택이 넘치지 않고 오류로 끝나는지 본다.</li>\n<li><strong>문서의 모든 코드</strong>: 컴파일하고 실행해 출력, 종료 코드, 오류 메시지가 문서와 같은지 확인한다.</li>\n</ul>\n<p>퍼저가 찾은 대표적인 버그는 <a href=\"#doc-ref-changelog\">Release Notes</a>에 있다.</p>\n<h2 class=\"doc-heading\" data-slug=\"9-요약\" id=\"ref-safety--9-요약\">9. 요약<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-safety--9-요약\">¶</a></h2>\n<ul>\n<li>안전한 코드: 해제 후 사용, 이중 해제, 누수, 댕글링, 경계 밖, 오버플로를 컴파일 오류 또는 trap으로 막는다.</li>\n<li><code>unsafe</code>: 책임은 사용자에게 있다. 작게 가두고 안전한 인터페이스로 감싼다.</li>\n<li>한계: 스택 초과와 할당 실패는 검사하지 않는다.</li>\n</ul>\n", "text": "Safety and Memory Model ¶ TAM이 무엇을 보장하고 무엇을 보장하지 않는지 를 정확히 적은 문서다. 기능의 정의는 The TAM Reference 의 8~12장이고, 이 문서는 그것을 안전성의 관점에서 다시 묶는다. 대상 버전: tamc 1.0 이 문서의 모든 코드는 tamc 1.0 으로 컴파일하고 실행해(오류와 trap은 메시지까지) 검증했다. 1. 약속 ¶ unsafe 가 없는 TAM 코드는, 컴파일러가 올바르다면, 메모리를 깨뜨리지 못한다. 위반은 컴파일 오류이거나, 조용한 오동작이 아니라 즉시 멈춤(trap) 이다. 세 층으로 나눠 생각한다. 층 누가 책임지나 위반하면 안전한 코드 컴파일러 컴파일 오류 또는 trap unsafe 블록, unsafe fn , extern 호출 사용자 정의되지 않은 동작 컴파일러 자신 tamc 개발 버그(발견하면 고친다) 2. 컴파일 시간에 막는 것 ¶ 2.1 소유권: 해제 후 사용과 이중 해제 ¶ 모든 힙 값( String , 이를 가진 구조체 등)에는 소유자가 하나다. 이동한 뒤에는 쓸 수 없고, 소유자가 스코프를 벗어나면 한 번 해제된다. TAM,ERROR 복사 // error: use of moved value `s`\nfn eat(s: String) i32 { s.len as i32 }\n\nfn main() i32 {\n    let s = string_from(\"hello\")\n    let n = eat(s)\n    n + s.len as i32\n} 분기마다 이동 상태를 합치므로 \"어떤 경로에서만 이동\"도 잡는다. TAM,ERROR 복사 // error: use of moved value `s`\nfn eat(s: String) i32 { s.len as i32 }\n\nfn main() i32 {\n    let s = string_from(\"hello\")\n    let c = 1\n    if c == 1 { eat(s) } else { 0 }\n    s.len as i32\n} 2.2 빌림: 댕글링과 별칭 충돌 ¶ 참조는 소유자를 빌린다 . 읽기 참조는 여러 개, 쓰기 참조는 하나만 동시에 살아 있을 수 있고, 참조는 소유자보다 오래 살 수 없다. TAM,ERROR 복사 // error: cannot return reference to local variable `x`\nfn f() &i32 {\n    let x = 5\n    &x\n}\n\nfn main() i32 { *f() } TAM,ERROR 복사 // error: cannot assign to `v` because it is borrowed\nfn main() i32 {\n    mut v = 1\n    let r = &v\n    v = 2\n    *r\n} lifetime을 쓰지 않는다 . 컴파일러가 본문에서 추론하고, 여러 인자에서 올 수 있으면 보수적으로 모두를 빌린 것으로 본다. 그래서 가끔 올바른 코드가 거부될 수 있다(안전한 쪽으로의 오류). 2.3 타입, 초기화, 변경 가능성 ¶ 초기화되지 않은 변수는 없다( let x 만 쓰는 문법이 없다). 불변 변수에는 대입할 수 없다. &mut 는 mut 변수에서만 만든다. 정수 사이의 암묵적 변환이 없다. as 만 쓴다(그리고 as 는 trap하지 않고 감싸거나 포화한다). unsafe 없이는 raw 포인터를 역참조하거나 alloc / free 를 부를 수 없다. TAM,ERROR 복사 // error: needs an `unsafe` block\nfn main() i32 {\n    let m = alloc(8)\n    0\n} 3. 실행 시간에 막는 것(trap) ¶ 컴파일 시간에 알 수 없는 위반은 검사 코드를 넣어 즉시 멈춘다 . 호스트에서는 tam: panic: <메시지> 를 stderr에 쓰고 SIGILL (종료 코드 132)로 끝난다. 위반 메시지 배열·슬라이스 경계 밖 접근 index out of bounds 정수 + - * , 단항 - 오버플로 integer overflow / , % 의 0 나누기 division by zero MIN / -1 integer overflow in division assert(거짓) assertion failed None / Err 에 unwrap called `unwrap()` on a `None` value 등 panic(\"...\") 그 메시지 TAM,TRAP 복사 // panic: index out of bounds\nfn get(a: &[i32], i: u64) i32 { a[i] }\n\nfn main() i32 {\n    let a = [1, 2, 3]\n    get(&a, 3)\n} TAM,TRAP 복사 // panic: integer overflow\nfn main() i32 {\n    let a: i32 = 2147483647\n    a + 1\n} TAM,TRAP 복사 // panic: division by zero\nfn main() i32 {\n    let z = 0\n    10 / z\n} 검사는 빌드 모드와 무관하다. --release 로도 끌 수 없다. 오버플로가 의도라면 wrapping_add , wrapping_sub , wrapping_mul 로 명시한다. TAM 복사 // exit: 0\nfn main() i32 {\n    let a: i32 = 2147483647\n    if wrapping_add(a, 1) != -2147483647 - 1 { return 1 }\n    0\n} 4. 자동 해제의 정확한 의미 ¶ 스코프가 끝나면 선언의 역순 으로 해제한다. return , ? , break , continue 로 나갈 때도 살아 있는 값을 모두 해제한다. 이동 여부는 변수마다 둔 런타임 플래그로 판단해, 조건부 이동 도 한 번만 해제된다. 재대입은 이전 값을 먼저 해제한다. TAM 복사 // exit: 3\nstruct User { name: String, age: i32 }\n\nfn consume(u: User) i32 { u.age + u.name.len as i32 }\n\nfn main() i32 {\n    let u = User { name: string_from(\"ab\"), age: 1 }\n    consume(u)        // u는 여기서 이동했다. main이 끝날 때 다시 해제되지 않는다\n} 해제되지 않는 경우 ¶ os::exit 는 지역 변수를 해제하지 않고 즉시 끝낸다. trap과 패닉은 해제를 실행하지 않는다. 프로세스가 끝나므로 운영체제가 회수한다. 순환이나 unsafe 로 직접 만든 구조는 컴파일러가 모른다. alloc 한 것은 free 로 직접 돌려준다. 사용자 정의 소멸자( Drop )는 없다. 5. unsafe : 사용자의 책임 ¶ unsafe 가 필요한 것은 raw 포인터 역참조와 산술, unsafe fn 과 extern 호출, alloc / free 와 하드웨어 내장 함수( mmio_* 등)의 호출이다. unsafe 안에서 컴파일러가 검사하지 않는 것: 포인터가 가리키는 곳이 유효한가(범위, 정렬, 수명) 같은 메모리에 대한 별칭과 동시 접근 free 를 두 번 부르는가, free 뒤에 쓰는가 호출한 C 함수의 시그니처가 맞는가 이를 어기면 정의되지 않은 동작 이다. 그러나 unsafe 바깥의 안전한 코드는 계속 컴파일러가 지킨다. 그래서 권장하는 방식은 unsafe 를 작은 함수 안에 가두고, 그 함수가 안전한 인터페이스 (경계 검사, 소유권)를 제공하게 하는 것이다. TAM 복사 // exit: 30\nstruct Buf {\n    ptr: *mut i32,\n    len: u64,\n}\n\nimpl Buf {\n    fn new(len: u64) Self {\n        Buf { ptr: unsafe { alloc(len * 4) } as *mut i32, len: len }\n    }\n\n    // 안전한 인터페이스: 경계를 검사한다\n    fn set(&mut self, i: u64, v: i32) {\n        assert(i < self.len)\n        unsafe { *(self.ptr + i) = v }\n    }\n\n    fn get(&self, i: u64) i32 {\n        assert(i < self.len)\n        unsafe { *(self.ptr + i) }\n    }\n\n    fn release(self) {\n        unsafe { free(self.ptr as *mut u8) }\n    }\n}\n\nfn main() i32 {\n    mut b = Buf::new(4)\n    b.set(0, 10)\n    b.set(3, 20)\n    let r = b.get(0) + b.get(3)\n    b.release()\n    r\n} 6. 안전한 코드에서도 일어날 수 있는 것 ¶ \"안전\"은 \"아무 일도 안 일어난다\"가 아니다. 다음은 정의되지 않은 동작이 아니지만 프로그램이 멈추거나 실패할 수 있는 경우다. 솔직히 적어 둔다. 상황 결과 깊은 재귀로 스택 초과 호스트에서 운영체제가 SIGSEGV (종료 코드 139)로 끝낸다. 컴파일러는 검사하지 않는다 힙 할당 실패( malloc 이 NULL) 검사하지 않는다. 메모리가 바닥나면 이후 접근에서 비정상 종료할 수 있다 BIOS/AArch64의 힙 소진 trap(각 32MiB) 펌웨어 대상에서 예외 예외 핸들러가 없어 리셋하거나 멈춘다 trap이 일어난 프로그램 해제가 실행되지 않는다 스택 초과를 직접 확인한 예다(검증 가능한 종료 코드는 운영체제에 따라 다르므로 코드로는 싣지 않는다). CONSOLE 복사 $ cat so.tam\nfn f(n: i64) i64 { f(n + 1) + 1 }\nfn main() i32 { f(0) as i32 }\n$ tamc run so.tam\nerror: the program was terminated by signal 11 7. 컴파일러가 보수적인 곳 ¶ 안전을 위해 올바른 코드를 거절하는 경우가 있다. 거절되면 코드를 조금 고치면 된다. 배열 원소는 서로 구분하지 않는다. &mut a[0] 과 &a[1] 은 충돌한다. 참조 변수에 다시 대입해도 이전 빌림이 풀리지 않는다. 힙 필드를 self.field 로 꺼내 이동할 수 없다. break / continue 이후 경로는 모두 도달 가능하다고 본다. 반대 방향의 오류(안전하지 않은데 통과)는 버그다. 발견하면 최소 재현 코드와 함께 보고해 달라. 8. 어떻게 확인하는가 ¶ 이 약속은 말이 아니라 검증으로 뒷받침한다(개발 저장소 기준). 회귀 테스트 : 소유권·빌림·trap·수치 경계마다 통과해야 하는 프로그램과 거절되어야 하는 프로그램을 모두 시험한다. 차분 퍼저 : 임의로 만든 정수 식, 변수·배열·반복·함수가 섞인 프로그램, 힙/소유권이 섞인 프로그램, 제네릭 프로그램을 만들어 파이썬 참조 구현과 종료 코드를 비교한다. valgrind : 힙 퍼저의 프로그램을 valgrind 아래에서 실행해 누수, 이중 해제, 잘못된 접근이 0임을 본다. 크래시 퍼저 : 깨진 입력을 컴파일러에 넣어 컴파일러가 패닉하거나 스택이 넘치지 않고 오류로 끝나는지 본다. 문서의 모든 코드 : 컴파일하고 실행해 출력, 종료 코드, 오류 메시지가 문서와 같은지 확인한다. 퍼저가 찾은 대표적인 버그는 Release Notes 에 있다. 9. 요약 ¶ 안전한 코드: 해제 후 사용, 이중 해제, 누수, 댕글링, 경계 밖, 오버플로를 컴파일 오류 또는 trap으로 막는다. unsafe : 책임은 사용자에게 있다. 작게 가두고 안전한 인터페이스로 감싼다. 한계: 스택 초과와 할당 실패는 검사하지 않는다.", "source": "docs/safety.md"}, {"key": "ref-compiler", "path": "docs/compiler.md", "nav": "컴파일러 구조", "title": "Compiler Architecture ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"compiler-architecture\" id=\"ref-compiler--compiler-architecture\">Compiler Architecture<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--compiler-architecture\">¶</a></h1>\n<p><code>tamc</code>가 TAM 소스를 어떻게 실행 파일로 바꾸는지, 코드가 어디에 있는지, 어떻게 시험하는지를 설명한다. 컴파일러를 고치거나 비슷한 컴파일러를 만들려는 사람을 위한 문서다.</p>\n<ul>\n<li>대상 버전: <code>tamc 1.0</code></li>\n<li><code>tamc</code>는 Rust로 쓰였고, 외부 크레이트는 <code>toml</code>(매니페스트 파싱)과 <code>sha2</code>(증분 빌드 지문)뿐이다. 코드 생성은 <strong>텍스트 LLVM IR</strong>을 직접 쓴다. LLVM 라이브러리에 링크하지 않는다.</li>\n<li>설명하는 소스 위치는 개발 저장소의 <code>src/</code> 기준이다. 줄 수는 대략적이며 바뀔 수 있다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"1-한눈에\" id=\"ref-compiler--1-한눈에\">1. 한눈에<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--1-한눈에\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code> 소스(.tam) ──► Lexer ──► Parser ──► 모듈 로더/이름 해석 ──► 타입 검사 ──► 소유권 검사 ──► 빌림 검사\n                (lexer)   (parser)    (modules)              (typeck)     (ownership)    (borrowck)\n                                                                                              │\n          LLVM IR 텍스트 ◄── 코드 생성 (codegen) ◄──────────────────────────────────────────────┘\n               │\n               ▼  opt::promote (스택 변수 → SSA)\n               │\n     ┌─────────┴───────────┬──────────────────────────────┐\n     ▼ host                ▼ windows                      ▼ uefi / bios / aarch64\n  clang으로 링크       llc|clang → .obj +            llc|clang → .obj → lld-link(PE) →\n                       kernel32 import lib 생성 →     (bios, aarch64는) PE를 평평한 메모리 이미지로\n                       lld-link                        펼쳐 부팅 형식으로 감싼다\n</code></pre></div>\n<p>한 번의 컴파일은 위에서 아래로 한 방향으로만 흐른다. 앞 단계가 <strong>첫 번째 오류</strong>를 내면 거기서 멈춘다(오류를 여러 개 모으지 않는다).</p>\n<h2 class=\"doc-heading\" data-slug=\"2-단계별-설명\" id=\"ref-compiler--2-단계별-설명\">2. 단계별 설명<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--2-단계별-설명\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"21-lexer-srclexerrs\" id=\"ref-compiler--21-lexer-srclexerrs\">2.1 Lexer (<code>src/lexer.rs</code>)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--21-lexer-srclexerrs\">¶</a></h3>\n<ul>\n<li><strong>줄바꿈이 문장 끝</strong>이다. 어휘 단계에서 \"이어지는 줄\"을 걸러 <code>Newline</code> 토큰을 만든다. 줄 끝이 이항 연산자나 <code>,</code>, <code>(</code>, <code>[</code>, <code>{</code>이면 다음 줄로 이어지고, 다음 줄이 <code>.</code>, <code>)</code>, <code>]</code>로 시작해도 이어진다.</li>\n<li>블록 주석 <code>/* */</code>는 중첩된다. 여러 줄 블록 주석은 줄바꿈 하나로 취급한다.</li>\n<li>UTF-8 BOM은 무시한다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"22-parser-srcparserrs-srcastrs\" id=\"ref-compiler--22-parser-srcparserrs-srcastrs\">2.2 Parser (<code>src/parser.rs</code>, <code>src/ast.rs</code>)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--22-parser-srcparserrs-srcastrs\">¶</a></h3>\n<ul>\n<li>재귀 하강 파서다. 식은 연산자 우선순위 방식(연산자 사슬)으로 읽는다.</li>\n<li><strong>깊이 한도</strong>가 있다. 구문 중첩 200단계, 한 식의 연산자 사슬 2000개를 넘으면 스택이 넘치기 전에 <code>nesting is too deep</code> 오류를 낸다. 컴파일러 본체는 큰 스택(256MiB)을 가진 스레드에서 돈다.</li>\n<li>제네릭 모호성: <code>name&lt;..&gt;</code>는 <code>(</code>, <code>::</code>, <code>{</code>(구조체 리터럴이 허용되는 곳) 중 하나가 뒤따를 때만 타입 인자 목록이고, 아니면 비교 연산이다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"23-모듈-로더와-이름-해석-srcmodulesrs\" id=\"ref-compiler--23-모듈-로더와-이름-해석-srcmodulesrs\">2.3 모듈 로더와 이름 해석 (<code>src/modules.rs</code>)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--23-모듈-로더와-이름-해석-srcmodulesrs\">¶</a></h3>\n<ul>\n<li>파일 하나가 모듈 하나다. <code>use a.b</code>는 루트 폴더 기준 <code>a/b.tam</code>을 읽는다. <code>use tam.os</code> 같은 표준 라이브러리는 컴파일러에 <strong>내장된 소스</strong>(<code>std/*.tam</code>을 <code>include_str!</code>)이고, 대상(host, windows, uefi, bios, aarch64)에 맞는 파일이 골라진다.</li>\n<li>모든 모듈을 이름 변경(mangling)해 <strong>하나의 <code>Program</code></strong>으로 합친다. 비공개 항목 접근은 여기서 오류가 난다.</li>\n<li><strong>상수</strong>(<code>const</code>)는 여기서 128비트로 계산해, 이름 사용을 값으로 치환한다(지역 변수가 가리면 치환하지 않는다). 순환 정의와 범위 초과를 여기서 잡는다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"24-타입-검사-srctypeckrs-srctypesrs\" id=\"ref-compiler--24-타입-검사-srctypeckrs-srctypesrs\">2.4 타입 검사 (<code>src/typeck.rs</code>, <code>src/types.rs</code>)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--24-타입-검사-srctypeckrs-srctypesrs\">¶</a></h3>\n<ul>\n<li>모든 표현식의 타입을 AST에 기록한다. 정수 리터럴은 \"기대 타입\"을 따라가고 없으면 <code>i32</code>다.</li>\n<li><strong>제네릭은 단형화</strong>로 구현된다. 제네릭 함수와 구조체는 \"틀\"로 따로 보관하고, 호출이나 타입 사용이 나올 때 타입 인자를 정해 <strong>인스턴스</strong>(<code>max&lt;i32&gt;</code>, <code>Pair&lt;i32,f64&gt;.swap</code>)를 만들어 검사한다. 쓰이지 않은 틀은 검사하지 않는다. 인스턴스 안의 오류는 \"while instantiating\" 위치를 함께 보여 준다. 깊이 64, 인스턴스 5000개 한도가 있다.</li>\n<li>타입 인자 추론 순서: 직접 적은 것 → 인자의 타입 → 기대 타입 → 정수 리터럴 <code>i32</code>.</li>\n<li>검사가 끝나면 인스턴스들이 일반 함수처럼 프로그램에 합쳐진다. 이후 단계는 제네릭을 알 필요가 없다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"25-소유권-검사-srcownershiprs\" id=\"ref-compiler--25-소유권-검사-srcownershiprs\">2.5 소유권 검사 (<code>src/ownership.rs</code>)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--25-소유권-검사-srcownershiprs\">¶</a></h3>\n<ul>\n<li>Copy 타입과 이동 타입을 가르고, 이동한 값의 재사용을 막는다(<code>use of moved value</code>).</li>\n<li>분기와 루프를 따라 \"이동했을 수도 있음\" 상태를 합친다. 루프 안에서 바깥 변수를 이동하면 다음 반복 때문에 오류다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"26-빌림-검사-srcborrowckrs\" id=\"ref-compiler--26-빌림-검사-srcborrowckrs\">2.6 빌림 검사 (<code>src/borrowck.rs</code>)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--26-빌림-검사-srcborrowckrs\">¶</a></h3>\n<ul>\n<li>함수 본문을 <strong>평가 순서의 이벤트 목록</strong>(참조 생성, 사용, 이동, 대입 등)으로 낮춘 뒤 훑는다.</li>\n<li><code>&amp;</code>/<code>&amp;mut</code>는 <strong>loan</strong>을 만들고, loan은 참조를 쥔 변수가 이후에 쓰이는 동안만 산다(NLL 방식).</li>\n<li>구조체의 서로 다른 필드는 따로 빌리고, 배열 원소는 구분하지 않는다(보수적). 반환 참조의 출처는 lifetime 표기 없이 본문에서 추론한다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"27-코드-생성-srccodegenrs\" id=\"ref-compiler--27-코드-생성-srccodegenrs\">2.7 코드 생성 (<code>src/codegen.rs</code>)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--27-코드-생성-srccodegenrs\">¶</a></h3>\n<ul>\n<li>검사를 통과한 AST에서 <strong>텍스트 <code>.ll</code></strong>을 만든다. 모든 지역 변수는 함수 <code>entry</code> 블록의 <code>alloca</code>와 <code>load</code>/<code>store</code>로 둔다.</li>\n<li>정수 <code>+ - *</code>는 <code>llvm.sadd.with.overflow</code> 계열로 낮추고, 오버플로 플래그가 서면 <code>tam_panic</code> 후 <code>unreachable</code>로 가는 분기를 넣는다. 0 나누기, 경계 검사도 같은 방식이다.</li>\n<li>힙은 런타임의 <code>tam_alloc</code>/<code>tam_realloc</code>/<code>tam_free</code>만 거친다. 대상마다 구현이 다르다(호스트는 libc, Windows는 Heap API, 펌웨어는 자체 할당자). 이것이 \"allocator 교체\"가 들어올 자리다.</li>\n<li>자동 해제는 여기서 만든다. 스코프를 나가는 모든 경로(<code>return</code>, <code>?</code>, <code>break</code>, <code>continue</code>)에서 살아 있는 힙 값의 drop 호출을 넣고, 이동 여부는 변수마다 둔 런타임 플래그로 판단한다.</li>\n</ul>\n<p>작은 프로그램이 이런 IR이 된다(발췌).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ cat a.tam\nfn add(a: i32, b: i32) i32 { a + b }\nfn main() i32 { add(40, 2) }\n$ tamc emit-llvm a.tam        # a.ll 이 생긴다\n$ cat a.ll\n...\ndefine i32 @add(i32 %a.arg, i32 %b.arg) {\nentry:\n  %t5 = call { i32, i1 } @llvm.sadd.with.overflow.i32(i32 %a.arg, i32 %b.arg)\n  %t6 = extractvalue { i32, i1 } %t5, 0\n  %t7 = extractvalue { i32, i1 } %t5, 1\n  br i1 %t7, label %trap.fail2, label %trap.ok1\ntrap.fail2:\n  call void @tam_panic(ptr @.str.0.0, i64 16)\n  unreachable\ntrap.ok1:\n  ret i32 %t6\n}\ndefine i32 @main() {\nentry:\n  %t1 = call i32 @add(i32 40, i32 2)\n  ret i32 %t1\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"28-ir-최적화-srcoptrs\" id=\"ref-compiler--28-ir-최적화-srcoptrs\">2.8 IR 최적화 (<code>src/opt.rs</code>)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--28-ir-최적화-srcoptrs\">¶</a></h3>\n<ul>\n<li>번들 도구에 LLVM의 IR 최적화기(<code>opt</code>)가 없으므로, <strong>IR 텍스트 수준의 <code>mem2reg</code></strong>를 직접 구현했다. 주소가 새지 않는 스칼라 지역 변수를 SSA 값으로 올린다(지배자 트리, 지배 경계, 이름 바꾸기). 의심스러운 모양이 나오면 아무것도 바꾸지 않고 원본을 돌려준다.</li>\n<li>호스트 대상은 거기에 <code>clang -O2</code>가 더 해진다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"29-링크와-대상별-마무리-srcmainrs-srcimplibrs-srcimagers\" id=\"ref-compiler--29-링크와-대상별-마무리-srcmainrs-srcimplibrs-srcimagers\">2.9 링크와 대상별 마무리 (<code>src/main.rs</code>, <code>src/implib.rs</code>, <code>src/image.rs</code>)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--29-링크와-대상별-마무리-srcmainrs-srcimplibrs-srcimagers\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th>대상</th>\n<th>방식</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>host</code></td>\n<td><code>clang</code>으로 <code>.ll</code>을 컴파일·링크</td>\n</tr>\n<tr>\n<td><code>windows</code></td>\n<td><code>.ll</code> → <code>.obj</code>(<code>llc</code>가 있으면 <code>llc</code>, 없으면 <code>clang -c</code>) → DLL별 import lib을 <code>implib.rs</code>가 직접 만들어(<code>kernel32</code> 등) <code>lld-link</code>로 링크. CRT, MSVC, SDK가 필요 없다</td>\n</tr>\n<tr>\n<td><code>uefi</code></td>\n<td><code>.obj</code> → <code>lld-link</code>(<code>/subsystem:efi_application</code>) → <code>.efi</code></td>\n</tr>\n<tr>\n<td><code>bios</code></td>\n<td><code>.obj</code> → <code>lld-link</code> → PE를 \"평평한 메모리 이미지\"로 펼쳐(<code>image.rs</code>) 부트 섹터(<code>src/boot_bios.bin</code>, 원본은 <code>boot/bios.asm</code>)와 합쳐 디스크 이미지로</td>\n</tr>\n<tr>\n<td><code>aarch64</code></td>\n<td>같은 방식으로 PE를 펼쳐 QEMU <code>virt -kernel</code>이 읽는 <code>Image</code> 헤더를 붙인다</td>\n</tr>\n</tbody>\n</table>\n<p><code>.ll</code>을 오브젝트로 만드는 단계는 <code>llc</code>가 우선이다. 공식 Windows LLVM 배포본에는 <code>llc.exe</code>가 없어서, 없을 때는 같은 일을 <code>clang -c</code>로 한다(<code>TAMC_BACKEND=clang</code>이면 강제). 이때 IR 최적화는 끄고(<code>-Xclang -disable-llvm-passes</code>) 백엔드 코드 생성만 쓰므로 <code>llc</code> 경로와 같은 결과를 낸다.</p>\n<h2 class=\"doc-heading\" data-slug=\"3-프로젝트-모드-srcmanifestrs-srcprojectrs\" id=\"ref-compiler--3-프로젝트-모드-srcmanifestrs-srcprojectrs\">3. 프로젝트 모드 (<code>src/manifest.rs</code>, <code>src/project.rs</code>)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--3-프로젝트-모드-srcmanifestrs-srcprojectrs\">¶</a></h2>\n<ul>\n<li><code>Tmake.toml</code>은 표준 TOML이다. 파싱은 <code>toml</code> 크레이트가 하고, <code>manifest.rs</code>가 의미를 검사해 모든 오류를 <strong><code>Tmake.toml</code>의 줄/열</strong>로 보여 준다.</li>\n<li>워크스페이스, 상속(<code>{ workspace = true }</code>), 경로 의존성, 프로파일, 잠금 파일(<code>Tmake.lock</code>)을 다룬다.</li>\n<li><strong>증분 캐시</strong>: <code>build/&lt;대상&gt;/&lt;프로파일&gt;/.fingerprint/</code>에 컴파일러 버전, 대상, 최적화 수준, 모든 매니페스트와 소스의 SHA-256을 저장한다. 같으면 <code>Fresh</code>로 건너뛴다.</li>\n<li>실행 파일 패키지는 모든 소스를 한 프로그램으로 합쳐 컴파일하고, lib 패키지는 검사만 한다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"4-진단-srcdiagrs\" id=\"ref-compiler--4-진단-srcdiagrs\">4. 진단 (<code>src/diag.rs</code>)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--4-진단-srcdiagrs\">¶</a></h2>\n<p>모든 오류는 파일, 줄, 열, 소스 조각, 밑줄, 설명(<code>note</code>)으로 출력된다. 파일을 못 읽는 것처럼 위치가 없는 오류는 가짜 위치 없이 <code>error:</code> 한 줄이다. 제네릭 인스턴스 오류는 원인 위치와 인스턴스를 만든 호출 위치, 두 곳을 가리킨다.</p>\n<h2 class=\"doc-heading\" data-slug=\"5-설계-원칙\" id=\"ref-compiler--5-설계-원칙\">5. 설계 원칙<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--5-설계-원칙\">¶</a></h2>\n<ol>\n<li><strong>안전은 컴파일러의 일이다.</strong> 검사는 모두 컴파일러 안에 있고, 생성된 코드는 단순한 IR이다. LLVM이 최적화하지만 안전성은 LLVM에 기대지 않는다.</li>\n<li><strong>한 방향 파이프라인.</strong> 각 단계는 앞 단계의 결과만 읽는다. 단계마다 모듈이 하나라 따로 고치고 따로 시험할 수 있다.</li>\n<li><strong>견고함이 기능이다.</strong> 어떤 입력에도 컴파일러가 패닉하거나 스택이 넘치지 않고, 위치가 있는 오류로 끝나야 한다.</li>\n<li><strong>의존성을 늘리지 않는다.</strong> LLVM 도구(<code>clang</code>, <code>llc</code>, <code>lld-link</code>)는 실행 파일로 부르고, Rust 크레이트는 둘뿐이다.</li>\n<li><strong>호환성을 지킨다.</strong> 에디션 1의 의미는 바꾸지 않는다(<a href=\"#doc-ref-reference--18-호환성-약속-tam-1\">Reference 18장</a>). 새 기능은 기존 코드의 뜻을 바꾸지 않고 <strong>추가</strong>한다.</li>\n</ol>\n<h2 class=\"doc-heading\" data-slug=\"6-개발과-시험\" id=\"ref-compiler--6-개발과-시험\">6. 개발과 시험<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--6-개발과-시험\">¶</a></h2>\n<blockquote>\n<p>이 절의 <code>tests/</code>와 <code>tools/</code>는 개발용 폴더이며, 배포용 저장소에는 들어 있지 않을 수 있다.</p>\n</blockquote>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ cargo build --release        # tamc 빌드\n$ cargo test                   # 전체 테스트(아래)\n$ python3 tools/doccheck.py docs   # 문서의 모든 코드 블록을 컴파일·실행해 검증\n</code></pre></div>\n<table>\n<thead>\n<tr>\n<th>종류</th>\n<th>위치</th>\n<th>내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>프런트엔드 테스트</td>\n<td><code>tests/frontend.rs</code></td>\n<td>Lexer, Parser, 타입 검사</td>\n</tr>\n<tr>\n<td>통합 테스트</td>\n<td><code>tests/integration.rs</code>, <code>m14.rs</code>, <code>m17.rs</code>, <code>m18.rs</code></td>\n<td>컴파일하고 실행해 종료 코드·출력 비교, 오류 메시지 시험</td>\n</tr>\n<tr>\n<td>최적화 테스트</td>\n<td><code>tests/opt.rs</code></td>\n<td><code>mem2reg</code>가 변수를 레지스터로 올렸는지</td>\n</tr>\n<tr>\n<td>Windows 테스트</td>\n<td><code>tests/windows.rs</code></td>\n<td><code>.exe</code> 생성, 임포트가 <code>kernel32</code>뿐인지, 에뮬레이터 실행</td>\n</tr>\n<tr>\n<td>펌웨어 테스트</td>\n<td><code>tests/firmware.rs</code></td>\n<td>QEMU로 BIOS/UEFI/AArch64 부팅</td>\n</tr>\n<tr>\n<td>프로젝트 테스트</td>\n<td><code>tests/tmake.rs</code></td>\n<td><code>Tmake.toml</code>, 잠금 파일, 캐시</td>\n</tr>\n<tr>\n<td>문서 테스트</td>\n<td><code>tests/docs.rs</code></td>\n<td><code>tools/doccheck.py</code> 호출</td>\n</tr>\n</tbody>\n</table>\n<p><strong>퍼저</strong>(<code>tools/</code>): 각각 <code>python3 tools/fuzz_expr.py [개수] [시드]</code> 꼴로 돌린다.</p>\n<table>\n<thead>\n<tr>\n<th>퍼저</th>\n<th>대상</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>fuzz_expr.py</code></td>\n<td>임의의 정수 식을 파이썬 참조 구현과 비교</td>\n</tr>\n<tr>\n<td><code>fuzz_prog.py</code></td>\n<td>변수, 배열, <code>if</code>, <code>for</code>, <code>while</code>, 함수 호출이 섞인 프로그램</td>\n</tr>\n<tr>\n<td><code>fuzz_heap.py</code></td>\n<td><code>String</code>, 구조체 안의 <code>String</code>, <code>Option&lt;String&gt;</code>, <code>Result</code>, <code>?</code>, 조기 <code>return</code>을 섞은 소유권상 올바른 프로그램. valgrind로 누수·이중 해제 확인. <code>--win</code>은 Windows 대상</td>\n</tr>\n<tr>\n<td><code>fuzz_generic.py</code></td>\n<td>제네릭 함수·구조체·메서드가 섞인 프로그램</td>\n</tr>\n<tr>\n<td><code>fuzz_crash.py</code></td>\n<td>예제 소스를 무작위로 망가뜨려 컴파일러가 크래시 없이 오류로 끝나는지</td>\n</tr>\n</tbody>\n</table>\n<h2 class=\"doc-heading\" data-slug=\"7-기여하는-방법\" id=\"ref-compiler--7-기여하는-방법\">7. 기여하는 방법<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--7-기여하는-방법\">¶</a></h2>\n<ol>\n<li>재현 가능한 최소 프로그램을 만든다(<code>tamc check</code>나 <code>tamc run</code>으로).</li>\n<li>컴파일러가 틀린 곳을 고치고, <strong>그 프로그램을 회귀 테스트로 추가</strong>한다.</li>\n<li><code>cargo test</code>가 전부 통과해야 하고, 문서를 건드렸다면 <code>tools/doccheck.py docs</code>도 통과해야 한다.</li>\n<li>에디션 1의 기존 의미를 바꾸는 변경은 받지 않는다. 안전하지 않은 코드를 받아들이던 버그의 수정은 예외이며 <a href=\"#doc-ref-changelog\">Release Notes</a>에 적는다.</li>\n</ol>\n<h2 class=\"doc-heading\" data-slug=\"8-알려진-한계-구현\" id=\"ref-compiler--8-알려진-한계-구현\">8. 알려진 한계 (구현)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-compiler--8-알려진-한계-구현\">¶</a></h2>\n<ul>\n<li>오류는 첫 번째 하나만 보고한다.</li>\n<li>lib 패키지는 검사만 한다. 패키지별 오브젝트 파일은 만들지 않고, 실행 파일은 모든 소스를 한 번에 컴파일한다.</li>\n<li>사용자가 allocator를 바꾸는 문법과 <code>Drop</code>은 아직 없다.</li>\n<li>호스트 대상의 링크는 시스템 <code>clang</code>에 의존한다.</li>\n<li>실제 하드웨어에서의 펌웨어 실행은 확인하지 않았다(QEMU까지).</li>\n</ul>\n", "text": "Compiler Architecture ¶ tamc 가 TAM 소스를 어떻게 실행 파일로 바꾸는지, 코드가 어디에 있는지, 어떻게 시험하는지를 설명한다. 컴파일러를 고치거나 비슷한 컴파일러를 만들려는 사람을 위한 문서다. 대상 버전: tamc 1.0 tamc 는 Rust로 쓰였고, 외부 크레이트는 toml (매니페스트 파싱)과 sha2 (증분 빌드 지문)뿐이다. 코드 생성은 텍스트 LLVM IR 을 직접 쓴다. LLVM 라이브러리에 링크하지 않는다. 설명하는 소스 위치는 개발 저장소의 src/ 기준이다. 줄 수는 대략적이며 바뀔 수 있다. 1. 한눈에 ¶ CODE 복사 소스(.tam) ──► Lexer ──► Parser ──► 모듈 로더/이름 해석 ──► 타입 검사 ──► 소유권 검사 ──► 빌림 검사\n                (lexer)   (parser)    (modules)              (typeck)     (ownership)    (borrowck)\n                                                                                              │\n          LLVM IR 텍스트 ◄── 코드 생성 (codegen) ◄──────────────────────────────────────────────┘\n               │\n               ▼  opt::promote (스택 변수 → SSA)\n               │\n     ┌─────────┴───────────┬──────────────────────────────┐\n     ▼ host                ▼ windows                      ▼ uefi / bios / aarch64\n  clang으로 링크       llc|clang → .obj +            llc|clang → .obj → lld-link(PE) →\n                       kernel32 import lib 생성 →     (bios, aarch64는) PE를 평평한 메모리 이미지로\n                       lld-link                        펼쳐 부팅 형식으로 감싼다 한 번의 컴파일은 위에서 아래로 한 방향으로만 흐른다. 앞 단계가 첫 번째 오류 를 내면 거기서 멈춘다(오류를 여러 개 모으지 않는다). 2. 단계별 설명 ¶ 2.1 Lexer ( src/lexer.rs ) ¶ 줄바꿈이 문장 끝 이다. 어휘 단계에서 \"이어지는 줄\"을 걸러 Newline 토큰을 만든다. 줄 끝이 이항 연산자나 , , ( , [ , { 이면 다음 줄로 이어지고, 다음 줄이 . , ) , ] 로 시작해도 이어진다. 블록 주석 /* */ 는 중첩된다. 여러 줄 블록 주석은 줄바꿈 하나로 취급한다. UTF-8 BOM은 무시한다. 2.2 Parser ( src/parser.rs , src/ast.rs ) ¶ 재귀 하강 파서다. 식은 연산자 우선순위 방식(연산자 사슬)으로 읽는다. 깊이 한도 가 있다. 구문 중첩 200단계, 한 식의 연산자 사슬 2000개를 넘으면 스택이 넘치기 전에 nesting is too deep 오류를 낸다. 컴파일러 본체는 큰 스택(256MiB)을 가진 스레드에서 돈다. 제네릭 모호성: name<..> 는 ( , :: , { (구조체 리터럴이 허용되는 곳) 중 하나가 뒤따를 때만 타입 인자 목록이고, 아니면 비교 연산이다. 2.3 모듈 로더와 이름 해석 ( src/modules.rs ) ¶ 파일 하나가 모듈 하나다. use a.b 는 루트 폴더 기준 a/b.tam 을 읽는다. use tam.os 같은 표준 라이브러리는 컴파일러에 내장된 소스 ( std/*.tam 을 include_str! )이고, 대상(host, windows, uefi, bios, aarch64)에 맞는 파일이 골라진다. 모든 모듈을 이름 변경(mangling)해 하나의 Program 으로 합친다. 비공개 항목 접근은 여기서 오류가 난다. 상수 ( const )는 여기서 128비트로 계산해, 이름 사용을 값으로 치환한다(지역 변수가 가리면 치환하지 않는다). 순환 정의와 범위 초과를 여기서 잡는다. 2.4 타입 검사 ( src/typeck.rs , src/types.rs ) ¶ 모든 표현식의 타입을 AST에 기록한다. 정수 리터럴은 \"기대 타입\"을 따라가고 없으면 i32 다. 제네릭은 단형화 로 구현된다. 제네릭 함수와 구조체는 \"틀\"로 따로 보관하고, 호출이나 타입 사용이 나올 때 타입 인자를 정해 인스턴스 ( max<i32> , Pair<i32,f64>.swap )를 만들어 검사한다. 쓰이지 않은 틀은 검사하지 않는다. 인스턴스 안의 오류는 \"while instantiating\" 위치를 함께 보여 준다. 깊이 64, 인스턴스 5000개 한도가 있다. 타입 인자 추론 순서: 직접 적은 것 → 인자의 타입 → 기대 타입 → 정수 리터럴 i32 . 검사가 끝나면 인스턴스들이 일반 함수처럼 프로그램에 합쳐진다. 이후 단계는 제네릭을 알 필요가 없다. 2.5 소유권 검사 ( src/ownership.rs ) ¶ Copy 타입과 이동 타입을 가르고, 이동한 값의 재사용을 막는다( use of moved value ). 분기와 루프를 따라 \"이동했을 수도 있음\" 상태를 합친다. 루프 안에서 바깥 변수를 이동하면 다음 반복 때문에 오류다. 2.6 빌림 검사 ( src/borrowck.rs ) ¶ 함수 본문을 평가 순서의 이벤트 목록 (참조 생성, 사용, 이동, 대입 등)으로 낮춘 뒤 훑는다. & / &mut 는 loan 을 만들고, loan은 참조를 쥔 변수가 이후에 쓰이는 동안만 산다(NLL 방식). 구조체의 서로 다른 필드는 따로 빌리고, 배열 원소는 구분하지 않는다(보수적). 반환 참조의 출처는 lifetime 표기 없이 본문에서 추론한다. 2.7 코드 생성 ( src/codegen.rs ) ¶ 검사를 통과한 AST에서 텍스트 .ll 을 만든다. 모든 지역 변수는 함수 entry 블록의 alloca 와 load / store 로 둔다. 정수 + - * 는 llvm.sadd.with.overflow 계열로 낮추고, 오버플로 플래그가 서면 tam_panic 후 unreachable 로 가는 분기를 넣는다. 0 나누기, 경계 검사도 같은 방식이다. 힙은 런타임의 tam_alloc / tam_realloc / tam_free 만 거친다. 대상마다 구현이 다르다(호스트는 libc, Windows는 Heap API, 펌웨어는 자체 할당자). 이것이 \"allocator 교체\"가 들어올 자리다. 자동 해제는 여기서 만든다. 스코프를 나가는 모든 경로( return , ? , break , continue )에서 살아 있는 힙 값의 drop 호출을 넣고, 이동 여부는 변수마다 둔 런타임 플래그로 판단한다. 작은 프로그램이 이런 IR이 된다(발췌). CONSOLE 복사 $ cat a.tam\nfn add(a: i32, b: i32) i32 { a + b }\nfn main() i32 { add(40, 2) }\n$ tamc emit-llvm a.tam        # a.ll 이 생긴다\n$ cat a.ll\n...\ndefine i32 @add(i32 %a.arg, i32 %b.arg) {\nentry:\n  %t5 = call { i32, i1 } @llvm.sadd.with.overflow.i32(i32 %a.arg, i32 %b.arg)\n  %t6 = extractvalue { i32, i1 } %t5, 0\n  %t7 = extractvalue { i32, i1 } %t5, 1\n  br i1 %t7, label %trap.fail2, label %trap.ok1\ntrap.fail2:\n  call void @tam_panic(ptr @.str.0.0, i64 16)\n  unreachable\ntrap.ok1:\n  ret i32 %t6\n}\ndefine i32 @main() {\nentry:\n  %t1 = call i32 @add(i32 40, i32 2)\n  ret i32 %t1\n} 2.8 IR 최적화 ( src/opt.rs ) ¶ 번들 도구에 LLVM의 IR 최적화기( opt )가 없으므로, IR 텍스트 수준의 mem2reg 를 직접 구현했다. 주소가 새지 않는 스칼라 지역 변수를 SSA 값으로 올린다(지배자 트리, 지배 경계, 이름 바꾸기). 의심스러운 모양이 나오면 아무것도 바꾸지 않고 원본을 돌려준다. 호스트 대상은 거기에 clang -O2 가 더 해진다. 2.9 링크와 대상별 마무리 ( src/main.rs , src/implib.rs , src/image.rs ) ¶ 대상 방식 host clang 으로 .ll 을 컴파일·링크 windows .ll → .obj ( llc 가 있으면 llc , 없으면 clang -c ) → DLL별 import lib을 implib.rs 가 직접 만들어( kernel32 등) lld-link 로 링크. CRT, MSVC, SDK가 필요 없다 uefi .obj → lld-link ( /subsystem:efi_application ) → .efi bios .obj → lld-link → PE를 \"평평한 메모리 이미지\"로 펼쳐( image.rs ) 부트 섹터( src/boot_bios.bin , 원본은 boot/bios.asm )와 합쳐 디스크 이미지로 aarch64 같은 방식으로 PE를 펼쳐 QEMU virt -kernel 이 읽는 Image 헤더를 붙인다 .ll 을 오브젝트로 만드는 단계는 llc 가 우선이다. 공식 Windows LLVM 배포본에는 llc.exe 가 없어서, 없을 때는 같은 일을 clang -c 로 한다( TAMC_BACKEND=clang 이면 강제). 이때 IR 최적화는 끄고( -Xclang -disable-llvm-passes ) 백엔드 코드 생성만 쓰므로 llc 경로와 같은 결과를 낸다. 3. 프로젝트 모드 ( src/manifest.rs , src/project.rs ) ¶ Tmake.toml 은 표준 TOML이다. 파싱은 toml 크레이트가 하고, manifest.rs 가 의미를 검사해 모든 오류를 Tmake.toml 의 줄/열 로 보여 준다. 워크스페이스, 상속( { workspace = true } ), 경로 의존성, 프로파일, 잠금 파일( Tmake.lock )을 다룬다. 증분 캐시 : build/<대상>/<프로파일>/.fingerprint/ 에 컴파일러 버전, 대상, 최적화 수준, 모든 매니페스트와 소스의 SHA-256을 저장한다. 같으면 Fresh 로 건너뛴다. 실행 파일 패키지는 모든 소스를 한 프로그램으로 합쳐 컴파일하고, lib 패키지는 검사만 한다. 4. 진단 ( src/diag.rs ) ¶ 모든 오류는 파일, 줄, 열, 소스 조각, 밑줄, 설명( note )으로 출력된다. 파일을 못 읽는 것처럼 위치가 없는 오류는 가짜 위치 없이 error: 한 줄이다. 제네릭 인스턴스 오류는 원인 위치와 인스턴스를 만든 호출 위치, 두 곳을 가리킨다. 5. 설계 원칙 ¶ 안전은 컴파일러의 일이다. 검사는 모두 컴파일러 안에 있고, 생성된 코드는 단순한 IR이다. LLVM이 최적화하지만 안전성은 LLVM에 기대지 않는다. 한 방향 파이프라인. 각 단계는 앞 단계의 결과만 읽는다. 단계마다 모듈이 하나라 따로 고치고 따로 시험할 수 있다. 견고함이 기능이다. 어떤 입력에도 컴파일러가 패닉하거나 스택이 넘치지 않고, 위치가 있는 오류로 끝나야 한다. 의존성을 늘리지 않는다. LLVM 도구( clang , llc , lld-link )는 실행 파일로 부르고, Rust 크레이트는 둘뿐이다. 호환성을 지킨다. 에디션 1의 의미는 바꾸지 않는다( Reference 18장 ). 새 기능은 기존 코드의 뜻을 바꾸지 않고 추가 한다. 6. 개발과 시험 ¶ 이 절의 tests/ 와 tools/ 는 개발용 폴더이며, 배포용 저장소에는 들어 있지 않을 수 있다. CONSOLE 복사 $ cargo build --release        # tamc 빌드\n$ cargo test                   # 전체 테스트(아래)\n$ python3 tools/doccheck.py docs   # 문서의 모든 코드 블록을 컴파일·실행해 검증 종류 위치 내용 프런트엔드 테스트 tests/frontend.rs Lexer, Parser, 타입 검사 통합 테스트 tests/integration.rs , m14.rs , m17.rs , m18.rs 컴파일하고 실행해 종료 코드·출력 비교, 오류 메시지 시험 최적화 테스트 tests/opt.rs mem2reg 가 변수를 레지스터로 올렸는지 Windows 테스트 tests/windows.rs .exe 생성, 임포트가 kernel32 뿐인지, 에뮬레이터 실행 펌웨어 테스트 tests/firmware.rs QEMU로 BIOS/UEFI/AArch64 부팅 프로젝트 테스트 tests/tmake.rs Tmake.toml , 잠금 파일, 캐시 문서 테스트 tests/docs.rs tools/doccheck.py 호출 퍼저 ( tools/ ): 각각 python3 tools/fuzz_expr.py [개수] [시드] 꼴로 돌린다. 퍼저 대상 fuzz_expr.py 임의의 정수 식을 파이썬 참조 구현과 비교 fuzz_prog.py 변수, 배열, if , for , while , 함수 호출이 섞인 프로그램 fuzz_heap.py String , 구조체 안의 String , Option<String> , Result , ? , 조기 return 을 섞은 소유권상 올바른 프로그램. valgrind로 누수·이중 해제 확인. --win 은 Windows 대상 fuzz_generic.py 제네릭 함수·구조체·메서드가 섞인 프로그램 fuzz_crash.py 예제 소스를 무작위로 망가뜨려 컴파일러가 크래시 없이 오류로 끝나는지 7. 기여하는 방법 ¶ 재현 가능한 최소 프로그램을 만든다( tamc check 나 tamc run 으로). 컴파일러가 틀린 곳을 고치고, 그 프로그램을 회귀 테스트로 추가 한다. cargo test 가 전부 통과해야 하고, 문서를 건드렸다면 tools/doccheck.py docs 도 통과해야 한다. 에디션 1의 기존 의미를 바꾸는 변경은 받지 않는다. 안전하지 않은 코드를 받아들이던 버그의 수정은 예외이며 Release Notes 에 적는다. 8. 알려진 한계 (구현) ¶ 오류는 첫 번째 하나만 보고한다. lib 패키지는 검사만 한다. 패키지별 오브젝트 파일은 만들지 않고, 실행 파일은 모든 소스를 한 번에 컴파일한다. 사용자가 allocator를 바꾸는 문법과 Drop 은 아직 없다. 호스트 대상의 링크는 시스템 clang 에 의존한다. 실제 하드웨어에서의 펌웨어 실행은 확인하지 않았다(QEMU까지).", "source": "docs/compiler.md"}, {"key": "ref-style", "path": "docs/style.md", "nav": "스타일 가이드", "title": "Style Guide와 관용구 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"style-guide와-관용구\" id=\"ref-style--style-guide와-관용구\">Style Guide와 관용구<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--style-guide와-관용구\">¶</a></h1>\n<p>TAM 코드를 읽기 쉽고 안전하게 쓰는 관례를 모았다. <strong>컴파일러가 강제하는 규칙이 아니다.</strong> (공식 포매터는 아직 없다.) 규칙의 정의는 <a href=\"#doc-ref-reference\">The TAM Reference</a>에 있다.</p>\n<ul>\n<li>대상 버전: <code>tamc 1.0</code></li>\n<li>이 문서의 모든 <code>tam</code> 코드는 <code>tamc 1.0</code>으로 컴파일하고 실행해 검증했다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"1-모양\" id=\"ref-style--1-모양\">1. 모양<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--1-모양\">¶</a></h2>\n<ul>\n<li><strong>들여쓰기는 공백 4칸.</strong> 탭을 쓰지 않는다.</li>\n<li><strong>한 줄에 한 문장.</strong> <code>;</code>는 짧은 연관 문장을 한 줄에 쓸 때만 쓴다(<code>let a = 1; let b = 2</code>).</li>\n<li><strong>중괄호는 같은 줄에서 연다.</strong> <code>if</code>, <code>while</code>, <code>for</code>, <code>loop</code>, <code>match</code>, 함수 모두 그렇다.</li>\n<li><strong>줄이 길면 연산자나 <code>,</code>로 끝내서 이어 쓴다.</strong> 연산자로 시작하는 줄은 이어지지 않는다(<a href=\"#doc-book-functions-and-control-flow--33-줄바꿈과-문장\">Book 3.3</a>).</li>\n<li><strong>한 줄은 100자 이내</strong>를 권한다.</li>\n<li>구조체의 필드는 한 줄에 하나씩, 마지막에도 쉼표를 쓴다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nstruct Config {\n    width: i32,\n    height: i32,\n}\n\nfn area(c: &amp;Config) i32 {\n    c.width * c.height\n}\n\nfn main() i32 {\n    let c = Config { width: 2, height: 3 }\n    let total = area(&amp;c) +\n        1\n    total\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"2-이름\" id=\"ref-style--2-이름\">2. 이름<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--2-이름\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>대상</th>\n<th>형식</th>\n<th>예</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>함수, 메서드, 변수, 모듈</td>\n<td><code>snake_case</code></td>\n<td><code>read_file</code>, <code>line_count</code></td>\n</tr>\n<tr>\n<td>구조체</td>\n<td><code>PascalCase</code></td>\n<td><code>Config</code>, <code>Pair</code></td>\n</tr>\n<tr>\n<td>타입 매개변수</td>\n<td>짧은 대문자</td>\n<td><code>T</code>, <code>A</code>, <code>B</code></td>\n</tr>\n<tr>\n<td>상수</td>\n<td><code>UPPER_SNAKE_CASE</code></td>\n<td><code>MAX_LEN</code></td>\n</tr>\n<tr>\n<td>패키지 이름(<code>Tmake.toml</code>)</td>\n<td>소문자와 <code>-</code></td>\n<td><code>text-tools</code></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>이름은 <strong>무엇인지</strong>를 말한다. <code>n</code>, <code>i</code>, <code>p</code>는 아주 좁은 범위에서만 쓴다.</li>\n<li>참/거짓을 돌려주는 함수는 <code>is_</code>, <code>has_</code>로 시작한다: <code>is_empty</code>, <code>has_prefix</code>.</li>\n<li>값을 만드는 연관 함수는 <code>new</code>, 변환은 <code>to_</code>/<code>from_</code>을 쓴다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"3-상수\" id=\"ref-style--3-상수\">3. 상수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--3-상수\">¶</a></h2>\n<p>의미 있는 숫자에는 이름을 붙인다. 배열 길이에도 쓴다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 12\nconst ROWS: i32 = 3\nconst COLS: i32 = 4\nconst CELLS: i32 = ROWS * COLS\n\nfn main() i32 {\n    let grid = [0; CELLS]       // 길이 12\n    grid.len as i32\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"4-함수-설계\" id=\"ref-style--4-함수-설계\">4. 함수 설계<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--4-함수-설계\">¶</a></h2>\n<ul>\n<li><strong>작게 쓴다.</strong> 한 함수는 한 가지 일을 한다.</li>\n<li><strong>시그니처는 계약이다.</strong> 입력은 가능하면 <strong>빌려서</strong>(<code>&amp;T</code>) 받고, 바꿀 때만 <code>&amp;mut T</code>, 소비할 때만 값(<code>self</code>, <code>T</code>)으로 받는다.</li>\n<li><strong>실패할 수 있으면 <code>Result</code>/<code>Option</code>을 돌려준다.</strong> <code>panic</code>은 \"호출 규칙을 어긴 버그\"에만 쓴다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nstruct Counter { n: i32 }\n\nimpl Counter {\n    fn new() Self { Counter { n: 0 } }\n    fn get(&amp;self) i32 { self.n }          // 읽기만: &amp;self\n    fn bump(&amp;mut self) { self.n += 1 }    // 바꿈: &amp;mut self\n    fn finish(self) i32 { self.n * 2 }    // 소비: self\n}\n\nfn main() i32 {\n    mut c = Counter::new()\n    c.bump()\n    c.bump()\n    c.get() + c.finish() - 0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"5-오류-처리\" id=\"ref-style--5-오류-처리\">5. 오류 처리<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--5-오류-처리\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>상황</th>\n<th>쓰는 것</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>입력이나 환경 때문에 실패할 수 있다</td>\n<td><code>Result&lt;T, E&gt;</code></td>\n</tr>\n<tr>\n<td>값이 없는 것이 정상이다</td>\n<td><code>Option&lt;T&gt;</code></td>\n</tr>\n<tr>\n<td>호출 규칙을 어겼다(버그)</td>\n<td><code>assert</code>, <code>panic</code></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>호출 쪽에서 오류를 그대로 전하면 <code>?</code>를 쓴다.</li>\n<li><code>unwrap</code>은 \"여기서 실패하면 버그\"일 때만 쓴다. 입력이 들어오는 곳에서는 <code>match</code>로 처리한다.</li>\n<li>오류 타입은 <strong>하나로 통일</strong>한다(<code>?</code>는 <code>From</code> 변환이 없다). 오류 코드(<code>i32</code>)나 구조체를 쓴다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 14\nfn parse_digit(c: u8) Result&lt;i32, i32&gt; {\n    if c &lt; 48 || c &gt; 57 { return Err(1) }        // 1: 숫자가 아니다\n    Ok((c - 48) as i32)\n}\n\nfn parse_two(a: u8, b: u8) Result&lt;i32, i32&gt; {\n    let x = parse_digit(a)?\n    let y = parse_digit(b)?\n    Ok(x * 10 + y)\n}\n\nfn main() i32 {\n    match parse_two(49, 52) {          // \"14\"\n        Ok(v) =&gt; v\n        Err(e) =&gt; 100 + e\n    }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"6-소유권과-빌림\" id=\"ref-style--6-소유권과-빌림\">6. 소유권과 빌림<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--6-소유권과-빌림\">¶</a></h2>\n<ul>\n<li><strong>빌림을 먼저 생각한다.</strong> <code>String</code>을 함수에 넘겨 소유권을 잃기 전에 <code>&amp;String</code>이 되는지 본다.</li>\n<li>참조는 <strong>짧게</strong> 산다. 마지막 사용 뒤에는 다시 쓸 수 있다(NLL).</li>\n<li>한 값을 여러 곳에서 바꾸려 하지 않는다. 필요하면 구조를 나눈다(서로 다른 필드는 동시에 빌릴 수 있다).</li>\n<li>이동이 의도라면 이름으로 드러낸다(<code>finish</code>, <code>into_</code>, <code>release</code> 같은 이름).</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nfn length(s: &amp;String) i32 { s.len as i32 }     // 빌려서 읽기만\n\nfn main() i32 {\n    let s = string_from(\"hello\")\n    let a = length(&amp;s)\n    let b = length(&amp;s)                         // s는 여전히 쓸 수 있다\n    a + b - 5\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"7-반복과-분기\" id=\"ref-style--7-반복과-분기\">7. 반복과 분기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--7-반복과-분기\">¶</a></h2>\n<ul>\n<li>범위나 슬라이스를 훑으면 <strong><code>for</code></strong>를 쓴다. 조건으로 도는 것은 <code>while</code>, 끝이 안에서 정해지면 <code>loop</code>.</li>\n<li><code>break</code>/<code>continue</code>는 <strong>일찍 빠질 때</strong>만. 깊이 중첩되면 함수로 나눈다(레이블이 없다).</li>\n<li><code>if</code>는 값이 있는 식이다. 임시 변수 대신 값으로 쓴다.</li>\n<li><code>match</code>는 팔을 정확히 한 번씩 쓴다. 값을 쓰지 않는 팔은 <code>_</code>로 받는다(<code>Ok(_)</code>).</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 10\nfn clamp(x: i32, lo: i32, hi: i32) i32 {\n    if x &lt; lo { lo } else if x &gt; hi { hi } else { x }\n}\n\nfn main() i32 {\n    mut sum = 0\n    for i in 0..5 { sum += clamp(i, 1, 3) }      // 1 + 1 + 2 + 3 + 3\n    sum\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"8-제네릭\" id=\"ref-style--8-제네릭\">8. 제네릭<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--8-제네릭\">¶</a></h2>\n<ul>\n<li><strong>단순하게 시작한다.</strong> 두 타입에 같은 코드를 쓰게 될 때 제네릭으로 바꾼다.</li>\n<li>트레이트 경계가 없으므로 <strong>문서 주석에 요구하는 연산을 적는다</strong>(<code>T</code>는 <code>&gt;</code>를 지원해야 한다).</li>\n<li>만든 제네릭은 <strong>작은 호출로 바로 시험한다.</strong> 쓰이지 않은 제네릭은 검사되지 않는다.</li>\n<li>타입 인자는 대개 추론에 맡기고, 반환 자리로만 정해질 때(<code>zero&lt;i32&gt;()</code>)만 적는다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\n// T는 `&gt;`를 지원해야 한다 (정수, f64)\nfn max&lt;T&gt;(a: T, b: T) T {\n    if a &gt; b { a } else { b }\n}\n\nfn main() i32 {\n    max(3, 9)\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"9-unsafe\" id=\"ref-style--9-unsafe\">9. <code>unsafe</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--9-unsafe\">¶</a></h2>\n<ol>\n<li><strong>작게 가둔다.</strong> <code>unsafe { ... }</code> 블록은 가능한 한 한 줄, 길어도 몇 줄이다.</li>\n<li><strong>안전한 인터페이스로 감싼다.</strong> 경계 검사와 소유권을 바깥 API가 책임진다.</li>\n<li><strong>블록마다 왜 안전한지를 주석으로 적는다.</strong></li>\n<li><code>alloc</code>한 것은 짝이 되는 <code>free</code>를 어디서 부르는지 정한다.</li>\n</ol>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 11\nstruct Words {\n    ptr: *mut i32,\n    len: u64,\n}\n\nimpl Words {\n    fn new(len: u64) Self {\n        // alloc은 len * 4바이트를 돌려준다. release에서 free한다.\n        Words { ptr: unsafe { alloc(len * 4) } as *mut i32, len: len }\n    }\n\n    fn set(&amp;mut self, i: u64, v: i32) {\n        assert(i &lt; self.len)                  // 경계 검사가 안전을 만든다\n        unsafe { *(self.ptr + i) = v }\n    }\n\n    fn get(&amp;self, i: u64) i32 {\n        assert(i &lt; self.len)\n        unsafe { *(self.ptr + i) }\n    }\n\n    fn release(self) {\n        unsafe { free(self.ptr as *mut u8) }\n    }\n}\n\nfn main() i32 {\n    mut w = Words::new(2)\n    w.set(0, 4)\n    w.set(1, 7)\n    let r = w.get(0) + w.get(1)\n    w.release()\n    r\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"10-주석\" id=\"ref-style--10-주석\">10. 주석<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--10-주석\">¶</a></h2>\n<ul>\n<li><strong>왜</strong>를 적는다. 코드가 <strong>무엇</strong>을 하는지는 코드가 말한다.</li>\n<li><code>//</code>는 줄 주석, <code>/* */</code>는 블록 주석(중첩된다). 코드를 잠시 끌 때 블록 주석이 편하다.</li>\n<li>공개 함수에는 한 줄이라도 입력의 조건과 실패 방식을 적는다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"11-프로젝트와-파일\" id=\"ref-style--11-프로젝트와-파일\">11. 프로젝트와 파일<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--11-프로젝트와-파일\">¶</a></h2>\n<ul>\n<li>패키지: <strong><code>src/main.tam</code></strong>(실행 파일), <strong><code>src/lib.tam</code></strong>(라이브러리). 모듈은 <code>src/geo/shapes.tam</code>처럼 <code>use geo.shapes</code>와 경로를 맞춘다.</li>\n<li><strong>밖에 보일 것만 <code>pub</code></strong>. 기본은 비공개다.</li>\n<li>파일 하나는 모듈 하나, 한 주제만 담는다.</li>\n<li><code>Tmake.toml</code>의 <code>tamc = \"&gt;=1.0\"</code>과 <code>edition = \"1\"</code>을 적어 둔다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"12-피할-것\" id=\"ref-style--12-피할-것\">12. 피할 것<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-style--12-피할-것\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>피한다</th>\n<th>대신</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>의미 없는 숫자(<code>if x &gt; 86400</code>)</td>\n<td><code>const SECONDS_PER_DAY: i32 = 86400</code></td>\n</tr>\n<tr>\n<td><code>unwrap()</code> 남발</td>\n<td><code>match</code>, <code>?</code>, <code>unwrap_or</code></td>\n</tr>\n<tr>\n<td>큰 <code>unsafe</code> 블록</td>\n<td>작은 <code>unsafe</code> + 안전한 인터페이스</td>\n</tr>\n<tr>\n<td><code>String</code>을 값으로 받기만 하는 함수</td>\n<td><code>&amp;String</code> 또는 <code>str</code></td>\n</tr>\n<tr>\n<td>깊이 4 이상의 중첩</td>\n<td>함수로 나누기, 일찍 <code>return</code></td>\n</tr>\n<tr>\n<td>단위 없는 정수</td>\n<td>이름에 단위(<code>timeout_ms</code>) 또는 <code>const</code></td>\n</tr>\n</tbody>\n</table>\n", "text": "Style Guide와 관용구 ¶ TAM 코드를 읽기 쉽고 안전하게 쓰는 관례를 모았다. 컴파일러가 강제하는 규칙이 아니다. (공식 포매터는 아직 없다.) 규칙의 정의는 The TAM Reference 에 있다. 대상 버전: tamc 1.0 이 문서의 모든 tam 코드는 tamc 1.0 으로 컴파일하고 실행해 검증했다. 1. 모양 ¶ 들여쓰기는 공백 4칸. 탭을 쓰지 않는다. 한 줄에 한 문장. ; 는 짧은 연관 문장을 한 줄에 쓸 때만 쓴다( let a = 1; let b = 2 ). 중괄호는 같은 줄에서 연다. if , while , for , loop , match , 함수 모두 그렇다. 줄이 길면 연산자나 , 로 끝내서 이어 쓴다. 연산자로 시작하는 줄은 이어지지 않는다( Book 3.3 ). 한 줄은 100자 이내 를 권한다. 구조체의 필드는 한 줄에 하나씩, 마지막에도 쉼표를 쓴다. TAM 복사 // exit: 7\nstruct Config {\n    width: i32,\n    height: i32,\n}\n\nfn area(c: &Config) i32 {\n    c.width * c.height\n}\n\nfn main() i32 {\n    let c = Config { width: 2, height: 3 }\n    let total = area(&c) +\n        1\n    total\n} 2. 이름 ¶ 대상 형식 예 함수, 메서드, 변수, 모듈 snake_case read_file , line_count 구조체 PascalCase Config , Pair 타입 매개변수 짧은 대문자 T , A , B 상수 UPPER_SNAKE_CASE MAX_LEN 패키지 이름( Tmake.toml ) 소문자와 - text-tools 이름은 무엇인지 를 말한다. n , i , p 는 아주 좁은 범위에서만 쓴다. 참/거짓을 돌려주는 함수는 is_ , has_ 로 시작한다: is_empty , has_prefix . 값을 만드는 연관 함수는 new , 변환은 to_ / from_ 을 쓴다. 3. 상수 ¶ 의미 있는 숫자에는 이름을 붙인다. 배열 길이에도 쓴다. TAM 복사 // exit: 12\nconst ROWS: i32 = 3\nconst COLS: i32 = 4\nconst CELLS: i32 = ROWS * COLS\n\nfn main() i32 {\n    let grid = [0; CELLS]       // 길이 12\n    grid.len as i32\n} 4. 함수 설계 ¶ 작게 쓴다. 한 함수는 한 가지 일을 한다. 시그니처는 계약이다. 입력은 가능하면 빌려서 ( &T ) 받고, 바꿀 때만 &mut T , 소비할 때만 값( self , T )으로 받는다. 실패할 수 있으면 Result / Option 을 돌려준다. panic 은 \"호출 규칙을 어긴 버그\"에만 쓴다. TAM 복사 // exit: 6\nstruct Counter { n: i32 }\n\nimpl Counter {\n    fn new() Self { Counter { n: 0 } }\n    fn get(&self) i32 { self.n }          // 읽기만: &self\n    fn bump(&mut self) { self.n += 1 }    // 바꿈: &mut self\n    fn finish(self) i32 { self.n * 2 }    // 소비: self\n}\n\nfn main() i32 {\n    mut c = Counter::new()\n    c.bump()\n    c.bump()\n    c.get() + c.finish() - 0\n} 5. 오류 처리 ¶ 상황 쓰는 것 입력이나 환경 때문에 실패할 수 있다 Result<T, E> 값이 없는 것이 정상이다 Option<T> 호출 규칙을 어겼다(버그) assert , panic 호출 쪽에서 오류를 그대로 전하면 ? 를 쓴다. unwrap 은 \"여기서 실패하면 버그\"일 때만 쓴다. 입력이 들어오는 곳에서는 match 로 처리한다. 오류 타입은 하나로 통일 한다( ? 는 From 변환이 없다). 오류 코드( i32 )나 구조체를 쓴다. TAM 복사 // exit: 14\nfn parse_digit(c: u8) Result<i32, i32> {\n    if c < 48 || c > 57 { return Err(1) }        // 1: 숫자가 아니다\n    Ok((c - 48) as i32)\n}\n\nfn parse_two(a: u8, b: u8) Result<i32, i32> {\n    let x = parse_digit(a)?\n    let y = parse_digit(b)?\n    Ok(x * 10 + y)\n}\n\nfn main() i32 {\n    match parse_two(49, 52) {          // \"14\"\n        Ok(v) => v\n        Err(e) => 100 + e\n    }\n} 6. 소유권과 빌림 ¶ 빌림을 먼저 생각한다. String 을 함수에 넘겨 소유권을 잃기 전에 &String 이 되는지 본다. 참조는 짧게 산다. 마지막 사용 뒤에는 다시 쓸 수 있다(NLL). 한 값을 여러 곳에서 바꾸려 하지 않는다. 필요하면 구조를 나눈다(서로 다른 필드는 동시에 빌릴 수 있다). 이동이 의도라면 이름으로 드러낸다( finish , into_ , release 같은 이름). TAM 복사 // exit: 5\nfn length(s: &String) i32 { s.len as i32 }     // 빌려서 읽기만\n\nfn main() i32 {\n    let s = string_from(\"hello\")\n    let a = length(&s)\n    let b = length(&s)                         // s는 여전히 쓸 수 있다\n    a + b - 5\n} 7. 반복과 분기 ¶ 범위나 슬라이스를 훑으면 for 를 쓴다. 조건으로 도는 것은 while , 끝이 안에서 정해지면 loop . break / continue 는 일찍 빠질 때 만. 깊이 중첩되면 함수로 나눈다(레이블이 없다). if 는 값이 있는 식이다. 임시 변수 대신 값으로 쓴다. match 는 팔을 정확히 한 번씩 쓴다. 값을 쓰지 않는 팔은 _ 로 받는다( Ok(_) ). TAM 복사 // exit: 10\nfn clamp(x: i32, lo: i32, hi: i32) i32 {\n    if x < lo { lo } else if x > hi { hi } else { x }\n}\n\nfn main() i32 {\n    mut sum = 0\n    for i in 0..5 { sum += clamp(i, 1, 3) }      // 1 + 1 + 2 + 3 + 3\n    sum\n} 8. 제네릭 ¶ 단순하게 시작한다. 두 타입에 같은 코드를 쓰게 될 때 제네릭으로 바꾼다. 트레이트 경계가 없으므로 문서 주석에 요구하는 연산을 적는다 ( T 는 > 를 지원해야 한다). 만든 제네릭은 작은 호출로 바로 시험한다. 쓰이지 않은 제네릭은 검사되지 않는다. 타입 인자는 대개 추론에 맡기고, 반환 자리로만 정해질 때( zero<i32>() )만 적는다. TAM 복사 // exit: 9\n// T는 `>`를 지원해야 한다 (정수, f64)\nfn max<T>(a: T, b: T) T {\n    if a > b { a } else { b }\n}\n\nfn main() i32 {\n    max(3, 9)\n} 9. unsafe ¶ 작게 가둔다. unsafe { ... } 블록은 가능한 한 한 줄, 길어도 몇 줄이다. 안전한 인터페이스로 감싼다. 경계 검사와 소유권을 바깥 API가 책임진다. 블록마다 왜 안전한지를 주석으로 적는다. alloc 한 것은 짝이 되는 free 를 어디서 부르는지 정한다. TAM 복사 // exit: 11\nstruct Words {\n    ptr: *mut i32,\n    len: u64,\n}\n\nimpl Words {\n    fn new(len: u64) Self {\n        // alloc은 len * 4바이트를 돌려준다. release에서 free한다.\n        Words { ptr: unsafe { alloc(len * 4) } as *mut i32, len: len }\n    }\n\n    fn set(&mut self, i: u64, v: i32) {\n        assert(i < self.len)                  // 경계 검사가 안전을 만든다\n        unsafe { *(self.ptr + i) = v }\n    }\n\n    fn get(&self, i: u64) i32 {\n        assert(i < self.len)\n        unsafe { *(self.ptr + i) }\n    }\n\n    fn release(self) {\n        unsafe { free(self.ptr as *mut u8) }\n    }\n}\n\nfn main() i32 {\n    mut w = Words::new(2)\n    w.set(0, 4)\n    w.set(1, 7)\n    let r = w.get(0) + w.get(1)\n    w.release()\n    r\n} 10. 주석 ¶ 왜 를 적는다. 코드가 무엇 을 하는지는 코드가 말한다. // 는 줄 주석, /* */ 는 블록 주석(중첩된다). 코드를 잠시 끌 때 블록 주석이 편하다. 공개 함수에는 한 줄이라도 입력의 조건과 실패 방식을 적는다. 11. 프로젝트와 파일 ¶ 패키지: src/main.tam (실행 파일), src/lib.tam (라이브러리). 모듈은 src/geo/shapes.tam 처럼 use geo.shapes 와 경로를 맞춘다. 밖에 보일 것만 pub . 기본은 비공개다. 파일 하나는 모듈 하나, 한 주제만 담는다. Tmake.toml 의 tamc = \">=1.0\" 과 edition = \"1\" 을 적어 둔다. 12. 피할 것 ¶ 피한다 대신 의미 없는 숫자( if x > 86400 ) const SECONDS_PER_DAY: i32 = 86400 unwrap() 남발 match , ? , unwrap_or 큰 unsafe 블록 작은 unsafe + 안전한 인터페이스 String 을 값으로 받기만 하는 함수 &String 또는 str 깊이 4 이상의 중첩 함수로 나누기, 일찍 return 단위 없는 정수 이름에 단위( timeout_ms ) 또는 const", "source": "docs/style.md"}, {"key": "ref-why-tam", "path": "docs/why-tam.md", "nav": "설계 철학과 비교", "title": "Why TAM: 설계 철학과 비교 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"why-tam-설계-철학과-비교\" id=\"ref-why-tam--why-tam-설계-철학과-비교\">Why TAM: 설계 철학과 비교<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--why-tam-설계-철학과-비교\">¶</a></h1>\n<p>이 문서는 \"TAM이 왜 이런 모양인가\"와 \"내 일에 TAM이 맞는가\"에 답한다. 문법은 <a href=\"#doc-book-index\">The TAM Book</a>, 정확한 규칙은 <a href=\"#doc-ref-reference\">The TAM Reference</a>를 본다.</p>\n<ul>\n<li>대상 버전: <code>tamc 1.0</code></li>\n<li>이 문서의 코드는 <code>tamc 1.0</code>으로 컴파일하고 실행해 검증했다.</li>\n<li>비교 대상(C, Rust, Go, Zig)에 대한 서술은 각 언어의 <strong>일반적인 특징</strong>이며, TAM이 그들을 대체한다는 주장이 아니다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"1-한-문장\" id=\"ref-why-tam--1-한-문장\">1. 한 문장<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--1-한-문장\">¶</a></h2>\n<blockquote>\n<p><strong>사용자에게 통제권을 모두 준다. 안정성은 컴파일러가 책임진다.</strong></p>\n</blockquote>\n<p>TAM은 C처럼 메모리와 하드웨어를 직접 다루면서, C가 프로그래머에게 맡기는 \"실수하면 조용히 깨지는\" 부분은 컴파일러가 대신 막는 시스템 프로그래밍 언어다. 런타임도, 가비지 컬렉터도, 숨은 할당도 없다.</p>\n<h2 class=\"doc-heading\" data-slug=\"2-세-가지-기준\" id=\"ref-why-tam--2-세-가지-기준\">2. 세 가지 기준<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--2-세-가지-기준\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"간결함\" id=\"ref-why-tam--간결함\">간결함<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--간결함\">¶</a></h3>\n<p>C보다 간결해야 한다. 그래서 TAM은 다음을 뺐다.</p>\n<ul>\n<li>세미콜론(줄바꿈이 문장 끝), 함수 반환 화살표(<code>fn add(a: i32, b: i32) i32</code>), <code>let mut</code>(대신 <code>mut</code>).</li>\n<li>헤더 파일과 전방 선언(함수는 정의 순서와 무관하게 보인다).</li>\n<li>lifetime 표기. 컴파일러가 추론하고, 모호하면 오류로 알려 준다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nstruct Point { x: i32, y: i32 }\n\nimpl Point {\n    fn sum(&amp;self) i32 { self.x + self.y }\n}\n\nfn main() i32 {\n    let p = Point { x: 3, y: 4 }\n    p.sum()\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"안정성\" id=\"ref-why-tam--안정성\">안정성<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--안정성\">¶</a></h3>\n<p>\"안전한 코드에서는 메모리 오류가 생길 수 없다\"가 목표다. 컴파일러가 다음을 책임진다.</p>\n<table>\n<thead>\n<tr>\n<th>오류 종류</th>\n<th>TAM의 처리</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>해제 후 사용, 이중 해제</td>\n<td>소유권 검사로 컴파일 오류</td>\n</tr>\n<tr>\n<td>누수</td>\n<td>스코프 끝에서 자동 해제</td>\n</tr>\n<tr>\n<td>댕글링 참조</td>\n<td>빌림 검사로 컴파일 오류</td>\n</tr>\n<tr>\n<td>배열 경계 밖 접근</td>\n<td>실행 시 trap(조용히 깨지지 않는다)</td>\n</tr>\n<tr>\n<td>정수 오버플로, 0 나누기</td>\n<td>실행 시 trap</td>\n</tr>\n<tr>\n<td>초기화되지 않은 변수</td>\n<td>초기화 없는 선언 자체가 없다</td>\n</tr>\n<tr>\n<td>널 포인터</td>\n<td>안전한 참조는 널이 될 수 없고, 없을 수 있는 값은 <code>Option</code></td>\n</tr>\n</tbody>\n</table>\n<p>자세한 보장과 한계는 <a href=\"#doc-ref-safety\">Safety and Memory Model</a>에 적었다.</p>\n<h3 class=\"doc-heading\" data-slug=\"시스템-프로그래밍\" id=\"ref-why-tam--시스템-프로그래밍\">시스템 프로그래밍<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--시스템-프로그래밍\">¶</a></h3>\n<p>한 컴파일러로 다음 대상을 만든다. OS도, C 런타임도 필요 없다.</p>\n<table>\n<thead>\n<tr>\n<th>대상</th>\n<th>산출물</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>host</code></td>\n<td>Linux 네이티브 실행 파일</td>\n</tr>\n<tr>\n<td><code>windows</code></td>\n<td><code>kernel32</code>만 쓰는 x64 <code>.exe</code>(CRT, MSVC, SDK 불필요)</td>\n</tr>\n<tr>\n<td><code>uefi</code></td>\n<td>x86-64 UEFI 애플리케이션</td>\n</tr>\n<tr>\n<td><code>bios</code></td>\n<td>x86-64 BIOS 부팅 디스크 이미지</td>\n</tr>\n<tr>\n<td><code>aarch64</code></td>\n<td>AArch64 베어메탈 <code>Image</code></td>\n</tr>\n</tbody>\n</table>\n<p><code>unsafe</code> 블록 안에서는 raw 포인터, 직접 할당, MMIO와 포트 입출력을 쓸 수 있다. 통제권은 사용자에게 있다.</p>\n<h2 class=\"doc-heading\" data-slug=\"3-핵심-결정과-이유\" id=\"ref-why-tam--3-핵심-결정과-이유\">3. 핵심 결정과 이유<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--3-핵심-결정과-이유\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>결정</th>\n<th>이유</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>가비지 컬렉터 없음, 소유권 + 자동 해제</td>\n<td>실행 시간 비용과 예측 불가능한 멈춤이 없다. 펌웨어에서도 같은 규칙이 돈다</td>\n</tr>\n<tr>\n<td>예외 없음, <code>Result</code>/<code>Option</code> + <code>?</code></td>\n<td>실패가 타입에 드러난다. 제어 흐름이 숨지 않는다</td>\n</tr>\n<tr>\n<td>오버플로는 <strong>언제나</strong> trap(빌드 모드와 무관)</td>\n<td>디버그와 릴리스가 다르게 동작하지 않는다. 감싸는 산술은 <code>wrapping_add</code>로 명시한다</td>\n</tr>\n<tr>\n<td>제네릭은 단형화, 트레이트 없음</td>\n<td>C++ 템플릿처럼 실행 비용이 없고 구현이 작다. 대신 오류는 쓸 때 나온다</td>\n</tr>\n<tr>\n<td><code>Tmake.toml</code>은 표준 TOML</td>\n<td>독자 문법을 배우지 않는다</td>\n</tr>\n<tr>\n<td>문법 호환성 약속(에디션 1)</td>\n<td>1.0으로 쓴 코드가 1.x에서 계속 돌아간다(<a href=\"#doc-ref-reference--18-호환성-약속-tam-1\">Reference 18장</a>)</td>\n</tr>\n<tr>\n<td>첫 오류만 보고</td>\n<td>오류 폭주 없이 한 번에 하나를 고친다</td>\n</tr>\n</tbody>\n</table>\n<h2 class=\"doc-heading\" data-slug=\"4-다른-언어와의-비교\" id=\"ref-why-tam--4-다른-언어와의-비교\">4. 다른 언어와의 비교<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--4-다른-언어와의-비교\">¶</a></h2>\n<p>한눈에 보는 표다. \"있다/없다\"는 이 문서 작성 시점의 <code>tamc 1.0</code> 기준이다.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th style=\"text-align:center\">C</th>\n<th style=\"text-align:center\">Rust</th>\n<th style=\"text-align:center\">Go</th>\n<th style=\"text-align:center\">Zig</th>\n<th style=\"text-align:center\">TAM</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>가비지 컬렉터 없음</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n</tr>\n<tr>\n<td>컴파일 시간 메모리 안전(안전한 부분집합)</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">(GC로)</td>\n<td style=\"text-align:center\">일부</td>\n<td style=\"text-align:center\">✔</td>\n</tr>\n<tr>\n<td>lifetime 표기 필요</td>\n<td style=\"text-align:center\">-</td>\n<td style=\"text-align:center\">자주</td>\n<td style=\"text-align:center\">-</td>\n<td style=\"text-align:center\">-</td>\n<td style=\"text-align:center\"><strong>없음</strong>(추론)</td>\n</tr>\n<tr>\n<td>제네릭</td>\n<td style=\"text-align:center\">매크로</td>\n<td style=\"text-align:center\">트레이트 경계</td>\n<td style=\"text-align:center\">있음</td>\n<td style=\"text-align:center\">comptime</td>\n<td style=\"text-align:center\">단형화(경계 없음)</td>\n</tr>\n<tr>\n<td>트레이트/인터페이스</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\"><strong>✘</strong></td>\n</tr>\n<tr>\n<td>열거형(enum), 클로저</td>\n<td style=\"text-align:center\">enum만</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\"><strong>✘</strong></td>\n</tr>\n<tr>\n<td>베어메탈(UEFI/BIOS) 내장</td>\n<td style=\"text-align:center\">컴파일러 외</td>\n<td style=\"text-align:center\">별도 타깃</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n</tr>\n<tr>\n<td>표준 라이브러리</td>\n<td style=\"text-align:center\">큼</td>\n<td style=\"text-align:center\">큼</td>\n<td style=\"text-align:center\">큼</td>\n<td style=\"text-align:center\">중간</td>\n<td style=\"text-align:center\"><strong>아주 작음</strong></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>Rust와 가장 가깝다.</strong> 소유권, 빌림, <code>Result</code>, <code>?</code>가 같은 사상이다. 대신 lifetime 표기, 트레이트, 매크로를 뺐고, 그 만큼 표현력도 작다.</li>\n<li><strong>C의 자리를 노린다.</strong> 크기가 작은 언어, 예측 가능한 코드 생성, 베어메탈 지원이 그렇다. 대신 안전한 부분에서는 정의되지 않은 동작이 없다.</li>\n<li><strong>Go와 다르다.</strong> GC도 런타임도 없고, 동시성 모델도 없다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"5-이-언어가-아닌-것\" id=\"ref-why-tam--5-이-언어가-아닌-것\">5. 이 언어가 <strong>아닌</strong> 것<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--5-이-언어가-아닌-것\">¶</a></h2>\n<p>솔직한 한계도 설계의 일부다.</p>\n<ul>\n<li><strong>범용 애플리케이션 언어가 아니다.</strong> 표준 라이브러리는 <code>tam.os</code>, <code>tam.fmt</code>, <code>tam.serial</code>뿐이다. <code>Vec</code>, 해시맵, 정규식, 네트워크는 없다.</li>\n<li><strong>트레이트, 열거형, 클로저, 튜플이 없다.</strong> 큰 추상화에는 아직 불편하다.</li>\n<li><strong>스레드와 비동기가 없다.</strong></li>\n<li><strong>패키지 레지스트리가 없다.</strong> 의존성은 경로(path)만 된다.</li>\n<li><strong>오류는 하나씩만 보고한다.</strong></li>\n<li><strong>보수적인 빌림 검사.</strong> 안전하지만 드물게 올바른 코드를 거절한다(<a href=\"#doc-ref-reference--9-빌림-규칙\">Reference 9장</a>).</li>\n</ul>\n<p>다음에 맞는다면 TAM이 어울린다: 작은 커널·부트로더·펌웨어, 런타임 없는 도구, 소유권을 배우며 컴파일러 구조를 보고 싶을 때. 큰 서비스를 빨리 만들어야 하면 지금은 다른 언어가 낫다.</p>\n<h2 class=\"doc-heading\" data-slug=\"6-c와-rust-사용자를-위한-번역\" id=\"ref-why-tam--6-c와-rust-사용자를-위한-번역\">6. C와 Rust 사용자를 위한 번역<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--6-c와-rust-사용자를-위한-번역\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"c에서\" id=\"ref-why-tam--c에서\">C에서<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--c에서\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th>C</th>\n<th>TAM</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>int add(int a, int b) { return a + b; }</code></td>\n<td><code>fn add(a: i32, b: i32) i32 { a + b }</code></td>\n</tr>\n<tr>\n<td><code>int x = 5;</code> / <code>const int y = 5;</code></td>\n<td><code>mut x = 5</code> / <code>let y = 5</code></td>\n</tr>\n<tr>\n<td><code>#define N 8</code></td>\n<td><code>const N: i32 = 8</code></td>\n</tr>\n<tr>\n<td><code>for (int i = 0; i &lt; n; i++)</code></td>\n<td><code>for i in 0..n</code></td>\n</tr>\n<tr>\n<td><code>while (1) { ... break; }</code></td>\n<td><code>loop { ... break }</code></td>\n</tr>\n<tr>\n<td><code>int a[4] = {0};</code></td>\n<td><code>let a = [0; 4]</code></td>\n</tr>\n<tr>\n<td><code>malloc</code>/<code>free</code></td>\n<td><code>String</code>은 자동. 직접은 <code>unsafe { alloc(n) }</code>/<code>free(p)</code></td>\n</tr>\n<tr>\n<td><code>NULL</code> 반환으로 실패 알림</td>\n<td><code>Option&lt;T&gt;</code> / <code>Result&lt;T, E&gt;</code></td>\n</tr>\n<tr>\n<td><code>errno</code> 확인</td>\n<td><code>match</code>나 <code>?</code></td>\n</tr>\n<tr>\n<td><code>assert(x)</code></td>\n<td><code>assert(x)</code>(실패하면 trap)</td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 10\nconst N: i32 = 5\n\nfn sum_to(n: i32) i32 {\n    mut s = 0\n    for i in 1..=n { s += i }\n    s\n}\n\nfn main() i32 {\n    sum_to(N) - 5\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"rust에서\" id=\"ref-why-tam--rust에서\">Rust에서<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--rust에서\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th>Rust</th>\n<th>TAM</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>fn f(x: i32) -&gt; i32</code></td>\n<td><code>fn f(x: i32) i32</code></td>\n</tr>\n<tr>\n<td><code>let mut x = 0;</code></td>\n<td><code>mut x = 0</code></td>\n</tr>\n<tr>\n<td><code>fn first&lt;'a&gt;(a: &amp;'a [i32]) -&gt; &amp;'a i32</code></td>\n<td><code>fn first(a: &amp;[i32]) &amp;i32</code>(추론)</td>\n</tr>\n<tr>\n<td><code>enum Option&lt;T&gt;</code> / <code>Result&lt;T, E&gt;</code></td>\n<td>내장 <code>Option&lt;T&gt;</code> / <code>Result&lt;T, E&gt;</code>(직접 만들 수는 없다)</td>\n</tr>\n<tr>\n<td><code>impl&lt;T&gt; Pair&lt;T&gt;</code></td>\n<td><code>impl Pair&lt;T&gt;</code></td>\n</tr>\n<tr>\n<td><code>trait</code>, <code>where T: Ord</code></td>\n<td>없음. 본문을 인스턴스화할 때 검사한다</td>\n</tr>\n<tr>\n<td><code>match</code>가 모든 경우를 다룬다</td>\n<td><code>Ok/Err</code>, <code>Some/None</code>만</td>\n</tr>\n<tr>\n<td><code>Box&lt;T&gt;</code>, <code>Vec&lt;T&gt;</code></td>\n<td>없음(<code>unsafe</code>로 직접 만든다)</td>\n</tr>\n<tr>\n<td><code>.map(\\|x\\| ...)</code></td>\n<td>없음(클로저가 없다)</td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn first(a: &amp;[i32]) &amp;i32 { &amp;a[0] }          // lifetime 표기 없이 컴파일된다\n\nfn main() i32 {\n    let a = [6, 7, 8]\n    *first(&amp;a)\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"7-더-읽기\" id=\"ref-why-tam--7-더-읽기\">7. 더 읽기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-why-tam--7-더-읽기\">¶</a></h2>\n<ul>\n<li>처음 배운다면: <a href=\"#doc-book-index\">The TAM Book</a></li>\n<li>예제로 익히려면: <a href=\"#doc-examples-index\">TAM by Example</a></li>\n<li>안전성의 구체적인 내용: <a href=\"#doc-ref-safety\">Safety and Memory Model</a></li>\n<li>코드 스타일: <a href=\"#doc-ref-style\">Style Guide</a></li>\n<li>컴파일러가 궁금하다면: <a href=\"#doc-ref-compiler\">Compiler Architecture</a></li>\n<li>버전별 변경: <a href=\"#doc-ref-changelog\">Release Notes</a></li>\n</ul>\n", "text": "Why TAM: 설계 철학과 비교 ¶ 이 문서는 \"TAM이 왜 이런 모양인가\"와 \"내 일에 TAM이 맞는가\"에 답한다. 문법은 The TAM Book , 정확한 규칙은 The TAM Reference 를 본다. 대상 버전: tamc 1.0 이 문서의 코드는 tamc 1.0 으로 컴파일하고 실행해 검증했다. 비교 대상(C, Rust, Go, Zig)에 대한 서술은 각 언어의 일반적인 특징 이며, TAM이 그들을 대체한다는 주장이 아니다. 1. 한 문장 ¶ 사용자에게 통제권을 모두 준다. 안정성은 컴파일러가 책임진다. TAM은 C처럼 메모리와 하드웨어를 직접 다루면서, C가 프로그래머에게 맡기는 \"실수하면 조용히 깨지는\" 부분은 컴파일러가 대신 막는 시스템 프로그래밍 언어다. 런타임도, 가비지 컬렉터도, 숨은 할당도 없다. 2. 세 가지 기준 ¶ 간결함 ¶ C보다 간결해야 한다. 그래서 TAM은 다음을 뺐다. 세미콜론(줄바꿈이 문장 끝), 함수 반환 화살표( fn add(a: i32, b: i32) i32 ), let mut (대신 mut ). 헤더 파일과 전방 선언(함수는 정의 순서와 무관하게 보인다). lifetime 표기. 컴파일러가 추론하고, 모호하면 오류로 알려 준다. TAM 복사 // exit: 7\nstruct Point { x: i32, y: i32 }\n\nimpl Point {\n    fn sum(&self) i32 { self.x + self.y }\n}\n\nfn main() i32 {\n    let p = Point { x: 3, y: 4 }\n    p.sum()\n} 안정성 ¶ \"안전한 코드에서는 메모리 오류가 생길 수 없다\"가 목표다. 컴파일러가 다음을 책임진다. 오류 종류 TAM의 처리 해제 후 사용, 이중 해제 소유권 검사로 컴파일 오류 누수 스코프 끝에서 자동 해제 댕글링 참조 빌림 검사로 컴파일 오류 배열 경계 밖 접근 실행 시 trap(조용히 깨지지 않는다) 정수 오버플로, 0 나누기 실행 시 trap 초기화되지 않은 변수 초기화 없는 선언 자체가 없다 널 포인터 안전한 참조는 널이 될 수 없고, 없을 수 있는 값은 Option 자세한 보장과 한계는 Safety and Memory Model 에 적었다. 시스템 프로그래밍 ¶ 한 컴파일러로 다음 대상을 만든다. OS도, C 런타임도 필요 없다. 대상 산출물 host Linux 네이티브 실행 파일 windows kernel32 만 쓰는 x64 .exe (CRT, MSVC, SDK 불필요) uefi x86-64 UEFI 애플리케이션 bios x86-64 BIOS 부팅 디스크 이미지 aarch64 AArch64 베어메탈 Image unsafe 블록 안에서는 raw 포인터, 직접 할당, MMIO와 포트 입출력을 쓸 수 있다. 통제권은 사용자에게 있다. 3. 핵심 결정과 이유 ¶ 결정 이유 가비지 컬렉터 없음, 소유권 + 자동 해제 실행 시간 비용과 예측 불가능한 멈춤이 없다. 펌웨어에서도 같은 규칙이 돈다 예외 없음, Result / Option + ? 실패가 타입에 드러난다. 제어 흐름이 숨지 않는다 오버플로는 언제나 trap(빌드 모드와 무관) 디버그와 릴리스가 다르게 동작하지 않는다. 감싸는 산술은 wrapping_add 로 명시한다 제네릭은 단형화, 트레이트 없음 C++ 템플릿처럼 실행 비용이 없고 구현이 작다. 대신 오류는 쓸 때 나온다 Tmake.toml 은 표준 TOML 독자 문법을 배우지 않는다 문법 호환성 약속(에디션 1) 1.0으로 쓴 코드가 1.x에서 계속 돌아간다( Reference 18장 ) 첫 오류만 보고 오류 폭주 없이 한 번에 하나를 고친다 4. 다른 언어와의 비교 ¶ 한눈에 보는 표다. \"있다/없다\"는 이 문서 작성 시점의 tamc 1.0 기준이다. C Rust Go Zig TAM 가비지 컬렉터 없음 ✔ ✔ ✘ ✔ ✔ 컴파일 시간 메모리 안전(안전한 부분집합) ✘ ✔ (GC로) 일부 ✔ lifetime 표기 필요 - 자주 - - 없음 (추론) 제네릭 매크로 트레이트 경계 있음 comptime 단형화(경계 없음) 트레이트/인터페이스 ✘ ✔ ✔ ✘ ✘ 열거형(enum), 클로저 enum만 ✔ ✔ ✔ ✘ 베어메탈(UEFI/BIOS) 내장 컴파일러 외 별도 타깃 ✘ ✔ ✔ 표준 라이브러리 큼 큼 큼 중간 아주 작음 Rust와 가장 가깝다. 소유권, 빌림, Result , ? 가 같은 사상이다. 대신 lifetime 표기, 트레이트, 매크로를 뺐고, 그 만큼 표현력도 작다. C의 자리를 노린다. 크기가 작은 언어, 예측 가능한 코드 생성, 베어메탈 지원이 그렇다. 대신 안전한 부분에서는 정의되지 않은 동작이 없다. Go와 다르다. GC도 런타임도 없고, 동시성 모델도 없다. 5. 이 언어가 아닌 것 ¶ 솔직한 한계도 설계의 일부다. 범용 애플리케이션 언어가 아니다. 표준 라이브러리는 tam.os , tam.fmt , tam.serial 뿐이다. Vec , 해시맵, 정규식, 네트워크는 없다. 트레이트, 열거형, 클로저, 튜플이 없다. 큰 추상화에는 아직 불편하다. 스레드와 비동기가 없다. 패키지 레지스트리가 없다. 의존성은 경로(path)만 된다. 오류는 하나씩만 보고한다. 보수적인 빌림 검사. 안전하지만 드물게 올바른 코드를 거절한다( Reference 9장 ). 다음에 맞는다면 TAM이 어울린다: 작은 커널·부트로더·펌웨어, 런타임 없는 도구, 소유권을 배우며 컴파일러 구조를 보고 싶을 때. 큰 서비스를 빨리 만들어야 하면 지금은 다른 언어가 낫다. 6. C와 Rust 사용자를 위한 번역 ¶ C에서 ¶ C TAM int add(int a, int b) { return a + b; } fn add(a: i32, b: i32) i32 { a + b } int x = 5; / const int y = 5; mut x = 5 / let y = 5 #define N 8 const N: i32 = 8 for (int i = 0; i < n; i++) for i in 0..n while (1) { ... break; } loop { ... break } int a[4] = {0}; let a = [0; 4] malloc / free String 은 자동. 직접은 unsafe { alloc(n) } / free(p) NULL 반환으로 실패 알림 Option<T> / Result<T, E> errno 확인 match 나 ? assert(x) assert(x) (실패하면 trap) TAM 복사 // exit: 10\nconst N: i32 = 5\n\nfn sum_to(n: i32) i32 {\n    mut s = 0\n    for i in 1..=n { s += i }\n    s\n}\n\nfn main() i32 {\n    sum_to(N) - 5\n} Rust에서 ¶ Rust TAM fn f(x: i32) -> i32 fn f(x: i32) i32 let mut x = 0; mut x = 0 fn first<'a>(a: &'a [i32]) -> &'a i32 fn first(a: &[i32]) &i32 (추론) enum Option<T> / Result<T, E> 내장 Option<T> / Result<T, E> (직접 만들 수는 없다) impl<T> Pair<T> impl Pair<T> trait , where T: Ord 없음. 본문을 인스턴스화할 때 검사한다 match 가 모든 경우를 다룬다 Ok/Err , Some/None 만 Box<T> , Vec<T> 없음( unsafe 로 직접 만든다) .map(\\|x\\| ...) 없음(클로저가 없다) TAM 복사 // exit: 6\nfn first(a: &[i32]) &i32 { &a[0] }          // lifetime 표기 없이 컴파일된다\n\nfn main() i32 {\n    let a = [6, 7, 8]\n    *first(&a)\n} 7. 더 읽기 ¶ 처음 배운다면: The TAM Book 예제로 익히려면: TAM by Example 안전성의 구체적인 내용: Safety and Memory Model 코드 스타일: Style Guide 컴파일러가 궁금하다면: Compiler Architecture 버전별 변경: Release Notes", "source": "docs/why-tam.md"}, {"key": "ref-changelog", "path": "docs/changelog.md", "nav": "릴리스 노트", "title": "Release Notes ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"release-notes\" id=\"ref-changelog--release-notes\">Release Notes<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-changelog--release-notes\">¶</a></h1>\n<p>TAM과 <code>tamc</code>의 변화를 버전 순서로 적는다. 호환성 약속은 <a href=\"#doc-ref-reference--18-호환성-약속-tam-1\">The TAM Reference 18장</a>에 있다.</p>\n<h2 class=\"doc-heading\" data-slug=\"100\" id=\"ref-changelog--100\">1.0.0<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-changelog--100\">¶</a></h2>\n<p>TAM의 <strong>첫 공식 지원 버전</strong>이다. 이 버전이 정의하는 언어가 <strong>에디션 1</strong>이며, 이후 <code>1.x</code> 컴파일러는 에디션 1로 쓴 올바른 프로그램을 같은 의미로 계속 컴파일한다.</p>\n<h3 class=\"doc-heading\" data-slug=\"추가된-것\" id=\"ref-changelog--추가된-것\">추가된 것<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-changelog--추가된-것\">¶</a></h3>\n<ul>\n<li><strong><code>const</code></strong>: <code>const NAME: T = 식</code>. <code>T</code>는 정수, <code>f64</code>, <code>bool</code>, <code>str</code>. 컴파일 시간에 128비트로 계산하고 범위를 검사한다. 다른 상수와 <code>모듈::NAME</code>을 참조할 수 있고, <code>pub const</code>로 모듈 밖에 보이며, 배열 길이(<code>[T; N]</code>, <code>[v; N]</code>)에 쓴다. 순환 정의는 오류다.</li>\n<li><strong><code>loop { }</code></strong>: <code>while true { }</code>와 같다. <code>break</code> 없는 <code>loop</code>로 끝나는 함수는 마지막 식이 필요 없다.</li>\n<li><strong>블록 주석</strong> <code>/* */</code>: 중첩된다.</li>\n<li><strong>제네릭</strong>: 함수, 구조체, <code>impl</code>. C++ 템플릿처럼 <strong>단형화</strong>하며, 쓰이는 인스턴스를 만들 때 본문을 검사한다. 트레이트와 경계는 없다. 타입 인자는 직접 적은 것 → 인자 타입 → 기대 타입 → 정수 리터럴 <code>i32</code> 순으로 정한다. 인스턴스 오류는 \"while instantiating\" 위치를 함께 보여 준다. 한도는 깊이 64, 인스턴스 5000개.</li>\n<li><strong><code>edition</code></strong> 키: <code>Tmake.toml</code>의 <code>[package]</code>에서 <code>edition = \"1\"</code>(생략하면 <code>\"1\"</code>). 모르는 에디션은 <code>unsupported edition</code>으로 거절한다.</li>\n<li><strong>백엔드</strong>: <code>llc</code>가 없으면 <code>clang -c</code>로 <code>.ll</code>을 오브젝트로 만든다. 공식 Windows LLVM 배포본에는 <code>llc.exe</code>가 없기 때문이다. <code>TAMC_BACKEND=clang</code>이면 강제한다.</li>\n<li><strong>문서</strong>: The TAM Book(14장), TAM by Example, Standard Library API, Tmake.toml, The TAM Reference, 그리고 Why TAM, Safety and Memory Model, Compiler Architecture, Style Guide, 이 Release Notes. 모든 코드 예제는 <code>tamc</code>로 컴파일·실행해 검증한다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"확인한-것\" id=\"ref-changelog--확인한-것\">확인한 것<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-changelog--확인한-것\">¶</a></h3>\n<ul>\n<li>Windows용 <code>tamc.exe</code>를 GitHub Actions(<code>windows-latest</code>)에서 빌드하고, LLVM이 PATH에 없는 상태에서 묶인 <code>clang.exe</code>와 <code>lld-link.exe</code>만으로 <code>.exe</code>를 만들어 <strong>실제 Windows에서 실행해 종료 코드 42를 확인했다</strong>.</li>\n<li>제네릭 퍼저 800개 프로그램이 파이썬 참조 구현과 일치했다. 기존 퍼저와 valgrind(제네릭 힙 포함)에서 추가 문제가 없었다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"알려진-한계\" id=\"ref-changelog--알려진-한계\">알려진 한계<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-changelog--알려진-한계\">¶</a></h3>\n<ul>\n<li>트레이트(경계), 메서드 자신의 타입 매개변수, 상수 제네릭이 없다. 쓰이지 않은 제네릭은 검사되지 않는다.</li>\n<li>열거형, 튜플, 클로저, 연산자 오버로딩이 없고, <code>Vec</code>/해시맵 같은 컬렉션이 없다.</li>\n<li>의존성은 경로(path)만 된다.</li>\n<li>오류는 첫 번째 하나만 보고한다.</li>\n<li>힙 필드를 <code>self.field</code>로 꺼내 이동할 수 없다(<code>T = String</code>인 인스턴스에도 적용).</li>\n</ul>\n<p>전체 목록은 <a href=\"#doc-ref-reference--17-아직-없는-것\">Reference 17장</a>에 있다.</p>\n<h3 class=\"doc-heading\" data-slug=\"업그레이드\" id=\"ref-changelog--업그레이드\">업그레이드<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-changelog--업그레이드\">¶</a></h3>\n<p>첫 공식 버전이라 옮길 것은 없다. 1.0 이전에 쓰던 코드는 그대로 컴파일된다. 새로 생긴 키워드 <code>const</code>, <code>loop</code>는 1.0 이전에 식별자로 쓰던 이름이면 바꿔야 한다.</p>\n<h2 class=\"doc-heading\" data-slug=\"개발-이력-10-이전\" id=\"ref-changelog--개발-이력-10-이전\">개발 이력 (1.0 이전)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-changelog--개발-이력-10-이전\">¶</a></h2>\n<p>공식 버전 전의 마일스톤이다. 각 마일스톤은 반드시 실제로 실행되는 상태로 끝났다.</p>\n<table>\n<thead>\n<tr>\n<th>마일스톤</th>\n<th>내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>M1</td>\n<td>골격, Lexer, Parser, 진단(파일·줄·열 오류)</td>\n</tr>\n<tr>\n<td>M2~M3</td>\n<td>타입 검사, <code>.ll</code> 출력, 변수, 산술, <code>if</code>/<code>while</code>, 함수 호출</td>\n</tr>\n<tr>\n<td>M4</td>\n<td><code>bool</code>, <code>f64</code>, 비교·논리 연산, 여러 정수형, <code>as</code> 변환</td>\n</tr>\n<tr>\n<td>M5</td>\n<td><code>struct</code>, 참조 <code>&amp;</code>, <code>&amp;mut</code>, <code>*</code></td>\n</tr>\n<tr>\n<td>M6</td>\n<td>소유권(이동) 검사</td>\n</tr>\n<tr>\n<td>M7</td>\n<td>빌림 검사(가변/불변 충돌, 댕글링)</td>\n</tr>\n<tr>\n<td>M8</td>\n<td>모듈(<code>use</code>, <code>pub</code>), <code>unsafe</code>, raw 포인터</td>\n</tr>\n<tr>\n<td>M9</td>\n<td><code>Result</code>, <code>?</code>, <code>match</code>, <code>str</code> 리터럴, 힙 <code>String</code>, 자동 해제</td>\n</tr>\n<tr>\n<td>M10</td>\n<td>Windows <code>.exe</code>: CRT·MSVC·SDK 없이 <code>kernel32</code> import lib을 직접 생성</td>\n</tr>\n<tr>\n<td>M11</td>\n<td><code>extern</code> FFI, 표준 라이브러리 <code>tam.os</code>, <code>tam.fmt</code></td>\n</tr>\n<tr>\n<td>M12</td>\n<td>펌웨어: UEFI, BIOS, AArch64 베어메탈(QEMU로 부팅 검증)</td>\n</tr>\n<tr>\n<td>M13</td>\n<td>비트 연산자, 배열·슬라이스, 메서드, <code>Option</code>, 오버플로·0 나눗셈 trap</td>\n</tr>\n<tr>\n<td>M14</td>\n<td>복합 대입, <code>for</code>/<code>break</code>/<code>continue</code>, 리터럴, <code>Option</code> 메서드, 패닉 메시지</td>\n</tr>\n<tr>\n<td>M15</td>\n<td>스택 변수 → SSA 승격(<code>mem2reg</code>), 호스트 <code>-O2</code>, 큰 스택 프레임 링크 버그 수정</td>\n</tr>\n<tr>\n<td>M16</td>\n<td><code>Tmake.toml</code>: 의존성, 프로파일, 워크스페이스, 잠금 파일, 증분 캐시</td>\n</tr>\n<tr>\n<td>M17</td>\n<td>버그 사냥과 문서 5종</td>\n</tr>\n<tr>\n<td>M18</td>\n<td><code>const</code>, <code>loop</code>, 블록 주석, 제네릭 → <strong>1.0.0</strong></td>\n</tr>\n</tbody>\n</table>\n<h3 class=\"doc-heading\" data-slug=\"퍼저와-검증이-찾은-대표적인-버그\" id=\"ref-changelog--퍼저와-검증이-찾은-대표적인-버그\">퍼저와 검증이 찾은 대표적인 버그<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-changelog--퍼저와-검증이-찾은-대표적인-버그\">¶</a></h3>\n<ul>\n<li><strong>컴파일러 스택 오버플로</strong>(M17): 괄호 2만 겹, <code>1 + 1 + …</code> 2만 항, 블록 3천 겹 같은 입력에서 <code>tamc</code> 자체가 죽었다. 파서에 깊이 한도를 두고 위치와 함께 오류를 내게 했다.</li>\n<li><strong>큰 스택 프레임 링크 실패</strong>(M15): 4KiB를 넘는 지역 배열이 있는 함수가 Windows/UEFI/BIOS/AArch64에서 링크에 실패했다. CRT가 없어서 <code>__chkstk</code>를 직접 제공해 해결했다.</li>\n<li><strong>최솟값 리터럴</strong>(M14): <code>-128</code>(<code>i8</code>) 같은 리터럴이 부정 연산에서 오버플로 trap하던 문제.</li>\n<li><strong>UTF-8 BOM</strong>(M17): Windows 편집기가 붙이는 BOM이 있는 파일이 거절되던 문제.</li>\n<li><strong><code>&amp;&amp;</code> 토큰</strong>(M17): <code>&amp;&amp;T</code>(타입)와 <code>&amp;&amp;x</code>(식)가 파싱되지 않던 문제.</li>\n<li><strong>의존성 순환</strong>(M16): 감지되지 않던 문제.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"앞으로\" id=\"ref-changelog--앞으로\">앞으로<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-changelog--앞으로\">¶</a></h2>\n<p>아래는 <strong>계획이 아니라 후보</strong>이며, 약속이 아니다. 모두 에디션 1의 기존 코드를 깨지 않는 <strong>추가</strong>로만 들어온다.</p>\n<ul>\n<li>표준 라이브러리: 제네릭 <code>Vec&lt;T&gt;</code></li>\n<li>트레이트 경계(경계 없는 기존 제네릭은 계속 컴파일된다)</li>\n<li>열거형과 <code>match</code> 확장</li>\n<li>사용자 allocator 교체</li>\n<li>레지스트리 의존성</li>\n<li>여러 오류를 한 번에 보고</li>\n</ul>\n", "text": "Release Notes ¶ TAM과 tamc 의 변화를 버전 순서로 적는다. 호환성 약속은 The TAM Reference 18장 에 있다. 1.0.0 ¶ TAM의 첫 공식 지원 버전 이다. 이 버전이 정의하는 언어가 에디션 1 이며, 이후 1.x 컴파일러는 에디션 1로 쓴 올바른 프로그램을 같은 의미로 계속 컴파일한다. 추가된 것 ¶ const : const NAME: T = 식 . T 는 정수, f64 , bool , str . 컴파일 시간에 128비트로 계산하고 범위를 검사한다. 다른 상수와 모듈::NAME 을 참조할 수 있고, pub const 로 모듈 밖에 보이며, 배열 길이( [T; N] , [v; N] )에 쓴다. 순환 정의는 오류다. loop { } : while true { } 와 같다. break 없는 loop 로 끝나는 함수는 마지막 식이 필요 없다. 블록 주석 /* */ : 중첩된다. 제네릭 : 함수, 구조체, impl . C++ 템플릿처럼 단형화 하며, 쓰이는 인스턴스를 만들 때 본문을 검사한다. 트레이트와 경계는 없다. 타입 인자는 직접 적은 것 → 인자 타입 → 기대 타입 → 정수 리터럴 i32 순으로 정한다. 인스턴스 오류는 \"while instantiating\" 위치를 함께 보여 준다. 한도는 깊이 64, 인스턴스 5000개. edition 키: Tmake.toml 의 [package] 에서 edition = \"1\" (생략하면 \"1\" ). 모르는 에디션은 unsupported edition 으로 거절한다. 백엔드 : llc 가 없으면 clang -c 로 .ll 을 오브젝트로 만든다. 공식 Windows LLVM 배포본에는 llc.exe 가 없기 때문이다. TAMC_BACKEND=clang 이면 강제한다. 문서 : The TAM Book(14장), TAM by Example, Standard Library API, Tmake.toml, The TAM Reference, 그리고 Why TAM, Safety and Memory Model, Compiler Architecture, Style Guide, 이 Release Notes. 모든 코드 예제는 tamc 로 컴파일·실행해 검증한다. 확인한 것 ¶ Windows용 tamc.exe 를 GitHub Actions( windows-latest )에서 빌드하고, LLVM이 PATH에 없는 상태에서 묶인 clang.exe 와 lld-link.exe 만으로 .exe 를 만들어 실제 Windows에서 실행해 종료 코드 42를 확인했다 . 제네릭 퍼저 800개 프로그램이 파이썬 참조 구현과 일치했다. 기존 퍼저와 valgrind(제네릭 힙 포함)에서 추가 문제가 없었다. 알려진 한계 ¶ 트레이트(경계), 메서드 자신의 타입 매개변수, 상수 제네릭이 없다. 쓰이지 않은 제네릭은 검사되지 않는다. 열거형, 튜플, 클로저, 연산자 오버로딩이 없고, Vec /해시맵 같은 컬렉션이 없다. 의존성은 경로(path)만 된다. 오류는 첫 번째 하나만 보고한다. 힙 필드를 self.field 로 꺼내 이동할 수 없다( T = String 인 인스턴스에도 적용). 전체 목록은 Reference 17장 에 있다. 업그레이드 ¶ 첫 공식 버전이라 옮길 것은 없다. 1.0 이전에 쓰던 코드는 그대로 컴파일된다. 새로 생긴 키워드 const , loop 는 1.0 이전에 식별자로 쓰던 이름이면 바꿔야 한다. 개발 이력 (1.0 이전) ¶ 공식 버전 전의 마일스톤이다. 각 마일스톤은 반드시 실제로 실행되는 상태로 끝났다. 마일스톤 내용 M1 골격, Lexer, Parser, 진단(파일·줄·열 오류) M2~M3 타입 검사, .ll 출력, 변수, 산술, if / while , 함수 호출 M4 bool , f64 , 비교·논리 연산, 여러 정수형, as 변환 M5 struct , 참조 & , &mut , * M6 소유권(이동) 검사 M7 빌림 검사(가변/불변 충돌, 댕글링) M8 모듈( use , pub ), unsafe , raw 포인터 M9 Result , ? , match , str 리터럴, 힙 String , 자동 해제 M10 Windows .exe : CRT·MSVC·SDK 없이 kernel32 import lib을 직접 생성 M11 extern FFI, 표준 라이브러리 tam.os , tam.fmt M12 펌웨어: UEFI, BIOS, AArch64 베어메탈(QEMU로 부팅 검증) M13 비트 연산자, 배열·슬라이스, 메서드, Option , 오버플로·0 나눗셈 trap M14 복합 대입, for / break / continue , 리터럴, Option 메서드, 패닉 메시지 M15 스택 변수 → SSA 승격( mem2reg ), 호스트 -O2 , 큰 스택 프레임 링크 버그 수정 M16 Tmake.toml : 의존성, 프로파일, 워크스페이스, 잠금 파일, 증분 캐시 M17 버그 사냥과 문서 5종 M18 const , loop , 블록 주석, 제네릭 → 1.0.0 퍼저와 검증이 찾은 대표적인 버그 ¶ 컴파일러 스택 오버플로 (M17): 괄호 2만 겹, 1 + 1 + … 2만 항, 블록 3천 겹 같은 입력에서 tamc 자체가 죽었다. 파서에 깊이 한도를 두고 위치와 함께 오류를 내게 했다. 큰 스택 프레임 링크 실패 (M15): 4KiB를 넘는 지역 배열이 있는 함수가 Windows/UEFI/BIOS/AArch64에서 링크에 실패했다. CRT가 없어서 __chkstk 를 직접 제공해 해결했다. 최솟값 리터럴 (M14): -128 ( i8 ) 같은 리터럴이 부정 연산에서 오버플로 trap하던 문제. UTF-8 BOM (M17): Windows 편집기가 붙이는 BOM이 있는 파일이 거절되던 문제. && 토큰 (M17): &&T (타입)와 &&x (식)가 파싱되지 않던 문제. 의존성 순환 (M16): 감지되지 않던 문제. 앞으로 ¶ 아래는 계획이 아니라 후보 이며, 약속이 아니다. 모두 에디션 1의 기존 코드를 깨지 않는 추가 로만 들어온다. 표준 라이브러리: 제네릭 Vec<T> 트레이트 경계(경계 없는 기존 제네릭은 계속 컴파일된다) 열거형과 match 확장 사용자 allocator 교체 레지스트리 의존성 여러 오류를 한 번에 보고", "source": "docs/changelog.md"}], "groups": [{"title": "시작하기", "items": [{"key": "overview", "label": "문서 안내"}, {"key": "book-index", "label": "The TAM Book"}, {"key": "book-getting-started", "label": "시작하기"}]}, {"title": "The TAM Book", "items": [{"key": "book-values-and-variables", "label": "값과 변수"}, {"key": "book-functions-and-control-flow", "label": "함수와 제어 흐름"}, {"key": "book-ownership", "label": "소유권"}, {"key": "book-references-and-borr
