주석으로 적는 습관을 들인다. 10.5 C 라이브러리 호출: extern ¶ 본문 없는 선언으로 외부 함수를 부른다. 호스트에서는 \"c\" 가 libc다. TAM 복사 // exit: 7\nextern \"c\" fn abs(x: i32) i32\n\nfn main() i32 {\n    unsafe { abs(0 - 7) }\n} 인자·반환 타입은 C ABI에 맞는 것만 쓴다: 정수형, f64 , bool , raw 포인터 . 문자열을 넘기려면 널 종료 바이트 배열을 만들어 *const u8 로 넘긴다. TAM 복사 // exit: 5\nextern \"c\" fn strlen(s: *const u8) u64\n\nfn main() i32 {\n    let s: [u8; 6] = [104, 101, 108, 108, 111, 0]   // \"hello\\0\"\n    unsafe { strlen(&s as *const [u8; 6] as *const u8) as i32 }\n} 실제 심볼 이름이 다르면 extern \"c\" fn my_name(...) = \"real_symbol\" . Windows 대상에서는 DLL 이름( \"kernel32\" )을 쓴다. 대상과 맞지 않으면 오류다. 10.6 수 연산을 직접 제어하기 ¶ 기본 산술은 오버플로 시 trap한다. 해시, 난수, 체크섬처럼 감싸는 것이 의도 일 때는 명시한다. TAM 복사 // exit: 1\nfn main() i32 {\n    let a: u32 = 4000000000\n    let b = wrapping_add(a, 500000000)         // 4_500_000_000 mod 2^32\n    if b == 205032704 { 1 } else { 0 }\n} wrapping_add , wrapping_sub , wrapping_mul 이 있다. 시프트의 양은 비트 폭 − 1로 마스크되고, as 변환은 값을 자르거나 포화시킨다( 레퍼런스 10장 ). 10.7 하드웨어 접근 ¶ 펌웨어 대상( bios , uefi , aarch64 )에서는 하드웨어 내장 함수를 쓸 수 있다. 모두 unsafe 다. 내장 함수 용도 대상 mmio_read8/16/32/64(addr) mmio_write…(addr, v) 메모리 맵 I/O (volatile) 펌웨어 port_in8/in32(port) port_out8/out32(port, v) x86 I/O 포트 bios, uefi halt() CPU 정지 펌웨어 semihost(op, arg) 호스트 호출 aarch64 MMIO는 일반 메모리가 아니다. 읽기와 쓰기 자체가 효과이므로 컴파일러가 줄이거나 없애지 않는다(volatile). 장치 레지스터는 항상 mmio_* 로만 만진다. 실제로 동작하는 예는 11장 에서 본다. 10.8 안전하게 쓰는 요령 ¶ unsafe 블록은 한 줄이나 몇 줄로 작게. 길수록 어디서 깨졌는지 모른다. 불변식을 주석으로 적는다. \"i < len임을 호출자가 보장한다.\" 경계가 필요하면 assert 로 직접 건다. 느려지는 것보다 조용히 메모리를 깨는 쪽이 훨씬 비싸다. 소유권 하나, 해제 지점 하나. 누가 free 하는지 이름만 봐도 알게 한다. unsafe 가 없는 코드는 어떤 입력에서도 메모리를 깨지 않는다. 버그가 났다면 범인은 unsafe 안에 있다. 찾을 곳이 좁다. → 11. 여러 대상으로 빌드하기", "source": "docs/book/10-unsafe-and-systems.md"}, {"key": "book-targets", "path": "docs/book/11-targets.md", "nav": "여러 대상으로 빌드하기", "title": "11. 여러 대상으로 빌드하기 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"11-여러-대상으로-빌드하기\" id=\"book-targets--11-여러-대상으로-빌드하기\">11. 여러 대상으로 빌드하기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-targets--11-여러-대상으로-빌드하기\">¶</a></h1>\n<p>같은 소스를 운영체제 위의 프로그램으로도, <strong>운영체제 없이 부팅되는 프로그램</strong>으로도 만들 수 있다. <code>--target</code>(또는 <code>Tmake.toml</code>의 <code>[build] target</code>)으로 고른다.</p>\n<table>\n<thead>\n<tr>\n<th>대상</th>\n<th>산출물</th>\n<th>용도</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>host</code></td>\n<td>실행 파일</td>\n<td>이 컴퓨터(Linux/macOS)에서 실행. 기본값</td>\n</tr>\n<tr>\n<td><code>windows</code></td>\n<td><code>.exe</code></td>\n<td>CRT/MSVC/SDK 없이 <code>kernel32</code>만 쓰는 x64 프로그램</td>\n</tr>\n<tr>\n<td><code>uefi</code></td>\n<td><code>.efi</code></td>\n<td>UEFI 펌웨어가 불러오는 응용 프로그램</td>\n</tr>\n<tr>\n<td><code>bios</code></td>\n<td><code>.img</code></td>\n<td>부트 섹터가 들어간 x86-64 디스크 이미지</td>\n</tr>\n<tr>\n<td><code>aarch64</code></td>\n<td><code>.bin</code></td>\n<td>QEMU <code>virt</code>에서 부팅되는 AArch64 <code>Image</code></td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc build main.tam --target windows -o hello.exe\n$ tamc build --target bios            # 프로젝트 모드\n</code></pre></div>\n<p><code>windows</code>, <code>uefi</code>, <code>bios</code>, <code>aarch64</code>는 <code>llc</code>(없으면 <code>clang</code>)와 <code>lld-link</code>가 필요하다(<code>tamc</code> 옆이나 <code>PATH</code>). 공식 Windows LLVM 배포본에는 <code>llc.exe</code>가 없으므로 <code>clang.exe</code>를 쓴다.</p>\n<h2 class=\"doc-heading\" data-slug=\"111-같은-코드-같은-결과\" id=\"book-targets--111-같은-코드-같은-결과\">11.1 같은 코드, 같은 결과<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-targets--111-같은-코드-같은-결과\">¶</a></h2>\n<p><code>tam.os</code>의 <code>print</code>, <code>println</code>, <code>print_int</code>, <code>exit</code>는 <strong>모든 대상에서 같은 API</strong>다. 그래서 이 프로그램은 어디서나 같은 글자를 낸다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// out: hello from tam\nuse tam.os\n\nfn main() i32 {\n    os::println(\"hello from tam\")\n    0\n}\n</code></pre></div>\n<p>호스트에서는 표준 출력, Windows에서는 <code>WriteFile</code>, UEFI에서는 콘솔, BIOS에서는 시리얼 포트(COM1), AArch64에서는 PL011 UART로 나간다. 파일 읽기, 표준 입력, 시간 같은 <strong>운영체제 기능은 <code>host</code>와 <code>windows</code>에서만</strong> 있다. 펌웨어 대상에서 쓰면 컴파일 오류다.</p>\n<h2 class=\"doc-heading\" data-slug=\"112-bios-부팅-이미지\" id=\"book-targets--112-bios-부팅-이미지\">11.2 BIOS 부팅 이미지<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-targets--112-bios-부팅-이미지\">¶</a></h2>\n<p>BIOS 대상은 부트 섹터와 프로그램을 합친 디스크 이미지를 만든다. 프로그램은 <strong>운영체제 없이</strong> 64비트 모드에서 <code>main</code>부터 시작한다. 반환값은 QEMU의 종료 장치를 통해 나간다. 페이로드는 최대 384KiB다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,BOOT=BIOS<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,boot=bios\">// out: hi from bios\nuse tam.os\n\nfn main() i32 {\n    os::println(\"hi from bios\")\n    5\n}\n// exit: 5\n</code></pre></div>\n<p>QEMU에서 실행:</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc build main.tam --target bios -o boot.img\n$ qemu-system-x86_64 -drive format=raw,file=boot.img -serial stdio \\\n      -display none -device isa-debug-exit,iobase=0xf4,iosize=0x04\n</code></pre></div>\n<p><code>isa-debug-exit</code>는 종료 코드를 <code>(값 &lt;&lt; 1) | 1</code>로 돌려주므로 <code>main</code>이 5를 반환하면 QEMU의 종료 코드는 11이다.</p>\n<h2 class=\"doc-heading\" data-slug=\"113-uefi-응용\" id=\"book-targets--113-uefi-응용\">11.3 UEFI 응용<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-targets--113-uefi-응용\">¶</a></h2>\n<p>UEFI 응용은 펌웨어가 불러 준다. <strong><code>main</code>이 반환해도 프로세스가 끝나지 않으므로 <code>os::exit</code>로 끝내야 한다.</strong></p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,BOOT=UEFI<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,boot=uefi\">// out: hi from uefi\nuse tam.os\n\nfn main() i32 {\n    os::println(\"hi from uefi\")\n    os::exit(3)\n    0\n}\n// exit: 3\n</code></pre></div>\n<p>실행하려면 <code>EFI/BOOT/BOOTX64.EFI</code>로 놓은 FAT 폴더를 QEMU에 주고 OVMF 펌웨어로 부팅한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ mkdir -p esp/EFI/BOOT\n$ tamc build main.tam --target uefi -o esp/EFI/BOOT/BOOTX64.EFI\n$ qemu-system-x86_64 -machine q35 -m 256 -display none \\\n      -drive if=pflash,format=raw,readonly=on,file=OVMF_CODE.fd \\\n      -drive format=raw,file=fat:rw:esp -serial stdio \\\n      -device isa-debug-exit,iobase=0xf4,iosize=0x04\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"114-aarch64-베어메탈\" id=\"book-targets--114-aarch64-베어메탈\">11.4 AArch64 베어메탈<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-targets--114-aarch64-베어메탈\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,BOOT=AARCH64<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,boot=aarch64\">// out: hi arm\nuse tam.os\n\nfn main() i32 {\n    os::println(\"hi arm\")\n    4\n}\n// exit: 4\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc build main.tam --target aarch64 -o kernel.bin\n$ qemu-system-aarch64 -machine virt -cpu cortex-a57 -m 256 \\\n      -display none -semihosting -kernel kernel.bin -serial stdio\n</code></pre></div>\n<p><code>main</code>의 반환값은 semihosting으로 QEMU의 종료 코드가 된다(<code>-semihosting</code> 필요).</p>\n<h2 class=\"doc-heading\" data-slug=\"115-하드웨어를-직접-만지기\" id=\"book-targets--115-하드웨어를-직접-만지기\">11.5 하드웨어를 직접 만지기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-targets--115-하드웨어를-직접-만지기\">¶</a></h2>\n<p>펌웨어 대상에서는 <a href=\"#doc-book-unsafe-and-systems\">10장</a>의 하드웨어 내장 함수를 쓴다. 이 예는 <code>tam.os</code>를 쓰지 않고 PL011 UART의 데이터 레지스터(<code>0x09000000</code>)에 바이트를 직접 쓴다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,BOOT=AARCH64<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,boot=aarch64\">// out: OK\nfn put(c: u8) {\n    unsafe { mmio_write8(150994944, c) }     // 0x09000000\n}\n\nfn main() i32 {\n    put(79)       // 'O'\n    put(75)       // 'K'\n    put(10)\n    0\n}\n</code></pre></div>\n<p>x86에서는 <code>port_out8(0x3F8, c)</code>로 COM1에 쓴다(<code>tam.serial</code>이 이를 감싸고 있다).</p>\n<h2 class=\"doc-heading\" data-slug=\"116-프로젝트에서-대상-고르기\" id=\"book-targets--116-프로젝트에서-대상-고르기\">11.6 프로젝트에서 대상 고르기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-targets--116-프로젝트에서-대상-고르기\">¶</a></h2>\n<p><code>Tmake.toml</code>에 대상별 설정을 둔다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml\">[package]\nname = \"kernel\"\nversion = \"0.1.0\"\n\n[build]\ntarget = \"bios\"\n\n[target.bios]\nout-name = \"kernel\"\n</code></pre></div>\n<p><code>tamc build</code>는 <code>build/bios/dev/kernel.img</code>를 만든다. 다른 대상은 <code>--target</code>으로 덮어쓴다. 필드 전체는 <a href=\"#doc-ref-tmake\">Tmake.toml 문서</a>를 본다.</p>\n<h2 class=\"doc-heading\" data-slug=\"117-대상별로-달라지는-것\" id=\"book-targets--117-대상별로-달라지는-것\">11.7 대상별로 달라지는 것<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-targets--117-대상별로-달라지는-것\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th style=\"text-align:center\">host</th>\n<th style=\"text-align:center\">windows</th>\n<th style=\"text-align:center\">uefi</th>\n<th style=\"text-align:center\">bios</th>\n<th style=\"text-align:center\">aarch64</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>파일, 표준 입력, 시간</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n</tr>\n<tr>\n<td><code>extern</code></td>\n<td style=\"text-align:center\">✔ (libc)</td>\n<td style=\"text-align:center\">✔ (DLL)</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n</tr>\n<tr>\n<td><code>mmio_*</code>, <code>halt</code></td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n</tr>\n<tr>\n<td><code>port_*</code></td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✘</td>\n</tr>\n<tr>\n<td>힙 할당</td>\n<td style=\"text-align:center\">libc</td>\n<td style=\"text-align:center\">Heap API</td>\n<td style=\"text-align:center\">자체 할당자</td>\n<td style=\"text-align:center\">자체 할당자</td>\n<td style=\"text-align:center\">자체 할당자</td>\n</tr>\n</tbody>\n</table>\n<p>규칙은 하나다. <strong>맞지 않는 기능을 쓰면 실행 중이 아니라 컴파일할 때, 위치와 함께 알려 준다.</strong></p>\n<p>→ <a href=\"#doc-book-project\">12. 프로젝트: 줄 합계 도구</a></p>\n", "text": "11. 여러 대상으로 빌드하기 ¶ 같은 소스를 운영체제 위의 프로그램으로도, 운영체제 없이 부팅되는 프로그램 으로도 만들 수 있다. --target (또는 Tmake.toml 의 [build] target )으로 고른다. 대상 산출물 용도 host 실행 파일 이 컴퓨터(Linux/macOS)에서 실행. 기본값 windows .exe CRT/MSVC/SDK 없이 kernel32 만 쓰는 x64 프로그램 uefi .efi UEFI 펌웨어가 불러오는 응용 프로그램 bios .img 부트 섹터가 들어간 x86-64 디스크 이미지 aarch64 .bin QEMU virt 에서 부팅되는 AArch64 Image CONSOLE 복사 $ tamc build main.tam --target windows -o hello.exe\n$ tamc build --target bios            # 프로젝트 모드 windows , uefi , bios , aarch64 는 llc (없으면 clang )와 lld-link 가 필요하다( tamc 옆이나 PATH ). 공식 Windows LLVM 배포본에는 llc.exe 가 없으므로 clang.exe 를 쓴다. 11.1 같은 코드, 같은 결과 ¶ tam.os 의 print , println , print_int , exit 는 모든 대상에서 같은 API 다. 그래서 이 프로그램은 어디서나 같은 글자를 낸다. TAM 복사 // out: hello from tam\nuse tam.os\n\nfn main() i32 {\n    os::println(\"hello from tam\")\n    0\n} 호스트에서는 표준 출력, Windows에서는 WriteFile , UEFI에서는 콘솔, BIOS에서는 시리얼 포트(COM1), AArch64에서는 PL011 UART로 나간다. 파일 읽기, 표준 입력, 시간 같은 운영체제 기능은 host 와 windows 에서만 있다. 펌웨어 대상에서 쓰면 컴파일 오류다. 11.2 BIOS 부팅 이미지 ¶ BIOS 대상은 부트 섹터와 프로그램을 합친 디스크 이미지를 만든다. 프로그램은 운영체제 없이 64비트 모드에서 main 부터 시작한다. 반환값은 QEMU의 종료 장치를 통해 나간다. 페이로드는 최대 384KiB다. TAM,BOOT=BIOS 복사 // out: hi from bios\nuse tam.os\n\nfn main() i32 {\n    os::println(\"hi from bios\")\n    5\n}\n// exit: 5 QEMU에서 실행: CONSOLE 복사 $ tamc build main.tam --target bios -o boot.img\n$ qemu-system-x86_64 -drive format=raw,file=boot.img -serial stdio \\\n      -display none -device isa-debug-exit,iobase=0xf4,iosize=0x04 isa-debug-exit 는 종료 코드를 (값 << 1) | 1 로 돌려주므로 main 이 5를 반환하면 QEMU의 종료 코드는 11이다. 11.3 UEFI 응용 ¶ UEFI 응용은 펌웨어가 불러 준다. main 이 반환해도 프로세스가 끝나지 않으므로 os::exit 로 끝내야 한다. TAM,BOOT=UEFI 복사 // out: hi from uefi\nuse tam.os\n\nfn main() i32 {\n    os::println(\"hi from uefi\")\n    os::exit(3)\n    0\n}\n// exit: 3 실행하려면 EFI/BOOT/BOOTX64.EFI 로 놓은 FAT 폴더를 QEMU에 주고 OVMF 펌웨어로 부팅한다. CONSOLE 복사 $ mkdir -p esp/EFI/BOOT\n$ tamc build main.tam --target uefi -o esp/EFI/BOOT/BOOTX64.EFI\n$ qemu-system-x86_64 -machine q35 -m 256 -display none \\\n      -drive if=pflash,format=raw,readonly=on,file=OVMF_CODE.fd \\\n      -drive format=raw,file=fat:rw:esp -serial stdio \\\n      -device isa-debug-exit,iobase=0xf4,iosize=0x04 11.4 AArch64 베어메탈 ¶ TAM,BOOT=AARCH64 복사 // out: hi arm\nuse tam.os\n\nfn main() i32 {\n    os::println(\"hi arm\")\n    4\n}\n// exit: 4 CONSOLE 복사 $ tamc build main.tam --target aarch64 -o kernel.bin\n$ qemu-system-aarch64 -machine virt -cpu cortex-a57 -m 256 \\\n      -display none -semihosting -kernel kernel.bin -serial stdio main 의 반환값은 semihosting으로 QEMU의 종료 코드가 된다( -semihosting 필요). 11.5 하드웨어를 직접 만지기 ¶ 펌웨어 대상에서는 10장 의 하드웨어 내장 함수를 쓴다. 이 예는 tam.os 를 쓰지 않고 PL011 UART의 데이터 레지스터( 0x09000000 )에 바이트를 직접 쓴다. TAM,BOOT=AARCH64 복사 // out: OK\nfn put(c: u8) {\n    unsafe { mmio_write8(150994944, c) }     // 0x09000000\n}\n\nfn main() i32 {\n    put(79)       // 'O'\n    put(75)       // 'K'\n    put(10)\n    0\n} x86에서는 port_out8(0x3F8, c) 로 COM1에 쓴다( tam.serial 이 이를 감싸고 있다). 11.6 프로젝트에서 대상 고르기 ¶ Tmake.toml 에 대상별 설정을 둔다. TOML 복사 [package]\nname = \"kernel\"\nversion = \"0.1.0\"\n\n[build]\ntarget = \"bios\"\n\n[target.bios]\nout-name = \"kernel\" tamc build 는 build/bios/dev/kernel.img 를 만든다. 다른 대상은 --target 으로 덮어쓴다. 필드 전체는 Tmake.toml 문서 를 본다. 11.7 대상별로 달라지는 것 ¶ host windows uefi bios aarch64 파일, 표준 입력, 시간 ✔ ✔ ✘ ✘ ✘ extern ✔ (libc) ✔ (DLL) ✘ ✘ ✘ mmio_* , halt ✘ ✘ ✔ ✔ ✔ port_* ✘ ✘ ✔ ✔ ✘ 힙 할당 libc Heap API 자체 할당자 자체 할당자 자체 할당자 규칙은 하나다. 맞지 않는 기능을 쓰면 실행 중이 아니라 컴파일할 때, 위치와 함께 알려 준다. → 12. 프로젝트: 줄 합계 도구", "source": "docs/book/11-targets.md"}, {"key": "book-project", "path": "docs/book/12-project.md", "nav": "프로젝트 만들기", "title": "12. 프로젝트: 줄 합계 도구 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"12-프로젝트-줄-합계-도구\" id=\"book-project--12-프로젝트-줄-합계-도구\">12. 프로젝트: 줄 합계 도구<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-project--12-프로젝트-줄-합계-도구\">¶</a></h1>\n<p>지금까지 배운 것을 모아 작은 도구를 만든다. 표준 입력에서 줄마다 정수를 읽어 합계를 낸다. 잘못된 줄은 <strong>멈추지 않고 보고</strong>하고 끝에 종료 코드로 알린다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ printf '10\\n20\\n-5\\n' | tamc run\nsum = 25\n</code></pre></div>\n<p>설계:</p>\n<ul>\n<li><code>parse-int</code> 라이브러리 패키지: 문자열을 정수로 바꾸는 <strong>안전한</strong> 함수(<code>Result</code>). <code>unsafe</code>는 여기에만 둔다.</li>\n<li><code>app</code> 실행 패키지: 입력을 읽고 합계를 낸다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"121-라이브러리-문자열-정수\" id=\"book-project--121-라이브러리-문자열-정수\">12.1 라이브러리: 문자열 → 정수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-project--121-라이브러리-문자열-정수\">¶</a></h2>\n<p>먼저 어떤 입력이 실패인지 정한다. 오류 코드는 정수로 한다.</p>\n<table>\n<thead>\n<tr>\n<th>코드</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>빈 문자열이거나 <code>-</code>만 있다</td>\n</tr>\n<tr>\n<td>2</td>\n<td>숫자가 아닌 글자가 있다</td>\n</tr>\n<tr>\n<td>3</td>\n<td>너무 길다(18자리 초과: <code>i64</code>에서 오버플로할 수 있다)</td>\n</tr>\n</tbody>\n</table>\n<p>오버플로는 trap이므로 <strong>계산 전에 길이로 막는다.</strong></p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn byte(s: str, i: u64) u8 {\n    unsafe { *(s.ptr + i) }          // 호출자가 i &lt; s.len을 보장한다\n}\n\npub fn parse_int(s: str) Result&lt;i64, i32&gt; {\n    mut i: u64 = 0\n    mut neg = false\n    if s.len &gt; 0 &amp;&amp; byte(s, 0) == 45 {      // '-'\n        neg = true\n        i = 1\n    }\n    if i == s.len { return Err(1) }\n    if s.len - i &gt; 18 { return Err(3) }\n    mut v: i64 = 0\n    while i &lt; s.len {\n        let c = byte(s, i)\n        if c &lt; 48 || c &gt; 57 { return Err(2) }\n        v = v * 10 + ((c - 48) as i64)\n        i += 1\n    }\n    if neg { Ok(0 - v) } else { Ok(v) }\n}\n\nfn main() i32 {\n    if parse_int(\"42\").unwrap() != 42 { return 1 }\n    if parse_int(\"-7\").unwrap() != 0 - 7 { return 2 }\n    if parse_int(\"\").is_ok() { return 3 }\n    if parse_int(\"-\").is_ok() { return 4 }\n    if parse_int(\"4x\").is_ok() { return 5 }\n    if parse_int(\"1234567890123456789\").is_ok() { return 6 }\n    0\n}\n</code></pre></div>\n<p><code>byte</code>는 <code>pub</code>이 아니므로 라이브러리 밖에서 쓸 수 없다. <code>unsafe</code>가 이 파일 안에 갇힌다. 경계는 <code>while i &lt; s.len</code>이 지켜 준다.</p>\n<h2 class=\"doc-heading\" data-slug=\"122-앱-읽고-더하기\" id=\"book-project--122-앱-읽고-더하기\">12.2 앱: 읽고 더하기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-project--122-앱-읽고-더하기\">¶</a></h2>\n<p><code>os::read_line()</code>은 EOF와 빈 줄을 구분하지 않으므로, <strong>빈 줄을 입력의 끝</strong>으로 삼는다.</p>\n<p>&lt;!-- project run stdin=10\\n20\\nabc\\n-5\\n exit=1 out=sum = 25 --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nparse-int = { path = \"../parse-int\" }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use tam.os\nuse parse_int\n\nfn main() i32 {\n    mut sum: i64 = 0\n    mut bad: i32 = 0\n    mut line_no: i64 = 0\n\n    while true {\n        let line = os::read_line()\n        if line.len == 0 { break }\n        line_no += 1\n        match parse_int::parse_int(as_str(&amp;line)) {\n            Ok(v) =&gt; { sum += v }\n            Err(code) =&gt; {\n                os::print(\"line \")\n                os::print_int(line_no)\n                os::print(\": error \")\n                os::print_int(code as i64)\n                os::println(\"\")\n                bad += 1\n            }\n        }\n    }\n\n    os::print(\"sum = \")\n    os::print_int(sum)\n    os::println(\"\")\n    if bad &gt; 0 { 1 } else { 0 }\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=PARSE-INT/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=parse-int/Tmake.toml\">[package]\nname = \"parse-int\"\nversion = \"0.1.0\"\nkind = \"lib\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=PARSE-INT/SRC/LIB.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=parse-int/src/lib.tam\">fn byte(s: str, i: u64) u8 {\n    unsafe { *(s.ptr + i) }\n}\n\npub fn parse_int(s: str) Result&lt;i64, i32&gt; {\n    mut i: u64 = 0\n    mut neg = false\n    if s.len &gt; 0 &amp;&amp; byte(s, 0) == 45 {\n        neg = true\n        i = 1\n    }\n    if i == s.len { return Err(1) }\n    if s.len - i &gt; 18 { return Err(3) }\n    mut v: i64 = 0\n    while i &lt; s.len {\n        let c = byte(s, i)\n        if c &lt; 48 || c &gt; 57 { return Err(2) }\n        v = v * 10 + ((c - 48) as i64)\n        i += 1\n    }\n    if neg { Ok(0 - v) } else { Ok(v) }\n}\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<p>입력 <code>10</code>, <code>20</code>, <code>abc</code>, <code>-5</code>로 실행하면:</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ printf '10\\n20\\nabc\\n-5\\n' | tamc run\nline 3: error 2\nsum = 25\n$ echo $?\n1\n</code></pre></div>\n<p>짚어 볼 점:</p>\n<ul>\n<li><strong><code>?</code> 대신 <code>match</code></strong>: <code>main</code>은 <code>i32</code>를 돌려주므로 <code>?</code>를 못 쓴다. 오류를 모으며 계속 가려고 일부러 <code>match</code>를 썼다.</li>\n<li><strong>소유권</strong>: <code>line</code>은 반복마다 새로 만들어지고 반복이 끝나면 자동으로 해제된다. <code>as_str(&amp;line)</code>은 빌림이므로 <code>line</code>을 쓰는 동안만 유효하다.</li>\n<li><strong><code>break</code></strong>: <code>while true</code>를 <code>break</code>로 나온다.</li>\n<li><strong>오류 코드</strong>: 파싱의 실패 사유는 값이다. 버그가 아닌 실패는 trap하지 않는다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"123-테스트하기\" id=\"book-project--123-테스트하기\">12.3 테스트하기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-project--123-테스트하기\">¶</a></h2>\n<p>TAM에는 내장 테스트 러너가 없다. 가장 간단한 방법은 라이브러리를 의존성으로 가져와 <strong>점검용 <code>main</code>을 가진 별도 패키지</strong>를 두는 것이다. <code>assert</code>가 실패하면 trap하고, 모두 통과하면 종료 코드 0이다. 12.1의 <code>main</code>이 그 모양이다. <code>tamc run</code>의 종료 코드를 CI가 그대로 판정에 쓸 수 있다.</p>\n<h2 class=\"doc-heading\" data-slug=\"124-확장해-보기\" id=\"book-project--124-확장해-보기\">12.4 확장해 보기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-project--124-확장해-보기\">¶</a></h2>\n<ul>\n<li>공백으로 구분된 한 줄의 여러 정수를 처리한다.</li>\n<li>파일 이름을 입력으로 받는다(<code>os::read_file</code>).</li>\n<li>오류 보고에 틀린 줄의 내용도 출력한다.</li>\n<li><code>--release</code>로 빌드해 속도를 비교한다. 이 도구는 한 바이트씩 읽으므로 입력이 크면 입력이 병목이다.</li>\n</ul>\n<p>→ <a href=\"#doc-book-generics\">13. 제네릭</a></p>\n", "text": "12. 프로젝트: 줄 합계 도구 ¶ 지금까지 배운 것을 모아 작은 도구를 만든다. 표준 입력에서 줄마다 정수를 읽어 합계를 낸다. 잘못된 줄은 멈추지 않고 보고 하고 끝에 종료 코드로 알린다. CONSOLE 복사 $ printf '10\\n20\\n-5\\n' | tamc run\nsum = 25 설계: parse-int 라이브러리 패키지: 문자열을 정수로 바꾸는 안전한 함수( Result ). unsafe 는 여기에만 둔다. app 실행 패키지: 입력을 읽고 합계를 낸다. 12.1 라이브러리: 문자열 → 정수 ¶ 먼저 어떤 입력이 실패인지 정한다. 오류 코드는 정수로 한다. 코드 의미 1 빈 문자열이거나 - 만 있다 2 숫자가 아닌 글자가 있다 3 너무 길다(18자리 초과: i64 에서 오버플로할 수 있다) 오버플로는 trap이므로 계산 전에 길이로 막는다. TAM 복사 // exit: 0\nfn byte(s: str, i: u64) u8 {\n    unsafe { *(s.ptr + i) }          // 호출자가 i < s.len을 보장한다\n}\n\npub fn parse_int(s: str) Result<i64, i32> {\n    mut i: u64 = 0\n    mut neg = false\n    if s.len > 0 && byte(s, 0) == 45 {      // '-'\n        neg = true\n        i = 1\n    }\n    if i == s.len { return Err(1) }\n    if s.len - i > 18 { return Err(3) }\n    mut v: i64 = 0\n    while i < s.len {\n        let c = byte(s, i)\n        if c < 48 || c > 57 { return Err(2) }\n        v = v * 10 + ((c - 48) as i64)\n        i += 1\n    }\n    if neg { Ok(0 - v) } else { Ok(v) }\n}\n\nfn main() i32 {\n    if parse_int(\"42\").unwrap() != 42 { return 1 }\n    if parse_int(\"-7\").unwrap() != 0 - 7 { return 2 }\n    if parse_int(\"\").is_ok() { return 3 }\n    if parse_int(\"-\").is_ok() { return 4 }\n    if parse_int(\"4x\").is_ok() { return 5 }\n    if parse_int(\"1234567890123456789\").is_ok() { return 6 }\n    0\n} byte 는 pub 이 아니므로 라이브러리 밖에서 쓸 수 없다. unsafe 가 이 파일 안에 갇힌다. 경계는 while i < s.len 이 지켜 준다. 12.2 앱: 읽고 더하기 ¶ os::read_line() 은 EOF와 빈 줄을 구분하지 않으므로, 빈 줄을 입력의 끝 으로 삼는다. <!-- project run stdin=10\\n20\\nabc\\n-5\\n exit=1 out=sum = 25 --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nparse-int = { path = \"../parse-int\" } TAM,FILE=APP/SRC/MAIN.TAM 복사 use tam.os\nuse parse_int\n\nfn main() i32 {\n    mut sum: i64 = 0\n    mut bad: i32 = 0\n    mut line_no: i64 = 0\n\n    while true {\n        let line = os::read_line()\n        if line.len == 0 { break }\n        line_no += 1\n        match parse_int::parse_int(as_str(&line)) {\n            Ok(v) => { sum += v }\n            Err(code) => {\n                os::print(\"line \")\n                os::print_int(line_no)\n                os::print(\": error \")\n                os::print_int(code as i64)\n                os::println(\"\")\n                bad += 1\n            }\n        }\n    }\n\n    os::print(\"sum = \")\n    os::print_int(sum)\n    os::println(\"\")\n    if bad > 0 { 1 } else { 0 }\n} TOML,FILE=PARSE-INT/TMAKE.TOML 복사 [package]\nname = \"parse-int\"\nversion = \"0.1.0\"\nkind = \"lib\" TAM,FILE=PARSE-INT/SRC/LIB.TAM 복사 fn byte(s: str, i: u64) u8 {\n    unsafe { *(s.ptr + i) }\n}\n\npub fn parse_int(s: str) Result<i64, i32> {\n    mut i: u64 = 0\n    mut neg = false\n    if s.len > 0 && byte(s, 0) == 45 {\n        neg = true\n        i = 1\n    }\n    if i == s.len { return Err(1) }\n    if s.len - i > 18 { return Err(3) }\n    mut v: i64 = 0\n    while i < s.len {\n        let c = byte(s, i)\n        if c < 48 || c > 57 { return Err(2) }\n        v = v * 10 + ((c - 48) as i64)\n        i += 1\n    }\n    if neg { Ok(0 - v) } else { Ok(v) }\n} <!-- /project --> 입력 10 , 20 , abc , -5 로 실행하면: CONSOLE 복사 $ printf '10\\n20\\nabc\\n-5\\n' | tamc run\nline 3: error 2\nsum = 25\n$ echo $?\n1 짚어 볼 점: ? 대신 match : main 은 i32 를 돌려주므로 ? 를 못 쓴다. 오류를 모으며 계속 가려고 일부러 match 를 썼다. 소유권 : line 은 반복마다 새로 만들어지고 반복이 끝나면 자동으로 해제된다. as_str(&line) 은 빌림이므로 line 을 쓰는 동안만 유효하다. break : while true 를 break 로 나온다. 오류 코드 : 파싱의 실패 사유는 값이다. 버그가 아닌 실패는 trap하지 않는다. 12.3 테스트하기 ¶ TAM에는 내장 테스트 러너가 없다. 가장 간단한 방법은 라이브러리를 의존성으로 가져와 점검용 main 을 가진 별도 패키지 를 두는 것이다. assert 가 실패하면 trap하고, 모두 통과하면 종료 코드 0이다. 12.1의 main 이 그 모양이다. tamc run 의 종료 코드를 CI가 그대로 판정에 쓸 수 있다. 12.4 확장해 보기 ¶ 공백으로 구분된 한 줄의 여러 정수를 처리한다. 파일 이름을 입력으로 받는다( os::read_file ). 오류 보고에 틀린 줄의 내용도 출력한다. --release 로 빌드해 속도를 비교한다. 이 도구는 한 바이트씩 읽으므로 입력이 크면 입력이 병목이다. → 13. 제네릭", "source": "docs/book/12-project.md"}, {"key": "book-generics", "path": "docs/book/13-generics.md", "nav": "제네릭", "title": "13. 제네릭 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"13-제네릭\" id=\"book-generics--13-제네릭\">13. 제네릭<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-generics--13-제네릭\">¶</a></h1>\n<p>같은 일을 여러 타입에 하고 싶을 때가 있다. 두 값 중 큰 것을 고르는 함수를 <code>i32</code>, <code>i64</code>, <code>f64</code>마다 따로 쓰는 대신, <strong>타입을 매개변수로</strong> 받는 코드를 한 번만 쓴다.</p>\n<p>TAM의 제네릭은 C++의 템플릿에서 영감을 받았다. 쓰이는 타입마다 컴파일러가 코드를 따로 만든다(<strong>단형화</strong>). 그래서 실행 시간 비용이 없고, 타입에 대해 선언할 것이 적다. 다만 <code>template &lt;typename T&gt;</code> 같은 별도 문법 없이 이름 뒤에 <code>&lt;T&gt;</code>를 붙이는 TAM의 문법을 쓴다.</p>\n<h2 class=\"doc-heading\" data-slug=\"131-제네릭-함수\" id=\"book-generics--131-제네릭-함수\">13.1 제네릭 함수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-generics--131-제네릭-함수\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nfn max&lt;T&gt;(a: T, b: T) T {\n    if a &gt; b { a } else { b }\n}\n\nfn main() i32 {\n    let a = max(3, 9)                // T = i32\n    let b: i64 = max(5, 7)           // T = i64\n    let c = max&lt;f64&gt;(1.5, 0.5)       // T를 직접 적었다\n    if c != 1.5 { return 100 }\n    a\n}\n</code></pre></div>\n<p><code>fn max&lt;T&gt;(...)</code>의 <code>&lt;T&gt;</code>가 타입 매개변수 선언이다. <code>T</code>는 매개변수와 반환 타입, 본문 안에서 타입으로 쓴다.</p>\n<h3 class=\"doc-heading\" data-slug=\"타입-인자는-어떻게-정해지나\" id=\"book-generics--타입-인자는-어떻게-정해지나\">타입 인자는 어떻게 정해지나<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-generics--타입-인자는-어떻게-정해지나\">¶</a></h3>\n<p>호출할 때 컴파일러가 <code>T</code>를 다음 순서로 정한다.</p>\n<ol>\n<li><strong>직접 적은 것</strong>: <code>max&lt;f64&gt;(..)</code>.</li>\n<li><strong>인자의 타입</strong>: <code>max(x, y)</code>에서 <code>x</code>의 타입.</li>\n<li><strong>기대되는 반환 타입</strong>: <code>let z: u8 = zero()</code>처럼 결과가 놓일 자리.</li>\n<li><strong>정수 리터럴만 있으면 <code>i32</code></strong>: <code>max(3, 9)</code>.</li>\n</ol>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nfn zero&lt;T&gt;() T { 0 }\n\nfn first&lt;T&gt;(a: &amp;[T]) T { a[0] }\n\nfn main() i32 {\n    let a: i32 = zero()           // 반환 자리에서 T = i32\n    let b = zero&lt;i64&gt;()           // 직접 적음\n    let arr = [4, 5, 6]\n    let c = first(&amp;arr)           // &amp;[i32; 3]에서 T = i32\n    a + b as i32 + c + 5\n}\n</code></pre></div>\n<p>어느 것으로도 정해지지 않으면 오류다. 이때는 직접 적는다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot infer type parameter `T` of `zero`\nfn zero&lt;T&gt;() T { 0 }\n\nfn main() i32 {\n    let x = zero()\n    0\n}\n</code></pre></div>\n<p>타입 매개변수는 여러 개일 수 있다: <code>fn pick&lt;A, B&gt;(a: A, b: B) A</code>.</p>\n<h3 class=\"doc-heading\" data-slug=\"비교-연산자와-구별\" id=\"book-generics--비교-연산자와-구별\">비교 연산자와 구별<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-generics--비교-연산자와-구별\">¶</a></h3>\n<p><code>f&lt;i32&gt;(x)</code>와 <code>a &lt; b</code>는 모양이 비슷하다. 컴파일러는 <code>&lt;</code>로 시작해 <code>&gt;</code>로 닫히고 <strong>그 뒤에 <code>(</code>, <code>::</code>, <code>{</code>가 오면</strong> 타입 인자로 읽고, 아니면 비교 연산자로 읽는다. <code>if a &lt; b { ... }</code>는 그대로 비교다.</p>\n<h2 class=\"doc-heading\" data-slug=\"132-제네릭-구조체\" id=\"book-generics--132-제네릭-구조체\">13.2 제네릭 구조체<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-generics--132-제네릭-구조체\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nstruct Pair&lt;A, B&gt; {\n    first: A,\n    second: B,\n}\n\nimpl Pair&lt;A, B&gt; {\n    fn new(a: A, b: B) Self {\n        Pair { first: a, second: b }\n    }\n\n    fn swap(self) Pair&lt;B, A&gt; {\n        Pair { first: self.second, second: self.first }\n    }\n\n    fn get_first(&amp;self) A { self.first }\n}\n\nfn main() i32 {\n    let p = Pair::new(2, 5)             // Pair&lt;i32, i32&gt;\n    let q: Pair&lt;i32, i32&gt; = p.swap()\n    let r = Pair&lt;i32, i32&gt; { first: 4, second: 1 }\n    q.first + r.get_first() - 2         // 5 + 4 - 2\n}\n</code></pre></div>\n<ul>\n<li><strong>타입으로 쓸 때는 인자를 항상 준다</strong>: <code>Pair&lt;i32, f64&gt;</code>. 인자 없이 <code>Pair</code>만 쓰면 오류다.</li>\n<li><strong>구조체 리터럴</strong>은 필드 값에서 인자를 추론한다: <code>Pair { first: 1, second: 2.5 }</code>. 직접 적을 수도 있다: <code>Pair&lt;i32, f64&gt; { ... }</code>.</li>\n<li><strong>연관 함수</strong>는 <code>Pair::new(..)</code>로 추론하거나 <code>Pair&lt;i32, f64&gt;::new(..)</code>로 적는다.</li>\n<li><code>impl Pair&lt;A, B&gt;</code>에서 <code>A</code>, <code>B</code>는 그 <code>impl</code> 안에서 쓰는 이름이다. 개수만 맞으면 된다.</li>\n<li><code>impl</code> 안의 <code>Self</code>는 <code>Pair&lt;A, B&gt;</code>다.</li>\n<li><code>Result&lt;T, E&gt;</code>, <code>Option&lt;T&gt;</code>도 같은 방식의 제네릭 타입이다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 4\nstruct Wrapper&lt;T&gt; {\n    v: T,\n}\n\nimpl Wrapper&lt;T&gt; {\n    fn new(v: T) Self { Wrapper { v: v } }\n    fn get(&amp;self) &amp;T { &amp;self.v }\n}\n\nfn nest&lt;T&gt;(x: T) Wrapper&lt;Wrapper&lt;T&gt;&gt; {\n    Wrapper::new(Wrapper::new(x))\n}\n\nfn main() i32 {\n    let w = nest(string_from(\"abcd\"))   // Wrapper&lt;Wrapper&lt;String&gt;&gt;\n    let inner = w.get()\n    let s = inner.get()\n    s.len as i32                        // String은 자동으로 해제된다\n}\n</code></pre></div>\n<p><code>String</code>을 담은 인스턴스도 소유권 규칙은 그대로다. 안쪽 <code>String</code>은 <code>w</code>가 스코프를 벗어날 때 해제된다.</p>\n<h2 class=\"doc-heading\" data-slug=\"133-단형화-컴파일러가-하는-일\" id=\"book-generics--133-단형화-컴파일러가-하는-일\">13.3 단형화: 컴파일러가 하는 일<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-generics--133-단형화-컴파일러가-하는-일\">¶</a></h2>\n<p><code>max(3, 9)</code>와 <code>max&lt;f64&gt;(1.5, 0.5)</code>를 쓰면 컴파일러는 <strong>함수를 두 벌</strong> 만든다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>fn max&lt;i32&gt;(a: i32, b: i32) i32 { ... }\nfn max&lt;f64&gt;(a: f64, b: f64) f64 { ... }\n</code></pre></div>\n<p>타입마다 따로 컴파일되므로 <code>a &gt; b</code>가 정수 비교인지 실수 비교인지 컴파일 시간에 이미 정해져 있다. 호출 때 타입을 고르는 비용은 없다. 대가는 코드 크기다. 많은 타입으로 쓰면 코드가 그만큼 커진다.</p>\n<p>같은 인스턴스는 한 번만 만든다(<code>max(1, 2)</code>를 백 번 불러도 <code>max&lt;i32&gt;</code>는 하나). 구조체도 마찬가지로 <code>Pair&lt;i32,i32&gt;</code>는 하나의 타입이다. 오류 메시지에도 <code>Pair&lt;i32,i32&gt;</code>라는 이름이 그대로 나온다.</p>\n<h2 class=\"doc-heading\" data-slug=\"134-제네릭은-쓸-때-검사된다\" id=\"book-generics--134-제네릭은-쓸-때-검사된다\">13.4 제네릭은 쓸 때 검사된다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-generics--134-제네릭은-쓸-때-검사된다\">¶</a></h2>\n<p>TAM에는 트레이트나 \"<code>T</code>는 <code>&gt;</code>를 지원해야 한다\" 같은 선언이 <strong>없다</strong>. 대신 제네릭 함수의 본문은 <strong>인스턴스가 만들어질 때</strong> 실제 타입으로 검사된다. <code>a &gt; b</code>를 구조체에 쓰면 그 호출이 오류를 낸다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: operator `&gt;` cannot be applied to `P`\nstruct P { x: i32 }\n\nfn max&lt;T&gt;(a: T, b: T) T {\n    if a &gt; b { a } else { b }\n}\n\nfn main() i32 {\n    let a = P { x: 1 }\n    let b = P { x: 2 }\n    max(a, b).x\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">error: operator `&gt;` cannot be applied to `P`\n  --&gt; ex.tam:4:8\n   |\n 4 |     if a &gt; b { a } else { b }\n   |        ^ unsupported operand type\n...\n10 |     max(a, b).x\n   |     --------- while instantiating `max&lt;P&gt;`\n</code></pre></div>\n<p>오류가 <strong>두 곳</strong>을 가리킨다. 위쪽은 문제가 난 코드(제네릭 본문), 아래쪽(<code>while instantiating</code>)은 그 인스턴스를 만든 호출이다. 보통은 호출하는 타입이 틀렸거나, 제네릭 함수가 가정하는 연산이 그 타입에 없다는 뜻이다.</p>\n<p>주의할 점은, <strong>한 번도 쓰이지 않은 제네릭은 검사되지 않는다</strong>는 것이다(문법만 검사된다). 제네릭 코드를 쓸 예정이라면 작은 호출 한두 개로 확인해 두자.</p>\n<h2 class=\"doc-heading\" data-slug=\"135-예-직접-만드는-stack\" id=\"book-generics--135-예-직접-만드는-stack\">13.5 예: 직접 만드는 <code>Stack&lt;T&gt;</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-generics--135-예-직접-만드는-stack\">¶</a></h2>\n<p>제네릭과 <a href=\"#doc-book-unsafe-and-systems\">10장</a>의 <code>unsafe</code>를 합치면 자료구조를 만들 수 있다. 경계 검사를 직접 넣어 <code>unsafe</code>를 안쪽에 가둔다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 37\nstruct Stack&lt;T&gt; {\n    ptr: *mut T,\n    len: u64,\n    cap: u64,\n}\n\nimpl Stack&lt;T&gt; {\n    fn new(cap: u64) Self {\n        let bytes = cap * 8                    // 원소 하나는 최대 8바이트로 가정\n        Stack { ptr: unsafe { alloc(bytes) } as *mut T, len: 0, cap: cap }\n    }\n\n    fn push(&amp;mut self, v: T) {\n        assert(self.len &lt; self.cap)            // 용량 검사는 우리 책임\n        unsafe { *(self.ptr + self.len) = v }\n        self.len += 1\n    }\n\n    fn pop(&amp;mut self) Option&lt;T&gt; {\n        if self.len == 0 { return None }\n        self.len -= 1\n        Some(unsafe { *(self.ptr + self.len) })\n    }\n\n    fn release(self) {\n        unsafe { free(self.ptr as *mut u8) }\n    }\n}\n\nfn main() i32 {\n    mut a: Stack&lt;i32&gt; = Stack::new(4)\n    a.push(10)\n    a.push(20)\n    a.push(30)\n    let top = a.pop().unwrap_or(0)             // 30\n    let second = a.pop().unwrap_or(0)          // 20\n    a.release()\n\n    mut b: Stack&lt;i64&gt; = Stack::new(4)          // 같은 코드가 i64로 다시 만들어진다\n    b.push(7)\n    let c = b.pop().unwrap_or(0) as i32\n    b.release()\n    top + second - 30 + c + 10                 // 30 + 20 - 30 + 7 + 10\n}\n</code></pre></div>\n<p><code>Stack&lt;i32&gt;</code>와 <code>Stack&lt;i64&gt;</code>는 <strong>서로 다른 타입</strong>이다. <code>a</code>에 <code>i64</code>를 넣으려 하면 컴파일 오류다.</p>\n<h2 class=\"doc-heading\" data-slug=\"136-다른-모듈의-제네릭\" id=\"book-generics--136-다른-모듈의-제네릭\">13.6 다른 모듈의 제네릭<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-generics--136-다른-모듈의-제네릭\">¶</a></h2>\n<p>제네릭 함수와 구조체도 <code>pub</code>을 붙이면 다른 모듈(패키지)에서 쓴다. 구조체는 <code>모듈::Stack&lt;i32&gt;</code>, 연관 함수는 <code>모듈::Stack&lt;i32&gt;::new(4)</code>다.</p>\n<p>&lt;!-- project run exit=7 --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nutil = { path = \"../util\" }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use util\n\nfn main() i32 {\n    let p = util::Pair&lt;i32, i32&gt; { first: 3, second: 4 }\n    util::sum(&amp;p)\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=UTIL/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=util/Tmake.toml\">[package]\nname = \"util\"\nversion = \"0.1.0\"\nkind = \"lib\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=UTIL/SRC/LIB.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=util/src/lib.tam\">pub struct Pair&lt;A, B&gt; {\n    first: A,\n    second: B,\n}\n\npub fn sum&lt;T&gt;(p: &amp;Pair&lt;T, T&gt;) T {\n    p.first + p.second\n}\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<h2 class=\"doc-heading\" data-slug=\"137-한계\" id=\"book-generics--137-한계\">13.7 한계<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-generics--137-한계\">¶</a></h2>\n<p>TAM의 제네릭은 의도적으로 작다.</p>\n<ul>\n<li><strong>트레이트(경계)가 없다.</strong> 타입에 대한 요구는 인스턴스 오류로만 알려진다.</li>\n<li><strong>메서드가 자기만의 타입 매개변수를 가질 수 없다.</strong> <code>impl Pair&lt;A, B&gt;</code>의 <code>A</code>, <code>B</code>만 쓴다. 메서드에 별도의 타입이 필요하면 일반 제네릭 함수로 쓴다.</li>\n<li><strong>상수 제네릭</strong>(<code>[T; N]</code>의 <code>N</code>을 매개변수로)은 없다.</li>\n<li>제네릭 <code>main</code>과 <code>extern</code>은 불가능하다.</li>\n<li>자기 자신을 점점 큰 타입으로 인스턴스화하는 재귀는 <code>generic instantiation limit exceeded</code>로 멈춘다(깊이 64, 인스턴스 5000개).</li>\n<li>힙을 가진 필드를 <code>self.field</code>로 꺼내 이동할 수 없다는 규칙은 제네릭에도 같다. <code>T</code>가 <code>String</code>일 때 <code>fn into_inner(self) T { self.v }</code>는 그 인스턴스에서 오류다. 참조를 돌려주는 <code>get(&amp;self) &amp;T</code>를 쓴다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"c-템플릿과-비교\" id=\"book-generics--c-템플릿과-비교\">C++ 템플릿과 비교<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-generics--c-템플릿과-비교\">¶</a></h3>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>C++ 템플릿</th>\n<th>TAM 제네릭</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>구현</td>\n<td>단형화</td>\n<td>단형화</td>\n</tr>\n<tr>\n<td>검사 시점</td>\n<td>인스턴스화 때</td>\n<td>인스턴스화 때</td>\n</tr>\n<tr>\n<td>선언</td>\n<td><code>template &lt;typename T&gt;</code></td>\n<td><code>fn f&lt;T&gt;</code>, <code>struct S&lt;T&gt;</code></td>\n</tr>\n<tr>\n<td>제약</td>\n<td>concepts(C++20)</td>\n<td>없음(인스턴스 오류)</td>\n</tr>\n<tr>\n<td>오류 메시지</td>\n<td>길다</td>\n<td>제네릭 본문 + 인스턴스를 만든 호출 두 곳</td>\n</tr>\n<tr>\n<td>특수화</td>\n<td>있다</td>\n<td>없다</td>\n</tr>\n<tr>\n<td>인스턴스 한도</td>\n<td>컴파일러마다 다름</td>\n<td>깊이 64, 5000개</td>\n</tr>\n</tbody>\n</table>\n<h2 class=\"doc-heading\" data-slug=\"138-연습\" id=\"book-generics--138-연습\">13.8 연습<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-generics--138-연습\">¶</a></h2>\n<ol>\n<li><code>swap&lt;T&gt;(a: &amp;mut T, b: &amp;mut T)</code>를 만들어라. 힌트: 값을 꺼낼 때 <code>let t = *a</code>.</li>\n<li><code>Cell&lt;T&gt;</code>에 <code>set(&amp;mut self, v: T)</code>와 <code>get(&amp;self) T</code>를 달아라.</li>\n<li><code>Stack&lt;T&gt;</code>에 <code>len(&amp;self) u64</code>를 추가하라.</li>\n</ol>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 21\nfn swap&lt;T&gt;(a: &amp;mut T, b: &amp;mut T) {\n    let t = *a\n    *a = *b\n    *b = t\n}\n\nstruct Cell&lt;T&gt; { v: T }\n\nimpl Cell&lt;T&gt; {\n    fn new(v: T) Self { Cell { v: v } }\n    fn get(&amp;self) T { self.v }\n    fn set(&amp;mut self, v: T) { self.v = v }\n}\n\nfn main() i32 {\n    mut x = 1\n    mut y = 2\n    swap(&amp;mut x, &amp;mut y)                 // x = 2, y = 1\n    mut c = Cell::new(x)\n    let v = c.get() * 10\n    c.set(v)                             // 20\n    c.get() + y                          // 21\n}\n</code></pre></div>\n<p>→ <a href=\"#doc-book-practice\">14. 더 나아가기</a></p>\n", "text": "13. 제네릭 ¶ 같은 일을 여러 타입에 하고 싶을 때가 있다. 두 값 중 큰 것을 고르는 함수를 i32 , i64 , f64 마다 따로 쓰는 대신, 타입을 매개변수로 받는 코드를 한 번만 쓴다. TAM의 제네릭은 C++의 템플릿에서 영감을 받았다. 쓰이는 타입마다 컴파일러가 코드를 따로 만든다( 단형화 ). 그래서 실행 시간 비용이 없고, 타입에 대해 선언할 것이 적다. 다만 template <typename T> 같은 별도 문법 없이 이름 뒤에 <T> 를 붙이는 TAM의 문법을 쓴다. 13.1 제네릭 함수 ¶ TAM 복사 // exit: 9\nfn max<T>(a: T, b: T) T {\n    if a > b { a } else { b }\n}\n\nfn main() i32 {\n    let a = max(3, 9)                // T = i32\n    let b: i64 = max(5, 7)           // T = i64\n    let c = max<f64>(1.5, 0.5)       // T를 직접 적었다\n    if c != 1.5 { return 100 }\n    a\n} fn max<T>(...) 의 <T> 가 타입 매개변수 선언이다. T 는 매개변수와 반환 타입, 본문 안에서 타입으로 쓴다. 타입 인자는 어떻게 정해지나 ¶ 호출할 때 컴파일러가 T 를 다음 순서로 정한다. 직접 적은 것 : max<f64>(..) . 인자의 타입 : max(x, y) 에서 x 의 타입. 기대되는 반환 타입 : let z: u8 = zero() 처럼 결과가 놓일 자리. 정수 리터럴만 있으면 i32 : max(3, 9) . TAM 복사 // exit: 9\nfn zero<T>() T { 0 }\n\nfn first<T>(a: &[T]) T { a[0] }\n\nfn main() i32 {\n    let a: i32 = zero()           // 반환 자리에서 T = i32\n    let b = zero<i64>()           // 직접 적음\n    let arr = [4, 5, 6]\n    let c = first(&arr)           // &[i32; 3]에서 T = i32\n    a + b as i32 + c + 5\n} 어느 것으로도 정해지지 않으면 오류다. 이때는 직접 적는다. TAM,ERROR 복사 // error: cannot infer type parameter `T` of `zero`\nfn zero<T>() T { 0 }\n\nfn main() i32 {\n    let x = zero()\n    0\n} 타입 매개변수는 여러 개일 수 있다: fn pick<A, B>(a: A, b: B) A . 비교 연산자와 구별 ¶ f<i32>(x) 와 a < b 는 모양이 비슷하다. 컴파일러는 < 로 시작해 > 로 닫히고 그 뒤에 ( , :: , { 가 오면 타입 인자로 읽고, 아니면 비교 연산자로 읽는다. if a < b { ... } 는 그대로 비교다. 13.2 제네릭 구조체 ¶ TAM 복사 // exit: 7\nstruct Pair<A, B> {\n    first: A,\n    second: B,\n}\n\nimpl Pair<A, B> {\n    fn new(a: A, b: B) Self {\n        Pair { first: a, second: b }\n    }\n\n    fn swap(self) Pair<B, A> {\n        Pair { first: self.second, second: self.first }\n    }\n\n    fn get_first(&self) A { self.first }\n}\n\nfn main() i32 {\n    let p = Pair::new(2, 5)             // Pair<i32, i32>\n    let q: Pair<i32, i32> = p.swap()\n    let r = Pair<i32, i32> { first: 4, second: 1 }\n    q.first + r.get_first() - 2         // 5 + 4 - 2\n} 타입으로 쓸 때는 인자를 항상 준다 : Pair<i32, f64> . 인자 없이 Pair 만 쓰면 오류다. 구조체 리터럴 은 필드 값에서 인자를 추론한다: Pair { first: 1, second: 2.5 } . 직접 적을 수도 있다: Pair<i32, f64> { ... } . 연관 함수 는 Pair::new(..) 로 추론하거나 Pair<i32, f64>::new(..) 로 적는다. impl Pair<A, B> 에서 A , B 는 그 impl 안에서 쓰는 이름이다. 개수만 맞으면 된다. impl 안의 Self 는 Pair<A, B> 다. Result<T, E> , Option<T> 도 같은 방식의 제네릭 타입이다. TAM 복사 // exit: 4\nstruct Wrapper<T> {\n    v: T,\n}\n\nimpl Wrapper<T> {\n    fn new(v: T) Self { Wrapper { v: v } }\n    fn get(&self) &T { &self.v }\n}\n\nfn nest<T>(x: T) Wrapper<Wrapper<T>> {\n    Wrapper::new(Wrapper::new(x))\n}\n\nfn main() i32 {\n    let w = nest(string_from(\"abcd\"))   // Wrapper<Wrapper<String>>\n    let inner = w.get()\n    let s = inner.get()\n    s.len as i32                        // String은 자동으로 해제된다\n} String 을 담은 인스턴스도 소유권 규칙은 그대로다. 안쪽 String 은 w 가 스코프를 벗어날 때 해제된다. 13.3 단형화: 컴파일러가 하는 일 ¶ max(3, 9) 와 max<f64>(1.5, 0.5) 를 쓰면 컴파일러는 함수를 두 벌 만든다. CODE 복사 fn max<i32>(a: i32, b: i32) i32 { ... }\nfn max<f64>(a: f64, b: f64) f64 { ... } 타입마다 따로 컴파일되므로 a > b 가 정수 비교인지 실수 비교인지 컴파일 시간에 이미 정해져 있다. 호출 때 타입을 고르는 비용은 없다. 대가는 코드 크기다. 많은 타입으로 쓰면 코드가 그만큼 커진다. 같은 인스턴스는 한 번만 만든다( max(1, 2) 를 백 번 불러도 max<i32> 는 하나). 구조체도 마찬가지로 Pair<i32,i32> 는 하나의 타입이다. 오류 메시지에도 Pair<i32,i32> 라는 이름이 그대로 나온다. 13.4 제네릭은 쓸 때 검사된다 ¶ TAM에는 트레이트나 \" T 는 > 를 지원해야 한다\" 같은 선언이 없다 . 대신 제네릭 함수의 본문은 인스턴스가 만들어질 때 실제 타입으로 검사된다. a > b 를 구조체에 쓰면 그 호출이 오류를 낸다. TAM,ERROR 복사 // error: operator `>` cannot be applied to `P`\nstruct P { x: i32 }\n\nfn max<T>(a: T, b: T) T {\n    if a > b { a } else { b }\n}\n\nfn main() i32 {\n    let a = P { x: 1 }\n    let b = P { x: 2 }\n    max(a, b).x\n} CONSOLE 복사 error: operator `>` cannot be applied to `P`\n  --> ex.tam:4:8\n   |\n 4 |     if a > b { a } else { b }\n   |        ^ unsupported operand type\n...\n10 |     max(a, b).x\n   |     --------- while instantiating `max<P>` 오류가 두 곳 을 가리킨다. 위쪽은 문제가 난 코드(제네릭 본문), 아래쪽( while instantiating )은 그 인스턴스를 만든 호출이다. 보통은 호출하는 타입이 틀렸거나, 제네릭 함수가 가정하는 연산이 그 타입에 없다는 뜻이다. 주의할 점은, 한 번도 쓰이지 않은 제네릭은 검사되지 않는다 는 것이다(문법만 검사된다). 제네릭 코드를 쓸 예정이라면 작은 호출 한두 개로 확인해 두자. 13.5 예: 직접 만드는 Stack<T> ¶ 제네릭과 10장 의 unsafe 를 합치면 자료구조를 만들 수 있다. 경계 검사를 직접 넣어 unsafe 를 안쪽에 가둔다. TAM 복사 // exit: 37\nstruct Stack<T> {\n    ptr: *mut T,\n    len: u64,\n    cap: u64,\n}\n\nimpl Stack<T> {\n    fn new(cap: u64) Self {\n        let bytes = cap * 8                    // 원소 하나는 최대 8바이트로 가정\n        Stack { ptr: unsafe { alloc(bytes) } as *mut T, len: 0, cap: cap }\n    }\n\n    fn push(&mut self, v: T) {\n        assert(self.len < self.cap)            // 용량 검사는 우리 책임\n        unsafe { *(self.ptr + self.len) = v }\n        self.len += 1\n    }\n\n    fn pop(&mut self) Option<T> {\n        if self.len == 0 { return None }\n        self.len -= 1\n        Some(unsafe { *(self.ptr + self.len) })\n    }\n\n    fn release(self) {\n        unsafe { free(self.ptr as *mut u8) }\n    }\n}\n\nfn main() i32 {\n    mut a: Stack<i32> = Stack::new(4)\n    a.push(10)\n    a.push(20)\n    a.push(30)\n    let top = a.pop().unwrap_or(0)             // 30\n    let second = a.pop().unwrap_or(0)          // 20\n    a.release()\n\n    mut b: Stack<i64> = Stack::new(4)          // 같은 코드가 i64로 다시 만들어진다\n    b.push(7)\n    let c = b.pop().unwrap_or(0) as i32\n    b.release()\n    top + second - 30 + c + 10                 // 30 + 20 - 30 + 7 + 10\n} Stack<i32> 와 Stack<i64> 는 서로 다른 타입 이다. a 에 i64 를 넣으려 하면 컴파일 오류다. 13.6 다른 모듈의 제네릭 ¶ 제네릭 함수와 구조체도 pub 을 붙이면 다른 모듈(패키지)에서 쓴다. 구조체는 모듈::Stack<i32> , 연관 함수는 모듈::Stack<i32>::new(4) 다. <!-- project run exit=7 --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nutil = { path = \"../util\" } TAM,FILE=APP/SRC/MAIN.TAM 복사 use util\n\nfn main() i32 {\n    let p = util::Pair<i32, i32> { first: 3, second: 4 }\n    util::sum(&p)\n} TOML,FILE=UTIL/TMAKE.TOML 복사 [package]\nname = \"util\"\nversion = \"0.1.0\"\nkind = \"lib\" TAM,FILE=UTIL/SRC/LIB.TAM 복사 pub struct Pair<A, B> {\n    first: A,\n    second: B,\n}\n\npub fn sum<T>(p: &Pair<T, T>) T {\n    p.first + p.second\n} <!-- /project --> 13.7 한계 ¶ TAM의 제네릭은 의도적으로 작다. 트레이트(경계)가 없다. 타입에 대한 요구는 인스턴스 오류로만 알려진다. 메서드가 자기만의 타입 매개변수를 가질 수 없다. impl Pair<A, B> 의 A , B 만 쓴다. 메서드에 별도의 타입이 필요하면 일반 제네릭 함수로 쓴다. 상수 제네릭 ( [T; N] 의 N 을 매개변수로)은 없다. 제네릭 main 과 extern 은 불가능하다. 자기 자신을 점점 큰 타입으로 인스턴스화하는 재귀는 generic instantiation limit exceeded 로 멈춘다(깊이 64, 인스턴스 5000개). 힙을 가진 필드를 self.field 로 꺼내 이동할 수 없다는 규칙은 제네릭에도 같다. T 가 String 일 때 fn into_inner(self) T { self.v } 는 그 인스턴스에서 오류다. 참조를 돌려주는 get(&self) &T 를 쓴다. C++ 템플릿과 비교 ¶ C++ 템플릿 TAM 제네릭 구현 단형화 단형화 검사 시점 인스턴스화 때 인스턴스화 때 선언 template <typename T> fn f<T> , struct S<T> 제약 concepts(C++20) 없음(인스턴스 오류) 오류 메시지 길다 제네릭 본문 + 인스턴스를 만든 호출 두 곳 특수화 있다 없다 인스턴스 한도 컴파일러마다 다름 깊이 64, 5000개 13.8 연습 ¶ swap<T>(a: &mut T, b: &mut T) 를 만들어라. 힌트: 값을 꺼낼 때 let t = *a . Cell<T> 에 set(&mut self, v: T) 와 get(&self) T 를 달아라. Stack<T> 에 len(&self) u64 를 추가하라. TAM 복사 // exit: 21\nfn swap<T>(a: &mut T, b: &mut T) {\n    let t = *a\n    *a = *b\n    *b = t\n}\n\nstruct Cell<T> { v: T }\n\nimpl Cell<T> {\n    fn new(v: T) Self { Cell { v: v } }\n    fn get(&self) T { self.v }\n    fn set(&mut self, v: T) { self.v = v }\n}\n\nfn main() i32 {\n    mut x = 1\n    mut y = 2\n    swap(&mut x, &mut y)                 // x = 2, y = 1\n    mut c = Cell::new(x)\n    let v = c.get() * 10\n    c.set(v)                             // 20\n    c.get() + y                          // 21\n} → 14. 더 나아가기", "source": "docs/book/13-generics.md"}, {"key": "book-practice", "path": "docs/book/14-practice.md", "nav": "실전 가이드", "title": "14. 더 나아가기 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"14-더-나아가기\" id=\"book-practice--14-더-나아가기\">14. 더 나아가기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-practice--14-더-나아가기\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"141-연습-문제\" id=\"book-practice--141-연습-문제\">14.1 연습 문제<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-practice--141-연습-문제\">¶</a></h2>\n<p>문제를 먼저 직접 풀어 보고 해답을 본다. 해답은 모두 컴파일·실행으로 검증되어 있다.</p>\n<h3 class=\"doc-heading\" data-slug=\"문제-1-최대공약수\" id=\"book-practice--문제-1-최대공약수\">문제 1. 최대공약수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-practice--문제-1-최대공약수\">¶</a></h3>\n<p><code>gcd(a, b)</code>를 <code>while</code>로 구현하라. <code>gcd(48, 18)</code>은 6이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn gcd(a: i64, b: i64) i64 {\n    mut x = a\n    mut y = b\n    while y != 0 {\n        let t = x % y\n        x = y\n        y = t\n    }\n    x\n}\n\nfn main() i32 { gcd(48, 18) as i32 }\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"문제-2-배열-뒤집기\" id=\"book-practice--문제-2-배열-뒤집기\">문제 2. 배열 뒤집기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-practice--문제-2-배열-뒤집기\">¶</a></h3>\n<p><code>&amp;mut [i32]</code>를 받아 제자리에서 뒤집어라. 서로 다른 두 원소를 동시에 <code>&amp;mut</code>로 빌릴 수 없으니 값으로 바꿔치기한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn reverse(a: &amp;mut [i32]) {\n    if a.len &lt; 2 { return }\n    mut i: u64 = 0\n    mut j: u64 = a.len - 1\n    while i &lt; j {\n        let t = a[i]\n        a[i] = a[j]\n        a[j] = t\n        i += 1\n        j -= 1\n    }\n}\n\nfn main() i32 {\n    mut a = [1, 2, 3, 4, 5]\n    reverse(&amp;mut a[..])\n    if a[0] != 5 || a[4] != 1 || a[2] != 3 { return 1 }\n    0\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"문제-3-소수-거르기\" id=\"book-practice--문제-3-소수-거르기\">문제 3. 소수 거르기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-practice--문제-3-소수-거르기\">¶</a></h3>\n<p>2부터 50까지 소수의 개수를 세어라(답 15).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 15\nfn main() i32 {\n    mut sieve = [true; 51]\n    mut count = 0\n    for i in 2..51 {\n        if sieve[i] {\n            count += 1\n            mut j = i * 2\n            while j &lt; 51 {\n                sieve[j] = false\n                j += i\n            }\n        }\n    }\n    count\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"문제-4-문자열-만들기\" id=\"book-practice--문제-4-문자열-만들기\">문제 4. 문자열 만들기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-practice--문제-4-문자열-만들기\">¶</a></h3>\n<p><code>String</code>에 <code>0</code>부터 <code>4</code>까지의 숫자 글자를 이어 붙이고 길이를 반환하라.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nfn main() i32 {\n    mut s = string_from(\"\")\n    for i in 0..5 {\n        string_push(&amp;mut s, 48 + i as u8)\n    }\n    s.len as i32\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"문제-5-오류를-값으로\" id=\"book-practice--문제-5-오류를-값으로\">문제 5. 오류를 값으로<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-practice--문제-5-오류를-값으로\">¶</a></h3>\n<p>안전한 나눗셈 <code>div(a, b)</code>가 0으로 나누면 <code>Err(1)</code>을 돌려주게 하고, 호출자 <code>ratio</code>가 <code>?</code>로 전파하게 하라.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nfn div(a: i32, b: i32) Result&lt;i32, i32&gt; {\n    if b == 0 { return Err(1) }\n    Ok(a / b)\n}\n\nfn ratio(a: i32, b: i32) Result&lt;i32, i32&gt; {\n    let q = div(a, b)?\n    Ok(q + 1)\n}\n\nfn main() i32 {\n    let ok = ratio(12, 2).unwrap_or(0)        // 7\n    let bad = ratio(1, 0).unwrap_or(0)        // 0\n    ok + bad\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"142-자주-만나는-컴파일-오류\" id=\"book-practice--142-자주-만나는-컴파일-오류\">14.2 자주 만나는 컴파일 오류<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-practice--142-자주-만나는-컴파일-오류\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>메시지(일부)</th>\n<th>원인</th>\n<th>고치는 법</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>use of moved value</code></td>\n<td>이동한 뒤에 다시 썼다</td>\n<td>참조(<code>&amp;</code>)로 넘긴다. 필요한 값은 이동 전에 꺼낸다</td>\n</tr>\n<tr>\n<td><code>cannot assign to ... because it is borrowed</code></td>\n<td>참조가 살아 있는 동안 수정했다</td>\n<td>참조의 마지막 사용을 수정 앞으로 옮긴다</td>\n</tr>\n<tr>\n<td><code>cannot borrow ... as mutable more than once</code></td>\n<td><code>&amp;mut</code>을 둘 만들었다</td>\n<td>하나를 다 쓴 뒤에 다음을 만든다</td>\n</tr>\n<tr>\n<td><code>cannot return reference to local variable</code></td>\n<td>지역 변수의 참조를 반환했다</td>\n<td>값을 반환하거나 호출자의 값을 참조로 받는다</td>\n</tr>\n<tr>\n<td><code>needs an </code>unsafe<code> block</code></td>\n<td>포인터 역참조, <code>alloc</code> 등</td>\n<td>꼭 필요하면 최소 범위로 <code>unsafe</code></td>\n</tr>\n<tr>\n<td><code>match</code> is missing the ... arm</td>\n<td>팔 하나가 빠졌다</td>\n<td>두 팔을 모두 쓴다</td>\n</tr>\n<tr>\n<td><code>index out of bounds</code></td>\n<td>상수 인덱스가 범위 밖이다</td>\n<td>길이를 확인한다</td>\n</tr>\n<tr>\n<td><code>expected </code>i64<code>, found </code>i32``</td>\n<td>정수형이 다르다</td>\n<td><code>as</code>로 명시적으로 변환한다</td>\n</tr>\n</tbody>\n</table>\n<p>TAM은 <strong>암묵적 변환이 없다</strong>. 형 불일치는 거의 항상 <code>as</code>로 풀린다.</p>\n<h2 class=\"doc-heading\" data-slug=\"143-실행-중-멈출-때\" id=\"book-practice--143-실행-중-멈출-때\">14.3 실행 중 멈출 때<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-practice--143-실행-중-멈출-때\">¶</a></h2>\n<p>컴파일을 통과한 프로그램이 <code>tam: panic: ...</code>을 내고 멈추면 아래 중 하나다.</p>\n<table>\n<thead>\n<tr>\n<th>메시지</th>\n<th>원인</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>integer overflow</code></td>\n<td>산술이 범위를 넘었다. 의도한 것이면 <code>wrapping_*</code></td>\n</tr>\n<tr>\n<td><code>division by zero</code></td>\n<td>0으로 나눴다</td>\n</tr>\n<tr>\n<td><code>index out of bounds</code></td>\n<td>인덱스가 길이 이상(또는 음수)이다</td>\n</tr>\n<tr>\n<td><code>called </code>unwrap()<code> on ...</code></td>\n<td><code>None</code>/<code>Err</code>에 <code>unwrap</code></td>\n</tr>\n<tr>\n<td><code>assertion failed</code></td>\n<td><code>assert</code>가 거짓이다</td>\n</tr>\n</tbody>\n</table>\n<p><code>tamc run</code>은 종료 코드를 <code>128 + 시그널</code>로 보고한다. 조용히 잘못된 결과를 내는 대신 <strong>즉시, 이유와 함께 멈추는 것</strong>이 설계다.</p>\n<h2 class=\"doc-heading\" data-slug=\"144-다음에-읽을-것\" id=\"book-practice--144-다음에-읽을-것\">14.4 다음에 읽을 것<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-practice--144-다음에-읽을-것\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>문서</th>\n<th>언제</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#doc-examples-index\">TAM by Example</a></td>\n<td>작은 예제를 빠르게 훑고 싶을 때</td>\n</tr>\n<tr>\n<td><a href=\"#doc-ref-reference\">The TAM Reference</a></td>\n<td>문법과 의미를 정확히 확인할 때</td>\n</tr>\n<tr>\n<td><a href=\"#doc-ref-stdlib\">표준 라이브러리 API</a></td>\n<td><code>os</code>, <code>fmt</code>, <code>serial</code>의 함수를 찾을 때</td>\n</tr>\n<tr>\n<td><a href=\"#doc-ref-tmake\">Tmake.toml 문서</a></td>\n<td>의존성, 워크스페이스, 프로필, 대상 설정</td>\n</tr>\n</tbody>\n</table>\n<p>그리고 아직 없는 것(트레이트, 열거형, 클로저, 가변 길이 컬렉션 등)은 <a href=\"#doc-ref-reference--17-아직-없는-것\">레퍼런스 17장</a>에 정리되어 있다. 지금의 TAM으로도 <code>alloc</code>과 구조체를 이용해 직접 <code>Vec</code>을 만들 수 있다. 제네릭(<a href=\"#doc-book-generics\">13장</a>)을 배웠으니 <code>Vec&lt;T&gt;</code>를 직접 만들어 보는 것이 다음 연습으로 좋다.</p>\n", "text": "14. 더 나아가기 ¶ 14.1 연습 문제 ¶ 문제를 먼저 직접 풀어 보고 해답을 본다. 해답은 모두 컴파일·실행으로 검증되어 있다. 문제 1. 최대공약수 ¶ gcd(a, b) 를 while 로 구현하라. gcd(48, 18) 은 6이다. TAM 복사 // exit: 6\nfn gcd(a: i64, b: i64) i64 {\n    mut x = a\n    mut y = b\n    while y != 0 {\n        let t = x % y\n        x = y\n        y = t\n    }\n    x\n}\n\nfn main() i32 { gcd(48, 18) as i32 } 문제 2. 배열 뒤집기 ¶ &mut [i32] 를 받아 제자리에서 뒤집어라. 서로 다른 두 원소를 동시에 &mut 로 빌릴 수 없으니 값으로 바꿔치기한다. TAM 복사 // exit: 0\nfn reverse(a: &mut [i32]) {\n    if a.len < 2 { return }\n    mut i: u64 = 0\n    mut j: u64 = a.len - 1\n    while i < j {\n        let t = a[i]\n        a[i] = a[j]\n        a[j] = t\n        i += 1\n        j -= 1\n    }\n}\n\nfn main() i32 {\n    mut a = [1, 2, 3, 4, 5]\n    reverse(&mut a[..])\n    if a[0] != 5 || a[4] != 1 || a[2] != 3 { return 1 }\n    0\n} 문제 3. 소수 거르기 ¶ 2부터 50까지 소수의 개수를 세어라(답 15). TAM 복사 // exit: 15\nfn main() i32 {\n    mut sieve = [true; 51]\n    mut count = 0\n    for i in 2..51 {\n        if sieve[i] {\n            count += 1\n            mut j = i * 2\n            while j < 51 {\n                sieve[j] = false\n                j += i\n            }\n        }\n    }\n    count\n} 문제 4. 문자열 만들기 ¶ String 에 0 부터 4 까지의 숫자 글자를 이어 붙이고 길이를 반환하라. TAM 복사 // exit: 5\nfn main() i32 {\n    mut s = string_from(\"\")\n    for i in 0..5 {\n        string_push(&mut s, 48 + i as u8)\n    }\n    s.len as i32\n} 문제 5. 오류를 값으로 ¶ 안전한 나눗셈 div(a, b) 가 0으로 나누면 Err(1) 을 돌려주게 하고, 호출자 ratio 가 ? 로 전파하게 하라. TAM 복사 // exit: 7\nfn div(a: i32, b: i32) Result<i32, i32> {\n    if b == 0 { return Err(1) }\n    Ok(a / b)\n}\n\nfn ratio(a: i32, b: i32) Result<i32, i32> {\n    let q = div(a, b)?\n    Ok(q + 1)\n}\n\nfn main() i32 {\n    let ok = ratio(12, 2).unwrap_or(0)        // 7\n    let bad = ratio(1, 0).unwrap_or(0)        // 0\n    ok + bad\n} 14.2 자주 만나는 컴파일 오류 ¶ 메시지(일부) 원인 고치는 법 use of moved value 이동한 뒤에 다시 썼다 참조( & )로 넘긴다. 필요한 값은 이동 전에 꺼낸다 cannot assign to ... because it is borrowed 참조가 살아 있는 동안 수정했다 참조의 마지막 사용을 수정 앞으로 옮긴다 cannot borrow ... as mutable more than once &mut 을 둘 만들었다 하나를 다 쓴 뒤에 다음을 만든다 cannot return reference to local variable 지역 변수의 참조를 반환했다 값을 반환하거나 호출자의 값을 참조로 받는다 needs an unsafe block 포인터 역참조, alloc 등 꼭 필요하면 최소 범위로 unsafe match is missing the ... arm 팔 하나가 빠졌다 두 팔을 모두 쓴다 index out of bounds 상수 인덱스가 범위 밖이다 길이를 확인한다 expected i64 , found i32`` 정수형이 다르다 as 로 명시적으로 변환한다 TAM은 암묵적 변환이 없다 . 형 불일치는 거의 항상 as 로 풀린다. 14.3 실행 중 멈출 때 ¶ 컴파일을 통과한 프로그램이 tam: panic: ... 을 내고 멈추면 아래 중 하나다. 메시지 원인 integer overflow 산술이 범위를 넘었다. 의도한 것이면 wrapping_* division by zero 0으로 나눴다 index out of bounds 인덱스가 길이 이상(또는 음수)이다 called unwrap() on ... None / Err 에 unwrap assertion failed assert 가 거짓이다 tamc run 은 종료 코드를 128 + 시그널 로 보고한다. 조용히 잘못된 결과를 내는 대신 즉시, 이유와 함께 멈추는 것 이 설계다. 14.4 다음에 읽을 것 ¶ 문서 언제 TAM by Example 작은 예제를 빠르게 훑고 싶을 때 The TAM Reference 문법과 의미를 정확히 확인할 때 표준 라이브러리 API os , fmt , serial 의 함수를 찾을 때 Tmake.toml 문서 의존성, 워크스페이스, 프로필, 대상 설정 그리고 아직 없는 것(트레이트, 열거형, 클로저, 가변 길이 컬렉션 등)은 레퍼런스 17장 에 정리되어 있다. 지금의 TAM으로도 alloc 과 구조체를 이용해 직접 Vec 을 만들 수 있다. 제네릭( 13장 )을 배웠으니 Vec<T> 를 직접 만들어 보는 것이 다음 연습으로 좋다.", "source": "docs/book/14-practice.md"}, {"key": "example-basics", "path": "docs/by-example/01-basics.md", "nav": "기초", "title": "1. 기초 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"1-기초\" id=\"example-basics--1-기초\">1. 기초<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-basics--1-기초\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"hello-world\" id=\"example-basics--hello-world\">Hello, world<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-basics--hello-world\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// out: Hello, world!\nuse tam.os\n\nfn main() i32 {\n    os::println(\"Hello, world!\")\n    0\n}\n</code></pre></div>\n<p><code>main</code>은 <code>i32</code>를 반환하고, 그 값이 종료 코드다. 마지막 식이 반환값이다.</p>\n<h2 class=\"doc-heading\" data-slug=\"변수\" id=\"example-basics--변수\">변수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-basics--변수\">¶</a></h2>\n<p><code>let</code>은 불변, <code>mut</code>는 가변이다. 같은 이름을 다시 선언(섀도잉)할 수 있다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 12\nfn main() i32 {\n    let a = 5\n    mut b = a\n    b += 3\n    let b = b + 4        // 새 변수(섀도잉)\n    b\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"정수형과-변환\" id=\"example-basics--정수형과-변환\">정수형과 변환<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-basics--정수형과-변환\">¶</a></h2>\n<p>암묵적 변환은 없다. <code>as</code>로 명시한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 44\nfn main() i32 {\n    let big: i64 = 300\n    let small = big as u8      // 300 mod 256 = 44\n    small as i32\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"산술과-비트-연산\" id=\"example-basics--산술과-비트-연산\">산술과 비트 연산<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-basics--산술과-비트-연산\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    if 7 / 2 != 3 { return 1 }          // 정수 나눗셈\n    if 7 % 3 != 1 { return 2 }\n    if (0 - 7) / 2 != 0 - 3 { return 3 } // 0 방향으로 자른다\n    if (6 &amp; 3) != 2 { return 4 }\n    if (6 | 3) != 7 { return 5 }\n    if (6 ^ 3) != 5 { return 6 }\n    if (1 &lt;&lt; 4) != 16 { return 7 }\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"부동소수점\" id=\"example-basics--부동소수점\">부동소수점<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-basics--부동소수점\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nfn main() i32 {\n    let x: f64 = 3.5\n    let y = x * 2.0\n    y as i32\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"if는-식이다\" id=\"example-basics--if는-식이다\">if는 식이다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-basics--if는-식이다\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nfn max(a: i32, b: i32) i32 {\n    if a &gt; b { a } else { b }\n}\n\nfn main() i32 { max(4, 9) }\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"while과-breakcontinue\" id=\"example-basics--while과-breakcontinue\">while과 break/continue<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-basics--while과-breakcontinue\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 25\nfn main() i32 {\n    mut i = 0\n    mut sum = 0\n    while true {\n        i += 1\n        if i &gt; 10 { break }\n        if i % 2 == 0 { continue }\n        sum += i                 // 1+3+5+7+9\n    }\n    sum\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"for와-범위\" id=\"example-basics--for와-범위\">for와 범위<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-basics--for와-범위\">¶</a></h2>\n<p><code>a..b</code>는 <code>a</code>부터 <code>b</code> 직전까지다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 10\nfn main() i32 {\n    mut s = 0\n    for i in 0..5 { s += i }\n    s\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"함수와-재귀\" id=\"example-basics--함수와-재귀\">함수와 재귀<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-basics--함수와-재귀\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 120\nfn fact(n: i64) i64 {\n    if n &lt;= 1 { return 1 }\n    n * fact(n - 1)\n}\n\nfn main() i32 { fact(5) as i32 }\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"논리-연산과-단락-평가\" id=\"example-basics--논리-연산과-단락-평가\">논리 연산과 단락 평가<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-basics--논리-연산과-단락-평가\">¶</a></h2>\n<p><code>&amp;&amp;</code>, <code>||</code>는 왼쪽만으로 결정되면 오른쪽을 평가하지 않는다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 1\nfn boom() bool { panic(\"not reached\") }\n\nfn main() i32 {\n    if false &amp;&amp; boom() { return 0 }\n    if true || boom() { return 1 }\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"오버플로는-trap한다\" id=\"example-basics--오버플로는-trap한다\">오버플로는 trap한다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-basics--오버플로는-trap한다\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: integer overflow\nfn main() i32 {\n    mut x: i32 = 2147483647\n    x += 1\n    x\n}\n</code></pre></div>\n", "text": "1. 기초 ¶ Hello, world ¶ TAM 복사 // out: Hello, world!\nuse tam.os\n\nfn main() i32 {\n    os::println(\"Hello, world!\")\n    0\n} main 은 i32 를 반환하고, 그 값이 종료 코드다. 마지막 식이 반환값이다. 변수 ¶ let 은 불변, mut 는 가변이다. 같은 이름을 다시 선언(섀도잉)할 수 있다. TAM 복사 // exit: 12\nfn main() i32 {\n    let a = 5\n    mut b = a\n    b += 3\n    let b = b + 4        // 새 변수(섀도잉)\n    b\n} 정수형과 변환 ¶ 암묵적 변환은 없다. as 로 명시한다. TAM 복사 // exit: 44\nfn main() i32 {\n    let big: i64 = 300\n    let small = big as u8      // 300 mod 256 = 44\n    small as i32\n} 산술과 비트 연산 ¶ TAM 복사 // exit: 0\nfn main() i32 {\n    if 7 / 2 != 3 { return 1 }          // 정수 나눗셈\n    if 7 % 3 != 1 { return 2 }\n    if (0 - 7) / 2 != 0 - 3 { return 3 } // 0 방향으로 자른다\n    if (6 & 3) != 2 { return 4 }\n    if (6 | 3) != 7 { return 5 }\n    if (6 ^ 3) != 5 { return 6 }\n    if (1 << 4) != 16 { return 7 }\n    0\n} 부동소수점 ¶ TAM 복사 // exit: 7\nfn main() i32 {\n    let x: f64 = 3.5\n    let y = x * 2.0\n    y as i32\n} if는 식이다 ¶ TAM 복사 // exit: 9\nfn max(a: i32, b: i32) i32 {\n    if a > b { a } else { b }\n}\n\nfn main() i32 { max(4, 9) } while과 break/continue ¶ TAM 복사 // exit: 25\nfn main() i32 {\n    mut i = 0\n    mut sum = 0\n    while true {\n        i += 1\n        if i > 10 { break }\n        if i % 2 == 0 { continue }\n        sum += i                 // 1+3+5+7+9\n    }\n    sum\n} for와 범위 ¶ a..b 는 a 부터 b 직전까지다. TAM 복사 // exit: 10\nfn main() i32 {\n    mut s = 0\n    for i in 0..5 { s += i }\n    s\n} 함수와 재귀 ¶ TAM 복사 // exit: 120\nfn fact(n: i64) i64 {\n    if n <= 1 { return 1 }\n    n * fact(n - 1)\n}\n\nfn main() i32 { fact(5) as i32 } 논리 연산과 단락 평가 ¶ && , || 는 왼쪽만으로 결정되면 오른쪽을 평가하지 않는다. TAM 복사 // exit: 1\nfn boom() bool { panic(\"not reached\") }\n\nfn main() i32 {\n    if false && boom() { return 0 }\n    if true || boom() { return 1 }\n    0\n} 오버플로는 trap한다 ¶ TAM,TRAP 복사 // panic: integer overflow\nfn main() i32 {\n    mut x: i32 = 2147483647\n    x += 1\n    x\n}", "source": "docs/by-example/01-basics.md"}, {"key": "example-data", "path": "docs/by-example/02-data.md", "nav": "데이터", "title": "2. 데이터 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"2-데이터\" id=\"example-data--2-데이터\">2. 데이터<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-data--2-데이터\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"배열\" id=\"example-data--배열\">배열<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-data--배열\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn main() i32 {\n    let a = [1, 2, 3]\n    let z = [0; 4]\n    a[0] + a[1] + a[2] + z[3]\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"2차원-배열\" id=\"example-data--2차원-배열\">2차원 배열<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-data--2차원-배열\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn main() i32 {\n    mut g = [[0; 3]; 2]\n    for r in 0..2 {\n        for c in 0..3 { g[r][c] = r * 3 + c }\n    }\n    g[1][2] + 1\n}\n</code></pre></div>\n<p>(<code>g</code>의 원소는 <code>i32</code>다.)</p>\n<h2 class=\"doc-heading\" data-slug=\"슬라이스로-합-구하기\" id=\"example-data--슬라이스로-합-구하기\">슬라이스로 합 구하기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-data--슬라이스로-합-구하기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 15\nfn sum(a: &amp;[i32]) i32 {\n    mut s = 0\n    for x in a { s += x }\n    s\n}\n\nfn main() i32 {\n    let a = [1, 2, 3, 4, 5]\n    sum(&amp;a)\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"부분-슬라이스\" id=\"example-data--부분-슬라이스\">부분 슬라이스<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-data--부분-슬라이스\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 90\nfn sum(a: &amp;[i32]) i32 {\n    mut s = 0\n    for i in 0..a.len { s += a[i] }\n    s\n}\n\nfn main() i32 {\n    let a = [10, 20, 30, 40, 50]\n    sum(&amp;a[1..4])               // 20+30+40\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"슬라이스에-쓰기\" id=\"example-data--슬라이스에-쓰기\">슬라이스에 쓰기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-data--슬라이스에-쓰기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn zero(a: &amp;mut [i32]) {\n    for i in 0..a.len { a[i] = 0 }\n}\n\nfn main() i32 {\n    mut a = [1, 2, 3]\n    zero(&amp;mut a[..])\n    a[0] + a[1] + a[2]\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"구조체\" id=\"example-data--구조체\">구조체<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-data--구조체\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nstruct Point {\n    x: i32,\n    y: i32,\n}\n\nfn main() i32 {\n    let p = Point { x: 3, y: 4 }\n    p.x + p.y\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"중첩-구조체\" id=\"example-data--중첩-구조체\">중첩 구조체<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-data--중첩-구조체\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 14\nstruct Point { x: i32, y: i32 }\nstruct Line { a: Point, b: Point }\n\nfn main() i32 {\n    let l = Line { a: Point { x: 1, y: 2 }, b: Point { x: 5, y: 6 } }\n    l.a.x + l.a.y + l.b.x + l.b.y\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"메서드와-생성자\" id=\"example-data--메서드와-생성자\">메서드와 생성자<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-data--메서드와-생성자\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 24\nstruct Rect { w: i32, h: i32 }\n\nimpl Rect {\n    fn new(w: i32, h: i32) Self { Rect { w: w, h: h } }\n    fn area(&amp;self) i32 { self.w * self.h }\n    fn scale(&amp;mut self, k: i32) { self.w *= k; self.h *= k }\n}\n\nfn main() i32 {\n    mut r = Rect::new(1, 2)\n    r.scale(2)                  // 2 x 4\n    r.area() * 3                // 8 * 3\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"값으로-소비하는-메서드\" id=\"example-data--값으로-소비하는-메서드\">값으로 소비하는 메서드<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-data--값으로-소비하는-메서드\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 10\nstruct Money { cents: i64 }\n\nimpl Money {\n    fn into_cents(self) i64 { self.cents }\n}\n\nfn main() i32 {\n    let m = Money { cents: 10 }\n    m.into_cents() as i32\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"구조체-안의-배열-고정-용량-스택\" id=\"example-data--구조체-안의-배열-고정-용량-스택\">구조체 안의 배열: 고정 용량 스택<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-data--구조체-안의-배열-고정-용량-스택\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nstruct Stack {\n    items: [i32; 4],\n    len: u64,\n}\n\nimpl Stack {\n    fn new() Self { Stack { items: [0; 4], len: 0 } }\n    fn push(&amp;mut self, v: i32) {\n        self.items[self.len] = v\n        self.len += 1\n    }\n    fn pop(&amp;mut self) Option&lt;i32&gt; {\n        if self.len == 0 { return None }\n        self.len -= 1\n        Some(self.items[self.len])\n    }\n}\n\nfn main() i32 {\n    mut s = Stack::new()\n    s.push(1)\n    s.push(3)\n    s.pop().unwrap_or(0)\n}\n</code></pre></div>\n", "text": "2. 데이터 ¶ 배열 ¶ TAM 복사 // exit: 6\nfn main() i32 {\n    let a = [1, 2, 3]\n    let z = [0; 4]\n    a[0] + a[1] + a[2] + z[3]\n} 2차원 배열 ¶ TAM 복사 // exit: 6\nfn main() i32 {\n    mut g = [[0; 3]; 2]\n    for r in 0..2 {\n        for c in 0..3 { g[r][c] = r * 3 + c }\n    }\n    g[1][2] + 1\n} ( g 의 원소는 i32 다.) 슬라이스로 합 구하기 ¶ TAM 복사 // exit: 15\nfn sum(a: &[i32]) i32 {\n    mut s = 0\n    for x in a { s += x }\n    s\n}\n\nfn main() i32 {\n    let a = [1, 2, 3, 4, 5]\n    sum(&a)\n} 부분 슬라이스 ¶ TAM 복사 // exit: 90\nfn sum(a: &[i32]) i32 {\n    mut s = 0\n    for i in 0..a.len { s += a[i] }\n    s\n}\n\nfn main() i32 {\n    let a = [10, 20, 30, 40, 50]\n    sum(&a[1..4])               // 20+30+40\n} 슬라이스에 쓰기 ¶ TAM 복사 // exit: 0\nfn zero(a: &mut [i32]) {\n    for i in 0..a.len { a[i] = 0 }\n}\n\nfn main() i32 {\n    mut a = [1, 2, 3]\n    zero(&mut a[..])\n    a[0] + a[1] + a[2]\n} 구조체 ¶ TAM 복사 // exit: 7\nstruct Point {\n    x: i32,\n    y: i32,\n}\n\nfn main() i32 {\n    let p = Point { x: 3, y: 4 }\n    p.x + p.y\n} 중첩 구조체 ¶ TAM 복사 // exit: 14\nstruct Point { x: i32, y: i32 }\nstruct Line { a: Point, b: Point }\n\nfn main() i32 {\n    let l = Line { a: Point { x: 1, y: 2 }, b: Point { x: 5, y: 6 } }\n    l.a.x + l.a.y + l.b.x + l.b.y\n} 메서드와 생성자 ¶ TAM 복사 // exit: 24\nstruct Rect { w: i32, h: i32 }\n\nimpl Rect {\n    fn new(w: i32, h: i32) Self { Rect { w: w, h: h } }\n    fn area(&self) i32 { self.w * self.h }\n    fn scale(&mut self, k: i32) { self.w *= k; self.h *= k }\n}\n\nfn main() i32 {\n    mut r = Rect::new(1, 2)\n    r.scale(2)                  // 2 x 4\n    r.area() * 3                // 8 * 3\n} 값으로 소비하는 메서드 ¶ TAM 복사 // exit: 10\nstruct Money { cents: i64 }\n\nimpl Money {\n    fn into_cents(self) i64 { self.cents }\n}\n\nfn main() i32 {\n    let m = Money { cents: 10 }\n    m.into_cents() as i32\n} 구조체 안의 배열: 고정 용량 스택 ¶ TAM 복사 // exit: 3\nstruct Stack {\n    items: [i32; 4],\n    len: u64,\n}\n\nimpl Stack {\n    fn new() Self { Stack { items: [0; 4], len: 0 } }\n    fn push(&mut self, v: i32) {\n        self.items[self.len] = v\n        self.len += 1\n    }\n    fn pop(&mut self) Option<i32> {\n        if self.len == 0 { return None }\n        self.len -= 1\n        Some(self.items[self.len])\n    }\n}\n\nfn main() i32 {\n    mut s = Stack::new()\n    s.push(1)\n    s.push(3)\n    s.pop().unwrap_or(0)\n}", "source": "docs/by-example/02-data.md"}, {"key": "example-ownership", "path": "docs/by-example/03-ownership.md", "nav": "소유권", "title": "3. 소유권과 빌림 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"3-소유권과-빌림\" id=\"example-ownership--3-소유권과-빌림\">3. 소유권과 빌림<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-ownership--3-소유권과-빌림\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"이동\" id=\"example-ownership--이동\">이동<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-ownership--이동\">¶</a></h2>\n<p><code>String</code>, 구조체, 배열은 이동 타입이다. 이동한 뒤의 원본은 쓸 수 없다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: use of moved value `a`\nfn main() i32 {\n    let a = string_from(\"hi\")\n    let b = a\n    a.len as i32 + b.len as i32\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"함수에-값을-넘기면-이동한다\" id=\"example-ownership--함수에-값을-넘기면-이동한다\">함수에 값을 넘기면 이동한다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-ownership--함수에-값을-넘기면-이동한다\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nfn consume(s: String) i32 { s.len as i32 }     // 여기서 해제된다\n\nfn main() i32 {\n    let s = string_from(\"abc\")\n    consume(s)\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"참조로-빌려-주기\" id=\"example-ownership--참조로-빌려-주기\">참조로 빌려 주기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-ownership--참조로-빌려-주기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn len_of(s: &amp;String) i32 { s.len as i32 }\n\nfn main() i32 {\n    let s = string_from(\"abc\")\n    let n = len_of(&amp;s)\n    n + s.len as i32          // s는 아직 우리 것이다\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"mut로-바꾸기\" id=\"example-ownership--mut로-바꾸기\"><code>&amp;mut</code>로 바꾸기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-example-ownership--mut로-바꾸기\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nfn push_twice(s: &amp;mut String) {\n    string_pu
