 class=\"language-tam\">// exit: 7\nfn pick(a: &amp;i32, b: &amp;i32) &amp;i32 {\n    if *a &gt; *b { a } else { b }\n}\n\nfn main() i32 {\n    let x = 3\n    let y = 7\n    *pick(&amp;x, &amp;y)\n}\n</code></pre></div>\n<p>여러 인자 중 어느 것이 나올지 모르면 컴파일러는 <strong>보수적으로 모두를 빌린 것</strong>으로 본다. 그래서 위의 <code>pick</code>의 결과가 살아 있는 동안 <code>x</code>와 <code>y</code> 둘 다 바꿀 수 없다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot assign to `x` because it is borrowed\nfn pick(a: &amp;i32, b: &amp;i32) &amp;i32 { a }\n\nfn main() i32 {\n    mut x = 1\n    let y = 2\n    let r = pick(&amp;x, &amp;y)\n    x += 1\n    *r\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"57-mut의-재차용\" id=\"book-references-and-borrowing--57-mut의-재차용\">5.7 <code>&amp;mut</code>의 재차용<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--57-mut의-재차용\">¶</a></h2>\n<p><code>&amp;mut</code> 참조를 다른 함수에 넘기면 <strong>잠시 빌려 주는 것</strong>(재차용)이며, 그 함수가 끝나면 원래 참조를 다시 쓸 수 있다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nfn inc(x: &amp;mut i32) { *x += 1 }\n\nfn twice(x: &amp;mut i32) {\n    inc(x)\n    inc(x)\n}\n\nfn main() i32 {\n    mut n = 1\n    twice(&amp;mut n)\n    n\n}\n</code></pre></div>\n<p><code>&amp;mut T</code>는 <code>&amp;T</code>가 필요한 자리에 넘길 수 있다(읽기만 하게 된다). 반대는 안 된다.</p>\n<h2 class=\"doc-heading\" data-slug=\"58-참조의-참조\" id=\"book-references-and-borrowing--58-참조의-참조\">5.8 참조의 참조<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--58-참조의-참조\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nfn deref2(r: &amp;&amp;i32) i32 { **r }\n\nfn main() i32 {\n    let x = 5\n    let r = &amp;x\n    deref2(&amp;r)\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"59-오류를-고치는-요령\" id=\"book-references-and-borrowing--59-오류를-고치는-요령\">5.9 오류를 고치는 요령<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--59-오류를-고치는-요령\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>오류</th>\n<th>보통의 해결</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>use of moved value</code></td>\n<td>값 대신 <strong>참조</strong>를 넘긴다. 또는 이동한 뒤에는 쓰지 않는다</td>\n</tr>\n<tr>\n<td><code>cannot assign to ... because it is borrowed</code></td>\n<td>참조의 마지막 사용을 수정 앞으로 당긴다</td>\n</tr>\n<tr>\n<td><code>cannot borrow ... as mutable more than once</code></td>\n<td>먼저 만든 <code>&amp;mut</code>을 다 쓴 뒤에 다음 것을 만든다</td>\n</tr>\n<tr>\n<td><code>cannot borrow ... as mutable because it is also borrowed as immutable</code></td>\n<td>읽기 참조(<code>as_str</code> 결과 포함)의 사용을 끝낸 뒤에 수정한다</td>\n</tr>\n<tr>\n<td><code>cannot return reference to local variable</code></td>\n<td>값을 <strong>반환</strong>(이동)하거나, 호출자가 만든 값을 참조로 받는다</td>\n</tr>\n</tbody>\n</table>\n<p>검사기가 지나치게 보수적이라 올바른 코드를 거절하는 경우도 있다(예: 배열의 서로 다른 원소 둘을 동시에 <code>&amp;mut</code>로). 그때는 인덱스로 한 번에 하나씩 접근하거나, 값을 임시 변수에 복사해 쓴다. 정말 필요한 때에는 <code>unsafe</code>의 raw 포인터가 있다(<a href=\"#doc-book-unsafe-and-systems\">10장</a>).</p>\n<p>→ <a href=\"#doc-book-structs-and-methods\">6. 구조체와 메서드</a></p>\n", "text": "5. 참조와 빌림 ¶ 값을 넘길 때마다 소유권을 옮기면 불편하다. 참조 는 소유권을 옮기지 않고 값을 빌려 준다. 빌림 검사기(borrow checker)는 빌린 값이 도중에 사라지거나 위험하게 바뀌지 않음을 컴파일 시간에 증명한다. 5.1 읽기 참조 &T ¶ &x 는 x 를 읽기 전용으로 빌린다. *r 로 값을 읽는다. TAM 복사 // exit: 5\nfn len_of(s: &String) i32 {\n    s.len as i32          // 참조 너머의 필드도 바로 읽는다\n}\n\nfn main() i32 {\n    let s = string_from(\"hello\")\n    let n = len_of(&s)     // 빌려 주기만 한다\n    n + 0 * s.len as i32   // s는 여전히 쓸 수 있다\n} TAM 복사 // exit: 6\nfn double(r: &i32) i32 { *r * 2 }\n\nfn main() i32 {\n    let x = 3\n    double(&x)\n} 참조는 Copy다. 읽기 참조는 여러 개 동시에 있을 수 있다. 5.2 쓰기 참조 &mut T ¶ &mut x 는 x 를 배타적으로 빌려 바꿀 수 있게 한다. x 가 mut 여야 한다. TAM 복사 // exit: 11\nfn bump(x: &mut i32) {\n    *x += 1\n}\n\nfn main() i32 {\n    mut n = 10\n    bump(&mut n)\n    n\n} TAM,ERROR 복사 // error: cannot borrow immutable variable `a` as mutable\nfn main() i32 {\n    let a = 5\n    let r = &mut a\n    0\n} 5.3 빌림 규칙 ¶ 같은 값에 대해 읽기 참조 여러 개 또는 쓰기 참조 하나 만 동시에 있을 수 있다. 참조는 가리키는 값보다 오래 살 수 없다. 이 규칙이 데이터 레이스, 반복 중 컬렉션 수정, 해제 후 사용 같은 버그를 원천 봉쇄 한다. 읽는 동안에는 바꿀 수 없다 ¶ TAM,ERROR 복사 // error: cannot assign to `v` because it is borrowed\nfn main() i32 {\n    mut v = 10\n    let r = &v\n    v += 1\n    *r\n} CONSOLE 복사 error: cannot assign to `v` because it is borrowed\n --> ex2.tam:4:5\n  |\n3 |     let r = &v\n  |             -- `v` is borrowed here\n4 |     v += 1\n  |     ^ assignment to borrowed `v` occurs here\n5 |     *r\n  |     -- first borrow later used here 오류는 세 군데 를 가리킨다: 빌린 곳, 충돌한 곳, 빌림이 다시 쓰이는 곳. 이 셋을 읽으면 무엇을 고쳐야 하는지 보인다. 보통 참조의 사용을 충돌 앞으로 옮기거나, 충돌을 참조 사용 뒤로 옮긴다. 쓰기 참조는 하나만 ¶ TAM,ERROR 복사 // error: cannot borrow `s` as mutable more than once at a time\nfn main() i32 {\n    mut s = string_from(\"a\")\n    let r = &mut s\n    let q = &mut s\n    string_push(r, 98)\n    0\n} 읽기와 쓰기를 섞을 수 없다 ¶ TAM,ERROR 복사 // error: cannot borrow `s` as mutable because it is also borrowed as immutable\nfn main() i32 {\n    mut s = string_from(\"a\")\n    let view = as_str(&s)\n    string_push(&mut s, 98)\n    view.len as i32\n} as_str(&s) 가 돌려준 str 은 s 를 빌린 것이다. s 를 바꾸면 view 가 가리키는 메모리가 바뀌거나 옮겨질 수 있으니 막는다. 5.4 \"마지막 사용까지\": NLL ¶ 참조가 살아 있는 구간은 마지막으로 쓰는 곳까지 다. 스코프 끝까지가 아니다. 참조를 더 쓰지 않으면 이어지는 수정은 허용된다. TAM 복사 // exit: 11\nfn main() i32 {\n    mut v = 10\n    let r = &v\n    let seen = *r        // r의 마지막 사용\n    v += 1               // 이제 괜찮다\n    v + seen - 10\n} 5.5 구조체의 필드는 따로 빌릴 수 있다 ¶ TAM 복사 // exit: 5\nstruct P { x: i32, y: i32 }\n\nfn main() i32 {\n    mut p = P { x: 1, y: 2 }\n    let a = &mut p.x\n    let b = &mut p.y          // 다른 필드라 동시에 가능\n    *a += 1\n    *b += 1\n    p.x + p.y\n} 구조체 전체 와 그 필드는 서로 충돌한다. 배열은 원소를 구분하지 않는다 : &mut a[0] 과 &a[1] 은 동시에 만들 수 없다(보수적이다). 5.6 반환하는 참조와 댕글링 ¶ 함수가 참조를 돌려줄 때, 그 참조는 호출자가 가진 값 을 가리켜야 한다. 지역 변수를 가리키는 참조는 함수가 끝나면 사라지므로 컴파일러가 막는다. TAM,ERROR 복사 // error: cannot return reference to local variable `x`\nfn bad() &i32 {\n    let x = 5\n    &x\n}\n\nfn main() i32 { *bad() } 인자로 받은 참조를 돌려주는 것은 괜찮다. 수명 표기는 필요 없다. 컴파일러가 본문에서 출처를 추론 한다. TAM 복사 // exit: 7\nfn pick(a: &i32, b: &i32) &i32 {\n    if *a > *b { a } else { b }\n}\n\nfn main() i32 {\n    let x = 3\n    let y = 7\n    *pick(&x, &y)\n} 여러 인자 중 어느 것이 나올지 모르면 컴파일러는 보수적으로 모두를 빌린 것 으로 본다. 그래서 위의 pick 의 결과가 살아 있는 동안 x 와 y 둘 다 바꿀 수 없다. TAM,ERROR 복사 // error: cannot assign to `x` because it is borrowed\nfn pick(a: &i32, b: &i32) &i32 { a }\n\nfn main() i32 {\n    mut x = 1\n    let y = 2\n    let r = pick(&x, &y)\n    x += 1\n    *r\n} 5.7 &mut 의 재차용 ¶ &mut 참조를 다른 함수에 넘기면 잠시 빌려 주는 것 (재차용)이며, 그 함수가 끝나면 원래 참조를 다시 쓸 수 있다. TAM 복사 // exit: 3\nfn inc(x: &mut i32) { *x += 1 }\n\nfn twice(x: &mut i32) {\n    inc(x)\n    inc(x)\n}\n\nfn main() i32 {\n    mut n = 1\n    twice(&mut n)\n    n\n} &mut T 는 &T 가 필요한 자리에 넘길 수 있다(읽기만 하게 된다). 반대는 안 된다. 5.8 참조의 참조 ¶ TAM 복사 // exit: 5\nfn deref2(r: &&i32) i32 { **r }\n\nfn main() i32 {\n    let x = 5\n    let r = &x\n    deref2(&r)\n} 5.9 오류를 고치는 요령 ¶ 오류 보통의 해결 use of moved value 값 대신 참조 를 넘긴다. 또는 이동한 뒤에는 쓰지 않는다 cannot assign to ... because it is borrowed 참조의 마지막 사용을 수정 앞으로 당긴다 cannot borrow ... as mutable more than once 먼저 만든 &mut 을 다 쓴 뒤에 다음 것을 만든다 cannot borrow ... as mutable because it is also borrowed as immutable 읽기 참조( as_str 결과 포함)의 사용을 끝낸 뒤에 수정한다 cannot return reference to local variable 값을 반환 (이동)하거나, 호출자가 만든 값을 참조로 받는다 검사기가 지나치게 보수적이라 올바른 코드를 거절하는 경우도 있다(예: 배열의 서로 다른 원소 둘을 동시에 &mut 로). 그때는 인덱스로 한 번에 하나씩 접근하거나, 값을 임시 변수에 복사해 쓴다. 정말 필요한 때에는 unsafe 의 raw 포인터가 있다( 10장 ). → 6. 구조체와 메서드", "source": "docs/book/05-references-and-borrowing.md"}, {"key": "book-structs-and-methods", "path": "docs/book/06-structs-and-methods.md", "nav": "구조체와 메서드", "title": "6. 구조체와 메서드 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"6-구조체와-메서드\" id=\"book-structs-and-methods--6-구조체와-메서드\">6. 구조체와 메서드<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-structs-and-methods--6-구조체와-메서드\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"61-구조체\" id=\"book-structs-and-methods--61-구조체\">6.1 구조체<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-structs-and-methods--61-구조체\">¶</a></h2>\n<p>관련된 값을 묶는다. 필드는 쉼표나 줄바꿈으로 구분한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nstruct Point {\n    x: i32,\n    y: i32,\n}\n\nfn main() i32 {\n    let p = Point { x: 3, y: 4 }\n    p.x + p.y\n}\n</code></pre></div>\n<ul>\n<li>리터럴은 <strong>모든 필드를 한 번씩</strong>, 순서 없이 쓴다.</li>\n<li>필드는 항상 공개다(필드 단위 <code>pub</code>은 없다).</li>\n<li>구조체는 다른 구조체, 배열, <code>String</code>, 참조, 포인터, <code>Result</code>/<code>Option</code>을 필드로 가질 수 있다. 자기 자신을 값으로 포함할 수는 없다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nstruct Point { x: i32, y: i32 }\n\nstruct Rect {\n    min: Point\n    max: Point\n}\n\nfn area(r: &amp;Rect) i32 {\n    (r.max.x - r.min.x) * (r.max.y - r.min.y)\n}\n\nfn main() i32 {\n    let r = Rect { min: Point { x: 0, y: 0 }, max: Point { x: 3, y: 2 } }\n    area(&amp;r)\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"가변-필드\" id=\"book-structs-and-methods--가변-필드\">가변 필드<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-structs-and-methods--가변-필드\">¶</a></h3>\n<p>필드를 바꾸려면 구조체 변수가 <code>mut</code>여야 한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nstruct Counter { n: i32 }\n\nfn main() i32 {\n    mut c = Counter { n: 4 }\n    c.n += 5\n    c.n\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot assign to a field of immutable variable `c`\nstruct Counter { n: i32 }\n\nfn main() i32 {\n    let c = Counter { n: 4 }\n    c.n = 5\n    c.n\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"이동-타입\" id=\"book-structs-and-methods--이동-타입\">이동 타입<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-structs-and-methods--이동-타입\">¶</a></h3>\n<p>구조체는 <strong>이동 타입</strong>이다. 복사하려면 필드를 읽어 새로 만든다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nstruct P { x: i32, y: i32 }\n\nfn copy(p: &amp;P) P {\n    P { x: p.x, y: p.y }\n}\n\nfn main() i32 {\n    let a = P { x: 1, y: 2 }\n    let b = copy(&amp;a)         // a는 그대로 쓸 수 있다\n    a.x + a.y + b.x + b.y\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"조건-안의-구조체-리터럴\" id=\"book-structs-and-methods--조건-안의-구조체-리터럴\">조건 안의 구조체 리터럴<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-structs-and-methods--조건-안의-구조체-리터럴\">¶</a></h3>\n<p><code>if</code>, <code>while</code>, <code>match</code>의 조건 자리에서는 <code>Name {</code>를 리터럴로 읽지 않는다(블록과 구분하기 위해). 필요하면 괄호로 감싼다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 1\nstruct P { x: i32 }\n\nfn main() i32 {\n    let p = P { x: 2 }\n    if (P { x: 2 }).x == p.x { 1 } else { 0 }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"62-impl-메서드와-연관-함수\" id=\"book-structs-and-methods--62-impl-메서드와-연관-함수\">6.2 <code>impl</code>: 메서드와 연관 함수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-structs-and-methods--62-impl-메서드와-연관-함수\">¶</a></h2>\n<p><code>impl 타입 { ... }</code> 안에 함수를 둔다. 첫 매개변수가 <code>&amp;self</code>, <code>&amp;mut self</code>, <code>self</code>이면 <strong>메서드</strong>이고, 아니면 <strong>연관 함수</strong>(생성자 등)다. 타입 자신은 <code>Self</code>로 쓴다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 25\nstruct Rect {\n    w: i32,\n    h: i32,\n}\n\nimpl Rect {\n    fn new(w: i32, h: i32) Self {        // 연관 함수\n        Rect { w: w, h: h }\n    }\n\n    fn area(&amp;self) i32 {                 // 읽기 메서드\n        self.w * self.h\n    }\n\n    fn grow(&amp;mut self, d: i32) {         // 수정 메서드\n        self.w += d\n        self.h += d\n    }\n\n    fn into_perimeter(self) i32 {        // 값을 소비하는 메서드\n        2 * (self.w + self.h)\n    }\n}\n\nfn main() i32 {\n    mut r = Rect::new(2, 3)\n    r.grow(1)                            // 3 x 4\n    let a = r.area()                     // 12\n    a + r.into_perimeter() - 1           // 12 + 14 - 1\n}\n</code></pre></div>\n<p>호출 규칙:</p>\n<table>\n<thead>\n<tr>\n<th>형태</th>\n<th>호출</th>\n<th>하는 일</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>&amp;self</code></td>\n<td><code>r.area()</code></td>\n<td>자동으로 <code>&amp;r</code>을 빌린다</td>\n</tr>\n<tr>\n<td><code>&amp;mut self</code></td>\n<td><code>r.grow(1)</code></td>\n<td>자동으로 <code>&amp;mut r</code>을 빌린다(<code>r</code>이 <code>mut</code>여야 함)</td>\n</tr>\n<tr>\n<td><code>self</code></td>\n<td><code>r.into_perimeter()</code></td>\n<td><code>r</code>를 <strong>이동</strong>한다. 이후 <code>r</code>는 쓸 수 없다</td>\n</tr>\n<tr>\n<td>연관 함수</td>\n<td><code>Rect::new(2, 3)</code></td>\n<td>값 없이 타입으로 부른다</td>\n</tr>\n</tbody>\n</table>\n<p>메서드는 <code>Rect::area(&amp;r)</code>처럼 함수 형태로도 부를 수 있다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 8\nstruct A { x: i32 }\nimpl A {\n    fn get(&amp;self) i32 { self.x }\n}\n\nfn main() i32 {\n    let a = A { x: 4 }\n    a.get() + A::get(&amp;a)\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"self값-메서드는-이동한다\" id=\"book-structs-and-methods--self값-메서드는-이동한다\"><code>self</code>(값) 메서드는 이동한다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-structs-and-methods--self값-메서드는-이동한다\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: use of moved value `b`\nstruct Buf { data: String }\nimpl Buf {\n    fn into_len(self) i32 { self.data.len as i32 }\n}\n\nfn main() i32 {\n    let b = Buf { data: string_from(\"x\") }\n    let a = b.into_len()\n    a + b.into_len()\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"빌림-검사는-메서드에도-그대로\" id=\"book-structs-and-methods--빌림-검사는-메서드에도-그대로\">빌림 검사는 메서드에도 그대로<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-structs-and-methods--빌림-검사는-메서드에도-그대로\">¶</a></h3>\n<p><code>&amp;self</code> 메서드가 돌려준 참조가 살아 있는 동안 <code>&amp;mut self</code> 메서드를 부를 수 없다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot borrow `b` as mutable because it is also borrowed as immutable\nstruct Buf { data: String }\nimpl Buf {\n    fn view(&amp;self) str { as_str(&amp;self.data) }\n    fn clear(&amp;mut self) { self.data = string_from(\"\") }\n}\n\nfn main() i32 {\n    mut b = Buf { data: string_from(\"xyz\") }\n    let v = b.view()\n    b.clear()\n    v.len as i32\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"impl의-제약\" id=\"book-structs-and-methods--impl의-제약\"><code>impl</code>의 제약<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-structs-and-methods--impl의-제약\">¶</a></h3>\n<ul>\n<li><code>impl</code>은 <strong>같은 파일에 있는 구조체</strong>에만 붙인다. 제네릭은 <a href=\"#doc-book-generics\">13장</a>에서, 트레이트는 아직 없다.</li>\n<li>임시값(<code>make().get()</code>)에 <code>&amp;self</code> 메서드를 바로 부를 수 없다. 변수에 먼저 담는다.</li>\n<li><code>pub</code>은 <code>impl</code>이 아니라 <strong>함수마다</strong> 붙인다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"63-힙을-가진-구조체의-메서드\" id=\"book-structs-and-methods--63-힙을-가진-구조체의-메서드\">6.3 힙을 가진 구조체의 메서드<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-structs-and-methods--63-힙을-가진-구조체의-메서드\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 50\nstruct Buf {\n    data: String,\n    n: i32,\n}\n\nimpl Buf {\n    fn new(s: str) Self { Buf { data: string_from(s), n: 0 } }\n    fn add(&amp;mut self, c: u8) { string_push(&amp;mut self.data, c); self.n += 1 }\n    fn size(&amp;self) i32 { self.data.len as i32 + self.n }\n    fn into_len(self) i32 { self.data.len as i32 }\n    fn view(&amp;self) str { as_str(&amp;self.data) }\n}\n\nfn main() i32 {\n    mut b = Buf::new(\"ab\")\n    b.add(99)\n    b.add(100)\n    let k = b.view().len as i32        // 4\n    let s = b.size()                   // 4 + 2\n    k * 10 + s + b.into_len()          // 40 + 6 + 4\n}\n</code></pre></div>\n<p><code>Buf</code>가 스코프를 벗어나거나 <code>into_len</code>에서 소비될 때 안의 <code>String</code>도 자동으로 해제된다.</p>\n<h2 class=\"doc-heading\" data-slug=\"64-메서드-체인\" id=\"book-structs-and-methods--64-메서드-체인\">6.4 메서드 체인<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-structs-and-methods--64-메서드-체인\">¶</a></h2>\n<p>줄을 <code>.</code>으로 시작하면 앞 줄에 이어진다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nstruct Acc { n: i32 }\nimpl Acc {\n    fn add(&amp;mut self, k: i32) { self.n += k }\n    fn get(&amp;self) i32 { self.n }\n}\n\nstruct Wrap { a: Acc }\n\nfn main() i32 {\n    mut w = Wrap { a: Acc { n: 1 } }\n    w.a.add(3)\n    w.a.add(5)\n    w.a.get()\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"65-연습\" id=\"book-structs-and-methods--65-연습\">6.5 연습<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-structs-and-methods--65-연습\">¶</a></h2>\n<p><code>Stack</code>을 만들어 보자. 고정 용량 배열과 길이를 가진다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nstruct Stack {\n    items: [i32; 8],\n    len: u64,\n}\n\nimpl Stack {\n    fn new() Self { Stack { items: [0; 8], len: 0 } }\n\n    fn push(&amp;mut self, v: i32) {\n        self.items[self.len] = v        // 경계를 넘으면 trap\n        self.len += 1\n    }\n\n    fn pop(&amp;mut self) Option&lt;i32&gt; {\n        if self.len == 0 { return None }\n        self.len -= 1\n        Some(self.items[self.len])\n    }\n}\n\nfn main() i32 {\n    mut s = Stack::new()\n    s.push(1)\n    s.push(2)\n    s.push(3)\n    let a = s.pop().unwrap_or(0)      // 3\n    let b = s.pop().unwrap_or(0)      // 2\n    a + b + s.pop().unwrap_or(0)      // 3 + 2 + 1\n}\n</code></pre></div>\n<p>(<code>Option</code>은 <a href=\"#doc-book-error-handling\">8장</a>에서 자세히 본다.)</p>\n<p>→ <a href=\"#doc-book-arrays-and-slices\">7. 배열과 슬라이스</a></p>\n", "text": "6. 구조체와 메서드 ¶ 6.1 구조체 ¶ 관련된 값을 묶는다. 필드는 쉼표나 줄바꿈으로 구분한다. TAM 복사 // exit: 7\nstruct Point {\n    x: i32,\n    y: i32,\n}\n\nfn main() i32 {\n    let p = Point { x: 3, y: 4 }\n    p.x + p.y\n} 리터럴은 모든 필드를 한 번씩 , 순서 없이 쓴다. 필드는 항상 공개다(필드 단위 pub 은 없다). 구조체는 다른 구조체, 배열, String , 참조, 포인터, Result / Option 을 필드로 가질 수 있다. 자기 자신을 값으로 포함할 수는 없다. TAM 복사 // exit: 6\nstruct Point { x: i32, y: i32 }\n\nstruct Rect {\n    min: Point\n    max: Point\n}\n\nfn area(r: &Rect) i32 {\n    (r.max.x - r.min.x) * (r.max.y - r.min.y)\n}\n\nfn main() i32 {\n    let r = Rect { min: Point { x: 0, y: 0 }, max: Point { x: 3, y: 2 } }\n    area(&r)\n} 가변 필드 ¶ 필드를 바꾸려면 구조체 변수가 mut 여야 한다. TAM 복사 // exit: 9\nstruct Counter { n: i32 }\n\nfn main() i32 {\n    mut c = Counter { n: 4 }\n    c.n += 5\n    c.n\n} TAM,ERROR 복사 // error: cannot assign to a field of immutable variable `c`\nstruct Counter { n: i32 }\n\nfn main() i32 {\n    let c = Counter { n: 4 }\n    c.n = 5\n    c.n\n} 이동 타입 ¶ 구조체는 이동 타입 이다. 복사하려면 필드를 읽어 새로 만든다. TAM 복사 // exit: 6\nstruct P { x: i32, y: i32 }\n\nfn copy(p: &P) P {\n    P { x: p.x, y: p.y }\n}\n\nfn main() i32 {\n    let a = P { x: 1, y: 2 }\n    let b = copy(&a)         // a는 그대로 쓸 수 있다\n    a.x + a.y + b.x + b.y\n} 조건 안의 구조체 리터럴 ¶ if , while , match 의 조건 자리에서는 Name { 를 리터럴로 읽지 않는다(블록과 구분하기 위해). 필요하면 괄호로 감싼다. TAM 복사 // exit: 1\nstruct P { x: i32 }\n\nfn main() i32 {\n    let p = P { x: 2 }\n    if (P { x: 2 }).x == p.x { 1 } else { 0 }\n} 6.2 impl : 메서드와 연관 함수 ¶ impl 타입 { ... } 안에 함수를 둔다. 첫 매개변수가 &self , &mut self , self 이면 메서드 이고, 아니면 연관 함수 (생성자 등)다. 타입 자신은 Self 로 쓴다. TAM 복사 // exit: 25\nstruct Rect {\n    w: i32,\n    h: i32,\n}\n\nimpl Rect {\n    fn new(w: i32, h: i32) Self {        // 연관 함수\n        Rect { w: w, h: h }\n    }\n\n    fn area(&self) i32 {                 // 읽기 메서드\n        self.w * self.h\n    }\n\n    fn grow(&mut self, d: i32) {         // 수정 메서드\n        self.w += d\n        self.h += d\n    }\n\n    fn into_perimeter(self) i32 {        // 값을 소비하는 메서드\n        2 * (self.w + self.h)\n    }\n}\n\nfn main() i32 {\n    mut r = Rect::new(2, 3)\n    r.grow(1)                            // 3 x 4\n    let a = r.area()                     // 12\n    a + r.into_perimeter() - 1           // 12 + 14 - 1\n} 호출 규칙: 형태 호출 하는 일 &self r.area() 자동으로 &r 을 빌린다 &mut self r.grow(1) 자동으로 &mut r 을 빌린다( r 이 mut 여야 함) self r.into_perimeter() r 를 이동 한다. 이후 r 는 쓸 수 없다 연관 함수 Rect::new(2, 3) 값 없이 타입으로 부른다 메서드는 Rect::area(&r) 처럼 함수 형태로도 부를 수 있다. TAM 복사 // exit: 8\nstruct A { x: i32 }\nimpl A {\n    fn get(&self) i32 { self.x }\n}\n\nfn main() i32 {\n    let a = A { x: 4 }\n    a.get() + A::get(&a)\n} self (값) 메서드는 이동한다 ¶ TAM,ERROR 복사 // error: use of moved value `b`\nstruct Buf { data: String }\nimpl Buf {\n    fn into_len(self) i32 { self.data.len as i32 }\n}\n\nfn main() i32 {\n    let b = Buf { data: string_from(\"x\") }\n    let a = b.into_len()\n    a + b.into_len()\n} 빌림 검사는 메서드에도 그대로 ¶ &self 메서드가 돌려준 참조가 살아 있는 동안 &mut self 메서드를 부를 수 없다. TAM,ERROR 복사 // error: cannot borrow `b` as mutable because it is also borrowed as immutable\nstruct Buf { data: String }\nimpl Buf {\n    fn view(&self) str { as_str(&self.data) }\n    fn clear(&mut self) { self.data = string_from(\"\") }\n}\n\nfn main() i32 {\n    mut b = Buf { data: string_from(\"xyz\") }\n    let v = b.view()\n    b.clear()\n    v.len as i32\n} impl 의 제약 ¶ impl 은 같은 파일에 있는 구조체 에만 붙인다. 제네릭은 13장 에서, 트레이트는 아직 없다. 임시값( make().get() )에 &self 메서드를 바로 부를 수 없다. 변수에 먼저 담는다. pub 은 impl 이 아니라 함수마다 붙인다. 6.3 힙을 가진 구조체의 메서드 ¶ TAM 복사 // exit: 50\nstruct Buf {\n    data: String,\n    n: i32,\n}\n\nimpl Buf {\n    fn new(s: str) Self { Buf { data: string_from(s), n: 0 } }\n    fn add(&mut self, c: u8) { string_push(&mut self.data, c); self.n += 1 }\n    fn size(&self) i32 { self.data.len as i32 + self.n }\n    fn into_len(self) i32 { self.data.len as i32 }\n    fn view(&self) str { as_str(&self.data) }\n}\n\nfn main() i32 {\n    mut b = Buf::new(\"ab\")\n    b.add(99)\n    b.add(100)\n    let k = b.view().len as i32        // 4\n    let s = b.size()                   // 4 + 2\n    k * 10 + s + b.into_len()          // 40 + 6 + 4\n} Buf 가 스코프를 벗어나거나 into_len 에서 소비될 때 안의 String 도 자동으로 해제된다. 6.4 메서드 체인 ¶ 줄을 . 으로 시작하면 앞 줄에 이어진다. TAM 복사 // exit: 9\nstruct Acc { n: i32 }\nimpl Acc {\n    fn add(&mut self, k: i32) { self.n += k }\n    fn get(&self) i32 { self.n }\n}\n\nstruct Wrap { a: Acc }\n\nfn main() i32 {\n    mut w = Wrap { a: Acc { n: 1 } }\n    w.a.add(3)\n    w.a.add(5)\n    w.a.get()\n} 6.5 연습 ¶ Stack 을 만들어 보자. 고정 용량 배열과 길이를 가진다. TAM 복사 // exit: 6\nstruct Stack {\n    items: [i32; 8],\n    len: u64,\n}\n\nimpl Stack {\n    fn new() Self { Stack { items: [0; 8], len: 0 } }\n\n    fn push(&mut self, v: i32) {\n        self.items[self.len] = v        // 경계를 넘으면 trap\n        self.len += 1\n    }\n\n    fn pop(&mut self) Option<i32> {\n        if self.len == 0 { return None }\n        self.len -= 1\n        Some(self.items[self.len])\n    }\n}\n\nfn main() i32 {\n    mut s = Stack::new()\n    s.push(1)\n    s.push(2)\n    s.push(3)\n    let a = s.pop().unwrap_or(0)      // 3\n    let b = s.pop().unwrap_or(0)      // 2\n    a + b + s.pop().unwrap_or(0)      // 3 + 2 + 1\n} ( Option 은 8장 에서 자세히 본다.) → 7. 배열과 슬라이스", "source": "docs/book/06-structs-and-methods.md"}, {"key": "book-arrays-and-slices", "path": "docs/book/07-arrays-and-slices.md", "nav": "배열과 슬라이스", "title": "7. 배열과 슬라이스 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"7-배열과-슬라이스\" id=\"book-arrays-and-slices--7-배열과-슬라이스\">7. 배열과 슬라이스<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-arrays-and-slices--7-배열과-슬라이스\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"71-배열-t-n\" id=\"book-arrays-and-slices--71-배열-t-n\">7.1 배열 <code>[T; N]</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-arrays-and-slices--71-배열-t-n\">¶</a></h2>\n<p>고정 길이 배열이다. 길이는 <strong>1 이상의 정수 리터럴</strong>이고 타입의 일부다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn main() i32 {\n    let a = [1, 2, 3]            // [i32; 3]\n    let z = [0; 4]               // 0이 4개. [i32; 4]\n    a[0] + a[1] + a[2] + z[3]\n}\n</code></pre></div>\n<p>타입을 쓰려면 <code>[원소; 길이]</code>다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let bytes: [u8; 4] = [0; 4]\n    let grid: [[i32; 3]; 2] = [[0; 3]; 2]\n    (bytes[3] as i32) + grid[1][2]\n}\n</code></pre></div>\n<ul>\n<li>원소를 쓰려면 <code>mut</code>로 선언한다: <code>mut a = [0; 8]</code>, <code>a[i] = v</code>.</li>\n<li>인덱스는 <strong>어떤 정수형이든</strong> 된다.</li>\n<li>원소 타입은 정수, <code>f64</code>, <code>bool</code>, 포인터, 그것들의 배열, 그것들만 가진 구조체다. <code>String</code>이나 참조의 배열은 안 된다.</li>\n<li>길이는 <code>.len</code>(<code>u64</code>)이다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"경계-검사\" id=\"book-arrays-and-slices--경계-검사\">경계 검사<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-arrays-and-slices--경계-검사\">¶</a></h3>\n<p>범위를 벗어난 인덱스는 <strong>실행 시간에 trap</strong>한다. 길이와 인덱스가 둘 다 상수이면 <strong>컴파일 오류</strong>다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: index out of bounds\nfn main() i32 {\n    let a = [1, 2, 3]\n    a[5]\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: index out of bounds\nfn main() i32 {\n    let a = [1, 2, 3]\n    let i = a.len + 2\n    a[i]\n}\n</code></pre></div>\n<p>음수 인덱스(부호 있는 정수)도 trap이다. 경계를 넘는 읽기·쓰기는 <strong>절대로 조용히 일어나지 않는다.</strong></p>\n<h3 class=\"doc-heading\" data-slug=\"배열은-이동-타입이다\" id=\"book-arrays-and-slices--배열은-이동-타입이다\">배열은 이동 타입이다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-arrays-and-slices--배열은-이동-타입이다\">¶</a></h3>\n<p>값 전달과 대입은 이동(복사 비용이 큰 LLVM 집합체 복사)이다. 큰 배열은 참조나 슬라이스로 넘긴다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: use of moved value `a`\nfn main() i32 {\n    let a = [1, 2]\n    let b = a\n    a[0] + b[0]\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"72-슬라이스-t\" id=\"book-arrays-and-slices--72-슬라이스-t\">7.2 슬라이스 <code>&amp;[T]</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-arrays-and-slices--72-슬라이스-t\">¶</a></h2>\n<p><strong>슬라이스</strong>는 배열의 일부를 가리키는 참조(포인터 + 길이)다. 배열 크기에 무관한 함수를 쓰게 해 준다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 15\nfn sum(a: &amp;[i32]) i32 {\n    mut s = 0\n    for i in 0..a.len { s += a[i] }\n    s\n}\n\nfn main() i32 {\n    let a = [1, 2, 3, 4, 5]\n    sum(&amp;a)                    // &amp;배열 → &amp;[i32] 자동 변환(함수 인자 자리)\n}\n</code></pre></div>\n<p>슬라이스 만들기:</p>\n<table>\n<thead>\n<tr>\n<th>식</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>&amp;a[..]</code></td>\n<td>전체</td>\n</tr>\n<tr>\n<td><code>&amp;a[lo..hi]</code></td>\n<td><code>lo</code>부터 <code>hi</code> 직전까지</td>\n</tr>\n<tr>\n<td><code>&amp;a[lo..]</code>, <code>&amp;a[..hi]</code></td>\n<td>한쪽 끝까지</td>\n</tr>\n<tr>\n<td><code>&amp;mut a[..]</code></td>\n<td>쓰기 슬라이스</td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nfn main() i32 {\n    let a = [10, 20, 30, 40, 50]\n    let mid = &amp;a[1..4]            // [20, 30, 40]\n    mid.len as i32 * 3            // 길이는 3\n}\n</code></pre></div>\n<p>범위가 배열을 넘거나 <code>lo &gt; hi</code>이면 trap한다.</p>\n<h3 class=\"doc-heading\" data-slug=\"쓰기-슬라이스\" id=\"book-arrays-and-slices--쓰기-슬라이스\">쓰기 슬라이스<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-arrays-and-slices--쓰기-슬라이스\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nfn fill(a: &amp;mut [i32], v: i32) {\n    for i in 0..a.len { a[i] = v }\n}\n\nfn main() i32 {\n    mut a = [1, 2, 3, 4, 5]\n    fill(&amp;mut a[1..3], 9)         // 가운데 두 개만 9로\n    a[1] + a[2] - 9\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"for로-순회\" id=\"book-arrays-and-slices--for로-순회\"><code>for</code>로 순회<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-arrays-and-slices--for로-순회\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn main() i32 {\n    let a = [1, 2, 3]\n    mut s = 0\n    for x in &amp;a[..] { s += x }    // x는 원소의 복사본(값)\n    s\n}\n</code></pre></div>\n<p>원소를 바꾸려면 인덱스로 순회한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 12\nfn main() i32 {\n    mut a = [1, 2, 3]\n    for i in 0..a.len { a[i] *= 2 }\n    a[0] + a[1] + a[2]\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"73-빌림-규칙은-슬라이스에도\" id=\"book-arrays-and-slices--73-빌림-규칙은-슬라이스에도\">7.3 빌림 규칙은 슬라이스에도<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-arrays-and-slices--73-빌림-규칙은-슬라이스에도\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot assign to `a[..]` because it is borrowed\nfn main() i32 {\n    mut a = [1, 2, 3]\n    let s = &amp;a[..]\n    a[0] = 9\n    s[0]\n}\n</code></pre></div>\n<p>지역 배열의 슬라이스를 반환할 수도 없다(댕글링). 배열 원소는 <strong>구분하지 않으므로</strong> <code>&amp;mut a[0]</code>과 <code>&amp;mut a[1]</code>을 동시에 만들 수 없다. 두 원소를 바꾸려면 하나씩 차례로 한다.</p>\n<h2 class=\"doc-heading\" data-slug=\"74-예-삽입-정렬\" id=\"book-arrays-and-slices--74-예-삽입-정렬\">7.4 예: 삽입 정렬<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-arrays-and-slices--74-예-삽입-정렬\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 1\nfn sort(a: &amp;mut [i64]) {\n    mut i: u64 = 1\n    while i &lt; a.len {\n        let key = a[i]\n        mut j = i\n        while j &gt; 0 &amp;&amp; a[j - 1] &gt; key {\n            a[j] = a[j - 1]\n            j -= 1\n        }\n        a[j] = key\n        i += 1\n    }\n}\n\nfn main() i32 {\n    mut a: [i64; 6] = [5, 2, 9, 1, 7, 3]\n    sort(&amp;mut a[..])\n    mut ok = 1\n    for i in 1..6 { if a[i - 1] &gt; a[i] { ok = 0 } }\n    ok\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"75-문자열과-바이트\" id=\"book-arrays-and-slices--75-문자열과-바이트\">7.5 문자열과 바이트<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-arrays-and-slices--75-문자열과-바이트\">¶</a></h2>\n<p><code>str</code>과 <code>String</code>은 바이트 열이지만 인덱싱(<code>s[i]</code>)이 없다. 바이트를 읽으려면 <code>s.ptr</code>와 <code>unsafe</code>가 필요하다(<a href=\"#doc-book-unsafe-and-systems\">10장</a>).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 2\nfn count_byte(s: str, b: u8) i32 {\n    mut n = 0\n    for i in 0..s.len {\n        if unsafe { *(s.ptr + i) } == b { n += 1 }\n    }\n    n\n}\n\nfn main() i32 {\n    count_byte(\"hello\", 108)       // 'l'이 두 번\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"751-한계\" id=\"book-arrays-and-slices--751-한계\">7.5.1 한계<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-arrays-and-slices--751-한계\">¶</a></h2>\n<ul>\n<li>슬라이스·배열의 <code>==</code> 비교는 없다. 원소를 하나씩 비교한다.</li>\n<li>길이 0 배열과 상수 식 길이(<code>[T; N * 2]</code>)는 없다.</li>\n<li>가변 길이 컬렉션(<code>Vec</code>)은 아직 없다. <code>alloc</code>으로 직접 만들 수 있다(<a href=\"#doc-book-unsafe-and-systems\">10장</a>).</li>\n</ul>\n<p>→ <a href=\"#doc-book-error-handling\">8. 오류 처리</a></p>\n", "text": "7. 배열과 슬라이스 ¶ 7.1 배열 [T; N] ¶ 고정 길이 배열이다. 길이는 1 이상의 정수 리터럴 이고 타입의 일부다. TAM 복사 // exit: 6\nfn main() i32 {\n    let a = [1, 2, 3]            // [i32; 3]\n    let z = [0; 4]               // 0이 4개. [i32; 4]\n    a[0] + a[1] + a[2] + z[3]\n} 타입을 쓰려면 [원소; 길이] 다. TAM 복사 // exit: 0\nfn main() i32 {\n    let bytes: [u8; 4] = [0; 4]\n    let grid: [[i32; 3]; 2] = [[0; 3]; 2]\n    (bytes[3] as i32) + grid[1][2]\n} 원소를 쓰려면 mut 로 선언한다: mut a = [0; 8] , a[i] = v . 인덱스는 어떤 정수형이든 된다. 원소 타입은 정수, f64 , bool , 포인터, 그것들의 배열, 그것들만 가진 구조체다. String 이나 참조의 배열은 안 된다. 길이는 .len ( u64 )이다. 경계 검사 ¶ 범위를 벗어난 인덱스는 실행 시간에 trap 한다. 길이와 인덱스가 둘 다 상수이면 컴파일 오류 다. TAM,ERROR 복사 // error: index out of bounds\nfn main() i32 {\n    let a = [1, 2, 3]\n    a[5]\n} TAM,TRAP 복사 // panic: index out of bounds\nfn main() i32 {\n    let a = [1, 2, 3]\n    let i = a.len + 2\n    a[i]\n} 음수 인덱스(부호 있는 정수)도 trap이다. 경계를 넘는 읽기·쓰기는 절대로 조용히 일어나지 않는다. 배열은 이동 타입이다 ¶ 값 전달과 대입은 이동(복사 비용이 큰 LLVM 집합체 복사)이다. 큰 배열은 참조나 슬라이스로 넘긴다. TAM,ERROR 복사 // error: use of moved value `a`\nfn main() i32 {\n    let a = [1, 2]\n    let b = a\n    a[0] + b[0]\n} 7.2 슬라이스 &[T] ¶ 슬라이스 는 배열의 일부를 가리키는 참조(포인터 + 길이)다. 배열 크기에 무관한 함수를 쓰게 해 준다. TAM 복사 // exit: 15\nfn sum(a: &[i32]) i32 {\n    mut s = 0\n    for i in 0..a.len { s += a[i] }\n    s\n}\n\nfn main() i32 {\n    let a = [1, 2, 3, 4, 5]\n    sum(&a)                    // &배열 → &[i32] 자동 변환(함수 인자 자리)\n} 슬라이스 만들기: 식 의미 &a[..] 전체 &a[lo..hi] lo 부터 hi 직전까지 &a[lo..] , &a[..hi] 한쪽 끝까지 &mut a[..] 쓰기 슬라이스 TAM 복사 // exit: 9\nfn main() i32 {\n    let a = [10, 20, 30, 40, 50]\n    let mid = &a[1..4]            // [20, 30, 40]\n    mid.len as i32 * 3            // 길이는 3\n} 범위가 배열을 넘거나 lo > hi 이면 trap한다. 쓰기 슬라이스 ¶ TAM 복사 // exit: 9\nfn fill(a: &mut [i32], v: i32) {\n    for i in 0..a.len { a[i] = v }\n}\n\nfn main() i32 {\n    mut a = [1, 2, 3, 4, 5]\n    fill(&mut a[1..3], 9)         // 가운데 두 개만 9로\n    a[1] + a[2] - 9\n} for 로 순회 ¶ TAM 복사 // exit: 6\nfn main() i32 {\n    let a = [1, 2, 3]\n    mut s = 0\n    for x in &a[..] { s += x }    // x는 원소의 복사본(값)\n    s\n} 원소를 바꾸려면 인덱스로 순회한다. TAM 복사 // exit: 12\nfn main() i32 {\n    mut a = [1, 2, 3]\n    for i in 0..a.len { a[i] *= 2 }\n    a[0] + a[1] + a[2]\n} 7.3 빌림 규칙은 슬라이스에도 ¶ TAM,ERROR 복사 // error: cannot assign to `a[..]` because it is borrowed\nfn main() i32 {\n    mut a = [1, 2, 3]\n    let s = &a[..]\n    a[0] = 9\n    s[0]\n} 지역 배열의 슬라이스를 반환할 수도 없다(댕글링). 배열 원소는 구분하지 않으므로 &mut a[0] 과 &mut a[1] 을 동시에 만들 수 없다. 두 원소를 바꾸려면 하나씩 차례로 한다. 7.4 예: 삽입 정렬 ¶ TAM 복사 // exit: 1\nfn sort(a: &mut [i64]) {\n    mut i: u64 = 1\n    while i < a.len {\n        let key = a[i]\n        mut j = i\n        while j > 0 && a[j - 1] > key {\n            a[j] = a[j - 1]\n            j -= 1\n        }\n        a[j] = key\n        i += 1\n    }\n}\n\nfn main() i32 {\n    mut a: [i64; 6] = [5, 2, 9, 1, 7, 3]\n    sort(&mut a[..])\n    mut ok = 1\n    for i in 1..6 { if a[i - 1] > a[i] { ok = 0 } }\n    ok\n} 7.5 문자열과 바이트 ¶ str 과 String 은 바이트 열이지만 인덱싱( s[i] )이 없다. 바이트를 읽으려면 s.ptr 와 unsafe 가 필요하다( 10장 ). TAM 복사 // exit: 2\nfn count_byte(s: str, b: u8) i32 {\n    mut n = 0\n    for i in 0..s.len {\n        if unsafe { *(s.ptr + i) } == b { n += 1 }\n    }\n    n\n}\n\nfn main() i32 {\n    count_byte(\"hello\", 108)       // 'l'이 두 번\n} 7.5.1 한계 ¶ 슬라이스·배열의 == 비교는 없다. 원소를 하나씩 비교한다. 길이 0 배열과 상수 식 길이( [T; N * 2] )는 없다. 가변 길이 컬렉션( Vec )은 아직 없다. alloc 으로 직접 만들 수 있다( 10장 ). → 8. 오류 처리", "source": "docs/book/07-arrays-and-slices.md"}, {"key": "book-error-handling", "path": "docs/book/08-error-handling.md", "nav": "오류 처리", "title": "8. 오류 처리 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"8-오류-처리\" id=\"book-error-handling--8-오류-처리\">8. 오류 처리<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-error-handling--8-오류-처리\">¶</a></h1>\n<p>TAM에는 예외가 없다. 실패할 수 있는 일은 <strong>값</strong>으로 표현한다.</p>\n<table>\n<thead>\n<tr>\n<th>상황</th>\n<th>도구</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>값이 있을 수도 없을 수도 있다</td>\n<td><code>Option&lt;T&gt;</code></td>\n</tr>\n<tr>\n<td>성공 또는 이유 있는 실패</td>\n<td><code>Result&lt;T, E&gt;</code></td>\n</tr>\n<tr>\n<td>프로그램 버그, 복구 불가능한 상태</td>\n<td>패닉(<code>panic</code>, <code>assert</code>, <code>unwrap</code>)과 trap</td>\n</tr>\n</tbody>\n</table>\n<h2 class=\"doc-heading\" data-slug=\"81-option\" id=\"book-error-handling--81-option\">8.1 <code>Option&lt;T&gt;</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-error-handling--81-option\">¶</a></h2>\n<p>값이 있으면 <code>Some(값)</code>, 없으면 <code>None</code>이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 2\nfn find(a: &amp;[i32], x: i32) Option&lt;i32&gt; {\n    for i in 0..a.len {\n        if a[i] == x { return Some(i as i32) }\n    }\n    None\n}\n\nfn main() i32 {\n    let a = [5, 6, 7]\n    match find(&amp;a, 7) {\n        Some(i) =&gt; i\n        None =&gt; 100\n    }\n}\n</code></pre></div>\n<ul>\n<li><code>Some</code>, <code>None</code>은 <strong>타입이 정해진 자리</strong>(함수 반환, 인자, 타입을 쓴 <code>let</code>)에서 쓴다. <code>Some(5)</code>는 인자에서 타입을 추론하므로 <code>let o = Some(5)</code>도 된다. <code>None</code>만 있는 <code>let n = None</code>은 타입을 알 수 없어 <code>let n: Option&lt;i32&gt; = None</code>으로 쓴다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"82-result\" id=\"book-error-handling--82-result\">8.2 <code>Result&lt;T, E&gt;</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-error-handling--82-result\">¶</a></h2>\n<p>성공이면 <code>Ok(값)</code>, 실패면 <code>Err(오류)</code>다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 4\nfn div(a: i32, b: i32) Result&lt;i32, i32&gt; {\n    if b == 0 { return Err(1) }     // 1: 0으로 나눔\n    Ok(a / b)\n}\n\nfn main() i32 {\n    match div(8, 2) {\n        Ok(v) =&gt; v\n        Err(code) =&gt; 0 - code\n    }\n}\n</code></pre></div>\n<p>오류 타입 <code>E</code>는 무엇이든 된다. 관례적으로 정수 코드나 구조체를 쓴다.</p>\n<h2 class=\"doc-heading\" data-slug=\"83-match\" id=\"book-error-handling--83-match\">8.3 <code>match</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-error-handling--83-match\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>match 값 {\n    Ok(이름) =&gt; 식\n    Err(이름) =&gt; 식\n}\n</code></pre></div>\n<ul>\n<li>두 팔(<code>Ok</code>/<code>Err</code> 또는 <code>Some</code>/<code>None</code>)을 <strong>정확히 한 번씩</strong> 쓴다. 빠지면 컴파일 오류다.</li>\n<li>각 팔의 값은 같은 타입이어야 하고 <code>match</code> 전체가 그 값을 가진다.</li>\n<li>팔의 본문은 식이거나 <code>{ }</code> 블록이다.</li>\n<li><code>Ok/Err</code>와 <code>Some/None</code>을 한 <code>match</code>에 섞을 수 없다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: `match` is missing the `None` arm\nfn main() i32 {\n    let o: Option&lt;i32&gt; = None\n    match o {\n        Some(v) =&gt; v\n    }\n}\n</code></pre></div>\n<p><code>match</code> 대상이 힙 값을 가지면 바인딩이 소유권을 <strong>가져간다.</strong></p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nfn main() i32 {\n    let o = Some(string_from(\"abc\"))\n    match o {\n        Some(s) =&gt; s.len as i32     // s가 String을 소유. 이 팔이 끝나면 해제\n        None =&gt; 0\n    }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"84-연산자-오류-전파\" id=\"book-error-handling--84-연산자-오류-전파\">8.4 <code>?</code> 연산자: 오류 전파<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-error-handling--84-연산자-오류-전파\">¶</a></h2>\n<p><code>식?</code>는 <code>Ok(v)</code>면 <code>v</code>를 꺼내고, <code>Err(e)</code>면 <strong>현재 함수에서 즉시 <code>Err(e)</code>를 반환</strong>한다. 오류를 일일이 <code>match</code>하지 않아도 된다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 25\nfn div(a: i32, b: i32) Result&lt;i32, i32&gt; {\n    if b == 0 { return Err(1) }\n    Ok(a / b)\n}\n\nfn calc(a: i32, b: i32, c: i32) Result&lt;i32, i32&gt; {\n    let x = div(a, b)?           // 실패하면 여기서 반환\n    let y = div(x, c)?\n    Ok(x + y)\n}\n\nfn main() i32 {\n    match calc(100, 5, 4) {      // 20 + 5\n        Ok(v) =&gt; v\n        Err(e) =&gt; 100 + e\n    }\n}\n</code></pre></div>\n<p>규칙:</p>\n<ul>\n<li>함수의 반환 타입이 <code>Result&lt;_, E&gt;</code>이고 <strong>오류 타입 <code>E</code>가 정확히 같아야</strong> 한다. 자동 변환(<code>From</code>)은 없다.</li>\n<li><code>Option</code>을 돌려주는 함수 안에서는 <code>Option</code>에 <code>?</code>를 쓴다(<code>None</code>이면 즉시 <code>None</code> 반환). <code>Option</code>과 <code>Result</code>를 섞을 수 없다.</li>\n<li><code>?</code>로 일찍 빠져나갈 때도 <strong>살아 있는 지역 변수는 모두 해제</strong>된다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: `?` can only be used\nfn f() Result&lt;i32, i32&gt; { Ok(1) }\n\nfn main() i32 {\n    let x = f()?\n    x\n}\n</code></pre></div>\n<p>(<code>main</code>은 <code>i32</code>를 돌려주므로 <code>?</code>를 쓸 수 없다. 최상위에서는 <code>match</code>로 처리한다.)</p>\n<h3 class=\"doc-heading\" data-slug=\"오류-타입이-다르면\" id=\"book-error-handling--오류-타입이-다르면\">오류 타입이 다르면<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-error-handling--오류-타입이-다르면\">¶</a></h3>\n<p>오류 타입을 맞춰 주는 변환 함수를 직접 쓴다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 12\nfn parse(n: i32) Result&lt;i32, i32&gt; {      // 오류 코드 i32\n    if n &lt; 0 { Err(1) } else { Ok(n) }\n}\n\nfn check(n: i32) Result&lt;i32, i64&gt; {      // 오류 코드 i64\n    match parse(n) {\n        Ok(v) =&gt; Ok(v * 2)\n        Err(e) =&gt; Err(e as i64)\n    }\n}\n\nfn main() i32 {\n    match check(6) { Ok(v) =&gt; v, Err(e) =&gt; e as i32 }\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"오류에도-소유권이-있다\" id=\"book-error-handling--오류에도-소유권이-있다\">오류에도 소유권이 있다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-error-handling--오류에도-소유권이-있다\">¶</a></h3>\n<p><code>Result&lt;String, i32&gt;</code>처럼 힙 값을 담으면 <code>Result</code> 자체가 이동 타입이다. <code>?</code>가 성공 값을 꺼낼 때 소유권이 넘어온다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nfn make(ok: bool) Result&lt;String, i32&gt; {\n    if !ok { return Err(9) }\n    Ok(string_from(\"hello\"))\n}\n\nfn length() Result&lt;i32, i32&gt; {\n    let s = make(true)?            // String의 소유권을 받는다\n    Ok(s.len as i32)               // s는 함수가 끝날 때 해제\n}\n\nfn main() i32 {\n    match length() { Ok(n) =&gt; n, Err(e) =&gt; e }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"85-편의-메서드\" id=\"book-error-handling--85-편의-메서드\">8.5 편의 메서드<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-error-handling--85-편의-메서드\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>메서드</th>\n<th style=\"text-align:center\"><code>Option&lt;T&gt;</code></th>\n<th style=\"text-align:center\"><code>Result&lt;T, E&gt;</code></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>is_some()</code> / <code>is_none()</code></td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\"></td>\n</tr>\n<tr>\n<td><code>is_ok()</code> / <code>is_err()</code></td>\n<td style=\"text-align:center\"></td>\n<td style=\"text-align:center\">✔</td>\n</tr>\n<tr>\n<td><code>unwrap()</code></td>\n<td style=\"text-align:center\"><code>None</code>이면 패닉</td>\n<td style=\"text-align:center\"><code>Err</code>이면 패닉</td>\n</tr>\n<tr>\n<td><code>unwrap_or(기본)</code></td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let a: Option&lt;i32&gt; = Some(4)\n    let b: Option&lt;i32&gt; = None\n    if a.unwrap() != 4 { return 1 }\n    if b.unwrap_or(9) != 9 { return 2 }\n    if !a.is_some() || !b.is_none() { return 3 }\n    let r: Result&lt;i32, i32&gt; = Err(3)\n    if r.is_ok() { return 4 }\n    if r.unwrap_or(0) != 0 { return 5 }\n    0\n}\n</code></pre></div>\n<p><code>is_*</code>는 힙을 가진 내용(<code>Option&lt;String&gt;</code>)에는 쓸 수 없다(값을 소비하기 때문). <code>match</code>를 쓴다. <code>unwrap</code>은 값을 꺼내 소유권을 가져온다.</p>\n<p><code>map</code>, <code>and_then</code> 같은 조합 메서드는 아직 없다(클로저가 없다).</p>\n<h2 class=\"doc-heading\" data-slug=\"86-패닉-복구하지-않는-실패\" id=\"book-error-handling--86-패닉-복구하지-않는-실패\">8.6 패닉: 복구하지 않는 실패<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-error-handling--86-패닉-복구하지-않는-실패\">¶</a></h2>\n<p>버그나 깨진 불변식은 <code>Result</code>로 돌려줄 일이 아니다. 프로그램을 즉시 멈춘다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: tam: panic: negative input\nfn root(n: i32) i32 {\n    if n &lt; 0 { panic(\"negative input\") }\n    n\n}\n\nfn main() i32 { root(-1) }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: assertion failed\nfn main() i32 {\n    let x = 2\n    assert(x + x == 5)\n    0\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: called `unwrap()` on a `None` value\nfn none() Option&lt;i32&gt; { None }\n\nfn main() i32 { none().unwrap() }\n</code></pre></div>\n<p>호스트에서 패닉은 stderr에 <code>tam: panic: 메시지</code>를 쓰고 <code>SIGILL</code>로 끝난다. 다음도 같은 방식으로 멈춘다: 정수 오버플로, 0 나누기, 배열 경계 위반. 자동 해제는 실행되지 않는다.</p>\n<h3 class=\"doc-heading\" data-slug=\"언제-무엇을-쓰나\" id=\"book-error-handling--언제-무엇을-쓰나\">언제 무엇을 쓰나<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-error-handling--언제-무엇을-쓰나\">¶</a></h3>\n<ul>\n<li><strong>입력이나 환경 때문에 실패할 수 있다</strong>(파일이 없다, 파싱 실패) → <code>Result</code>.</li>\n<li><strong>값이 없는 것이 정상이다</strong>(찾았더니 없다) → <code>Option</code>.</li>\n<li><strong>내가 호출 규칙을 어겼다</strong>(범위 밖 인덱스, 불가능한 상태) → <code>assert</code>/<code>panic</code>.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"87-예-파일-읽기\" id=\"book-error-handling--87-예-파일-읽기\">8.7 예: 파일 읽기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-error-handling--87-예-파일-읽기\">¶</a></h2>\n<p><code>tam.os</code>의 함수는 실패를 <code>Result&lt;_, i32&gt;</code>(OS 오류 코드)로 돌려준다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 2\nuse tam.os\n\nfn load(path: str) Result&lt;i32, i32&gt; {\n    let text = os::read_file(path)?\n    Ok(text.len as i32)\n}\n\nfn main() i32 {\n    match load(\"/definitely/missing\") {\n        Ok(n) =&gt; n\n        Err(code) =&gt; code            // ENOENT = 2\n    }\n}\n</code></pre></div>\n<p>→ <a href=\"#doc-book-modules-and-projects\">9. 모듈과 프로젝트</a></p>\n", "text": "8. 오류 처리 ¶ TAM에는 예외가 없다. 실패할 수 있는 일은 값 으로 표현한다. 상황 도구 값이 있을 수도 없을 수도 있다 Option<T> 성공 또는 이유 있는 실패 Result<T, E> 프로그램 버그, 복구 불가능한 상태 패닉( panic , assert , unwrap )과 trap 8.1 Option<T> ¶ 값이 있으면 Some(값) , 없으면 None 이다. TAM 복사 // exit: 2\nfn find(a: &[i32], x: i32) Option<i32> {\n    for i in 0..a.len {\n        if a[i] == x { return Some(i as i32) }\n    }\n    None\n}\n\nfn main() i32 {\n    let a = [5, 6, 7]\n    match find(&a, 7) {\n        Some(i) => i\n        None => 100\n    }\n} Some , None 은 타입이 정해진 자리 (함수 반환, 인자, 타입을 쓴 let )에서 쓴다. Some(5) 는 인자에서 타입을 추론하므로 let o = Some(5) 도 된다. None 만 있는 let n = None 은 타입을 알 수 없어 let n: Option<i32> = None 으로 쓴다. 8.2 Result<T, E> ¶ 성공이면 Ok(값) , 실패면 Err(오류) 다. TAM 복사 // exit: 4\nfn div(a: i32, b: i32) Result<i32, i32> {\n    if b == 0 { return Err(1) }     // 1: 0으로 나눔\n    Ok(a / b)\n}\n\nfn main() i32 {\n    match div(8, 2) {\n        Ok(v) => v\n        Err(code) => 0 - code\n    }\n} 오류 타입 E 는 무엇이든 된다. 관례적으로 정수 코드나 구조체를 쓴다. 8.3 match ¶ CODE 복사 match 값 {\n    Ok(이름) => 식\n    Err(이름) => 식\n} 두 팔( Ok / Err 또는 Some / None )을 정확히 한 번씩 쓴다. 빠지면 컴파일 오류다. 각 팔의 값은 같은 타입이어야 하고 match 전체가 그 값을 가진다. 팔의 본문은 식이거나 { } 블록이다. Ok/Err 와 Some/None 을 한 match 에 섞을 수 없다. TAM,ERROR 복사 // error: `match` is missing the `None` arm\nfn main() i32 {\n    let o: Option<i32> = None\n    match o {\n        Some(v) => v\n    }\n} match 대상이 힙 값을 가지면 바인딩이 소유권을 가져간다. TAM 복사 // exit: 3\nfn main() i32 {\n    let o = Some(string_from(\"abc\"))\n    match o {\n        Some(s) => s.len as i32     // s가 String을 소유. 이 팔이 끝나면 해제\n        None => 0\n    }\n} 8.4 ? 연산자: 오류 전파 ¶ 식? 는 Ok(v) 면 v 를 꺼내고, Err(e) 면 현재 함수에서 즉시 Err(e) 를 반환 한다. 오류를 일일이 match 하지 않아도 된다. TAM 복사 // exit: 25\nfn div(a: i32, b: i32) Result<i32, i32> {\n    if b == 0 { return Err(1) }\n    Ok(a / b)\n}\n\nfn calc(a: i32, b: i32, c: i32) Result<i32, i32> {\n    let x = div(a, b)?           // 실패하면 여기서 반환\n    let y = div(x, c)?\n    Ok(x + y)\n}\n\nfn main() i32 {\n    match calc(100, 5, 4) {      // 20 + 5\n        Ok(v) => v\n        Err(e) => 100 + e\n    }\n} 규칙: 함수의 반환 타입이 Result<_, E> 이고 오류 타입 E 가 정확히 같아야 한다. 자동 변환( From )은 없다. Option 을 돌려주는 함수 안에서는 Option 에 ? 를 쓴다( None 이면 즉시 None 반환). Option 과 Result 를 섞을 수 없다. ? 로 일찍 빠져나갈 때도 살아 있는 지역 변수는 모두 해제 된다. TAM,ERROR 복사 // error: `?` can only be used\nfn f() Result<i32, i32> { Ok(1) }\n\nfn main() i32 {\n    let x = f()?\n    x\n} ( main 은 i32 를 돌려주므로 ? 를 쓸 수 없다. 최상위에서는 match 로 처리한다.) 오류 타입이 다르면 ¶ 오류 타입을 맞춰 주는 변환 함수를 직접 쓴다. TAM 복사 // exit: 12\nfn parse(n: i32) Result<i32, i32> {      // 오류 코드 i32\n    if n < 0 { Err(1) } else { Ok(n) }\n}\n\nfn check(n: i32) Result<i32, i64> {      // 오류 코드 i64\n    match parse(n) {\n        Ok(v) => Ok(v * 2)\n        Err(e) => Err(e as i64)\n    }\n}\n\nfn main() i32 {\n    match check(6) { Ok(v) => v, Err(e) => e as i32 }\n} 오류에도 소유권이 있다 ¶ Result<String, i32> 처럼 힙 값을 담으면 Result 자체가 이동 타입이다. ? 가 성공 값을 꺼낼 때 소유권이 넘어온다. TAM 복사 // exit: 5\nfn make(ok: bool) Result<String, i32> {\n    if !ok { return Err(9) }\n    Ok(string_from(\"hello\"))\n}\n\nfn length() Result<i32, i32> {\n    let s = make(true)?            // String의 소유권을 받는다\n    Ok(s.len as i32)               // s는 함수가 끝날 때 해제\n}\n\nfn main() i32 {\n    match length() { Ok(n) => n, Err(e) => e }\n} 8.5 편의 메서드 ¶ 메서드 Option<T> Result<T, E> is_some() / is_none() ✔ is_ok() / is_err() ✔ unwrap() None 이면 패닉 Err 이면 패닉 unwrap_or(기본) ✔ ✔ TAM 복사 // exit: 0\nfn main() i32 {\n    let a: Option<i32> = Some(4)\n    let b: Option<i32> = None\n    if a.unwrap() != 4 { return 1 }\n    if b.unwrap_or(9) != 9 { return 2 }\n    if !a.is_some() || !b.is_none() { return 3 }\n    let r: Result<i32, i32> = Err(3)\n    if r.is_ok() { return 4 }\n    if r.unwrap_or(0) != 0 { return 5 }\n    0\n} is_* 는 힙을 가진 내용( Option<String> )에는 쓸 수 없다(값을 소비하기 때문). match 를 쓴다. unwrap 은 값을 꺼내 소유권을 가져온다. map , and_then 같은 조합 메서드는 아직 없다(클로저가 없다). 8.6 패닉: 복구하지 않는 실패 ¶ 버그나 깨진 불변식은 Result 로 돌려줄 일이 아니다. 프로그램을 즉시 멈춘다. TAM,TRAP 복사 // panic: tam: panic: negative input\nfn root(n: i32) i32 {\n    if n < 0 { panic(\"negative input\") }\n    n\n}\n\nfn main() i32 { root(-1) } TAM,TRAP 복사 // panic: assertion failed\nfn main() i32 {\n    let x = 2\n    assert(x + x == 5)\n    0\n} TAM,TRAP 복사 // panic: called `unwrap()` on a `None` value\nfn none() Option<i32> { None }\n\nfn main() i32 { none().unwrap() } 호스트에서 패닉은 stderr에 tam: panic: 메시지 를 쓰고 SIGILL 로 끝난다. 다음도 같은 방식으로 멈춘다: 정수 오버플로, 0 나누기, 배열 경계 위반. 자동 해제는 실행되지 않는다. 언제 무엇을 쓰나 ¶ 입력이나 환경 때문에 실패할 수 있다 (파일이 없다, 파싱 실패) → Result . 값이 없는 것이 정상이다 (찾았더니 없다) → Option . 내가 호출 규칙을 어겼다 (범위 밖 인덱스, 불가능한 상태) → assert / panic . 8.7 예: 파일 읽기 ¶ tam.os 의 함수는 실패를 Result<_, i32> (OS 오류 코드)로 돌려준다. TAM 복사 // exit: 2\nuse tam.os\n\nfn load(path: str) Result<i32, i32> {\n    let text = os::read_file(path)?\n    Ok(text.len as i32)\n}\n\nfn main() i32 {\n    match load(\"/definitely/missing\") {\n        Ok(n) => n\n        Err(code) => code            // ENOENT = 2\n    }\n} → 9. 모듈과 프로젝트", "source": "docs/book/08-error-handling.md"}, {"key": "book-modules-and-projects", "path": "docs/book/09-modules-and-projects.md", "nav": "모듈과 프로젝트", "title": "9. 모듈과 프로젝트 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"9-모듈과-프로젝트\" id=\"book-modules-and-projects--9-모듈과-프로젝트\">9. 모듈과 프로젝트<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-modules-and-projects--9-모듈과-프로젝트\">¶</a></h1>\n<p>프로그램이 커지면 파일을 나눈다. TAM에서는 <strong>파일 하나가 모듈 하나</strong>다. 더 큰 단위는 <code>Tmake.toml</code>이 관리하는 <strong>패키지</strong>와 <strong>워크스페이스</strong>다.</p>\n<h2 class=\"doc-heading\" data-slug=\"91-use와-pub\" id=\"book-modules-and-projects--91-use와-pub\">9.1 <code>use</code>와 <code>pub</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-modules-and-projects--91-use와-pub\">¶</a></h2>\n<p><code>use a.b</code>는 루트 폴더 아래의 <code>a/b.tam</code>을 불러오고, 이후 <code>b::항목</code>으로 쓴다. 다른 모듈에서 쓰이려면 항목에 <code>pub</code>을 붙인다.</p>\n<p>&lt;!-- project run exit=7 --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use geo.shapes\n\nfn main() i32 {\n    let r = shapes::Rect { w: 3, h: 2 }\n    shapes::area(&amp;r) + shapes::unit()\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/GEO/SHAPES.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/geo/shapes.tam\">pub struct Rect {\n    w: i32,\n    h: i32,\n}\n\npub fn area(r: &amp;Rect) i32 { r.w * r.h }\n\npub fn unit() i32 { helper() }\n\nfn helper() i32 { 1 }          // pub이 없으므로 이 파일 안에서만 보인다\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<p>규칙:</p>\n<ul>\n<li>모듈 경로는 <strong>한 단계</strong>다: <code>shapes::area</code>. (<code>geo::shapes::area</code>는 없다.)</li>\n<li>루트 폴더는 프로젝트에서는 패키지의 <code>src/</code>다. <code>use</code> 경로는 항상 이 루트 기준이다.</li>\n<li><code>pub</code>이 없는 항목을 밖에서 쓰면 컴파일 오류가 나며, 두 파일의 위치를 함께 보여 준다.</li>\n<li>구조체 필드는 항상 공개다.</li>\n<li>같은 모듈 이름을 두 번 가져오면(<code>use a.math</code>, <code>use b.math</code>) 오류다.</li>\n</ul>\n<p>&lt;!-- project fail=private --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use util\n\nfn main() i32 { util::secret() }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/UTIL.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/util.tam\">fn secret() i32 { 1 }\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<h2 class=\"doc-heading\" data-slug=\"92-표준-라이브러리\" id=\"book-modules-and-projects--92-표준-라이브러리\">9.2 표준 라이브러리<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-modules-and-projects--92-표준-라이브러리\">¶</a></h2>\n<p>첫 조각이 <code>tam</code>이면 파일이 아니라 컴파일러에 내장된 표준 라이브러리다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// out: hi 3\nuse tam.os\n\nfn main() i32 {\n    os::print(\"hi \")\n    os::print_int(3)\n    os::println(\"\")\n    0\n}\n</code></pre></div>\n<p>전체 API는 <a href=\"#doc-ref-stdlib\">표준 라이브러리 문서</a>를 본다.</p>\n<h2 class=\"doc-heading\" data-slug=\"93-패키지\" id=\"book-modules-and-projects--93-패키지\">9.3 패키지<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-modules-and-projects--93-패키지\">¶</a></h2>\n<p><strong>패키지</strong>는 <code>Tmake.toml</code> 하나와 <code>src/</code> 폴더다. 만들고 실행하는 가장 짧은 방법:</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc new hello\n$ cd hello\n$ tamc run\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>hello/\n├── Tmake.toml\n└── src/\n    └── main.tam\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml\">[package]\nname = \"hello\"\nversion = \"0.1.0\"\n</code></pre></div>\n<p><code>tamc build</code>는 <code>Tmake.toml</code>을 찾아 의존성 순서대로 빌드하고 <code>build/&lt;대상&gt;/&lt;프로필&gt;/</code>에 결과를 둔다. 바뀐 것이 없으면 다시 만들지 않는다(내용 해시 기반).</p>\n<h2 class=\"doc-heading\" data-slug=\"94-라이브러리-패키지와-의존성\" id=\"book-modules-and-projects--94-라이브러리-패키지와-의존성\">9.4 라이브러리 패키지와 의존성<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-modules-and-projects--94-라이브러리-패키지와-의존성\">¶</a></h2>\n<p>재사용할 코드는 <code>kind = \"lib\"</code> 패키지로 분리하고 <code>[dependencies]</code>로 가져다 쓴다. <strong>의존성 이름이 곧 모듈 이름</strong>이다(<code>-</code>는 <code>_</code>).</p>\n<p>&lt;!-- project run exit=44 --&gt;</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=APP/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=app/Tmake.toml\">[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\ntext-tools = { path = \"../text-tools\" }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=APP/SRC/MAIN.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=app/src/main.tam\">use text_tools\n\nfn main() i32 {\n    text_tools::triple(14) + 2\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML,FILE=TEXT-TOOLS/TMAKE.TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml,file=text-tools/Tmake.toml\">[package]\nname = \"text-tools\"\nversion = \"0.1.0\"\nkind = \"lib\"\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,FILE=TEXT-TOOLS/SRC/LIB.TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,file=text-tools/src/lib.tam\">pub fn triple(x: i32) i32 { x * 3 }\n</code></pre></div>\n<p>&lt;!-- /project --&gt;</p>\n<ul>\n<li>라이브러리는 <code>src/lib.tam</code>이 시작점이고 <code>main</code>이 필요 없다. 빌드할 때는 <strong>검사만</strong> 한다(코드는 이를 쓰는 실행 파일과 함께 만들어진다).</li>\n<li>의존성은 <strong>경로</strong>로만 지정한다.</li>\n<li>간접 의존성은 직접 선언해야 쓸 수 있다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"95-워크스페이스\" id=\"book-modules-and-projects--95-워크스페이스\">9.5 워크스페이스<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-modules-and-projects--95-워크스페이스\">¶</a></h2>\n<p>패키지 여러 개를 한 저장소에서 함께 다룬다. 루트 <code>Tmake.toml</code>에 <code>[workspace]</code>를 둔다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml\">[workspace]\nmembers = [\"app\", \"libs/*\"]\ndefault-members = [\"app\"]\n\n[workspace.package]\nversion = \"0.3.0\"\nlicense = \"MIT\"\n\n[workspace.dependencies]\ncore = { path = \"libs/core\", version = \"^0.3\" }\n\n[profile.release]\nopt-level = 2\n</code></pre></div>\n<p>멤버 패키지는 <code>version = { workspace = true }</code>, <code>core = { workspace = true }</code>처럼 공통 값을 물려받는다. 저장소의 <code>examples/project/</code>가 완전한 예다. 모든 필드는 <a href=\"#doc-ref-tmake\">Tmake.toml 문서</a>에 있다.</p>\n<h2 class=\"doc-heading\" data-slug=\"96-프로필과-대상\" id=\"book-modules-and-projects--96-프로필과-대상\">9.6 프로필과 대상<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-modules-and-projects--96-프로필과-대상\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc build                      # 기본: opt-level 0\n$ tamc build --release            # opt-level 2\n$ tamc build --target windows     # 다른 대상\n$ tamc build --locked             # Tmake.lock이 최신이 아니면 실패\n</code></pre></div>\n<p>의존성이 확정되면 <code>Tmake.lock</code>이 만들어진다. 저장소에 함께 올려 두면 모두 같은 구성으로 빌드한다.</p>\n<h2 class=\"doc-heading\" data-slug=\"97-정리\" id=\"book-modules-and-projects--97-정리\">9.7 정리<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-modules-and-projects--97-정리\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>단위</th>\n<th>정의</th>\n<th>가져오기</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>모듈</td>\n<td><code>.tam</code> 파일 하나</td>\n<td><code>use 경로</code></td>\n</tr>\n<tr>\n<td>패키지</td>\n<td><code>Tmake.toml</code> + <code>src/</code></td>\n<td><code>[dependencies]</code> 후 <code>use 이름</code></td>\n</tr>\n<tr>\n<td>워크스페이스</td>\n<td><code>[workspace]</code></td>\n<td>멤버 패키지끼리 의존</td>\n</tr>\n</tbody>\n</table>\n<p>→ <a href=\"#doc-book-unsafe-and-systems\">10. unsafe와 시스템 프로그래밍</a></p>\n", "text": "9. 모듈과 프로젝트 ¶ 프로그램이 커지면 파일을 나눈다. TAM에서는 파일 하나가 모듈 하나 다. 더 큰 단위는 Tmake.toml 이 관리하는 패키지 와 워크스페이스 다. 9.1 use 와 pub ¶ use a.b 는 루트 폴더 아래의 a/b.tam 을 불러오고, 이후 b::항목 으로 쓴다. 다른 모듈에서 쓰이려면 항목에 pub 을 붙인다. <!-- project run exit=7 --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\" TAM,FILE=APP/SRC/MAIN.TAM 복사 use geo.shapes\n\nfn main() i32 {\n    let r = shapes::Rect { w: 3, h: 2 }\n    shapes::area(&r) + shapes::unit()\n} TAM,FILE=APP/SRC/GEO/SHAPES.TAM 복사 pub struct Rect {\n    w: i32,\n    h: i32,\n}\n\npub fn area(r: &Rect) i32 { r.w * r.h }\n\npub fn unit() i32 { helper() }\n\nfn helper() i32 { 1 }          // pub이 없으므로 이 파일 안에서만 보인다 <!-- /project --> 규칙: 모듈 경로는 한 단계 다: shapes::area . ( geo::shapes::area 는 없다.) 루트 폴더는 프로젝트에서는 패키지의 src/ 다. use 경로는 항상 이 루트 기준이다. pub 이 없는 항목을 밖에서 쓰면 컴파일 오류가 나며, 두 파일의 위치를 함께 보여 준다. 구조체 필드는 항상 공개다. 같은 모듈 이름을 두 번 가져오면( use a.math , use b.math ) 오류다. <!-- project fail=private --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\" TAM,FILE=APP/SRC/MAIN.TAM 복사 use util\n\nfn main() i32 { util::secret() } TAM,FILE=APP/SRC/UTIL.TAM 복사 fn secret() i32 { 1 } <!-- /project --> 9.2 표준 라이브러리 ¶ 첫 조각이 tam 이면 파일이 아니라 컴파일러에 내장된 표준 라이브러리다. TAM 복사 // out: hi 3\nuse tam.os\n\nfn main() i32 {\n    os::print(\"hi \")\n    os::print_int(3)\n    os::println(\"\")\n    0\n} 전체 API는 표준 라이브러리 문서 를 본다. 9.3 패키지 ¶ 패키지 는 Tmake.toml 하나와 src/ 폴더다. 만들고 실행하는 가장 짧은 방법: CONSOLE 복사 $ tamc new hello\n$ cd hello\n$ tamc run CODE 복사 hello/\n├── Tmake.toml\n└── src/\n    └── main.tam TOML 복사 [package]\nname = \"hello\"\nversion = \"0.1.0\" tamc build 는 Tmake.toml 을 찾아 의존성 순서대로 빌드하고 build/<대상>/<프로필>/ 에 결과를 둔다. 바뀐 것이 없으면 다시 만들지 않는다(내용 해시 기반). 9.4 라이브러리 패키지와 의존성 ¶ 재사용할 코드는 kind = \"lib\" 패키지로 분리하고 [dependencies] 로 가져다 쓴다. 의존성 이름이 곧 모듈 이름 이다( - 는 _ ). <!-- project run exit=44 --> TOML,FILE=APP/TMAKE.TOML 복사 [package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\ntext-tools = { path = \"../text-tools\" } TAM,FILE=APP/SRC/MAIN.TAM 복사 use text_tools\n\nfn main() i32 {\n    text_tools::triple(14) + 2\n} TOML,FILE=TEXT-TOOLS/TMAKE.TOML 복사 [package]\nname = \"text-tools\"\nversion = \"0.1.0\"\nkind = \"lib\" TAM,FILE=TEXT-TOOLS/SRC/LIB.TAM 복사 pub fn triple(x: i32) i32 { x * 3 } <!-- /project --> 라이브러리는 src/lib.tam 이 시작점이고 main 이 필요 없다. 빌드할 때는 검사만 한다(코드는 이를 쓰는 실행 파일과 함께 만들어진다). 의존성은 경로 로만 지정한다. 간접 의존성은 직접 선언해야 쓸 수 있다. 9.5 워크스페이스 ¶ 패키지 여러 개를 한 저장소에서 함께 다룬다. 루트 Tmake.toml 에 [workspace] 를 둔다. TOML 복사 [workspace]\nmembers = [\"app\", \"libs/*\"]\ndefault-members = [\"app\"]\n\n[workspace.package]\nversion = \"0.3.0\"\nlicense = \"MIT\"\n\n[workspace.dependencies]\ncore = { path = \"libs/core\", version = \"^0.3\" }\n\n[profile.release]\nopt-level = 2 멤버 패키지는 version = { workspace = true } , core = { workspace = true } 처럼 공통 값을 물려받는다. 저장소의 examples/project/ 가 완전한 예다. 모든 필드는 Tmake.toml 문서 에 있다. 9.6 프로필과 대상 ¶ CONSOLE 복사 $ tamc build                      # 기본: opt-level 0\n$ tamc build --release            # opt-level 2\n$ tamc build --target windows     # 다른 대상\n$ tamc build --locked             # Tmake.lock이 최신이 아니면 실패 의존성이 확정되면 Tmake.lock 이 만들어진다. 저장소에 함께 올려 두면 모두 같은 구성으로 빌드한다. 9.7 정리 ¶ 단위 정의 가져오기 모듈 .tam 파일 하나 use 경로 패키지 Tmake.toml + src/ [dependencies] 후 use 이름 워크스페이스 [workspace] 멤버 패키지끼리 의존 → 10. unsafe와 시스템 프로그래밍", "source": "docs/book/09-modules-and-projects.md"}, {"key": "book-unsafe-and-systems", "path": "docs/book/10-unsafe-and-systems.md", "nav": "unsafe와 시스템 프로그래밍", "title": "10. unsafe와 시스템 프로그래밍 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"10-unsafe와-시스템-프로그래밍\" id=\"book-unsafe-and-systems--10-unsafe와-시스템-프로그래밍\">10. unsafe와 시스템 프로그래밍<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-unsafe-and-systems--10-unsafe와-시스템-프로그래밍\">¶</a></h1>\n<p>TAM의 약속은 이렇다. <strong><code>unsafe</code> 바깥은 컴파일러가 안전을 책임진다. <code>unsafe</code> 안은 당신이 책임진다.</strong> 이 장은 그 안쪽을 다룬다. 운영체제, 드라이버, C 라이브러리 연동에 필요한 도구들이다.</p>\n<h2 class=\"doc-heading\" data-slug=\"101-raw-포인터\" id=\"book-unsafe-and-systems--101-raw-포인터\">10.1 raw 포인터<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-unsafe-and-systems--101-raw-포인터\">¶</a></h2>\n<p><code>*const T</code>는 읽기용, <code>*mut T</code>는 읽고 쓰는 포인터다. <strong>빌림 검사를 받지 않는다.</strong></p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 8\nfn main() i32 {\n    mut x = 5\n    let p = &amp;mut x as *mut i32         // 참조 → 포인터: safe\n    unsafe { *p = 8 }                  // 역참조: unsafe\n    x\n}\n</code></pre></div>\n<p>만들기와 변환(<code>&amp;x as *const i32</code>, 포인터 ↔ 포인터, 포인터 ↔ <code>u64</code>/<code>i64</code>)은 safe이고, 다음은 <code>unsafe</code>가 필요하다.</p>\n<table>\n<thead>\n<tr>\n<th>동작</th>\n<th>예</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>역참조</td>\n<td><code>*p</code>, <code>*p = v</code></td>\n</tr>\n<tr>\n<td>포인터 산술</td>\n<td><code>p + n</code>, <code>p - n</code> (단위: 원소)</td>\n</tr>\n<tr>\n<td><code>unsafe fn</code>, <code>extern</code> 함수 호출</td>\n<td></td>\n</tr>\n<tr>\n<td><code>alloc</code>, <code>free</code>, 하드웨어 내장 함수</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: needs an `unsafe` block\nfn main() i32 {\n    let x = 1\n    let p = &amp;x as *const i32\n    *p\n}\n</code></pre></div>\n<p><code>unsafe { ... }</code>는 <strong>값을 가지는 식</strong>이다. 마지막 식이 값이다.</p>\n<h2 class=\"doc-heading\" data-slug=\"102-직접-할당\" id=\"book-unsafe-and-systems--102-직접-할당\">10.2 직접 할당<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-unsafe-and-systems--102-직접-할당\">¶</a></h2>\n<p><code>alloc(바이트 수)</code>는 힙 블록을, <code>free(포인터)</code>는 해제를 한다. <strong>자동 해제는 없다.</strong> 해제를 잊으면 누수이고, 두 번 하거나 해제 후 쓰면 정의되지 않은 동작이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 15\nfn main() i32 {\n    let n: u64 = 5\n    let raw = unsafe { alloc(n * 4) }          // i32 5개\n    let a = raw as *mut i32\n    unsafe {\n        for i in 0..n { *(a + i) = (i as i32) + 1 }\n    }\n    mut s = 0\n    for i in 0..n { s += unsafe { *(a + i) } }\n    unsafe { free(raw) }\n    s\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"103-unsafe를-safe로-감싸기\" id=\"book-unsafe-and-systems--103-unsafe를-safe로-감싸기\">10.3 unsafe를 safe로 감싸기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-unsafe-and-systems--103-unsafe를-safe로-감싸기\">¶</a></h2>\n<p><code>unsafe</code>는 작게 모아 두고 바깥에는 안전한 인터페이스만 보이게 하라. 경계 검사를 직접 넣어 주면 사용하는 쪽은 <code>unsafe</code>를 알 필요가 없다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nstruct IntBuf {\n    ptr: *mut i32,\n    len: u64,\n}\n\nimpl IntBuf {\n    fn new(len: u64) Self {\n        let raw = unsafe { alloc(len * 4) } as *mut i32\n        for i in 0..len { unsafe { *(raw + i) = 0 } }\n        IntBuf { ptr: raw, len: len }\n    }\n\n    fn set(&amp;mut self, i: u64, v: i32) {\n        assert(i &lt; self.len)                    // 경계 검사는 우리 책임\n        unsafe { *(self.ptr + i) = v }\n    }\n\n    fn get(&amp;self, i: u64) i32 {\n        assert(i &lt; self.len)\n        unsafe { *(self.ptr + i) }\n    }\n\n    fn release(self) {                          // 소비하며 해제\n        unsafe { free(self.ptr as *mut u8) }\n    }\n}\n\nfn main() i32 {\n    mut b = IntBuf::new(4)\n    b.set(1, 3)\n    b.set(3, 4)\n    let r = b.get(1) + b.get(3)\n    b.release()\n    r\n}\n</code></pre></div>\n<p>주의: 구조체는 안의 포인터를 <strong>자동으로 해제하지 않는다</strong>(포인터는 소유권이 없다). 해제 함수를 명시적으로 부르는 것이 컴파일러가 대신해 줄 수 없는 부분이다.</p>\n<h2 class=\"doc-heading\" data-slug=\"104-unsafe-fn\" id=\"book-unsafe-and-systems--104-unsafe-fn\">10.4 <code>unsafe fn</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-unsafe-and-systems--104-unsafe-fn\">¶</a></h2>\n<p>호출자가 지켜야 할 조건이 있는 함수는 <code>unsafe fn</code>으로 선언한다. 본문 전체가 <code>unsafe</code> 맥락이고, 호출은 <code>unsafe</code> 안에서만 가능하다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 4\nunsafe fn read_at(p: *const i32, i: u64) i32 {\n    *(p + i)                           // 호출자가 범위를 보장해야 한다\n}\n\nfn main() i32 {\n    let a = [1, 2, 4]\n    let p = &amp;a as *const [i32; 3] as *const i32\n    unsafe { read_at(p, 2) }\n}\n</code></pre></div>\n<p>함수 위에 \"무엇을 보장해야 하는가\"를 주석으로 적는 습관을 들인다.</p>\n<h2 class=\"doc-heading\" data-slug=\"105-c-라이브러리-호출-extern\" id=\"book-unsafe-and-systems--105-c-라이브러리-호출-extern\">10.5 C 라이브러리 호출: <code>extern</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-unsafe-and-systems--105-c-라이브러리-호출-extern\">¶</a></h2>\n<p>본문 없는 선언으로 외부 함수를 부른다. 호스트에서는 <code>\"c\"</code>가 libc다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nextern \"c\" fn abs(x: i32) i32\n\nfn main() i32 {\n    unsafe { abs(0 - 7) }\n}\n</code></pre></div>\n<ul>\n<li>인자·반환 타입은 C ABI에 맞는 것만 쓴다: <strong>정수형, <code>f64</code>, <code>bool</code>, raw 포인터</strong>.</li>\n<li>문자열을 넘기려면 널 종료 바이트 배열을 만들어 <code>*const u8</code>로 넘긴다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nextern \"c\" fn strlen(s: *const u8) u64\n\nfn main() i32 {\n    let s: [u8; 6] = [104, 101, 108, 108, 111, 0]   // \"hello\\0\"\n    unsafe { strlen(&amp;s as *const [u8; 6] as *const u8) as i32 }\n}\n</code></pre></div>\n<ul>\n<li>실제 심볼 이름이 다르면 <code>extern \"c\" fn my_name(...) = \"real_symbol\"</code>.</li>\n<li>Windows 대상에서는 DLL 이름(<code>\"kernel32\"</code>)을 쓴다. 대상과 맞지 않으면 오류다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"106-수-연산을-직접-제어하기\" id=\"book-unsafe-and-systems--106-수-연산을-직접-제어하기\">10.6 수 연산을 직접 제어하기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-unsafe-and-systems--106-수-연산을-직접-제어하기\">¶</a></h2>\n<p>기본 산술은 오버플로 시 trap한다. 해시, 난수, 체크섬처럼 <strong>감싸는 것이 의도</strong>일 때는 명시한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 1\nfn main() i32 {\n    let a: u32 = 4000000000\n    let b = wrapping_add(a, 500000000)         // 4_500_000_000 mod 2^32\n    if b == 205032704 { 1 } else { 0 }\n}\n</code></pre></div>\n<p><code>wrapping_add</code>, <code>wrapping_sub</code>, <code>wrapping_mul</code>이 있다. 시프트의 양은 비트 폭 − 1로 마스크되고, <code>as</code> 변환은 값을 자르거나 포화시킨다(<a href=\"#doc-ref-reference--10-수치-의미-오버플로-변환-시프트\">레퍼런스 10장</a>).</p>\n<h2 class=\"doc-heading\" data-slug=\"107-하드웨어-접근\" id=\"book-unsafe-and-systems--107-하드웨어-접근\">10.7 하드웨어 접근<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-unsafe-and-systems--107-하드웨어-접근\">¶</a></h2>\n<p>펌웨어 대상(<code>bios</code>, <code>uefi</code>, <code>aarch64</code>)에서는 하드웨어 내장 함수를 쓸 수 있다. 모두 <code>unsafe</code>다.</p>\n<table>\n<thead>\n<tr>\n<th>내장 함수</th>\n<th>용도</th>\n<th>대상</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>mmio_read8/16/32/64(addr)</code> <code>mmio_write…(addr, v)</code></td>\n<td>메모리 맵 I/O (volatile)</td>\n<td>펌웨어</td>\n</tr>\n<tr>\n<td><code>port_in8/in32(port)</code> <code>port_out8/out32(port, v)</code></td>\n<td>x86 I/O 포트</td>\n<td>bios, uefi</td>\n</tr>\n<tr>\n<td><code>halt()</code></td>\n<td>CPU 정지</td>\n<td>펌웨어</td>\n</tr>\n<tr>\n<td><code>semihost(op, arg)</code></td>\n<td>호스트 호출</td>\n<td>aarch64</td>\n</tr>\n</tbody>\n</table>\n<p>MMIO는 <strong>일반 메모리가 아니다.</strong> 읽기와 쓰기 자체가 효과이므로 컴파일러가 줄이거나 없애지 않는다(volatile). 장치 레지스터는 항상 <code>mmio_*</code>로만 만진다. 실제로 동작하는 예는 <a href=\"#doc-book-targets\">11장</a>에서 본다.</p>\n<h2 class=\"doc-heading\" data-slug=\"108-안전하게-쓰는-요령\" id=\"book-unsafe-and-systems--108-안전하게-쓰는-요령\">10.8 안전하게 쓰는 요령<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-unsafe-and-systems--108-안전하게-쓰는-요령\">¶</a></h2>\n<ol>\n<li><strong><code>unsafe</code> 블록은 한 줄이나 몇 줄로 작게.</strong> 길수록 어디서 깨졌는지 모른다.</li>\n<li><strong>불변식을 주석으로 적는다.</strong> \"i &lt; len임을 호출자가 보장한다.\"</li>\n<li><strong>경계가 필요하면 <code>assert</code>로 직접 건다.</strong> 느려지는 것보다 조용히 메모리를 깨는 쪽이 훨씬 비싸다.</li>\n<li><strong>소유권 하나, 해제 지점 하나.</strong> 누가 <code>free</code>하는지 이름만 봐도 알게 한다.</li>\n<li><code>unsafe</code>가 없는 코드는 <strong>어떤 입력에서도 메모리를 깨지 않는다.</strong> 버그가 났다면 범인은 <code>unsafe</code> 안에 있다. 찾을 곳이 좁다.</li>\n</ol>\n<p>→ <a href=\"#doc-book-targets\">11. 여러 대상으로 빌드하기</a></p>\n", "text": "10. unsafe와 시스템 프로그래밍 ¶ TAM의 약속은 이렇다. unsafe 바깥은 컴파일러가 안전을 책임진다. unsafe 안은 당신이 책임진다. 이 장은 그 안쪽을 다룬다. 운영체제, 드라이버, C 라이브러리 연동에 필요한 도구들이다. 10.1 raw 포인터 ¶ *const T 는 읽기용, *mut T 는 읽고 쓰는 포인터다. 빌림 검사를 받지 않는다. TAM 복사 // exit: 8\nfn main() i32 {\n    mut x = 5\n    let p = &mut x as *mut i32         // 참조 → 포인터: safe\n    unsafe { *p = 8 }                  // 역참조: unsafe\n    x\n} 만들기와 변환( &x as *const i32 , 포인터 ↔ 포인터, 포인터 ↔ u64 / i64 )은 safe이고, 다음은 unsafe 가 필요하다. 동작 예 역참조 *p , *p = v 포인터 산술 p + n , p - n (단위: 원소) unsafe fn , extern 함수 호출 alloc , free , 하드웨어 내장 함수 TAM,ERROR 복사 // error: needs an `unsafe` block\nfn main() i32 {\n    let x = 1\n    let p = &x as *const i32\n    *p\n} unsafe { ... } 는 값을 가지는 식 이다. 마지막 식이 값이다. 10.2 직접 할당 ¶ alloc(바이트 수) 는 힙 블록을, free(포인터) 는 해제를 한다. 자동 해제는 없다. 해제를 잊으면 누수이고, 두 번 하거나 해제 후 쓰면 정의되지 않은 동작이다. TAM 복사 // exit: 15\nfn main() i32 {\n    let n: u64 = 5\n    let raw = unsafe { alloc(n * 4) }          // i32 5개\n    let a = raw as *mut i32\n    unsafe {\n        for i in 0..n { *(a + i) = (i as i32) + 1 }\n    }\n    mut s = 0\n    for i in 0..n { s += unsafe { *(a + i) } }\n    unsafe { free(raw) }\n    s\n} 10.3 unsafe를 safe로 감싸기 ¶ unsafe 는 작게 모아 두고 바깥에는 안전한 인터페이스만 보이게 하라. 경계 검사를 직접 넣어 주면 사용하는 쪽은 unsafe 를 알 필요가 없다. TAM 복사 // exit: 7\nstruct IntBuf {\n    ptr: *mut i32,\n    len: u64,\n}\n\nimpl IntBuf {\n    fn new(len: u64) Self {\n        let raw = unsafe { alloc(len * 4) } as *mut i32\n        for i in 0..len { unsafe { *(raw + i) = 0 } }\n        IntBuf { ptr: raw, len: len }\n    }\n\n    fn set(&mut self, i: u64, v: i32) {\n        assert(i < self.len)                    // 경계 검사는 우리 책임\n        unsafe { *(self.ptr + i) = v }\n    }\n\n    fn get(&self, i: u64) i32 {\n        assert(i < self.len)\n        unsafe { *(self.ptr + i) }\n    }\n\n    fn release(self) {                          // 소비하며 해제\n        unsafe { free(self.ptr as *mut u8) }\n    }\n}\n\nfn main() i32 {\n    mut b = IntBuf::new(4)\n    b.set(1, 3)\n    b.set(3, 4)\n    let r = b.get(1) + b.get(3)\n    b.release()\n    r\n} 주의: 구조체는 안의 포인터를 자동으로 해제하지 않는다 (포인터는 소유권이 없다). 해제 함수를 명시적으로 부르는 것이 컴파일러가 대신해 줄 수 없는 부분이다. 10.4 unsafe fn ¶ 호출자가 지켜야 할 조건이 있는 함수는 unsafe fn 으로 선언한다. 본문 전체가 unsafe 맥락이고, 호출은 unsafe 안에서만 가능하다. TAM 복사 // exit: 4\nunsafe fn read_at(p: *const i32, i: u64) i32 {\n    *(p + i)                           // 호출자가 범위를 보장해야 한다\n}\n\nfn main() i32 {\n    let a = [1, 2, 4]\n    let p = &a as *const [i32; 3] as *const i32\n    unsafe { read_at(p, 2) }\n} 함수 위에 \"무엇을 보장해야 하는가\"를
