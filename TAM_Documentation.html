owing", "label": "참조와 빌림"}, {"key": "book-structs-and-methods", "label": "구조체와 메서드"}, {"key": "book-arrays-and-slices", "label": "배열과 슬라이스"}, {"key": "book-error-handling", "label": "오류 처리"}, {"key": "book-modules-and-projects", "label": "모듈과 프로젝트"}, {"key": "book-unsafe-and-systems", "label": "unsafe와 시스템 프로그래밍"}, {"key": "book-targets", "label": "여러 대상으로 빌드하기"}, {"key": "book-project", "label": "프로젝트 만들기"}, {"key": "book-generics", "label": "제네릭"}, {"key": "book-practice", "label": "실전 가이드"}]}, {"title": "TAM by Example", "items": [{"key": "examples-index", "label": "TAM by Example"}, {"key": "example-basics", "label": "기초"}, {"key": "example-data", "label": "데이터"}, {"key": "example-ownership", "label": "소유권"}, {"key": "example-errors", "label": "오류 처리"}, {"key": "example-strings-io", "label": "문자열과 입출력"}, {"key": "example-algorithms", "label": "알고리즘"}, {"key": "example-systems", "label": "시스템 프로그래밍"}, {"key": "example-projects", "label": "프로젝트"}, {"key": "example-generics-and-constants", "label": "제네릭과 상수"}]}, {"title": "레퍼런스", "items": [{"key": "ref-reference", "label": "언어 레퍼런스"}, {"key": "ref-stdlib", "label": "표준 라이브러리"}, {"key": "ref-tmake", "label": "Tmake.toml 레퍼런스"}, {"key": "ref-safety", "label": "안전성과 메모리 모델"}, {"key": "ref-compiler", "label": "컴파일러 구조"}, {"key": "ref-style", "label": "스타일 가이드"}, {"key": "ref-why-tam", "label": "설계 철학과 비교"}, {"key": "ref-changelog", "label": "릴리스 노트"}]}]}</script>
<script>
(()=>{
'use strict';
const data=JSON.parse(document.getElementById('tam-data').textContent);
const docs=data.docs, groups=data.groups;
const byKey=new Map(docs.map((d,i)=>[d.key,{...d,index:i}]));
const articles=document.getElementById('articles'), nav=document.getElementById('sidebarNav'), toc=document.getElementById('tocList');
const searchOverlay=document.getElementById('searchOverlay'), searchInput=document.getElementById('searchInput'), searchResults=document.getElementById('searchResults');
const escHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const docHref=(key)=>'#doc-'+key;
// Build article pages from the embedded source documents.
docs.forEach((d,i)=>{
 const el=document.createElement('article'); el.className='article'; el.id='doc-'+d.key; el.dataset.key=d.key;
 const groupName=groups.find(g=>g.items.some(it=>it.key===d.key))?.title||'TAM 문서';
 el.innerHTML=`<div class="breadcrumbs"><span>문서</span><span>›</span><span>${escHtml(groupName)}</span></div>${d.html}<div class="bottom-nav"><a class="bottom-link" data-prev="${i-1}" href="${i>0?docHref(docs[i-1].key):'#doc-'+d.key}"><small>← 이전 문서</small><strong>${i>0?escHtml(docs[i-1].nav):'문서 처음'}</strong></a><a class="bottom-link next" data-next="${i+1}" href="${i<docs.length-1?docHref(docs[i+1].key):'#doc-'+d.key}"><small>다음 문서 →</small><strong>${i<docs.length-1?escHtml(docs[i+1].nav):'마지막 문서'}</strong></a></div>`;
 articles.appendChild(el);
});
// Build navigation tree.
groups.forEach(g=>{
 const section=document.createElement('section'); section.className='nav-group';
 const title=document.createElement('div'); title.className='nav-group-title'; title.textContent=g.title; section.appendChild(title);
 const list=document.createElement('div'); list.className='nav-list';
 g.items.forEach((it,j)=>{const a=document.createElement('a');a.className='nav-link';a.href=docHref(it.key);a.dataset.key=it.key;
 const num=document.createElement('span');num.className='nav-number';num.textContent=(g.title==='The TAM Book'||g.title==='TAM by Example')?String(g.title==='The TAM Book'?j+2:(j===0&&g.title==='TAM by Example'?'≡':j)).padStart(2,'0'): '·';
 const label=document.createElement('span');label.textContent=it.label;a.append(num,label);list.appendChild(a)});
 section.appendChild(list);nav.appendChild(section);
});
function currentFromHash(){let h=decodeURIComponent(location.hash.slice(1));if(!h)return {key:'overview',slug:''};if(!h.startsWith('doc-'))return {key:'overview',slug:''};const full=h.slice(4);const keys=[...byKey.keys()].sort((a,b)=>b.length-a.length);for(const key of keys){if(full===key)return {key,slug:''};if(full.startsWith(key+'--'))return {key,slug:full.slice(key.length+2)};}return {key:'overview',slug:''};}
let currentKey='overview';
function updateTOC(key){toc.innerHTML='';const article=document.getElementById('doc-'+key);if(!article)return;const heads=[...article.querySelectorAll('h2[id],h3[id]')];if(!heads.length){toc.innerHTML='<div class="toc-empty">목차가 없는 문서</div>';return;}heads.forEach(h=>{const a=document.createElement('a');a.className='toc-link depth-'+h.tagName.slice(1);a.href='#doc-'+key+'--'+h.id.split('--').slice(1).join('--');a.textContent=h.textContent.replace('¶','').trim();a.dataset.heading=h.id;toc.appendChild(a)});}
function setActiveNav(key){document.querySelectorAll('.nav-link').forEach(a=>{a.classList.toggle('active',a.dataset.key===key);if(a.dataset.key===key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
function route(){let {key,slug}=currentFromHash();if(!byKey.has(key))key='overview';currentKey=key;document.querySelectorAll('.article').forEach(a=>a.classList.toggle('active',a.dataset.key===key));setActiveNav(key);updateTOC(key);document.body.classList.remove('sidebar-open');
 if(slug){const target=document.getElementById(key+'--'+slug);if(target){setTimeout(()=>target.scrollIntoView({block:'start',behavior:'smooth'}),0)}else window.scrollTo({top:0,behavior:'auto'});}else window.scrollTo({top:0,behavior:'auto'});
}
window.addEventListener('hashchange',route);
if(!location.hash||!location.hash.startsWith('#doc-'))history.replaceState(null,'','#doc-overview');route();
// Copy-to-clipboard controls.
document.addEventListener('click',async e=>{const b=e.target.closest('.copy-code');if(!b)return;const code=b.closest('.code-wrap')?.querySelector('pre code');if(!code)return;try{await navigator.clipboard.writeText(code.innerText);b.textContent='복사됨';setTimeout(()=>b.textContent='복사',1300)}catch{const range=document.createRange();range.selectNodeContents(code);const sel=getSelection();sel.removeAllRanges();sel.addRange(range);b.textContent='코드를 선택함';setTimeout(()=>b.textContent='복사',1600)}});
// Fixed light theme: pale yellow background, pale green panels, black text, pink accents.
// Mobile navigation.
document.getElementById('menuToggle').addEventListener('click',()=>document.body.classList.toggle('sidebar-open'));
document.getElementById('mobileScrim').addEventListener('click',()=>document.body.classList.remove('sidebar-open'));
// Search index includes every document, including the source code examples.
const searchIndex=docs.map(d=>{const el=document.getElementById('doc-'+d.key);return {key:d.key,title:d.title,nav:d.nav,source:d.source,text:(el?.innerText||d.text).replace(/\s+/g,' ').trim(),html:el?.innerHTML||''}});
let results=[],selected=-1;
function openSearch(){searchOverlay.classList.add('open');searchInput.value='';renderSearch('');setTimeout(()=>searchInput.focus(),30)}
function closeSearch(){searchOverlay.classList.remove('open');}
document.getElementById('searchOpen').addEventListener('click',openSearch);
searchOverlay.addEventListener('click',e=>{if(e.target===searchOverlay)closeSearch()});
searchInput.addEventListener('input',()=>renderSearch(searchInput.value));
function renderSearch(q){const query=q.trim().toLocaleLowerCase();selected=-1;if(!query){results=[];searchResults.innerHTML='<div class="empty-result">검색어를 입력하면 문서 전체에서 찾아줘.<br><br><span>예: ownership · borrow · Tmake.toml · unsafe · string</span></div>';return;}
 const terms=query.split(/\s+/).filter(Boolean);
 results=searchIndex.map(d=>{const title=(d.title+' '+d.nav).toLocaleLowerCase(),text=d.text.toLocaleLowerCase();let score=0;terms.forEach(t=>{if(title.includes(t))score+=title===t?15:7;if(text.includes(t))score+=Math.min(12,(text.split(t).length-1))*1.4});return {...d,score,at:text.indexOf(terms.find(t=>text.includes(t))||query)}}).filter(r=>r.score>0).sort((a,b)=>b.score-a.score).slice(0,30);
 if(!results.length){searchResults.innerHTML='<div class="empty-result">일치하는 문서를 찾지 못했어.<br>다른 단어나 TAM 식별자를 검색해 봐.</div>';return;}
 searchResults.innerHTML=results.map((r,i)=>{let snippet='';if(r.at>=0){let start=Math.max(0,r.at-75),end=Math.min(r.text.length,r.at+150);snippet=(start?'…':'')+r.text.slice(start,end)+(end<r.text.length?'…':'')}else snippet=r.text.slice(0,140);return `<a class="result-item${i===0?' selected':''}" href="${docHref(r.key)}" data-result="${i}"><span class="result-meta">${escHtml(r.nav)} · ${escHtml(r.source)}</span><span class="result-title">${escHtml(r.title)}</span><span class="result-snippet">${escHtml(snippet)}</span></a>`}).join('');selected=0;
}
searchInput.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();moveResult(1)}else if(e.key==='ArrowUp'){e.preventDefault();moveResult(-1)}else if(e.key==='Enter'){e.preventDefault();chooseResult()}else if(e.key==='Escape'){closeSearch()}});
function moveResult(n){const els=[...searchResults.querySelectorAll('.result-item')];if(!els.length)return;selected=(selected+n+els.length)%els.length;els.forEach((a,i)=>a.classList.toggle('selected',i===selected));els[selected].scrollIntoView({block:'nearest'})}
function chooseResult(){const r=results[selected];if(!r)return;location.hash=docHref(r.key);closeSearch()}
searchResults.addEventListener('click',e=>{const a=e.target.closest('.result-item');if(a)closeSearch()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}else if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!e.ctrlKey&&!e.metaKey){e.preventDefault();openSearch()}else if(e.key==='Escape'){closeSearch();document.body.classList.remove('sidebar-open')}});
// Keep the right-hand table of contents aligned with the heading closest to the viewport.
if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;toc.querySelectorAll('.toc-link').forEach(a=>a.classList.toggle('active',a.dataset.heading===id));},{rootMargin:'-10% 0px -72% 0px'});document.querySelectorAll('.article h2[id],.article h3[id]').forEach(h=>observer.observe(h));}
// External links always open a separate tab; in-document links use hashes.
document.querySelectorAll('.article a[target="_blank"]').forEach(a=>a.rel='noopener noreferrer');
})();
</script>
</body>
</html>
