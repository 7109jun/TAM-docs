ar(--border)}.article thead th:first-child{border-top-left-radius:8px}.article thead th:last-child{border-top-right-radius:8px}.article tbody tr:last-child td:first-child{border-bottom-left-radius:8px}.article tbody tr:last-child td:last-child{border-bottom-right-radius:8px}.article tbody tr:nth-child(even){background:color-mix(in srgb,var(--panel) 45%,transparent)}.article code:not(pre code){font: .88em ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--inline);border:1px solid color-mix(in srgb,var(--border) 60%,transparent);padding:.12em .34em;border-radius:5px;overflow-wrap:anywhere}.code-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:20px 0 26px;background:var(--code);position:relative}.code-label{height:35px;background:var(--codehead);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 11px 0 14px;color:var(--subtle);font-size:10px;letter-spacing:.11em;font-weight:800}.copy-code{font-size:11px;font-weight:650;letter-spacing:0;padding:3px 8px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--muted)}.copy-code:hover{color:var(--blue);border-color:var(--blue)}pre{margin:0;padding:17px 19px;overflow:auto;color:var(--text);font:13px/1.75 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;tab-size:4}pre code{font:inherit;white-space:pre}.article img{max-width:100%;height:auto;border-radius:8px}.heading-anchor{opacity:0;font-size:.8em;color:var(--subtle);margin-left:9px;display:inline-block;font-weight:400}.article h2:hover .heading-anchor,.article h3:hover .heading-anchor,.article h4:hover .heading-anchor{opacity:1}.article input[type=checkbox]{margin-right:7px}.article .task-list-item{list-style:none}.bottom-nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid var(--border);margin-top:62px;padding-top:23px}.bottom-link{border:1px solid var(--border);border-radius:10px;padding:13px 15px;display:fl  id=\"overview--문서의-품질-보증\">문서의 품질 보증<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-overview--문서의-품질-보증\">¶</a></h2>\n<p>문서 안의 코드 예제는 릴리스 전에 모두 실제 <code>tamc 1.0</code>으로 컴파일·실행해 출력과 종료 코드를 검증했다. 표기는 다음과 같다.</p>\n<ul>\n<li><code>```tam</code>: 컴파일하고 실행. <code>// exit:</code>, <code>// out:</code>이 기대값.</li>\n<li><code>```tam,error</code> / <code>```tam,trap</code>: 지정한 컴파일 오류, 실행 중 trap.</li>\n<li><code>```tam,boot=bios|uefi|aarch64</code>: QEMU 부팅 예제.</li>\n</ul>\n<p>문서는 한국어로 쓰고 코드, 식별자, 컴파일러 메시지는 영어 그대로 둔다.</p>\n", "text": "TAM 문서 ¶ 문서 대상 독자 내용 The TAM Book 처음 배우는 사람 14장. 설치부터 소유권, 오류 처리, 모듈, unsafe, 제네릭, 여러 대상, 프로젝트까지 TAM by Example 예제로 빠르게 익히려는 사람 9개 분야 예제 The Standard Library API Documentation 함수를 찾는 사람 tam.os , tam.fmt , tam.serial , 내장 함수 Tmake.toml Documentation 프로젝트를 구성하는 사람 패키지, 의존성, 워크스페이스, 프로필, 대상, 잠금 파일 The TAM Reference 정확한 의미가 필요한 사람 문법(EBNF), 타입, 소유권·빌림 규칙, 수치 의미, 대상, 호환성 약속 Why TAM TAM이 맞는지 판단하려는 사람 설계 철학, C·Rust·Go·Zig와의 비교, 한계, C/Rust 사용자용 번역 Safety and Memory Model 안전성의 정확한 범위가 궁금한 사람 컴파일 시간·실행 시간 보장, unsafe 의 책임, 보장하지 않는 것 Compiler Architecture 컴파일러를 고치거나 배우려는 사람 파이프라인, 단계별 설명, 대상별 링크, 시험·퍼저, 기여 방법 Style Guide 코드를 쓰는 사람 모양, 이름, 오류 처리, 소유권, unsafe 관용구 Release Notes 버전 변화를 보려는 사람 1.0.0 변경, 알려진 한계, 개발 이력, 앞으로의 후보 문서의 품질 보증 ¶ 문서 안의 코드 예제는 릴리스 전에 모두 실제 tamc 1.0 으로 컴파일·실행해 출력과 종료 코드를 검증했다. 표기는 다음과 같다. ```tam : 컴파일하고 실행. // exit: , // out: 이 기대값. ```tam,error / ```tam,trap : 지정한 컴파일 오류, 실행 중 trap. ```tam,boot=bios|uefi|aarch64 : QEMU 부팅 예제. 문서는 한국어로 쓰고 코드, 식별자, 컴파일러 메시지는 영어 그대로 둔다.", "source": "docs/README.md"}, {"key": "book-index", "path": "docs/book/README.md", "nav": "The TAM Book", "title": "The TAM Book ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"the-tam-book\" id=\"book-index--the-tam-book\">The TAM Book<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-index--the-tam-book\">¶</a></h1>\n<p><strong>TAM</strong>은 간결함, 안정성, 시스템 프로그래밍을 기준으로 만든 네이티브 언어다. 가비지 컬렉터도 가상 머신도 없이 LLVM으로 기계어를 만들고, 메모리 안전은 <strong>컴파일 시간의 소유권·빌림 검사</strong>로 지킨다. 필요하면 <code>unsafe</code>로 모든 통제권을 쥘 수 있고, <code>unsafe</code> 바깥의 안전은 컴파일러가 책임진다.</p>\n<blockquote>\n<p>사용자에게 통제권을 모두 준다. 안정성은 컴파일러가 책임진다.</p>\n</blockquote>\n<p>이 책은 TAM을 <strong>처음부터 끝까지</strong> 배우는 안내서다. 프로그래밍 경험(C, Rust, Go, Python 중 하나)이 조금 있다고 가정한다. 모든 코드 예제는 실제 컴파일러(<code>tamc 1.0</code>)로 <strong>컴파일하고 실행해</strong> 출력과 종료 코드를 검증했다.</p>\n<h2 class=\"doc-heading\" data-slug=\"차례\" id=\"book-index--차례\">차례<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-index--차례\">¶</a></h2>\n<ol>\n<li><a href=\"#doc-book-getting-started\">시작하기</a> — 설치, Hello TAM, 프로젝트 만들기</li>\n<li><a href=\"#doc-book-values-and-variables\">값과 변수</a> — 타입, <code>let</code>/<code>mut</code>, 연산, 오버플로</li>\n<li><a href=\"#doc-book-functions-and-control-flow\">함수와 제어 흐름</a> — <code>fn</code>, <code>if</code>, <code>while</code>, <code>for</code></li>\n<li><a href=\"#doc-book-ownership\">소유권</a> — 이동, 복사, <code>String</code>, 자동 해제</li>\n<li><a href=\"#doc-book-references-and-borrowing\">참조와 빌림</a> — <code>&amp;</code>, <code>&amp;mut</code>, 빌림 검사기 읽기</li>\n<li><a href=\"#doc-book-structs-and-methods\">구조체와 메서드</a></li>\n<li><a href=\"#doc-book-arrays-and-slices\">배열과 슬라이스</a></li>\n<li><a href=\"#doc-book-error-handling\">오류 처리</a> — <code>Option</code>, <code>Result</code>, <code>?</code>, <code>match</code>, 패닉</li>\n<li><a href=\"#doc-book-modules-and-projects\">모듈과 프로젝트</a> — <code>use</code>, <code>pub</code>, <code>Tmake.toml</code>, 워크스페이스</li>\n<li><a href=\"#doc-book-unsafe-and-systems\"><code>unsafe</code>와 시스템 프로그래밍</a> — 포인터, 힙, FFI</li>\n<li><a href=\"#doc-book-targets\">여러 대상으로 빌드하기</a> — Windows, UEFI, BIOS, AArch64</li>\n<li><a href=\"#doc-book-project\">프로젝트: 줄 단위 합계 도구</a> — 라이브러리와 실행 파일, 입출력</li>\n<li><a href=\"#doc-book-generics\">제네릭</a> — 타입 매개변수, 제네릭 함수·구조체, 단형화, 인스턴스 오류 읽기</li>\n<li><a href=\"#doc-book-practice\">실전 가이드</a> — 오류 읽기, 디버깅, 안전한 <code>unsafe</code>, 자주 하는 실수</li>\n</ol>\n<h2 class=\"doc-heading\" data-slug=\"함께-보면-좋은-문서\" id=\"book-index--함께-보면-좋은-문서\">함께 보면 좋은 문서<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-index--함께-보면-좋은-문서\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>문서</th>\n<th>용도</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#doc-examples-index\">TAM by Example</a></td>\n<td>짧은 예제 모음으로 익히기</td>\n</tr>\n<tr>\n<td><a href=\"#doc-ref-reference\">The TAM Reference</a></td>\n<td>문법과 의미의 <strong>규범적 정의</strong></td>\n</tr>\n<tr>\n<td><a href=\"#doc-ref-stdlib\">The Standard Library API Documentation</a></td>\n<td><code>tam.os</code>, <code>tam.fmt</code>, 내장 함수</td>\n</tr>\n<tr>\n<td><a href=\"#doc-ref-tmake\">Tmake.toml Documentation</a></td>\n<td>프로젝트 파일</td>\n</tr>\n</tbody>\n</table>\n<h2 class=\"doc-heading\" data-slug=\"이-책의-표기\" id=\"book-index--이-책의-표기\">이 책의 표기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-index--이-책의-표기\">¶</a></h2>\n<ul>\n<li><code>// exit: N</code>, <code>// out: ...</code>은 예제를 실행했을 때 <strong>검증된</strong> 종료 코드와 출력이다.</li>\n<li><code>tamc</code>가 내는 오류는 실제 출력을 그대로 보여 준다.</li>\n<li>\"(안 된다)\"라고 적은 코드는 실제로 컴파일 오류가 난다는 것을 문서 검사기가 확인한다.</li>\n</ul>\n", "text": "The TAM Book ¶ TAM 은 간결함, 안정성, 시스템 프로그래밍을 기준으로 만든 네이티브 언어다. 가비지 컬렉터도 가상 머신도 없이 LLVM으로 기계어를 만들고, 메모리 안전은 컴파일 시간의 소유권·빌림 검사 로 지킨다. 필요하면 unsafe 로 모든 통제권을 쥘 수 있고, unsafe 바깥의 안전은 컴파일러가 책임진다. 사용자에게 통제권을 모두 준다. 안정성은 컴파일러가 책임진다. 이 책은 TAM을 처음부터 끝까지 배우는 안내서다. 프로그래밍 경험(C, Rust, Go, Python 중 하나)이 조금 있다고 가정한다. 모든 코드 예제는 실제 컴파일러( tamc 1.0 )로 컴파일하고 실행해 출력과 종료 코드를 검증했다. 차례 ¶ 시작하기 — 설치, Hello TAM, 프로젝트 만들기 값과 변수 — 타입, let / mut , 연산, 오버플로 함수와 제어 흐름 — fn , if , while , for 소유권 — 이동, 복사, String , 자동 해제 참조와 빌림 — & , &mut , 빌림 검사기 읽기 구조체와 메서드 배열과 슬라이스 오류 처리 — Option , Result , ? , match , 패닉 모듈과 프로젝트 — use , pub , Tmake.toml , 워크스페이스 unsafe 와 시스템 프로그래밍 — 포인터, 힙, FFI 여러 대상으로 빌드하기 — Windows, UEFI, BIOS, AArch64 프로젝트: 줄 단위 합계 도구 — 라이브러리와 실행 파일, 입출력 제네릭 — 타입 매개변수, 제네릭 함수·구조체, 단형화, 인스턴스 오류 읽기 실전 가이드 — 오류 읽기, 디버깅, 안전한 unsafe , 자주 하는 실수 함께 보면 좋은 문서 ¶ 문서 용도 TAM by Example 짧은 예제 모음으로 익히기 The TAM Reference 문법과 의미의 규범적 정의 The Standard Library API Documentation tam.os , tam.fmt , 내장 함수 Tmake.toml Documentation 프로젝트 파일 이 책의 표기 ¶ // exit: N , // out: ... 은 예제를 실행했을 때 검증된 종료 코드와 출력이다. tamc 가 내는 오류는 실제 출력을 그대로 보여 준다. \"(안 된다)\"라고 적은 코드는 실제로 컴파일 오류가 난다는 것을 문서 검사기가 확인한다.", "source": "docs/book/README.md"}, {"key": "examples-index", "path": "docs/by-example/README.md", "nav": "TAM by Example", "title": "TAM by Example ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"tam-by-example\" id=\"examples-index--tam-by-example\">TAM by Example<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-examples-index--tam-by-example\">¶</a></h1>\n<p>짧고 <strong>실제로 실행되는</strong> 예제 모음이다. 각 예제는 한 가지 개념을 보여 주고, 모든 코드는 컴파일·실행으로 검증된다(릴리스 전 검증). 설명이 더 필요하면 <a href=\"#doc-book-index\">The TAM Book</a>이나 <a href=\"#doc-ref-reference\">The TAM Reference</a>로 간다.</p>\n<p>예제의 <code>// exit: N</code>은 프로그램이 돌려주는 종료 코드, <code>// out:</code>은 출력이다. 실행은 <code>tamc run 파일.tam</code>.</p>\n<table>\n<thead>\n<tr>\n<th>장</th>\n<th>내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#doc-example-basics\">1. 기초</a></td>\n<td>출력, 변수, 산술, 조건, 반복, 함수</td>\n</tr>\n<tr>\n<td><a href=\"#doc-example-data\">2. 데이터</a></td>\n<td>배열, 슬라이스, 구조체, 메서드</td>\n</tr>\n<tr>\n<td><a href=\"#doc-example-ownership\">3. 소유권과 빌림</a></td>\n<td>이동, 참조, <code>&amp;mut</code>, 자동 해제</td>\n</tr>\n<tr>\n<td><a href=\"#doc-example-errors\">4. 오류 처리</a></td>\n<td><code>Option</code>, <code>Result</code>, <code>?</code>, 패닉</td>\n</tr>\n<tr>\n<td><a href=\"#doc-example-strings-io\">5. 문자열과 입출력</a></td>\n<td><code>String</code>, <code>tam.fmt</code>, 표준 입력, 파일</td>\n</tr>\n<tr>\n<td><a href=\"#doc-example-algorithms\">6. 알고리즘</a></td>\n<td>정렬, 이진 탐색, 소수, 피보나치 등</td>\n</tr>\n<tr>\n<td><a href=\"#doc-example-systems\">7. 시스템</a></td>\n<td>포인터, <code>alloc</code>, <code>extern</code>, 감싸는 산술, 부팅</td>\n</tr>\n<tr>\n<td><a href=\"#doc-example-projects\">8. 모듈과 프로젝트</a></td>\n<td><code>use</code>, 패키지, 의존성</td>\n</tr>\n<tr>\n<td><a href=\"#doc-example-generics-and-constants\">9. 상수, 제네릭, 루프</a></td>\n<td><code>const</code>, <code>loop</code>, 블록 주석, 제네릭</td>\n</tr>\n</tbody>\n</table>\n", "text": "TAM by Example ¶ 짧고 실제로 실행되는 예제 모음이다. 각 예제는 한 가지 개념을 보여 주고, 모든 코드는 컴파일·실행으로 검증된다(릴리스 전 검증). 설명이 더 필요하면 The TAM Book 이나 The TAM Reference 로 간다. 예제의 // exit: N 은 프로그램이 돌려주는 종료 코드, // out: 은 출력이다. 실행은 tamc run 파일.tam . 장 내용 1. 기초 출력, 변수, 산술, 조건, 반복, 함수 2. 데이터 배열, 슬라이스, 구조체, 메서드 3. 소유권과 빌림 이동, 참조, &mut , 자동 해제 4. 오류 처리 Option , Result , ? , 패닉 5. 문자열과 입출력 String , tam.fmt , 표준 입력, 파일 6. 알고리즘 정렬, 이진 탐색, 소수, 피보나치 등 7. 시스템 포인터, alloc , extern , 감싸는 산술, 부팅 8. 모듈과 프로젝트 use , 패키지, 의존성 9. 상수, 제네릭, 루프 const , loop , 블록 주석, 제네릭", "source": "docs/by-example/README.md"}, {"key": "book-getting-started", "path": "docs/book/01-getting-started.md", "nav": "시작하기", "title": "1. 시작하기 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"1-시작하기\" id=\"book-getting-started--1-시작하기\">1. 시작하기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-getting-started--1-시작하기\">¶</a></h1>\n<p>이 장에서는 컴파일러를 준비하고, 첫 프로그램을 컴파일해 실행하고, <code>Tmake.toml</code> 프로젝트를 만든다.</p>\n<h2 class=\"doc-heading\" data-slug=\"11-tam이란\" id=\"book-getting-started--11-tam이란\">1.1 TAM이란<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-getting-started--11-tam이란\">¶</a></h2>\n<p>TAM 프로그램은 <code>tamc</code>(TAM 컴파일러)가 <strong>LLVM IR</strong>로 번역하고, LLVM 도구가 기계어로 바꾼다. 결과는 평범한 네이티브 실행 파일이다. 런타임이나 가상 머신이 따라붙지 않는다.</p>\n<p>TAM의 약속은 세 가지다.</p>\n<ul>\n<li><strong>간결하다.</strong> 세미콜론도, 화살표(<code>-&gt;</code>)도, 수명(lifetime) 표기도 없다. 지역 변수의 타입은 추론한다.</li>\n<li><strong>안전하다.</strong> 이동 후 사용, 댕글링 참조, 이중 해제, 누수 같은 메모리 오류는 <strong>컴파일 시간에</strong> 거절된다. 정수 오버플로, 0으로 나누기, 배열 경계 위반은 <strong>실행 시간에 즉시 멈춘다</strong>(조용히 틀린 값을 만들지 않는다).</li>\n<li><strong>통제할 수 있다.</strong> <code>unsafe</code>에서는 raw 포인터, 직접 할당, 외부 함수 호출, 하드웨어 레지스터 접근이 가능하다. OS 없이 부팅되는 프로그램(UEFI, BIOS, 베어메탈)도 같은 언어로 만든다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"12-컴파일러-준비\" id=\"book-getting-started--12-컴파일러-준비\">1.2 컴파일러 준비<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-getting-started--12-컴파일러-준비\">¶</a></h2>\n<p><code>tamc</code>는 Rust로 작성되어 있다. 소스에서 빌드한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ cargo build --release\n$ ./target/release/tamc --version\ntamc 1.0.0\n</code></pre></div>\n<p>대상에 따라 LLVM 도구가 필요하다.</p>\n<table>\n<thead>\n<tr>\n<th>만들려는 것</th>\n<th>필요한 도구</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>호스트(Linux) 실행 파일</td>\n<td><code>clang</code> (PATH에 있어야 한다)</td>\n</tr>\n<tr>\n<td>Windows <code>.exe</code>, UEFI, BIOS, AArch64 이미지</td>\n<td><code>llc</code> 또는 <code>clang</code>, 그리고 <code>lld-link</code> (<code>tamc</code>와 <strong>같은 폴더</strong>에 두거나 PATH에 둔다)</td>\n</tr>\n</tbody>\n</table>\n<p>Windows에서는 설치 폴더에 <code>tamc.exe</code>, <code>lld-link.exe</code>, 그리고 <code>clang.exe</code>(또는 <code>llc.exe</code>) 세 파일만 있으면 된다. CRT도, Visual Studio도, Windows SDK도 필요 없다. <code>tamc</code>가 <code>kernel32</code>의 import 라이브러리를 스스로 만들어 링크한다. (저장소의 <code>.github/workflows/windows.yml</code>가 <code>tamc.exe</code>를 만들어 준다.)</p>\n<p><code>check</code> 명령(타입·소유권·빌림 검사만)은 어떤 외부 도구도 필요 없다.</p>\n<h2 class=\"doc-heading\" data-slug=\"13-hello-tam\" id=\"book-getting-started--13-hello-tam\">1.3 Hello, TAM<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-getting-started--13-hello-tam\">¶</a></h2>\n<p><code>hello.tam</code>을 만든다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\nfn main() i32 {\n    os::println(\"Hello, TAM!\")\n    0\n}\n// out: Hello, TAM!\n</code></pre></div>\n<p>컴파일하고 실행한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc build hello.tam -o hello\n$ ./hello\nHello, TAM!\n$ echo $?\n0\n</code></pre></div>\n<p>한 줄로 <code>tamc run hello.tam</code>도 된다(빌드하고 실행한 뒤 프로그램의 종료 코드로 끝난다).</p>\n<p>이 작은 프로그램에 TAM의 핵심이 들어 있다.</p>\n<ul>\n<li><code>use tam.os</code>는 <strong>표준 라이브러리 모듈</strong>을 가져온다. 이후 <code>os::println</code>처럼 <code>모듈::이름</code>으로 쓴다.</li>\n<li><code>fn main() i32</code>가 프로그램의 시작점이다. <strong>반환 타입은 화살표 없이</strong> 매개변수 목록 뒤에 쓴다.</li>\n<li>블록의 <strong>마지막 식이 반환값</strong>이다(<code>0</code>). 이 값이 프로그램의 <strong>종료 코드</strong>가 된다.</li>\n<li>문장은 <strong>줄바꿈으로 끝난다.</strong> 세미콜론이 없다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"종료-코드가-곧-결과다\" id=\"book-getting-started--종료-코드가-곧-결과다\">종료 코드가 곧 결과다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-getting-started--종료-코드가-곧-결과다\">¶</a></h3>\n<p><code>main</code>이 돌려주는 값이 종료 코드이므로, 출력 없이도 프로그램을 시험할 수 있다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 42\nfn main() i32 {\n    6 * 7\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc run answer.tam\n$ echo $?\n42\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"14-첫-오류-읽기\" id=\"book-getting-started--14-첫-오류-읽기\">1.4 첫 오류 읽기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-getting-started--14-첫-오류-읽기\">¶</a></h2>\n<p>컴파일러의 오류는 <strong>파일, 줄, 칸</strong>과 함께 문제의 코드를 가리킨다. 일부러 틀려 보자.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: mismatched types\nfn add(a: i32, b: i32) i32 { a + b }\n\nfn main() i32 {\n    let x: i64 = 5\n    add(x, 1)\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">error: mismatched types: expected `i32`, found `i64`\n --&gt; ex3.tam:4:9\n  |\n4 |     add(x, 1)\n  |         ^ expected `i32`\n</code></pre></div>\n<p>TAM은 정수 타입을 <strong>암묵적으로 바꾸지 않는다.</strong> <code>i64</code>를 <code>i32</code> 자리에 넣으려면 <code>x as i32</code>로 명시한다. 이 엄격함이 \"조용히 값이 잘리는\" 버그를 막는다.</p>\n<h2 class=\"doc-heading\" data-slug=\"15-프로젝트-만들기\" id=\"book-getting-started--15-프로젝트-만들기\">1.5 프로젝트 만들기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-getting-started--15-프로젝트-만들기\">¶</a></h2>\n<p>프로그램이 파일 하나를 넘어가면 <code>Tmake.toml</code> 프로젝트를 쓴다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc new greet\n     Created binary `greet` in greet\n$ cd greet\n$ tamc run\n   Compiling greet v0.1.0 (.)\n    Finished dev [opt-level 0] host in 0.07s\n     Running /home/me/greet/build/host/dev/greet\nHello, TAM!\n</code></pre></div>\n<p>만들어진 구조:</p>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>greet/\n├── Tmake.toml\n├── .gitignore\n└── src/\n    └── main.tam\n</code></pre></div>\n<p><code>Tmake.toml</code>은 표준 TOML이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TOML<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-toml\">[package]\nname = \"greet\"\nversion = \"0.1.0\"\ntamc = \"&gt;=1.0\"\n\n[dependencies]\n</code></pre></div>\n<p><code>tamc build</code>는 <code>build/host/dev/greet</code>를 만들고, 소스가 바뀌지 않았다면 다음 빌드는 <code>Fresh</code>로 건너뛴다. 의존성, 워크스페이스, 대상 설정은 <a href=\"#doc-book-modules-and-projects\">9장</a>과 <a href=\"#doc-ref-tmake\">Tmake.toml Documentation</a>에서 다룬다.</p>\n<h2 class=\"doc-heading\" data-slug=\"16-명령-요약\" id=\"book-getting-started--16-명령-요약\">1.6 명령 요약<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-getting-started--16-명령-요약\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>명령</th>\n<th>하는 일</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>tamc check &lt;파일&gt;</code></td>\n<td>검사만(링크 없음). 가장 빠르다</td>\n</tr>\n<tr>\n<td><code>tamc build &lt;파일&gt; -o &lt;출력&gt;</code></td>\n<td>실행 파일 만들기</td>\n</tr>\n<tr>\n<td><code>tamc run &lt;파일&gt;</code></td>\n<td>빌드하고 실행</td>\n</tr>\n<tr>\n<td><code>tamc emit-llvm &lt;파일&gt;</code></td>\n<td>LLVM IR(<code>.ll</code>) 출력</td>\n</tr>\n<tr>\n<td><code>tamc new/init/build/run/check/clean/tree/metadata</code></td>\n<td>프로젝트 모드</td>\n</tr>\n<tr>\n<td><code>--target host\\|windows\\|uefi\\|bios\\|aarch64</code></td>\n<td>컴파일 대상</td>\n</tr>\n</tbody>\n</table>\n<p>다음 장에서는 변수와 타입을 배운다.</p>\n<p>→ <a href=\"#doc-book-values-and-variables\">2. 값과 변수</a></p>\n", "text": "1. 시작하기 ¶ 이 장에서는 컴파일러를 준비하고, 첫 프로그램을 컴파일해 실행하고, Tmake.toml 프로젝트를 만든다. 1.1 TAM이란 ¶ TAM 프로그램은 tamc (TAM 컴파일러)가 LLVM IR 로 번역하고, LLVM 도구가 기계어로 바꾼다. 결과는 평범한 네이티브 실행 파일이다. 런타임이나 가상 머신이 따라붙지 않는다. TAM의 약속은 세 가지다. 간결하다. 세미콜론도, 화살표( -> )도, 수명(lifetime) 표기도 없다. 지역 변수의 타입은 추론한다. 안전하다. 이동 후 사용, 댕글링 참조, 이중 해제, 누수 같은 메모리 오류는 컴파일 시간에 거절된다. 정수 오버플로, 0으로 나누기, 배열 경계 위반은 실행 시간에 즉시 멈춘다 (조용히 틀린 값을 만들지 않는다). 통제할 수 있다. unsafe 에서는 raw 포인터, 직접 할당, 외부 함수 호출, 하드웨어 레지스터 접근이 가능하다. OS 없이 부팅되는 프로그램(UEFI, BIOS, 베어메탈)도 같은 언어로 만든다. 1.2 컴파일러 준비 ¶ tamc 는 Rust로 작성되어 있다. 소스에서 빌드한다. CONSOLE 복사 $ cargo build --release\n$ ./target/release/tamc --version\ntamc 1.0.0 대상에 따라 LLVM 도구가 필요하다. 만들려는 것 필요한 도구 호스트(Linux) 실행 파일 clang (PATH에 있어야 한다) Windows .exe , UEFI, BIOS, AArch64 이미지 llc 또는 clang , 그리고 lld-link ( tamc 와 같은 폴더 에 두거나 PATH에 둔다) Windows에서는 설치 폴더에 tamc.exe , lld-link.exe , 그리고 clang.exe (또는 llc.exe ) 세 파일만 있으면 된다. CRT도, Visual Studio도, Windows SDK도 필요 없다. tamc 가 kernel32 의 import 라이브러리를 스스로 만들어 링크한다. (저장소의 .github/workflows/windows.yml 가 tamc.exe 를 만들어 준다.) check 명령(타입·소유권·빌림 검사만)은 어떤 외부 도구도 필요 없다. 1.3 Hello, TAM ¶ hello.tam 을 만든다. TAM 복사 use tam.os\n\nfn main() i32 {\n    os::println(\"Hello, TAM!\")\n    0\n}\n// out: Hello, TAM! 컴파일하고 실행한다. CONSOLE 복사 $ tamc build hello.tam -o hello\n$ ./hello\nHello, TAM!\n$ echo $?\n0 한 줄로 tamc run hello.tam 도 된다(빌드하고 실행한 뒤 프로그램의 종료 코드로 끝난다). 이 작은 프로그램에 TAM의 핵심이 들어 있다. use tam.os 는 표준 라이브러리 모듈 을 가져온다. 이후 os::println 처럼 모듈::이름 으로 쓴다. fn main() i32 가 프로그램의 시작점이다. 반환 타입은 화살표 없이 매개변수 목록 뒤에 쓴다. 블록의 마지막 식이 반환값 이다( 0 ). 이 값이 프로그램의 종료 코드 가 된다. 문장은 줄바꿈으로 끝난다. 세미콜론이 없다. 종료 코드가 곧 결과다 ¶ main 이 돌려주는 값이 종료 코드이므로, 출력 없이도 프로그램을 시험할 수 있다. TAM 복사 // exit: 42\nfn main() i32 {\n    6 * 7\n} CONSOLE 복사 $ tamc run answer.tam\n$ echo $?\n42 1.4 첫 오류 읽기 ¶ 컴파일러의 오류는 파일, 줄, 칸 과 함께 문제의 코드를 가리킨다. 일부러 틀려 보자. TAM,ERROR 복사 // error: mismatched types\nfn add(a: i32, b: i32) i32 { a + b }\n\nfn main() i32 {\n    let x: i64 = 5\n    add(x, 1)\n} CONSOLE 복사 error: mismatched types: expected `i32`, found `i64`\n --> ex3.tam:4:9\n  |\n4 |     add(x, 1)\n  |         ^ expected `i32` TAM은 정수 타입을 암묵적으로 바꾸지 않는다. i64 를 i32 자리에 넣으려면 x as i32 로 명시한다. 이 엄격함이 \"조용히 값이 잘리는\" 버그를 막는다. 1.5 프로젝트 만들기 ¶ 프로그램이 파일 하나를 넘어가면 Tmake.toml 프로젝트를 쓴다. CONSOLE 복사 $ tamc new greet\n     Created binary `greet` in greet\n$ cd greet\n$ tamc run\n   Compiling greet v0.1.0 (.)\n    Finished dev [opt-level 0] host in 0.07s\n     Running /home/me/greet/build/host/dev/greet\nHello, TAM! 만들어진 구조: CODE 복사 greet/\n├── Tmake.toml\n├── .gitignore\n└── src/\n    └── main.tam Tmake.toml 은 표준 TOML이다. TOML 복사 [package]\nname = \"greet\"\nversion = \"0.1.0\"\ntamc = \">=1.0\"\n\n[dependencies] tamc build 는 build/host/dev/greet 를 만들고, 소스가 바뀌지 않았다면 다음 빌드는 Fresh 로 건너뛴다. 의존성, 워크스페이스, 대상 설정은 9장 과 Tmake.toml Documentation 에서 다룬다. 1.6 명령 요약 ¶ 명령 하는 일 tamc check <파일> 검사만(링크 없음). 가장 빠르다 tamc build <파일> -o <출력> 실행 파일 만들기 tamc run <파일> 빌드하고 실행 tamc emit-llvm <파일> LLVM IR( .ll ) 출력 tamc new/init/build/run/check/clean/tree/metadata 프로젝트 모드 --target host\\|windows\\|uefi\\|bios\\|aarch64 컴파일 대상 다음 장에서는 변수와 타입을 배운다. → 2. 값과 변수", "source": "docs/book/01-getting-started.md"}, {"key": "book-values-and-variables", "path": "docs/book/02-values-and-variables.md", "nav": "값과 변수", "title": "2. 값과 변수 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"2-값과-변수\" id=\"book-values-and-variables--2-값과-변수\">2. 값과 변수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--2-값과-변수\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"21-변수-let과-mut\" id=\"book-values-and-variables--21-변수-let과-mut\">2.1 변수: <code>let</code>과 <code>mut</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--21-변수-let과-mut\">¶</a></h2>\n<p>변수는 <code>let</code>으로 선언한다. <strong>기본은 불변</strong>이다. 값을 바꾸려면 <code>mut</code>으로 선언한다(<code>let mut</code>이 아니다).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nfn main() i32 {\n    let a = 5        // 불변\n    mut b = 1        // 가변\n    b = b + 1\n    b += 1           // 복합 대입\n    a + b - 1\n}\n</code></pre></div>\n<p>불변 변수에 대입하면 컴파일 오류다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot assign to immutable variable `x`\nfn main() i32 {\n    let x = 5\n    x = 6\n    x\n}\n</code></pre></div>\n<p>변수의 타입은 <strong>추론</strong>된다. 타입을 직접 쓰고 싶으면 이름 뒤에 <code>: 타입</code>을 붙인다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let a = 10          // i32 (정수 리터럴의 기본형)\n    let b: u8 = 200     // 명시\n    mut c: i64 = 1\n    c += 4_000_000_000  // i64라서 들어간다\n    if c != 4_000_000_001 { return 1 }\n    if (b as i32) + a != 210 { return 2 }\n    0\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"섀도잉\" id=\"book-values-and-variables--섀도잉\">섀도잉<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--섀도잉\">¶</a></h3>\n<p>같은 이름으로 다시 <code>let</code>하면 이전 변수가 <strong>가려진다.</strong> 타입이 달라도 된다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn main() i32 {\n    let x = 3\n    let x = x * 2     // 새 변수. 이전 x는 가려진다\n    x\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"22-기본-타입\" id=\"book-values-and-variables--22-기본-타입\">2.2 기본 타입<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--22-기본-타입\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>종류</th>\n<th>타입</th>\n<th>비고</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>부호 있는 정수</td>\n<td><code>i8</code> <code>i16</code> <code>i32</code> <code>i64</code></td>\n<td>정수 리터럴의 기본형은 <code>i32</code></td>\n</tr>\n<tr>\n<td>부호 없는 정수</td>\n<td><code>u8</code> <code>u16</code> <code>u32</code> <code>u64</code></td>\n<td>크기·길이(<code>.len</code>)는 <code>u64</code></td>\n</tr>\n<tr>\n<td>실수</td>\n<td><code>f64</code></td>\n<td><code>f32</code>는 없다</td>\n</tr>\n<tr>\n<td>참/거짓</td>\n<td><code>bool</code></td>\n<td><code>true</code>, <code>false</code></td>\n</tr>\n<tr>\n<td>문자열 조각</td>\n<td><code>str</code></td>\n<td><code>\"리터럴\"</code>의 타입. 읽기 전용</td>\n</tr>\n<tr>\n<td>소유 문자열</td>\n<td><code>String</code></td>\n<td>힙에 있다. <a href=\"#doc-book-ownership\">4장</a></td>\n</tr>\n</tbody>\n</table>\n<h3 class=\"doc-heading\" data-slug=\"정수\" id=\"book-values-and-variables--정수\">정수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--정수\">¶</a></h3>\n<p>정수 리터럴은 <code>42</code>, <code>1_000_000</code>(밑줄은 구분용), <code>0xFF</code>, <code>0o17</code>, <code>0b1010</code>로 쓴다. 문자 리터럴 <code>'a'</code>는 정수 값(97)이다.</p>\n<p><strong>정수끼리의 연산은 같은 타입이어야 한다.</strong> 다른 타입은 <code>as</code>로 맞춘다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let small: i32 = 7\n    let big: i64 = 3_000_000_000\n    let sum = small as i64 + big\n    if sum != 3_000_000_007 { return 1 }\n    if 'a' as i32 != 97 { return 2 }\n    0\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"실수와-불리언\" id=\"book-values-and-variables--실수와-불리언\">실수와 불리언<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--실수와-불리언\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 17\nfn main() i32 {\n    let r = 2.5 * 4.0 + 7.0     // 17.0\n    let big = 1.5e3             // 1500.0\n    let ok = r &gt; 10.0 &amp;&amp; big &gt; 1000.0\n    if ok { r as i32 } else { 0 }\n}\n</code></pre></div>\n<p><code>as</code>로 실수를 정수로 바꾸면 0 방향으로 잘리고, 범위를 넘으면 <strong>포화</strong>한다(<code>1e20 as i32</code>는 <code>i32</code>의 최댓값). <code>NaN</code>은 0이다. 정수를 <code>bool</code>로 바꾸는 <code>as</code>는 없다(<code>x != 0</code>을 쓴다).</p>\n<h3 class=\"doc-heading\" data-slug=\"문자열-조각-str\" id=\"book-values-and-variables--문자열-조각-str\">문자열 조각 <code>str</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--문자열-조각-str\">¶</a></h3>\n<p>문자열 리터럴은 <code>str</code>이다. 길이를 <code>.len</code>으로 읽는다(<code>u64</code>). <strong>바이트 수</strong>이므로 UTF-8 한글 한 글자는 3이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let s = \"한글\"\n    if s.len != 6 { return 1 }\n    if s == \"한글\" &amp;&amp; s != \"영어\" { 0 } else { 2 }\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"23-연산자\" id=\"book-values-and-variables--23-연산자\">2.3 연산자<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--23-연산자\">¶</a></h2>\n<p>산술 <code>+ - * / %</code>, 비교 <code>== != &lt; &lt;= &gt; &gt;=</code>, 논리 <code>&amp;&amp; || !</code>(단락 평가), 비트 <code>&amp; | ^ ~ &lt;&lt; &gt;&gt;</code>다. <code>if</code>의 조건은 <strong>반드시 <code>bool</code></strong>이다(0이 거짓인 규칙은 없다).</p>\n<p>우선순위는 Rust와 같다. 비트 연산자가 비교보다 <strong>높다</strong>(C와 다르다).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let flags = 0b1010\n    if flags &amp; 0b0010 == 0b0010 { 0 } else { 1 }   // (flags &amp; 2) == 2\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"정수-나눗셈과-나머지\" id=\"book-values-and-variables--정수-나눗셈과-나머지\">정수 나눗셈과 나머지<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--정수-나눗셈과-나머지\">¶</a></h3>\n<p>나눗셈은 0 방향으로 자르고, <code>%</code>의 부호는 왼쪽 피연산자를 따른다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    if 7 / 2 != 3 { return 1 }\n    if -7 / 2 != -3 { return 2 }\n    if -7 % 3 != -1 { return 3 }\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"24-오버플로는-멈춘다\" id=\"book-values-and-variables--24-오버플로는-멈춘다\">2.4 오버플로는 멈춘다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--24-오버플로는-멈춘다\">¶</a></h2>\n<p>C에서 정수 오버플로는 정의되지 않은 동작이고, 많은 언어는 값을 조용히 감싼다. <strong>TAM은 멈춘다</strong>(trap). 실행 중 <code>+ - *</code>가 범위를 넘으면 프로그램이 <code>integer overflow</code>로 끝난다. 0으로 나누거나 <code>MIN / -1</code>도 마찬가지다. 조용히 틀린 결과를 만드는 것보다 낫다는 철학이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: integer overflow\nfn main() i32 {\n    let a: i32 = 2147483647\n    a + 1\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">$ tamc run overflow.tam\ntam: panic: integer overflow\nerror: the program was terminated by signal 4\n</code></pre></div>\n<p><strong>감싸기를 원하면 명시한다.</strong> 해시나 난수 생성기처럼 모듈러 산술이 의도일 때 <code>wrapping_add</code>, <code>wrapping_sub</code>, <code>wrapping_mul</code>을 쓴다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let a: u8 = 250\n    let b = wrapping_add(a, 10)      // 260 mod 256 = 4\n    if b == 4 { 0 } else { 1 }\n}\n</code></pre></div>\n<p><code>as</code> 변환은 trap하지 않고 감싸거나 포화한다(<code>300 as u8</code>은 44).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    let big = 300\n    if big as u8 != 44 { return 1 }\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"25-정수-리터럴의-타입-결정\" id=\"book-values-and-variables--25-정수-리터럴의-타입-결정\">2.5 정수 리터럴의 타입 결정<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--25-정수-리터럴의-타입-결정\">¶</a></h2>\n<p>리터럴은 <strong>놓인 자리의 기대 타입</strong>을 따른다. 기대 타입이 없으면 <code>i32</code>다. 값이 들어가지 않으면 컴파일 오류다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: integer literal out of range for `u8`\nfn main() i32 {\n    let x: u8 = 300\n    0\n}\n</code></pre></div>\n<p>가장 큰 <code>u64</code> 값은 <code>0xFFFF_FFFF_FFFF_FFFF</code>로 쓰거나 <code>~0</code>(비트 반전)을 쓴다. 각 타입의 최솟값(<code>-128</code> for <code>i8</code>)도 리터럴로 쓸 수 있다.</p>\n<h2 class=\"doc-heading\" data-slug=\"26-상수-const\" id=\"book-values-and-variables--26-상수-const\">2.6 상수: <code>const</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--26-상수-const\">¶</a></h2>\n<p>바뀌지 않는 값에는 전역 <code>const</code>를 쓴다. <strong>타입을 반드시 쓰고</strong>, 값은 <strong>컴파일 시간에 계산</strong>된다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nconst WIDTH: i32 = 3\nconst HEIGHT: i32 = 2\nconst AREA: i32 = WIDTH * HEIGHT       // 다른 상수와 연산\nconst LIMIT: u64 = 1 &lt;&lt; 20\nconst GREETING: str = \"hi\"\n\nfn main() i32 {\n    if LIMIT != 1048576 { return 1 }\n    AREA + GREETING.len as i32 + 1      // 6 + 2 + 1\n}\n</code></pre></div>\n<ul>\n<li>정수형, <code>f64</code>, <code>bool</code>, <code>str</code>만 상수가 될 수 있다.</li>\n<li>쓸 수 있는 것은 리터럴, 다른 상수, 연산자뿐이다(함수 호출은 안 된다).</li>\n<li>값이 타입에 안 들어가면 컴파일 오류다: <code>const A: u8 = 256</code>.</li>\n<li>상수에는 대입할 수 없다. 같은 이름의 지역 변수는 상수를 가린다.</li>\n<li>다른 모듈에서 쓰려면 <code>pub const</code>로 선언한다.</li>\n<li><strong>배열 길이</strong>에 쓸 수 있다. 그래서 크기를 한 곳에서 정한다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 10\nconst N: u64 = 5\n\nfn main() i32 {\n    let a = [2; N]                      // [i32; 5]\n    mut s = 0\n    for i in 0..N { s += a[i] }\n    s\n}\n</code></pre></div>\n<p>상수는 정해진 타입을 가진다. 정수 리터럴처럼 문맥에 따라 타입이 변하지 않으므로 다른 정수형이 필요하면 <code>as</code>를 쓴다.</p>\n<h2 class=\"doc-heading\" data-slug=\"27-연습\" id=\"book-values-and-variables--27-연습\">2.7 연습<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-values-and-variables--27-연습\">¶</a></h2>\n<ol>\n<li><code>let x = 250</code>; <code>let y: u8 = x</code>는 왜 오류인가?</li>\n<li><code>1 &lt;&lt; 33</code>은 <code>i32</code>에서 얼마인가? (<a href=\"#doc-ref-reference--44-비트-연산자\">Reference 4.4절</a>에 규칙이 있다.)</li>\n<li>다음 중 trap하는 것은? <code>5 / 0</code>, <code>5.0 / 0.0</code>, <code>200u8 + 100</code>(리터럴 접미사는 없다 — <code>let a: u8 = 200; a + 100</code>).</li>\n</ol>\n<p>(답: 1) <code>x</code>는 <code>i32</code>이고 <code>u8</code>로의 암묵 변환은 없다. 2) 시프트 양은 31로 마스크되므로 <code>1 &lt;&lt; 1</code> = 2. 3) <code>5 / 0</code>과 <code>a + 100</code>만 trap한다. 실수 나눗셈은 IEEE 규칙대로 무한대가 나온다.)</p>\n<p>→ <a href=\"#doc-book-functions-and-control-flow\">3. 함수와 제어 흐름</a></p>\n", "text": "2. 값과 변수 ¶ 2.1 변수: let 과 mut ¶ 변수는 let 으로 선언한다. 기본은 불변 이다. 값을 바꾸려면 mut 으로 선언한다( let mut 이 아니다). TAM 복사 // exit: 7\nfn main() i32 {\n    let a = 5        // 불변\n    mut b = 1        // 가변\n    b = b + 1\n    b += 1           // 복합 대입\n    a + b - 1\n} 불변 변수에 대입하면 컴파일 오류다. TAM,ERROR 복사 // error: cannot assign to immutable variable `x`\nfn main() i32 {\n    let x = 5\n    x = 6\n    x\n} 변수의 타입은 추론 된다. 타입을 직접 쓰고 싶으면 이름 뒤에 : 타입 을 붙인다. TAM 복사 // exit: 0\nfn main() i32 {\n    let a = 10          // i32 (정수 리터럴의 기본형)\n    let b: u8 = 200     // 명시\n    mut c: i64 = 1\n    c += 4_000_000_000  // i64라서 들어간다\n    if c != 4_000_000_001 { return 1 }\n    if (b as i32) + a != 210 { return 2 }\n    0\n} 섀도잉 ¶ 같은 이름으로 다시 let 하면 이전 변수가 가려진다. 타입이 달라도 된다. TAM 복사 // exit: 6\nfn main() i32 {\n    let x = 3\n    let x = x * 2     // 새 변수. 이전 x는 가려진다\n    x\n} 2.2 기본 타입 ¶ 종류 타입 비고 부호 있는 정수 i8 i16 i32 i64 정수 리터럴의 기본형은 i32 부호 없는 정수 u8 u16 u32 u64 크기·길이( .len )는 u64 실수 f64 f32 는 없다 참/거짓 bool true , false 문자열 조각 str \"리터럴\" 의 타입. 읽기 전용 소유 문자열 String 힙에 있다. 4장 정수 ¶ 정수 리터럴은 42 , 1_000_000 (밑줄은 구분용), 0xFF , 0o17 , 0b1010 로 쓴다. 문자 리터럴 'a' 는 정수 값(97)이다. 정수끼리의 연산은 같은 타입이어야 한다. 다른 타입은 as 로 맞춘다. TAM 복사 // exit: 0\nfn main() i32 {\n    let small: i32 = 7\n    let big: i64 = 3_000_000_000\n    let sum = small as i64 + big\n    if sum != 3_000_000_007 { return 1 }\n    if 'a' as i32 != 97 { return 2 }\n    0\n} 실수와 불리언 ¶ TAM 복사 // exit: 17\nfn main() i32 {\n    let r = 2.5 * 4.0 + 7.0     // 17.0\n    let big = 1.5e3             // 1500.0\n    let ok = r > 10.0 && big > 1000.0\n    if ok { r as i32 } else { 0 }\n} as 로 실수를 정수로 바꾸면 0 방향으로 잘리고, 범위를 넘으면 포화 한다( 1e20 as i32 는 i32 의 최댓값). NaN 은 0이다. 정수를 bool 로 바꾸는 as 는 없다( x != 0 을 쓴다). 문자열 조각 str ¶ 문자열 리터럴은 str 이다. 길이를 .len 으로 읽는다( u64 ). 바이트 수 이므로 UTF-8 한글 한 글자는 3이다. TAM 복사 // exit: 0\nfn main() i32 {\n    let s = \"한글\"\n    if s.len != 6 { return 1 }\n    if s == \"한글\" && s != \"영어\" { 0 } else { 2 }\n} 2.3 연산자 ¶ 산술 + - * / % , 비교 == != < <= > >= , 논리 && || ! (단락 평가), 비트 & | ^ ~ << >> 다. if 의 조건은 반드시 bool 이다(0이 거짓인 규칙은 없다). 우선순위는 Rust와 같다. 비트 연산자가 비교보다 높다 (C와 다르다). TAM 복사 // exit: 0\nfn main() i32 {\n    let flags = 0b1010\n    if flags & 0b0010 == 0b0010 { 0 } else { 1 }   // (flags & 2) == 2\n} 정수 나눗셈과 나머지 ¶ 나눗셈은 0 방향으로 자르고, % 의 부호는 왼쪽 피연산자를 따른다. TAM 복사 // exit: 0\nfn main() i32 {\n    if 7 / 2 != 3 { return 1 }\n    if -7 / 2 != -3 { return 2 }\n    if -7 % 3 != -1 { return 3 }\n    0\n} 2.4 오버플로는 멈춘다 ¶ C에서 정수 오버플로는 정의되지 않은 동작이고, 많은 언어는 값을 조용히 감싼다. TAM은 멈춘다 (trap). 실행 중 + - * 가 범위를 넘으면 프로그램이 integer overflow 로 끝난다. 0으로 나누거나 MIN / -1 도 마찬가지다. 조용히 틀린 결과를 만드는 것보다 낫다는 철학이다. TAM,TRAP 복사 // panic: integer overflow\nfn main() i32 {\n    let a: i32 = 2147483647\n    a + 1\n} CONSOLE 복사 $ tamc run overflow.tam\ntam: panic: integer overflow\nerror: the program was terminated by signal 4 감싸기를 원하면 명시한다. 해시나 난수 생성기처럼 모듈러 산술이 의도일 때 wrapping_add , wrapping_sub , wrapping_mul 을 쓴다. TAM 복사 // exit: 0\nfn main() i32 {\n    let a: u8 = 250\n    let b = wrapping_add(a, 10)      // 260 mod 256 = 4\n    if b == 4 { 0 } else { 1 }\n} as 변환은 trap하지 않고 감싸거나 포화한다( 300 as u8 은 44). TAM 복사 // exit: 0\nfn main() i32 {\n    let big = 300\n    if big as u8 != 44 { return 1 }\n    0\n} 2.5 정수 리터럴의 타입 결정 ¶ 리터럴은 놓인 자리의 기대 타입 을 따른다. 기대 타입이 없으면 i32 다. 값이 들어가지 않으면 컴파일 오류다. TAM,ERROR 복사 // error: integer literal out of range for `u8`\nfn main() i32 {\n    let x: u8 = 300\n    0\n} 가장 큰 u64 값은 0xFFFF_FFFF_FFFF_FFFF 로 쓰거나 ~0 (비트 반전)을 쓴다. 각 타입의 최솟값( -128 for i8 )도 리터럴로 쓸 수 있다. 2.6 상수: const ¶ 바뀌지 않는 값에는 전역 const 를 쓴다. 타입을 반드시 쓰고 , 값은 컴파일 시간에 계산 된다. TAM 복사 // exit: 9\nconst WIDTH: i32 = 3\nconst HEIGHT: i32 = 2\nconst AREA: i32 = WIDTH * HEIGHT       // 다른 상수와 연산\nconst LIMIT: u64 = 1 << 20\nconst GREETING: str = \"hi\"\n\nfn main() i32 {\n    if LIMIT != 1048576 { return 1 }\n    AREA + GREETING.len as i32 + 1      // 6 + 2 + 1\n} 정수형, f64 , bool , str 만 상수가 될 수 있다. 쓸 수 있는 것은 리터럴, 다른 상수, 연산자뿐이다(함수 호출은 안 된다). 값이 타입에 안 들어가면 컴파일 오류다: const A: u8 = 256 . 상수에는 대입할 수 없다. 같은 이름의 지역 변수는 상수를 가린다. 다른 모듈에서 쓰려면 pub const 로 선언한다. 배열 길이 에 쓸 수 있다. 그래서 크기를 한 곳에서 정한다. TAM 복사 // exit: 10\nconst N: u64 = 5\n\nfn main() i32 {\n    let a = [2; N]                      // [i32; 5]\n    mut s = 0\n    for i in 0..N { s += a[i] }\n    s\n} 상수는 정해진 타입을 가진다. 정수 리터럴처럼 문맥에 따라 타입이 변하지 않으므로 다른 정수형이 필요하면 as 를 쓴다. 2.7 연습 ¶ let x = 250 ; let y: u8 = x 는 왜 오류인가? 1 << 33 은 i32 에서 얼마인가? ( Reference 4.4절 에 규칙이 있다.) 다음 중 trap하는 것은? 5 / 0 , 5.0 / 0.0 , 200u8 + 100 (리터럴 접미사는 없다 — let a: u8 = 200; a + 100 ). (답: 1) x 는 i32 이고 u8 로의 암묵 변환은 없다. 2) 시프트 양은 31로 마스크되므로 1 << 1 = 2. 3) 5 / 0 과 a + 100 만 trap한다. 실수 나눗셈은 IEEE 규칙대로 무한대가 나온다.) → 3. 함수와 제어 흐름", "source": "docs/book/02-values-and-variables.md"}, {"key": "book-functions-and-control-flow", "path": "docs/book/03-functions-and-control-flow.md", "nav": "함수와 제어 흐름", "title": "3. 함수와 제어 흐름 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"3-함수와-제어-흐름\" id=\"book-functions-and-control-flow--3-함수와-제어-흐름\">3. 함수와 제어 흐름<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--3-함수와-제어-흐름\">¶</a></h1>\n<h2 class=\"doc-heading\" data-slug=\"31-함수\" id=\"book-functions-and-control-flow--31-함수\">3.1 함수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--31-함수\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\nfn add(a: i32, b: i32) i32 {\n    a + b\n}\n\nfn main() i32 {\n    add(3, 4)\n}\n</code></pre></div>\n<ul>\n<li>매개변수와 반환 타입은 <strong>반드시 쓴다</strong>(함수 시그니처는 TAM에서 추론하지 않는다).</li>\n<li>반환 타입은 <code>)</code> 뒤에 화살표 없이 쓴다.</li>\n<li>본문 블록의 <strong>마지막 식</strong>이 반환값이다. 그 줄에 세미콜론도 <code>return</code>도 붙이지 않는다.</li>\n<li>반환 타입을 생략한 함수는 값을 돌려주지 않는다.</li>\n<li>함수는 파일 안 어디에 정의해도 보인다(호출보다 뒤에 있어도 된다).</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"return은-조기-반환\" id=\"book-functions-and-control-flow--return은-조기-반환\"><code>return</code>은 조기 반환<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--return은-조기-반환\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nfn sign(x: i32) i32 {\n    if x &lt; 0 { return -1 }\n    if x == 0 { return 0 }\n    1\n}\n\nfn main() i32 {\n    sign(-5) + sign(0) + sign(9) + 3\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"매개변수는-불변이다\" id=\"book-functions-and-control-flow--매개변수는-불변이다\">매개변수는 불변이다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--매개변수는-불변이다\">¶</a></h3>\n<p>값을 바꿔야 하면 본문에서 가변 변수로 다시 묶는다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 10\nfn count_to(limit: i32) i32 {\n    mut i = 0\n    while i &lt; limit { i += 1 }\n    i\n}\n\nfn main() i32 { count_to(10) }\n</code></pre></div>\n<p>값이 없는 함수는 반환 타입을 쓰지 않는다. 그 호출 결과를 변수에 묶을 수는 없다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn note(x: i32) {\n    if x &gt; 100 { return }\n}\n\nfn main() i32 {\n    note(5)\n    0\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"재귀\" id=\"book-functions-and-control-flow--재귀\">재귀<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--재귀\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 55\nfn fib(n: i32) i32 {\n    if n &lt; 2 { n } else { fib(n - 1) + fib(n - 2) }\n}\n\nfn main() i32 { fib(10) }\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"32-if는-표현식이다\" id=\"book-functions-and-control-flow--32-if는-표현식이다\">3.2 <code>if</code>는 표현식이다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--32-if는-표현식이다\">¶</a></h2>\n<p><code>if</code>는 값을 가진다. 양쪽 가지의 타입이 같아야 한다. 조건은 <code>bool</code>이어야 한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 1\nfn main() i32 {\n    let x = 5\n    let kind = if x &gt; 3 { 1 } else { 2 }\n    kind\n}\n</code></pre></div>\n<p><code>else if</code>로 이어 쓸 수 있고, <code>else</code> 없는 <code>if</code>는 값이 없는 문장이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 20\nfn main() i32 {\n    let n = 15\n    mut r = 0\n    if n &lt; 10 {\n        r = 10\n    } else if n &lt; 20 {\n        r = 20\n    } else {\n        r = 30\n    }\n    r\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"33-줄바꿈과-문장\" id=\"book-functions-and-control-flow--33-줄바꿈과-문장\">3.3 줄바꿈과 문장<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--33-줄바꿈과-문장\">¶</a></h2>\n<p>TAM은 <strong>줄바꿈이 문장의 끝</strong>이다. 한 줄에 여러 문장을 쓰려면 <code>;</code>로 구분한다. 줄 끝이 연산자나 <code>,</code>, <code>(</code>, <code>[</code>, <code>{</code>이면 다음 줄로 이어지고, 다음 줄이 <code>.</code>으로 시작해도 이어진다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn main() i32 {\n    let a = 1; let b = 2\n    let total = a +\n        b +\n        3\n    total\n}\n</code></pre></div>\n<p>주의: <strong>다음 줄이 연산자로 시작하면 이어지지 않는다.</strong> 연산자는 줄 끝에 둔다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: expected an expression, found `+`\nfn main() i32 {\n    let x = 1\n        + 2\n    x\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"주석\" id=\"book-functions-and-control-flow--주석\">주석<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--주석\">¶</a></h3>\n<p><code>//</code>는 줄 끝까지, <code>/* ... */</code>는 블록 주석이며 <strong>중첩된다</strong>. 여러 줄에 걸친 블록 주석은 줄바꿈 하나로 취급한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 7\n/* 블록 주석 /* 중첩 */ 도 된다 */\nfn main() i32 {\n    let x = 4 /* 문장 중간의 주석 */ + 3\n    x\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"34-반복-while\" id=\"book-functions-and-control-flow--34-반복-while\">3.4 반복: <code>while</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--34-반복-while\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 45\nfn main() i32 {\n    mut i = 0\n    mut sum = 0\n    while i &lt; 10 {\n        sum += i\n        i += 1\n    }\n    sum\n}\n</code></pre></div>\n<p><code>break</code>는 가장 안쪽 루프를 빠져나가고 <code>continue</code>는 다음 반복으로 간다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 16\nfn main() i32 {\n    mut i = 0\n    mut s = 0\n    while i &lt; 10 {\n        i += 1\n        if i % 2 == 0 { continue }   // 짝수는 건너뛴다\n        if i &gt; 7 { break }           // 7을 넘으면 끝\n        s += i                       // 1 + 3 + 5 + 7\n    }\n    s\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"35-반복-for\" id=\"book-functions-and-control-flow--35-반복-for\">3.5 반복: <code>for</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--35-반복-for\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>for i in 0..5 { }     // 0, 1, 2, 3, 4 (끝 제외)\nfor i in 0..=5 { }    // 0 … 5 (끝 포함)\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 15\nfn main() i32 {\n    mut s = 0\n    for i in 1..=5 { s += i }\n    s\n}\n</code></pre></div>\n<ul>\n<li>루프 변수 <code>i</code>는 <strong>불변</strong>이다(바꿀 수 없다).</li>\n<li>끝점이 정수 리터럴이면 <code>i</code>는 <code>i32</code>다. 다른 정수형이 필요하면 끝점을 그 타입의 변수로 쓴다.</li>\n<li>슬라이스와 배열에도 쓴다(<code>for x in &amp;a[..]</code>, <a href=\"#doc-book-arrays-and-slices\">7장</a>).</li>\n<li>이터레이터는 없다. 범위와 슬라이스만 된다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"for와-정수형\" id=\"book-functions-and-control-flow--for와-정수형\"><code>for</code>와 정수형<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--for와-정수형\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 10\nfn main() i32 {\n    let n: u64 = 5\n    mut s: u64 = 0\n    for i in 0..n { s += i }      // i는 u64\n    s as i32\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"중첩-루프에서의-break\" id=\"book-functions-and-control-flow--중첩-루프에서의-break\">중첩 루프에서의 <code>break</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--중첩-루프에서의-break\">¶</a></h3>\n<p><code>break</code>는 <strong>안쪽</strong> 루프만 끝낸다. 레이블은 없다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn main() i32 {\n    mut found = 0\n    for i in 0..4 {\n        for j in 0..4 {\n            if j &gt; i { break }       // 안쪽 루프만 끝\n            found += 1\n        }\n    }\n    found - 4\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"무한-반복-loop\" id=\"book-functions-and-control-flow--무한-반복-loop\">무한 반복: <code>loop</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--무한-반복-loop\">¶</a></h3>\n<p><code>loop { ... }</code>는 <code>while true { ... }</code>와 같다. <code>break</code>나 <code>return</code>으로 빠져나간다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 13\nfn find() i32 {\n    mut i = 0\n    loop {\n        i += 1\n        if i == 5 { return i }\n    }                              // break가 없는 loop는 끝나지 않으므로 뒤에 값이 필요 없다\n}\n\nfn main() i32 {\n    mut n = 0\n    loop {\n        n += 2\n        if n &gt; 7 { break }\n    }\n    n + find()                     // 8 + 5\n}\n</code></pre></div>\n<p>본문에 <code>break</code>가 하나라도 있으면(이 루프를 끝내는 것) <code>loop</code> 뒤로 흐르는 길이 생기므로, 값을 돌려주는 함수라면 그 뒤에 최종 식이 있어야 한다.</p>\n<h2 class=\"doc-heading\" data-slug=\"36-값을-돌려주는-패턴\" id=\"book-functions-and-control-flow--36-값을-돌려주는-패턴\">3.6 값을 돌려주는 패턴<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--36-값을-돌려주는-패턴\">¶</a></h2>\n<p>TAM에는 <code>break 값</code>이 없다. 값을 찾는 루프는 변수와 함께 쓴다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nfn first_square_over(limit: i32) i32 {\n    mut n = 1\n    while n * n &lt;= limit { n += 1 }\n    n\n}\n\nfn main() i32 { first_square_over(20) }   // 5*5 = 25 &gt; 20\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"37-연습\" id=\"book-functions-and-control-flow--37-연습\">3.7 연습<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-functions-and-control-flow--37-연습\">¶</a></h2>\n<ol>\n<li>1부터 100까지 3 또는 5의 배수의 합을 구하는 프로그램을 쓰라. (답: 2418)</li>\n<li>두 수의 최대공약수를 재귀로 구하는 <code>fn gcd(a: i64, b: i64) i64</code>를 쓰라.</li>\n</ol>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn gcd(a: i64, b: i64) i64 {\n    if b == 0 { a } else { gcd(b, a % b) }\n}\n\nfn main() i32 { gcd(48, 18) as i32 }\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn main() i32 {\n    mut s = 0\n    for i in 1..=100 {\n        if i % 3 == 0 || i % 5 == 0 { s += i }\n    }\n    if s == 2418 { 0 } else { 1 }\n}\n</code></pre></div>\n<p>→ <a href=\"#doc-book-ownership\">4. 소유권</a></p>\n", "text": "3. 함수와 제어 흐름 ¶ 3.1 함수 ¶ TAM 복사 // exit: 7\nfn add(a: i32, b: i32) i32 {\n    a + b\n}\n\nfn main() i32 {\n    add(3, 4)\n} 매개변수와 반환 타입은 반드시 쓴다 (함수 시그니처는 TAM에서 추론하지 않는다). 반환 타입은 ) 뒤에 화살표 없이 쓴다. 본문 블록의 마지막 식 이 반환값이다. 그 줄에 세미콜론도 return 도 붙이지 않는다. 반환 타입을 생략한 함수는 값을 돌려주지 않는다. 함수는 파일 안 어디에 정의해도 보인다(호출보다 뒤에 있어도 된다). return 은 조기 반환 ¶ TAM 복사 // exit: 3\nfn sign(x: i32) i32 {\n    if x < 0 { return -1 }\n    if x == 0 { return 0 }\n    1\n}\n\nfn main() i32 {\n    sign(-5) + sign(0) + sign(9) + 3\n} 매개변수는 불변이다 ¶ 값을 바꿔야 하면 본문에서 가변 변수로 다시 묶는다. TAM 복사 // exit: 10\nfn count_to(limit: i32) i32 {\n    mut i = 0\n    while i < limit { i += 1 }\n    i\n}\n\nfn main() i32 { count_to(10) } 값이 없는 함수는 반환 타입을 쓰지 않는다. 그 호출 결과를 변수에 묶을 수는 없다. TAM 복사 // exit: 0\nfn note(x: i32) {\n    if x > 100 { return }\n}\n\nfn main() i32 {\n    note(5)\n    0\n} 재귀 ¶ TAM 복사 // exit: 55\nfn fib(n: i32) i32 {\n    if n < 2 { n } else { fib(n - 1) + fib(n - 2) }\n}\n\nfn main() i32 { fib(10) } 3.2 if 는 표현식이다 ¶ if 는 값을 가진다. 양쪽 가지의 타입이 같아야 한다. 조건은 bool 이어야 한다. TAM 복사 // exit: 1\nfn main() i32 {\n    let x = 5\n    let kind = if x > 3 { 1 } else { 2 }\n    kind\n} else if 로 이어 쓸 수 있고, else 없는 if 는 값이 없는 문장이다. TAM 복사 // exit: 20\nfn main() i32 {\n    let n = 15\n    mut r = 0\n    if n < 10 {\n        r = 10\n    } else if n < 20 {\n        r = 20\n    } else {\n        r = 30\n    }\n    r\n} 3.3 줄바꿈과 문장 ¶ TAM은 줄바꿈이 문장의 끝 이다. 한 줄에 여러 문장을 쓰려면 ; 로 구분한다. 줄 끝이 연산자나 , , ( , [ , { 이면 다음 줄로 이어지고, 다음 줄이 . 으로 시작해도 이어진다. TAM 복사 // exit: 6\nfn main() i32 {\n    let a = 1; let b = 2\n    let total = a +\n        b +\n        3\n    total\n} 주의: 다음 줄이 연산자로 시작하면 이어지지 않는다. 연산자는 줄 끝에 둔다. TAM,ERROR 복사 // error: expected an expression, found `+`\nfn main() i32 {\n    let x = 1\n        + 2\n    x\n} 주석 ¶ // 는 줄 끝까지, /* ... */ 는 블록 주석이며 중첩된다 . 여러 줄에 걸친 블록 주석은 줄바꿈 하나로 취급한다. TAM 복사 // exit: 7\n/* 블록 주석 /* 중첩 */ 도 된다 */\nfn main() i32 {\n    let x = 4 /* 문장 중간의 주석 */ + 3\n    x\n} 3.4 반복: while ¶ TAM 복사 // exit: 45\nfn main() i32 {\n    mut i = 0\n    mut sum = 0\n    while i < 10 {\n        sum += i\n        i += 1\n    }\n    sum\n} break 는 가장 안쪽 루프를 빠져나가고 continue 는 다음 반복으로 간다. TAM 복사 // exit: 16\nfn main() i32 {\n    mut i = 0\n    mut s = 0\n    while i < 10 {\n        i += 1\n        if i % 2 == 0 { continue }   // 짝수는 건너뛴다\n        if i > 7 { break }           // 7을 넘으면 끝\n        s += i                       // 1 + 3 + 5 + 7\n    }\n    s\n} 3.5 반복: for ¶ CODE 복사 for i in 0..5 { }     // 0, 1, 2, 3, 4 (끝 제외)\nfor i in 0..=5 { }    // 0 … 5 (끝 포함) TAM 복사 // exit: 15\nfn main() i32 {\n    mut s = 0\n    for i in 1..=5 { s += i }\n    s\n} 루프 변수 i 는 불변 이다(바꿀 수 없다). 끝점이 정수 리터럴이면 i 는 i32 다. 다른 정수형이 필요하면 끝점을 그 타입의 변수로 쓴다. 슬라이스와 배열에도 쓴다( for x in &a[..] , 7장 ). 이터레이터는 없다. 범위와 슬라이스만 된다. for 와 정수형 ¶ TAM 복사 // exit: 10\nfn main() i32 {\n    let n: u64 = 5\n    mut s: u64 = 0\n    for i in 0..n { s += i }      // i는 u64\n    s as i32\n} 중첩 루프에서의 break ¶ break 는 안쪽 루프만 끝낸다. 레이블은 없다. TAM 복사 // exit: 6\nfn main() i32 {\n    mut found = 0\n    for i in 0..4 {\n        for j in 0..4 {\n            if j > i { break }       // 안쪽 루프만 끝\n            found += 1\n        }\n    }\n    found - 4\n} 무한 반복: loop ¶ loop { ... } 는 while true { ... } 와 같다. break 나 return 으로 빠져나간다. TAM 복사 // exit: 13\nfn find() i32 {\n    mut i = 0\n    loop {\n        i += 1\n        if i == 5 { return i }\n    }                              // break가 없는 loop는 끝나지 않으므로 뒤에 값이 필요 없다\n}\n\nfn main() i32 {\n    mut n = 0\n    loop {\n        n += 2\n        if n > 7 { break }\n    }\n    n + find()                     // 8 + 5\n} 본문에 break 가 하나라도 있으면(이 루프를 끝내는 것) loop 뒤로 흐르는 길이 생기므로, 값을 돌려주는 함수라면 그 뒤에 최종 식이 있어야 한다. 3.6 값을 돌려주는 패턴 ¶ TAM에는 break 값 이 없다. 값을 찾는 루프는 변수와 함께 쓴다. TAM 복사 // exit: 5\nfn first_square_over(limit: i32) i32 {\n    mut n = 1\n    while n * n <= limit { n += 1 }\n    n\n}\n\nfn main() i32 { first_square_over(20) }   // 5*5 = 25 > 20 3.7 연습 ¶ 1부터 100까지 3 또는 5의 배수의 합을 구하는 프로그램을 쓰라. (답: 2418) 두 수의 최대공약수를 재귀로 구하는 fn gcd(a: i64, b: i64) i64 를 쓰라. TAM 복사 // exit: 6\nfn gcd(a: i64, b: i64) i64 {\n    if b == 0 { a } else { gcd(b, a % b) }\n}\n\nfn main() i32 { gcd(48, 18) as i32 } TAM 복사 // exit: 0\nfn main() i32 {\n    mut s = 0\n    for i in 1..=100 {\n        if i % 3 == 0 || i % 5 == 0 { s += i }\n    }\n    if s == 2418 { 0 } else { 1 }\n} → 4. 소유권", "source": "docs/book/03-functions-and-control-flow.md"}, {"key": "book-ownership", "path": "docs/book/04-ownership.md", "nav": "소유권", "title": "4. 소유권 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"4-소유권\" id=\"book-ownership--4-소유권\">4. 소유권<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-ownership--4-소유권\">¶</a></h1>\n<p>소유권은 TAM의 중심 개념이다. 가비지 컬렉터 없이도 메모리를 <strong>누수 없이, 이중 해제 없이, 해제된 메모리를 쓰지 않고</strong> 다루게 해 준다. 규칙은 짧다.</p>\n<ol>\n<li>모든 값에는 <strong>소유자</strong>(변수)가 하나 있다.</li>\n<li>소유자가 스코프를 벗어나면 값이 <strong>자동으로 해제</strong>된다.</li>\n<li>값을 다른 변수에 넘기면 소유권이 <strong>이동</strong>한다. 이전 소유자는 더 쓸 수 없다.</li>\n</ol>\n<p>이 검사는 전부 <strong>컴파일 시간</strong>에 일어난다. 실행 시간 비용은 없다(조건부 이동을 위한 작은 플래그 하나 정도다).</p>\n<h2 class=\"doc-heading\" data-slug=\"41-스택-값과-힙-값\" id=\"book-ownership--41-스택-값과-힙-값\">4.1 스택 값과 힙 값<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-ownership--41-스택-값과-힙-값\">¶</a></h2>\n<p>정수, <code>f64</code>, <code>bool</code>, <code>str</code>, 참조는 <strong>Copy</strong>다. 대입하면 복사되고 둘 다 계속 쓸 수 있다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 10\nfn main() i32 {\n    let a = 5\n    let b = a        // 복사\n    a + b\n}\n</code></pre></div>\n<p>힙을 소유하는 <code>String</code>, 그리고 <strong>구조체와 배열</strong>은 <strong>이동 타입</strong>이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nfn main() i32 {\n    let s = string_from(\"tam\")\n    let t = s              // s의 소유권이 t로 이동\n    t.len as i32\n}\n</code></pre></div>\n<p>이동한 뒤에 <code>s</code>를 쓰면 컴파일 오류다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: use of moved value `s`\nfn main() i32 {\n    let s = string_from(\"tam\")\n    let t = s\n    s.len as i32\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">error: use of moved value `s`\n --&gt; ex1.tam:4:5\n  |\n3 |     let t = s\n  |             - value moved here\n4 |     s.len as i32\n  |     ^^^^^ value used here after move\n</code></pre></div>\n<p>오류는 <strong>이동한 위치</strong>와 <strong>다시 쓴 위치</strong>를 함께 보여 준다.</p>\n<blockquote>\n<p>구조체와 배열은 필드가 모두 정수여도 이동 타입이다. 복사하려면 필드를 읽어 새 값을 만든다. (Copy 구조체 표기는 아직 없다.)</p>\n</blockquote>\n<h2 class=\"doc-heading\" data-slug=\"42-string\" id=\"book-ownership--42-string\">4.2 <code>String</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-ownership--42-string\">¶</a></h2>\n<p><code>String</code>은 힙의 가변 길이 문자열(포인터, 길이, 용량)이다.</p>\n<table>\n<thead>\n<tr>\n<th>함수</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>string_from(str) String</code></td>\n<td>리터럴(<code>str</code>)을 힙에 복사해 <code>String</code>을 만든다</td>\n</tr>\n<tr>\n<td><code>string_push(&amp;mut String, u8)</code></td>\n<td>바이트 하나를 덧붙인다</td>\n</tr>\n<tr>\n<td><code>as_str(&amp;String) str</code></td>\n<td>읽기용 <code>str</code>을 빌린다(복사 없음)</td>\n</tr>\n<tr>\n<td><code>s.len</code></td>\n<td>길이(<code>u64</code>)</td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nfn main() i32 {\n    mut s = string_from(\"tam\")\n    string_push(&amp;mut s, 33)         // '!'\n    string_push(&amp;mut s, 33)\n    s.len as i32\n}\n</code></pre></div>\n<p>이어 붙이기와 정수 → 문자열은 표준 라이브러리 <code>tam.fmt</code>에 있다(<a href=\"#doc-ref-stdlib--4-tamfmt\">Standard Library</a>).</p>\n<h3 class=\"doc-heading\" data-slug=\"복사하고-싶을-때\" id=\"book-ownership--복사하고-싶을-때\">복사하고 싶을 때<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-ownership--복사하고-싶을-때\">¶</a></h3>\n<p><code>String</code>을 복제하는 내장 함수는 없다. <code>str</code>로 빌려서 새로 만든다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn main() i32 {\n    let a = string_from(\"abc\")\n    let b = string_from(as_str(&amp;a))   // 힙에 따로 복사\n    a.len as i32 + b.len as i32       // 둘 다 살아 있다\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"43-자동-해제\" id=\"book-ownership--43-자동-해제\">4.3 자동 해제<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-ownership--43-자동-해제\">¶</a></h2>\n<p>값은 소유자가 스코프를 벗어날 때 <strong>선언의 역순으로</strong> 해제된다. 직접 <code>free</code>를 부르지 않는다. 함수가 끝날 때, <code>return</code>할 때, <code>?</code>로 일찍 빠질 때, 루프에서 <code>break</code>/<code>continue</code>할 때 모두 해제된다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn work() i32 {\n    let a = string_from(\"first\")\n    let b = string_from(\"second\")\n    if a.len &gt; 100 { return 1 }    // 이 return에서도 a, b는 해제된다\n    0\n}                                   // 정상 종료: b, a 순으로 해제\n\nfn main() i32 { work() }\n</code></pre></div>\n<p>valgrind에서 이런 프로그램을 돌리면 누수와 이중 해제가 <strong>0건</strong>이다. TAM의 테스트는 이를 자동으로 확인한다.</p>\n<p><strong>이동된 값은 해제되지 않는다</strong>(새 소유자가 해제한다). 이동 여부는 변수마다 둔 플래그로 판단하므로 <strong>조건부 이동</strong>도 정확하다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 4\nfn consume(s: String) i32 { s.len as i32 }\n\nfn main() i32 {\n    let s = string_from(\"abcd\")\n    if s.len &gt; 2 {\n        return consume(s)     // 이 가지에서만 이동. 다른 경로에서는 main이 해제한다\n    }\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"44-함수와-소유권\" id=\"book-ownership--44-함수와-소유권\">4.4 함수와 소유권<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-ownership--44-함수와-소유권\">¶</a></h2>\n<p>값을 인자로 넘기면 이동한다. 돌려받으려면 반환한다.</p>\n<p><strong>매개변수는 불변</strong>이므로 값을 바꾸려면 본문에서 <code>mut</code>으로 다시 묶는다(소유권이 새 변수로 이동한다).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn shout(s: String) String {\n    mut t = s                       // 소유권이 t로 이동\n    string_push(&amp;mut t, 33)\n    t\n}\n\nfn main() i32 {\n    let a = string_from(\"hey\")\n    let b = shout(a)                // a는 이동, 결과는 b가 소유\n    let c = shout(b)\n    c.len as i32 + 1\n}\n</code></pre></div>\n<p>값을 넘기고 돌려받는 일은 번거롭다. 그래서 <strong>빌림</strong>이 있다. 다음 장에서 본다.</p>\n<h2 class=\"doc-heading\" data-slug=\"45-구조체-안의-string\" id=\"book-ownership--45-구조체-안의-string\">4.5 구조체 안의 <code>String</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-ownership--45-구조체-안의-string\">¶</a></h2>\n<p>구조체가 <code>String</code>을 가지면 구조체도 자동으로 해제된다(필드도 함께). 구조체 전체를 이동하면 안의 값도 함께 이동한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 3\nstruct User {\n    name: String,\n    age: i32,\n}\n\nfn age_plus_len(u: User) i32 {\n    u.age + u.name.len as i32     // u는 이 함수가 끝날 때 해제된다\n}\n\nfn main() i32 {\n    let u = User { name: string_from(\"ab\"), age: 1 }\n    age_plus_len(u)\n}\n</code></pre></div>\n<p><strong>힙을 쥔 필드 하나만 꺼내 이동하는 것은 안 된다.</strong> 구조체가 부분적으로 비어 버리는 일을 막기 위해서다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot move\nstruct User { name: String, age: i32 }\n\nfn main() i32 {\n    let u = User { name: string_from(\"ab\"), age: 1 }\n    let n = u.name\n    0\n}\n</code></pre></div>\n<p>구조체 전체를 옮기거나, 필드를 <strong>빌려서</strong>(다음 장) 쓴다.</p>\n<h2 class=\"doc-heading\" data-slug=\"46-루프와-이동\" id=\"book-ownership--46-루프와-이동\">4.6 루프와 이동<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-ownership--46-루프와-이동\">¶</a></h2>\n<p>루프 안에서 바깥 값을 이동하면, 다음 반복에서 이미 이동한 값을 또 쓰게 되므로 오류다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: use of moved value `s`\nfn take(s: String) {}\n\nfn main() i32 {\n    let s = string_from(\"x\")\n    mut i = 0\n    while i &lt; 3 {\n        take(s)\n        i += 1\n    }\n    0\n}\n</code></pre></div>\n<p>이동한 직후에 <code>break</code>하면 괜찮다(그 경로는 다음 반복이 없다).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn take(s: String) {}\n\nfn main() i32 {\n    let s = string_from(\"x\")\n    mut i = 0\n    while i &lt; 3 {\n        take(s)\n        break\n    }\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"47-재대입\" id=\"book-ownership--47-재대입\">4.7 재대입<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-ownership--47-재대입\">¶</a></h2>\n<p><code>String</code> 변수에 새 값을 대입하면 <strong>이전 값이 먼저 해제</strong>된다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 4\nfn main() i32 {\n    mut s = string_from(\"old value\")\n    s = string_from(\"new!\")        // \"old value\"는 여기서 해제된다\n    s.len as i32\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"48-osexit와-trap\" id=\"book-ownership--48-osexit와-trap\">4.8 <code>os::exit</code>와 trap<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-ownership--48-osexit와-trap\">¶</a></h2>\n<p><code>os::exit</code>나 trap(패닉)은 프로세스를 즉시 끝내므로 <strong>살아 있는 값의 해제를 실행하지 않는다.</strong> 운영체제가 메모리를 회수하므로 누수 문제는 아니지만, 해제 시점에 해야 할 작업(예: 파일 닫기)은 직접 해야 한다.</p>\n<h2 class=\"doc-heading\" data-slug=\"49-정리\" id=\"book-ownership--49-정리\">4.9 정리<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-ownership--49-정리\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>규칙</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>소유자 하나</td>\n<td>모든 값에는 소유 변수가 하나</td>\n</tr>\n<tr>\n<td>이동</td>\n<td>대입, 인자 전달, 반환, 구조체 초기화는 소유권을 옮긴다(Copy 타입 제외)</td>\n</tr>\n<tr>\n<td>이동 후 사용 금지</td>\n<td>컴파일 오류(<code>use of moved value</code>)</td>\n</tr>\n<tr>\n<td>스코프 끝 = 해제</td>\n<td>선언 역순, 조기 탈출 포함</td>\n</tr>\n<tr>\n<td>부분 이동 금지</td>\n<td>힙을 쥔 필드 하나만 꺼낼 수 없다</td>\n</tr>\n</tbody>\n</table>\n<p>→ <a href=\"#doc-book-references-and-borrowing\">5. 참조와 빌림</a></p>\n", "text": "4. 소유권 ¶ 소유권은 TAM의 중심 개념이다. 가비지 컬렉터 없이도 메모리를 누수 없이, 이중 해제 없이, 해제된 메모리를 쓰지 않고 다루게 해 준다. 규칙은 짧다. 모든 값에는 소유자 (변수)가 하나 있다. 소유자가 스코프를 벗어나면 값이 자동으로 해제 된다. 값을 다른 변수에 넘기면 소유권이 이동 한다. 이전 소유자는 더 쓸 수 없다. 이 검사는 전부 컴파일 시간 에 일어난다. 실행 시간 비용은 없다(조건부 이동을 위한 작은 플래그 하나 정도다). 4.1 스택 값과 힙 값 ¶ 정수, f64 , bool , str , 참조는 Copy 다. 대입하면 복사되고 둘 다 계속 쓸 수 있다. TAM 복사 // exit: 10\nfn main() i32 {\n    let a = 5\n    let b = a        // 복사\n    a + b\n} 힙을 소유하는 String , 그리고 구조체와 배열 은 이동 타입 이다. TAM 복사 // exit: 3\nfn main() i32 {\n    let s = string_from(\"tam\")\n    let t = s              // s의 소유권이 t로 이동\n    t.len as i32\n} 이동한 뒤에 s 를 쓰면 컴파일 오류다. TAM,ERROR 복사 // error: use of moved value `s`\nfn main() i32 {\n    let s = string_from(\"tam\")\n    let t = s\n    s.len as i32\n} CONSOLE 복사 error: use of moved value `s`\n --> ex1.tam:4:5\n  |\n3 |     let t = s\n  |             - value moved here\n4 |     s.len as i32\n  |     ^^^^^ value used here after move 오류는 이동한 위치 와 다시 쓴 위치 를 함께 보여 준다. 구조체와 배열은 필드가 모두 정수여도 이동 타입이다. 복사하려면 필드를 읽어 새 값을 만든다. (Copy 구조체 표기는 아직 없다.) 4.2 String ¶ String 은 힙의 가변 길이 문자열(포인터, 길이, 용량)이다. 함수 설명 string_from(str) String 리터럴( str )을 힙에 복사해 String 을 만든다 string_push(&mut String, u8) 바이트 하나를 덧붙인다 as_str(&String) str 읽기용 str 을 빌린다(복사 없음) s.len 길이( u64 ) TAM 복사 // exit: 5\nfn main() i32 {\n    mut s = string_from(\"tam\")\n    string_push(&mut s, 33)         // '!'\n    string_push(&mut s, 33)\n    s.len as i32\n} 이어 붙이기와 정수 → 문자열은 표준 라이브러리 tam.fmt 에 있다( Standard Library ). 복사하고 싶을 때 ¶ String 을 복제하는 내장 함수는 없다. str 로 빌려서 새로 만든다. TAM 복사 // exit: 6\nfn main() i32 {\n    let a = string_from(\"abc\")\n    let b = string_from(as_str(&a))   // 힙에 따로 복사\n    a.len as i32 + b.len as i32       // 둘 다 살아 있다\n} 4.3 자동 해제 ¶ 값은 소유자가 스코프를 벗어날 때 선언의 역순으로 해제된다. 직접 free 를 부르지 않는다. 함수가 끝날 때, return 할 때, ? 로 일찍 빠질 때, 루프에서 break / continue 할 때 모두 해제된다. TAM 복사 // exit: 0\nfn work() i32 {\n    let a = string_from(\"first\")\n    let b = string_from(\"second\")\n    if a.len > 100 { return 1 }    // 이 return에서도 a, b는 해제된다\n    0\n}                                   // 정상 종료: b, a 순으로 해제\n\nfn main() i32 { work() } valgrind에서 이런 프로그램을 돌리면 누수와 이중 해제가 0건 이다. TAM의 테스트는 이를 자동으로 확인한다. 이동된 값은 해제되지 않는다 (새 소유자가 해제한다). 이동 여부는 변수마다 둔 플래그로 판단하므로 조건부 이동 도 정확하다. TAM 복사 // exit: 4\nfn consume(s: String) i32 { s.len as i32 }\n\nfn main() i32 {\n    let s = string_from(\"abcd\")\n    if s.len > 2 {\n        return consume(s)     // 이 가지에서만 이동. 다른 경로에서는 main이 해제한다\n    }\n    0\n} 4.4 함수와 소유권 ¶ 값을 인자로 넘기면 이동한다. 돌려받으려면 반환한다. 매개변수는 불변 이므로 값을 바꾸려면 본문에서 mut 으로 다시 묶는다(소유권이 새 변수로 이동한다). TAM 복사 // exit: 6\nfn shout(s: String) String {\n    mut t = s                       // 소유권이 t로 이동\n    string_push(&mut t, 33)\n    t\n}\n\nfn main() i32 {\n    let a = string_from(\"hey\")\n    let b = shout(a)                // a는 이동, 결과는 b가 소유\n    let c = shout(b)\n    c.len as i32 + 1\n} 값을 넘기고 돌려받는 일은 번거롭다. 그래서 빌림 이 있다. 다음 장에서 본다. 4.5 구조체 안의 String ¶ 구조체가 String 을 가지면 구조체도 자동으로 해제된다(필드도 함께). 구조체 전체를 이동하면 안의 값도 함께 이동한다. TAM 복사 // exit: 3\nstruct User {\n    name: String,\n    age: i32,\n}\n\nfn age_plus_len(u: User) i32 {\n    u.age + u.name.len as i32     // u는 이 함수가 끝날 때 해제된다\n}\n\nfn main() i32 {\n    let u = User { name: string_from(\"ab\"), age: 1 }\n    age_plus_len(u)\n} 힙을 쥔 필드 하나만 꺼내 이동하는 것은 안 된다. 구조체가 부분적으로 비어 버리는 일을 막기 위해서다. TAM,ERROR 복사 // error: cannot move\nstruct User { name: String, age: i32 }\n\nfn main() i32 {\n    let u = User { name: string_from(\"ab\"), age: 1 }\n    let n = u.name\n    0\n} 구조체 전체를 옮기거나, 필드를 빌려서 (다음 장) 쓴다. 4.6 루프와 이동 ¶ 루프 안에서 바깥 값을 이동하면, 다음 반복에서 이미 이동한 값을 또 쓰게 되므로 오류다. TAM,ERROR 복사 // error: use of moved value `s`\nfn take(s: String) {}\n\nfn main() i32 {\n    let s = string_from(\"x\")\n    mut i = 0\n    while i < 3 {\n        take(s)\n        i += 1\n    }\n    0\n} 이동한 직후에 break 하면 괜찮다(그 경로는 다음 반복이 없다). TAM 복사 // exit: 0\nfn take(s: String) {}\n\nfn main() i32 {\n    let s = string_from(\"x\")\n    mut i = 0\n    while i < 3 {\n        take(s)\n        break\n    }\n    0\n} 4.7 재대입 ¶ String 변수에 새 값을 대입하면 이전 값이 먼저 해제 된다. TAM 복사 // exit: 4\nfn main() i32 {\n    mut s = string_from(\"old value\")\n    s = string_from(\"new!\")        // \"old value\"는 여기서 해제된다\n    s.len as i32\n} 4.8 os::exit 와 trap ¶ os::exit 나 trap(패닉)은 프로세스를 즉시 끝내므로 살아 있는 값의 해제를 실행하지 않는다. 운영체제가 메모리를 회수하므로 누수 문제는 아니지만, 해제 시점에 해야 할 작업(예: 파일 닫기)은 직접 해야 한다. 4.9 정리 ¶ 규칙 의미 소유자 하나 모든 값에는 소유 변수가 하나 이동 대입, 인자 전달, 반환, 구조체 초기화는 소유권을 옮긴다(Copy 타입 제외) 이동 후 사용 금지 컴파일 오류( use of moved value ) 스코프 끝 = 해제 선언 역순, 조기 탈출 포함 부분 이동 금지 힙을 쥔 필드 하나만 꺼낼 수 없다 → 5. 참조와 빌림", "source": "docs/book/04-ownership.md"}, {"key": "book-references-and-borrowing", "path": "docs/book/05-references-and-borrowing.md", "nav": "참조와 빌림", "title": "5. 참조와 빌림 ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"5-참조와-빌림\" id=\"book-references-and-borrowing--5-참조와-빌림\">5. 참조와 빌림<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--5-참조와-빌림\">¶</a></h1>\n<p>값을 넘길 때마다 소유권을 옮기면 불편하다. <strong>참조</strong>는 소유권을 옮기지 않고 값을 <strong>빌려</strong> 준다. 빌림 검사기(borrow checker)는 빌린 값이 도중에 사라지거나 위험하게 바뀌지 않음을 컴파일 시간에 증명한다.</p>\n<h2 class=\"doc-heading\" data-slug=\"51-읽기-참조-t\" id=\"book-references-and-borrowing--51-읽기-참조-t\">5.1 읽기 참조 <code>&amp;T</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--51-읽기-참조-t\">¶</a></h2>\n<p><code>&amp;x</code>는 <code>x</code>를 읽기 전용으로 빌린다. <code>*r</code>로 값을 읽는다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nfn len_of(s: &amp;String) i32 {\n    s.len as i32          // 참조 너머의 필드도 바로 읽는다\n}\n\nfn main() i32 {\n    let s = string_from(\"hello\")\n    let n = len_of(&amp;s)     // 빌려 주기만 한다\n    n + 0 * s.len as i32   // s는 여전히 쓸 수 있다\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 6\nfn double(r: &amp;i32) i32 { *r * 2 }\n\nfn main() i32 {\n    let x = 3\n    double(&amp;x)\n}\n</code></pre></div>\n<p>참조는 Copy다. 읽기 참조는 <strong>여러 개</strong> 동시에 있을 수 있다.</p>\n<h2 class=\"doc-heading\" data-slug=\"52-쓰기-참조-mut-t\" id=\"book-references-and-borrowing--52-쓰기-참조-mut-t\">5.2 쓰기 참조 <code>&amp;mut T</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--52-쓰기-참조-mut-t\">¶</a></h2>\n<p><code>&amp;mut x</code>는 <code>x</code>를 <strong>배타적으로</strong> 빌려 바꿀 수 있게 한다. <code>x</code>가 <code>mut</code>여야 한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 11\nfn bump(x: &amp;mut i32) {\n    *x += 1\n}\n\nfn main() i32 {\n    mut n = 10\n    bump(&amp;mut n)\n    n\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot borrow immutable variable `a` as mutable\nfn main() i32 {\n    let a = 5\n    let r = &amp;mut a\n    0\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"53-빌림-규칙\" id=\"book-references-and-borrowing--53-빌림-규칙\">5.3 빌림 규칙<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--53-빌림-규칙\">¶</a></h2>\n<blockquote>\n<p>같은 값에 대해 <strong>읽기 참조 여러 개</strong> 또는 <strong>쓰기 참조 하나</strong>만 동시에 있을 수 있다. 참조는 가리키는 값보다 오래 살 수 없다.</p>\n</blockquote>\n<p>이 규칙이 데이터 레이스, 반복 중 컬렉션 수정, 해제 후 사용 같은 버그를 <strong>원천 봉쇄</strong>한다.</p>\n<h3 class=\"doc-heading\" data-slug=\"읽는-동안에는-바꿀-수-없다\" id=\"book-references-and-borrowing--읽는-동안에는-바꿀-수-없다\">읽는 동안에는 바꿀 수 없다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--읽는-동안에는-바꿀-수-없다\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot assign to `v` because it is borrowed\nfn main() i32 {\n    mut v = 10\n    let r = &amp;v\n    v += 1\n    *r\n}\n</code></pre></div>\n<div class=\"code-wrap\"><div class=\"code-label\">CONSOLE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-console\">error: cannot assign to `v` because it is borrowed\n --&gt; ex2.tam:4:5\n  |\n3 |     let r = &amp;v\n  |             -- `v` is borrowed here\n4 |     v += 1\n  |     ^ assignment to borrowed `v` occurs here\n5 |     *r\n  |     -- first borrow later used here\n</code></pre></div>\n<p>오류는 <strong>세 군데</strong>를 가리킨다: 빌린 곳, 충돌한 곳, 빌림이 다시 쓰이는 곳. 이 셋을 읽으면 무엇을 고쳐야 하는지 보인다. 보통 참조의 사용을 충돌 앞으로 옮기거나, 충돌을 참조 사용 뒤로 옮긴다.</p>\n<h3 class=\"doc-heading\" data-slug=\"쓰기-참조는-하나만\" id=\"book-references-and-borrowing--쓰기-참조는-하나만\">쓰기 참조는 하나만<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--쓰기-참조는-하나만\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot borrow `s` as mutable more than once at a time\nfn main() i32 {\n    mut s = string_from(\"a\")\n    let r = &amp;mut s\n    let q = &amp;mut s\n    string_push(r, 98)\n    0\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"읽기와-쓰기를-섞을-수-없다\" id=\"book-references-and-borrowing--읽기와-쓰기를-섞을-수-없다\">읽기와 쓰기를 섞을 수 없다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--읽기와-쓰기를-섞을-수-없다\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot borrow `s` as mutable because it is also borrowed as immutable\nfn main() i32 {\n    mut s = string_from(\"a\")\n    let view = as_str(&amp;s)\n    string_push(&amp;mut s, 98)\n    view.len as i32\n}\n</code></pre></div>\n<p><code>as_str(&amp;s)</code>가 돌려준 <code>str</code>은 <code>s</code>를 <strong>빌린</strong> 것이다. <code>s</code>를 바꾸면 <code>view</code>가 가리키는 메모리가 바뀌거나 옮겨질 수 있으니 막는다.</p>\n<h2 class=\"doc-heading\" data-slug=\"54-마지막-사용까지-nll\" id=\"book-references-and-borrowing--54-마지막-사용까지-nll\">5.4 \"마지막 사용까지\": NLL<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--54-마지막-사용까지-nll\">¶</a></h2>\n<p>참조가 살아 있는 구간은 <strong>마지막으로 쓰는 곳까지</strong>다. 스코프 끝까지가 아니다. 참조를 더 쓰지 않으면 이어지는 수정은 허용된다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 11\nfn main() i32 {\n    mut v = 10\n    let r = &amp;v\n    let seen = *r        // r의 마지막 사용\n    v += 1               // 이제 괜찮다\n    v + seen - 10\n}\n</code></pre></div>\n<h2 class=\"doc-heading\" data-slug=\"55-구조체의-필드는-따로-빌릴-수-있다\" id=\"book-references-and-borrowing--55-구조체의-필드는-따로-빌릴-수-있다\">5.5 구조체의 필드는 따로 빌릴 수 있다<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--55-구조체의-필드는-따로-빌릴-수-있다\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nstruct P { x: i32, y: i32 }\n\nfn main() i32 {\n    mut p = P { x: 1, y: 2 }\n    let a = &amp;mut p.x\n    let b = &amp;mut p.y          // 다른 필드라 동시에 가능\n    *a += 1\n    *b += 1\n    p.x + p.y\n}\n</code></pre></div>\n<p>구조체 <strong>전체</strong>와 그 필드는 서로 충돌한다. <strong>배열은 원소를 구분하지 않는다</strong>: <code>&amp;mut a[0]</code>과 <code>&amp;a[1]</code>은 동시에 만들 수 없다(보수적이다).</p>\n<h2 class=\"doc-heading\" data-slug=\"56-반환하는-참조와-댕글링\" id=\"book-references-and-borrowing--56-반환하는-참조와-댕글링\">5.6 반환하는 참조와 댕글링<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-book-references-and-borrowing--56-반환하는-참조와-댕글링\">¶</a></h2>\n<p>함수가 참조를 돌려줄 때, 그 참조는 <strong>호출자가 가진 값</strong>을 가리켜야 한다. 지역 변수를 가리키는 참조는 함수가 끝나면 사라지므로 컴파일러가 막는다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,ERROR<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,error\">// error: cannot return reference to local variable `x`\nfn bad() &amp;i32 {\n    let x = 5\n    &amp;x\n}\n\nfn main() i32 { *bad() }\n</code></pre></div>\n<p>인자로 받은 참조를 돌려주는 것은 괜찮다. 수명 표기는 필요 없다. 컴파일러가 본문에서 출처를 <strong>추론</strong>한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code
