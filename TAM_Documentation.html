e\nconst AREA: u64 = SIZE * SIZE\n\nstruct Grid {\n    cells: [i32; SIZE],\n}\n\nfn total(g: &Grid) i32 {\n    mut s = 0\n    for i in 0..SIZE { s += g.cells[i] }\n    s\n}\n\nfn main() i32 {\n    let g = Grid { cells: [1; SIZE] }\n    let SIZE = 100                       // 지역 변수가 상수를 가린다\n    mut r = total(&g) + NEG + SIZE       // 4 - 3 + 100\n    if BIG != 1099511627776 { return 1 }\n    if MASK as i32 != 255 { return 2 }\n    if PI * 2.0 != 7.0 { return 3 }\n    if NAME.len != 3 { return 4 }\n    if !ON { return 5 }\n    r += AREA as i32                     // + 16\n    r\n} TAM,ERROR 복사 // error: does not fit in `u8`\nconst A: u8 = 256\n\nfn main() i32 { 0 } 2.7 제네릭 ¶ 함수와 구조체에 타입 매개변수 를 줄 수 있다. 이름 뒤에 <A, B> 를 쓴다. 구현 방식은 C++ 템플릿과 같은 단형화 다. 쓰이는 타입마다 컴파일러가 코드를 따로 만들어(인스턴스), 실행 시간 비용이 없다. 다만 C++과 달리 template 키워드가 없고, 인스턴스가 만들어지는 지점이 명시적이며, 오류가 어느 호출 때문인지 알려 준다. CODE 복사 function = ... \"fn\" name [ tparams ] \"(\" ... \")\" ...\nstruct   = ... \"struct\" name [ tparams ] \"{\" ... \"}\"\nimpl     = \"impl\" name [ tparams ] \"{\" ... \"}\"\ntparams  = \"<\" ident { \",\" ident } \">\" 제네릭 함수 ¶ TAM 복사 // exit: 9\nfn max<T>(a: T, b: T) T {\n    if a > b { a } else { b }\n}\n\nfn main() i32 {\n    max(3, 9)                    // T = i32 (인자에서 추론)\n} 타입 인자는 다음 순서로 정해진다. 명시한 것 : max<i64>(3, 9) . 리터럴이 아닌 인자의 타입 : max(x, y) 의 x , y . 기대하는 타입 (반환 값이 쓰이는 자리): let z: u8 = zero() . 정수 리터럴만 남으면 i32 : max(3, 9) . 하나라도 정해지지 않으면 cannot infer type parameter T of f`` 오류다. TAM 복사 // exit: 9\nfn zero<T>() T { 0 }\n\nfn first<T>(a: &[T]) T { a[0] }\n\nfn main() i32 {\n    let a: i32 = zero()          // 기대 타입으로 T = i32\n    let b = zero<i64>()          // 명시\n    let arr = [4, 5, 6]\n    let c = first(&arr)          // &[i32; 3]에서 T = i32\n    a + b as i32 + c + 5\n} 호출 구문 이름<타입, ...>(인자) 에서 < 는 뒤에 > 와 ( / :: / { 가 이어질 때만 타입 인자로 읽는다. 그 밖에는 비교 연산자다( a < b ). 템플릿은 쓰일 때 검사된다 ¶ 제네릭 함수의 본문은 인스턴스가 만들어질 때 실제 타입으로 검사된다. 그래서 T 에 어떤 연산이 가능한지 미리 선언하지 않는다(트레이트 경계가 없다). 대신 인스턴스에서 오류가 나면 두 위치를 함께 보여 준다. TAM,ERROR 복사 // error: operator `>` cannot be applied to `P`\nstruct P { x: i32 }\n\nfn max<T>(a: T, b: T) T {\n    if a > b { a } else { b }\n}\n\nfn main() i32 {\n    let a = P { x: 1 }\n    let b = P { x: 2 }\n    max(a, b).x\n} CONSOLE 복사 error: operator `>` cannot be applied to `P`\n  --> ex.tam:4:8\n   |\n 4 |     if a > b { a } else { b }\n   |        ^ unsupported operand type\n...\n10 |     max(a, b).x\n   |     --------- while instantiating `max<P>` 한 번도 쓰이지 않은 제네릭은 검사되지 않는다 (문법은 검사된다). 함수 본문 안의 이름은 정의된 모듈에서, 호출하는 곳의 타입으로 해석된다. 제네릭 구조체와 impl ¶ TAM 복사 // exit: 7\nstruct Pair<A, B> {\n    first: A,\n    second: B,\n}\n\nimpl Pair<A, B> {\n    fn new(a: A, b: B) Self {\n        Pair { first: a, second: b }\n    }\n\n    fn swap(self) Pair<B, A> {\n        Pair { first: self.second, second: self.first }\n    }\n\n    fn get_first(&self) A { self.first }\n}\n\nfn main() i32 {\n    let p = Pair::new(2, 5)            // Pair<i32, i32>\n    let q: Pair<i32, i32> = p.swap()\n    let r = Pair<i32, i32> { first: 4, second: 1 }\n    q.first + r.get_first() - 2\n} 타입으로 쓸 때는 항상 인자를 준다: Pair<i32, f64> . 인자 없는 Pair 는 generic struct Pair needs type arguments 오류다(리터럴과 연관 함수 호출은 추론한다). 리터럴 Pair { first: 1, second: 2.5 } 는 필드 값에서 타입 인자를 추론한다. 명시할 수도 있다: Pair<i32, f64> { ... } . 연관 함수 는 Pair::new(..) 로 추론하거나 Pair<i32, f64>::new(..) 로 명시한다. impl Pair<X, Y> 의 X , Y 는 그 impl 안에서만 쓰는 이름이다(구조체 선언의 이름과 같을 필요는 없고, 개수만 같아야 한다). impl 안에서 Self 는 Pair<A, B> 다. Self { .. } 와 Self::new(..) 는 같은 인자를 쓴다. 인스턴스의 메서드는 처음 호출될 때 만들어진다. 같은 인스턴스의 같은 메서드는 하나만 생긴다. 인스턴스 이름은 Pair<i32,f64> 처럼 오류 메시지에 그대로 나온다. 자기 자신을 값으로 포함하는 인스턴스( struct Bad<T> { inner: Bad<T> } )는 contains itself by value 오류다. 포인터로 가리키는 것( next: *mut Node<T> )은 된다. 한계 ¶ 트레이트(경계)는 없다. T 에 대한 요구는 인스턴스 오류로만 알려진다. 메서드는 자기만의 타입 매개변수를 가질 수 없다 ( impl Foo { fn f<T>(..) } 오류). impl Pair<A, B> 의 A , B 만 쓴다. 필요하면 일반 제네릭 함수를 쓴다. 타입 매개변수 자리에 상수 값 ( [T; N] 의 N )은 쓸 수 없다. 타입만 된다. extern 함수와 main 은 제네릭일 수 없다. 자기 자신을 점점 큰 타입으로 인스턴스화하는 재귀는 깊이 64, 인스턴스 5000개 에서 generic instantiation limit exceeded 오류로 멈춘다. 힙을 가진 필드는 self.field 로 꺼내 이동할 수 없다는 기존 규칙( 8장 )은 제네릭에도 그대로다. T 가 String 인 인스턴스에서 self.v 를 반환하면 인스턴스 검사에서 오류가 난다. 3. 타입 ¶ 타입 설명 Copy i8 i16 i32 i64 부호 있는 정수(2의 보수) ✔ u8 u16 u32 u64 부호 없는 정수 ✔ f64 IEEE 754 배정밀도 ✔ bool true / false ✔ str 문자열 조각: (포인터, 길이). 읽기 전용, 소유하지 않음 ✔ String 힙의 소유 문자열: (포인터, 길이, 용량) ✘ (이동) struct 사용자 정의 ✘ (이동) [T; N] 고정 길이 배열 ✘ (이동) &T , &mut T 참조 &T ✔, &mut T ✘(재차용) &[T] , &mut [T] 슬라이스(포인터, 길이) 참조 &[T] ✔ *const T , *mut T raw 포인터 ✔ Result<T, E> 성공 또는 오류 내용이 하나라도 이동 타입이면 ✘ Option<T> 값 또는 없음 위와 같음 isize , usize , f32 , 튜플, 열거형, 제네릭, 함수 포인터 타입은 없다. 크기를 다루는 값은 u64 를 쓴다( .len 이 u64 다). 3.1 정수형 ¶ 정수 연산은 같은 타입끼리만 된다. i32 + i64 는 오류이므로 as 로 맞춘다. 리터럴은 기대 타입을 따른다. 기대 타입이 없으면 i32 이고, 한쪽 피연산자의 타입이 정해져 있으면 그쪽을 따른다. 오버플로는 trap 한다( 10장 ). TAM 복사 // exit: 0\nfn main() i32 {\n    let a: u8 = 200\n    let b = 100          // 리터럴 b는 아래 덧셈에서 u8로 정해진다\n    let c = a - b as u8 + 100\n    if c != 200 { return 1 }\n    let wide = a as i64 * 1_000_000_000\n    if wide != 200_000_000_000 { return 2 }\n    0\n} TAM,ERROR 복사 // error: mismatched types\nfn main() i32 {\n    let a: i32 = 1\n    let b: i64 = 2\n    let c = a + b\n    0\n} 3.2 str 과 String ¶ str 은 (포인터, 길이)이며 Copy다. 읽을 수 있는 것은 s.len ( u64 )과 s.ptr ( *const u8 )뿐이다. 인덱싱은 없다 ( s[i] 는 오류). 바이트를 읽으려면 unsafe { *(s.ptr + i) } 를 쓴다. str == str , str != str 은 바이트 비교다. String 은 힙을 소유하는 이동 타입이다. 스코프가 끝나면 자동으로 해제된다( 8장 ). .len , .ptr 을 읽을 수 있다. string_from(str) String , string_push(&mut String, u8) , as_str(&String) str 이 내장이다. 이어 붙이기와 정수 출력은 표준 라이브러리 tam.fmt 에 있다( Standard Library ). as_str(&s) 가 돌려준 str 은 s 를 빌린다 : s 를 이동하거나 수정하면 오류다. TAM 복사 // exit: 0\nfn main() i32 {\n    let a = \"hello\"\n    mut s = string_from(\"hel\")\n    string_push(&mut s, 108)\n    string_push(&mut s, 111)\n    let b = as_str(&s)\n    if a != b { return 1 }\n    if a == \"world\" { return 2 }\n    if s.len != 5 { return 3 }\n    0\n} TAM,ERROR 복사 // error: cannot borrow `s` as mutable because it is also borrowed as immutable\nfn main() i32 {\n    mut s = string_from(\"a\")\n    let t = as_str(&s)\n    string_push(&mut s, 1)\n    t.len as i32\n} 3.3 배열 ¶ [T; N] 에서 N 은 1 이상의 정수 리터럴 또는 정수 상수의 이름 이다( 2.6절 ). [T; N * 2] 같은 식과 길이 0은 불가다. 리터럴: [a, b, c] , 반복 [v; N] ( v 는 한 번만 평가해 복사). 타입 표기: let a: [u8; 4] = [0; 4] . 원소 타입은 정수, f64 , bool , raw 포인터, 그것들의 배열, 그것들만 필드로 가진 구조체 다. String 이나 참조처럼 힙·빌림을 쥔 타입은 원소가 될 수 없다( cannot be an array element type ). 배열은 구조체처럼 이동 타입 이다. 값 전달과 대입은 이동이다. a[i] 로 읽고 쓴다. 중첩( a[i][j] ), 구조체 원소의 필드( a[i].x )도 된다. 인덱스는 어떤 정수형이든 된다. 경계를 실행 시간에 검사한다 . 벗어나면 trap(패닉 index out of bounds )한다. 부호 있는 음수 인덱스도 trap이다. 배열 길이와 인덱스가 둘 다 컴파일 시간에 알려진 경우 (상수 인덱스)는 컴파일 오류다. .len ( u64 )과 .ptr ( *const T , 가변 배열이면 *mut T )를 읽을 수 있다. 구조체 원소를 통째로 꺼내 옮길 수는 없다. 필드로 접근하거나 빌린다. TAM 복사 // exit: 14\nfn main() i32 {\n    mut grid = [[0; 3]; 3]\n    for i in 0..3 {\n        for j in 0..3 {\n            grid[i][j] = (i * 3 + j) as i32\n        }\n    }\n    let diag = grid[0][0] + grid[1][1] + grid[2][2] // 0 + 4 + 8 = 12\n    diag + 2\n} TAM,ERROR 복사 // error: index out of bounds\nfn main() i32 {\n    let a = [1, 2, 3]\n    a[5]\n} TAM,TRAP 복사 // panic: index out of bounds\nfn main() i32 {\n    let a = [1, 2, 3]\n    let i = a.len + 2\n    a[i]\n} 3.4 슬라이스 ¶ &[T] 와 &mut [T] 는 (포인터, 길이)인 참조 다. 만들기: &a[..] , &a[lo..hi] , &a[lo..] , &a[..hi] , &mut a[..] . 원본은 배열, &[T; N] , 슬라이스다. 슬라이스 식은 반드시 & / &mut 로 빌려서 쓴다. 범위가 길이를 넘거나 lo > hi 이면 trap한다. s.len ( u64 ), s[i] (경계 검사)를 쓴다. for x in s 로 순회할 수 있다(원소는 값으로 복사 된다). 함수 인자 자리에서는 &배열 ( &[T; N] )이 &[T] 로 자동 변환된다( sum(&a) ). 다른 자리( let s: &[T] = &a )에서는 &a[..] 로 명시한다. 빌림 검사는 일반 참조와 같다. 원본 배열을 바꾸면 오류이고, &mut 슬라이스 둘은 동시에 만들 수 없고, 지역 배열의 슬라이스는 반환할 수 없다. 검사기는 원소를 구분하지 않는다 : &mut a[0] 과 &mut a[1] 은 동시에 만들 수 없다. TAM 복사 // exit: 15\nfn sum(a: &[i32]) i32 {\n    mut s = 0\n    for x in a { s += x }\n    s\n}\n\nfn fill(a: &mut [i32], v: i32) {\n    for i in 0..a.len { a[i] = v }\n}\n\nfn main() i32 {\n    mut a = [1, 2, 3, 4, 5]\n    let total = sum(&a)              // 15, &배열 → &[i32] 자동 변환\n    fill(&mut a[1..3], 9)\n    if a[1] != 9 || a[2] != 9 { return 1 }\n    total\n} 3.5 참조 ¶ &T 는 읽기 전용 참조, &mut T 는 배타적 쓰기 참조다. 규칙은 9장 에 있다. &x , &mut x 로 만든다. &mut x 는 x 가 mut 일 때만 된다. *r 로 읽고 *r = v 로 쓴다. 구조체 참조의 필드는 r.x 로 접근한다(자동 역참조). &mut T 는 &T 자리에 넘길 수 있다(암묵 변환). 반대는 오류다. 함수가 반환하는 참조의 수명은 어노테이션 없이 본문에서 추론한다. 지역 변수의 참조를 돌려주면 컴파일 오류다. 3.6 Result 와 Option ¶ Result<T, E> : Ok(값) 또는 Err(오류) . Option<T> : Some(값) 또는 None . 생성자는 기대 타입이 있는 자리 (반환 값, 인자, 주석 달린 let )에서 쓴다. Some(x) 는 인자에서 타입을 추론하므로 let o = Some(5) 는 된다. Ok(...) , Err(...) , None 은 기대 타입이 필요하다. Result / Option 은 이동 타입이거나(내용에 String ·구조체·배열이 있을 때) Copy다. 소비: match ( 6장 )와 ? ( 4.9절 ), 그리고 메서드: 메서드 Option<T> Result<T, E> is_some() is_none() ✔ is_ok() is_err() ✔ unwrap() None 이면 패닉 Err 이면 패닉 unwrap_or(기본값) ✔ ✔ 힙을 가진 내용(예: Option<String> )에서 is_* 는 값을 소비하므로 거절된다( owns heap data ): match 를 쓴다. unwrap 은 값을 꺼내 이동한다. TAM 복사 // exit: 0\nfn find(a: &[i32], x: i32) Option<i32> {\n    for i in 0..a.len {\n        if a[i] == x { return Some(i as i32) }\n    }\n    None\n}\n\nfn parse(n: i32) Result<i32, i32> {\n    if n > 0 { Ok(n) } else { Err(0 - n) }\n}\n\nfn main() i32 {\n    let a = [5, 6, 7]\n    if find(&a, 7).unwrap() != 2 { return 1 }\n    if find(&a, 9).is_some() { return 2 }\n    if find(&a, 9).unwrap_or(-1) != -1 { return 3 }\n    if parse(-4).unwrap_or(7) != 7 { return 4 }\n    if !parse(3).is_ok() { return 5 }\n    0\n} 3.7 타입의 크기와 배치 ¶ 타입의 메모리 배치는 정해지지 않았다(LLVM의 자연 정렬을 따르지만 약속하지 않는다). extern 함수의 인자로 구조체를 넘길 수 없는 이유다. 4. 표현식 ¶ 4.1 우선순위와 결합 방향 ¶ 높은 것부터: | 순위 | 연산자 | 결합 |\n|---|---|---|\n| 1 | 후위: .필드 .메서드() [인덱스] ? 호출 () | 왼쪽 |\n| 2 | 단항: - ! ~ * (역참조) & &mut | 오른쪽 |\n| 3 | as | 왼쪽 |\n| 4 | * / % | 왼쪽 |\n| 5 | + - | 왼쪽 |\n| 6 | << >> | 왼쪽 |\n| 7 | & | 왼쪽 |\n| 8 | ^ | 왼쪽 |\n| 9 | | | 왼쪽 |\n| 10 | < <= > >= | 왼쪽 |\n| 11 | == != | 왼쪽 |\n| 12 | && | 왼쪽 |\n| 13 | || | 왼쪽 | Rust와 같다. 비트 연산자( & ^ | )는 비교보다 높다 : x & 1 == 1 은 (x & 1) == 1 이다(C와 다르다). -x as i64 는 (-x) as i64 다. TAM 복사 // exit: 0\nfn main() i32 {\n    let a = 1 + 2 * 3 - 4 / 2 % 3  // 1 + 6 - (2 % 3) = 5\n    let b = 1 << 2 + 1             // 시프트가 덧셈보다 낮다: 1 << 3\n    let c = 6 & 3 == 2             // (6 & 3) == 2\n    let d = 5 > 3 == true          // (5 > 3) == true\n    let e = -5 as i64 + 1          // ((-5) as i64) + 1\n    if a != 5 { return 1 }\n    if b != 8 { return 2 }\n    if !c { return 3 }\n    if !d { return 4 }\n    if e != -4 { return 5 }\n    0\n} 4.2 평가 순서 ¶ 피연산자와 인자는 왼쪽에서 오른쪽 으로 평가한다. && 와 || 는 단락 평가한다. TAM 복사 use tam.os\n\nfn say(n: i32) bool { os::print_int(n as i64); true }\n\nfn main() i32 {\n    let a = false && say(1) // say(1)은 호출되지 않는다\n    let b = true || say(2)  // say(2)도\n    let c = say(3) && say(4)\n    os::println(\"\")\n    if a || !b || !c { 1 } else { 0 }\n}\n// out: 34 4.3 산술과 비교 ¶ + - * / % 는 정수와 f64 에 쓴다. 두 피연산자의 타입이 같아야 한다. % 는 f64 에도 쓸 수 있다( 7.5 % 2.0 == 1.5 ). 정수 나눗셈은 0 방향으로 자르고, % 의 부호는 피연산자(왼쪽)를 따른다( -5 % 3 == -2 ). 단항 - 는 부호 있는 정수와 f64 에만 쓴다( -x 가 u32 에는 오류). == != < <= > >= 는 같은 타입의 정수, f64 , bool ( == / != ), str ( == / != ), 포인터에 쓴다. 결과는 bool 이다. 구조체와 배열의 비교는 없다. f64 비교는 IEEE 754를 따른다( NaN != NaN ). if / while 의 조건은 bool 이어야 한다 ( if 1 { } 는 오류). && || ! 는 bool 에만 쓴다. 4.4 비트 연산자 ¶ & | ^ << >> 와 단항 ~ 는 정수형에만 쓴다. & | ^ 는 양쪽 타입이 같아야 하고 시프트 양은 어떤 정수형이든 된다. >> 는 부호 있는 타입에서 산술, 부호 없는 타입에서 논리 시프트다. 시프트 양은 왼쪽 피연산자의 비트 폭 - 1로 마스크 된다(폭 이상 밀어도 정의된 동작): i32 에서 1 << 33 은 1 << 1 이다. TAM 복사 // exit: 0\nfn main() i32 {\n    let m: i64 = -1\n    if (m as u64 >> 60) != 15 { return 1 }   // 논리 시프트\n    let n: i32 = -8\n    if (n >> 1) != -4 { return 2 }           // 산술 시프트\n    let s: u32 = 33\n    if (1 << s) != 2 { return 3 }            // 33 & 31 == 1\n    if ~0 != -1 { return 4 }\n    0\n} 4.5 변환 as ¶ 원본 → 대상 동작 정수 → 정수 확장(부호 있으면 부호 확장) 또는 하위 비트로 잘라냄 (감싼다, trap하지 않음) 정수 → f64 가장 가까운 값 f64 → 정수 0 방향 절삭 후 포화 (범위 밖은 최솟값/최댓값, NaN 은 0) bool → 정수 false = 0, true = 1 정수 → bool 불가 (오류). x != 0 을 쓴다 포인터 ↔ 포인터, 포인터 ↔ i64 / u64 가능(safe) &T → *const T , &mut T → *mut T 가능(safe) TAM 복사 // exit: 0\nfn main() i32 {\n    let a: u8 = 250\n    if (a as i8) != -6 { return 1 }          // 잘라내고 부호 재해석\n    if (300 as u8) != 44 { return 2 }\n    if (1e20 as i32) != 2147483647 { return 3 } // 포화\n    if (0.0 / 0.0) as i32 != 0 { return 4 }     // NaN → 0\n    if (-5.7 as i32) != -5 { return 5 }\n    if (-5.7 as u8) != 0 { return 6 }\n    if (true as i32) != 1 { return 7 }\n    0\n} TAM,ERROR 복사 // error: cannot cast `i32` to `bool`\nfn main() i32 {\n    let b = 5 as bool\n    0\n} 4.6 구조체 리터럴, 필드, 인덱스 ¶ Name { f: v, ... } . 모듈 밖 구조체는 모듈::Name { ... } . if / while / for / match 의 조건 식 자리에서는 Name { 를 구조체 리터럴로 읽지 않는다(블록의 시작과 구분하기 위해). 괄호 ( ) 안에서는 다시 구조체 리터럴을 쓸 수 있다. 값.필드 , 참조와 포인터가 아닌 값의 체인 a.b.c , 인덱스 a[i] , a[i].x , a[i][j] . 힙을 쥔 필드를 구조체에서 꺼내 이동하는 것은 오류다 : let t = p.s ( p.s 가 String )는 cannot move ... out of a field . 값 전체를 옮기거나 &p.s 로 빌린다. 힙을 쥔 임시값의 필드 접근( make().s )도 막는다. 4.7 if 표현식 ¶ if 조건 { 값 } else { 값 } 은 값을 가진다. 두 가지의 타입이 같아야 한다. else 가 없는 if 는 값이 없는 문장이다. else if 로 이을 수 있다. TAM 복사 // exit: 20\nfn main() i32 {\n    let x = 5\n    let a = if x > 3 { 10 } else { 20 }\n    let b = if a == 10 { 1 } else if a == 20 { 2 } else { 3 }\n    mut r = 0\n    if b == 1 { r = 20 }   // else 없는 if는 문장\n    r\n} 블록 { ... } 자체를 값으로 쓰는 표현식( let x = { ... } )은 문법에 없다. 값이 필요하면 if true { ... } 가 아니라 함수로 뽑는다. 4.8 호출 ¶ 이름(인자, ...) , 모듈 함수는 모듈::이름(...) , 연관 함수는 T::이름(...) , 메서드는 값.이름(...) . 인자의 수와 타입은 정확히 맞아야 한다. 함수 값(함수 포인터)과 클로저는 없다. 4.9 오류 전파 ? ¶ 식? 는 다음과 같이 동작한다. 식이 Result<T, E> : Ok(v) 면 v 가 식의 값이 되고, Err(e) 면 현재 함수가 즉시 Err(e) 를 반환 한다(살아 있는 지역 변수를 모두 해제하고 나간다). 식이 Option<T> : Some(v) 면 v , None 이면 즉시 None 을 반환한다. 현재 함수의 반환 타입이 같은 종류( Result<_, E> 에서 오류 타입 E 가 정확히 같아야 한다, 또는 Option<_> )여야 한다. Option 과 Result 는 ? 로 섞을 수 없다. 오류 타입 변환( From )은 없다. TAM 복사 // exit: 30\nfn div(a: i32, b: i32) Result<i32, i32> {\n    if b == 0 { return Err(1) }\n    Ok(a / b)\n}\n\nfn calc(a: i32, b: i32, c: i32) Result<i32, i32> {\n    let x = div(a, b)?\n    let y = div(x, c)?\n    Ok(x + y)\n}\n\nfn main() i32 {\n    let ok = match calc(100, 5, 4) { Ok(v) => v, Err(e) => 0 - e }  // 20 + 5 = 25\n    let bad = match calc(1, 0, 4) { Ok(v) => v, Err(e) => 0 - e }   // -1\n    ok - bad + 4\n} TAM,ERROR 복사 // error: `?` can only be used\nfn f() Result<i32, i32> { Ok(1) }\nfn main() i32 {\n    let x = f()?\n    x\n} 4.10 unsafe 표현식 ¶ unsafe { 문장들; 값 } 은 값을 가지는 표현식이다. 11장 참고. 5. 문장 ¶ 5.1 변수 선언 ¶ CODE 복사 let 이름 [ \":\" 타입 ] \"=\" 식        // 불변\nmut 이름 [ \":\" 타입 ] \"=\" 식        // 가변 let mut 이 아니라 mut 다( let mut x 는 오류). 초기값은 필수다(초기화되지 않은 선언은 없다). 지역 변수의 타입은 추론한다. 타입 주석은 리터럴의 정수형을 정하거나 Ok / Err / None 의 기대 타입을 줄 때 쓴다. 섀도잉 이 가능하다: 같은 이름으로 다시 선언하면 이전 변수는 가려진다(이전 값은 스코프가 끝날 때 해제된다). 값이 없는 식(반환 타입이 없는 함수 호출)을 묶을 수 없다: cannot bind ... to a value-less expression . 5.2 대입 ¶ 대상 = 식 . 대상은 가변 변수, 가변 변수의 필드, 배열 원소, *참조 등 장소 식 이다. 불변 변수에 대입하면 cannot assign to immutable variable 이다. 재대입은 이전 값을 먼저 해제 한다( x = v , p.s = v , *r = v 가 String 일 때). 복합 대입 += -= *= /= %= &= |= ^= <<= >>= . a op= b 는 a = a op b 로 풀어 쓴다. 따라서 대상 식에 부작용이 있으면 오류 다( a[f()] += 1 ). 5.3 while ¶ CODE 복사 while 조건 { 본문 } break 는 가장 안쪽 루프를 끝내고 continue 는 다음 반복으로 간다. 레이블과 break 값 은 없다. loop ¶ CODE 복사 loop { 본문 } while true { 본문 } 과 같다. 끝나려면 break 나 return 이 필요하다. 본문에 (이 루프를 끝내는) break 가 없는 loop 는 끝나지 않으므로 , 함수의 마지막 문장이 그런 loop 이면 값을 돌려주는 함수에도 최종 식이 필요 없다. 안쪽 while / loop 의 break 는 바깥 루프를 끝내지 못하므로 세지 않는다. TAM 복사 // exit: 13\nfn find() i32 {\n    mut i = 0\n    loop {\n        i += 1\n        if i == 5 { return i }      // break가 없다: 이 loop 뒤에는 아무것도 필요 없다\n    }\n}\n\nfn main() i32 {\n    mut n = 0\n    loop {\n        n += 2\n        if n > 7 { break }\n    }\n    n + find()                       // 8 + 5\n} break / continue 를 루프 밖에서 쓰면 오류다. break / continue 로 나갈 때 그 루프 본문 스코프의 힙 값은 해제된다 . 5.4 for ¶ CODE 복사 for 이름 in 시작..끝 { }       // 끝은 제외\nfor 이름 in 시작..=끝 { }      // 끝을 포함\nfor 이름 in 슬라이스 { }       // 또는 &배열 — 원소를 값으로 복사 while 로 풀어 쓴다. continue 도 증가 문장을 거친다. a..=최댓값 도 넘치지 않는다. 루프 변수는 불변 이다. 범위의 정수 리터럴 끝점만 있으면 i 는 i32 다. 다른 정수형이 필요하면 끝점을 해당 타입의 변수로 두거나 as 를 쓴다. 슬라이스를 순회하면 x 는 원소의 복사본 이다(참조가 아니다). 원소를 바꾸려면 인덱스로 순회한다. 이터레이터는 없다. 범위와 슬라이스/배열 참조만 된다. TAM 복사 // exit: 16\nfn main() i32 {\n    mut s = 0\n    mut i = 0\n    while i < 10 {\n        i += 1\n        if i % 2 == 0 { continue }\n        if i > 7 { break }\n        s += i                // 1 + 3 + 5 + 7\n    }\n    for k in 0..=3 { s += k } // + 6\n    let pair = [1, 2]\n    for x in &pair[..] { s += x }\n    s - 9\n} 5.5 return ¶ return 식 또는 값이 없는 함수의 return . 함수를 즉시 끝내며 살아 있는 모든 지역 변수의 힙 값을 해제한다. 5.6 식 문장 ¶ 값을 버리는 식. 버려지는 임시 값이 힙을 가지면(예: string_from(\"x\") ) 즉시 해제된다. 6. match 와 패턴 ¶ CODE 복사 match 식 {\n    패턴 => 식 | 블록\n    ...\n} 대상은 Result 또는 Option 값뿐이다. 패턴은 Ok(이름) , Err(이름) , Some(이름) , None 이다. 한 match 에서 Ok/Err 와 Some/None 을 섞을 수 없다. 두 팔을 정확히 한 번씩 , 순서 무관하게 쓴다. 빠지면 `match` is missing the `None` arm 오류다. 팔은 쉼표나 줄바꿈으로 구분한다. 팔의 본문은 표현식이거나 { } 블록이고, if 처럼 값을 가진다 : 모든 팔의 타입이 같아야 한다(값이 없는 문장 팔은 모두 값이 없어야 한다). 바인딩 이름은 payload를 이동하거나 복사 한다. payload가 힙을 가진 Option<String> 을 match 하면 Some(s) 가 소유권을 가져간다. 바인딩 이름 자리에 _ 를 쓰면 payload를 쓰지 않겠다는 뜻이다: Ok(_) , Err(_) , Some(_) . payload가 힙을 가져도 팔이 끝날 때 해제된다. 정수, 문자열 등에 대한 match 와 팔 전체를 대신하는 _ => 패턴은 없다. 그 경우 if / else if 를 쓴다. TAM 복사 // exit: 0\nfn describe(o: Option<i32>) i32 {\n    match o {\n        Some(v) => {\n            v + 1\n        }\n        None => 0\n    }\n}\n\nfn main() i32 {\n    if describe(Some(4)) != 5 { return 1 }\n    if describe(None) != 0 { return 2 }\n    let r: Result<i32, i32> = Err(3)\n    match r { Ok(v) => v, Err(e) => e } - 3\n} 7. 이름 해석과 모듈 ¶ 7.1 파일 = 모듈 ¶ use a.b 는 파일 <루트 폴더>/a/b.tam 을 불러온다. 이후 b::항목 으로 참조한다(모듈 경로는 한 단계 : alias::item ). 루트 폴더는 컴파일을 시작한 파일( tamc build main.tam )의 폴더, 프로젝트 모드에서는 패키지의 src/ 폴더다. 불러온 모듈에서도 use 를 쓸 수 있다(경로는 항상 루트 폴더 기준). 순환 use 는 허용된다. 같은 이름의 모듈 별칭을 두 번 가져오면( use a.math 다음에 use b.math ) module name math is imported more than once 오류다. 별칭 바꾸기( as )는 없다. 모듈을 못 찾으면 어떤 파일을 기대했는지 알려 주는 오류가 난다. TAM,IGNORE 복사 // main.tam                  // util/math.tam\nuse util.math                // pub struct Pt { x: i32, y: i32 }\nfn main() i32 {              // pub fn add(a: i32, b: i32) i32 { a + b }\n    let p = math::Pt { x: 1, y: 2 }\n    math::add(p.x, p.y)\n} 7.2 가시성 ¶ 모듈 밖에서 쓰려면 pub fn / pub struct / pub extern 이어야 한다. 비공개 항목에 접근하면 두 파일을 함께 보여 주는 오류 가 난다. 구조체 필드는 항상 공개다. 재공개( pub use )는 없다. const 도 pub const 만 다른 모듈에서 모듈::이름 으로 쓸 수 있다. 제네릭 함수·구조체도 같은 규칙이다( pub fn max<T> , pub struct Stack<T> ). 다른 모듈의 제네릭 구조체는 모듈::Stack<i32> , 연관 함수는 모듈::Stack<i32>::new() 로 쓴다. 7.3 맹글링과 이름 충돌 ¶ 루트 항목은 이름 그대로, 다른 모듈의 항목은 util.math::add 같은 이름으로 내려간다(LLVM에서는 따옴표 이름). 모듈 안의 항목은 다른 모듈의 같은 이름과 충돌하지 않는다. 오류 메시지의 타입 이름에는 geo::Point 처럼 모듈이 붙어서 나온다. 7.4 표준 라이브러리 ¶ use tam.os , use tam.fmt , use tam.serial 처럼 첫 조각이 tam 이면 프로젝트 파일 대신 컴파일러에 내장된 TAM 소스를 쓴다. tam.os 는 대상에 따라 구현이 다르고 공개 API는 같다. 자세한 내용은 The Standard Library API Documentation . 7.5 패키지와 의존성 ¶ 프로젝트 모드( Tmake.toml )에서는 의존성 패키지의 이름이 모듈 이름 이 된다. 의존하는 패키지 fmt-lib 는 use fmt_lib 로 불러온다( - 는 _ 로 바뀐다). 의존성 이름은 같은 이름의 지역 모듈보다 우선한다. 자세한 규칙은 Tmake.toml Documentation . 8. 소유권, 이동, 자동 해제 ¶ TAM은 가비지 컬렉터도 런타임도 없이 메모리를 안전하게 다루기 위해, 컴파일 시간에 소유권 을 검사한다. 모든 값에는 소유자가 하나 있고, 소유자가 스코프를 벗어나면 값이 해제된다. 8.1 Copy 타입과 이동 타입 ¶ Copy : 정수, f64 , bool , str , &T , &[T] , raw 포인터. 대입과 인자 전달은 복사다. 이동 타입 : String , 구조체, 배열, &mut T , 이동 타입을 담은 Result / Option . 대입, 인자 전달, 반환, 구조체 필드 초기화는 이동 이며 이동된 변수는 이후 쓸 수 없다( use of moved value ). 구조체는 필드가 모두 Copy여도 이동 타입 이다. 배열도 마찬가지다. TAM,ERROR 복사 // error: use of moved value `a`\nstruct P { x: i32 }\nfn main() i32 {\n    let a = P { x: 1 }\n    let b = a\n    a.x + b.x\n} 8.2 이동 분석 ¶ 분기마다 이동 상태를 합친다. 한쪽 분기에서만 이동했다면 이후에는 \"이동했을 수도 있음\"이므로 쓸 수 없다. 루프 안에서 바깥 변수를 이동하면, 다음 반복에서 다시 쓰이므로 오류다( use of moved value — \"value moved here, in previous iteration of loop\"). 이동 직후에 break 하면 괜찮다. break / continue 는 그 시점의 이동 상태를 루프 뒤( break )나 다음 반복( continue )으로 합친다. 이동은 항상 값 전체 단위다. 구조체에서 힙을 쥔 필드 하나만 꺼내 이동할 수는 없다( 4.6절 ). 8.3 자동 해제(drop) ¶ String 을 가진 타입(구조체 필드, 배열 원소가 아닌 Result / Option payload 포함)은 스코프가 끝날 때 선언의 역순으로 해제된다. 이동되었는지는 변수마다 둔 런타임 플래그로 판단하므로 조건부 이동도 정확히 해제/생략된다. return , ? , break , continue 는 빠져나가는 스코프의 살아 있는 값을 모두 해제하고 나간다. 재대입은 이전 값을 먼저 해제한다. 버려지는 임시 값( string_from(\"x\") 문장)도 즉시 해제된다. 호스트에서 valgrind로 누수·이중 해제·잘못된 접근이 없음을 테스트로 확인한다. 해제되지 않는 경우 : os::exit 는 즉시 종료하므로 살아 있는 지역 변수의 해제를 실행하지 않는다. trap/패닉도 해제를 실행하지 않는다. 할당 실패( malloc 이 NULL)는 검사하지 않는다. 사용자 정의 소멸자( Drop )와 Box<T> 는 없다. 직접 만든 힙 구조는 unsafe 의 alloc / free 로 관리한다. TAM 복사 // exit: 3\nstruct User {\n    name: String,\n    age: i32,\n}\n\nfn age_plus_len(u: User) i32 { u.age + u.name.len as i32 } // u는 여기서 해제된다\n\nfn main() i32 {\n    let u = User { name: string_from(\"ab\"), age: 1 }\n    age_plus_len(u)\n    // u는 이동되었으므로 여기서 다시 해제되지 않는다(valgrind 클린)\n} 9. 빌림 규칙 ¶ 참조( &T , &mut T , &[T] , &mut [T] , as_str 의 결과 str )는 소유자를 빌린다 . 컴파일러는 다음을 검사한다. 9.1 규칙 ¶ 같은 값에 대해 읽기 참조는 여러 개 , 또는 쓰기 참조는 하나 만 동시에 살아 있을 수 있다(둘을 섞을 수 없다). 참조가 살아 있는 동안 소유자를 이동 하거나 대입 할 수 없다. 참조는 소유자보다 오래 살 수 없다(지역 변수의 참조 반환, 스코프 밖 사용은 오류). &mut 는 mut 변수에서만 만든다. 9.2 \"살아 있는 구간\" ¶ 참조가 살아 있는 구간은 마지막 사용까지 다(NLL 방식). 참조를 이후에 쓰지 않으면 충돌 후 문장도 허용된다. 구조체의 서로 다른 필드 는 따로 빌릴 수 있다( &mut p.x 와 &mut p.y ). 한 구조체 전체와 그 필드는 충돌한다. 배열 원소는 구분하지 않는다 : &mut a[0] 과 &a[1] 은 충돌한다(보수적). &mut 참조를 값으로 쓰면 암묵적 재차용 이며, 재차용이 끝날 때까지 원본은 쓸 수 없다. 함수가 반환하는 참조의 출처는 lifetime 표기 없이 본문에서 추론한다. 여러 인자에서 올 수 있으면 보수적으로 모두를 빌린 것으로 본다. 참조 변수에 다시 대입해도 이전 빌림이 풀리지 않는다(보수적). 드물게 올바른 코드가 거부될 수 있다. break / continue 이후의 경로는 보수적으로 \"모든 이후 경로가 도달 가능\"으로 본다. 안전하지만 드물게 유효한 코드를 거절할 수 있다. raw 포인터는 빌림 검사의 대상이 아니다. 책임은 unsafe 를 쓰는 쪽에 있다. TAM,ERROR 복사 // error: cannot assign to `v` because it is borrowed\nfn main() i32 {\n    mut v = 1\n    let r = &v\n    v = 2\n    *r\n} TAM,ERROR 복사 // error: cannot borrow `s` as mutable more than once at a time\nfn main() i32 {\n    mut s = string_from(\"a\")\n    let r = &mut s\n    let q = &mut s\n    string_push(r, 1)\n    0\n} TAM,ERROR 복사 // error: cannot return reference to local variable `x`\nfn f() &i32 {\n    let x = 5\n    &x\n}\nfn main() i32 { *f() } TAM 복사 // exit: 5\nstruct P { x: i32, y: i32 }\n\nfn main() i32 {\n    mut p = P { x: 1, y: 2 }\n    let a = &mut p.x      // 서로 다른 필드는 동시에 빌릴 수 있다\n    let b = &mut p.y\n    *a += 1\n    *b += 1\n    p.x + p.y\n} 10. 수치 의미: 오버플로, 변환, 시프트 ¶ 정수 + - * 와 단항 - 는 오버플로하면 trap 한다(패닉 integer overflow ). / , % 는 0으로 나누거나 MIN / -1 이면 trap한다(패닉 integer overflow in division / division by zero ). 상수끼리의 식( 2147483647 + 1 )도 실행 시간 trap이다. 감싸는 연산은 명시한다 : wrapping_add(a, b) , wrapping_sub(a, b) , wrapping_mul(a, b) (정수형, 두 인자의 타입이 같아야 한다). f64 와 포인터 산술, 비트 연산, 시프트는 trap하지 않는다. as 변환은 감싸거나 포화한다. trap하지 않는다( 4.5절 ). TAM 복사 // exit: 0\nfn main() i32 {\n    let a: i32 = 2147483647\n    if wrapping_add(a, 1) != -2147483647 - 1 { return 1 }\n    let b: u8 = 200\n    if wrapping_mul(b, 2) != 144 { return 2 }\n    0\n} TAM,TRAP 복사 // panic: integer overflow\nfn main() i32 {\n    let a: i32 = 2147483647\n    a + 1\n} TAM,TRAP 복사 // panic: division by zero\nfn main() i32 {\n    let z = 0\n    10 / z\n} 11. unsafe 와 raw 포인터 ¶ 11.1 raw 포인터 ¶ *const T 와 *mut T 는 빌림 검사를 받지 않는 포인터다. 만들기와 변환은 safe다: &mut x as *mut i32 , 포인터 ↔ 포인터, 포인터 ↔ i64 / u64 . 11.2 unsafe 가 필요한 것 ¶ 포인터 역참조 *p 포인터 산술 ( p + n , p - n , 단위는 원소) unsafe fn 과 extern 함수의 호출 alloc , free , 하드웨어 접근 내장 함수( mmio_* 등)의 호출 unsafe { ... } 블록은 값을 가지는 표현식 이다(마지막 식이 값). unsafe fn 의 본문 전체는 unsafe 맥락이다. 11.3 책임 ¶ unsafe 안에서 컴파일러는 포인터의 유효성(정렬, 범위, 수명, 별칭)을 검사하지 않는다. 위반하면 정의되지 않은 동작이다. 대신 unsafe 바깥은 컴파일러가 안전을 책임진다. 이것이 TAM의 철학이다: 사용자에게 통제권을 모두 주되, 안정성은 컴파일러가 책임진다. unsafe 의 표면은 작게 유지하고, 안전한 API로 감싸 쓰라. TAM 복사 // exit: 9\nfn main() i32 {\n    let m = unsafe { alloc(16) }          // 16바이트 힙 블록\n    let q = m as *mut i32\n    let r = unsafe {\n        *q = 4\n        *(q + 1) = 5                      // 포인터 산술: 원소(i32) 단위\n        let sum = *q + *(q + 1)\n        free(m)\n        sum\n    }\n    r\n} TAM,ERROR 복사 // error: needs an `unsafe` block\nfn main() i32 {\n    let m = alloc(16)\n    0\n} 12. 프로그램 실행: 진입점, 종료, 패닉, trap ¶ 12.1 진입점 ¶ 프로그램에는 정확히 fn main() i32 가 하나 있어야 한다. 없으면 no main function found , 시그니처가 다르면 `main` must have the signature `fn main() i32` . (프로젝트 모드의 kind = \"lib\" 패키지는 main 이 필요 없고 검사만 된다.) main 이 돌려주는 값이 종료 코드 다. Linux에서는 하위 8비트가 프로세스 종료 상태가 되고, Windows에서는 32비트 전체가 ExitProcess 로 전달된다. UEFI에서는 EFI_STATUS 로 돌려준다. 12.2 패닉과 trap ¶ 컴파일러가 넣은 검사(오버플로, 0 나눗셈, 경계 위반)와 panic , assert , unwrap 실패는 trap 으로 프로그램을 끝낸다. 호스트 : stderr에 tam: panic: <메시지> 를 쓰고 SIGILL (신호 4)로 종료한다. libc 없이 write 시스콜을 직접 쓴다. 메시지는 integer overflow , integer overflow in division , division by zero , index out of bounds , assertion failed , called `unwrap()` on a `None` value 등이다. tamc run 은 128 + 신호 번호 로 종료 코드를 알린다. 그 밖의 대상 : 메시지 없이 ud2 / brk 로 내려간다. 펌웨어 대상에서는 예외 핸들러를 설치하지 않으므로 예외가 나면 리셋하거나 멈춘다. trap과 패닉은 자동 해제를 실행하지 않는다 . TAM,TRAP 복사 // panic: tam: panic: boom\nfn main() i32 {\n    panic(\"boom\")\n} TAM,TRAP 복사 // panic: assertion failed\nfn main() i32 {\n    assert(1 + 1 == 3)\n    0\n} TAM,TRAP 복사 // panic: called `unwrap()` on a `None` value\nfn none() Option<i32> { None }\nfn main() i32 { none().unwrap() } 12.3 스택 ¶ 스레드도 비동기도 없다. 스택 크기는 운영체제 기본값(Linux 8MiB 등)이며, 무한 재귀로 넘치면 운영체제가 프로세스를 끝낸다(검사는 없다). 4KiB를 넘는 스택 프레임을 가진 함수는 Windows/펌웨어에서 __chkstk 가 스택을 점검하며 넘기지 않게 한다. 13. 컴파일 대상 ¶ --target (또는 Tmake.toml 의 [build] target )으로 고른다. 대상 산출물 비고 host 네이티브 실행 파일 Windows 외 기본값. 시스템 clang 으로 링크한다 windows x64 .exe Windows 기본값. CRT, MSVC, Windows SDK 없이 kernel32 만 쓴다. llc (없으면 clang )와 lld-link 가 필요 uefi x86-64 .efi EFI/BOOT/BOOTX64.EFI 로 부팅 bios x86-64 부팅 디스크 .img 부트 섹터 + 프로그램. 페이로드 최대 384KiB aarch64 AArch64 Image .bin QEMU virt -kernel 용. EL1, MMU 꺼짐 대상에 맞지 않는 내장 함수( mmio_* , port_* , halt , semihost , ccall* , efi_* )를 쓰면 위치와 함께 컴파일 오류다. tam.os 의 공개 API는 모든 대상에서 같지만, 펌웨어 대상은 print , println , print_int , exit 만 제공한다. 호스트와 Windows에서 같은 프로그램이 같은 출력을 낸다(에뮬레이터로 검증했다. 실제 Windows 실행은 CI가 확인한다). 14. 내장 함수 ¶ 내장 함수는 예약된 이름이며 어떤 use 도 없이 쓴다. 이름 시그니처 설명 string_from (str) -> String 힙에 복사해 새 String 을 만든다 string_push (&mut String, u8) 한 바이트를 덧붙인다. 용량이 모자라면 2배로 늘린다 as_str (&String) -> str String 을 빌려 str 을 만든다 panic (str) -> ! 메시지를 출력하고 trap한다 assert (bool) 거짓이면 assertion failed 로 trap한다 wrapping_add wrapping_sub wrapping_mul (T, T) -> T 정수형. 감싸는 산술 alloc unsafe (u64) -> *mut u8 힙 블록을 할당한다 free unsafe (*mut u8) alloc / String 힙 블록을 해제한다 mmio_read8/16/32/64 unsafe (u64) -> uN volatile 읽기(펌웨어 전용) mmio_write8/16/32/64 unsafe (u64, uN) volatile 쓰기(펌웨어 전용) port_in8/in32 unsafe (u16) -> uN x86 포트 읽기(uefi, bios) port_out8/out32 unsafe (u16, uN) x86 포트 쓰기(uefi, bios) halt unsafe () CPU를 멈춘다(펌웨어 전용) semihost unsafe (u64, u64) -> u64 AArch64 semihosting 호출(aarch64 전용) ccall0..ccall4 unsafe (*const u8, u64...) -> u64 함수 포인터 호출(uefi 전용) efi_system_table , efi_image_handle unsafe () -> *mut u8 UEFI 인자(uefi 전용) 할당은 런타임의 tam_alloc / tam_realloc / tam_free 를 거친다(호스트는 libc, Windows는 Heap API, 펌웨어는 자체 할당자). 사용자가 allocator를 교체하는 문법은 아직 없다. 15. 구현 한계 ¶ 컴파일러가 안전하게 처리하는 범위를 정해 두었다. 넘으면 크래시가 아니라 위치와 함께 오류 를 낸다. 한계 값 오류 구문 중첩(괄호, 블록, 단항 연산자, 타입) 200단계 nesting is too deep (more than 200 levels) 한 식의 연산자 사슬( a + b + c + … ) 2000개 expression has more than 2000 operators in a row 제네릭 인스턴스 5000개, 중첩 깊이 64 generic instantiation limit exceeded 오류 보고 첫 번째 오류 하나 BIOS 이미지 페이로드 384KiB 힙(BIOS/AArch64) 각 32MiB 바닥나면 trap TAM,FRAGMENT 복사 // 긴 식은 문장으로 나눈다. 1900개 항은 허용된다.\nfn main() i32 { 0 + 1 + 1 + 1 } 16. 문법 요약(EBNF) ¶ { x } 는 0회 이상, [ x ] 는 선택, | 는 선택지, 따옴표는 글자 그대로다. NL 은 문장 끝(줄바꿈 또는 ; )이다. CODE 복사 program     = { item } .\nitem        = use | struct | impl | function | extern | const .\n\nuse         = \"use\" ident { \".\" ident } NL .\nconst       = [ \"pub\" ] \"const\" ident \":\" type \"=\" expr NL .\ntparams     = \"<\" ident { \",\" ident } \">\" .\nstruct      = [ \"pub\" ] \"struct\" ident [ tparams ] \"{\" [ field { ( \",\" | NL ) field } [ \",\" ] ] \"}\" .\nfield       = ident \":\" type .\nimpl        = \"impl\" ident [ tparams ] \"{\" { [ \"pub\" ] function } \"}\" .\nfunction    = [ \"pub\" ] [ \"unsafe\" ] \"fn\" ident [ tparams ] \"(\" [ params ] \")\" [ type ] block .\nextern      = [ \"pub\" ] \"extern\" string \"fn\" ident \"(\" [ params ] \")\" [ type ] [ \"=\" string ] .\nparams      = param { \",\" param } [ \",\" ] .\nparam       = ident \":\" type | \"&\" [ \"mut\" ] \"self\" | \"self\" .\n\ntype        = \"&\" [ \"mut\" ] type\n            | \"*\" ( \"const\" | \"mut\" ) type\n            | \"[\" type [ \";\" ( int | ident ) ] \"]\"\n            | ident [ \"<\" type { \",\" type } \">\" ] .\n\nblock       = \"{\" { stmt NL } [ expr ] \"}\" .\nstmt        = ( \"let\" | \"mut\" ) ident [ \":\" type ] \"=\" expr\n            | place assign_op expr\n            | \"return\" [ expr ]\n            | \"break\" | \"continue\"\n            | \"while\" expr block\n            | \"loop\" block\n            | \"for\" ident \"in\" expr ( \"..\" | \"..=\" ) expr block\n            | \"for\" ident \"in\" expr block\n            | expr .\nassign_op   = \"=\" | \"+=\" | \"-=\" | \"*=\" | \"/=\" | \"%=\" | \"&=\" | \"|=\" | \"^=\" | \"<<=\" | \">>=\" .\n\nexpr        = binary .\nbinary      = unary { binop unary } .          (* 우선순위는 4.1절 *)\nunary       = ( \"-\" | \"!\" | \"~\" | \"*\" | \"&\" [ \"mut\" ] ) unary | postfix { \"as\" type } .\npostfix     = primary { \".\" ident [ \"(\" args \")\" ] | \"[\" index \"]\" | \"?\" } .\nindex       = expr | [ expr ] \"..\" [ expr ] .\nprimary     = int | float | char | string | \"true\" | \"false\"\n            | ident [ \"<\" type { \",\" type } \">\" ] [ \"::\" ident [ \"::\" ident ] ] [ \"(\" args \")\" | \"{\" fieldinits \"}\" ]\n            | \"(\" expr \")\"\n            | \"[\" expr { \",\" expr } [ \",\" ] \"]\" | \"[\" expr \";\" ( int | ident ) \"]\"\n            | \"if\" expr block [ \"else\" ( block | \"if\" ... ) ]\n            | \"match\" expr \"{\" arm { ( \",\" | NL ) arm } \"}\"\n            | \"unsafe\" block .\narm         = pattern \"=>\" ( expr | block ) .\npattern     = ( \"Ok\" | \"Err\" | \"Some\" ) \"(\" ( ident | \"_\" ) \")\" | \"None\" . 17. 아직 없는 것 ¶ TAM은 작게 시작했다. 다음은 아직 없다 (없는 것을 쓰면 오류가 난다). 트레이트(제네릭의 경계), 메서드 자신의 타입 매개변수, 상수 제네릭( [T; N] 의 N ), 연산자 오버로딩, 클로저, 함수 포인터 값 열거형( enum ), 튜플, 별칭 타입, 전역 변수 /정적 변수(상수는 있다) Vec 과 해시맵 같은 가변 길이 컬렉션( tam.os / tam.fmt 이외의 표준 라이브러리) 레이블 break , break 값 , 문자열·정수 match , 팔 전체를 대신하는 _ => 패턴 use 별칭, pub use , 필드 단위 pub 사용자 allocator 교체, 사용자 정의 소멸자, Box<T> String 인덱싱, 슬라이스·배열 비교( == ), 길이 0 배열, 식으로 된 배열 길이( N * 2 ; 상수 이름은 된다) 오류 타입 변환( From ), Option / Result 의 map 등 조합 메서드 여러 오류를 한 번에 보고하는 기능(첫 오류만 보고한다) 스레드, 비동기, 파일/디렉터리 조작과 명령줄 인자( tam.os 의 범위: 표준 라이브러리 문서 ) 이 목록은 ROADMAP.md 의 마일스톤에 따라 줄어든다. 18. 호환성 약속: TAM 1 ¶ tamc 1.0 은 TAM 1 의 첫 공식 버전이다. 이 문서가 정의하는 언어를 에디션 1 이라 부른다. 약속 (1.x 동안) 에디션 1에서 올바르게 컴파일되던 프로그램은 이후의 모든 1.x 컴파일러에서도 같은 의미로 컴파일된다. 종료 코드, 출력, trap 조건(오버플로, 경계, 0 나누기)은 바뀌지 않는다. 새 기능은 추가만 한다. 17장의 \"아직 없는 것\"은 채워질 수 있어도 기존 문법의 뜻을 바꾸지 않는다. 새 키워드는 에디션 1에서 식별자로 쓰이던 이름을 깨지 않는 방식으로만 들이며, 불가피하면 새 에디션으로 미룬다. 컴파일러가 더 많은 오류를 잡아내는 것 은 버그 수정이다. 이전에 잘못 받아들이던 프로그램(예: 실제로는 메모리 안전하지 않은 코드)은 거절될 수 있다. 이 경우 변경 이력에 적는다. 오류 메시지 문구 와 위치 표시는 약속 대상이 아니다. 도구는 종료 코드로 판단해야 한다. 표준 라이브러리( tam.os , tam.fmt , tam.serial )와 내장 함수의 시그니처는 1.x에서 제거·변경하지 않는다. Tmake.toml 의 기존 키와 Tmake.lock 형식은 읽을 수 있게 유지한다. 에디션 Tmake.toml 의 [package] 에 edition = \"1\" 을 쓸 수 있다(생략하면 \"1\" ). 이 컴파일러가 모르는 에디션이면 unsupported edition 으로 빌드가 거절된다. 호환되지 않는 변경이 필요해지면 새 에디션( \"2\" )으로만 도입하고, 컴파일러는 에디션 1 패키지를 계속 빌드한다. 한 프로젝트 안에서 패키지마다 에디션이 달라도 된다. 약속하지 않는 것 \"정해지지 않았다\"고 적은 동작, 구현 한계의 정확한 수치(15장), 코드 생성 결과(LLVM IR, 어셈블리), 단형화 인스턴스의 내부 이름, tamc 내부 옵션 중 문서에 없는 것. 제네릭의 단형화 방식은 유지되며, 이후 트레이트 경계가 추가 되더라도 경계 없는 기존 제네릭 코드는 계속 컴파일된다.", "source": "docs/reference.md"}, {"key": "ref-stdlib", "path": "docs/stdlib.md", "nav": "표준 라이브러리", "title": "The Standard Library API Documentation ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"the-standard-library-api-documentation\" id=\"ref-stdlib--the-standard-library-api-documentation\">The Standard Library API Documentation<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--the-standard-library-api-documentation\">¶</a></h1>\n<p>TAM의 표준 라이브러리는 <strong>컴파일러에 내장된 TAM 소스</strong>(<code>std/</code>)와 컴파일러가 직접 제공하는 <strong>내장 함수</strong>로 이루어진다. 이 문서는 모든 공개 함수의 시그니처, 동작, 오류, 대상별 차이, 예제를 정의한다.</p>\n<ul>\n<li>대상 버전: <code>tamc 1.0</code></li>\n<li>이 문서의 모든 <code>tam</code> 코드 블록은 개발 중 검증 도구가 호스트(Linux)에서 실제로 컴파일하고 실행해 출력과 종료 코드를 검증한다.</li>\n<li>언어 자체의 규칙은 <a href=\"#doc-ref-reference\">The TAM Reference</a>를 본다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"목차\" id=\"ref-stdlib--목차\">목차<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--목차\">¶</a></h2>\n<ol>\n<li><a href=\"#doc-ref-stdlib--1-개요\">개요</a></li>\n<li><a href=\"#doc-ref-stdlib--2-대상별-지원표\">대상별 지원표</a></li>\n<li><a href=\"#doc-ref-stdlib--3-tamos\"><code>tam.os</code></a></li>\n<li><a href=\"#doc-ref-stdlib--4-tamfmt\"><code>tam.fmt</code></a></li>\n<li><a href=\"#doc-ref-stdlib--5-tamserial\"><code>tam.serial</code></a></li>\n<li><a href=\"#doc-ref-stdlib--6-내장-함수\">내장 함수</a></li>\n<li><a href=\"#doc-ref-stdlib--7-메모리와-할당자\">메모리와 할당자</a></li>\n<li><a href=\"#doc-ref-stdlib--8-오류-코드\">오류 코드</a></li>\n<li><a href=\"#doc-ref-stdlib--9-레시피\">레시피</a></li>\n<li><a href=\"#doc-ref-stdlib--10-표준-라이브러리-없이-쓰기와-한계\">표준 라이브러리 없이 쓰기와 한계</a></li>\n</ol>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"1-개요\" id=\"ref-stdlib--1-개요\">1. 개요<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--1-개요\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"11-가져오는-법\" id=\"ref-stdlib--11-가져오는-법\">1.1 가져오는 법<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--11-가져오는-법\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,IGNORE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,ignore\">use tam.os      // 입출력, 파일, 시간, 종료\nuse tam.fmt     // 문자열 만들기\nuse tam.serial  // 직렬 포트(x86 펌웨어 전용)\n</code></pre></div>\n<p><code>use</code>의 첫 조각이 <code>tam</code>이면 프로젝트의 파일이 아니라 내장 소스를 쓴다. 이후 <code>os::print(...)</code>처럼 마지막 조각을 모듈 이름으로 쓴다.</p>\n<h3 class=\"doc-heading\" data-slug=\"12-구성-원칙\" id=\"ref-stdlib--12-구성-원칙\">1.2 구성 원칙<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--12-구성-원칙\">¶</a></h3>\n<ul>\n<li><strong>플랫폼 호출은 이 계층에만 있다.</strong> 코어 컴파일러는 OS를 모른다. <code>tam.os</code>는 호스트에서 libc(<code>write</code>, <code>read</code>, <code>open</code>…), Windows에서 <code>kernel32</code>(<code>WriteFile</code>, <code>ReadFile</code>, <code>CreateFileA</code>…), 펌웨어에서 직렬 포트/UEFI 콘솔/UART를 부른다. <strong>공개 API는 모든 대상에서 같다</strong>(펌웨어는 일부만 제공).</li>\n<li><strong>오류는 값이다.</strong> 실패할 수 있는 함수는 <code>Result&lt;T, i32&gt;</code>를 돌려주며 <code>i32</code>는 운영체제 오류 코드(호스트 <code>errno</code>, Windows <code>GetLastError</code>)다(<a href=\"#doc-ref-stdlib--8-오류-코드\">8장</a>). 예외도 패닉도 없다.</li>\n<li><strong>입출력은 바이트 단위</strong>다. 문자열은 UTF-8 바이트 그대로 오간다. 서식(<code>print_int</code> 외)은 <code>tam.fmt</code>로 만든 문자열을 출력한다.</li>\n<li>소유권 규칙이 그대로 적용된다. <code>String</code>을 돌려주는 함수의 결과는 호출자가 소유하며 스코프가 끝날 때 해제된다.</li>\n</ul>\n<h3 class=\"doc-heading\" data-slug=\"13-첫-프로그램\" id=\"ref-stdlib--13-첫-프로그램\">1.3 첫 프로그램<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--13-첫-프로그램\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\nfn main() i32 {\n    os::println(\"Hello, TAM!\")\n    0\n}\n// out: Hello, TAM!\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"2-대상별-지원표\" id=\"ref-stdlib--2-대상별-지원표\">2. 대상별 지원표<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--2-대상별-지원표\">¶</a></h2>\n<table>\n<thead>\n<tr>\n<th>함수</th>\n<th style=\"text-align:center\">host (Linux)</th>\n<th style=\"text-align:center\">windows</th>\n<th style=\"text-align:center\">uefi</th>\n<th style=\"text-align:center\">bios</th>\n<th style=\"text-align:center\">aarch64</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>os::print</code> <code>os::println</code> <code>os::print_int</code></td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔ (콘솔)</td>\n<td style=\"text-align:center\">✔ (COM1)</td>\n<td style=\"text-align:center\">✔ (UART)</td>\n</tr>\n<tr>\n<td><code>os::exit</code></td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n</tr>\n<tr>\n<td><code>os::read_line</code></td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n</tr>\n<tr>\n<td><code>os::read_file</code> <code>os::write_file</code></td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n</tr>\n<tr>\n<td><code>os::time_ms</code></td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n</tr>\n<tr>\n<td><code>fmt::*</code></td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n</tr>\n<tr>\n<td><code>serial::*</code></td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✘</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✔</td>\n<td style=\"text-align:center\">✘</td>\n</tr>\n</tbody>\n</table>\n<p>✘인 함수를 호출하면 컴파일 오류(<code>module `os` has no item `read_line`</code>)다. 펌웨어의 표준 출력은 대상마다 다르다.</p>\n<table>\n<thead>\n<tr>\n<th>대상</th>\n<th><code>print</code>의 목적지</th>\n<th><code>exit(code)</code></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>host</td>\n<td>파일 디스크립터 1(stdout)</td>\n<td>libc <code>exit</code></td>\n</tr>\n<tr>\n<td>windows</td>\n<td><code>GetStdHandle(STD_OUTPUT_HANDLE)</code></td>\n<td><code>ExitProcess</code></td>\n</tr>\n<tr>\n<td>uefi</td>\n<td><code>ConOut-&gt;OutputString</code>(ASCII만, <code>\\n</code>→<code>\\r\\n</code>)</td>\n<td>QEMU <code>isa-debug-exit</code>(포트 0xF4)에 쓰고 멈춤. 실제 하드웨어에서는 그냥 멈춤</td>\n</tr>\n<tr>\n<td>bios</td>\n<td>COM1 직렬 포트(0x3F8)</td>\n<td>위와 같음</td>\n</tr>\n<tr>\n<td>aarch64</td>\n<td>PL011 UART(0x09000000)</td>\n<td>semihosting <code>SYS_EXIT_EXTENDED</code>(QEMU <code>-semihosting</code> 필요)</td>\n</tr>\n</tbody>\n</table>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"3-tamos\" id=\"ref-stdlib--3-tamos\">3. <code>tam.os</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--3-tamos\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,IGNORE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,ignore\">use tam.os\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"31-print\" id=\"ref-stdlib--31-print\">3.1 <code>print</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--31-print\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>pub fn print(s: str)\n</code></pre></div>\n<p><code>s</code>의 바이트를 표준 출력에 쓴다. 줄바꿈을 붙이지 않는다. 버퍼링이 없으므로 호출마다 쓰기 시스템 호출이 일어난다(많은 작은 쓰기는 <code>String</code>으로 모아 한 번에 낸다). 출력 실패는 무시한다(예: 닫힌 파이프).</p>\n<h3 class=\"doc-heading\" data-slug=\"32-println\" id=\"ref-stdlib--32-println\">3.2 <code>println</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--32-println\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>pub fn println(s: str)\n</code></pre></div>\n<p><code>print(s)</code> 다음에 <code>\"\\n\"</code>을 쓴다. Windows에서도 <code>\"\\n\"</code>만 쓴다(콘솔은 이를 처리한다). UEFI 콘솔은 <code>\\n</code>을 <code>\\r\\n</code>으로 바꾼다.</p>\n<h3 class=\"doc-heading\" data-slug=\"33-printint\" id=\"ref-stdlib--33-printint\">3.3 <code>print_int</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--33-printint\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>pub fn print_int(n: i64)\n</code></pre></div>\n<p><code>n</code>을 10진수로 줄바꿈 없이 쓴다. 음수는 <code>-</code> 부호를 붙인다. <code>i64</code>의 최솟값 <code>-9223372036854775808</code>도 올바르게 출력한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\nfn main() i32 {\n    os::print_int(0)\n    os::print(\"|\")\n    os::print_int(-42)\n    os::print(\"|\")\n    os::print_int(9223372036854775807)\n    os::print(\"|\")\n    let min: i64 = -9223372036854775807 - 1\n    os::print_int(min)\n    os::println(\"\")\n    0\n}\n// out: 0|-42|9223372036854775807|-9223372036854775808\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"34-exit\" id=\"ref-stdlib--34-exit\">3.4 <code>exit</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--34-exit\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>pub fn exit(code: i32)\n</code></pre></div>\n<p>프로세스를 즉시 끝낸다. <strong>살아 있는 지역 변수의 자동 해제를 실행하지 않는다.</strong> 정상 종료는 <code>main</code>이 값을 반환하는 것이므로, <code>exit</code>는 깊은 호출 안에서 바로 빠져나와야 할 때만 쓴다. 호스트에서는 종료 코드의 하위 8비트가 쓰인다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\nfn fail_fast(code: i32) {\n    os::println(\"fatal\")\n    os::exit(code)\n}\n\nfn main() i32 {\n    fail_fast(3)\n    0   // 도달하지 않는다\n}\n// exit: 3\n// out: fatal\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"35-readline\" id=\"ref-stdlib--35-readline\">3.5 <code>read_line</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--35-readline\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>pub fn read_line() String          // host, windows\n</code></pre></div>\n<p>표준 입력에서 <strong>한 줄</strong>을 읽어 줄바꿈을 <strong>제외하고</strong> 돌려준다. 줄 끝의 <code>\\r</code>도 제거한다(<code>\\r\\n</code>과 <code>\\n</code>을 같게 취급). 입력이 끝나면(EOF) 그때까지 읽은 내용을 돌려준다. 읽을 것이 없으면 빈 문자열이다. EOF와 빈 줄은 구분되지 않는다. 오류가 나도 지금까지 읽은 것을 돌려준다.</p>\n<p>한 바이트씩 읽으므로 대용량 입력에는 느리다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\nfn main() i32 {\n    let a = os::read_line()\n    let b = os::read_line()\n    let c = os::read_line()   // EOF → 빈 문자열\n    os::println(as_str(&amp;a))\n    os::print_int(b.len as i64)\n    os::println(\"\")\n    os::print_int(c.len as i64)\n    os::println(\"\")\n    0\n}\n// stdin: hello world\n// stdin:\n// out: hello world\n// out: 0\n// out: 0\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"36-readfile\" id=\"ref-stdlib--36-readfile\">3.6 <code>read_file</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--36-readfile\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>pub fn read_file(path: str) Result&lt;String, i32&gt;     // host, windows\n</code></pre></div>\n<p><code>path</code>의 파일 <strong>전체</strong>를 읽어 <code>Ok(내용)</code>으로 돌려준다. 실패하면 <code>Err(OS 오류 코드)</code>다(없는 파일, 권한 없음, 디렉터리 등). 내용은 바이트 그대로(인코딩 변환 없음)이며 NUL을 포함할 수 있다.</p>\n<ul>\n<li>경로는 <code>str</code>이며 내부에서 NUL로 끝나는 복사본을 만든다. 경로 안의 NUL은 지원하지 않는다.</li>\n<li>Windows에서는 ANSI 경로(<code>CreateFileA</code>)다. UTF-16 경로는 쓸 수 없다.</li>\n<li>호스트에서 디렉터리를 읽으면 <code>open</code>은 성공하지만 <code>read</code>가 실패하므로 <code>Err(21)</code>(<code>EISDIR</code>)이다.</li>\n</ul>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\nfn main() i32 {\n    match os::read_file(\"/definitely/missing\") {\n        Ok(s) =&gt; os::println(\"?\")\n        Err(e) =&gt; {\n            os::print_int(e as i64)   // ENOENT\n            os::println(\"\")\n        }\n    }\n    0\n}\n// out: 2\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"37-writefile\" id=\"ref-stdlib--37-writefile\">3.7 <code>write_file</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--37-writefile\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>pub fn write_file(path: str, data: str) Result&lt;i32, i32&gt;     // host, windows\n</code></pre></div>\n<p><code>path</code>에 <code>data</code>를 쓴다. 파일이 없으면 만들고(호스트 권한 0644) <strong>있으면 내용을 지운 뒤 덮어쓴다</strong>. 성공하면 쓴 바이트 수, 실패하면 OS 오류 코드다. 부분 쓰기는 반복해서 끝까지 쓴다(호스트).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\nfn run() Result&lt;i32, i32&gt; {\n    let n = os::write_file(\"/tmp/tam-doc-demo.txt\", \"line1\\nline2\\n\")?\n    let text = os::read_file(\"/tmp/tam-doc-demo.txt\")?\n    os::println(as_str(&amp;text))\n    Ok(n)\n}\n\nfn main() i32 {\n    match run() {\n        Ok(n) =&gt; n\n        Err(e) =&gt; 100 + e\n    }\n}\n// exit: 12\n// out: line1\n// out: line2\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"38-timems\" id=\"ref-stdlib--38-timems\">3.8 <code>time_ms</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--38-timems\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>pub fn time_ms() u64        // host, windows\n</code></pre></div>\n<p><strong>단조 증가</strong>하는 시계를 밀리초로 돌려준다. 호스트는 <code>CLOCK_MONOTONIC</code>, Windows는 <code>GetTickCount64</code>(부팅 후 경과)다. 절대 시각(달력)이 아니므로 <strong>경과 시간을 재는 데</strong> 쓴다. 해상도는 호스트 1ms 미만, Windows 약 10~16ms다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\nfn main() i32 {\n    let t0 = os::time_ms()\n    mut x: u64 = 0\n    for i in 0..1000 { x += 1 }\n    let dt = os::time_ms() - t0\n    if dt &lt; 1000 &amp;&amp; x == 1000 { 0 } else { 1 }\n}\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"4-tamfmt\" id=\"ref-stdlib--4-tamfmt\">4. <code>tam.fmt</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--4-tamfmt\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,IGNORE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,ignore\">use tam.fmt\n</code></pre></div>\n<p>순수 TAM으로 쓰인 문자열 도구다. 모든 대상에서 같다. 할당은 <code>String</code>을 거치므로 소유권 규칙이 적용된다.</p>\n<h3 class=\"doc-heading\" data-slug=\"41-pushstr\" id=\"ref-stdlib--41-pushstr\">4.1 <code>push_str</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--41-pushstr\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>pub fn push_str(s: &amp;mut String, t: str)\n</code></pre></div>\n<p><code>s</code>의 끝에 <code>t</code>의 바이트를 이어 붙인다. 용량이 모자라면 늘린다.</p>\n<h3 class=\"doc-heading\" data-slug=\"42-concat\" id=\"ref-stdlib--42-concat\">4.2 <code>concat</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--42-concat\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>pub fn concat(a: str, b: str) String\n</code></pre></div>\n<p><code>a</code> 다음에 <code>b</code>가 오는 <strong>새</strong> <code>String</code>을 만든다. 인자는 <code>str</code>이라 소유권이 이동하지 않는다. <code>String</code>이 있으면 <code>as_str(&amp;s)</code>를 넘긴다.</p>\n<h3 class=\"doc-heading\" data-slug=\"43-inttostring\" id=\"ref-stdlib--43-inttostring\">4.3 <code>int_to_string</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--43-inttostring\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>pub fn int_to_string(n: i64) String\n</code></pre></div>\n<p><code>n</code>의 10진 문자열. <code>i64</code>의 최솟값도 올바르다. 다른 정수형은 <code>as i64</code>로 넓혀 넘긴다(<code>u64</code>의 <code>i64</code> 최댓값 초과 값은 부호가 바뀌니 주의).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\nuse tam.fmt\n\nfn main() i32 {\n    mut s = fmt::concat(\"x = \", \"\")\n    let n = fmt::int_to_string(-120)\n    fmt::push_str(&amp;mut s, as_str(&amp;n))\n    fmt::push_str(&amp;mut s, \", y = \")\n    let m = fmt::int_to_string(7)\n    fmt::push_str(&amp;mut s, as_str(&amp;m))\n    os::println(as_str(&amp;s))\n    s.len as i32\n}\n// exit: 15\n// out: x = -120, y = 7\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"5-tamserial\" id=\"ref-stdlib--5-tamserial\">5. <code>tam.serial</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--5-tamserial\">¶</a></h2>\n<div class=\"code-wrap\"><div class=\"code-label\">CODE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code>pub fn put(b: u8)\npub fn print(s: str)\npub fn println(s: str)\npub fn print_int(n: i64)\n</code></pre></div>\n<p><strong>uefi와 bios 대상 전용</strong>이다(x86 COM1, 포트 0x3F8). <code>put</code>은 송신 버퍼가 빌 때까지(최대 약 100만 번 확인) 기다린 뒤 한 바이트를 보낸다. BIOS 대상의 <code>tam.os.print</code>가 이 모듈 위에 만들어져 있다. UEFI에서 화면(콘솔)과 별개로 직렬 로그를 남길 때 쓴다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,IGNORE<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,ignore\">use tam.serial\n\nfn main() i32 {\n    serial::println(\"booted\")\n    0\n}\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"6-내장-함수\" id=\"ref-stdlib--6-내장-함수\">6. 내장 함수<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--6-내장-함수\">¶</a></h2>\n<p><code>use</code> 없이 쓰는 예약된 이름이다. 표는 <a href=\"#doc-ref-reference--14-내장-함수\">Reference 14장</a>에 있고, 이 절은 동작을 자세히 정의한다.</p>\n<h3 class=\"doc-heading\" data-slug=\"61-문자열\" id=\"ref-stdlib--61-문자열\">6.1 문자열<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--61-문자열\">¶</a></h3>\n<h4 class=\"doc-heading\" data-slug=\"stringfroms-str-string\" id=\"ref-stdlib--stringfroms-str-string\"><code>string_from(s: str) -&gt; String</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--stringfroms-str-string\">¶</a></h4>\n<p><code>s</code>의 바이트를 힙에 복사한 새 <code>String</code>을 만든다. 길이 = <code>s.len</code>, 용량 ≥ 길이.</p>\n<h4 class=\"doc-heading\" data-slug=\"stringpushs-mut-string-b-u8\" id=\"ref-stdlib--stringpushs-mut-string-b-u8\"><code>string_push(s: &amp;mut String, b: u8)</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--stringpushs-mut-string-b-u8\">¶</a></h4>\n<p><code>b</code> 한 바이트를 끝에 붙인다. 용량이 모자라면 <strong>2배로 늘린다</strong>(<code>realloc</code>). 그래서 <code>n</code>번 <code>push</code>의 총 비용은 O(n)이다.</p>\n<h4 class=\"doc-heading\" data-slug=\"asstrs-string-str\" id=\"ref-stdlib--asstrs-string-str\"><code>as_str(s: &amp;String) -&gt; str</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--asstrs-string-str\">¶</a></h4>\n<p><code>String</code>의 버퍼를 가리키는 <code>str</code>을 돌려준다. 복사가 없다. <strong><code>s</code>를 빌린 것으로 취급</strong>하므로 반환된 <code>str</code>이 살아 있는 동안 <code>s</code>를 이동하거나 수정(<code>string_push</code>, 재대입)할 수 없다. 컴파일러가 이를 검사한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 5\nfn main() i32 {\n    mut s = string_from(\"ab\")\n    string_push(&amp;mut s, 99)\n    string_push(&amp;mut s, 100)\n    string_push(&amp;mut s, 101)\n    let v = as_str(&amp;s)            // \"abcde\"\n    if v == \"abcde\" { v.len as i32 } else { 0 }\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"62-실패\" id=\"ref-stdlib--62-실패\">6.2 실패<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--62-실패\">¶</a></h3>\n<h4 class=\"doc-heading\" data-slug=\"panicmsg-str\" id=\"ref-stdlib--panicmsg-str\"><code>panic(msg: str) -&gt; !</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--panicmsg-str\">¶</a></h4>\n<p>호스트에서 stderr에 <code>tam: panic: &lt;msg&gt;</code>를 쓰고 trap(<code>SIGILL</code>)한다. 반환하지 않으므로 어떤 타입의 자리에도 쓸 수 있다. 자동 해제는 실행되지 않는다. 다른 대상에서는 메시지 없이 trap한다.</p>\n<h4 class=\"doc-heading\" data-slug=\"assertcond-bool\" id=\"ref-stdlib--assertcond-bool\"><code>assert(cond: bool)</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--assertcond-bool\">¶</a></h4>\n<p><code>cond</code>가 거짓이면 <code>assertion failed</code>로 panic한다. 릴리스에서도 <strong>제거되지 않는다</strong>(검사를 끄는 옵션이 없다).</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM,TRAP<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam,trap\">// panic: tam: panic: out of range\nfn pick(i: i32) i32 {\n    if i &lt; 0 || i &gt; 3 { panic(\"out of range\") }\n    i * 2\n}\nfn main() i32 { pick(9) }\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"63-감싸는-산술\" id=\"ref-stdlib--63-감싸는-산술\">6.3 감싸는 산술<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--63-감싸는-산술\">¶</a></h3>\n<h4 class=\"doc-heading\" data-slug=\"wrappingadda-t-b-t-t-wrappingsub-wrappingmul\" id=\"ref-stdlib--wrappingadda-t-b-t-t-wrappingsub-wrappingmul\"><code>wrapping_add(a: T, b: T) -&gt; T</code>, <code>wrapping_sub</code>, <code>wrapping_mul</code><a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--wrappingadda-t-b-t-t-wrappingsub-wrappingmul\">¶</a></h4>\n<p>정수형 <code>T</code>(<code>i8</code>…<code>u64</code>)에서 오버플로를 <strong>감싸서</strong>(2의 보수 모듈러) 계산한다. 기본 <code>+ - *</code>는 오버플로에서 trap하므로, 해시나 난수 생성기 같은 의도된 감싸기에 이 함수를 쓴다. 사용자가 같은 이름의 함수를 정의하면 사용자 정의가 우선한다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 0\nfn hash(s: str) u32 {\n    mut h: u32 = 2166136261\n    for i in 0..s.len {\n        let b = unsafe { *(s.ptr + i) } as u32\n        h = wrapping_mul(h ^ b, 16777619)   // FNV-1a\n    }\n    h\n}\n\nfn main() i32 {\n    if hash(\"\") != 2166136261 { return 1 }\n    if hash(\"a\") != 3826002220 { return 2 }\n    0\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"64-힙unsafe\" id=\"ref-stdlib--64-힙unsafe\">6.4 힙(unsafe)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--64-힙unsafe\">¶</a></h3>\n<h4 class=\"doc-heading\" data-slug=\"allocn-u64-mut-u8-unsafe\" id=\"ref-stdlib--allocn-u64-mut-u8-unsafe\"><code>alloc(n: u64) -&gt; *mut u8</code> (unsafe)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--allocn-u64-mut-u8-unsafe\">¶</a></h4>\n<p><code>n</code>바이트의 힙 블록을 할당한다. 내용은 <strong>초기화되지 않는다</strong>. 정렬은 최소 16바이트다. 실패(<code>malloc</code>이 NULL)는 검사하지 않는다(호스트). BIOS/AArch64의 고정 힙이 바닥나면 trap한다.</p>\n<h4 class=\"doc-heading\" data-slug=\"freep-mut-u8-unsafe\" id=\"ref-stdlib--freep-mut-u8-unsafe\"><code>free(p: *mut u8)</code> (unsafe)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--freep-mut-u8-unsafe\">¶</a></h4>\n<p><code>alloc</code>이 돌려준 블록(또는 <code>String</code>의 <code>.ptr</code>)을 해제한다. 같은 블록을 두 번 해제하거나 <code>alloc</code>이 아닌 포인터를 넘기면 정의되지 않은 동작이다.</p>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">// exit: 9\nfn main() i32 {\n    let m = unsafe { alloc(8 * 4) }\n    let q = m as *mut i64\n    let r = unsafe {\n        mut i: i64 = 0\n        while i &lt; 4 {\n            *(q + i) = i * 2\n            i += 1\n        }\n        let s = *q + *(q + 1) + *(q + 2) + *(q + 3) + 3  // 0+2+4+6+3\n        free(m)\n        s - 6\n    }\n    r as i32\n}\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"65-하드웨어-접근-펌웨어-전용-모두-unsafe\" id=\"ref-stdlib--65-하드웨어-접근-펌웨어-전용-모두-unsafe\">6.5 하드웨어 접근 (펌웨어 전용, 모두 unsafe)<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--65-하드웨어-접근-펌웨어-전용-모두-unsafe\">¶</a></h3>\n<p>다른 대상에서 쓰면 컴파일 오류다(<code>`mmio_write8` is not available when targeting host</code>).</p>\n<table>\n<thead>\n<tr>\n<th>함수</th>\n<th>대상</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>mmio_read8/16/32/64(addr: u64) -&gt; uN</code></td>\n<td>uefi, bios, aarch64</td>\n<td>주소에서 volatile 읽기</td>\n</tr>\n<tr>\n<td><code>mmio_write8/16/32/64(addr: u64, v: uN)</code></td>\n<td>uefi, bios, aarch64</td>\n<td>volatile 쓰기</td>\n</tr>\n<tr>\n<td><code>port_in8(port: u16) -&gt; u8</code>, <code>port_in32(port: u16) -&gt; u32</code></td>\n<td>uefi, bios</td>\n<td>x86 I/O 포트 읽기</td>\n</tr>\n<tr>\n<td><code>port_out8(port: u16, v: u8)</code>, <code>port_out32(port: u16, v: u32)</code></td>\n<td>uefi, bios</td>\n<td>x86 I/O 포트 쓰기</td>\n</tr>\n<tr>\n<td><code>halt()</code></td>\n<td>uefi, bios, aarch64</td>\n<td>CPU를 멈춘다(<code>hlt</code>/<code>wfi</code>)</td>\n</tr>\n<tr>\n<td><code>semihost(op: u64, arg: u64) -&gt; u64</code></td>\n<td>aarch64</td>\n<td>ARM semihosting 호출</td>\n</tr>\n<tr>\n<td><code>ccall0..ccall4(f: *const u8, a.. : u64) -&gt; u64</code></td>\n<td>uefi</td>\n<td>MS x64 ABI로 함수 포인터 호출</td>\n</tr>\n<tr>\n<td><code>efi_system_table() -&gt; *mut u8</code>, <code>efi_image_handle() -&gt; *mut u8</code></td>\n<td>uefi</td>\n<td>진입점이 받은 인자</td>\n</tr>\n</tbody>\n</table>\n<p>volatile 접근은 컴파일러가 제거하거나 합치지 않는다. 장치 레지스터는 이것으로만 읽고 쓴다.</p>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"7-메모리와-할당자\" id=\"ref-stdlib--7-메모리와-할당자\">7. 메모리와 할당자<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--7-메모리와-할당자\">¶</a></h2>\n<ul>\n<li>모든 힙 할당은 런타임 함수 <code>tam_alloc</code>/<code>tam_realloc</code>/<code>tam_free</code>를 거친다. 호스트는 libc의 <code>malloc</code>/<code>realloc</code>/<code>free</code>, Windows는 <code>HeapAlloc</code>/<code>HeapReAlloc</code>/<code>HeapFree</code>, UEFI는 boot services의 <code>AllocatePool</code>/<code>FreePool</code>이다.</li>\n<li>BIOS/AArch64는 <strong>고정 영역(각 32MiB)</strong>에서 크기 등급별 free-list + 범프 할당자를 쓴다. 블록 앞 16바이트에 크기를 저장하고, 블록은 합쳐지지 않으며 최대 2배까지 낭비된다. 영역이 바닥나면 trap한다. 해제된 블록은 재사용된다(128MiB를 누적 할당하는 테스트로 확인).</li>\n<li><strong>사용자가 할당자를 교체하는 문법은 아직 없다.</strong></li>\n<li>사용자 함수 이름이 런타임 심볼(<code>memcpy</code>, <code>memset</code>, <code>memmove</code>, <code>tam_alloc</code>, <code>tam_realloc</code>, <code>tam_free</code>, <code>mainCRTStartup</code>)과 같으면 Windows 빌드에서 충돌한다.</li>\n</ul>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"8-오류-코드\" id=\"ref-stdlib--8-오류-코드\">8. 오류 코드<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--8-오류-코드\">¶</a></h2>\n<p><code>Result&lt;_, i32&gt;</code>의 오류 값은 <strong>운영체제의 오류 코드</strong>다. 같은 의미라도 숫자가 다를 수 있으니 이식성이 필요하면 의미를 직접 번역한다.</p>\n<table>\n<thead>\n<tr>\n<th>의미</th>\n<th>Linux <code>errno</code></th>\n<th>Windows <code>GetLastError</code></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>파일/경로 없음</td>\n<td>2 (<code>ENOENT</code>)</td>\n<td>2 (<code>ERROR_FILE_NOT_FOUND</code>), 3 (<code>ERROR_PATH_NOT_FOUND</code>)</td>\n</tr>\n<tr>\n<td>접근 거부</td>\n<td>13 (<code>EACCES</code>)</td>\n<td>5 (<code>ERROR_ACCESS_DENIED</code>)</td>\n</tr>\n<tr>\n<td>디렉터리를 파일처럼 읽음</td>\n<td>21 (<code>EISDIR</code>)</td>\n<td>5</td>\n</tr>\n<tr>\n<td>이미 있음</td>\n<td>17 (<code>EEXIST</code>)</td>\n<td>80 (<code>ERROR_FILE_EXISTS</code>)</td>\n</tr>\n<tr>\n<td>디스크 가득</td>\n<td>28 (<code>ENOSPC</code>)</td>\n<td>112 (<code>ERROR_DISK_FULL</code>)</td>\n</tr>\n<tr>\n<td>너무 많은 열린 파일</td>\n<td>24 (<code>EMFILE</code>)</td>\n<td>4 (<code>ERROR_TOO_MANY_OPEN_FILES</code>)</td>\n</tr>\n</tbody>\n</table>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\n// 가장 흔한 \"없음\"만 의미로 번역하는 예.\nfn describe(code: i32) i32 {\n    if code == 2 { 1 }        // 없음(Linux와 Windows 모두 2)\n    else if code == 13 || code == 5 { 2 }  // 접근 거부\n    else { 9 }\n}\n\nfn main() i32 {\n    match os::read_file(\"/definitely/missing\") {\n        Ok(s) =&gt; 0\n        Err(e) =&gt; describe(e)\n    }\n}\n// exit: 1\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"9-레시피\" id=\"ref-stdlib--9-레시피\">9. 레시피<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--9-레시피\">¶</a></h2>\n<h3 class=\"doc-heading\" data-slug=\"91-한-줄씩-에코\" id=\"ref-stdlib--91-한-줄씩-에코\">9.1 한 줄씩 에코<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--91-한-줄씩-에코\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\nfn main() i32 {\n    mut count = 0\n    let first = os::read_line()\n    os::print(\"&gt; \")\n    os::println(as_str(&amp;first))\n    count += 1\n    count\n}\n// stdin: tam\n// out: &gt; tam\n// exit: 1\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"92-파일-복사\" id=\"ref-stdlib--92-파일-복사\">9.2 파일 복사<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--92-파일-복사\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\nfn copy(from: str, to: str) Result&lt;i32, i32&gt; {\n    let data = os::read_file(from)?\n    os::write_file(to, as_str(&amp;data))\n}\n\nfn main() i32 {\n    let w = os::write_file(\"/tmp/tam-doc-src.txt\", \"copy me\")\n    match copy(\"/tmp/tam-doc-src.txt\", \"/tmp/tam-doc-dst.txt\") {\n        Ok(n) =&gt; n\n        Err(e) =&gt; 100 + e\n    }\n}\n// exit: 7\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"93-정수를-글자로-모아-한-번에-출력\" id=\"ref-stdlib--93-정수를-글자로-모아-한-번에-출력\">9.3 정수를 글자로 모아 한 번에 출력<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--93-정수를-글자로-모아-한-번에-출력\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\nuse tam.fmt\n\nfn main() i32 {\n    mut line = string_from(\"\")\n    for i in 1..=5 {\n        let t = fmt::int_to_string(i as i64 * i as i64)\n        fmt::push_str(&amp;mut line, as_str(&amp;t))\n        if i &lt; 5 { fmt::push_str(&amp;mut line, \",\") }\n    }\n    os::println(as_str(&amp;line))\n    0\n}\n// out: 1,4,9,16,25\n</code></pre></div>\n<h3 class=\"doc-heading\" data-slug=\"94-경과-시간-재기\" id=\"ref-stdlib--94-경과-시간-재기\">9.4 경과 시간 재기<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--94-경과-시간-재기\">¶</a></h3>\n<div class=\"code-wrap\"><div class=\"code-label\">TAM<button aria-label=\"코드 복사\" class=\"copy-code\" type=\"button\">복사</button></div><pre><code class=\"language-tam\">use tam.os\n\nfn work() u64 {\n    mut acc: u64 = 0\n    for i in 0..100000 { acc = acc + i as u64 }\n    acc\n}\n\nfn main() i32 {\n    let t0 = os::time_ms()\n    let r = work()\n    let elapsed = os::time_ms() - t0\n    if r == 4999950000 &amp;&amp; elapsed &lt; 5000 { 0 } else { 1 }\n}\n</code></pre></div>\n<hr/>\n<h2 class=\"doc-heading\" data-slug=\"10-표준-라이브러리-없이-쓰기와-한계\" id=\"ref-stdlib--10-표준-라이브러리-없이-쓰기와-한계\">10. 표준 라이브러리 없이 쓰기와 한계<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-stdlib--10-표준-라이브러리-없이-쓰기와-한계\">¶</a></h2>\n<ul>\n<li><code>tam.os</code> 없이도 프로그램은 컴파일된다(<code>main</code>의 반환값이 종료 코드). 호스트에서 <code>extern \"c\"</code>로 직접 libc를 부를 수도 있다(<a href=\"#doc-ref-reference--25-extern-함수\">Reference 2.5절</a>).</li>\n<li><strong>없는 것</strong>: 명령줄 인자, 환경 변수, 디렉터리 조작, 프로세스 생성, 네트워크, 스레드, 시각(달력), 난수, 부동소수 서식(<code>f64</code> 출력), <code>Vec</code>/해시맵 같은 컬렉션, 문자열 검색/분리/변환(숫자 파싱 포함), UTF-8 검증. 필요하면 <code>extern</code>과 <code>unsafe</code>로 직접 만들 수 있다.</li>\n<li>호스트 <code>tam.os</code>는 Linux(glibc) 기준이다(<code>__errno_location</code>, <code>open</code> 플래그 값). macOS 등에서는 아직 검증하지 않았다.</li>\n<li>펌웨어판 <code>tam.os</code>는 <code>print</code>/<code>println</code>/<code>print_int</code>/<code>exit</code>뿐이다(입력, 파일, 시간 없음). UEFI 콘솔은 ASCII만 지원한다.</li>\n<li><code>os::exit</code>와 trap/패닉은 자동 해제를 실행하지 않는다.</li>\n</ul>\n", "text": "The Standard Library API Documentation ¶ TAM의 표준 라이브러리는 컴파일러에 내장된 TAM 소스 ( std/ )와 컴파일러가 직접 제공하는 내장 함수 로 이루어진다. 이 문서는 모든 공개 함수의 시그니처, 동작, 오류, 대상별 차이, 예제를 정의한다. 대상 버전: tamc 1.0 이 문서의 모든 tam 코드 블록은 개발 중 검증 도구가 호스트(Linux)에서 실제로 컴파일하고 실행해 출력과 종료 코드를 검증한다. 언어 자체의 규칙은 The TAM Reference 를 본다. 목차 ¶ 개요 대상별 지원표 tam.os tam.fmt tam.serial 내장 함수 메모리와 할당자 오류 코드 레시피 표준 라이브러리 없이 쓰기와 한계 1. 개요 ¶ 1.1 가져오는 법 ¶ TAM,IGNORE 복사 use tam.os      // 입출력, 파일, 시간, 종료\nuse tam.fmt     // 문자열 만들기\nuse tam.serial  // 직렬 포트(x86 펌웨어 전용) use 의 첫 조각이 tam 이면 프로젝트의 파일이 아니라 내장 소스를 쓴다. 이후 os::print(...) 처럼 마지막 조각을 모듈 이름으로 쓴다. 1.2 구성 원칙 ¶ 플랫폼 호출은 이 계층에만 있다. 코어 컴파일러는 OS를 모른다. tam.os 는 호스트에서 libc( write , read , open …), Windows에서 kernel32 ( WriteFile , ReadFile , CreateFileA …), 펌웨어에서 직렬 포트/UEFI 콘솔/UART를 부른다. 공개 API는 모든 대상에서 같다 (펌웨어는 일부만 제공). 오류는 값이다. 실패할 수 있는 함수는 Result<T, i32> 를 돌려주며 i32 는 운영체제 오류 코드(호스트 errno , Windows GetLastError )다( 8장 ). 예외도 패닉도 없다. 입출력은 바이트 단위 다. 문자열은 UTF-8 바이트 그대로 오간다. 서식( print_int 외)은 tam.fmt 로 만든 문자열을 출력한다. 소유권 규칙이 그대로 적용된다. String 을 돌려주는 함수의 결과는 호출자가 소유하며 스코프가 끝날 때 해제된다. 1.3 첫 프로그램 ¶ TAM 복사 use tam.os\n\nfn main() i32 {\n    os::println(\"Hello, TAM!\")\n    0\n}\n// out: Hello, TAM! 2. 대상별 지원표 ¶ 함수 host (Linux) windows uefi bios aarch64 os::print os::println os::print_int ✔ ✔ ✔ (콘솔) ✔ (COM1) ✔ (UART) os::exit ✔ ✔ ✔ ✔ ✔ os::read_line ✔ ✔ ✘ ✘ ✘ os::read_file os::write_file ✔ ✔ ✘ ✘ ✘ os::time_ms ✔ ✔ ✘ ✘ ✘ fmt::* ✔ ✔ ✔ ✔ ✔ serial::* ✘ ✘ ✔ ✔ ✘ ✘인 함수를 호출하면 컴파일 오류( module `os` has no item `read_line` )다. 펌웨어의 표준 출력은 대상마다 다르다. 대상 print 의 목적지 exit(code) host 파일 디스크립터 1(stdout) libc exit windows GetStdHandle(STD_OUTPUT_HANDLE) ExitProcess uefi ConOut->OutputString (ASCII만, \\n → \\r\\n ) QEMU isa-debug-exit (포트 0xF4)에 쓰고 멈춤. 실제 하드웨어에서는 그냥 멈춤 bios COM1 직렬 포트(0x3F8) 위와 같음 aarch64 PL011 UART(0x09000000) semihosting SYS_EXIT_EXTENDED (QEMU -semihosting 필요) 3. tam.os ¶ TAM,IGNORE 복사 use tam.os 3.1 print ¶ CODE 복사 pub fn print(s: str) s 의 바이트를 표준 출력에 쓴다. 줄바꿈을 붙이지 않는다. 버퍼링이 없으므로 호출마다 쓰기 시스템 호출이 일어난다(많은 작은 쓰기는 String 으로 모아 한 번에 낸다). 출력 실패는 무시한다(예: 닫힌 파이프). 3.2 println ¶ CODE 복사 pub fn println(s: str) print(s) 다음에 \"\\n\" 을 쓴다. Windows에서도 \"\\n\" 만 쓴다(콘솔은 이를 처리한다). UEFI 콘솔은 \\n 을 \\r\\n 으로 바꾼다. 3.3 print_int ¶ CODE 복사 pub fn print_int(n: i64) n 을 10진수로 줄바꿈 없이 쓴다. 음수는 - 부호를 붙인다. i64 의 최솟값 -9223372036854775808 도 올바르게 출력한다. TAM 복사 use tam.os\n\nfn main() i32 {\n    os::print_int(0)\n    os::print(\"|\")\n    os::print_int(-42)\n    os::print(\"|\")\n    os::print_int(9223372036854775807)\n    os::print(\"|\")\n    let min: i64 = -9223372036854775807 - 1\n    os::print_int(min)\n    os::println(\"\")\n    0\n}\n// out: 0|-42|9223372036854775807|-9223372036854775808 3.4 exit ¶ CODE 복사 pub fn exit(code: i32) 프로세스를 즉시 끝낸다. 살아 있는 지역 변수의 자동 해제를 실행하지 않는다. 정상 종료는 main 이 값을 반환하는 것이므로, exit 는 깊은 호출 안에서 바로 빠져나와야 할 때만 쓴다. 호스트에서는 종료 코드의 하위 8비트가 쓰인다. TAM 복사 use tam.os\n\nfn fail_fast(code: i32) {\n    os::println(\"fatal\")\n    os::exit(code)\n}\n\nfn main() i32 {\n    fail_fast(3)\n    0   // 도달하지 않는다\n}\n// exit: 3\n// out: fatal 3.5 read_line ¶ CODE 복사 pub fn read_line() String          // host, windows 표준 입력에서 한 줄 을 읽어 줄바꿈을 제외하고 돌려준다. 줄 끝의 \\r 도 제거한다( \\r\\n 과 \\n 을 같게 취급). 입력이 끝나면(EOF) 그때까지 읽은 내용을 돌려준다. 읽을 것이 없으면 빈 문자열이다. EOF와 빈 줄은 구분되지 않는다. 오류가 나도 지금까지 읽은 것을 돌려준다. 한 바이트씩 읽으므로 대용량 입력에는 느리다. TAM 복사 use tam.os\n\nfn main() i32 {\n    let a = os::read_line()\n    let b = os::read_line()\n    let c = os::read_line()   // EOF → 빈 문자열\n    os::println(as_str(&a))\n    os::print_int(b.len as i64)\n    os::println(\"\")\n    os::print_int(c.len as i64)\n    os::println(\"\")\n    0\n}\n// stdin: hello world\n// stdin:\n// out: hello world\n// out: 0\n// out: 0 3.6 read_file ¶ CODE 복사 pub fn read_file(path: str) Result<String, i32>     // host, windows path 의 파일 전체 를 읽어 Ok(내용) 으로 돌려준다. 실패하면 Err(OS 오류 코드) 다(없는 파일, 권한 없음, 디렉터리 등). 내용은 바이트 그대로(인코딩 변환 없음)이며 NUL을 포함할 수 있다. 경로는 str 이며 내부에서 NUL로 끝나는 복사본을 만든다. 경로 안의 NUL은 지원하지 않는다. Windows에서는 ANSI 경로( CreateFileA )다. UTF-16 경로는 쓸 수 없다. 호스트에서 디렉터리를 읽으면 open 은 성공하지만 read 가 실패하므로 Err(21) ( EISDIR )이다. TAM 복사 use tam.os\n\nfn main() i32 {\n    match os::read_file(\"/definitely/missing\") {\n        Ok(s) => os::println(\"?\")\n        Err(e) => {\n            os::print_int(e as i64)   // ENOENT\n            os::println(\"\")\n        }\n    }\n    0\n}\n// out: 2 3.7 write_file ¶ CODE 복사 pub fn write_file(path: str, data: str) Result<i32, i32>     // host, windows path 에 data 를 쓴다. 파일이 없으면 만들고(호스트 권한 0644) 있으면 내용을 지운 뒤 덮어쓴다 . 성공하면 쓴 바이트 수, 실패하면 OS 오류 코드다. 부분 쓰기는 반복해서 끝까지 쓴다(호스트). TAM 복사 use tam.os\n\nfn run() Result<i32, i32> {\n    let n = os::write_file(\"/tmp/tam-doc-demo.txt\", \"line1\\nline2\\n\")?\n    let text = os::read_file(\"/tmp/tam-doc-demo.txt\")?\n    os::println(as_str(&text))\n    Ok(n)\n}\n\nfn main() i32 {\n    match run() {\n        Ok(n) => n\n        Err(e) => 100 + e\n    }\n}\n// exit: 12\n// out: line1\n// out: line2 3.8 time_ms ¶ CODE 복사 pub fn time_ms() u64        // host, windows 단조 증가 하는 시계를 밀리초로 돌려준다. 호스트는 CLOCK_MONOTONIC , Windows는 GetTickCount64 (부팅 후 경과)다. 절대 시각(달력)이 아니므로 경과 시간을 재는 데 쓴다. 해상도는 호스트 1ms 미만, Windows 약 10~16ms다. TAM 복사 use tam.os\n\nfn main() i32 {\n    let t0 = os::time_ms()\n    mut x: u64 = 0\n    for i in 0..1000 { x += 1 }\n    let dt = os::time_ms() - t0\n    if dt < 1000 && x == 1000 { 0 } else { 1 }\n} 4. tam.fmt ¶ TAM,IGNORE 복사 use tam.fmt 순수 TAM으로 쓰인 문자열 도구다. 모든 대상에서 같다. 할당은 String 을 거치므로 소유권 규칙이 적용된다. 4.1 push_str ¶ CODE 복사 pub fn push_str(s: &mut String, t: str) s 의 끝에 t 의 바이트를 이어 붙인다. 용량이 모자라면 늘린다. 4.2 concat ¶ CODE 복사 pub fn concat(a: str, b: str) String a 다음에 b 가 오는 새 String 을 만든다. 인자는 str 이라 소유권이 이동하지 않는다. String 이 있으면 as_str(&s) 를 넘긴다. 4.3 int_to_string ¶ CODE 복사 pub fn int_to_string(n: i64) String n 의 10진 문자열. i64 의 최솟값도 올바르다. 다른 정수형은 as i64 로 넓혀 넘긴다( u64 의 i64 최댓값 초과 값은 부호가 바뀌니 주의). TAM 복사 use tam.os\nuse tam.fmt\n\nfn main() i32 {\n    mut s = fmt::concat(\"x = \", \"\")\n    let n = fmt::int_to_string(-120)\n    fmt::push_str(&mut s, as_str(&n))\n    fmt::push_str(&mut s, \", y = \")\n    let m = fmt::int_to_string(7)\n    fmt::push_str(&mut s, as_str(&m))\n    os::println(as_str(&s))\n    s.len as i32\n}\n// exit: 15\n// out: x = -120, y = 7 5. tam.serial ¶ CODE 복사 pub fn put(b: u8)\npub fn print(s: str)\npub fn println(s: str)\npub fn print_int(n: i64) uefi와 bios 대상 전용 이다(x86 COM1, 포트 0x3F8). put 은 송신 버퍼가 빌 때까지(최대 약 100만 번 확인) 기다린 뒤 한 바이트를 보낸다. BIOS 대상의 tam.os.print 가 이 모듈 위에 만들어져 있다. UEFI에서 화면(콘솔)과 별개로 직렬 로그를 남길 때 쓴다. TAM,IGNORE 복사 use tam.serial\n\nfn main() i32 {\n    serial::println(\"booted\")\n    0\n} 6. 내장 함수 ¶ use 없이 쓰는 예약된 이름이다. 표는 Reference 14장 에 있고, 이 절은 동작을 자세히 정의한다. 6.1 문자열 ¶ string_from(s: str) -> String ¶ s 의 바이트를 힙에 복사한 새 String 을 만든다. 길이 = s.len , 용량 ≥ 길이. string_push(s: &mut String, b: u8) ¶ b 한 바이트를 끝에 붙인다. 용량이 모자라면 2배로 늘린다 ( realloc ). 그래서 n 번 push 의 총 비용은 O(n)이다. as_str(s: &String) -> str ¶ String 의 버퍼를 가리키는 str 을 돌려준다. 복사가 없다. s 를 빌린 것으로 취급 하므로 반환된 str 이 살아 있는 동안 s 를 이동하거나 수정( string_push , 재대입)할 수 없다. 컴파일러가 이를 검사한다. TAM 복사 // exit: 5\nfn main() i32 {\n    mut s = string_from(\"ab\")\n    string_push(&mut s, 99)\n    string_push(&mut s, 100)\n    string_push(&mut s, 101)\n    let v = as_str(&s)            // \"abcde\"\n    if v == \"abcde\" { v.len as i32 } else { 0 }\n} 6.2 실패 ¶ panic(msg: str) -> ! ¶ 호스트에서 stderr에 tam: panic: <msg> 를 쓰고 trap( SIGILL )한다. 반환하지 않으므로 어떤 타입의 자리에도 쓸 수 있다. 자동 해제는 실행되지 않는다. 다른 대상에서는 메시지 없이 trap한다. assert(cond: bool) ¶ cond 가 거짓이면 assertion failed 로 panic한다. 릴리스에서도 제거되지 않는다 (검사를 끄는 옵션이 없다). TAM,TRAP 복사 // panic: tam: panic: out of range\nfn pick(i: i32) i32 {\n    if i < 0 || i > 3 { panic(\"out of range\") }\n    i * 2\n}\nfn main() i32 { pick(9) } 6.3 감싸는 산술 ¶ wrapping_add(a: T, b: T) -> T , wrapping_sub , wrapping_mul ¶ 정수형 T ( i8 … u64 )에서 오버플로를 감싸서 (2의 보수 모듈러) 계산한다. 기본 + - * 는 오버플로에서 trap하므로, 해시나 난수 생성기 같은 의도된 감싸기에 이 함수를 쓴다. 사용자가 같은 이름의 함수를 정의하면 사용자 정의가 우선한다. TAM 복사 // exit: 0\nfn hash(s: str) u32 {\n    mut h: u32 = 2166136261\n    for i in 0..s.len {\n        let b = unsafe { *(s.ptr + i) } as u32\n        h = wrapping_mul(h ^ b, 16777619)   // FNV-1a\n    }\n    h\n}\n\nfn main() i32 {\n    if hash(\"\") != 2166136261 { return 1 }\n    if hash(\"a\") != 3826002220 { return 2 }\n    0\n} 6.4 힙(unsafe) ¶ alloc(n: u64) -> *mut u8 (unsafe) ¶ n 바이트의 힙 블록을 할당한다. 내용은 초기화되지 않는다 . 정렬은 최소 16바이트다. 실패( malloc 이 NULL)는 검사하지 않는다(호스트). BIOS/AArch64의 고정 힙이 바닥나면 trap한다. free(p: *mut u8) (unsafe) ¶ alloc 이 돌려준 블록(또는 String 의 .ptr )을 해제한다. 같은 블록을 두 번 해제하거나 alloc 이 아닌 포인터를 넘기면 정의되지 않은 동작이다. TAM 복사 // exit: 9\nfn main() i32 {\n    let m = unsafe { alloc(8 * 4) }\n    let q = m as *mut i64\n    let r = unsafe {\n        mut i: i64 = 0\n        while i < 4 {\n            *(q + i) = i * 2\n            i += 1\n        }\n        let s = *q + *(q + 1) + *(q + 2) + *(q + 3) + 3  // 0+2+4+6+3\n        free(m)\n        s - 6\n    }\n    r as i32\n} 6.5 하드웨어 접근 (펌웨어 전용, 모두 unsafe) ¶ 다른 대상에서 쓰면 컴파일 오류다( `mmio_write8` is not available when targeting host ). 함수 대상 설명 mmio_read8/16/32/64(addr: u64) -> uN uefi, bios, aarch64 주소에서 volatile 읽기 mmio_write8/16/32/64(addr: u64, v: uN) uefi, bios, aarch64 volatile 쓰기 port_in8(port: u16) -> u8 , port_in32(port: u16) -> u32 uefi, bios x86 I/O 포트 읽기 port_out8(port: u16, v: u8) , port_out32(port: u16, v: u32) uefi, bios x86 I/O 포트 쓰기 halt() uefi, bios, aarch64 CPU를 멈춘다( hlt / wfi ) semihost(op: u64, arg: u64) -> u64 aarch64 ARM semihosting 호출 ccall0..ccall4(f: *const u8, a.. : u64) -> u64 uefi MS x64 ABI로 함수 포인터 호출 efi_system_table() -> *mut u8 , efi_image_handle() -> *mut u8 uefi 진입점이 받은 인자 volatile 접근은 컴파일러가 제거하거나 합치지 않는다. 장치 레지스터는 이것으로만 읽고 쓴다. 7. 메모리와 할당자 ¶ 모든 힙 할당은 런타임 함수 tam_alloc / tam_realloc / tam_free 를 거친다. 호스트는 libc의 malloc / realloc / free , Windows는 HeapAlloc / HeapReAlloc / HeapFree , UEFI는 boot services의 AllocatePool / FreePool 이다. BIOS/AArch64는 고정 영역(각 32MiB) 에서 크기 등급별 free-list + 범프 할당자를 쓴다. 블록 앞 16바이트에 크기를 저장하고, 블록은 합쳐지지 않으며 최대 2배까지 낭비된다. 영역이 바닥나면 trap한다. 해제된 블록은 재사용된다(128MiB를 누적 할당하는 테스트로 확인). 사용자가 할당자를 교체하는 문법은 아직 없다. 사용자 함수 이름이 런타임 심볼( memcpy , memset , memmove , tam_alloc , tam_realloc , tam_free , mainCRTStartup )과 같으면 Windows 빌드에서 충돌한다. 8. 오류 코드 ¶ Result<_, i32> 의 오류 값은 운영체제의 오류 코드 다. 같은 의미라도 숫자가 다를 수 있으니 이식성이 필요하면 의미를 직접 번역한다. 의미 Linux errno Windows GetLastError 파일/경로 없음 2 ( ENOENT ) 2 ( ERROR_FILE_NOT_FOUND ), 3 ( ERROR_PATH_NOT_FOUND ) 접근 거부 13 ( EACCES ) 5 ( ERROR_ACCESS_DENIED ) 디렉터리를 파일처럼 읽음 21 ( EISDIR ) 5 이미 있음 17 ( EEXIST ) 80 ( ERROR_FILE_EXISTS ) 디스크 가득 28 ( ENOSPC ) 112 ( ERROR_DISK_FULL ) 너무 많은 열린 파일 24 ( EMFILE ) 4 ( ERROR_TOO_MANY_OPEN_FILES ) TAM 복사 use tam.os\n\n// 가장 흔한 \"없음\"만 의미로 번역하는 예.\nfn describe(code: i32) i32 {\n    if code == 2 { 1 }        // 없음(Linux와 Windows 모두 2)\n    else if code == 13 || code == 5 { 2 }  // 접근 거부\n    else { 9 }\n}\n\nfn main() i32 {\n    match os::read_file(\"/definitely/missing\") {\n        Ok(s) => 0\n        Err(e) => describe(e)\n    }\n}\n// exit: 1 9. 레시피 ¶ 9.1 한 줄씩 에코 ¶ TAM 복사 use tam.os\n\nfn main() i32 {\n    mut count = 0\n    let first = os::read_line()\n    os::print(\"> \")\n    os::println(as_str(&first))\n    count += 1\n    count\n}\n// stdin: tam\n// out: > tam\n// exit: 1 9.2 파일 복사 ¶ TAM 복사 use tam.os\n\nfn copy(from: str, to: str) Result<i32, i32> {\n    let data = os::read_file(from)?\n    os::write_file(to, as_str(&data))\n}\n\nfn main() i32 {\n    let w = os::write_file(\"/tmp/tam-doc-src.txt\", \"copy me\")\n    match copy(\"/tmp/tam-doc-src.txt\", \"/tmp/tam-doc-dst.txt\") {\n        Ok(n) => n\n        Err(e) => 100 + e\n    }\n}\n// exit: 7 9.3 정수를 글자로 모아 한 번에 출력 ¶ TAM 복사 use tam.os\nuse tam.fmt\n\nfn main() i32 {\n    mut line = string_from(\"\")\n    for i in 1..=5 {\n        let t = fmt::int_to_string(i as i64 * i as i64)\n        fmt::push_str(&mut line, as_str(&t))\n        if i < 5 { fmt::push_str(&mut line, \",\") }\n    }\n    os::println(as_str(&line))\n    0\n}\n// out: 1,4,9,16,25 9.4 경과 시간 재기 ¶ TAM 복사 use tam.os\n\nfn work() u64 {\n    mut acc: u64 = 0\n    for i in 0..100000 { acc = acc + i as u64 }\n    acc\n}\n\nfn main() i32 {\n    let t0 = os::time_ms()\n    let r = work()\n    let elapsed = os::time_ms() - t0\n    if r == 4999950000 && elapsed < 5000 { 0 } else { 1 }\n} 10. 표준 라이브러리 없이 쓰기와 한계 ¶ tam.os 없이도 프로그램은 컴파일된다( main 의 반환값이 종료 코드). 호스트에서 extern \"c\" 로 직접 libc를 부를 수도 있다( Reference 2.5절 ). 없는 것 : 명령줄 인자, 환경 변수, 디렉터리 조작, 프로세스 생성, 네트워크, 스레드, 시각(달력), 난수, 부동소수 서식( f64 출력), Vec /해시맵 같은 컬렉션, 문자열 검색/분리/변환(숫자 파싱 포함), UTF-8 검증. 필요하면 extern 과 unsafe 로 직접 만들 수 있다. 호스트 tam.os 는 Linux(glibc) 기준이다( __errno_location , open 플래그 값). macOS 등에서는 아직 검증하지 않았다. 펌웨어판 tam.os 는 print / println / print_int / exit 뿐이다(입력, 파일, 시간 없음). UEFI 콘솔은 ASCII만 지원한다. os::exit 와 trap/패닉은 자동 해제를 실행하지 않는다.", "source": "docs/stdlib.md"}, {"key": "ref-tmake", "path": "docs/tmake.md", "nav": "Tmake.toml 레퍼런스", "title": "Tmake.toml Documentation ¶", "html": "<h1 class=\"doc-heading\" data-slug=\"tmaketoml-documentation\" id=\"ref-tmake--tmaketoml-documentation\">Tmake.toml Documentation<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--tmaketoml-documentation\">¶</a></h1>\n<p><code>Tmake.toml</code>은 TAM 프로젝트의 <strong>매니페스트</strong>다. 패키지의 메타데이터, 의존성, 컴파일 대상과 빌드 설정, 최적화 프로파일, 워크스페이스를 한곳에서 선언하고, <code>tamc</code>가 그것으로 <strong>재현 가능하고 안정적인 빌드</strong>를 만든다.</p>\n<ul>\n<li>문법은 <strong>표준 TOML(v1.0)</strong> 그대로다. 독자 문법은 없다.</li>\n<li>대상 버전: <code>tamc 1.0</code></li>\n<li>이 문서의 <code>toml,manifest</code> 블록과 <code>project</code> 묶음은 개발 중 검증 도구가 실제 <code>tamc</code>로 검증한다.</li>\n</ul>\n<h2 class=\"doc-heading\" data-slug=\"목차\" id=\"ref-tmake--목차\">목차<a aria-label=\"이 제목 링크\" class=\"heading-anchor\" href=\"#doc-ref-tmake--목차\">¶</a></h2>\n<ol>\n<li><a href=\"#doc-ref-tmake--1-개요\">개요</a></li>\n<li><a href=\"#doc-ref-tmake--2-빠른-시작\">빠른 시작</a></li>\n<li><a href=\"#doc-ref-tmake--3-매니페스트-스키마\">매니페스트 스키마</a></li>\n<li><a href=\"#doc-ref-tmake--4-버전과-버전-요구사항\">버전과 버전 요구사항</a></li>\n<li><a href=\"#doc-ref-tmake--5-의존성\">의존성</a></li>\n<li><a href=\"#doc-ref-tmake--6-워크스페이스\">워크스페이스</a></li>\n<li><a href=\"#doc-ref-tmake--7-대상과-크로스-빌드\">대상과 크로스 빌드</a></li>\n<li><a href=\"#doc-ref-tmake--8-프로파일\">프로파일</a></li>\n<li><a hre
